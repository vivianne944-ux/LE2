k of premature birth, but it does not significantly affect surfactant production.","own",""],["The hyperinsulinism in the fetus of a diabetic mother suppresses pulmonary surfactant.","own",""],["Oligohydramnios leads to constriction in utero that culminates in pulmonary hypoplasia, not decreased surfactant.","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"2028 Pathology trans #1: Diseases of Infancy & Childhood","f":[100]},"28b:87":{"id":"28b:87","ex":"2028 LE3","y":2028,"n":87,"p":2,"s":"A 22-year-old woman with an inborn error of metabolism is planning for her first pregnancy. She is advised to follow a phenylalanine-free diet before conception and throughout her pregnancy. This intervention is MOST likely to aid in preventing which complication in her infant?","c":[["A","Cataracts"],["B","Mental retardation"],["C","Anemia"],["D","Muscular weakness"]],"k":"B","ks":["B"],"r":[["Cataracts develop in cases of galactosemia, and not in PKU.","own",""],["Mental retardation results from the teratogenic effects of phenylalanine that cross the placenta and affect the CNS during development.","own",""],["Anemia is not a direct effect of high levels of phenylalanine.","own",""],["Muscular weakness is not a direct effect of high levels of phenylalanine.","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"LE3 Feedback","f":[95]},"28b:88":{"id":"28b:88","ex":"2028 LE3","y":2028,"n":88,"p":2,"s":"A 21-year-old primigravida at 18 weeks has no fetal movement. Ultrasound shows severe oligohydramnios and cystic fetal kidneys. After termination, autopsy reveals multiple congenital anomalies and a lung appropriate for a 14-week gestation. Which type of morphogenetic error best explains the lung findings?","c":[["A","Agenesis"],["B","Aplasia"],["C","Deformation"],["D","Disruption"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["The lungs are hypoplastic (small) because of deformation caused by the oligohydramnios, which was initiated in this case by the multicystic renal dysplasia (kidneys formed little urine, thus leading to oligohydromanios). There was no disruption (secondary destruction of an organ that was previously normal in devt) in this case. There was no agenesis (complete absence of an organ) or aplasia (absence of an organ due to failure of growth of existing primordium) of the lungs as it is present (though small) in this case.","own",""],["Disruption results from secondary destruction of an organ or body region that was previously normal in development","bor","2027 LE3 Q40"]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"The lungs are hypoplastic (small) because of deformation caused by the oligohydramnios, which was initiated in this case by the multicystic renal dysplasia (kidneys formed little urine, thus leading to oligohydromanios). There was no disruption (secondary destruction of an organ that was previously normal in devt) in this case. There was no agenesis (complete absence of an organ) or aplasia (absence of an organ due to failure of growth of existing primordium) of the lungs as it is present (though small) in this case.","ref":"LE 3 Feedback","f":[104]},"28b:89":{"id":"28b:89","ex":"2028 LE3","y":2028,"n":89,"p":2,"s":"At 36 weeks age of gestation, a 28-year-old mother delivers an infant with flattened facies, clubfeet and hip dislocation. She reports very little fetal movement during her pregnancy. Which condition best explains these findings?","c":[["A","Maternal diabetes mellitus"],["B","Trisomy 13"],["C","Bilateral renal agenesis"],["D","Hyaline membrane disease"]],"k":"C","ks":["C"],"r":[["Maternal DM is a risk factor for Neonatal Respiratory Distress Syndrome","bor","2027 LE3 Q29"],["Trisomy 13 presents with cleft lip, cleft palate, and sever cardiac malformations","bor","2027 LE3 Q29"],["A case of Potter sequence (oligohydramnios, dec amniotic fluid) This can be caused by bilateral renal agenesis (fetal urine major component of amniotic fluid), leak of amniotic fluid due to rupture of amnion, uteroplacental insufficiency (from maternal HPN, severe toxemia)","own",""],["Hyaline Membrane Disease would have presented symptoms such as difficulty breathing and cyanosis within 30 minutes after birth. Conditions during pregnancy that may cause hyaline membrane disease are mothers with diabetes, premature birth, or excessive sedation of the mother.","bor","2027 LE3 Q27"]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"A case of Potter sequence (oligohydramnios, dec amniotic fluid) This can be caused by bilateral renal agenesis (fetal urine major component of amniotic fluid), leak of amniotic fluid due to rupture of amnion, uteroplacental insufficiency (from maternal HPN, severe toxemia)","ref":"LE 3 Feedback","f":[104]},"28b:90":{"id":"28b:90","ex":"2028 LE3","y":2028,"n":90,"p":2,"s":"A 19 y/o mother found her 3-month-old baby boy dead in his crib while in a prone position. He was previously healthy and showed no signs of distress when she put him in his crib 1 hour earlier. Based on the medical history, the baby was born at term following an uncomplicated pregnancy. He had been feeding well and gaining weight normally. Which of the following is most likely to be found at autopsy?","c":[["A","Hyaline Membrane Disease"],["B","Cerebral Cytomegalovirus"],["C","Adrenal Neuroblastoma"],["D","No Abnormalities"]],"k":"D","ks":["D"],"r":[["Hyaline Membrane Disease would have presented symptoms such as difficulty breathing and cyanosis within 30 minutes after birth. Conditions during pregnancy that may cause hyaline membrane disease are mothers with diabetes, premature birth, or excessive sedation of the mother.","bor","2027 LE3 Q27"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Adrenal Neuroblastoma is an extracranial solid tumor of childhood that would have presented symptoms such as large abdominal mass, fever, and weight loss, as well as manifest multiple cutaneous metastases seen as deep blue discoloration in neonates.","bor","2027 LE3 Q27"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"ref":"[2028] Diseases of Infancy & Childhood","f":[97]},"28b:91":{"id":"28b:91","ex":"2028 LE3","y":2028,"n":91,"p":2,"s":"A 24 year old woman is 38th week pregnant, reported no fetal movement for 1 day. The next day, the still born baby was delivered vaginally. On PE, there are no external anomalies. A placental examination shows chorioamnionitis. Which among the etiologic agents is most likely responsible for this event?","c":[["A","Cytomegalovirus"],["B","Treponema pallidum"],["C","Group B Streptococcus"],["D","Herpes Simplex Virus"]],"k":"C","ks":["C"],"r":[["CMV causes fetal abnormalities such as Chromosomal abnormalities (Trisomies), congenital anomalies (not present in PE of the patient), congenital infections (TORCH).","own",""],["Syphilis caused by T. pallidum can lead to stillbirth through transplacental (hematologic) infection but typically presents with placentitis, not chorioamnionitis.","own",""],["In the first 7 days of life (early onset), perinatal sepsis is a common cause of Group B Streptococcus that leads to intrauterine infection mainly with chorioamnionitis (inflammation of placental membrane). Perinatal sepsis. Early onset (within 1st 7 days of life)- MOST common Group B strep Late onset (7days to 3 months)- Listeria, Candida Perinatal infections routes: transcervical, transplacental","own",""],["HSV can cause stillbirth or neonatal infection but is usually associated with skin lesions and does not typically cause chorioamnionitis.","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"[PTH LEC - LE 3] 01 - Diseases of Infancy & Childhood (V1)","f":[103]},"28b:92":{"id":"28b:92","ex":"2028 LE3","y":2028,"n":92,"p":3,"s":"A term male infant is born after an uncomplicated pregnancy. Birth weight is 2200 grams, and all body measurements including head and chest circumferences are proportionately decreased. No congenital anomalies are noted. Apgar scores are 8 at 1 minute and 9 at 5 minutes. Which maternal risk factor MOST likely explains these findings?","c":[["A","Placenta Previa"],["B","Single umbilical artery"],["C","Toxoplasmosis"],["D","Placental hemangioma"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Placental abnormality causes disproportionate FGR: Asymmetric growth retardation of fetus (relative sparing of the brain) This explains why the infant has a head circumference that is within the normal range but other body measurements are decreased.","bor","2027 LE3 Q30"],["SGA infant (<2500 gm) with proportionate fetal growth restriction (FGR) are usually caused by fetal abnormalities like TORCH group of infections (Toxoplasmosis, rubella, cytomegalovirus, herpesvirus), triploidy and trisomy. The other choices are placental abnormalities that lead to disproportionate FGR.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"SGA infant (<2500 gm) with proportionate fetal growth restriction (FGR) are usually caused by fetal abnormalities like TORCH group of infections (Toxoplasmosis, rubella, cytomegalovirus, herpesvirus), triploidy and trisomy. The other choices are placental abnormalities that lead to disproportionate FGR.","ref":"LE3 Feedback","f":[98]},"28b:93":{"id":"28b:93","ex":"2028 LE3","y":2028,"n":93,"p":3,"s":"A female infant is born at 33 weeks age of gestation with height and weight falling within the 50th percentile. She receives prophylactic exogenous surfactant and has no respiratory distress. By day 3, she develops abdominal distention, absent bowel sounds, bloody stools and hypotension. Abdominal x-ray shows pneumatosis intestinalis. Which condition requiring bowel resection is MOST likely present in this infant?","c":[["A","Duodenal atresia"],["B","Pyloric stenosis"],["C","Necrotizing enterocolitis"],["D","Meconium ileus"]],"k":"C","ks":["C"],"r":[["Duodenal atresia: A congenital condition in which a portion of the duodenum is absent or closed off, leading to a blockage that prevents food from passing from the stomach into the intestines.","bor","2027 LE3 Q31"],["Pyloric stenosis: A condition in infants where the pylorus thickens and enlarges, blocking the passage.","bor","2027 LE3 Q31"],["This condition is most likely necrotizing enterocolitis (NEC) because it occurs most commonly in premature infants, and the risk increases with lower gestational age. The infant’s abdominal distention, bloody stools, and hypotension reflect intestinal necrosis. The pneumatosis intestinalis on x-ray, caused by submucosal gas bubbles, is a key morphologic feature of NEC and likely explains why bowel resection may be needed.","own",""],["Meconium ileus Blockage in the intestines caused by thick, sticky meconium (baby’s first stool)","bor","2027 LE3 Q31"]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"This condition is most likely necrotizing enterocolitis (NEC) because it occurs most commonly in premature infants, and the risk increases with lower gestational age. The infant’s abdominal distention, bloody stools, and hypotension reflect intestinal necrosis. The pneumatosis intestinalis on x-ray, caused by submucosal gas bubbles, is a key morphologic feature of NEC and likely explains why bowel resection may be needed.","f":[99]},"28b:94":{"id":"28b:94","ex":"2028 LE3","y":2028,"n":94,"p":3,"s":"A neonate was born at 35 weeks gestation with a birth weight and height measured at 30th percentile. No congenital anomalies are noted. Which factor most likely increases the risk of neonatal respiratory distress syndrome in the neonate?","c":[["A","Antenatal glucocorticoid therapy of the mother"],["B","Delivery by cesarean section"],["C","Paternal diabetes mellitus"],["D","Oligohydramnios"]],"k":"B","ks":["B"],"r":[["Antenatal glucocorticoid therapy of the mother reduces the risk of respiratory distress syndrome in neonates","bor","2027 LE3 Q32"],["The neonate is premature but AGA: 10-90%tile. Risk factors for NRDS: male, maternal diabetes, delivery by CS.","own",""],["Maternal diabetes is the one that increases the risk of neonatal respiratory distress syndrome bcecause high insulin in infants suppresses surfactant synthesis, as insulin counteracts the effects of steroids.","bor","2027 LE3 Q32"],["Oligohydramnios also increases the risk of neonatal respiratory distress syndrome in neonates as it can cause complications in pregnancy.","bor","2027 LE3 Q32"]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"The neonate is premature but AGA: 10-90%tile. Risk factors for NRDS: male, maternal diabetes, delivery by CS.","ref":"[PTH LEC - LE 3] 01 - Diseases of Infancy & Childhood (V1)","f":[100]},"28b:95":{"id":"28b:95","ex":"2028 LE3","y":2028,"n":95,"p":3,"s":"Which statement best characterizes malignant tumors in children compared with those in adults?","c":[["A","Have tendency to regress or differentiate spontaneously"],["B","Have decreased survival or cure rates in most tumors"],["C","Commonly arise in skin, lung, breast, prostate and colon"],["D","Appear less primitive and more differentiated histologically"]],"k":"A","ks":["A"],"r":[["2026 trans: Diseases of Infancy & Childhood Malignant tumors (childhood) ● Tendency to regress or differentiate of pregnancy 5. Accidents (unintentional injuries) 6. Newborn affected by complications of placenta, cord, and membranes 7. Bacterial sepsis of newborn 8. Respiratory distress of newborn 9. Diseases of the circulatory system 10.Neonatal hemorrhage","f":[94]},"26:49":{"id":"26:49","ex":"2026 LE2","y":2026,"n":49,"p":11,"s":"An infant born at 37 weeks AOG develops vomiting and diarrhea a few days after birth. There was jaundice at the end of the first week, and cataract formation upon reaching the first month. At 1 year of age, the developmental milestones are not being met. At age 2, the child dies of Escherichia coli septicemia. A deficiency of which of the following substances was most likely present in the child?","c":[["A","Phenylalanine hydroxylase"],["B","Globin chains"],["C","Hexosaminidase"],["D","Galactose-1-phosphate uridyltransferase"]],"k":"D","ks":["D"],"r":[["2026 Pathology 2.10 - Diseases of Infancy & Childhood page 13/21 Clinical Manifestations of Phenylketonuria ● Normal at birth within a few weeks, rising phenylalanine impairs brain devt. 6 months, severe mental retardation ● Seizures ● Eczema, ↓ pigmentation of hair & skin (↓ tyrosine, precursor for melanin) ● Strong musty or mousy odor (sweat & urine) ● Some mutations does not have associated neurological damages","own",""],["2026 Pathology 2.13 - Diseases of RBC & Bleeding Disorders I page 12/16 Thalassemia ● Genetically heterogeneous disorder caused by germline mutations that decrease the synthesis of ɑ-globin or β-globin, leading to anemia tissue hypoxia, and red cell hemolysis related to imbalance in global chain synthesis ● Disease resulting to defective globin synthesis ○ Defective or absent globin chain ● Clinical manifestations vary widely due to heterogeneity of mutations","own",""],["Hexosaminidase Tay-sachs disease is a fatal, inherited, neurodegenerative disorder that is caused by hexosaminidase-A enzyme deficiency.","bor","2027 LE3 Q23"],["2026 Pathology 2.10 - Diseases of Infancy & Childhood page 13/21 Clinical Manifestations of Galactosemia: ● Fail to thrive almost from birth ● Vomiting & diarrhea w/in a few days of milk ingestion ● Jaundice & hepatomegaly: 1st few weeks ○ Due to fatty change ● Opacification of the lens develops: within a few weeks ○ Lens absorbs water and swells as galactitol, produced by alternative pathways, accumulates and increases osmotic pressure ● → Mental retardation (MR) in 6-12 months (not as severe as PKU)","own",""]],"t":"UNC","sub":"Infancy and childhood","f":[95]},"26:50":{"id":"26:50","ex":"2026 LE2","y":2026,"n":50,"p":12,"s":"A 3 y/o boy presents with large abdominal mass, fever, weight loss, and bone pain. The mass was located at the right adrenal gland, appearing discrete and localized. Complete gross excision was performed. Histology shows small round blue cells concentrically arranged about a central space filled with neutrophil. The most probable diagnosis is:","c":[["A","Hemangioma"],["B","Neuroblastoma"],["C","Wilm’s Tumor"],["D","Teratoma"]],"k":"B","ks":["B"],"r":[["Robbins & Cotran Atlas of Pathology 3rd Edition page 424 Figure 16-45 Hemangioma, microscopic: A reddish \"mole\" that is small, round, and raised may represent a hemangioma, here composed of vascular spaces in the upper dermis. These small vascular channels, which may vary in size and shape, are lined by flattened endothelial cells. In a capillary hemangioma, the vascular spaces are small or collapsed, as shown here, and the intervening loose connective tissue stroma may contain larger arterioles or venules. In contrast, a cavernous hemangioma has large, dilated vascular spaces that may extend into the underlying adipose tissue.","own",""],["Robbins & Cotran Atlas of Pathology 3rd Edition page 407 Figure 15-56 Adrenal neuroblastoma, microscopic: This is one of the “small round blue cell” tumors most typically seen in children. Note the population of round blue cells resembling embryonic neuroblasts.","own",""],["Robbins & Cotran Atlas of Pathology 3rd Edition page 296 Figure 10-106 Wilms tumor, microscopic Wilms tumor microscopically resembles the primitive nephrogenic zone of the developing fetal kidney, with primitive glomeruloid structures ( ) and a cellular stroma.","own",""],["Robbins & Cotran Atlas of Pathology 3rd Edition page 356 Figure 13-97 Mature cystic teratoma, microscopic: Histologically, teratomas contain tissues with differentiation that resembles all three embryonic germ layers (mesoderm, endoderm, and ecto - derm). In most benign teratomas, the ectodermal elements predominate.","own",""]],"t":"UNC","sub":"Infancy and childhood","f":[96]},"26:51":{"id":"26:51","ex":"2026 LE2","y":2026,"n":51,"p":13,"s":"A 19 y/o mother found her 3-month-old baby boy dead in his crib while in prone position. He was previously healthy and showed no signs of distress when she put him in his crib 1 hour earlier. Based on the medical history, the baby was born at term following an uncomplicated pregnancy. He had been feeding well and gaining weight normally. Which of the following is most likely to be found at autopsy ?","c":[["A","Hyaline Membrane disease"],["B","Cerebral Cytomegalovirus"],["C","Adrenal neuroblastoma"],["D","No abnormalities"]],"k":"D","ks":["D"],"r":[["Hyaline Membrane Disease would have presented symptoms such as difficulty breathing and cyanosis within 30 minutes after birth. Conditions during pregnancy that may cause hyaline membrane disease are mothers with diabetes, premature birth, or excessive sedation of the mother.","bor","2027 LE3 Q27"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Adrenal Neuroblastoma is an extracranial solid tumor of childhood that would have presented symptoms such as large abdominal mass, fever, and weight loss, as well as manifest multiple cutaneous metastases seen as deep blue discoloration in neonates.","bor","2027 LE3 Q27"],["SUDDEN INFANT DEATH SYNDROME - sudden death of an infant under 1 year of age - Diagnosis of exclusion - Declare as SIDS only if there is no cause identified based on autopsy, examination of death scene, and clinical history","own",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"SUDDEN INFANT DEATH SYNDROME - sudden death of an infant under 1 year of age - Diagnosis of exclusion - Declare as SIDS only if there is no cause identified based on autopsy, examination of death scene, and clinical history","f":[97]},"26:52":{"id":"26:52","ex":"2026 LE2","y":2026,"n":52,"p":13,"s":"A term male infant was born following an uncomplicated pregnancy. He weighs 2200 grams and on examination had no congenital abnormalities. Apgar scores are 8 at 1 minute and 9 at 5 minutes. The head circumference is within normal range but other body measurements are decreased. Which of the following risk factors or conditions during pregnancy most likely led to this infant’s findings?","c":[["A","Triploidy"],["B","Toxoplasmosis"],["C","Single umbilical artery"],["D","Cytomegalovirus infection"]],"k":"C","ks":["C"],"r":[["Triploidy A chromosomal abnormality causing proportionate fetal growth restriction (FGR)","bor","2027 LE3 Q30"],["TORCH: Toxoplasmosis, Other (such as syphilis, varicella, mumps, parvovirus, and HIV), Rubella, Cytomegalovirus, Herpes simplex These diseases cause proportionate FGR: symmetric growth restriction and all organ systems are similarly affected","bor","2027 LE3 Q30"],["PREMATURE AND FETAL GROWTH RESTRICTION (FGR) Includes: → Small for gestational age (SGA) infants ◼ Include term infants but with weight < 2500g ◼ Under grown rather than immature ◼ Suffer from FGR Causes: → Fetal abnormalities →Maternal Abnormalities → Placental abnormalities ◼ Ex.Umbilical-placental vascular anomalies (single umbilical artery, abnormal cord insertion, placenta hemangioma), placental abruption, etc.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"PREMATURE AND FETAL GROWTH RESTRICTION (FGR) Includes: → Small for gestational age (SGA) infants ◼ Include term infants but with weight < 2500g ◼ Under grown rather than immature ◼ Suffer from FGR Causes: → Fetal abnormalities →Maternal Abnormalities → Placental abnormalities ◼ Ex.Umbilical-placental vascular anomalies (single umbilical artery, abnormal cord insertion, placenta hemangioma), placental abruption, etc.","f":[98]},"26:53":{"id":"26:53","ex":"2026 LE2","y":2026,"n":53,"p":13,"s":"A female infant is born at 33 weeks age of gestation and her height and weight falls within the 50th percentile. She received prophylactic exogenous surfactant and does not develop respiratory distress. On the third day of life, the infant presents with abdominal distention, absent bowel sounds, bloody stools and hypotension. Abdominal radiograph shows gas within the intestinal wall (pneumatosis intestinalis). Which of the following conditions that require resection of the bowel is most likely to be present in this infant?","c":[["A","Meconium ileus"],["B","Pyloric stenosis"],["C","Duodenal atresia"],["D","Necrotizing enterocolitis"]],"k":"D","ks":["D"],"r":[["Meconium ileus Blockage in the intestines caused by thick, sticky meconium (baby’s first stool)","bor","2027 LE3 Q31"],["Pyloric stenosis: A condition in infants where the pylorus thickens and enlarges, blocking the passage.","bor","2027 LE3 Q31"],["Duodenal atresia: A congenital condition in which a portion of the duodenum is absent or closed off, leading to a blockage that prevents food from passing from the stomach into the intestines.","bor","2027 LE3 Q31"],["NECROTIZING ENTEROCOLITIS (NEC) - most common in premature infants - Gross appearance: → Involved segment is distended, friable, and congested (with hemorrhagic infarction) or gangrenous → Submucosal gas bubbles (pneumatosis intestinalis)","ow 82,"p":20,"s":"A grade 2 student complains of frequent dizziness and difficulty of breathing during play. Work-up shows low hemoglobin and peripheral blood smear demonstrates basophilic stippling in red cells with several target cells. Red cell indices are as follows: MCHC: 29 gm/dl MCV: 78 fl Further work-up of this patient would most likely reveal which of the following abnormalities?","c":[["A","Sickle cells on smear"],["B","Abnormal red cell cytoskeleton"],["C","Abnormal Hb synthesis"],["D","Mineral deficiency"]],"k":"C","ks":["C"],"r":[["Sickle Cell Disease - normocytic and normochromic","own",""],["Hereditary Spherocytosis - microcytic and hyperchromic","own",""],["Patient’s red cell indices present a microcytic and hypochromic anemia. PBS also demonstrates basophilic stippling and target cells. These are all indicative of Thalassemia, a disease resulting from a defective globin synthesis.","own",""],["Iron Deficiency Anemia - microcytic and hypochromic","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[85]},"26:84":{"id":"26:84","ex":"2026 LE2","y":2026,"n":84,"p":21,"s":"A blood sample shows rupture of red cells in higher saline concentrations while doing the osmotic fragility test. The abnormality in the red cell of this patient is due to:","c":[["A","Abnormal membrane protein"],["B","Vitamin deficiency"],["C","Abnormal hemoglobin"],["D","Enzyme deficiency"]],"k":"A","ks":["A"],"r":[["Hemolysis at higher concentrations occurs in hereditary spherocytosis caused by an abnormality of contractile membrane proteins.","own",""],["Associated with megaloblastic anemia","own",""],["Hemolysis at lower concentrations occurs in sickle cell anemia caused by the formation of sickle cells due to the production of HbS instead of HbA.","own",""],["Associated with G6PD deficiency","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[77]},"26:86":{"id":"26:86","ex":"2026 LE2","y":2026,"n":86,"p":21,"s":"A 15 y/o student was admitted for the first time due to a pulmonary infection. Patient has no history of allergy and was given antibiotics. Two days later, patient developed anemia and tea colored urine. Methemoglobin was elevated and haptoglobin was decreased. What is the cause of anemia?","c":[["A","G6 PD"],["B","Sickle cells"],["C","DIC"],["D","Spherocytosis"]],"k":"A","ks":["A"],"r":[["Causes hemolytic anemia after intake of certain drugs, resulting in intravascular hemolysis characterized by tea colored urine, methemoglobinemia, and low serum haptoglobin","own",""],["Causes extravascular hemolysis","own",""],["Causes microangiopathic hemolytic anemia and intravascular hemolysis when obstruction in small blood vessels cause direct trauma to RBCs","own",""],["Causes extravascular hemolysis","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[86]},"26:87":{"id":"26:87","ex":"2026 LE2","y":2026,"n":87,"p":21,"s":"A 6/yo child was brought for consultation because of pallor. No jaundice, no splenomegaly. Growth and mental development is consistent with age. CBC Results: Hb 8.6 g/L WBC Count 8,000 MCV 70 fl MCHC 27 g/dL Reticulocyte count 0.5% What is the most likely diagnosis?","c":[["A","Iron deficiency anemia"],["B","G 6 PD"],["C","Thalassemia"],["D","Folic acid deficiency"]],"k":"A","ks":["A"],"r":[["Normal MCV: 80-94 fL MCHC: 32-36 g/dL MCV and MCHC are low = microcytic, hypochromic anemia.","own",""],["G6PD results in normocytic, normochromic anemia.","own",""],["Thalassemia results in microcytic, hypochromic anemia but presents with splenomegaly which is not present in the patient.","own",""],["Folic acid deficiency results in macrocytic, normochromic anemia.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[79]},"26:88":{"id":"26:88","ex":"2026 LE2","y":2026,"n":88,"p":22,"s":"A patient is being worked up due to complaints of easy fatigability. Patient claims to drink 5-6 bottles of beer daily or hard drinks if with friends. Work-up shows low hemoglobin and hematocrit, with marked elevation of MCV and MCHC. Peripheral smear shows hypersegmented neutrophils. No neurologic deficits are present. Which of the following parameters will be elevated?","c":[["A","Homocysteine"],["B","Methylmalonic acid"],["C","Serum Iron"],["D","Bilirubin"]],"k":"A","ks":["A"],"r":[["Elevated MCV and MCHC with hypersegmented neutrophils = MEGALOBLASTIC ANEMIA which is associated with B12 or B9 (folate) deficiency. B12 or Folate deficiency will lead to increased levels of homocysteine which increases the risk for CV problems and stroke.","own",""],["Methylmalonic acid is only elevated in B12 deficiency but since the question did not specifically mention which among the two vitamins (B12 and folate) is deficient in the patient, homocysteine is the more appropriate answer.","own",""],["Not elevated in megaloblastic anemia","own",""],["Not elevated in megaloblastic anemia","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[81]},"26:89":{"id":"26:89","ex":"2026 LE2","y":2026,"n":89,"p":22,"s":"A 48 y/o painter complaints of frequent cough, increasing fatigue, and shortness of breath for a week. CBC shows the following abnormality: Hb 7.8 g/dL Hct 22% WBC count 2,200 cells m MCV 84 MCHC 32.5 Platelet count 80,000 Reticulocyte count: 0.2% The bone marrow biopsy of this patient will show:","c":[["A","fatty replacement of the marrow"],["B","proliferating lymphoid cells"],["C","Proliferating plasma cells"],["D","Increased number of normoblasts"]],"k":"A","ks":["A"],"r":[["Patient is a painter, which means he is exposed to benzene compounds which is a cause of aplastic anemia. Low Hct, Hb, reticulocyte and WBC count is indicative of pancytopenia which is seen in aplastic anemia. In a hypocellular marrow, the typical histologic finding would be fatty replacement of the marrow, as normal hematopoietic cells are replaced by fat cells.","own",""],["Proliferating lymphoid cells in the bone marrow will increase WBC count in the CBC","bor","2027 LE2 Q79"],["associated with multiple myeloma","own",""],["associated with megaloblastic anemia and/or hemolytic anemia","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[83]},"26:90":{"id":"26:90","ex":"2026 LE2","y":2026,"n":90,"p":22,"s":"Which laboratory finding will NOT be consistent with a diagnosis of iron deficiency anemia","c":[["A","Decreased ferritin"],["B","Decreased prussian blue staining in the bone marrow"],["C","Increased reticulocytes with treatment"],["D","Decreased Iron Binding Capacity"]],"k":"D","ks":["D"],"r":[["Consistent due to decreased stored iron","own",""],["Consistent because Prussian Blue is used to detect Iron in biopsy specimens. Low iron causes decreased staining [Image Bank - Hematology]","own",""],["Consistent because with a Functional bone marrow Reticulocytes are elevated in anemia","own",""],["Increased total iron binding capacity (TIBC) → due to vacant slots in transport protein transferrin","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[80]},"26:92":{"id":"26:92","ex":"2026 LE2","y":2026,"n":92,"p":23,"s":"A patient who has anemia associated with tea-colored urine or hemoglobinuria is indicative of:","c":[["A","Splenic sequestration"],["B","Extravascular hemolysis"],["C","Infection"],["D","Intravascular hemolysis"]],"k":"D","ks":["D"],"r":[["Also a type of Extravascular Hemolysis","own",""],["Reticuloendothelial system destroys RBC, but there is no elevation of free Hemoglobin or any product of its degradation","own",""],["Can also be a cause for Intravascular Hemolysis, but is also vague","own",""],["Hb released from blood → Hb attaches to haptoglobin (saturable) → Excess Hb stay free in the blood and can be excreted in the urine (Hemoglobinuria)","own",""]],"t":"UNC","sub":"RBC/WBC disorders","f":[86]},"26:95":{"id":"26:95","ex":"2026 LE2","y":2026,"n":95,"p":24,"s":"Which PBS abnormality is an expected finding in megaloblastic anemia?","c":[["A","Dohle bodies"],["B","Smudge cells"],["C","Hypersegmented neutrophils"],["D","Heinz bodies"]],"k":"C","ks":["C"],"r":[["Dohle bodies: Nonspecific finding typi g this infection is:","c":[["A","Influenza virus"],["B","Measles virus"],["C","Respiratory syncytial virus"],["D","Varicella-zoster virus"]],"k":"B","ks":["B"],"r":[["Characterized by the abrupt onset of constitutional and upper respiratory tract signs and symptoms (e.g., fever, chills, myalgia, headache, malaise, nonproductive cough, sore throat, and rhinitis","own",""],["characterized by a prodrome of fever (as high as 105°F) and malaise, cough, coryza, and conjunctivitis -the three “C”s . Koplik spots on the buccal mucosa followed by a maculopapular rash which usually begins as flat red spots that appear on the face at the hairline and spread downward to the neck, trunk, arms, legs, and feet.","own",""],["Is a common respiratory virus that usually causes mild, cold-like symptoms. Most people recover in a week or two,","own",""],["VZV is a human alphaherpesvirus that causes varicella (chickenpox) as the primary infection and establishes latency in sensory ganglia. The rash is generalized and pruritic. It progresses rapidly from macular to papular to vesicular lesions before crusting. Lesions are typically present in all stages of development at the same time. The rash usually appears first on the chest, back, and face, then spreads over the entire body.","own",""]],"t":"ID2","sub":"","f":[37]},"25:78":{"id":"25:78","ex":"2025 LE2","y":2025,"n":78,"p":11,"s":"A 40 y/o female commercial sex worker sough consult due to a painful, suppurative ulcer on the mons pubis of 7 days duration. The lesion started as a tender papule which became ulcerated. PE showed an ulcer on the mons pubis with soft, ragged margins. The ulcer base is covered by a malodorous, yellow-gray exudate. Gram stain of the ulcer exudate showed coccobacilli. The most probable diagnosis of this patient is:","c":[["A","Syphilis"],["B","Chancroid"],["C","Granuloma inguinale"],["D","Lymphogranuloma inguinale"]],"k":"B","ks":["B"],"r":[["Syphilis (Treponema pallidum) begins with a single painless hard chancre and regional adenopathy. A painful suppurative ulcer argues against it.","gen",""],["Typically consists of a single painless chancre at the site of inoculation, accompanied by regional adenopathy. Chancroid is caused by the bacterium Haemophilus ducreyi and results in extremely painful suppurative ulcers that may be single or multiple. The infection begins as a papule, which quickly progresses to a pustule and subsequent ulcer formation, often with regional lymphadenopathy. Granuloma inguinale (donovanosis) is a genital ulcerative disease caused by the intracellular gram-negative bacterium Klebsiella granulomatis. After an incubation period of about 1 to 12 weeks, a painless, red skin nodule slowly enlarges, becoming a raised, beefy red, moist, smooth, foul-smelling lesion. Same as Letter C, just a different name.","own",""],["Granuloma inguinale (donovanosis) is caused by Klebsiella granulomatis. A painless papule becomes a raised, beefy red, foul-smelling ulcer, and Donovan bodies are seen within macrophages.","gen",""],["Granuloma inguinale (donovanosis) is caused by Klebsiella granulomatis. A painless papule becomes a raised, beefy red, foul-smelling ulcer, and Donovan bodies are seen within macrophages.","gen",""]],"t":"ID3","sub":"","bm":1,"orig":"Typically consists of a single painless chancre at the site of inoculation, accompanied by regional adenopathy. | Chancroid is caused by the bacterium Haemophilus ducreyi and results in extremely painful suppurative ulcers that may be single or multiple. The infection begins as a papule, which quickly progresses to a pustule and subsequent ulcer formation, often with regional lymphadenopathy. | Granuloma inguinale (donovanosis) is a genital ulcerative disease caused by | the intracellular gram-negative bacterium Klebsiella granulomatis. After an incubation period of about 1 to 12 weeks, a painless, red skin nodule slowly enlarges, becoming a raised, beefy red, moist, smooth, foul-smelling lesion. | Same as Letter C, just a different name.","f":[49]},"25:79":{"id":"25:79","ex":"2025 LE2","y":2025,"n":79,"p":12,"s":"Which of the following histologic patterns of tissue reaction is seen in late Schistosoma haematobium infection of the urinary bladder?","c":[["A","Cytopathic-Cytoproliferative reaction"],["B","Tissue necrosis"],["C","Suppurative inflammation"],["D","Chronic inflammation and scarring"]],"k":"D","ks":["D"],"r":[["These reactions are usually produced by viruses. The lesions are characterized by cell necrosis or cellular proliferation, usually with sparse inflammatory cells.","own",""],["Because few inflammatory cells are present, these lesions resemble infarcts with disruption or loss of basophilic nuclear staining and preservation of cellular outlines. Clostridium perfringens and other organisms that secrete powerful toxins can cause such rapid and severe necrosis (gangrenous necrosis) that tissue damage is the dominant feature.","own",""],["This pattern is the reaction to acute tissue damage, characterized by increased vascular permeability and leukocytic infiltration, predominantly of neutrophils. The neutrophils are attracted to the site of infection by release of chemoattractants from the \"pyogenic\" bacteria that evoke this response, mostly extracellular Gram-positive cocci and Gram-negative rods.","own",""],["The final common pathway of many infections is chronic inflammation, which can lead either to complete healing or to extensive scarring. For example, the \"pipe-stem\" fibrosis of the liver caused by schistosomal eggs. The exuberant scarring response is the major cause of dysfunction.","own",""]],"t":"ID1","sub":"","f":[36]},"25:80":{"id":"25:80","ex":"2025 LE2","y":2025,"n":80,"p":12,"s":"Arthritis of the large joints is seen in which stage of Lyme disease?","c":[["A","Stage 1"],["B","Stage 2"],["C","Stage 3"],["D","All of the stages"]],"k":"C","ks":["C"],"r":[["Stage 1: Erythema migrans (a.k.a. erythema chronicum migrans) at site of the tick bite","bor","2026 LE2 Q25"],["Stage 2: Hematogenous dissemination of spirochetes","bor","2026 LE2 Q25"],["Early localized disease that may present with erythema migrans and low grade fever. This stage usually occurs within 1-28 days following the tick bite. Usually develops 3-12 weeks after the initial infection. Features may include general malaise, fever, neurological features (dizziness, headache), muscle pain and cardiac symptoms (chest pain, palpitations, and dyspnea). Late Lyme disease may occur many months or years after the initial infection. The typical features include neurological and rheumatological involvement particularly the large joints (i.e. knees)","own",""],["Each Lyme stage has its own lesion: erythema migrans in stage 1, dissemination in stage 2, large joint arthritis in stage 3. No lesion in these items spans all stages.","gen",""]],"t":"ID4","sub":"","bm":1,"orig":"Early localized disease that may present with erythema migrans and low grade fever. This stage usually occurs within 1-28 days following the tick bite. | Usually develops 3-12 weeks after the initial infection. Features may include general malaise, fever, neurological features (dizziness, headache), muscle pain and cardiac symptoms (chest pain, palpitations, and dyspnea). | Late Lyme disease may occur many months or years after the initial infection. The typical features include neurological and rheumatological involvement particularly the large joints (i.e. knees)","f":[53]},"25:81":{"id":"25:81","ex":"2025 LE2","y":2025,"n":81,"p":12,"s":"Tissue necrosis is the predominant histologic pattern of tissue reaction in:","c":[["A","Mycobacterium avium-intracellulare infection in AIDS patient"],["B","Clostridial gas gangrene"],["C","Genital herpes"],["D","Pneumococcal pneumonia"]],"k":"B.","ks":["B"],"r":[["M. avium-intracellulare complex infects patients with AIDS and very low CD4 counts. Granulomas fail to form, and macrophages are packed with acid-fast bacilli.","gen",""],["Gas gangrene or clos eature of syphilis infections is proliferative endarteritis.","f":[50]},"25:83":{"id":"25:83","ex":"2025 LE2","y":2025,"n":83,"p":12,"s":"All of the following are documented modes of transmission of monkeypox virus EXCEPT:","c":[["A","Transplacental transmission"],["B","Close contact with contaminated beddings"],["C","3 minute conversation with an infected person within 3 feet of each other"],["D","Prolonged close skin to skin contact with an infected person"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Monkeypox can spread to anyone through close, personal, often skin-to-skin contact, including: - Direct contact with monkeypox rash and scabs from a person with monkeypox, as well as contact with their saliva, upper respiratory secretions (snot, mucus), and areas around the anus, rectum or vagina. This direct contact can happen during intimate contact, including: - Oral, anal, or vaginal sex, or touching the genitals (penis, testicles, labia, and vagina) or anus of a person with monkeypox - Hugging, massage, and kissing - Prolonged face-to-face contact The risk is considered low for getting monkeypox by touching objects, fabrics, and surfaces that have been used by someone with monkeypox and not disinfected, such as clothing, bedding, towels, fetish gear, or sex toys (CDC).","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Monkeypox is not in the PTH LEC set","bm":1,"orig":"Monkeypox can spread to anyone through close, personal, often skin-to-skin contact, including: - Direct contact with monkeypox rash and scabs from a person with monkeypox, as well as con stenosis"]],"k":"D","ks":["D"],"r":[["Overriding aorta: Aorta is misplaced and moves toward the right side over the VSD. In this anomaly, the positioning of the great vessels is arrested midway because of the failure of development of the membranous portion of the aorta.","bor","2027 LE3 Q73"],["Right ventricular hypertrophy: Adaptive response caused by inability of blood to go to the pulmonary artery due to","bor","2027 LE3 Q73"],["Ventricular septal defect: Allows blood to be shunted from the R to L side of the heart because blood cannot go to the pulmonary artery due to obstruction. Pulmonary stenosis: Most important determinant of the severity and clinical consequences of TOF: degree RV outflow obstruction due to pulmonary stenosis. Lesser obstruction, blood is shunted from L to R and permitted to preferentially enter the pulmonary circulation, allowing for oxygenation. Greater obstructions, blood is forced in the opposite direction away from the pulmonary circuit leftward towards the VSD, hence, the flow of the blood is from R to L side of the heart. According to Robbins, the clinical severity of TOF largely depends on the degree of the pulmonary outflow obstruction. More commonly, severe degrees of pulmonic stenosis cause early cyanosis. Moreover, as the child grows and the heart increases in size, the pulmonic orifice does not expand proportionately, leading to progressive worsening of the stenosis.","bor","2027 LE3 Q73"],["Though all of these are features of TOF but cyanosis and hypoexemia in the case may mostly be attributed to Pulmonary stenosis According to Robbins, The clinical severity of TOF largely depends on the degree of the pulmonary outflow obstruction. More commonly, more severe degrees of pulmonic stenosis cause early cyanosis. Moreover, as the child grows and the heart increases in size, the pulmonic orifice does not expand proportionately, leading to progressive worsening of the stenosis.","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Though all of these are features of TOF but cyanosis and hypoexemia in the case may mostly be attributed to Pulmonary stenosis According to Robbins, The clinical severity of TOF largely depends on the degree of the pulmonary outflow obstruction. More commonly, more severe degrees of pulmonic stenosis cause early cyanosis. Moreover, as the child grows and the heart increases in size, the pulmonic orifice does not expand proportionately, leading to progressive worsening of the stenosis.","f":[135]},"25:119":{"id":"25:119","ex":"2025 LE2","y":2025,"n":119,"p":18,"s":"Which of the following major valvular lesions is INCORRECTLY paired with its most frequent etiology?","c":[["A","Mitral valve prolapse - myxomatous degeneration"],["B","Mitral stenosis - infective endocarditis"],["C","Tricuspid insufficiency - substance abuse IV mainlining"],["D","Aortic calcification - dystrophic calcification in aging"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Tricuspid stenosis, not insufficiency / regurgitation","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","flag":"Cross-year discrepancy: 2025 keys C (Tricuspid insufficiency - IV drug use) with the note 'tricuspid stenosis, not insufficiency'. 2027 LE3 Q78 keys Mitral stenosis - infective endocarditis for the same item.","bm":1,"orig":"Tricuspid stenosis, not insufficiency / regurgitation","f":[136]},"25:120":{"id":"25:120","ex":"2025 LE2","y":2025,"n":120,"p":18,"s":"Which of the following is an INCORRECT statement regarding atherosclerosis?","c":[["A","In a developing atherosclerotic plaque, vascular smooth muscle
