bA2 and HbF, slightly decreased HbA Seen in Sickle cell anemia (90-100 % HbS) Sickle Cell trait: 20-40% HbS, Majority is HbA HbF consists of α-globin and γ-globin chains Severe α-Thalassemia ● HgH Disease: Deletion of 3 α-globin genes ○ With only 1 gene functioning, there is a severe decrease in the production of α-globin, causing β-globin to pair with another β-globin and forming tetramers of β-globin called HbH. ● Hydrops Fetalis (Barts Hb): Deletion of 4 α-globin genes ○ In the absence of α-globin, γ-globin will pair with another γ-globin, leading to hydrops fetalis.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"RBC/WBC disorders","bm":1,"orig":"β-Thalassemia Major: Marked elevation of HbA2 and HbF, no HbA β-Thalassemia Major: Mild elevation of HbA2 and HbF, slightly decreased HbA | Seen in Sickle cell anemia (90-100 % HbS) Sickle Cell trait: 20-40% HbS, Majority is HbA | HbF consists of α-globin and γ-globin chains Severe α-Thalassemia ● HgH Disease: Deletion of 3 α-globin genes ○ With only 1 gene functioning, there is a severe decrease in the production of α-globin, causing β-globin to pair with another β-globin and forming tetramers of β-globin called HbH. ● Hydrops Fetalis (Barts Hb): Deletion of 4 α-globin genes ○ In the absence of α-globin, γ-globin will pair with another γ-globin, leading to hydrops fetalis.","ref":"2027 LEC TRANS LE2 05A DISEASES OF RBC & BLEEDING DISORDERS 1","f":[85]},"27a:70":{"id":"27a:70","ex":"2027 LE2","y":2027,"n":70,"p":18,"s":"A 12-year-old male is on his first plane ride. Within 30 minutes of the flight, he develops severe abdominal pain with leg and back pain. A doctor in flight gives him oxygen which relieves his symptoms. He is brought to a hospital upon arrival. His CBC showed some sickle cells. He has no previous history of hospitalization. What type of hemoglobin will be present in this patient?","c":[["A","Small amount of HbS, majority HbA"],["B","Small amount of HbS, majority HbA2"],["C","Small amount of HbA2, majority HbF"],["D","Only HbS, no other hemoglobin"]],"k":"A","ks":["A"],"r":[["This is a Case of Sickle cell trait which is to be differentiated from sickle cell Anemia. Presence of sickle cells on smear associated with symptoms of pain due to infarction during conditions of decreased oxygen supply (in this case a plane ride) indicate Sickle cell disease. No previous hospitalization or symptoms related to the disease indicate that it is a mild form of the disease known as Sickle cell trait. In this condition, the majority of the Hb remains to be normal HbA and is compatible with normal life span.","own",""],["Abnormal Hbs HbA2 and HbF are not seen in Sickle Cell Disease","own",""],["Abnormal Hbs HbA2 and HbF are not seen in Sickle Cell Disease","own",""],["If only HbS is present, patient is almost always symptomatic with frequent pain and hospitalization","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"2027 PATHO LE2 Feedback","f":[]},"27a:71":{"id":"27a:71","ex":"2027 LE2","y":2027,"n":71,"p":18,"s":"A 26 y/o female presents with several petechiae in arms and legs. She claims to have heavy bleeding during her periods. The spleen is normal size. She has platelet count of 65,000 and elevated bleeding time. The bone marrow shows an increased number of megakaryocytes. The thrombocytopenia is due to:","c":[["A","Decreased marrow production"],["B","Ineffective megakaryopoiesis"],["C","Antibodies to platelet"],["D","Splenic sequestration"]],"k":"C","ks":["C"],"r":[["Thrombocytopenia due to decreased marrow production will show decreased megakaryocytes.","own",""],["Ineffective megakaryopoesis such is seen in deficiency of B12 or folic will cause defective platelets and failure of marrow to produce platelets therefore have low megakaryocytes.","own",""],["This is a case of Idiopathic Thrombocytopenic Purpura which usually affects reproductive females. Presence of increased megakaryocytes in the bone marrow indicates platelet loss in the peripheral blood due to antibodies.","own",""],["Splenic sequestration happens in case of splenomegaly which is not seen in the patient.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"2027 PATHO LE2 Feedback","f":[]},"27a:72":{"id":"27a:72","ex":"2027 LE2","y":2027,"n":72,"p":19,"s":"A 10 y/o boy develops prolonged bleeding following a dental extraction. Hb is 13mg/dl Coagulation parameters showed a prolonged APTT, normal PT, and prolonged bleeding time. Platelet count is 185,000. Which is the most likely diagnosis?","c":[["A","Bernard-Soulier syndrome"],["B","Idiopathic thrombocytopenic purpura"],["C","Von Willebrand disease"],["D","Hemophilia"]],"k":"C","ks":["C"],"r":[["BSS will increase bleeding time but will have normal coagulation parameters.","own",""],["ITP will have low platelet counts and normal APTT.","own",""],["Von Willebrand Disease is a defect of the von Willebrand factor that has 2 functions: allow platelet adhesion and protect FVIII from degradation. In the absence of the vW factor, bleeding time is increased even if the platelet count is normal. APTT is prolonged since this test determines intrinsic factors. PT is normal because this test determines extrinsic factors and FVIII is an intrinsic factor.","own",""],["Hemophilia will affect only APTT with normal bleeding time.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"2027 PATHO LE2 Feedback","f":[]},"27a:73":{"id":"27a:73","ex":"2027 LE2","y":2027,"n":73,"p":19,"s":"A 4 yr old child was brought for consultation because of pallor. No jaundice, no splenomegaly. Growth and mental development is consistent with age. CBC results: Hb 7.2 g/L MCV 70 fl WBC cnt 8,000 MCHC 27 g/dl Retic count: 0.5","c":[["A","Sickle cell anemia"],["B","Thalassemia"],["C","Fe deficiency anemia"],["D","Spherocytosis"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Thalassemia results in microcytic, hypochromic anemia but presents with splenomegaly which is not present in the patient.","bor","2026 LE2 Q87"],["The red cell indices show hypochromic microcytic anemia. The Retic count is low normal despite anemia and therefore indicative of nutritional cause of anemia. Choice A, B, and D will all have elevated retic counts. Sickle cell and Spherocytosis will have normal red cell indices.","own",""],["Causes extravascular hemolysis","bor","2026 LE2 Q86"]],"t":"UNC","sub":"RBC/WBC disorders","bm":1,"orig":"The red cell indices show hypochromic microcytic anemia. The Retic count is low normal despite anemia and therefore indicative of nutritional cause of anemia. Choice A, B, and D will all have elevated retic counts. Sickle cell and Spherocytosis will have normal red cell indices.","ref":"2027 PATHO LE2 Feedback","f":[79]},"27a:74":{"id":"27a:74","ex":"2027 LE2","y":2027,"n":74,"p":19,"s":"43 year-old male with high grade fever. Hb is low. WBC is 25,000. Cell differential with 30% stab, 52% lymphocyte, __% ____. What histological finding could be found on peripheral smear?","c":[["A","Toxic Granules"],["B","Auer rods"],["C","Atypical lymphocytes"],["D","Hypersegmented neutrophils"]],"k":"A","ks":["A"],"r":[["Leukocytosis with increased stabs indicates acute bacterial infection. Changes in the WBC during sepsis include toxic granules and increased stabs.","own",""],["atypical lymphocytes seen in viral infection","own",""],["Auer rods seen in AML Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["hypersegmented neutrophils seen in Megaloblastic anemia","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[]},"27a:75":{"id":"27a:75","ex":"2027 LE2","y":2027,"n":75,"p":19,"s":"A 64 year old man complains of back pain. X-ray shows multiple lytic lesions with soap bubble appearance in vertebrae and skull. Pathologic fracture is seen in the 4th rib. Bence Jones protein is positive in the urine. Which of the following test would confirm a diagnosis?","c":[["A","M-spike on protein electrophoresis"],["B","Plasma cells in blood"],["C","RS cells on bone biopsy"],["D","Ringed sideroblasts in bone marrow"]],"k":"A","ks":["A"],"r":[["Lytic lesions with soap bubble appearance in central bones plus Bence Jones proteinuria are all indicative of MULTIPLE MYELOMA. Serum electrophoresis with an abnormal spike on the globulin portion is confirmatory of MM","own",""],["Proliferating plasma cells are seen in the bone marrow and does not spill in blood","own",""],["RS cells are seen in the nodes affected by Hodgkin's Lymphoma","own",""],["Ringed sideroblasts are abnormalities of dysplastic cells in Myelodysplastic Syndrome.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"LE2 Feedback","f":[90]},"27a:76":{"id":"27a:76","ex":"2027 LE2","y":2027,"n":76,"p":19,"s":"A 45-year-old man has noted an enlargement of a reddish plaque in the skin of his leg. On physical examination the skin is thickened, nodular and ulcerated. A punch biopsy of skin is performed and on microscopic examination shows infiltration by neoplastic T lymphocytes. Which of the following is the most likely diagnosis?","c":[["A","Hodgkin lymphoma"],["B","Mycosis fungoides"],["C","Burkitt’s lymphoma"],["D","Chronic lymphocytic leukemia"]],"k":"B","ks":["B"],"r":[["B cell tumor that rarely affect the skin","own",""],["Tumor of peripheral T cells in the skin","own",""],["B cell tumor that rarely affect the skin","own",""],["B cell tumor that rarely affect the skin","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"LE 2 Feedback","f":[91]},"27a:77":{"id":"27a:77","ex":"2027 LE2","y":2027,"n":77,"p":20,"s":"A 50 yr old man complains of progressively enlarging multiple painless neck masses. He claims to have lost about 10 lbs in 2 months. Biopsy shows several large “owl-eyed” binucleated to multinucleated cells in a mixed inflammatory background. What markers would be positive for these large tumor cells?","c":[["A","CD 5"],["B","CD 8"],["C","CD 30"],["D","CD 64"]],"k":"C","ks":["C"],"r":[["Seen in T cell lymphoma like Mycosis Fungoides","own",""],["Seen in T cell lymphoma like Mycosis Fungoides","own",""],["Owl eyed binucleated cells are RS cells and when present in mixed inflammatory cells in a patient with multiple painless lymphadenopathy indicates HODGKIN'S LYMPHOMA. Among the markers, only CD 30 will be positive in Hodgins disease.","own",""],["Positive for macrophages Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"LE2 Feedback","f":[92]},"27a:78":{"id":"27a:78","ex":"2027 LE2","y":2027,"n":78,"p":20,"s":"A patient is being worked up due to complaints of easy fatigability. Patient claims to drink 5-6 bottles of beer daily or hard drinks if with friends. Work-up shows low hemoglobin and hematocrit, with marked elevation of MCV and MCHC. Peripheral smear shows hypersegmented neutrophils. No neurologic deficits are present. Which of the following parameters will be elevated?","c":[["A","Bilirubin"],["B","Serum Iron"],["C","Homocysteine"],["D","Methylmalonic acid"]],"k":"C","ks":["C"],"r":[["Increased in hemolysis. Megaloblastic anemia is nutritional anemia with no hemolysis","own",""],["Thalassemia is the hemoglobinopathy associated with increased iron","own",""],["Red cell indices with hypersegmented neutrophils on PBS indicate a diagnosis of MEGALOBLASTIC ANEMIA. The absence of neurologic deficits and alcoholism are all associated with folic acid deficiency rather than B12 deficiency","own",""],["increased in B12 deficiency but not in folic acid deficiency","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"LE2 Feedback","f":[81]},"27a:79":{"id":"27a:79","ex":"2027 LE2","y":2027,"n":79,"p":20,"s":"48 yr old painter complains of frequent cough, increasing fatigue, and shortness of breath for a week. CBC shows the following abnormality: Hb: 7. 8 g/dl Hct: 22% WBC cnt: 2,200 cells MCV:84 Platelet cnt: 80,000 MCHC: 32.5 Retic cnt: 0.2% The bone marrow biopsy of this patient will show:","c":[["A","Proliferating lymphoid cells"],["B","Proliferating plasma cells"],["C","Increased number of normoblasts"],["D","Fatty replacement of the marrow"]],"k":"D","ks":["D"],"r":[["Proliferating lymphoid cells in the bone marrow will increase WBC count in the CBC","own",""],["Plasma cells or MM will have normal platelet, WBC and RBC counts","own",""],["Increased normoblasts with increase retic count","own",""],["Pancytopenia with low retic count is indicative of Aplastic anemia wherein biopsy will show a decrease in hematopoietic elements with the bone marrow being replaced by fat.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"LE2 Feedback","f":[83]},"27a:80":{"id":"27a:80","ex":"2027 LE2","y":2027,"n":80,"p":20,"s":"A 6 yr old patient with pallor is being evaluated. CBC shows WBC count of 21,000 with 90% lymphoblasts and 10% mature lymphocytes. Give your diagnosis?","c":[["A","Acute myelogenous leukemia"],["B","Chronic Myelogenous leukemia"],["C","Acute lymphoblastic leukemia"],["D","Chronic lymphocytic leukemia"]],"k":"C","ks":["C"],"r":[["Myeloblasts should predominate","own",""],["Elevated WBC counts: >100,000 High WBC count with all stages of maturation Blast cells <20% Negative alkaline phosphatase S/Sx include marked splenomegaly","bor","2026 LE2 Q106"],["The presence of elevated WBC with 90% blast is indicative of ALL","own",""],["Lymphoblasts should be less than 20%","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Patho LE 2 Feedback","f":[]},"27a:81":{"id":"27a:81","ex":"2027 LE2","y":2027,"n":81,"p":20,"s":"A 45-year-old vegetarian is being worked up for anemia. His MCV is high, MCHC is high normal. Macrocytes were present in the smear. Antibodies were present in serum. Gastric analysis shows absence of hydrochloric acid. Your diagnosis for this patient would be:","c":[["A","Iron deficiency anemia"],["B","Megaloblastic anemia"],["C","Pernicious anemia"],["D","Gastric ulcer"]],"k":"C","ks":["C"],"r":[["Red cell indices should be low","own",""],["Antibodies in serum are absent and there is no achlorhydria","own",""],["Elevated red cell indices with macrocytes on the smear indicated Megaloblastic anemia. However the presence of antibodies in serum and the absence of hydrochloric acid indicated that the B12 deficiency is due to immune causes that indicate a specific form of B12 deficiency, PERNICIOUS ANEMIA","own",""],["Normal to low red cell indices. There are no antibodies in blood.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Pathe LE 2 Feedback","f":[84]},"27a:82":{"id":"27a:82","ex":"2027 LE2","y":2027,"n":82,"p":21,"s":"Which laboratory finding will NOT be consistent with a diagnosis of iron deficiency anemia?","c":[["A","Decreased Prussian blue staining in bone marrow"],["B","Decreased iron binding capacity"],["C","Decreased Ferritin"],["D","Increased reticulocytes with treatment"]],"k":"B","ks":["B"],"r":[["Prussian blue staining that stains for iron is decreased","own",""],["In iron deficiency, the transport protein carries little or no iron and therefore the capacity to bind iron is increased in iron deficiency","own",""],["Storage form, ferritin, is decreased","own",""],["Being a nutrition form of anemia, the marrow is not functioning indicated by low retic count until treatment is instituted","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Patho LE 2 Feedback","f":[80]},"27a:83":{"id":"27a:83","ex":"2027 LE2","y":2027,"n":83,"p":21,"s":"What is the morphologic type of Anemia in a patient with MCV of 84 fl and MCHC of 34 gm/dl?","c":[["A","Hypochromic, microcytic"],["B","Macrocytic, hyperchromic"],["C","Normocytic, normochromic"],["D","Normochromic, microcytic"]],"k":"C","ks":["C"],"r":[["Low MCHC, Low MCV Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["High MCHC, High MCV Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Red cell indices are normal and therefore should show normal red cell size (MCV) and normal red cell color (MCHC)","own",""],["Normal MCHC, Low MCV Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Patho LE 2 Feedback","f":[]},"27a:84":{"id":"27a:84","ex":"2027 LE2","y":2027,"n":84,"p":21,"s":"A 49 year old patient was diagnosed with Chronic Myeloid Leukemia. Which one of these clinical features is mostly likely to be present in this patient?","c":[["A","Enlarged Cervical Lymph Nodes"],["B","Anemia and thrombocytopenia"],["C","Abrupt symptoms"],["D","Splenomegaly"]],"k":"D","ks":["D"],"r":[["Seen in lymphoma and not leukemia","own",""],["Seen in acute leukemias Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Seen in acute leukemias Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["In CML, the volume of WBC is markedly increased and due to continuous proliferation of the stem cells. These cells pass through the spleen causing splenomegaly. CML produces the largest spleen in all of the leukemias","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[89]},"27a:85":{"id":"27a:85","ex":"2027 LE2","y":2027,"n":85,"p":21,"s":"Lymph node biopsy shows replacement by a monomorphous population of lymphoid cells. Immunohistochemistry show that lymphoid cells are CD 19+, CD3- and CD 15- with a positive BCL6 mutation. What is your diagnosis?","c":[["A","Follicular Lymphoma"],["B","Burkitt's Lymphoma"],["C","Diffuse Large B Cell Lymphoma"],["D","Hodgkin's lymphoma"]],"k":"C","ks":["C"],"r":[["Can both be CD 19+ but BCL6 negative.","own",""],["Can both be CD 19+ but BCL6 negative.","own",""],["BCL 6 mutation is present only in Diffuse Large B cell lymphoma.","own",""],["Malignant transformation of B cells with loss of normal B-cell phenotype and activation of NF-κB","bor","2028 LE2 Q25"]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[]},"27a:86":{"id":"27a:86","ex":"2027 LE2","y":2027,"n":86,"p":21,"s":"A 60-year old man complains of frequent back pain. His history is significant for three episodes of pneumonia during the past year. Laboratory results indicate a WBC count of 6,000, platelets of 156,000, ESR increased. Urinalysis reveals proteinuria. X-rays reveal several lytic bone lesions of the vertebrae, ribs, and pelvis. Which of the following is the most likely diagnosis?","c":[["A","Histiocytosis"],["B","Multiple myeloma"],["C","Lymphocytic Leukemia"],["D","Lymphoma"]],"k":"B","ks":["B"],"r":[["Histiocytosis may present with a solitary lytic lesion but will not show proteinuria or elevated ESR.","own",""],["A patient with multiple lytic lesions in the central bones, increase ESR and proteinuria (due to Bence Jones Protein) are indicative of MULTIPLE MYELOMA.","own",""],["Leukemia and will not show lytic lesion on x ray and will have elevated WBC count.","own",""],["Lymphoma will present with multiple lymphadenopathy and no lytic lesion.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[90]},"27a:87":{"id":"27a:87","ex":"2027 LE2","y":2027,"n":87,"p":21,"s":"A patient presents with fever and chills and is diagnosed case of Malaria. All of the following laboratory indicates the occurrence of intravascular hemolysis from rupture of infected red cells, EXCEPT:","c":[["A","Methemoglobinemia"],["B","Hemoglobinuria"],["C","Increased haptoglobin"],["D","Increased hemosiderin"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["All choices are increased in intravascular hemolysis when the red cells rupture within the vascular circulation. Hemoglobin is excreted in the urine in case of intravascular hemolysis but not in extravascular hemolysis which occurs in the spleen. Haptoglobin is the transport form that carries free Hb in blood to the spleen. It is decreased in intravascular hemolysis since most are used up by the increased amount of free Hb","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"RBC/WBC disorders","bm":1,"orig":"All choices are increased in intravascular hemolysis when the red cells rupture within the vascular circulation. Hemoglobin is excreted in the urine in case of intravascular hemolysis but not in extravascular hemolysis which occurs in the spleen. Haptoglobin is the transport form that carries free Hb in blood to the spleen. It is decreased in intravascular hemolysis since most are used up by the increased | amount of free Hb","ref":"Batch 2027 Pathology LE 2 Feedback","f":[86]},"27a:88":{"id":"27a:88","ex":"2027 LE2","y":2027,"n":88,"p":22,"s":"A patient has a WBC count of 30,000. Peripheral smear shows blast cells with the presence of Auer rods. Which stain is most likely to be positive for these cells?","c":[["A","PAS"],["B","Myeloperoxidase"],["C","TdT"],["D","Esterase"]],"k":"B","ks":["B"],"r":[["A is positive for lymphoid tumor","own",""],["Auer rods are coalescent in myelogenous cells. This therefore indicate myelogenous type of leukemia","own",""],["C is positive for lymphoid tumor","own",""],["D is positive for monocytic tumors","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2026 Pathology LE 2 Feedback","f":[87]},"27a:89":{"id":"27a:89","ex":"2027 LE2","y":2027,"n":89,"p":22,"s":"A 55 y-o man complains of increased fatigue and exertional dyspnea. He is diagnosed with leukemia with a t(9;22) translocation. Which of the following cells will predominate in his peripheral smear?","c":[["A","Lymphocyte"],["B","Neutrophils"],["C","Lymphoblasts"],["D","Myeloblasts"]],"k":"B","ks":["B"],"r":[["Most prominent in viral infections","bor","2027 LE2 Q5"],["The philadelphia chromosome or t(9:22) is typically seen in CML. Since it is a chronic form of anemia with less than 20% blasts, the predominant cells remain to be the neutrophils and stabs. Choice D: only less than 20% are seen","own",""],["Not present in CML Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Only less than 20% are seen Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[29]},"27a:90":{"id":"27a:90","ex":"2027 LE2","y":2027,"n":90,"p":22,"s":"A 35 y-o woman complaints of several months of fatigue and malaise. Hematologic workup showed that she has Acute Promyelocytic Leukemia, AML3. What is the most common complication of these patients during treatment?","c":[["A","Tumor lysis syndrome"],["B","Bleeding"],["C","Bone marrow failure"],["D","Renal failure"]],"k":"B","ks":["B"],"r":[["Tumor lysis syndrome may occur after treatment for high tumor burden cancers. Cancer cells release a large amount of cellular contents into the blood, leading to acute renal failure in the kidneys. Hyperuricemia, hyperkalemia hyperphosphatemia and hypocalcemia may occur. New-onset atrial fibrillation is due to electrolyte imbalances.","own",""],["Acute Promyelocytic Leukemia or AML3 is a form of anemia with heavy volume of granules in the cytoplasm. These granules contain substances that cause DIC when it ruptures during treatment.","own",""],["Presence of impaired production of blood cells in at least 2 cell lines in the bone marrow","own",""],["Renal failure, also known as kidney failure, occurs when the kidneys are unable to effectively filter waste products and maintain electrolyte and fluid balance.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[88]},"27a:91":{"id":"27a:91","ex":"2027 LE2","y":2027,"n":91,"p":22,"s":"Biopsy on a child with an ileocecal mass shows lymphoma that is positive for c-myc gene abnormality. What histologic pattern will be seen in the biopsy specimen?","c":[["A","starry sky appearance"],["B","RS cell with lymphocytes and histiocytes"],["C","Increased mantle zone with atrophic germinal centers"],["D","Centrocytes and centroblasts"]],"k":"A","ks":["A"],"r":[["The starry sky appearance is the typical appearance in Burkitt's Lymphoma with scattering of histiocytes in a background of lymphocytes","own",""],["seen in Hodgkin's lymphoma Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["seen in mantle cell lymphoma","own",""],["seen in Follicular Lymphoma in its attempt to recapitulate normal follicles.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[30]},"27a:92":{"id":"27a:92","ex":"2027 LE2","y":2027,"n":92,"p":22,"s":"What PBS abnormality do you see in Megaloblastic Anemia?","c":[["A","Dohle bodies"],["B","Hypersegmented neutrophil"],["C","Smudged cells"],["D","Heinz bodies"]],"k":"B","ks":["B"],"r":[["Dohle bodies: Nonspecific finding typically found in association with bacterial infections, sepsis, and pregnancy.","bor","2027 LE3 Q19"],["Hypersegmented neutrophils is one PBS abnormality in Megaloblastic anemia together with large red cells with no central pallor and nucleo-cytoplasmic asynchronism of red cells.","own",""],["Smudge cells: Characteristic for Chronic Lymphocytic Leukemia, where pale cells appear flattened and larger than adjacent lymphocytes. They have no definite nuclei and have irregular smudged margins.","bor","2027 LE3 Q19"],["Heinz bodies: Characteristic for Glucose 6-Phosphate Dehydrogenase Deficiency Anemia, where these bodies manifest as precipitates of denature globin in RBCs. They can be shown through supravital staining.","bor","2027 LE3 Q19"]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[82]},"27a:93":{"id":"27a:93","ex":"2027 LE2","y":2027,"n":93,"p":23,"s":"What test can be used to differentiate Chronic Myelogenous Leukemia from the myeloid proliferation in Sepsis?","c":[["A","Tartarate Resistant Acid Phosphatase (TRAP)"],["B","Terminal deoxynucleotidyl transferase (TdT)"],["C","Leukocyte alkaline Phosphatase (LAP)"],["D","Myeloperoxidase"]],"k":"C","ks":["C"],"r":[["Marker of hairy cell leukemia","own",""],["Marker for precursor Leukemia or Lymphoma","own",""],["LAP is a normal enzyme in neutrophils to kill bacteria. It is therefore increased in infection. Leukemic cells do not function normally since they do not contain normal enzymes that can kill bacteria. Frequent infection is one manifestation of one with leukemia.","own",""],["Marker for myeloid leukemia and can not be used to differentiate sepsis with myeloid cells in CML.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"Batch 2027 Pathology LE 2 Feedback","f":[89]},"27a:94":{"id":"27a:94","ex":"2027 LE2","y":2027,"n":94,"p":23,"s":"Type IV hypersensitivity is often referred to as:","c":[["A","Immediate"],["B","Delayed"],["C","Anaphylactic"],["D","Anergic"]],"k":"B","ks":["B"],"r":[["Immediate hypersensitivity is Type I: antigen binds IgE on mast cells and triggers a rapid reaction (allergy).","gen",""],["Delayed hypersensitivity is Type IV, mediated by T cells rather than antibody. CD4+ cells release cytokines and CD8+ cells kill directly, and the reaction takes 24 to 48 hours to develop.","gen",""],["Anaphylactic describes the systemic form of Type I, IgE and mast cell mediated hypersensitivity.","gen",""],["Anergy is T cell unresponsiveness that results when antigen is recognised (signal 1) without costimulation (signal 2). It is a tolerance mechanism, not a hypersensitivity type.","gen",""]],"t":"I1","sub":"","bm":1,"ref":"[PTH LEC - LE 2] 7A - Diseases of Immunity I","f":[0]},"27a:95":{"id":"27a:95","ex":"2027 LE2","y":2027,"n":95,"p":23,"s":"Patients with chronic granulomatous disease are more susceptible to infections because of:","c":[["A","C2 deficiency"],["B","Defects in TLR signaling"],["C","Defects in microbicidal activity"],["D","Mutation in fucosyl transferase"]],"k":"C","ks":["C"],"r":[["C2 deficiency is a complement deficiency, the most common one, and is associated with SLE rather than with defective bacterial killing.","gen",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Seen in Systemic Lupus Erythematosus (SLE): resulting from inherent deficiencies in complement proteins such as C1q, C2, or C4. C2 deficiency is also the most common complement protein deficiency. Chronic Granulomatous Disease results from a defect in t s no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Systemic Lupus Erythematosus (SLE) Hallmark: production of antinuclear autoantibodies (ANAs)","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","bm":1,"orig":"Systemic Lupus Erythematosus (SLE) Hallmark: production of antinuclear autoantibodies (ANAs)","ref":"[PTH LEC - LE 2] 7B - Diseases of Immunity II","f":[14]},"27a:101":{"id":"27a:101","ex":"2027 LE2","y":2027,"n":101,"p":24,"s":"Which of the following antibodies are useful for the diagnosis of Sjögren's syndrome?","c":[["A","Anti-cardiolipin."],["B","Anti-neutrophil cytoplasm (ANCA)."],["C","Anti-SS-A(Ro), anti-SS-B(La)."],["D","Anti-glomerular basement membrane."]],"k":"C","ks":["C"],"r":[["Associated with antiphospholipid syndrome (APS), which can cause blood clotting disorders","own",""],["Associated with vasculitis and certain autoimmune diseases like granulomatosis with polyangiitis","own",""],["Anti-SS-A(Ro and anti-SS-B(La) antibodies are detected in as many as 90% of patients with Sjogren’s syndrome.","own",""],["Associated with Goodpasture syndrome, a condition affecting the lungs and kidneys","own",""]],"t":"I2","sub":"","ref":"[PTH LEC - LE2] 7B - Diseases of Immunity II","f":[11]},"27a:102":{"id":"27a:102","ex":"2027 LE2","y":2027,"n":102,"p":24,"s":"A 42-year-old woman has been bothered by a chronic, dry cough for the past 5 years. She has had increasing difficulty with blurred vision for the past year. On P.E., she has bilateral mild corneal scarring, and oral cavity fissuring of the tongue and corners of her mouth. Laboratory studies show antibodies to SS-A and SS-B. Which of the following is the most serious condition likely to complicate the course of her disease?","c":[["A","Chronic renal failure"],["B","Endocarditis"],["C","Non-Hodgkin lymphoma"],["D","Urethritis"]],"k":"C","ks":["C"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Sjogren’s syndrome can affect the kidneys by causing interstitial nephritis but renal involvement is less prominent. This is not a complication of Sjogren’s syndrome. It is associated with conditions like rheumatic fever, infective endocarditis and SLE. Patients with Sjögren's syndrome are at increased risk for developing non-Hodgkin lymphoma (NHL), especially MALT lymphoma (mucosa-associated lymphoid tissue lymphoma). Dryness and reduced secretions may occur but urethritis is not a major complication of the disease.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","bm":1,"orig":"Sjogren’s syndrome can affect the kidneys by causing interstitial nephritis but renal involvement is less prominent. | This is not a complication of Sjogren’s syndrome. It is associated with | conditions like rheumatic fever, infective endocarditis and SLE. | Patients with Sjögren's syndrome are at increased risk for developing non-Hodgkin lymphoma (NHL), especially MALT lymphoma (mucosa-associated lymphoid tissue lymphoma). | Dryness and reduced secretions may occur but urethritis is not a major complication of the disease.","ref":"[PTH LEC - LE2] 7B - Diseases of Immunity II","f":[11]},"27a:103":{"id":"27a:103","ex":"2027 LE2","y":2027,"n":103,"p":25,"s":"A 55-year-old woman has a purple rash on her sun exposed skin and eyelids, muscle weakness, and difficulty in swallowing. Biopsy shows Which of the following antibodies is most likely to be identified on laboratory testing?","c":[["A","Anti–double-stranded DNA"],["B","Anticentromere"],["C","Scl-70"],["D","Jo-1"]],"k":"D","ks":["D"],"r":[["Anti–double-stranded DNA:SLE","own",""],["Anticentromere: Scleroderma w/ CREST","own",""],["Seen in patients with diffuse systemic sclerosis/ scleroderma and is directed against DNA topoisomerase 1.","bor","2028 LE2 Q50"],["Jo-1:Dermatomyositis Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","ref":"[PTH LEC - LE2] 7B - Diseases of Immunity II","f":[10]},"27a:104":{"id":"27a:104","ex":"2027 LE2","y":2027,"n":104,"p":25,"s":"Which statement BEST describes senile systemic amyloidosis?","c":[["A","It develops after a diagnosis of medullary thyroid carcinoma"],["B","It is primarily composed of AA protein"],["C","It is a basophilic substance that can be stained with Congo red"],["D","Transthyretin accumulates in the heart"]],"k":"D","ks":["D"],"r":[["Medullary thyroid carcinoma originates from the parafollicular cells, which produce the hormone calcitonin","own",""],["Amyloid-associated protein is seen in reactive systemic amyloidosis. Also called secondary amyloidosis because it is secondary to an associated inflammatory condition. Now more commonly seen in autoimmune diseases like rheumatoid arthritis, ankylosing spondylitis, and inflammatory bowel disease","own",""],["Appears as pink/red in Congo Red Stain","own",""],["Amyloidosis is the build up of pathologic proteinaceous material in tissues and organs. Senile systemic amyloidosis is characterized by the buildup of transthyretin in the heart","own",""]],"t":"I2","sub":"","ref":"[PTH LEC - LE2] 7B - Diseases of Immunity II","f":[15]},"27a:105":{"id":"27a:105","ex":"2027 LE2","y":2027,"n":105,"p":25,"s":"A renal biopsy is performed on a 25-year-old female due to persistent muscle pains. Histopathology shows a granular pattern of immunofluorescence staining with antibody to complement component C1q. This pattern is most typically produced because of which of the following immunologic mechanisms?","c":[["A","Antiglomerular basement membrane antibody"],["B","Antigen-antibody complexes"],["C","IgE coating mast cells"],["D","Macrophage release of lymphokines"]],"k":"B","ks":["B"],"r":[["Anti-glomerular basement membrane antibody (Goodpasture syndrome) reacts with basement membranes of lung and kidney. It is a Type II mechanism.","gen",""],["Acute vasculitis is the principal morphological manifestation of immune complex injury. Acute vasculitis seen on immunofluorescence microscopy as granular lumpy deposits of immunoglobulin and complement proteins","own",""],["IgE coating mast cells is the mechanism of Type I (immediate) hypersensitivity.","gen",""],["Cytokine release by T cells and macrophages belongs to Type IV delayed hypersensitivity.","gen",""]],"t":"I1","sub":"","bm":1,"orig":"Acute vasculitis is the principal morphological manifestation of immune complex injury. Acute vasculitis seen on immunofluorescence microscopy as granular lumpy deposits of immunoglobulin and complement proteins","ref":"[PTH LEC - LE2] 7A - Diseases of Immunity I","f":[7]},"27a:106":{"id":"27a:106","ex":"2027 LE2","y":2027,"n":106,"p":25,"s":"The second pregnancy for a 23-year-old woman appears uncomplicated until ultrasound performed at 19 weeks shows hydrops fetalis. Her first pregnancy was uncomplicated and resulted in the birth of a normal girl at term. The current pregnancy ends with birth of an infant boy at 32 weeks gestation. On examination the infant has marked jaundice. Which of the following immunologic mechanisms best explains this infant's findings?","c":[["A","Anti-receptor antibody"],["B","Loss of self tolerance"],["C","Immune complex formation"],["D","Complement mediated cell destruction"]],"k":"D","ks":["D"],"r":[["Anti-receptor antibodies disturb receptor function without killing the cell, as in myasthenia gravis where antibody to the acetylcholine receptor impairs neuromuscular transmission.","gen",""],["Loss of self tolerance is the basis of autoimmune disease. In hemolytic disease of the newborn the maternal antibody targets foreign (fetal) red cell antigens, not self.","gen",""],["Immune complex formation is Type III hypersensitivity, in which circulating antigen-antibody complexes deposit in vessels, kidney and joints.","gen",""],["Case shows Hemolytic Disease of the Newborn (HDN), likely due to Rh incompatibility between the mother and fetus. Jaundice indicates hyperbilirubinemia due to RBC destruction.","own",""]],"t":"I1","sub":"","bm":1,"orig":"Case shows Hemolytic Disease of the Newborn (HDN), likely due to Rh incompatibility between the mother and fetus. Jaundice indicates hyperbilirubinemia due to RBC destruction.","ref":"[PTH LEC - LE2] 7A - Diseases of Immunity I","f":[6]},"27a:107":{"id":"27a:107","ex":"2027 LE2","y":2027,"n":107,"p":25,"s":"A 32-year-old man has recently been diagnosed with hepatitis. His serologic findings for HBsAg and HBcAb are positive. A liver biopsy specimen examined microscopically shows focal death of hepatocytes with a portal infiltrate composed mainly of lymphocytes. Which of the following is the most likely mechanism by which the liver cell injury occurs under these conditions?","c":[["A","Recognition of an antigenic peptide presented by MHC class II molecule to CD4+ cells"],["B","Recognition of an antigenic peptide presented by MHC class I molecule to CD8+ cells"],["C","Destruction of HBsAg-expressing cells by anti-HBs IgG antibody"],["D","Apoptosis of the liver cells by cytokines released by activated macrophages"]],"k":"B","ks":["B"],"r":[["MHC class II molecules are not found in hepatocytes, only in antigen-presenting cells (e.g., dendritic cells, macrophages, B cells).","own",""],["CD8+ cells recognize viral peptides presented on infected hepatocytes via MHC class I molecules. These CD8+ cells induce apoptosis, controlling the infection but also causing liver damage seen as focal death of hepatocytes with a portal infiltrate.","own",""],["Antibodies do not destroy cells and instead neutralizes them.","own",""],["Activated macrophages play a bigger role on inflammation rather than apoptosis directly.","own",""]],"t":"I1","sub":"","ref":"[PTH LEC - LE2] 7A - Diseases of Immunity I","f":[8]},"27a:108":{"id":"27a:108","ex":"2027 LE2","y":2027,"n":108,"p":26,"s":"HIV infected individuals are shown to have a period of clinical latency of infection lasting years. During this time their risk for infection by opportunistic pathogens is not increased. However, a reservoir of virus remains within their lymphoid tissues. Which of the following cells is most important to maintain this reservoir of HIV?","c":[["A","CD8 lymphocyte"],["B","High endothelial venule cell"],["C","Macrophage"],["D","Memory B cell"]],"k":"C","ks":["C"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Marked expansion of CD8 lymphocyte are more commonly associated with initial infection rather than the latent period Macrophages allow viral replication and are quite resistant to the cytopathic effects of HIV. Macrophages may be an important site of continued viral replication and a reservoir for viral persistence.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","bm":1,"orig":"Marked expansion of CD8 lymphocyte are more commonly associated with initial infection rather than the latent period | Macrophages allow viral replication and are quite resistant to the cytopathic effects of HIV. Macrophages may be an important site of continued viral replication and a reservoir for viral persistence.","ref":"LE 2 Feedback","f":[]},"27a:109":{"id":"27a:109","ex":"2027 LE2","y":2027,"n":109,"p":26,"s":"A 45-year-old woman has noted episodes of pain with swelling and warmth of her hands and feet for the past 3 weeks. During these episodes, lasting hours to days, it is difficult for her to walk or to prepare meals. On physical examination she has painful 1 cm subcutaneous nodules on the extensor surfaces of her elbows. Over the next 6 years, her hands become deformed so that it is difficult to perform tasks as simple as opening a door or buttoning her blouse. Which of the following laboratory test findings is she most likely to have?","c":[["A","HLA B27"],["B","ANA 1:256"],["C","Increased rheumatoid factor"],["D","Markedly decreased serum complement"]],"k":"C","ks":["C"],"r":[["Marker for ankylosing spondylitis","own",""],["Strongly associated with SLA","own",""],["Disease: Rheumatoid arthritis Key symptoms in the case: Subcutaneous nodule and progressive hand deformity Best marker for rheumatoid arthritis next to anti-CCP (anti-citrullinated protein antibodies)","own",""],["- Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","ref":"LE 2 Feedback","f":[]},"27a:110":{"id":"27a:110","ex":"2027 LE2","y":2027,"n":110,"p":26,"s":"Which type of cells is known to be involved in the initial presentation of antigen to T lymphocytes?","c":[["A","Dendritic cells"],["B","Plasma cells"],["C","Neutrophils"],["D","Erythrocytes"]],"k":"B","ks":["B"],"r":[["- Project-source note: The uploaded feedback gives no rationale for this option, and the available lular Injury, Adaptation, & Cell Death II (2027)","f":[75]},"27b:2":{"id":"27b:2","ex":"2027 LE3","y":2027,"n":2,"p":1,"s":"An example of pathologic hyperplasia is:","c":[["A","Enlargement of size of uterine muscle cells in pregnancy"],["B","Enlargement and proliferation of number of mammary glands in pregnancy and lactation"],["C","Enlarged thyroid in goiter"],["D","Enlargement of prostate gland in elderly with nodular proliferation of prostatic acini"]],"k":"D","ks":["D"],"r":[["Physiologic Hypertrophy During pregnancy, myometrium undergoes hormonal stimulation facilitated by HCG causing an increased size and weight of uterus","own",""],["Physiologic Hyperplasia ● Physiologic hormonal stimulation by prolactin ● Pregnant breast shows an enlarged mammary lobule caused by an increased proliferation of mammary acini. ● Produce an overall increase in the number of cells","own",""],["Pathologic Hypertrophy Increased stimulation of the thyrocytes leading to goitrous enlargement","own",""],["Pathologic Hyperplasia Excess androgen hormone leading to prostatic glandular enlargement","own",""]],"t":"UNC","sub":"LE1 recall","ref":"Cellular Injury, Adaptation, & Cell Death II (2027)","f":[]},"27b:3":{"id":"27b:3","ex":"2027 LE3","y":2027,"n":3,"p":2,"s":"In acute inflammation, which specific cell proliferates within the first 24 hours?","c":[["A","Neutrophils"],["B","Macrophages"],["C","Lymphocytes"],["D","Eosinophils"]],"k":"A","ks":["A"],"r":[["Neutrophils are the first responders in acute inflammation. They arrive and proliferate within the first 6–24 hours after injury or infection","own",""],["Macrophages → Appear later, typically 24–48 hours post-injury, they clean up debris and orchestrate repair.","own",""],["Lymphocytes → Associated with chronic inflammation, not acute.","own",""],["Eosinophils → Involved in parasitic infections and allergic reactions, not early acute inflammation.","own",""]],"t":"UNC","sub":"LE1 recall","f":[]},"27b:4":{"id":"27b:4","ex":"2027 LE3","y":2027,"n":4,"p":2,"s":"Which of the following dermal changes is responsible for redness of the cheeks after exposure to the sun?","c":[["A","Transdermal fluid exudation"],["B","Vasodilation"],["C","Edema"],["D","Hemolysis"]],"k":"B","ks":["B"],"r":[["Transdermal fluid exudation: Causes swelling, not redness, usually seen in severe inflammation or blistering.","own",""],["Vasodilation: Increased blood flow to superficial vessels after UV exposure causes erythema (redness).","own",""],["Edema: Results in swelling, not the primary reason for the red appearance.","own",""],["Hemolysis: Destruction of RBCs is not a typical mechanism in sun-induced redness. No hemolysis in sunburn.","own",""]],"t":"UNC","sub":"LE1 recall","f":[65]},"27b:5":{"id":"27b:5","ex":"2027 LE3","y":2027,"n":5,"p":2,"s":"Which of the following is a characteristic of an exudate?","c":[["A","Clear appearance"],["B","Low protein"],["C","High leukocytes"],["D","Presence of fibrin"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"LE1 recall","bm":1,"f":[71]},"27b:6":{"id":"27b:6","ex":"2027 LE3","y":2027,"n":6,"p":2,"s":"A patient that suddenly experiences cerebrovascular stroke had a history of aortic valve endocarditis. most likely, the stroke was caused by what?","c":[["A","Arterial embolization"],["B","Cerebral venous thrombotic occlusion"],["C","paradoxical embolism"],["D","Disseminated intravascular coagulopathy"]],"k":"A","ks":["A"],"r":[["Arterial embolization is a surgical procedure used to cut off arterial blood flow to tumors, aneurysms, fibroids and other growths. No surgical procedure was performed.","own",""],["Cerebral venous thrombotic occlusion refers to a stroke caused by venous occlusion via thrombus. Whilst it's possible for a vegetation to break off the valve and cause a CVA, it's rare that this will happen in the venous circulation, and not in the arterial or capillary circulation first.","own",""],["Paradoxical embolism is when an embolism travels from the right to the left side of the heart without passing the pulmonary circulation. This is usually caused by heart septal wall malformations (Patent Foramen Ovale, Ventricular Septal Defect, Tetralogy of Fallot).","own",""],["Disseminated intravascular coagulopathy (DIC) is a condition where clots form throughout the body, one of it's most common causes being sepsis. This is the most likely cause of the stroke, as DIC is usually caused by sepsis from Gram Negative Bacteria (who can activate DIC through their endotoxin, LPS). Some notable gram negative organisms associated with infective endocarditis are the HACEK group: ● Haemophilus parainfluenzae/aphrophilus ● Aggregetibacter Actinomycetemcomitans ● Cardiobacterium Hominis ● Eikenella ● Kingella Reference trans/ : 2026 trans:","own",""]],"t":"UNC","sub":"LE1 recall","bm":1,"orig":"Arterial embolization is a surgical procedure used to cut off arterial blood flow to tumors, aneurysms, fibroids and other growths. No surgical procedure was performed. Cerebral venous thrombotic occlusion refers to a stroke caused by venous occlusion via thrombus. Whilst it's possible for a vegetation to break off the valve and cause a CVA, it's rare that this will happen in the venous circulation, and not in the arterial or capillary circulation first. Paradoxical embolism is when an embolism travels from the right to the left side of the heart without passing the pulmonary circulation. This is usually caused by heart septal wall malformations (Patent Foramen Ovale, Ventricular Septal Defect, Tetralogy of Fallot). | Disseminated intravascular coagulopathy (DIC) is a condition where clots form throughout the body, one of it's most common causes being sepsis. This is the most likely cause of the stroke, as DIC is usually caused by sepsis from Gram Negative Bacteria (who can activate DIC through their endotoxin, LPS). Some notable gram negative organisms associated with infective endocarditis are the HACEK group: ● Haemophilus parainfluenzae/aphrophilus ● Aggregetibacter Actinomycetemcomitans ● Cardiobacterium Hominis ● Eikenella ● Kingella Reference trans/ : 2026 trans:","f":[]},"27b:7":{"id":"27b:7","ex":"2027 LE3","y":2027,"n":7,"p":3,"s":"What is the pathophysiology behind pulmonary edema in congestive heart failure?","c":[["A","Low oncotic pressure"],["B","Endothelial injury"],["C","High hydrostatic pressure"],["D","Increased vascular permeability"]],"k":"C","ks":["C"],"r":[["Occurs in nephrotic syndrome or hypoalbuminemia","own",""],["Seen in conditions like acute respiratory distress syndrome (ARDS) or inflammation","own",""],["An elevated hydrostatic pressure in the pulmonary capillaries causes fluid to leak into the interstitial space and alveoli, leading to pulmonary edema.","own",""],["Occurs in inflammatory or infectious processes.","own",""]],"t":"UNC","sub":"LE1 recall","f":[73]},"27b:8":{"id":"27b:8","ex":"2027 LE3","y":2027,"n":8,"p":3,"s":"This is the final product of the coagulation sequence","c":[["A","Thromboplastin"],["B","Thrombin"],["C","Fibrinogen"],["D","Fibrin"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: mong these are nicotine, which is responsible for tobacco addiction, and potent carcinogens-- mainly, PAH, NKK, and aromatic amines. Nicotine also has other adverse effects particularly on fetal development, and is associated with preterm birth and stillbirth.","f":[]},"27b:13":{"id":"27b:13","ex":"2027 LE3","y":2027,"n":13,"p":5,"s":"Which of the following microscopic findings, most likely indicate that the neoplasm is malignant?","c":[["A","Pleomorphism"],["B","Atypia"],["C","Invasion"],["D","Increased/Nuclear Cytoplasmic Ratio"]],"k":"C","ks":["C"],"r":[["Pleomorphism is variation in size and shape of cells and nuclei. It is a feature of anaplasia that suggests but does not prove malignancy.","gen",""],["Atypia refers to abnormal cytologic features. It can be seen in dysplasia and is not proof of malignancy.","gen",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["An increased nuclear to cytoplasmic ratio reflects nuclear enlargement (the nucleus is normally about one quarter of the cell). It is a cytologic clue only.","gen",""]],"t":"N1","sub":"","bm":1,"f":[17]},"27b:14":{"id":"27b:14","ex":"2027 LE3","y":2027,"n":14,"p":5,"s":"A firm nodule on the fundal portion of the uterus is noted in a 35-year-old woman. By ultrasound, it is solid and well-circumscribed. Which of the following neoplasms does she most likely have?","c":[["A","Leiomyoma"],["B","Leiomyosarcoma"],["C","Metastatic tumor"],["D","Hemangioma"]],"k":"A","ks":["A"],"r":[["Leiomyoma: Benign neoplasm of the smooth muscle. Benign tumors are commonly described as solid and well-circumscribed.","own",""],["Leiomyosarcoma: Malignant neoplasm of the smooth muscle.","own",""],["Metastatic Tumor: Describes malignant neoplasms.","own",""],["Hemangioma: Benign neoplasm of blood vessels.","own",""]],"t":"N1","sub":"","ref":"2027 Trans (3A - Neoplasia)","f":[139]},"27b:15":{"id":"27b:15","ex":"2027 LE3","y":2027,"n":15,"p":5,"s":"A 41 year old, commercial sex female worker had an exophytic 3 cm mass of the ectocervix. History of 60 pack years and diabetes for 10 years. Pap smear cytologic changes are consistent with squamous cell carcinoma. Which of the following is the most likely risk factor for her cervical carcinoma","c":[["A","Human Papillomavirus"],["B","Diabetes Mellitus Type 2"],["C","Cigarette Smoking"],["D","Pelvic Inflammatory Disease"]],"k":"A","ks":["A"],"r":[["Human Papillomavirus may be sexually transmitted. Long lasting persistent infection with HPV causes virtually all cervical cancers.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"N2","sub":"","bm":1,"orig":"Human Papillomavirus may be sexually transmitted. Long lasting persistent infection with HPV causes virtually all cervical cancers.","ref":"2027 DR RUEDA-CU LE2 Ratio","f":[31]},"27b:16":{"id":"27b:16","ex":"2027 LE3","y":2027,"n":16,"p":5,"s":"Hepatitis B is associated with which of the following neoplasms?","c":[["A","Hepatocellular adenoma"],["B","Hepatoblastoma"],["C","Hepatocellular carcinoma"],["D","Cholangiocarcinoma"]],"k":"C","ks":["C"],"r":[["Hepatocellular adenoma is a benign neoplasm that typically occurs in young women and is strongly associated with use of oral contraceptives and anabolic steroids.","own",""],["Hepatoblastoma is a rare hepatocellular tumor that occurs in the pediatric setting. Hepatitis B virus (HBV) is linked to","own",""],["hepatocellular carcinoma due to its oncogenic effects, including chronic inflammation, hepatocyte proliferation, and activation of carcinogenic pathways via HBx protein. It accounts for 70–85% of hepatocellular carcinomas worldwide. Intrahepatic","own",""],["cholangiocarcinoma usually occurs in the noncirrhotic liver and typically forms a firm gray-white mass. (10th Ed.)","own",""]],"t":"ID2","sub":"","bm":1,"orig":"Hepatocellular adenoma is a benign neoplasm that typically occurs in young women and is strongly associated with use of oral contraceptives and anabolic steroids. | Hepatoblastoma is a rare hepatocellular tumor that occurs in the pediatric setting. | Hepatitis B virus (HBV) is linked to hepatocellular carcinoma due to its oncogenic effects, including chronic inflammation, hepatocyte proliferation, and activation of carcinogenic pathways via HBx protein. It accounts for 70–85% of hepatocellular carcinomas worldwide. | Intrahepatic cholangiocarcinoma usually occurs in the noncirrhotic liver and typically forms a firm gray-white mass. | (10th Ed.)","ref":"Robbins & Cotran Pathologic Basis of Disease","f":[31]},"27b:17":{"id":"27b:17","ex":"2027 LE3","y":2027,"n":17,"p":6,"s":"All of the following are modes of transmission of the monkeypox virus. Which of the following is the EXCEPTION?","c":[["A","Through the bite of an infected mosquito"],["B","Close physical contact with infectious lesions"],["C","Close physical contact with respiratory secretions"],["D","Contact with contaminated beddings"]],"k":"A","ks":["A"],"r":[["Mpox spreads from person to person mainly through close contact with someone who has Mpox. Close contact includes: ● skin-to-skin (such as touching or sex) ● mouth-to-mouth or mouth-to-skin contact (such as kissing) ● being face-to-face with someone who has Mpox (such as talking or breathing close to one another, which can generate infectious respiratory particles) ● People can also contract Mpox from contaminated objects such as clothing or linen.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Monkeypox (not in the lecture set)","bm":1,"orig":"Mpox spreads from person to person mainly through close contact with someone who has Mpox. Close contact includes: ● skin-to-skin (such as touching or sex) ● mouth-to-mouth or mouth-to-skin contact (such as kissing) ● being face-to-face with someone who has Mpox (such as talking or breathing close to one another, which can generate infectious respiratory particles) ● People can also contract Mpox from contaminated objects such as clothing or linen.","ref":"2027 LE 2 PATHOLOGY EXAM FEEDBACK, WHO","f":[54]},"27b:18":{"id":"27b:18","ex":"2027 LE3","y":2027,"n":18,"p":6,"s":"A patient has a WBC count of 30,000/cu mm. Peripheral smear shows blast cells with the presence of Auer rods. Which stain is most likely to be positive for these cells?","c":[["A","PAS"],["B","Myeloperoxidase"],["C","TdT"],["D","Esterase"]],"k":"B","ks":["B"],"r":[["PAS (Periodic Acid-Schiff) is positive for lymphoid tumors.","own",""],["Myeloperoxidase (MPO) is a cytochemical stain that identifies myeloid lineage. Auer rods are coalescent granules in myelogenous cells. This therefore indicates myelogenous type of leukemia.","own",""],["Terminal deoxynucleotidyl transferase (TdT) is positive for lymphoid tumors.","own",""],["Esterase is positive for monocytic tumors.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"2027 LE 2 PATHOLOGY EXAM","f":[87]},"27b:19":{"id":"27b:19","ex":"2027 LE3","y":2027,"n":19,"p":6,"s":"What PBS Abnormality can be seen in Megaloblastic Anemia?","c":[["A","Dohle bodies"],["B","Hypersegmented neutrophils"],["C","Smudge cells"],["D","Heinz bodies"]],"k":"B","ks":["B"],"r":[["Dohle bodies: Nonspecific finding typically found in association with bacterial infections, sepsis, and pregnancy.","own",""],["Hypersegmented neutrophils: Characteristic for Megaloblastic Anemia, where the PMNs have 6 or more lobes instead of 3–5.","own",""],["Smudge cells: Characteristic for Chronic Lymphocytic Leukemia, where pale cells appear flattened and larger than adjacent lymphocytes. They have no definite nuclei and have irregular smudged margins.","own",""],["Heinz bodies: Characteristic for Glucose 6-Phosphate Dehydrogenase Deficiency Anemia, where these bodies manifest as precipitates of denature globin in RBCs. They can be shown through supravital staining.","own",""]],"t":"UNC","sub":"RBC/WBC disorders","ref":"[PTH LAB - LE 2] 04 - RBC/WBC Diseases & Rodak's Hematology: Clinical Principles and Applications (5th Edition)","f":[82]},"27b:20":{"id":"27b:20","ex":"2027 LE3","y":2027,"n":20,"p":7,"s":"Type IV hypersensitivity is often referred to as:","c":[["A","Immediate"],["B","Delayed"],["C","Anaphylactic"],["D","Anergic"]],"k":"B","ks":["B"],"r":[["Immediate hypersensitivity is Type I: antigen binds IgE on mast cells and triggers a rapid reaction (allergy).","gen",""],["Anergic: Immunological unresponsiveness","own",""],["Anaphylactic describes the systemic form of Type I, IgE and mast cell mediated hypersensitivity.","gen",""],["Anergy is T cell unresponsiveness that results when antigen is recognised (signal 1) without costimulation (signal 2). It is a tolerance mechanism, not a hypersensitivity type.","gen",""]],"t":"I1","sub":"","bm":1,"orig":"Anergic: Immunological unresponsiveness","f":[0]},"27b:21":{"id":"27b:21","ex":"2027 LE3","y":2027,"n":21,"p":7,"s":"The most common cause of death among infants in the USA is:","c":[["A","Sudden infant Death Syndrome (SIDS)"],["B","Congenital anomalies"],["C","Prematurity"],["D","Accidents"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"f":[94]},"27b:22":{"id":"27b:22","ex":"2027 LE3","y":2027,"n":22,"p":7,"s":"This statement is FALSE about Congenital Anomalies:","c":[["A","The term “Congenital” in congenital anomalies means “born with” or present at birth but does not imply or exclude a genetic basis for the birth defect."],["B","Some congenital anomalies may be clinically apparent in later years."],["C","The known causes of congenital anomalies are grouped into genetic, environmental and multifactorial categories."],["D","With the advancement in molecular studies, the exact cause of about 20% of congenital anomalies remain unknown."]],"k":"D","ks":["D"],"r":[["True. The term \"congenital\" does indeed refer to conditions present at birth, regardless of whether the cause is genetic, environmental, or multifactorial. It doesn’t exclusively imply a genetic origin nor exclude it Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["True. While congenital anomalies are present at birth, some may not manifest clinically until later in life. Examples include some cardiac defects or metabolic conditions, which might not be detected immediately but only after specific symptoms or diagnostic investigations. Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["True Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["False. Not all causes of congenital anomalies are not yet fully understood. Many remain unexplained and may result from complex interactions between genetic factors, environmental influences, and multifactorial processes. Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Infancy and childhood","ref":"[PTH LAB - LE 3] 01 - Diseases of Infancy and Childhood (V1)","f":[]},"27b:23":{"id":"27b:23","ex":"2027 LE3","y":2027,"n":23,"p":7,"s":"A full-term infant develops vomiting and diarrhea a few days after birth. There was jaundice at the end of the first week, and cataract formation at one month. The developmental milestones were not met at age 1. The child dies of Escherichia coli septicemia at age 2. Which deficiency is most likely present in the child?","c":[["A","Phenylalanine hydroxylase"],["B","Galactose-1-phosphate uridyltransferase"],["C","Globin chains"],["D","Hexosaminidase"]],"k":"B","ks":["B"],"r":[["Phenylalanine hydroxylase deficiency may cause phenylketonuria, an autosomal recessive illness wherein the infant is normal at birth, but an increase in phenylalanine within a few weeks impairs brain development that can result in severe mental retardation within 6 months. Manifestations: ● ⅓ never able to walk ● ⅔ cannot talk ● Seizures ● Eczema, DEC pigmentation of hair & skin ● Strong musty or mousy odor (sweat & urine)","own",""],["Galactose-1-phosphate uridyltransferase Galactosemia is an autosomal recessive disorder that affects galactose metabolism due to the total lack of GALT or deficiency of galactokinase. Clinical manifestations: ● Failure to thrive almost from birth ● Vomiting & diarrhea within a few days of milk ingestion ● Jaundice & hepatomegaly (within first few weeks) ● Opacification of lens (within a few weeks) ● Mental retardation in 6-12 months (less severe than PKU)","own",""],["Globin chains Alpha and beta thalassemia may be caused by a deficiency of globin chains, it is an inherited hematologic disorder that may result in ineffective erythropoiesis. May be symptomatic or asymptomatic depending on the number of genes affected.","own",""],["Hexosaminidase Tay-sachs disease is a fatal, inherited, neurodegenerative disorder that is caused by hexosaminidase-A enzyme deficiency.","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"[PTH LAB - LE 3] 01 - Diseases of Infancy and Childhood (V1) Bajwa, H., & Basit, H. (2023, August 8). Thalassemia. Nih.gov; StatPearls Publishing. https://www.ncbi.nlm.nih.gov/books/NBK545151/ Ramani, P. K., & Parayil Sankaran, B. (2022, October 31). Tay-Sachs Disease. PubMed; StatPearls Publishing. https://www.ncbi.nlm.nih.gov/books/NBK564432/","f":[95]},"27b:24":{"id":"27b:24","ex":"2027 LE3","y":2027,"n":24,"p":8,"s":"Which of the following correctly highlights the interplay of environmental teratogens, intrinsic genetic defects, and congenital disease?","c":[["A","Cyclopamine: Disruption of the expression of homeobox (HOX) proteins: Holoprosencephaly and cyclopia"],["B","Valproic acid: Deregulation of Hedgehog signaling pathway: Valproic acid embryopathy"],["C","Retinol: Deregulation of TGF-B signaling pathway: CNS, cardiac, and craniofacial defects, like cleft lip and cleft palate"],["D","Intrauterine infections: Mutation of the CFTR gene: Potter sequence"]],"k":"C","ks":["C"],"r":[["Cyclopamine: Disruption of Hedgehog signaling pathway: Holoprosencephaly and cyclopia","own",""],["Valproic acid: Disruption of the expression of homeobox (HOX) proteins: Valproic acid embryopathy","own",""],["Retinol: Disruption of TGF-B signaling pathway: CNS, cardiac, and craniofacial defects","own",""],["Intrauterine infections: Prematurity","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"Diseases of Infancy and Childhood (2027)","f":[]},"27b:25":{"id":"27b:25","ex":"2027 LE3","y":2027,"n":25,"p":8,"s":"A 3-year old boy presents a large abdominal mass, fever, weight loss, and bone pain. CT scan shows a discrete, localized mass in the right adrenal gland which was subsequently excised. Histology shows small round blue cells concentrically arranged around a central space filled with neuropil. The most probable diagnosis is:","c":[["A","Wilm’s tumor"],["B","Teratoma"],["C","Neuroblastoma"],["D","Hemangioma"]],"k":"C","ks":["C"],"r":[["Wilm’s Tumor: Classified under malignant tumors of childhood (Round blue cell tumors). Most common primary RENAL tumor in children. Microscopic appearance includes 3 components: blastemal, epithelial, and stromal.","own",""],["Teratoma: Can have it at 2 years old or late adolescence and early adulthood. Sacrococcygeal teratomas are the most common teratoma in childhood, more common in girls, 75% are benign and usually located in hindgut, testis, ovaries, mediastinum, retroperitoneum, head and neck","own",""],["Neuroblastoma: Present large abdominal mass, fever, weight loss, and bone pain. One of the malignant tumors of childhood (small round blue cell tumors). Anatomic sites can be used for differential diagnosis and this type of tumor is 40% located in the adrenal medulla. Unique microscopic appearance includes neuropil (fibrillary material)","own",""],["Hemangioma: A benign tumor and not classified under small round blue cell tumors. Seen mostly on the skin of the face and scalp. Flat (port-wine stains) to elevated, red blue color that may enlarge as the child grows. Usually spontaneously regress","own",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"Wilm’s Tumor: Classified under malignant tumors of childhood (Round blue cell tumors). Most common primary RENAL tumor in children. Microscopic appearance includes 3 components: blastemal, epithelial, and stromal. | Teratoma: Can have it at 2 years old or late adolescence and early adulthood. Sacrococcygeal teratomas are the most common teratoma in childhood, more common in girls, 75% are benign and usually located in hindgut, testis, ovaries, mediastinum, retroperitoneum, head and neck | Neuroblastoma: Present large abdominal mass, fever, weight loss, and bone pain. One of the malignant tumors of childhood (small round blue cell tumors). Anatomic sites can be used for differential diagnosis and this type of tumor is 40% located in the adrenal medulla. Unique microscopic appearance includes neuropil (fibrillary material) | Hemangioma: A benign tumor and not classified under small round blue cell tumors. Seen mostly on the skin of the face and scalp. Flat | (port-wine stains) to elevated, red blue color that may enlarge as the child grows. Usually spontaneously regress","ref":"2027 [PTH LEC - LE 3] 01 - Diseases of Infancy and Childhood","f":[96]},"27b:26":{"id":"27b:26","ex":"2027 LE3","y":2027,"n":26,"p":9,"s":"A 2 year old girl with a large port wine-stain on the right side of her face, appearing as a flat reddish blue, nontender lesions. Histologically, what is the formation of the main tissue component?","c":[["A","Neurofibroblast"],["B","Lymphatic vessels"],["C","Capillaries"],["D","Myofibroblast"]],"k":"C","ks":["C"],"r":[["Neurofibroblasts are precursors to Scwann cells","own",""],["Primary disorders are extremely uncommon and are usually secondary to inflammation or malignancies","own",""],["Special form of nevus flammeus. Port wine stains result from abnormally dilated dermal capillaries. It is characterized with a large facial telangiectasia with skin thickening and persisting over time.","own",""],["Myofibroblasts are specialized fibroblasts with contractile properties. They play a role in wound healing, tissue remodeling, and fibrosis","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"2027 [PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[]},"27b:27":{"id":"27b:27","ex":"2027 LE3","y":2027,"n":27,"p":9,"s":"A 19 year old mother found her 3-month-old baby boy dead in his crib while in prone position. He was previously healthy and showed no signs of distress when she put him in his crib 1 hour earlier. Based on the medical history, the baby was born at term following an uncomplicated pregnancy. He had been feeding well and gaining weight normally. Which of the following conditions during pregnancy most likely led to this infant’s findings?","c":[["A","Hyaline Membrane Disease"],["B","Cytomegalovirus"],["C","Adrenal neuroblastoma"],["D","No gross abnormalities"]],"k":"D","ks":["D"],"r":[["Hyaline Membrane Disease would have presented symptoms such as difficulty breathing and cyanosis within 30 minutes after birth. Conditions during pregnancy that may cause hyaline membrane disease are mothers with diabetes, premature birth, or excessive sedation of the mother.","own",""],["CMV causes fetal abnormalities that may restrict normal fetal growth, a condition not seen in the baby boy patient as he has been feeding well and gaining weight normally.","own",""],["Adrenal Neuroblastoma is an extracranial solid tumor of childhood that would have presented symptoms such as large abdominal mass, fever, and weight loss, as well as manifest multiple cutaneous metastases seen as deep blue discoloration in neonates.","own",""],["Sudden Infant Death Syndrome (SIDS) is a sudden death of an infant <1 year in age that is unexplained even after a thorough case investigation (e.g. autopsy, exam of death scene, and review of clinical history). The infant would usually die in a prone or side sleeping position at night. Parental risk factors that may lead to SIDS include: ● Young maternal age (<20 years old) ● Maternal smoking during pregnancy ● Drug abuse in either parent (e.g. marijuana, opiates, cocaine) ● Late or no prenatal care ● Low socioeconomic status ● African-American and American-Indian ethnicity","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"2027 [PTH LEC - LE 3] 01 - Diseases of Infancy and Childhood","f":[97]},"27b:28":{"id":"27b:28","ex":"2027 LE3","y":2027,"n":28,"p":9,"s":"A 24 year old woman is 38th week pregnant, reported no fetal movement for 1 day. The next day, the still born baby was delivered viganally. On PE, there are no external anomalies. A placental examination shows chorioamnionitis. Which among the etiologic agents is most likely responsible for this event?","c":[["A","Cytomegalovirus"],["B","Treponema Pallidum"],["C","Group B Streptococcus"],["D","Herpes simplex virus"]],"k":"C","ks":["C"],"r":[["CMV causes fetal abnormalities such as Chromosomal abnormalities (Trisomies), congenital anomalies (not present in PE of the patient), congenital infections (TORCH). “Mnemonics: TORCH” T-Toxoplasmosis O-Others (Syphilis, Hepa B) R- Rubella C-Cytomegalovirus H- Herpes Simplex Virus","own",""],["Syphilis caused by T. pallidum can lead to stillbirth through transplacental (hematologic) infection but typically presents with placentitis, not chorioamnionitis.","own",""],["In the first 7 days of life (early onset), perinatal sepsis is a common cause of Group B Streptococcus that leads to intrauterine infection mainly with chorioamnionitis (inflammation of placental membrane).","own",""],["HSV can cause stillbirth or neonatal infection but is usually associated with skin lesions and does not typically cause chorioamnionitis.","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"2026 trans [Disease of Infancy]","f":[103]},"27b:29":{"id":"27b:29","ex":"2027 LE3","y":2027,"n":29,"p":10,"s":"At 36 weeks age of gestation, a 28-year old mother gave birth to an infant with flattened facies and dislocated hips. The mother admitted noticing very little fetal movement during her pregnancy. Which of the following conditions affecting the infant best explains these findings?","c":[["A","Maternal Diabetes Mellitus"],["B","Trisomy 13"],["C","Bilateral renal agenesis"],["D","Hyaline membrane disease"]],"k":"C","ks":["C"],"r":[["Maternal DM is a risk factor for Neonatal Respiratory Distress Syndrome","own",""],["Trisomy 13 presents with cleft lip, cleft palate, and sever cardiac malformations","own",""],["The characteristics of the infant is the classic presentation of the Potter sequence which consists of flattened facies, clubbed feet, and dislocated hips and is caused by the fetal kidneys not producing urine which is a key component of amniotic fluid. Due to the decreased amniotic fluid (oligohydramnios) the fetus is compressed.","own",""],["Hyaline Membrane Disease A.k.a. Neonatal Respiratory Distress Syndrome which is caused by a decreased synthesis of lung surfactant and does not cause flattened facies and dislocated hips","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"2027 [PTH LEC - LE 3] 01 - Diseases of Infancy and Childhood","f":[104]},"27b:30":{"id":"27b:30","ex":"2027 LE3","y":2027,"n":30,"p":10,"s":"A term male infant was born following an uncomplicated pregnancy. He weighs 2200 grams and on examination has no congenital anomalies. APGAR scores are 8 at 1 minute and 9 at 5 minutes. The head circumference is within normal range but other body measurements are decreased. Which of the following risk factors or conditions during pregnancy most likely led to this infant’s findings?","c":[["A","Triploidy"],["B","Toxoplasmosis"],["C","Single umbilical artery"],["D","Cytomegalovirus infection"]],"k":"C","ks":["C"],"r":[["Triploidy A chromosomal abnormality causing proportionate fetal growth restriction (FGR)","own",""],["TORCH: Toxoplasmosis, Other (such as syphilis, varicella, mumps, parvovirus, and HIV), Rubella, Cytomegalovirus, Herpes simplex These diseases cause proportionate FGR: symmetric growth restriction and all organ systems are similarly affected","own",""],["Placental abnormality causes disproportionate FGR: Asymmetric growth retardation of fetus (relative sparing of the brain) This explains why the infant has a head circumference that is within the normal range but other body measurements are decreased.","own",""],["Included in TORCH Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Infancy and childhood","f":[98]},"27b:31":{"id":"27b:31","ex":"2027 LE3","y":2027,"n":31,"p":10,"s":"A female infant is born at 33 weeks age of gestation and her height and weight falls within the 50th percentile. She received prophylactic exogenous surfactant and does not develop respiratory distress. On the third day of life, the infant presents with abdominal distention, absent bowel sounds, and bloody stools and hypotension. Abdominal radiograph shows gas within the intestinal wall (pneumatosis intestinalis). Which of the following conditions that require resection of the bowel is most likely to be present in this infant?","c":[["A","Meconium ileus"],["B","Pyloric stenosis"],["C","Duodenal atresia"],["D","Necrotizing enterocolitis"]],"k":"D","ks":["D"],"r":[["Meconium ileus Blockage in the intestines caused by thick, sticky meconium (baby’s first stool)","own",""],["Pyloric stenosis: A condition in infants where the pylorus thickens and enlarges, blocking the passage.","own",""],["Duodenal atresia: A congenital condition in which a portion of the duodenum is absent or closed off, leading to a blockage that prevents food from passing from the stomach into the intestines.","own",""],["Necrotizing enterocolitis is the most common in premature infants. The involved segment is distended, friable, and congested (with hemorrhagic infarction) or gangrenous. Submucosal gas bubbles (pneumatosis intestinalis) are present.","own",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"Meconium ileus Blockage in the intestines caused by thick, sticky meconium (baby’s first stool) | P
