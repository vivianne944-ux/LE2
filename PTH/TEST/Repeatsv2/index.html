ationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["P. jirovecii is considered a yeast-like fungus. It has 3 forms – cysts, sporocytes and trophozoites, of which trophozoites are the smallest form. It does not have a hypha form and it is considered an opportunistic infection.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID6","sub":"","bm":1,"orig":"P. jirovecii is considered a yeast-like fungus. It has 3 forms – cysts, sporocytes and trophozoites, of which trophozoites are the smallest form. It does not have a hypha form and it is considered an opportunistic infection.","f":[]},"28a:75":{"id":"28a:75","ex":"2028 LE2","y":2028,"n":75,"p":19,"s":"Which of the following is not part of the protective response against Candidiasis?","c":[["A","Free iron"],["B","Macrophage"],["C","Neutrophil"],["D","ThC17 Cells"]],"k":"A","ks":["A"],"r":[["Free iron increases probability of infection in Mucormycosis, so it is not a protective response. All the others form part of the host’s protective immune response against Candidiasis.","own",""],["macrophages, and Th17 cells are natural protection against Candida infections.","own",""],["Characteristic of an acute inflammatory response (first 6-24 hours). Few may be seen but giant cells are more specific","bor","2027 LE2 Q5"],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID6","sub":"","bm":1,"orig":"Neutrophils, macrophages, and Th17 cells are natural protection against Candida infections. Free iron increases probability of infection in Mucormycosis, so it is not a protective response. All the others form part of the host’s protective immune response against Candidiasis.","ref":"[2028] Infectious Diseases II: Fungal Infections","f":[]},"28a:76":{"id":"28a:76","ex":"2028 LE2","y":2028,"n":76,"p":19,"s":"High levels of parasitemia are observed in all of the following. What is the exception?","c":[["A","Babesiosis"],["B","Acute Chagas Disease"],["C","P. vivax malaria"],["D","All choices cause high levels of parasitemia"]],"k":"C","ks":["C"],"r":[["Babesiosis can result in severe and fatal parasitemia, particularly in debilitated or splenectomized individuals","own",""],["Acute Chagas Disease (caused by Trypanosoma cruzi) is mild in most cases. However, in rare instances, it is characterized by high parasitemia, accompanied by fever, progressive cardiac failure, and generalized lymphadenopathy.","own",""],["P. vivax malaria is associated with low levels of parasitemia. In contrast, P. falciparum is associated with high levels of parasitemia and is notorious for causing fatal parasitemia","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID7","sub":"","bm":1,"orig":"Babesiosis can result in severe and fatal parasitemia, particularly in debilitated or splenectomized individuals | Acute Chagas Disease (caused by Trypanosoma cruzi) is mild in most cases. However, in rare instances, it is characterized by high parasitemia, accompanied by fever, progressive cardiac failure, and generalized lymphadenopathy. | P. vivax malaria is associated with low levels of parasitemia. In contrast, P. falciparum is associated with high levels of parasitemia and is notorious for causing fatal parasitemia","ref":"Infectious Diseases II: Parasitic Infections","f":[60]},"28a:77":{"id":"28a:77","ex":"2028 LE2","y":2028,"n":77,"p":19,"s":"Which of the following parasitic infections can be diagnosed using blood films?","c":[["A","Strongyloidiasis"],["B","Filariasis"],["C","Trichinosis"],["D","Onchocerciasis"]],"k":"B","ks":["B"],"r":[["Diagnosed by larvae in stool","own",""],["Filariasis (caused by Wuchereria bancrofti, Brugia malayi, etc.) is diagnosed by identifying microfilariae in a peripheral blood film, usually collected at night (for nocturnal periodic species).","own",""],["Diagnosed by muscle biopsy or serology","own",""],["Diagnosed by microfilariae in skin snips, not blood.","own",""]],"t":"ID7","sub":"","ref":"2028 Trans - Infectious Diseases II: Parasitic Infections","f":[62]},"28a:78":{"id":"28a:78","ex":"2028 LE2","y":2028,"n":78,"p":20,"s":"42/M was brought in for consult due to worsening headache and seizures. CT scan revealed multiple calcified lesions in the brain parenchyma. Cysts containing scolices were seen on biopsy. What is the parasitic infection that occurs through this mode of transmission?","c":[["A","Ingestion of food contaminated with Taenia solium ova"],["B","Ingestion of food contaminated with Echinococcus granulosus ova"],["C","Ingestion of undercooked pork with larval cysticerci"],["D","Skin penetration by larvae"]],"k":"A","ks":["A"],"r":[["This case describes neurocysticercosis caused by T. solium. Of the choices, (A) would result in larval encystment in the brain.","own",""],["Echinococcus granulosus ova hatch in the duodenum and the larvae invade liver, lungs and bones to form hydatid cysts.","gen",""],["Eating undercooked meat containing cysticerci completes the tapeworm life cycle and gives an intestinal adult worm. It does not cause cysticercosis, which needs ingestion of ova.","gen",""],["Larval skin penetration is how hookworm, Strongyloides and schistosome cercariae enter. Taenia is acquired by ingestion.","gen",""]],"t":"ID7","sub":"","bm":1,"orig":"This case describes neurocysticercosis caused by T. solium. Of the choices, (A) would result in larval encystment in the brain.","ref":"2028 Trans - Infectious Diseases II: Parasitic Infections & LE 2 Feedback","f":[58]},"28a:79":{"id":"28a:79","ex":"2028 LE2","y":2028,"n":79,"p":20,"s":"A 23/M foreign exchange student reported slurred speech and excessive daytime sleepiness. On interview, he recalled being bitten by “some insect” and developing a raised red sore on a visit to Nigeria several months before. He also presents with seizures and cachexia. What is the parasitic infection he most likely has:","c":[["A","Babesia microti"],["B","Leishmania donovani"],["C","Trypanosoma cruzi"],["D","Trypanosoma brucei gambiense"]],"k":"D","ks":["D"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["The symptoms described (sleeping disturbance, history of visit to a West African country, development of a chancre) are suggestive of Sleeping sickness/ African trypanosomiasis caused by T. brucei gambiense. Second stage trypanosomiasis presents with worsening neurologic symptoms and can be a chronic infection.","own",""]],"t":"ID7","sub":"","bm":1,"orig":"The symptoms described (sleeping disturbance, history of visit to a West African country, development of a chancre) are suggestive of Sleeping sickness/ African trypanosomiasis caused by T. brucei gambiense. Second stage trypanosomiasis presents with worsening neurologic symptoms and can be a chronic infection.","f":[]},"28a:80":{"id":"28a:80","ex":"2028 LE2","y":2028,"n":80,"p":20,"s":"A 53/M complains of a shallow expanding ulcer with heaped-up borders noted on his right forearm. The lesion persisted for 6 months and resolves without treatment. What are the clinical features described consistent with?","c":[["A","Cutaneous leishmaniasis"],["B","Diffuse cutaneous leishmaniasis"],["C","Mucocutaneous leishmaniasis"],["D","Visceral leishmaniasis"]],"k":"A","ks":["A"],"r":[["Begins as itching papules, shallow expanding ulcers with heaped-up borders","own",""],["Begins with a single skin nodule and continues spreading","own",""],["Moist, ulcerating or non-ulcerating lesions in the nasopharyngeal areas","own",""],["Presents with severe systemic infection","own",""]],"t":"ID7","sub":"","ref":"Infectious Diseases II: Parasitic infections p. 4","f":[59]},"28a:81":{"id":"28a:81","ex":"2028 LE2","y":2028,"n":81,"p":20,"s":"Which of the following is/are true regarding the development of atherosclerosis? I. Vasospasm is the cornerstone of the response-to-injury II. The key processes in atherosclerosis are intimal thickening and lipid accumulation III. Atherosclerotic plaques have three principal components: cells, extracellular matrix, and extracellular lipid IV. Fatty streaks are the earliest lesion in atherosclerosis","c":[["A","II and IV only"],["B","II, III, and IV only"],["C","IV only"],["D","All of the above"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Endothelial cell injury is the cornerstone of the response to injury hypothesis of atherosclerosis. Atherosclerosis ● Arteries are hardened due to deposits of basic lesions of intimal atheroma or fibro-fatty plaques. Response-to-injury Hypothesis: ● Endothelial injury and dysfunction causes intimal proliferation. ● Lipid accumulation at the site of injury. Essential components that make up an atheroma: ● Cells: Smooth muscle, macrophages, leukocytes (T-lymphocytes). ● Connective tissue extracellular matrix: Collagen, elastic fibers, proteoglycans. ● Intra and Extracellular lipid: cholesterol and cholesterol esters. ○ Extracellularly, appearing as clear spaces simulating needle clefts and irregular globoid shaped clear spaces. ○ Intracellularly, within the cytoplasm of the macrophages (foam cells). Fatty Streak ● Precursor lesion of atherosclerosis.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Characteristic clinical feature of restrictive CMP - due to a restrictive ventricular filling and pressure overload","bor","2027 LE3 Q79"]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Endothelial cell injury is the cornerstone of the response to injury hypothesis of atherosclerosis. | Atherosclerosis ● Arteries are hardened due to deposits of basic lesions of intimal atheroma or fibro-fatty plaques. Response-to-injury Hypothesis: | ● Endothelial injury and dysfunction causes intimal proliferation. ● Lipid accumulation at the site of injury. Essential components that make up an atheroma: ● Cells: Smooth muscle, macrophages, leukocytes (T-lymphocytes). ● Connective tissue extracellular matrix: Collagen, elastic fibers, proteoglycans. ● Intra and Extracellular lipid: cholesterol and cholesterol esters. ○ Extracellularly, appearing as clear spaces simulating needle clefts and irregular globoid shaped clear spaces. ○ Intracellularly, within the cytoplasm of the macrophages (foam cells). Fatty Streak ● Precursor lesion of atherosclerosis.","ref":"Ratio from 2027 SB 2028 [PATHOLOGY-LEC: LE2 TRANS 4A]: Pathology of Blood Vessels I: Atherosclerosis","f":[122]},"28a:82":{"id":"28a:82","ex":"2028 LE2","y":2028,"n":82,"p":21,"s":"Which of the following is most suggestive in a patient with vasculitis, where the finding of serum antineutrophil cytoplasmic autoantibodies (ANCAs) react by immunofluorescence staining in a cytoplasmic pattern (c-ANCAs)?","c":[["A","Giant cell arteritis"],["B","Classic polyarteritis nodosa"],["C","Wegener’s granulomatosis"],["D","Churg-Strauss syndrome"]],"k":"C","ks":["C"],"r":[["Giant cell arteritis (GCA) categorized as a Large Vessel Vasculitis (LVV). The pathogenesis of GCA is often listed as \"Unknown or Idiopathic\", though it is postulated to be of immunological origin. It is not generally associated with ANCA positivity in the context of this classification framework.","own",""],["Wegener's Granulomatosis (GPA): This condition, now known as Granulomatosis with Polyangiitis (GPA), is a form of small vessel vasculitis. The typical ANCA specificity associated with GPA is the anti-proteinase-3 antibody, meaning 95% of patients with GPA are positive with c-ANCA/Pro-3 ANCA.","own",""],["Classic polyarteritis nodosa (PAN) is classified as a Medium Vessel Vasculitis (MVV). It is specifically noted that Panarteritis nodosa has \"No association with anti-neutrophil cytoplasmic antibodies (ANCAs)\".","own",""],["Churg-Strauss syndrome (CSS), now termed Eosinophilic Granulomatosis with Polyangiitis (EGPA), is typically associated with a different ANCA pattern. It is an ANCA-associated Small Vessel Vasculitis. However, the ANCA positivity associated with CSS/EGPA is typically directed against myeloperoxidase (MPO). The staining pattern for MPO-ANCA is perinuclear (p-ANCA), not cytoplasmic (c-ANCA).","own",""]],"t":"UNC","sub":"Blood vessels","ref":"[PTH LEC - LE 2] 4C - Pathology of Blood Vessels II: Vasculitis & Neoplasm (V1)","f":[117]},"28a:83":{"id":"28a:83","ex":"2028 LE2","y":2028,"n":83,"p":21,"s":"A 30 year-old male smoker presents with gangrene of his extremities. Which of the following histologic findings from a biopsy of the blood vessels supplying this area would be most suggestive of the diagnosis of Buerger’s disease","c":[["A","Granulomatous inflammation with giant cell"],["B","Intimo-medial proliferation and hyperplasia"],["C","Fibrinoid necrosis with overlying thrombosis"],["D","Thrombosis with microabscess"]],"k":"D","ks":["D"],"r":[["Giant cell arteritis: inflammatory cells are mononuclear with granulomatous patterns containing multinucleated giant cells (MNGC)","own",""],["Giant cell arteritis: inflammatory cells are mononuclear with granulomatous patterns containing multinucleated giant cells (MNGC)","own",""],["Panarteritis nodosa: Intimal fibrinoid necrosis","own",""],["Buerger’s disease: Segmental, thrombosing, acute and chronic inflammation of small and medium arteries (tibial and radial arteries), occasionally veins and nerves → Thrombotic occlusion → Gangrene, Microabscess: Made of neutrophils surrounded by granulomatous inflammation - may recanalize","own",""]],"t":"UNC","sub":"Blood vessels","ref":"Ratio from 2027 SB","f":[112]},"28a:84":{"id":"28a:84","ex":"2028 LE2","y":2028,"n":84,"p":21,"s":"During a routine physical examination, a 65-year-old male is found to have a 7-cm pulsatile mass in his abdomen. Angiography reveals a marked dilation of his aorta distal to his renal arteries. What is the aneurysm most likely due to?","c":[["A","Atherosclerosis"],["B","Mycotic infection"],["C","A previous syphilitic infection"],["D","Cystic medial necrosis"]],"k":"A","ks":["A"],"r":[["Abdominal aortic aneurysm is primarily caused by atherosclerosis. It is grossly described as spherical, fusiform dilatation involving abdominal aorta and its branches","own",""],["Mycotic infection (Mycotic aneurysm) involves weakening and dilatation of the vessel wall due to infection by a microbial agent and is common in the cerebral arteries.","own",""],["A previous syphilitic infection (Syphilitic aneurysm) typically affects the thoracic aorta (arch of the aorta). It is caused by obliterative endarteritis of the vasa vasorum.","own",""],["Cystic medial necrosis is characterized by mucoid degeneration and elastic fiber fragmentation. It is most strongly associated with Aortic Dissection and conditions like Marfan Syndrome, rather than a true abdominal aneurysm caused by atherosclerosis.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"Ratio from 2027 SB","f":[119]},"28a:85":{"id":"28a:85","ex":"2028 LE2","y":2028,"n":85,"p":22,"s":"Glomus tumors are most commonly found in:","c":[["A","Head and neck"],["B","Lymph node and skin"],["C","Fingers and toes"],["D","Liver and spleen"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Glomus tumor (glomangioma) is a benign but painful tumor of the subungual (under the fingernail or nailbed)","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Glomus tumor (glomangioma) is a benign but painful tumor of the subungual (under the fingernail or nailbed)","f":[123]},"28a:86":{"id":"28a:86","ex":"2028 LE2","y":2028,"n":86,"p":22,"s":"A 34-year-old woman dies as a consequence of a \"stroke\". At autopsy, she is found to have a large basal ganglia hemorrhage. Her heart weighs 550 gm , with concentric left ventricular hypertrophy. Her arteries demonstrate intimo medial thickening and onion skinning . Which of the following arteriopathy does she mostly likely have?","c":[["A","Hyaline atherosclerosis"],["B","Atherosclerosis arteriopathy"],["C","Hyperplastic arteriosclerosis"],["D","Mönckeberg arteriosclerosis"]],"k":"C","ks":["C"],"r":[["Hyaline atherosclerosis: is associated with benign (mild to moderate) hypertension, old age, and diabetes mellitus, characterized by homogenous, pink hyaline deposits in the media, not onion skinning","own",""],["Atherosclerosis arteriopathy: has predilection for large elastic arteries (e.g. aorta, carotid, and iliac arteries) and large medium-sized muscular arteries (e.g. coronary, renal, and popliteal arteries) but does not involve the arterioles and smaller muscular arteries.","own",""],["Hyperplastic arteriosclerosis: is characterized by the hyperplasia or proliferation of the intima and medial cells of the arterioles, producing the classic \"onion skinning\" pattern. The concentric laminated thickening of the media leads to progressive narrowing of the lumen. This condition is associated with malignant, accelerated hypertension, which causes marked LVH (concentric hypertrophy due to pressure overload) and predisposes to intracranial hemorrhages (stroke).","own",""],["Mönckeberg arteriosclerosis: affects medium sized muscular arteries such as the media of the artery. Commonly seen in aging populations, particularly in patients with DM.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"4A - Pathology of Blood Vessels I Arteriosclerosis & 4B - Pathology of Blood Vessels II: HPN & Aneurysms","f":[113]},"28a:87":{"id":"28a:87","ex":"2028 LE2","y":2028,"n":87,"p":22,"s":"A 19-year-old young woman who emigrated from Taiwan 8 years ago presents with fever, malaise, myalgias, and arthritis and “coldness” in her upper extremities. She has a weak radial pulse bilaterally, and a magnetic resonance angiogram demonstrates nearly 75% stenosis of the main arteries originating from the aorta. Which of the following rheumatologic conditions would she likely have?","c":[["A","Buerger disease"],["B","Kawasaki disease"],["C","Raynaud disease"],["D","Takayasu arteritis"]],"k":"B","ks":["B"],"r":[["Buerger disease (Thromboangiitis Obliterans): involves medium and small arteries and typically affects young males (usually common among young males, <35 years old) who are heavy cigarette smokers, leading to peripheral gangrene.","own",""],["Kawasaki’s arteritis: “Acute febrile illness of early childhood characterized by vasculitis of the large to medium-sized arteries. Predilection of coronary arteries.","own",""],["Raynaud disease (Raynaud phenomenon): is a symptom associated with impaired circulation and cold sensitivity, often seen in other autoimmune diseases like Systemic Sclerosis, but it is not the diagnosis for severe, proximal large vessel stenosis originating from the aorta.","own",""],["Takayasu’s arteritis: Often granulomatous, predominantly affects the aorta and its major branches, seen in patients <50 years of age","own",""]],"t":"UNC","sub":"Blood vessels","flag":"Source-key warning: the uploaded exam keys B (Kawasaki disease), but the accompanying rationale describes Takayasu arteritis (aorta and major branches, patients under 50) and 2027 LE3 Q56 keys Takayasu arteritis for the same vignette.","orig":"Buerger disease (Thromboangiitis Obliterans): involves medium and small arteries and typically affects young males (usually common among young males, <35 years old) who are heavy cigarette smokers, leading to peripheral gangrene. | Kawasaki’s arteritis: “Acute febrile illness of early childhood characterized by vasculitis of the large to medium-sized arteries. Predilection of coronary arteries. | Raynaud disease (Raynaud phenomenon): is a symptom associated with impaired circulation and cold sensitivity, often seen in other autoimmune diseases like Systemic Sclerosis, but it is not the diagnosis for severe, proximal large vessel stenosis originating from the aorta. | Takayasu’s arteritis: Often granulomatous, predominantly affects the aorta and its major branches, seen in patients <50 years of age","f":[116]},"28a:88":{"id":"28a:88","ex":"2028 LE2","y":2028,"n":88,"p":23,"s":"A 3 year-old boy is brought by his parents to the emergency room because of high fever for several days. On examination, the boy has conjunctival and oral erythema. He has palpable cervical lymphadenopathy and erythema of his palms and soles. What is the potential life-threatening complication of this disorder?","c":[["A","Aneurysm of the abdominal aorta"],["B","Aneurysm of the coronary arteries"],["C","Dissection of the thoracic aorta"],["D","Rupture of a berry aneurysm"]],"k":"B","ks":["B"],"r":[["Seen in atherosclerosis, where chronic arterial wall damage in older adults leads to weakening and dilation of the abdominal aorta.","own",""],["Characteristic of Kawasaki disease, a childhood vasculitis involving the medium-sized arteries associated with mucocutaneous lymph node syndrome (ulcer, red chapped/cracked lips, conjunctivitis, palmar erythema). It has a predilection for the coronary arteries leading to coronary artery aneurysm.","own",""],["Usually seen in hypertensive adults or those with connective tissue disorders like Marfan syndrome","own",""],["Seen in mycotic aneurysms associated with weakening of the vascular wall due to microbial infections, common in cerebral arteries.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2028 [PTH LEC - LE2] - Pathology of Blood Vessels II: Vasculitis & Neoplasm","f":[114]},"28a:89":{"id":"28a:89","ex":"2028 LE2","y":2028,"n":89,"p":23,"s":"What is the most common tumor of the blood vessels?","c":[["A","Hemangiopericytoma"],["B","Lymphangioma"],["C","Capillary hemangioma"],["D","Glomangioma"]],"k":"C","ks":["C"],"r":[["Rare vascular tumors derived from pericytes (contractile cells around capillaries and venules), can be malignant.","own",""],["Benign tumor of lymphatic vessels, not blood vessels","own",""],["Capillary hemangioma is the most common benign tumor of blood vessels. It consists of closely packed capillary-sized vessels lined by benign endothelial cells.","own",""],["Arises from modified smooth muscle cells of the glomus body, usually small and painful, often found under fingernails.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2028 Trans Pathology of Blood Vessels II: Vasculitis & Neoplasm","f":[124]},"28a:90":{"id":"28a:90","ex":"2028 LE2","y":2028,"n":90,"p":23,"s":"A 23 year-old man presents with fever, weight loss, malaise, abdominal pain and myalgia. Workup reveals that the patient has polyarteritis nodosa. Which of the ff. is associated with this form of vasculitis?","c":[["A","Arsenic"],["B","Hepatitis B"],["C","Human herpesvirus 8"],["D","HIV"]],"k":"B","ks":["B"],"r":[["A carcinogen in pesticides associated with angiosarcoma","own",""],["A third of patients with panarteritis have chronic hepatitis B which leads to the formation of HBsAg-HBsAb complex that deposits in affected vessels","own",""],["Associated with Kaposi Sarcoma","own",""],["Associated with AIDs-Associated Kaposi Sarcoma","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2028 Trans Pathology of Blood Vessels","f":[118]},"28a:91":{"id":"28a:91","ex":"2028 LE2","y":2028,"n":91,"p":23,"s":"Which of the following is an INCORRECT statement regarding atherosclerosis?","c":[["A","Atherosclerotic plaques are thought to develop in response to persistent endothelial cell injury."],["B","In a developing atherosclerotic plaque, vascular smooth muscle cells migrate from the media into the intima, where they secrete collagen."],["C","Atherosclerotic plaques are prone to develop in coronary arteries."],["D","Calcified atheroma is an early morphologic lesion."]],"k":"D","ks":["D"],"r":[["This is widely accepted as the primary mechanism in development of Atherosclerosis: Response to injury hypothesis.This states that atherosclerosis sa chronic inflammatory and healing response of the arterial wall to constant and various forms of endothelial injury exposure, resulting in endothelial dysfunction","own",""],["Growth factors (PDGF, FGF, TGF-a) stimulate SCMs to synthesize ECM (collagen) which stabilizes the atherosclerotic plaque and later on develops into a mature atheroma","own",""],["Predilection with the ff arteries: - Lower abdominal aorta, iliac arteries, Coronary arteries, Popliteal arteries, Descending thoracic aorta, Internal Carotid arteries, Circle of Willis","own",""],["Calcifications are NOT manifestations of early lesions but are components in later stage plaques","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2025 Long Exam II","f":[122]},"28a:92":{"id":"28a:92","ex":"2028 LE2","y":2028,"n":92,"p":24,"s":"What is the basic lesion/s of atherosclerosis?","c":[["A","calcified atheroma"],["B","ulcerated atheroma"],["C","fibro-fatty plaque"],["D","all of the above"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Fibro-fatty plaque is the basic lesion of an atheroma - Ulcerated and calcified atheroma are complications of atherosclerosis.","own",""],["Characteristic clinical feature of restrictive CMP - due to a restrictive ventricular filling and pressure overload","bor","2027 LE3 Q79"]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Fibro-fatty plaque is the basic lesion of an atheroma - Ulcerated and calcified atheroma are complications of atherosclerosis.","ref":"Self Assessment Test for BV part 1 & LE 2 Trans 11A - Pathology of Blood Vessels I: Atherosclerosis","f":[122]},"28a:93":{"id":"28a:93","ex":"2028 LE2","y":2028,"n":93,"p":24,"s":"Which one of these is NOT included in the triad of Wegener’s Granulomatosis?","c":[["A","Crescentic glomerulonephritis"],["B","Ocular disturbances"],["C","Necrotizing vasculitis"],["D","Saddle nose deformity"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Granulomatosis with Polyangiitis (GPA) or previously called, Wegener’s granulomatosis is a necrotizing vasculitis characterized by a triad of: 1. Acute necrotizing granulomas of the upper respiratory tract (ear, nose, sinuses, throat) or the lower respiratory tract (lung) or both 2. Necrotizing or granulomatous vasculitis affecting small- to medium-sized blood vessels (e.g., capillaries, venules, arterioles, and arteries), most prominent in the lungs and upper airways but affecting other sites as well 3. Focal necrotizing, often crescentic, glomerulonephritis. Choice B is the exception as these clinical presentation is observed in patients with temporal/Giant cell vasculitis","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Granulomatosis with Polyangiitis (GPA) or previously called, Wegener’s granulomatosis is a necrotizing vasculitis characterized by a triad of: 1. Acute necrotizing granulomas of the upper respiratory tract (ear, nose, sinuses, throat) or the lower respiratory tract (lung) or both 2. Necrotizing or granulomatous vasculitis affecting small- to medium-sized blood vessels (e.g., capillaries, venules, arterioles, and arteries), most prominent in the lungs and upper airways but affecting other sites as well 3. Focal necrotizing, often crescentic, glomerulonephritis. Choice B is the exception as these clinical presentation is observed in patients with temporal/Giant cell vasculitis","ref":"Robbins and Cotran Pathologic Basis of Disease (10th edition) Chapter 11 page 514","f":[117]},"28a:94":{"id":"28a:94","ex":"2028 LE2","y":2028,"n":94,"p":24,"s":"A 56-year-old male presents with sudden onset of excruciating pain beginning in the anterior chest, radiating to the back, moving downward into the abdomen. BP is 160/115. The ECG and cardiac markers of injury are unremarkable. X-ray of abdomen show a double-barrel aorta. What is the most likely abnormality?","c":[["A","Microbial infection"],["B","Parasitic infection of adventitia layer"],["C","Atherosclerosis of the aorta"],["D","Inherited disorder related to cystic medial necrosis"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Cystic medial degeneration (seen in Marfan/Ehlers-Danlos) weakens the media, allowing an intimal tear and blood to create a false lumen — producing the “double-barrel” aorta seen in dissection.","own",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Cystic medial degeneration (seen in Marfan/Ehlers-Danlos) weakens the media, allowing an intimal tear and blood to create a false lumen — producing the “double-barrel” aorta seen in dissection.","f":[120]},"28a:95":{"id":"28a:95","ex":"2028 LE2","y":2028,"n":95,"p":24,"s":"A 75-year-old male with a history of 5 years stable angina pectoris, is brought to the ER with severe chest pain. EKG reveals ST segment elevation with elevated Troponin-I and CPK-MB levels. He was stabilized and managed with diagnosis of AMI and subsequently admitted to the CCU. About 4 days later, the patient again complained of severe chest pain. P.E. showed pericardial friction rub and pulmonary rales. Which of the following complications is most likely present in this case?","c":[["A","Myocardial aneurysm"],["B","Arrhythmia"],["C","Fibrinous pericarditis"],["D","Myocardial rupture and cardiac tamponade"]],"k":"C","ks":["C"],"r":[["Myocardial aneurysm: Late complication resulting from large transmural and anteroseptal infarct which heals by formation of a thin wall of scar tissue. Can develop months to years post-infarct.","own",""],["Arrhythmia: Commonly in infarcts of the interventricular septum. Leads to myocardial irritability and conduction disturbances that cause sudden cardiac death. Risk for serious arrhythmias serious in the 1st hour post-infarct.","own",""],["Fibrinous pericarditis: Presents with a pericardial friction rub and possible persistent anterior chest pain. Typically develops 2-3 days post-infarct and gradually resolves over the next few days.","own",""],["Myocardial rupture and cardiac tamponade: Left ventricular free wall rupture (most common) occurs within 3-7 days post-infarct and results in rapidly fatal hemopericardium and cardiac tamponade.","own",""]],"t":"UNC","sub":"Heart","ref":"2027 Long Exam 3","f":[131]},"28a:96":{"id":"28a:96","ex":"2028 LE2","y":2028,"n":96,"p":25,"s":"A 74-year old woman sees her physician for her annual physical examination. On PE she is afebrile, with heart rate at 65/min, RR of 14/min and BP of 120/80mmHg. On auscultation, a systolic ejection murmur is heard. There are few crackles over the lung bases posteriorly. If the aorta would be examined at this time and gross findings reveal heaped up calcified masses within the aortic cusps, which of the following most likely contributed to the development of this lesion?","c":[["A","Tuberculous calcification"],["B","Dystrophic calcification due to aging"],["C","Hyperlipidemia"],["D","Tumor of the parathyroid"]],"k":"B","ks":["B"],"r":[["Tuberculous infection typically results in granulomatous inflammation and caseous necrosis and is not the usual cause of isolated aortic cusp calcification leading to stenosis.","own",""],["Occurs in damaged or degenerated tissues. Due to the age of the patient, constant wear-and-tear leads to fibrosis and calcification of the aortic valves and causes interference in valvular opening resulting in the reported systolic murmur upon auscultation.","own",""],["Hyperlipidemia contributes to atherosclerosis, plaques of which can calcify. However, hyperlipidemia is more closely associated with coronary artery disease.","own",""],["Parathyroid hormone (PTH) production is associated with hypercalcemia. While hypercalcemia can cause metastatic calcification, the specific morphology of heaped-up masses in the aortic cusps is best explained by the localized degenerative process of aging (dystrophic calcification).","own",""]],"t":"UNC","sub":"Heart","ref":"LE2 Trans 15 – Pathology of the Heart Part 3-5","f":[132]},"28a:97":{"id":"28a:97","ex":"2028 LE2","y":2028,"n":97,"p":25,"s":"What causative factor can explain the development of idiopathic hypertrophic subaortic stenosis?","c":[["A","Chronic alcoholism"],["B","Nutritional deficiency in pregnancy"],["C","Amyloid infiltration in myocardium"],["D","B-MHC gene mutation of sarcomere of myocardial fibrils"]],"k":"D","ks":["D"],"r":[["Chronic alcoholism: Associated with Ventricular Septal Defect (VSD)","bor","2027 LE3 Q68"],["Nutritional deficiency in pregnancy: Cause of Primary or Idiopathic Restrictive Cardiomyopathy (RCMP)","bor","2027 LE3 Q68"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"ref":"2028 LE2 Trans 5c Pathology of Heart Part 3-5","f":[126]},"28a:98":{"id":"28a:98","ex":"2028 LE2","y":2028,"n":98,"p":25,"s":"A 30-year-old woman had atrial fibrillation that was poorly controlled, suffered a stroke and died. At autopsy, her 600gm heart is noted to have a mitral valve with partial fusion of the leaflets along with thickening and shortening of the chordae tendinae. There is an enlarged left atrium filled with mural thrombus. What is the expected morphological findings of tissue biopsies taken from the mitral valve leaflets?","c":[["A","Myxomatous degeneration"],["B","Thrombogenic Endocarditis"],["C","Hyperplastic myocardial fiber disarray"],["D","Aschoff Bodies"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["thrombotic endocarditis with deposition of fibrin, platelets, and other cellular elements of blood (thrombus) on the valve leaflets, and sterile vegetations (no inflammation)","bor","2027 LE3 Q69"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["The case points towards a Rheumatic Heart Disease based on the findings from the autopsy with presence of a mitral valve with partial commissural fusion of the leaflets along with the thickening and shortening of the chordae tendineae Myxomatous degeneration is seen in mitral valve prolapse Thrombogenic Endocarditis is seen in non-bacterial thrombotic endocarditis Hyperplastic myocardial fiber disarray is seen in Hypertrophic cardiomyopathy Aschoff Bodies is the correct answer as its seen in the mitral valve leaflet in Rheumatic Heart Disease","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"The case points towards a Rheumatic Heart Disease based on the findings from the autopsy with presence of a mitral valve with partial commissural fusion of the leaflets along with the thickening and shortening of the chordae tendineae | Myxomatous degeneration is seen in mitral valve prolapse | Thrombogenic Endocarditis is seen in non-bacterial thrombotic endocarditis | Hyperplastic myocardial fiber disarray is seen in Hypertrophic cardiomyopathy | Aschoff Bodies is the correct answer as its seen in the mitral valve leaflet in Rheumatic Heart Disease","ref":"2028 LE2 Trans 5c Pathology of Heart Part 3-5","f":[129]},"28a:99":{"id":"28a:99","ex":"2028 LE2","y":2028,"n":99,"p":26,"s":"A 66-year-old patient with tuberculosis presents with signs and symptoms of congestive heart failure (CHF). The chest X-ray shows a globularly enlarged heart. The attending physician suspects pericardial effusion. Based on the clinical presentation, which type of pericardial effusion is most likely?","c":[["A","Hemorrhagic"],["B","Fibrinous"],["C","Serous"],["D","Purulent"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["TB of pericardium usually evoke a fibrinous type of pericarditis and effusion","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"TB of pericardium usually evoke a fibrinous type of pericarditis and effusion","ref":"LE 2 Feedback","f":[137]},"28a:100":{"id":"28a:100","ex":"2028 LE2","y":2028,"n":100,"p":26,"s":"A 30-year-old male intravenous heroin user was hospitalized due to high-grade fever and chills. On auscultation, a loud, changing murmur was heard. He also has scattered erythematous lesions on the palms and soles, petechiae, and splinter hemorrhages on the nails. Where is the vegetation most likely located?","c":[["A","Pulmonic valve"],["B","Aortic valve"],["C","Mitral valve"],["D","Tricuspid valve"]],"k":"D","ks":["D"],"r":[["Rarely involved in infective endocarditis. Infection of this valve is uncommon even among IV drug users because of its lower pressure and less turbulent blood flow.","own",""],["Commonly affected in left-sided infective endocarditis, especially in patients with congenital heart disease or degenerative valve disease, but not typically in IV drug users.","own",""],["Another frequent site in left-sided endocarditis, especially with rheumatic heart disease. Vegetations here often present with pulmonary congestion rather than septic emboli to the lungs.","own",""],["Most common site of infective endocarditis in intravenous drug users. The tricuspid valve is the first valve encountered by venous return, which carries injected pathogens directly into the right side of the heart. Vegetations can embolize to the lungs, causing septic pulmonary emboli, and may produce signs like fever, new murmurs, and peripheral stigmata (Janeway lesions, Osler nodes, and splinter hemorrhages).","own",""]],"t":"UNC","sub":"Heart","f":[138]},"28a:101":{"id":"28a:101","ex":"2028 LE2","y":2028,"n":101,"p":26,"s":"A newborn infant with breathing difficulties immediately after birth, is diagnosed to have Tetralogy of Fallot. Of the four characteristic morphologic features, which one is responsible for the cyanosis and hypoxemia of this patient?","c":[["A","Ventricular septal defect"],["B","Overriding aorta"],["C","Pulmonary stenosis"],["D","Right ventricular hypertrophy"]],"k":"C","ks":["C"],"r":[["Allows blood to be shunted from the R to L side of the heart because blood cannot go to the pulmonary due to pulmonary artery obstruction","own",""],["Aorta is misplaced and moves toward the right side over the VSD In this anomaly, the positioning of the great vessels is arrested midway because of the failure of development of the membranous portion of aorta","own",""],["Correct. Obstruction of the right ventricular outflow tract due to the presence of a subpulmonic stenosis → Does not allow blood to go to the pulmonary artery for oxygenation and may lead to severe hypoxemia Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Adaptive response caused by inability of blood to go to the pulmonary artery due to pulmonary stenosis","own",""]],"t":"UNC","sub":"Heart","ref":"2028 LE 2 - TRANS 5A Pathology of the Heart I","f":[135]},"28a:102":{"id":"28a:102","ex":"2028 LE2","y":2028,"n":102,"p":26,"s":"A 30-year-old female delivered a live baby boy by NSD (Normal Spontaneous Delivery). Two weeks post partum, she developed Congestive Heart Failure. A chest X-ray showed marked global enlargement of the heart with pulmonary edema and congestion. What is the most likely cardiomyopathy type of this case?","c":[["A","Infective cardiomyopathy"],["B","Restrictive cardiomyopathy"],["C","Idiopathic cardiomyopathy"],["D","Congestive /dilated cardiomyopathy"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Restrictive (also known as Infiltrative cardiomyopathy) is characterized by a primary decrease in ventricular compliance, resulting in impaired ventricular filling during diastole (simply put, the wall is stiffer). Amyloidosis Endomyocardial fibrosis, Loeffler endomyocarditis are examples of this.","bor","2025 LE2 Q116"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["The timing of the onset (2 weeks postpartum) suggests peripartum cardiomyopathy, which is linked to pregnancy and postpartum. The most likely condition is congestive cardiomyopathy. Hallmarks: 1. Global enlargement of heart 2. Pulmonary edema 3. Pulmonary congestion","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"The timing of the onset (2 weeks postpartum) suggests peripartum cardiomyopathy, which is linked to pregnancy and postpartum. The most likely condition is congestive cardiomyopathy. Hallmarks: 1. Global enlargement of heart 2. Pulmonary edema 3. Pulmonary congestion","f":[134]},"28a:103":{"id":"28a:103","ex":"2028 LE2","y":2028,"n":103,"p":27,"s":"Which one of the choices below is NOT a compensatory mechanism to maintain adequate cardiac output in CHF?","c":[["A","Renin-angiotensin-aldosterone activation"],["B","Tachycardia"],["C","Peripheral vasoconstriction"],["D","Elaboration of corticosteroid by adrenal gland"]],"k":"D","ks":["D"],"r":[["Renin-angiotensin-aldosterone activation: A classic compensatory mechanism in CHF, increases blood volume and peripheral resistance to maintain cardiac output.","bor","2027 LE3 Q75"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Peripheral vasoconstriction: Helps redistribute blood flow to vital organs, common in CHF.","bor","2027 LE3 Q75"],["Congestive Heart Failure compensatory mechanisms: → LV hypertrophy → increased contractility → Increased heart rate → increased cardiac output → Activation of neurohumoral systems ▪ Release of NE by ANS ▪ Activation of RAAS ▪ Release of ANP: act to adjust filling volumes and pressure, through diuresis and natriuresis","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Congestive Heart Failure compensatory mechanisms: → LV hypertrophy → increased contractility → Increased heart rate → increased cardiac output → Activation of neurohumoral systems ▪ Release of NE by ANS ▪ Activation of RAAS ▪ Release of ANP: act to adjust filling volumes and pressure, through diuresis and natriuresis","f":[130]},"28a:104":{"id":"28a:104","ex":"2028 LE2","y":2028,"n":104,"p":27,"s":"What is the most likely diagnosis in a 20-year old woman who was found to have an elevated blood pressure as measured in both arms, and a low pressure in her legs?","c":[["A","Coarctation of the aorta"],["B","Cushing's disease"],["C","Patent ductus arteriosus"],["D","Takayasu arteritis"]],"k":"A","ks":["A"],"r":[["An obstructive anomaly. Most characteristic clinical finding includes HTN in the upper limbs, with a much lower pressure in vessels distal to the coarctation. Femoral pulse is often reduced.","own",""],["Causes generalized hypertension due to excess cortisol, not differential pressures between limbs","own",""],["A patent ductus allows blood to be shunted from the aorta, which is the left side of the heart to the right side of the venous system in the direction of the pulmonary artery.","own",""],["Commonly in aortic arch and the great vessels.","own",""]],"t":"UNC","sub":"Heart","ref":"LE2 Trans 15 – Pathology of the Heart Part 3-5","f":[]},"28a:105":{"id":"28a:105","ex":"2028 LE2","y":2028,"n":105,"p":27,"s":"A 60-year-old man presented to the ER with dyspnea diaphoresis, and crushing substernal chest pain radiating to his neck and left arm. ECG changes, serum troponin levels are consistent with myocardial infarction. If the patient unexpectedly dies within one hour of onset of symptoms, which of the following would be seen on the affected myocardium?","c":[["A","Coagulation necrosis with neutrophilic infiltration"],["B","Fibrotic tissue replacing infarcted tissue"],["C","Wavy myocardial fibers"],["D","Granuloma"]],"k":"C","ks":["C"],"r":[["24-hour post MI death Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Can be seen 7 days post infarction (reparative process)","own",""],["Acute Myocardial Progression 30 minutes to 4 hours ● Wavy myocardial fibers: earliest light microscopic changes seen in AMI ○ Due to the increased hydrostatic pressure of interstitial edema which squeezes and stretches the neighboring fibers ○ Earliest light microscopic change in AMI occurs within an hour up to 4h post-infarct is the appearance of wavy and thinned fibers","own",""],["It is granulation tissue that becomes present at around 1-2 weeks, not a granuloma","own",""]],"t":"UNC","sub":"Heart","ref":"2028 LE 2 Trans #5B - Pathology of the Heart II, Table 12.5 Evolution of Morphological Changes in Myocardial Infarction [Robbins]","f":[]},"28a:106":{"id":"28a:106","ex":"2028 LE2","y":2028,"n":106,"p":27,"s":"70-year-old woman has a long history of metastatic colon cancer, and she donates her body for use in medical school anatomy courses. At death, the body is emaciated and cachectic, and gross dissection reveals small fibrin deposits arranged around the line of closure of the leaflets of the mitral valve. What would the valvular lesion most likely present?","c":[["A","Bacterial endocarditis"],["B","Endocarditis with carcinoma"],["C","Libman-Sacks endocarditis"],["D","Nonbacterial thrombotic (marantic) endocarditis"]],"k":"D","ks":["D"],"r":[["Bacterial endocarditis: Would show large, friable vegetations with neutrophilic inflammation and microorganisms, usually associated with fever and infection signs.","own",""],["Endocarditis with carcinoma: describes the association between cancer and endocarditis, which is precisely what NBTE is, but NBTE is the specific pathological term for the type of sterile, thrombotic endocarditis seen in the setting of malignancy","own",""],["Libman–Sacks endocarditis: Seen in systemic lupus erythematosus (SLE), vegetations occur on both sides of the valve leaflets (not just lines of closure), and there’s immune complex deposition.","own",""],["Nonbacterial Thrombotic Endocarditis (NBTE): is characterized by the deposition of fibrin, platelets, and other cellular elements of blood (thrombus) on the valve leaflets. The morphology involves \"sterile vegetations\", or sterile thrombi deposits, typically located \"along lines of closure”.","own",""]],"t":"UNC","sub":"Heart","f":[127]},"28a:107":{"id":"28a:107","ex":"2028 LE2","y":2028,"n":107,"p":28,"s":"A 46 y/o woman presents with dyspnea on exertion and paroxysmal nocturnal dyspnea. She complained of severe dizziness and syncopal attacks and easy fatigability. After undergoing several tests, she is diagnosed with a primary heart tumor that is causing a “ball-valve obstruction” of her mitral valve. Which of the following is the most likely tumor?","c":[["A","Rhabdomyoma"],["B","Leiomyoma"],["C","Myxoma"],["D","Fibroma"]],"k":"C","ks":["C"],"r":[["Most frequent primary cardiac tumor in children. Most arise from the ventricular chamber and can cause valvular or outflow tract obstruction.","own",""],["Mature bundles of spindled smooth muscle cells","own",""],["Complications of Myxoma include ball-valve obstruction, embolization","own",""],["Fibrous tissue (fibroblast-like cells)","own",""]],"t":"UNC","sub":"Heart","ref":"2028 Trans Pathology of Heart and 2026 LE 3","f":[133]},"28a:108":{"id":"28a:108","ex":"2028 LE2","y":2028,"n":108,"p":28,"s":"Compensatory mechanism operating in Congestive Heart Failure to maintain an adequate cardiac output includes the following, EXCEPT:","c":[["A","Renin-angiotensin-aldosterone activation"],["B","Increased heart rate"],["C","LV hypertrophy"],["D","Elaboration of corticosteroids by adrenal gland"]],"k":"D","ks":["D"],"r":[["Renin-angiotensin-aldosterone activation: A classic compensatory mechanism in CHF, increases blood volume and peripheral resistance to maintain cardiac output.","bor","2027 LE3 Q75"],["Increase heart rate: Sympathetic nervous system stimulates tachycardia to preserve cardiac output (CO = HR x SV).","bor","2027 LE3 Q75"],["LV hypertrophy: An adaptive response to the pressure overload of chronic hypertension","bor","2027 LE3 Q76"],["Congestive Heart Failure compensatory mechanisms: → LV hypertrophy → increased contractility → Increased heart rate → increased cardiac output → Activation of neurohumoral systems ▪ Release of NE by ANS ▪ Activation of RAAS ▪ Release of ANP: act to adjust filling volumes and pressure, through diuresis and natriuresis","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Congestive Heart Failure compensatory mechanisms: → LV hypertrophy → increased contractility → Increased heart rate → increased cardiac output → Activation of neurohumoral systems ▪ Release of NE by ANS ▪ Activation of RAAS ▪ Release of ANP: act to adjust filling volumes and pressure, through diuresis and natriuresis","f":[130]},"28a:109":{"id":"28a:109","ex":"2028 LE2","y":2028,"n":109,"p":28,"s":"A 66 yr old man with uremia has signs and symptoms of congestive heart failure. In his chest xray, the cardiac shadow is enlarged. The attending physician suspects moderate pericarditis. Which type of pericarditis is this?","c":[["A","Hemorrhagic"],["B","Fibrous"],["C","Serous"],["D","Purulent"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Presence of uremia, congestive heart failure and an enlarged cardiac shadow point to a serous type of pericarditis","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Presence of uremia, congestive heart failure and an enlarged cardiac shadow point to a serous type of pericarditis","f":[]},"28a:110":{"id":"28a:110","ex":"2028 LE2","y":2028,"n":110,"p":28,"s":"Which of the following leads to the finding of RV dilatation","c":[["A","COPD"],["B","Acute pulmonary thrombo embolism"],["C","Systemic hypertension"],["D","Mitral valve stenosis"]],"k":"B","ks":["B"],"r":[["COPD is a chronic condition. Hence, the compensatory effect done by the body is RV hypertrophy, not dilatation. This happens because the pressure load rises slowly, allowing the RV to remodel and undergo hypertrophy","own",""],["Normally, the pulmonary vasculature is a low-pressure system. Due to increased pulmonary vascular resistance caused by thromboembolism, the end-diastolic volume increases. Because of this, the walls of the RV stretch and can lead to ischemia and decreased contractility","own",""],["The LV is the one undergoing compensatory changes in systemic HTN (concentric hypertrophy)","own",""],["Blood flow from LA to LV is obstructed during diastole in mitral valve stenosis. This causes LA enlargement and eventually, the pressure gradually backs up into the pulmonary circulation and thus, will eventually cause right ventricle to undergo hypertrophy","own",""]],"t":"UNC","sub":"Heart","f":[125]},"28a:111":{"id":"28a:111","ex":"2028 LE2","y":2028,"n":111,"p":29,"s":"Which of the following morphologic features point out to a benign lesion?","c":[["A","Contiguous spread to the endometrium"],["B","Fleshy cut surface"],["C","Penetrates through the serosal surface"],["D","Well circumscribed"]],"k":"D","ks":["D"],"r":[["Leiomyomas are not malignant, hence there should be no spread.","own",""],["Leiomyomas (benign) should be smooth-cut, not fleshy-cut.","own",""],["Leiomyomas are not malignant, hence there is no penetration.","own",""],["Well-circumscribed is one of the features of a benign neoplasm.","own",""]],"t":"N1","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"[PTH LAB - LE 2] 01 - Neoplasia (V1)","f":[139]},"28a:112":{"id":"28a:112","ex":"2028 LE2","y":2028,"n":112,"p":29,"s":"Which of the following features determine that these are metastatic lesions?","c":[["A","Absence of necrosis"],["B","Encapsulated"],["C","Multifocal"],["D","Solid tumor"]],"k":"C","ks":["C"],"r":[["Absence of necrosis does not determine a metastatic lesion.","own",""],["An encapsulated lesion does not determine a metastatic lesion.","own",""],["Multifocal is due to its hematogenous spread, a determinant of a metastatic lesion.","own",""],["A solid tumor does not determine a metastatic lesion.","own",""]],"t":"N1","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"[PTH LEC - LE 2] 1A - Neoplasia 1","f":[21]},"28a:113":{"id":"28a:113","ex":"2028 LE2","y":2028,"n":113,"p":29,"s":"What is the grading of this tumor?","c":[["A","Well differentiated"],["B","Moderately differentiated"],["C","Poorly differentiated"],["D","Undifferentiated"]],"k":"A","ks":["A"],"r":[["The glands are still appreciable, vis stemic lupus erythematosous (SLE).","c":[["A","(image) Homogeneous pattern"],["B","(image) Speckled pattern"],["C","(image) Nucleolar pattern"],["D","(image) Centromeric pattern"]],"k":"A","ks":["A"],"r":[["Homogeneous (prominent rim or peripheral staining pattern), commonly seen in SLE.","own",""],["Speckled (presence of uniform or variable sized speckles), commonly seen in Sjogren Syndrome.","own",""],["Nucleolar (presence of a few discrete spots in fluorescence within the nucleus), commonly seen in Systemic Sclerosis.","own",""],["Centromeric (visible small centromeres), commonly seen in Systemic Sclerosis.","own",""]],"t":"I2","sub":"","note":"The four options are immunofluorescence photographs in the source PDF. The pattern names shown here are taken from the feedback rationale for each image.","ref":"Reference trans: [PTH LEC - LE 2] 2B - Diseases of Immunity 2","f":[14]},"28a:118":{"id":"28a:118","ex":"2028 LE2","y":2028,"n":118,"p":30,"s":"A 65 y/o male with chronic inflammatory disease. Microscopic findings show these accumulated material highlighted by Congo Red stain. What is the MOST likely property of this material?","c":[["A","Immunoglobulin light chains"],["B","Amyloid associated protein"],["C","Beta amyloid protein"],["D","Beta2 macroglobuli"]],"k":"B","ks":["B"],"r":[["This is associated with primary amyloidosis, which is NOT a chronic inflammatory disease.","own",""],["This is associated with secondary amyloidosis, which is a chronic inflammatory disease.","own",""],["This is associated with Alzheimer’s disease.","own",""],["This is associated with dialysis-related amyloidosis, which is NOT a chronic inflammatory disease.","own",""]],"t":"I2","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"Reference trans: [PTH LAB - LE 2] 02 - Diseases of Immunity","f":[15]},"28a:119":{"id":"28a:119","ex":"2028 LE2","y":2028,"n":119,"p":30,"s":"This type of microscopic appearance of the blood vessel is seen in:","c":[["A","Mast cell degranulation"],["B","Antibody dependent cell mediated cytotoxicity"],["C","Immune Complex Deposition"],["D","Delayed Hypersensitivity"]],"k":"C","ks":["C"],"r":[["Type I hypersensitivity (Immediate)","own",""],["Type II hypersensitivity (Antibody-mediated)","own",""],["Figure depicts Acute Vasculitis, a principal morphological manifestation of immune complex deposition injury (Type III). - Associated with necrosis of blood vessels and intense neutrophilic infiltration - Necrotic tissue with deposits of immune complexes, appearing as “smudgy” and eosinophilic fibrinoid necrosis","own",""],["Type IV hypersensitivity (Delayed, Cell-mediated)","own",""]],"t":"I1","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"[PTH LEC - LE 2] 03 - Diseases of Immunity 1","f":[7]},"28a:120":{"id":"28a:120","ex":"2028 LE2","y":2028,"n":120,"p":30,"s":"The symptom of dry mouth is secondary to:","c":[["A","Lymphocytic infiltrates"],["B","Ductal epithelial hyperplasia"],["C","Atrophic acini"],["D","Fibrosis"]],"k":"B","ks":["B"],"r":[["Biopsy of the lip or salivary gland from a patient with Sjogren Syndrome would reveal lymphocytic and plasma infiltration with ductal epithelial hyperplasia. However, dry mouth is not directly secondary to lymphocytic infiltrates. See Choice B for the best answer.","own",""],["Figure depicts Sjrogen Syndrome, a chronic disease characterized by dry eyes and dry mouth resulting from immunologically-mediated disruption of the lacrimal and salivary glands. - Dry mouth is due to the obstruction caused by ductal epithelial hyperplasia, meaning NO LUMEN for the saliva can pass through","own",""],["Not a characteristic of Sjogren Syndrome.","own",""],["Not a characteristic of Sjogren Syndrome.","own",""]],"t":"I2","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"[PTH LEC - LE 2] 04 - Diseases of Immunity 2","f":[]},"28a:121":{"id":"28a:121","ex":"2028 LE2","y":2028,"n":121,"p":31,"s":"A 39-year-old woman has this hand deformity. The microscopic appearance of the skin is also shown. The patient complains of difficulty swallowing. Which of the following dermal inflammatory cells is the MOST likely initiator of the process that is the cause of her skin disease?","c":[["A","CD4+ lymphocyte"],["B","CD8+ lymphocyte"],["C","Macrophage"],["D","Neutrophil"]],"k":"A","ks":["A"],"r":[["Figure depicts Systemic Sclerosis, a chronic inflammation from autoimmunity leading to widespread damage of small blood vessels and progressive fibrosis of the skin, GI, kidney, heart, lungs, small blood vessels. - CD4+ lymphocytes are affected, accumulating in the skin >> releasing cytokines >> activating inflammatory cells >> fibrosis and fibroblast proliferation - Biopsy (figure on the right) reveals extensive deposition of dense collagen in the dermis with virtual absence of hair follicles","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["While macrophages may help clear viral debris, they are not the primary target or initiator.","bor","2028 LE2 Q61"],["Characteristic of an acute inflammatory response (first 6-24 hours). Few may be seen but giant cells are more specific","bor","2027 LE2 Q5"]],"t":"I2","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","bm":1,"orig":"Figure depicts Systemic Sclerosis, a chronic inflammation from autoimmunity leading to widespread damage of small blood vessels and progressive fibrosis of the skin, GI, kidney, heart, lungs, small blood vessels. - CD4+ lymphocytes are affected, accumulating in the skin >> releasing cytokines >> activating inflammatory cells >> fibrosis and fibroblast proliferation - Biopsy (figure on the right) reveals extensive deposition of dense collagen in the dermis with virtual absence of hair follicles","ref":"[PTH LEC - LE 2] 04 - Diseases of Immunity 2","f":[]},"28a:122":{"id":"28a:122","ex":"2028 LE2","y":2028,"n":122,"p":31,"s":"A forest ranger sustained a hacking wound on his left arm wherein medical intervention was delayed with regards to the wound. Gram stain of the wound revealed gm (+) boxcar shaped bacilli. Which of the following pathogens can cause this infection?","c":[["A","Bacillus anthracis"],["B","Corynebacterium diptheriae"],["C","Clostridium perfringens"],["D","Staphylococcus aureus"]],"k":"C","ks":["C"],"r":[["Causes anthrax - Bacillus anthracis is also gm (+) - Presents with black eschar with inflammatory ring, if cutaneous","own",""],["Causes diphtheria - Corynebacterium diptheriae is gm (+) rod that colonizes the oropharynx - Presents with thick, gray coating at the back of the throat (pseudomembrane) that can block respiration","own",""],["Figure depicts gas gangrene, caused by C. perfringens - Affected area is edematous and tender, with blackish-green or blush-black wound - Clostridium perfringens appears as gram positive (purple) boxcar shaped bacilli","own",""],["Causes impetigo, Staphylococcal scalded skin syndrome, lung abscess, furuncles, and carbuncles - S. aureus is gm (+) cocci in clusters","own",""]],"t":"ID4","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"[PTH LEC - LE 2] 08 - Infectious Diseases I_ Bacterial Infections II","f":[]},"28a:123":{"id":"28a:123","ex":"2028 LE2","y":2028,"n":123,"p":31,"s":"A 45 y/o female sex worker complains of a painful genital ulcer. PE shows an ulcer in the mons pubis with a necrotic base and bilateral enlarged inguinal lymph nodes. Gram stain shows gram negative coccobacilli. Which is the MOST likely diagnosis?","c":[["A","Syphilis"],["B","Lymphogranuloma venereum"],["C","Granuloma inguinale"],["D","Chancroid"]],"k":"D","ks":["D"],"r":[["Syphilis (Treponema pallidum) begins with a single painless hard chancre and regional adenopathy. A painful suppurative ulcer argues against it.","gen",""],["Lymphogranuloma venereum is caused by Chlamydia trachomatis serotypes L1 to L3. A small genital papule is followed by inguinal adenitis with stellate abscesses.","gen",""],["Granuloma inguinale (donovanosis) is caused by Klebsiella granulomatis. A painless papule becomes a raised, beefy red, foul-smelling ulcer, and Donovan bodies are seen within macrophages.","gen",""],["Caused by Treponema pallidum - Gm (-) slender, corkscrew-shaped bacteria (spirochetes) - Presents with painless genital ulcer (chancre/ hard chancre) if primary, rashes if secondary, and gummas if tertiary Caused by Chlamydia trachomatis (L1, L2, L3 serotypes) - Initial ulcers ordinarily pass away unnoticed - Presents with swelling of inguinal lymph nodes Caused by Klebsiella granulomatis - Presents with painless ulcers with rolled/ raised borders and a friable base and soft, sharply demarcated granulation tissue that bleeds easily Figure and characteristics depict Chancroid, caused by Haemophilus ducreyi - Gm (-) coccobacilli - Presents with painful genital ulcer (chancroid/ soft chancre) accompanied by enlarged and tender lymph nodes (buboes) I_ Bacterial Infections I","own",""]],"t":"ID3","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","bm":1,"orig":"Caused by Treponema pallidum - Gm (-) slender, corkscrew-shaped bacteria (spirochetes) - Presents with painless genital ulcer (chancre/ hard chancre) if primary, rashes if secondary, and gummas if tertiary | Caused by Chlamydia trachomatis (L1, L2, L3 serotypes) - Initial ulcers ordinarily pass away unnoticed - Presents with swelling of inguinal lymph nodes | Caused by Klebsiella granulomatis - Presents with painless ulcers with rolled/ raised borders and a friable base and soft, sharply demarcated granulation tissue that bleeds easily | Figure and characteristics depict Chancroid, caused by Haemophilus ducreyi - Gm (-) coccobacilli - Presents with painful genital ulcer (chancroid/ soft chancre) accompanied by enlarged and tender lymph nodes (buboes) | I_ Bacterial Infections I","ref":"[PTH LEC - LE 2] 07 - Infectious Diseases","f":[49]},"28a:124":{"id":"28a:124","ex":"2028 LE2","y":2028,"n":124,"p":32,"s":"Which of the following clinical manifestations is seen in tertiary syphilis?","c":[["A","Choice A"],["B","Choice B"],["C","Choice C"],["D","Choice D"]],"k":"C","ks":["C"],"r":[["Figure depicts hard chancre on the surface of the tongue, seen in primary syphilis - Appear as firm, nontender, papule which erodes to form a shallow, clean-based ulcer with indurated borders (button-like mass)","own",""],["Figure depicts condyloma lata on the anogenital region, seen in secondary syphilis - Broad-based elevated plaques on moist areas of skin in the anogenital region","own",""],["Figure depicts gummas, seen in tertiary syphilis - Appear white-gray and rubbery, occurring singly or in multiple nodules - Destructive, ulcerative lesions in many organs but most commonly in bone, skin, mucous membranes of the upper airway & mouth","own",""],["Figure depicts rash on the sole of the foot, seen in secondary syphilis - Appear as brown or red macules on the palms and soles - May be papular, pustular, follicular, annular or scaling","own",""]],"t":"ID4","sub":"","note":"The four options are clinical photographs in the source PDF. Per the feedback, the keyed image C shows the tertiary lesion, and image A shows a hard chancre of primary syphilis.","ref":"[PTH LEC - LE 2] 08 - Infectious Diseases I_ Bacterial Infections II","f":[52]},"28a:125":{"id":"28a:125","ex":"2028 LE2","y":2028,"n":125,"p":32,"s":"This gross pathologic lesion is characteristic of CNS lesions caused by:","c":[["A","Plasmodium falciparum"],["B","Cryptococcus neoformans"],["C","Pneumocystis jirovecii"],["D","Taenia saginata"]],"k":"B","ks":["B"],"r":[["Most common species in the Philippines that causes Malaria - In the CNS, presents with small, pinpoint hemorrhages over the cerebrum, and brain vessels plugged with parasitized RBCs","own",""],["Figure depicts Cryptococcal meningitis, caused by Cryptococcus neoformans - Presents as microcysts in the CNS, involving the meninges, cortical gray matter, and basal nuclei - Gelatinous masses of fungi grow in the meninges or in the Virchow-Robin spaces within the gray matter = soap-bubble lesion appearance","own",""],["Causes pneumonia, seen in AIDS patients - Does NOT present with gross pathologic lesions in the CNS","own",""],["Causes Taenia saginata Taeniasis - Beef tapeworm - Does NOT present with gross pathologic lesions in the CNS","own",""]],"t":"ID6","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"[PTH LEC - LE 2] 09 - Infectious Diseases II_ Fungal Infections","f":[57]},"28a:126":{"id":"28a:126","ex":"2028 LE2","y":2028,"n":126,"p":32,"s":"This Giemsa-stain blood smear was obtained from a patient who died of sudden cardiac arrhythmia. This parasite can cause:","c":[["A","American trypanosomiasis"],["B","Babesiosis"],["C","Leishmaniasis"],["D","Sleeping sickness"]],"k":"A","ks":["A"],"r":[["Trypomastigote has a large, subterminal or terminal kinetoplast, a centrally located nucleus, an undulating membrane, and a flagellum running along the undulating membrane, leaving the body at the anterior end. Trypansoma cruzi primarily affects the heart in endemic areas and is a major cause of sudden death due to cardiac arrhythmia.","own",""],["Babesia parasites resemble P. falciparum (ring-form trophozoites) but are pleomorphic, vacuolated, and do not produce pigment.","own",""],["Amastigotes of Leishmania spp. are spherical to ovoid, possess a large nucleus, a prominent kinetoplast, and a short axoneme.","own",""],["Trypomastigote has a large, subterminal or terminal kinetoplast, a centrally located nucleus, an undulating membrane, and a flagellum running along the undulating membrane, leaving the body at the anterior end. Trypanosoma brucei causes sleeping sickness or African trypanosomiasis.","own",""]],"t":"ID7","sub":"","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","ref":"[PTH LEC - LE 2] 10 - Infectious Diseases & CDC","f":[61]},"28a:127":{"id":"28a:127","ex":"2028 LE2","y":2028,"n":127,"p":33,"s":"What is a common complication associated with myocardial infarction shown in this picture?","c":[["A","Cardiac rupture and tamponade"],["B","Cardiac arrhythmia"],["C","Septic mural thromboembolism"],["D","Ventricular aneurysm"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","note":"Projection exam item. The source PDF shows an image with this question that is not reproduced here.","bm":1,"ref":"[PTH LEC - LE 2] 14 - Pathology of the Heart II","f":[]},"28a:128":{"id":"28a:128","ex":"2028 LE2","y":2028,"n":128,"p":33,"s":"A form of endocarditis in this picture is associated with:","c":[["A","Post streptococcal infection"],["B","Malnutrition"],["C","Auto-immune connective tissue disorder"],["D","Heroin IV mainlining"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no r
