 compressive atelectasis"],["B","Re-expansion of collapse lung tissue upon evacuation of pleural effusion"],["C","Pleural effusion is due to increased hydrostatic pressure"],["D","On imaging, mediastinum is noted to shift away from the affected side"]],"k":"C","ks":["C"],"r":[["Compression atelectasis occurs when a significant amount of fluid (blood, effusions, exudate), solid material (tumor), or air (pneumothorax) accumulates in the pleural cavity and displaces or compresses the lung tissue.","own",""],["Compression atelectasis is a reversible condition","own",""],["Definition refers to pulmonary edema rather than pulmonary effusion","own",""],["Shifting of the mediastinum associated with different forms of atelectasis: - Resorption/Obstructive: shifts towards the atelectatic lung - Compression: shift away from the atelectatic lung - Contraction: no shifting of the mediastinum","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC - LE 3] Trans 07- Pathology of the Lungs I","f":[]},"27b:83":{"id":"27b:83","ex":"2027 LE3","y":2027,"n":83,"p":25,"s":"Which of the following pairing of pulmonary disease and their pathology is correct?","c":[["A","Chronic Bronchitis - excess mucus and smooth muscle hyperplasia"],["B","Emphysema - air space inflation with wall destruction"],["C","Bronchiectasis - mucous gland hyperplasia and hypersecretion"],["D","Bronchial asthma - airway dilatation and necrotizing inflammation"]],"k":"B","ks":["B"],"r":[["Chronic Bronchitis: Mucous gland hyperplasia and hypersecretion, persistent cough with sputum production for at least 3 mos in at least 2 consecutive yrs in the absence of any other identifiable cause","own",""],["Emphysema: Irreversible abnormal enlargement of the airspaces distal to the terminal bronchioles accompanied with destruction of their walls or septae","own",""],["Bronchiectasis: Destruction of the smooth muscle and elastic tissue of the bronchial wall by necrotizing inflammation stemming from persistent or severe infection, leading to permanent dilation of bronchi and bronchioles","own",""],["Asthma: Inflammation, excess mucus production, and smooth muscle hyperplasia due to immunologic or undefined causes, (+) thick mucus plugs","own",""]],"t":"UNC","sub":"Lung pathology","ref":"TRANS #8 Pathology of the Lungs II","f":[]},"27b:84":{"id":"27b:84","ex":"2027 LE3","y":2027,"n":84,"p":25,"s":"Which of the following cells has the LEAST participation in the resolution phase of acute lung injury/ acute respiratory distress syndrome (ARDS)?","c":[["A","Type 1 pneumocyte"],["B","Type 2 pneumocyte"],["C","Alveolar macrophage"],["D","Uninjured epithelial cell"]],"k":"A","ks":["A"],"r":[["Type 1 pneumocytes are primarily involved in gas exchange and are more susceptible to injury. They are not involved in the repair process. Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Type 2 pneumocytes synthesize lung surfactant and are the main cell type involved in repair of alveolar epithelium after damage.{Robbins) They proliferate vigorously in an attempt to replace type 1 pneumocytes, reconstituting the alveolar lining. Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Alveolar macrophages remove intra-alveolar debris and release fibrogenic cytokines such as TGF-B and PDGF.","own",""],["Endothelial restoration occurs as uninjured capillary endothelium proliferates.","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC-LE 3] 07 Pathology of the Lungs I","f":[]},"27b:85":{"id":"27b:85","ex":"2027 LE3","y":2027,"n":85,"p":26,"s":"25yo with post partum sepsis afebrile on antibiotic treatment. Deteriorating oxygenation with a duration of 3 days. Chest xray shows scattered bilateral pulmonary opacities ventilation perfusion scan mismatch. What morphological features can be seen","c":[["A","Atrial plexiform lesion"],["B","Hyaline membrane formation alveolar walls"],["C","Lymphocytic inflammation in alveolar walls and interstitium"],["D","Respiratory bronchiolar destruction"]],"k":"B","ks":["B"],"r":[["Associated with pulmonary arterial hypertension (PAH)","own",""],["Characteristics of the case present as ARDS/ALI. Hyaline membrane formation in alveolar walls is a hallmark of ARDS","own",""],["—---- Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Characteristic of smoking-related bronchiolitis or chronic obstructive lung diseases","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC-LE 3] 07 Pathology of the Lungs I","f":[106]},"27b:86":{"id":"27b:86","ex":"2027 LE3","y":2027,"n":86,"p":26,"s":"A 60-year-old male, heavy smoker presents with chronic dyspnea and productive cough. He also has bouts of easy fatigability. Patient also presents with an increased AP diameter of the chest wall. If the attending doctor diagnosed his condition as emphysema, what is the most likely type?","c":[["A","Centrilobular"],["B","Distal / Paraseptal"],["C","Panacinar"],["D","Irregular"]],"k":"A","ks":["A"],"r":[["COPD, Most common form emphysema, Affected area: Central / proximal parts of the acini formed by the bronchioles, Lesions: Upper lobes, Common among heavy cigarette smokers","own",""],["Spontaneous Pneumothorax in young, located near pleura & lobular septa/margin, caused by scarring, fibrosis, and atelectasis, Spares the proximal portion","own",""],["Associated with of α1 antitrypsin deficiency , located in lower zones & anterior margins","own",""],["Clinically insignificant, associated with scarring","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC-LE 3] 07 Pathology of the Lungs I","f":[108]},"27b:87":{"id":"27b:87","ex":"2027 LE3","y":2027,"n":87,"p":26,"s":"A septic ICU patient died due to respiratory failure despite 100% oxygenation. Laboratory findings shows (+) blood culture and an elevated white blood cell count. Autopsy shows hyaline membranes lining distended alveolar sacs, necrotic epithelial cells, edema fluid and interstitial inflammation. Which of the following is the most likely mechanism underlying these morphologic changes?","c":[["A","Leukocyte-mediated diffuse alveolar damage"],["B","Aspiration of oropharyngeal secretions"],["C","Release of fibrogenic cytokines by macrophages"],["D","Reduced production of surfactant"]],"k":"A","ks":["A"],"r":[["ARDS, common in septic ICU patients, results from neutrophil activation and inflammation, causing diffuse alveolar damage with hyaline membranes, edema, and necrotic epithelial cells.","own",""],["Aspiration usually causes localized pneumonia or pneumonitis, not diffuse alveolar damage with hyaline membranes seen in ARDS.","own",""],["Fibrogenic cytokines lead to chronic fibrosis, while the case describes acute alveolar injury and inflammation, characteristic of ARDS.","own",""],["Surfactant deficiency is more relevant to neonatal RDS, in ARDS, surfactant dysfunction is secondary to diffuse alveolar damage, not the primary mechanism","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC-LE 3] 07 Pathology of the Lungs I","f":[106]},"27b:88":{"id":"27b:88","ex":"2027 LE3","y":2027,"n":88,"p":27,"s":"A 39 year old has noted increasing dyspnea and non-productive cough for 5 months. A chest radiograph shows prominent hilar lymphadenopathy with reticulonodular infiltrates bilaterally. A transbronchial biopsy is performed, and the microscopic findings include interstitial fibrosis, non-caseating granulomas and stellate inclusions within giant cells. The most likely condition of this woman is:","c":[["A","Pulmonary tuberculosis"],["B","Sarcoidosis"],["C","Silicosis"],["D","Hypersensitivity pneumonitis"]],"k":"B","ks":["B"],"r":[["Unlikely, as TB typically has a more insidious onset, is associated with night sweats, weight loss, and chronic cough, and does not present with lobar consolidation in the acute setting. Pulmonary TB also incites a granulomatous inflammatory reaction but usually of the caseating type and usually forms your horse shaped Langhans giant cell.","own",""],["Sarcoidosis: Inflammatory disease that affects multiple organs in the body ● Common sites: Lungs and hilar lymph nodes ● Forms noncaseating granulomas She has restrictive lung disease known as sarcoidosis as seen by the reticulonodular infiltrates seen on CXR and the characteristic histologic features of noncaseating granuloma formation and the presence of stellate inclusions within giant cells known also as asteroid bodies.","own",""],["Silicosis usually gives rise to hard collagenous nodules within the lung parenchyma and its hilar lymph nodes which usually gives rise to an “eggshell” calcification on its hilar lymph nodes on CXR.","own",""],["Histologic changes in hypersensitivity pneumonitis consist of: ● Interstitial pneumonitis (acute phase) ● Noncaseating granuloma (acute phase) ● Interstitial fibrosis with honeycombing & obliterative bronchiolitis (advanced, chronic phase)","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC-LE 3] 07 Pathology of the Lungs I and LE 3 Feedback","f":[107]},"27b:89":{"id":"27b:89","ex":"2027 LE3","y":2027,"n":89,"p":27,"s":"A 65 year old male, known as a heavy smoker, has had clinical signs of Cushing's syndrome—moon facies, central obesity and hypertension. Chest CT scan reveals a right lower lobe mass and right hilar lymph node metastasis. Bronchial washings reveal atypical cells which are oval to spindle shaped, small with nuclear molding, scanty to indiscernible cytoplasm. The most likely neoplasm involved is:","c":[["A","Large cell carcinoma"],["B","Adenocarcinoma"],["C","Small cell carcinoma"],["D","Squamous cell carcinoma"]],"k":"C","ks":["C"],"r":[["Large cell carcinoma typically presents as a peripheral tumor with large polygonal cells, abundant cytoplasm, and prominent nucleoli, none of which are described here.","own",""],["Adenocarcinoma is often peripheral and characterized by glandular differentiation, mucin production, and distinct cytoplasm, which is inconsistent with the current cytologic findings.","own",""],["Small cell carcinoma is a high-grade neuroendocrine tumor strongly associated with smoking and is most associated with the paraneoplastic syndrome of Cushing-like symptoms. Histologically, it is characterized by small, oval-to-spindle-shaped cells with nuclear molding, scant cytoplasm, and frequent mitoses.","own",""],["Squamous cell carcinoma is strongly associated with smoking and often presents with a central lung mass. Histologically, it shows keratin pearls and intercellular bridges, which are not described in this case.","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC-LE 3] 07 Pathology of the Lungs I","f":[33]},"27b:90":{"id":"27b:90","ex":"2027 LE3","y":2027,"n":90,"p":27,"s":"In the pathogenesis of atopic asthma, this immune cell plays a pivotal role in the promotion of inflammation and stimulation of B cells to produce antibodies:","c":[["A","Cytotoxic T lymphocyte"],["B","TH2 lymphocyte"],["C","TH1 lymphocyte"],["D","Neutrophils"]],"k":"B","ks":["B"],"r":[["Cytotoxic lymphocytes are primarily directed at intracellular infectious agents","own",""],["T helper 2 lymphocyte response drives cytokine production, such as IL-4, IL-5, and IL-13, that promotes eosinophil infiltration and IgE production by mast cells. This allergic response potentiates inflammation, which promotes the airway remodeling that facilitates additional airway re-activity and asthmatic episodes.","own",""],["The TH1 response drives granulomatous inflammation","own",""],["Neutrophils may play a role in the late-phase reaction as part of the recruitment of leukocytes together with your eosinophils.","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC-LE 3] 07 Pathology of the Lungs I","f":[]},"27b:91":{"id":"27b:91","ex":"2027 LE3","y":2027,"n":91,"p":28,"s":"A 47-year-old female has a history of recurrent pneumonia for the past 3 years. Her last admission was a severe pneumonia which grew fungal organism on culture. Presently, she is admitted again due to persistent cough with foul-smelling sputum and dyspnea. Her recent CXR revealed dilated bronchi with thickened walls (tram-track sign). Her most likely condition is:","c":[["A","Non-atopic asthma"],["B","Bronchiectasis"],["C","Chronic bronchitis"],["D","Emphysema"]],"k":"B","ks":["B"],"r":[["Reversible airway obstruction with treatment","own",""],["This is a case of bronchiectasis wherein the female has recurrent bouts of respiratory infection which predispose her to this condition. She presented with persistent cough and foul smelling sputum . Her CXR revealed dilated bronchi with tram-track sign which is associated with bronchiectasis.","own",""],["Associated with persistent cough with sputum for at least three months per year in at least 2 consecutive years","own",""],["Associated with alveolar destruction, not bronchial dilation","own",""]],"t":"UNC","sub":"Lung pathology","ref":"[PTH LEC - LE 3] 07 - Pathology of the Lungs","f":[]},"27b:92":{"id":"27b:92","ex":"2027 LE3","y":2027,"n":92,"p":28,"s":"A 65-year old retired miner had progressively worsening dyspnea for the past 5 years. He noticed a 4-kg weight loss in the past 2 years. On PE, he was afebrile and normotensive, chest X-ray showed extensive interstitial disease and “egg shell” calcification seen in the hilar region. Which substance is he most likely exposed to?","c":[["A","Tobacco smoke"],["B","Asbestos"],["C","Moldy hay"],["D","Silica"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["In asbestosis, calcium and iron salts gather about long slender spicules of asbestos in the lungs, creating exotic, beaded dumbbell forms known as asbestos bodies.","bor","2027 LE2 Q33"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Keyword: Egg shell calcification A key finding in silicosis is “eggshell” calcification seen in the hilar region during chest x-ray","own",""]],"t":"UNC","sub":"Lung pathology","bm":1,"orig":"Keyword: Egg shell calcification A key finding in silicosis is “eggshell” calcification seen in the hilar region during chest x-ray","ref":"[PTH LEC - LE 3] 07 - Pathology of the Lungs I","f":[]},"27b:93":{"id":"27b:93","ex":"2027 LE3","y":2027,"n":93,"p":28,"s":"This lung tumor is associated to exposure to smoking, TP53 and CDKN2A mutation :","c":[["A","Squamous Cell Carcinoma"],["B","Small Cell Carcinoma"],["C","Adenocarcinoma"],["D","Carcinoid"]],"k":"A","ks":["A"],"r":[["Squamous cell carcinoma: This histologic subtype is often associated with the overexpression of TP53 and P53","own",""],["Small cell carcinoma: Associated with inactivation of TP53 and RB. The acquisition of RB loss-of-function mutations is more closely associated with this diagnosis","own",""],["Adenocarcinoma: There are detected mutations in the following genes : EGFR, ALK, ROS, MET, RET along with TTF-1","own",""],["Carcinoid tumors: are NOT related to cigarette smoking as 20%-40% of patients with this diagnosis are non-smokers","own",""]],"t":"UNC","sub":"Lung pathology","ref":"Reference trans/ book: [PTH LEC - LE 3] 08 - Pathology of the Lungs II and LE 3 Feedback","f":[144]},"27b:94":{"id":"27b:94","ex":"2027 LE3","y":2027,"n":94,"p":28,"s":"A 40-year-old male, non-smoker, had increasing cough with hemoptysis for 2 weeks . P.E. findings show a temp of 38.2℃. Chest radiograph shows an area of consolidation in the right upper lobe. His condition improved with antibiotic therapy, however, the cough and hemoptysis persist for 2 more weeks. Chest CT scan now shows right upper lung atelectasis. Bronchoscopic examination shows a tan, circumscribed obstructive mass filling a right upper lobe bronchus. Which of the following neoplasms is most likely to produce these findings?","c":[["A","Adenocarcinoma"],["B","Carcinoid tumor"],["C","Hamartoma"],["D","Large cell carcinoma"]],"k":"B","ks":["B"],"r":[["Adenocarcinomas are a common lung tumor but are typically peripheral.","own",""],["Pulmonary carcinoids are central obstructing masses involving a large to medium-sized bronchus. These neuroendocrine tumors have unpredictable behavior, but many are localized, retractable, and follow a benign course. These typically manifest with hemoptysis and the consequences of bronchial obstruction. Obstruction may lead to peripheral resorption atelectasis.","own",""],["Hamartoma is an uncommon but benign pulmonary lesion that is also located peripherally","own",""],["Similar to adenocarcinomas, large cell carcinomas are a common lung tumor but are typically peripheral.","own",""]],"t":"UNC","sub":"Lung pathology","ref":"2027 PATHO LE3 Feedback","f":[111]},"27b:95":{"id":"27b:95","ex":"2027 LE3","y":2027,"n":95,"p":29,"s":"A 30 y/o female presented with progressive dyspnea and fatigue for the past 12 months. On PE, she presented with signs and symptoms of right-sided heart failure such as neck vein distention, hepatotoxicity, cardiomegaly on catheterization. What gene is responsible for this","c":[["A","BMPR2"],["B","Fibrillin 1"],["C","TERT"],["D","BNP"]],"k":"A","ks":["A"],"r":[["This is a case of primary pulmonary hypertension in a young individual without any known pulmonary or cardiac disease which may elevate her pulmonary arterial pressure. The pathology involve in primary pulmonary hypertension is mutation of the gene encoding your bone morphogenetic protein receptor type 2 which normally functions in regulation of apoptosis, proliferation and differentiation. Hence mutation leads to dysfunction and proliferation of endothelial cells and smooth muscle fibers.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Lung pathology","bm":1,"orig":"This is a case of primary pulmonary hypertension in a young individual without any known pulmonary or cardiac disease which may elevate her pulmonary arterial pressure. The pathology involve in primary pulmonary hypertension is mutation of the gene encoding your bone morphogenetic protein receptor type 2 which normally functions in regulation of apoptosis, proliferation and differentiation. Hence mutation leads to dysfunction and proliferation of endothelial cells and smooth muscle fibers.","f":[110]},"27b:96":{"id":"27b:96","ex":"2027 LE3","y":2027,"n":96,"p":29,"s":"A 45 year-old female complained of severe productive cough with yellowish sputum, moderate to high grade fever and breathing discomfort for 3 day. CBC shows elevated WBC with predominance of segmenters in differential count. Diffused rales was heard in the left lower lung which appeared on CXS as dense opacification on the left lower lobe. Which likely is the most common specimen isolated in sputum culture.","c":[["A","Mycoplasma pneumonia"],["B","Pseudomonas aeruginosa"],["C","Mycobacterium tuberculosis"],["D","Streptococcus pneumoniae"]],"k":"D","ks":["D"],"r":[["M. pneumoniae - causes atypical pneumonia, would appear as patchy infiltrates in CXR","own",""],["P. aeruginosa causes necrotizing pneumonia, characterized by lung lesions in terminal airways distributed in a fleur-de-lis pattern","own",""],["M. tuberculosis - causes tuberculosis,","own",""],["S. pneumoniae: High-grade fever, diffuse crackles, and lung consolidation = signs and symptoms of typical pneumonia - Diffuse crackles = indicates mucus/fluid in airways - Elevated WBC with neutrophil predominance + YELLOWISH sputum = bacterial infection - The most common causative agents of typical pneumonia: S. pneumoniae (G+), H. influenzae (G-), K. pneumoniae, M. catarrhalis","own",""]],"t":"UNC","sub":"Lung pathology","f":[]},"27b:97":{"id":"27b:97","ex":"2027 LE3","y":2027,"n":97,"p":29,"s":"Which of the following pairs of pulmonary infection and its clinical feature is CORRECT?","c":[["A","Staphylococcus aureus: following the viral respiratory infection"],["B","Moraxella catarrhalis: pulmonary infection seen commonly in infants and children"],["C","Pseudomonas aeruginosa: local epidemic in community esp. in elderly"],["D","Haemophilus influenzae: immunocompromised individuals such as organ transplant recipient"]],"k":"A","ks":["A"],"r":[["S. aureus often complicates viral respiratory illnesses causing secondary bacterial pneumonia especially in children, and has a high risk of lung abscess and empyema.","own",""],["M. catarrhalis: Local epidemic in the community especially in elderly, known for causing pneumonia in elderly & in patients with COPD.","own",""],["P. aeruginosa: Immunocompromised individuals such as organ transplant recipient, usually seen in hospital acquired pneumonias","own",""],["H. influenzae: Pulmonary infection seen commonly in infants and children but has been dramatically diminished by vaccination. Pneumonia develops from spread from an upper respiratory infection and acute exacerbations in COPD patients.","own",""]],"t":"UNC","sub":"Lung pathology","ref":"Robbins & Kumar. 11th Ed. p.421 & Patho LE3 Feedback","f":[]},"27b:98":{"id":"27b:98","ex":"2027 LE3","y":2027,"n":98,"p":30,"s":"Which of the following features is associated with chronic pneumonia?","c":[["A","diffuse involvement of lung tissue"],["B","caused by Mycobacteria and fungi"],["C","incites a suppurative inflammation"],["D","pathogen easily isolated on culture"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["The features of chronic pneumonia are the usual pathogens involved are either fungi or Mycobacterial that usually elicits a granulomatous inflammatory reaction. The usual presentation of chronic pneumonia is a localized lesion in the lung in an immunocompetent person. Most often a localized lesion in an immunocompetent person with or without regional lymph node Involvement. In chest X-rays, it shows focal or diffuse shadows Typically due to granulomatous inflammation due to slow growing microorganisms such as bacteria (e.g. M. tuberculosis) or fungi (Histoplasma capsulatum, Coccidioides immitis, Blastomyces). In immunocompromised patients, there is usually systemic dissemination of the causative agent, accompanied by widespread disease. Tuberculosis is the most important entity within the spectrum of chronic pneumonia","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Lung pathology","bm":1,"orig":"The features of chronic pneumonia are the usual pathogens involved are either fungi or Mycobacterial that usually elicits a granulomatous inflammatory reaction. The usual presentation of chronic pneumonia is a localized lesion in the lung in an immunocompetent person. Most often a localized lesion in an immunocompetent person with or without regional lymph node Involvement. In chest X-rays, it shows focal or diffuse shadows Typically due to granulomatous inflammation due to slow growing microorganisms such as bacteria (e.g. M. tuberculosis) or fungi (Histoplasma capsulatum, Coccidioides immitis, Blastomyces). In immunocompromised patients, there is usually systemic dissemination of the causative agent, accompanied by widespread disease. Tuberculosis is the most important entity within the spectrum of chronic pneumonia","ref":"[PTH LEC-LE 3] 08 Pathology of the Lungs II","f":[109]},"27b:99":{"id":"27b:99","ex":"2027 LE3","y":2027,"n":99,"p":30,"s":"A 46-year-old female had body malaise and a 6-kg weight loss over the past 3 years. She had fever, cough, and increasing dyspnea for the past 3 days. CXR shows extensive bilateral infiltrates. Bronchial washings revealed organisms appearing as “crushed ping pong balls or folded spheres” on Gomori methenamine silver stain. Which of the following underlying condition is most likely present in this patient?","c":[["A","Diabetes mellitus"],["B","HIV infection"],["C","Sarcoidosis"],["D","Systemic lupus erythematosus"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["The patient’s pathological findings Gomori Methenamine Silver-stained organisms resembling crush ping pong balls, bilateral infiltrates, and immune dysfunction strongly suggest Pneumocystis jirovecii pneumonia which usually affects immunocompromised patients such as HIV/AIDS.","own",""],["Sarcoidosis: Inflammatory disease that affects multiple organs in the body ● Common sites: Lungs and hilar lymph nodes ● Forms noncaseating granulomas She has restrictive lung disease known as sarcoidosis as seen by the reticulonodular infiltrates seen on CXR and the characteristic histologic features of noncaseating granuloma formation and the presence of stellate inclusions within giant cells known also as asteroid bodies.","bor","2027 LE3 Q88"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Lung pathology","bm":1,"orig":"The patient’s patholog - LE3] 09- Head and Neck Pathology I","f":[]},"27b:105":{"id":"27b:105","ex":"2027 LE3","y":2027,"n":105,"p":31,"s":"A 32-year old male presents with a white tongue lesion that cannot be scraped off. The biopsy report describes the presence of epithelial hyperkeratosis, acanthosis, and superficial dysplasia. Which of the following histologic terms refer to epidermal hyperplasia?","c":[["A","Acanthosis"],["B","Dysplasia"],["C","Carcinoma in-situ"],["D","Hyperkeratosis"]],"k":"A","ks":["A"],"r":[["Acanthosis or hyperplasia is the thickening of the squamous mucosa.","own",""],["Dysplasia in cases of leukoplakia may or may not be present.","own",""],["Carcinoma in-situ is defined as dysplasia of the entire epithelial layer without invasion of the basement membrane into the underlying tissue.","own",""],["Hyperkeratosis refers to the thickening of the superficial layer of the squamous epithelium.","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"2026 LE6 Feedback; [PTH LEC - LE3] 09- Head and Neck Pathology I","f":[]},"27b:106":{"id":"27b:106","ex":"2027 LE3","y":2027,"n":106,"p":31,"s":"Neoplasm associated with HPV 6 and 11","c":[["A","Undifferentiated Nasopharyngeal Carcinoma"],["B","Squamous Cell Carcinoma"],["C","Inverted Sinonasal Papilloma"],["D","All of the Above"]],"k":"C","ks":["C"],"r":[["High association with EBV infections","own",""],["squamous cell carcinoma (p63, p40) TTF-1 and p40 negative argue against adenocarcinoma and squamous cell carcinoma. Large cell carcinoma is considered an undifferentiated tumor that lacks the cytologic feature of adenocarcinoma or squamous differentiation.","bor","2028 LE3 Q85"],["Inverted Papilloma has the highest association with HPV 6 and 11","own",""],["Characteristic clinical feature of restrictive CMP - due to a restrictive ventricular filling and pressure overload","bor","2027 LE3 Q79"]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"[PTH LEC - LE3] 09- Head and Neck Pathology ; [PTH LEC - LE3] 10- Head and Neck Pathology II","f":[]},"27b:107":{"id":"27b:107","ex":"2027 LE3","y":2027,"n":107,"p":32,"s":"Which of the following types of NASOPHARYNGEAL CARCINOMA is the most sensitive to radiotherapy?","c":[["A","Keratinizing Squamous Cell Carcinoma"],["B","Non-Keratinizing Squamous Cell Carcinoma"],["C","Undifferentiated Carcinoma"],["D","All of these types have the same radiosensitivity"]],"k":"C","ks":["C"],"r":[["Most RESISTANT to radiotherapy","own",""],["Intermediate in its radiosensitivity.","own",""],["Most SENSITIVE to radiotherapy","own",""],["Most to least sensitive: Undifferentiated Ca → Non-Keratinizing SCCa → Keratinizing SCCa","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"[PTH LEC - LE3] 10 - Head and Neck Pathology II: Neck, Nose, Ear, & Salivary Glands","f":[]},"27b:108":{"id":"27b:108","ex":"2027 LE3","y":2027,"n":108,"p":32,"s":"Which of the following lesions will probably NOT have a history of trauma?","c":[["A","Aphthous ulcer"],["B","Irritation Fibroma"],["C","Mucocele"],["D","Periapical Cyst"]],"k":"A","ks":["A"],"r":[["Aphthous ulcers are painful recurrent ulcers with unknown etiology.","own",""],["Irritation fibroma usually occurs after a history of trauma. It is also known as traumatic fibroma or focal fibrous hyperplasia.","own",""],["Mucoceles are mucous cysts formed from obstruction or rupture of a salivary gland duct due to trauma.","own",""],["Periapical cyst or radicular cyst are caused by inflammation of the dental pulp related to caries or trauma.","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"[PTH LEC-LE3] 09 Head and Neck Pathology I: Oral Pathology; [PTH LEC-LE 3] 10 Head and Neck Pathology II: Neck, Nose, Ear, & Salivary Gland","f":[]},"27b:109":{"id":"27b:109","ex":"2027 LE3","y":2027,"n":109,"p":32,"s":"A patient complained of easy gum bleeding and a presence of marked gingival recession with erythema. All of the following structures are involved EXCEPT:","c":[["A","Alveolar bone"],["B","Cementum"],["C","Dentin"],["D","Periodontal ligament"]],"k":"C","ks":["C"],"r":[["Alveolar bone: ridge of the jaw involved in periodontitis","own",""],["Cementum: covers the dentin and anchors the periodontal ligament, involved in pericarditis","own",""],["Dentin: specialized connective tissue making up most of the hard part of the tooth, not involved in periodontitis Periodontitis is the inflammation of the supporting structures of the teeth: 1) Periodontal ligament, 2) Alveolar bone, and 3) Cementum.","own",""],["Periodontal ligament: fibrous connective tissue that binds the cementum and alveolar bone, involved in periodontitis","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"[PTH LEC - LE 3] 09 - Head and Neck Pathology I","f":[]},"27b:110":{"id":"27b:110","ex":"2027 LE3","y":2027,"n":110,"p":32,"s":"What is TRUE of Ameloblastoma","c":[["A","Commonly cystic and indolent course"],["B","Most cases are located on the posterior maxilla"],["C","Highly aggressive and rapid growth"],["D","High rate of malignancy"]],"k":"A","ks":["A"],"r":[["Ameloblastoma are commonly cystic and locally invasive. It is commonly in the posterior mandible and follow an indolent, slow-growing course.","own",""],["Most cases (80%) involve the posterior MANDIBLE","own",""],["Aggressive in involved area, Locally invasive and Slow-growing","own",""],["Benign but locally invasive Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"[PTH LEC - LE 3] 09 - Head and Neck Pathology I","f":[]},"27b:111":{"id":"27b:111","ex":"2027 LE3","y":2027,"n":111,"p":32,"s":"Which of the following is TRUE about both Branchial and Thyroglossal duct cysts?","c":[["A","Both originate from neuroendocrine cells."],["B","Both are found in the upper lateral aspect of the neck."],["C","Both have the same epithelial lining."],["D","Both have remnants of thyroid follicles."]],"k":"C","ks":["C"],"r":[["The Paraganglioma originates from neuroendocrine cells. Not the Branchial and Thyroglossal duct cysts.","own",""],["Branchial cyst only while the Thyroglossal duct is at midline.","own",""],["Both cysts may be lined by stratified squamous to pseudostratified columnar epithelium.","own",""],["Branchial cysts - lymphoid tissue with formation of prominent germinal centers. Thyroglossal duct cyst - may have lymphoid aggregates or remnant of thyroid tissue within the wall.","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"[PTH LEC - LE3] 10- Head and Neck Pathology II: Neck, Nose, Ear & Salivary Glands","f":[]},"27b:112":{"id":"27b:112","ex":"2027 LE3","y":2027,"n":112,"p":33,"s":"Among the patients, which best fits the clinical profile of a person with Warthin’s tumor?","c":[["A","55 year old male smoker with midline mass presenting with dysphagia"],["B","60 year old male smoker with painless bilateral parotid masses"],["C","55 year old female smoker with slow growing parotid mass"],["D","45 year old female patient with slow growing submandibular mass"]],"k":"B","ks":["B"],"r":[["A midline mass or cyst found in the neck is the thyroglossal duct cyst.","own",""],["Male smokers have a higher predisposition to developing Warthin’s tumor which is characterized as painless bilateral parotid masses. Warthin’s tumor is also known as Benign Papillary Cystadenoma Lymphomatosum.","own",""],["Males have a higher risk of developing Warthin’s tumor compared to females. A female with a slow growing unilateral parotid mass fits the clinical profile of Pleomorphic Adenoma more.","own",""],["Warthin’s tumor is located more commonly in the parotid gland, not in the submandibular gland.","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"[PTH LEC - LE3] 10- Head and Neck Pathology II: Neck, Nose, Ear & Salivary Glands","f":[]},"27b:113":{"id":"27b:113","ex":"2027 LE3","y":2027,"n":113,"p":33,"s":"True of mucoepidermoid carcinom tic factors: large size (>2cm), poor grade, perineural invasion, location within inner portion of canal, temporal bone involvement","own",""],["Leukoplakia: White patch or plaque that cannot be easily scraped off, premalignant lesion 5-25% of the time, commonly associated with dysplasia","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","ref":"2026 LE6 Feedback; [PTH LEC - LE3] 09- Head and Neck Pathology I; [PTH LEC - LE3] 10 - Head and Neck Pathology II","f":[]},"27b:117":{"id":"27b:117","ex":"2027 LE3","y":2027,"n":117,"p":34,"s":"A 50 year old secretary complained of a slow growing discrete non painful periauricular mass measuring 3cm. Histologic examination showed sheets of epithelial and myoepithelial cells on blueish cartilaginous stroma. What is true:","c":[["A","Myoepithelial cells make up the outer layer of glandular and ductal tissues"],["B","Most common malignant salivary neoplasm"],["C","Epithelial predominance results to higher risk than myoepithelial predominance"],["D","Myoepithelial predominance results to higher risk than epithelial predominance"]],"k":"A","ks":["A"],"r":[["Pleomorphic Adenoma: ● Painless, slow-growing mass below the left side of the ear ● Epithelial or ductal component forms the inner layer of cysts and tubules ● Myoepithelial cell component forms the outer layer of cysts and tubules scattered within the myxoid stroma","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Head and neck, oral cavity","bm":1,"orig":"Pleomorphic Adenoma: ● Painless, slow-growing mass below the left side of the ear ● Epithelial or ductal component forms the inner layer of cysts and tubules ● Myoepithelial cell component forms the outer layer of cysts and tubules scattered within the myxoid stroma","ref":"[PTH LEC - LE3] 10 - Head and Neck Pathology I","f":[]},"27b:118":{"id":"27b:118","ex":"2027 LE3","y":2027,"n":118,"p":34,"s":"A 20 yr old student consulted for gradually growing cystic mass in his left mandible, near the 3rd molar space. He reported feeling pain and numbness in the affected area. An x-ray showed an unilocular radiolucency surrounding an apparently unruptured tooth. He has likely a/an:","c":[["A","Ameloblastoma"],["B","Dentigerous cyst"],["C","Periapical cyst"],["D","Pyogenic granuloma"]],"k":"B","ks":["B"],"r":[["Ameloblastoma: AKA Adamantinoma, X-ray: Multilocular radiolucency with well-defined, corticated, and scalloped margins (soap bubble appearance)","own",""],["Dentigerous cyst originates around the crown of an erupted permanent tooth, involves permanently impacted third molars seen as a thin layer of stratified squamous. epithelium with dense chronic inflammation","own",""],["Periapical cyst: AKA Radicular cyst, Due to inflammation of dental pulp related to caries or trauma, X-ray: round or flask-shaped lucency with radiopaque margin","own",""],["Pyogenic granuloma: Gros: Well-circumscribed, erythematous, hemorrhagic exophytic mass arising from the gingival mucosa, Histology: Lobular proliferation of small blood vessels","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","f":[]},"27b:119":{"id":"27b:119","ex":"2027 LE3","y":2027,"n":119,"p":35,"s":"A 62-year-old female complains of a 2.0 cm, slow-growing, left buccal mucosa mass. She also complains of dull, constant pain. Excision was done and microscopy revealed tubular and cribriform structures with microcysts lined by small cells with dark, compact nuclei. TRUE of this neoplasm:","c":[["A","Lymphovascular invasion can account for the pain symptoms"],["B","It is the most common malignant salivary gland neoplasm"],["C","Commonly metastasizes to the lymph node"],["D","The three histologic forms may co-exist in one tumor"]],"k":"D","ks":["D"],"r":[["Note: some choices were different but the answer was still ACC Pain in Adenoid Cystic Carcinoma is due to perineural invasion.","own",""],["Mucoepidermoid carcinoma Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Adenoid Cystic Carcinoma metastasize locally to bone,liver, lungs and brain. Lymph node metastasis is uncommon.","own",""],["Adenoid Cystic Carcinoma can appear with as three typical growth patterns: cribriform, tubular, and solid","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","f":[]},"27b:120":{"id":"27b:120","ex":"2027 LE3","y":2027,"n":120,"p":35,"s":"A 19 year old male develops painful vesicles near his mouth, along with low-grade fever and palpable submandibular lymph nodes. The attending physician noted grouped vesicles on an erythematous base. Tzanck smear was done on the vesicle fluid. The following histologic findings will suggest an HSV infection, EXCEPT:","c":[["A","Acanthocyte"],["B","Koilocytes"],["C","Intranuclear eosinophilic inclusion bodies"],["D","Multinucleated giant cells"]],"k":"B","ks":["B"],"r":[["Acantholytic cells - HSC Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Koilocytes - HPV Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Intranuclear eosinophilic inclusion bodies - HSV","own",""],["Multinucleated giant cells - HSV","own",""]],"t":"UNC","sub":"Head and neck, oral cavity","flag":"Source-key warning: the uploaded exam keys B (Koilocytes), but the accompanying rationale links koilocytes to HPV and links intranuclear inclusions and multinucleated giant cells to HSV, which is the infection described. The source material does not resolve this.","orig":"Acantholytic cells - HSC | Koilocytes - HPV | Intranuclear eosinophilic inclusion bodies - HSV | Multinucleated giant cells - HSV","f":[38]},"28a:1":{"id":"28a:1","ex":"2028 LE2","y":2028,"n":1,"p":1,"s":"What is the role of Nitric oxide, upon its release from the endothelial cells in case of overwhelming infection?","c":[["A","Cause marked interstitial edema"],["B","Vasodilation leading to shock"],["C","perfusion of inflammatory cells"],["D","Disability of the cells to function"]],"k":"B","ks":["B"],"r":[["Not the primary, direct effect of NO release, although a consequence of increased vascular permeability due to vasodilation.","own",""],["In overwhelming infection (septic shock), endothelial cells and macrophages release large amounts of NO via inducible nitric oxide synthase (iNOS). NO is a potent vasodilator that decreases systemic vascular resistance, which leads to hypotension and distributive shock","own",""],["In overwhelming infection, the major pathologic effect is widespread vasodilation and shock, not targeted immune perfusion.","own",""],["A consequence of shock rather than directly from NO release, as blood flow decreases to organs = low oxygen distribution","own",""]],"t":"UNC","sub":"LE1 recall","ref":"LE 1 PATHOLOGY","f":[]},"28a:2":{"id":"28a:2","ex":"2028 LE2","y":2028,"n":2,"p":1,"s":"Which of the following substances indicates that the thoracic fluid in the thoracic cavity is an exudate?","c":[["A","Clear appearance"],["B","Low protein content"],["C","Low leukocyte count"],["D","Presence of fibrin"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["“An exudate is an extravascular fluid that has a high protein concentration and contains cellular debris. Its presence implies increased vascular permeability due to inflammation. By contrast, a transudate is a fluid with low protein content, little or no cellular material, and a low specific gravity... Exudates often coƒkntain fibrin, resulting from the leakage of plasma proteins, including fibrinogen.”","own",""]],"t":"UNC","sub":"LE1 recall","bm":1,"orig":"“An exudate is an extravascular fluid that has a high protein concentration and contains cellular debris. Its presence implies increased vascular permeability due to inflammation. By contrast, a transudate is a fluid with low protein content, little or no cellular material, and a low specific gravity... Exudates often coƒkntain fibrin, resulting from the leakage of plasma proteins, including fibrinogen.”","ref":"Robbins and Cotran Pathologic Basis of Disease (10th ed.) p.93-94","f":[71]},"28a:3":{"id":"28a:3","ex":"2028 LE2","y":2028,"n":3,"p":1,"s":"Which of the following substances elaborated by macrophages would have the function of stimulating capillary proliferation?","c":[["A","Fibronectin"],["B","Phospholipase C-gamma"],["C","Epidermal growth factor"],["D","Fibroblast growth factor"]],"k":"D","ks":["D"],"r":[["Extracellular glycoprotein that helps organize and maintain homeostasis of the extracellular matrix","own",""],["Signaling molecule that associates with epidermal growth factor receptor (EGFR)","own",""],["Mitogenic for keratinocytes and fibroblasts, stimulated keratinocyte migration","own",""],["Vascular endothelial growth factor (VEGF) stimulates angiogenesis in the first week. These new capillaries provide blood supply to the area with nutrients necessary for repair Aside from VEGF, fibroblast growth factor also aids in angiogenesis and is necessary for capillary growth formation.","own",""]],"t":"UNC","sub":"LE1 recall","ref":"2027 Samplex","f":[69]},"28a:4":{"id":"28a:4","ex":"2028 LE2","y":2028,"n":4,"p":1,"s":"Which of the following is the role of aspirin in inflammation","c":[["A","Inhibits cyclooxygenase (COX) enzyme to decrease prostaglandin synthesis"],["B","Inhibits lipoxygenase enzyme to prevent leukotriene formation"],["C","Inhibits myeloperoxidase enzyme to block neutrophil oxidative activity"],["D","Inhibits phospholipase A₂ to prevent release of arachidonic acid"]],"k":"A","ks":["A"],"r":[["Aspirin (acetylsalicylic acid) irreversibly inhibits COX-1 and COX-2 enzymes by acetylating their active sites. This blocks the conversion of arachidonic acid → prostaglandin H₂, a precursor of prostaglandins, prostacyclins, and thromboxanes.","own",""],["The lipoxygenase pathway converts arachidonic acid into leukotrienes, which are involved in bronchoconstriction and inflammation (especially in asthma). Aspirin does not inhibit lipoxygenase, instead, by blocking COX, it may shunt arachidonic acid toward the lipoxygenase pathway, sometimes worsening asthma (called aspirin-induced asthma).","own",""],["Myeloperoxidase (MPO) is an enzyme in neutrophils that produces hypochlorous acid (HOCl) from hydrogen peroxide during the respiratory burst, contributing to microbial killing. Aspirin does not inhibit MPO — it primarily affects prostaglandin synthesis, not neutrophil oxidative mechanisms.","own",""],["Phospholipase A₂ (PLA₂) releases arachidonic acid from membrane phospholipids, which is the precursor for both the COX and LOX pathways. Aspirin does not inhibit PLA₂ — this is the mechanism of corticosteroids, which act earlier in the inflammatory cascade.","own",""]],"t":"UNC","sub":"LE1 recall","f":[70]},"28a:5":{"id":"28a:5","ex":"2028 LE2","y":2028,"n":5,"p":2,"s":"Allergic rhinitis causes the release of histamine. Which cell releases histamine?","c":[["A","Plasma Cells"],["B","Neutrophils"],["C","Mast Cells"],["D","Serotonin"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["The philadelphia chromosome or t(9:22) is typically seen in CML. Since it is a chronic form of anemia with less than 20% blasts, the predominant cells remain to be the neutrophils and stabs. Choice D: only less than 20% are seen","bor","2027 LE2 Q89"],["Mast cells initiate cellular immune responses at the infection site by recruitment of various subsets of T cells","bor","2026 LE2 Q16"],["Cause swelling by increasing vascular permeability","bor","2026 LE2 Q1"]],"t":"UNC","sub":"LE1 recall","bm":1,"ref":"2028 Trans - Inflammation and Repair 1","f":[]},"28a:6":{"id":"28a:6","ex":"2028 LE2","y":2028,"n":6,"p":2,"s":"What is the correct chronological order of the vascular events of inflammation?","c":[["A","Vasodilation → increased blood flow → edema → vasoconstriction"],["B","Edema → vasodilation → vasoconstriction → decreased blood flow"],["C","Initial vasoconstriction → vasodilation → increased blood flow → edema"],["D","Initial vasoconstriction → increased blood flow → edema → vasoconstriction"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Injurious stimuli initally causes vasconstriction as a denfense mechanism to limit vascular damage. Once histamine and other cytokines are released, vasodilation occurs, and the membrane becomes more permeable to accommodate WBCs. Eventually, further histamine and cytokine release leads to pooling of fluid in body cavities (edema).","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none" ject, and the uploaded feedback gives no rationale for this option.","none",""],["Chemotaxis refers to the unilateral (directional) movement of leukocytes—such as neutrophils and macrophages—toward the site of injury or infection in response to chemical signals like cytokines and chemokines. These signals create a gradient that guides immune cells to where they're needed most","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"LE1 recall","bm":1,"orig":"Chemotaxis refers to the unilateral (directional) movement of leukocytes—such as neutrophils and macrophages—toward the site of injury or infection in response to chemical signals like cytokines and chemokines. These signals create a gradient that guides immune cells to where they're needed most","ref":"LE 1 Shopee 2028","f":[]},"28a:9":{"id":"28a:9","ex":"2028 LE2","y":2028,"n":9,"p":3,"s":"What could be the defect to chronic granulomatous disease of a young boy presenting recurrent, severe, bacterial pneumonia despite antibiotic treatment?","c":[["A","Chemotaxic"],["B","NADPH oxidase"],["C","Leukocyte adhesion deficiency"],["D","Lyzosomal oxidase"]],"k":"B","ks":["B"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["NADPH (phagocyte) oxidase generates superoxide for bacterial killing. Its genetic defect causes chronic granulomatous disease with recurrent severe bacterial infections.","gen",""],["Leukocyte adhesion deficiency is a defect of integrin beta chains (type 1) or of sialyl-Lewis X (type 2), so leukocytes cannot adhere to endothelium and migrate into tissues.","gen",""],["Project-source n r"],["D","Presence of HPV in Serum"]],"k":"C","ks":["C"],"r":[["Does not confirm a specific tumor.","own",""],["Radiographic features not enough to distinguish Kaposi’s Sarcoma from other neoplastic conditions","own",""],["Skin lesion histology shows nodular proliferation of dilated irregular endothelial cell-line vascular spaces with interspersed lymphocytes, plasma cells, and macrophage","own",""],["Caused by HHV-8, not HPV Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","ref":"2028 Trans","f":[]},"28a:12":{"id":"28a:12","ex":"2028 LE2","y":2028,"n":12,"p":3,"s":"Follicular tumor of the thyroid was removed via thyroidectomy. Which of the following microscope findings most likely indicate that the neoplasm is malignant?","c":[["A","Atypia"],["B","Pleomorphism"],["C","Capsular invasion"],["D","Increased nucleus:cytoplasm ratio"]],"k":"C","ks":["C"],"r":[["Atypia refers to abnormal cytologic features. It can be seen in dysplasia and is not proof of malignancy.","gen",""],["Pleomorphism is variation in size and shape of cells and nuclei. It is a feature of anaplasia that suggests but does not prove malignancy.","gen",""],["Most defining hallmark of malignancy","own",""],["An increased nuclear to cytoplasmic ratio reflects nuclear enlargement (the nucleus is normally about one quarter of the cell). It is a cytologic clue only.","gen",""]],"t":"N1","sub":"","bm":1,"orig":"Most defining hallmark of malignancy","ref":"[PTH LEC - LE 2] 1A - Neoplasia 1 (V1)","f":[17]},"28a:13":{"id":"28a:13","ex":"2028 LE2","y":2028,"n":13,"p":3,"s":"Which of the following is the best interpretation for Grade 1 Stage 1 carcinoma for the patient noted to have a polypoid mass in the rectum?","c":[["A","Unlikely to be malignant"],["B","Arising from the epithelium"],["C","May spread via lymphatics and blood stream"],["D","Well differentiated and localized"]],"k":"B","ks":["B"],"r":[["A carcinoma is by definition malignant whatever its grade or stage.","gen",""],["The question is asking for the interpretation of grading and staging.","own",""],["Potential for lymphatic and blood-borne spread is true of carcinomas in general and says nothing specific about Grade 1 Stage 1.","gen",""],["Grade 1 means well differentiated, closely resembling the tissue of origin. Stage 1 means the tumor is still localized.","gen",""]],"t":"N1","sub":"","flag":"Cross-year discrepancy: 2028 keys B (Arising from the epithelium) while 2027 LE2 Q32 keys D (Well differentiated and localized) for the identical stem and choices. The 2028 feedback itself says only that the question asks for the interpretation of grading and staging, which matches option D. The source material does not resolve the difference.","bm":1,"orig":"The question is asking for the interpretation of grading and staging.","ref":"[PTH LEC - LE 2] 1A - Neoplasia 1 (V1)","f":[18]},"28a:14":{"id":"28a:14","ex":"2028 LE2","y":2028,"n":14,"p":4,"s":"(non verbatim) A 10-year-old boy was rushed to the emergency room due to difficulty seeing. Upon molecular analysis, it was noted that both copies of a gene regulating the transition from the G1 to S phase of the cell cycle were missing. Which gene is most likely affected?","c":[["A","BCL"],["B","ABL"],["C","Kras"],["D","Rb"]],"k":"D","ks":["D"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["ABL on chromosome 9 fuses with BCR on 22 in t(9;22), giving the constitutively active tyrosine kinase of CML.","gen",""],["15-20% of all human tumors express mutated RAS proteins. (HRAS, KRAS, NRAS)","bor","2028 LE2 Q31"],["RB gene is a classic tumor suppressor gene that regulates the G1-S checkpoint of the cell cycle. Two-hit theory states that both alleles of a tumor suppressor gene must be inactivated for loss of function. When both Rb copies are missing, the checkpoint fails, causing uncontrolled cell growth, as seen in retinoblastoma, which commonly presents with visual problems in children.","own",""]],"t":"N2","sub":"","ref":"[PTH LEC - LE 2] 1A - Neoplasia 1","f":[27]},"28a:15":{"id":"28a:15","ex":"2028 LE2","y":2028,"n":15,"p":4,"s":"Which of the following neoplasm is most likely to be noted in a 20 cm retroperitoneal mass noted on CT scan?","c":[["A","Melanoma"],["B","Hamartoma"],["C","Liposarcoma"],["D","Lymphoma"]],"k":"C","ks":["C"],"r":[["Malignancy of the skin involving the pigmented cells of the skin, melanocytes","own",""],["Disorganized benign masses indigenous to the involved site","own",""],["Liposarcoma is usually huge retroperitoneal mass","own",""],["Tumors of lymphocytes and their precursors","own",""]],"t":"N1","sub":"","ref":"2027 Pathology LE 2","f":[16]},"28a:16":{"id":"28a:16","ex":"2028 LE2","y":2028,"n":16,"p":4,"s":"A 60 year old man who has a 90-pack year history of cigarette smoking has had a chronic cough for the past 10 years. He has begun to lose weight (3kg) during the past year. No abnormal findings are noted on the physical exam. A chest radiograph reveals a right hilar mass. A sputum cytology shows atypical, hyperchromatic, squamous cells. What is the most common initial pathway for metastases from this lesion?","c":[["A","Lymphatics"],["B","Contiguous spread"],["C","Pleural cavity"],["D","Bloodstream"]],"k":"A","ks":["A"],"r":[["Most common initial route of spread in carcinoma.","own",""],["Occurs later by local invasion","own",""],["Seen in advanced disease with pleural involvement.","own",""],["Hematogenous spread occurs later, often to liver, bone, brain, adrenals","own",""]],"t":"N1","sub":"","ref":"2028 Trans","f":[20]},"28a:17":{"id":"28a:17","ex":"2028 LE2","y":2028,"n":17,"p":4,"s":"Which of the following is associated with multiple tumor masses of 2-5cm with central necrosis noted in CT scan of the liver?","c":[["A","Multicentric origin"],["B","Multifocal benign lesion"],["C","High grade"],["D","Metastatic advanced stage"]],"k":"D","ks":["D"],"r":[["Multicentric origin would mean several independent primary tumors. Multiple necrotic liver masses are read as metastases instead.","gen",""],["Benign lesions do not show central necrosis from outgrowing their blood supply.","gen",""],["Grade describes differentiation under the microscope. It cannot be read from the number of masses on a scan.","gen",""],["Tumor multiplicity with central necrosis is an indication of loss of blood supply to the central portion due to overcrowding from the periphery by the fast growing neoplastic cell.","own",""]],"t":"N1","sub":"","bm":1,"orig":"Tumor multiplicity with central necrosis is an indication of loss of blood supply to the central portion due to overcrowding from the periphery by the fast growing neoplastic cell.","ref":"2027 DR. RUEDA-CU LE2 Feedback","f":[21]},"28a:18":{"id":"28a:18","ex":"2028 LE2","y":2028,"n":18,"p":5,"s":"Which of the following neoplasm is most likely in a darkly pigmented, raised nodule of the hand, showing vimentin positive, darkly pigmented spindle-shaped cells on histology?","c":[["A","Nevus"],["B","Melanoma"],["C","Squamous Cell Carcinoma"],["D","Adenocarcinoma of adnexal skin component"]],"k":"B","ks":["B"],"r":[["A nevus is the benign melanocytic counterpart of melanoma: tan to brown, uniformly pigmented, small and well defined.","gen",""],["Nevi can either be: ● Melanocytic - are tan to brown, uniformly pigmented, small (usually <6 mm), relatively flat macules or elevated papules with well-defined, rounded borders ● Dysplastic - may appear as flat macules, slightly raised plaques with a “pebbly” surface, or target-like lesions with a darker raised center and irregular flat periphery Melanoma grossly is darkly pigmented raised nodule and shows darkly pigmented spindle shaped cells on histology positive for vimentin","own",""],["squamous cell carcinoma (p63, p40) TTF-1 and p40 negative argue against adenocarcinoma and squamous cell carcinoma. Large cell carcinoma is considered an undifferentiated tumor that lacks the cytologic feature of adenocarcinoma or squamous differentiation.","bor","2028 LE3 Q85"],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"N1","sub":"","bm":1,"orig":"Nevi can either be: ● Melanocytic - are tan to brown, uniformly pigmented, small (usually <6 mm), relatively flat macules or elevated papules with well-defined, rounded borders ● Dysplastic - may appear as flat macules, slightly raised plaques with a “pebbly” surface, or target-like lesions with a darker raised center and irregular flat periphery | Melanoma grossly is darkly pigmented raised nodule and shows darkly pigmented spindle shaped cells on histology positive for vimentin","ref":"2027 SB","f":[22]},"28a:19":{"id":"28a:19","ex":"2028 LE2","y":2028,"n":19,"p":5,"s":"Which of the following parameters of neoplastic cells best predicts diminished chemotherapy response?","c":[["A","Doubling time"],["B","Extent of apoptosis"],["C","Gene amplification"],["D","Growth fraction"]],"k":"D","ks":["D"],"r":[["Doubling time indicates how quickly the neoplastic cells are dividing, and if no other factors affect growth, there are limits to cell growth as well as cell loss, so this generally takes years. In general, a rapidly proloferating mass will have a fast doubling time and be more responsive to chemotherapy, but this does not give the best indication","own",""],["Does not indicate chemotherapy response","own",""],["Gene amplification is one way cell proliferation is promoted for carcinogenesis but does not predit diminished response to chemotherapy","own",""],["The proportion of cells that are actively proliferating. will predict response to chemotherapy. Cells not actively proliferating are generally unresponsive to chemotherapy","own",""]],"t":"N2","sub":"","ref":"2028 Trans 2 Neoplasia II Formative Quiz","f":[26]},"28a:20":{"id":"28a:20","ex":"2028 LE2","y":2028,"n":20,"p":5,"s":"Which among the following will predict a good prognosis for a woman with breast malignancy?","c":[["A","Tumor cells strongly estrogen receptor positive."],["B","No metastases in the sampled axillary lymph nodes."],["C","Negative result for Her2/neu"],["D","High grade tumor"]],"k":"B","ks":["B"],"r":[["Strongly estrogen receptor-positive tumor recurrence may still occur even years after treatment. It is commonly used as a predictive marker for the long-term outcome of hormonal therapy rather than as a prognostic marker.","own",""],["The hallmark of malignancy is invasion and metastasis. The presence or absence of lymph node metastasis directly reflects the extent of cancer spread, which is the most critical factor in determining prognosis.","own",""],["HER2/neu-negative breast cancers generally have better outcomes but HER2/neu negativity is not always a marker of good prognosis. In node-negative cases, it has minimal prognostic impact, and lymph node status remains the stronger predictor.","own",""],["A tumor with high grade indicates a high level of differentiation. These cells generally grow and spread more rapidly which consequently affects its prognosis.","own",""]],"t":"N1","sub":"","ref":"2027 Pathology LE 2; 2028 LE 2 Trans 1 & 2 (Neoplasia); Soerjomataram, Louwman, Ribot, Roukema, & Coebergh (2007) [1]","f":[24]},"28a:21":{"id":"28a:21","ex":"2028 LE2","y":2028,"n":21,"p":5,"s":"What is the main route of spread of ovarian malignancy involving ascites?","c":[["A","Lymphatic"],["B","Hematogenous"],["C","Contiguous"],["D","Seeding of body cavities"]],"k":"D","ks":["D"],"r":[["A less common pathway. Ovarian malignancy reaches the pelvic and para-aortic lymph nodes and does not involve ascites.","own",""],["Does not usually occur in ovarian malignancy.","own",""],["Refers to direct invasion of nearby tissues and does not involve ascites.","own",""],["Ascites formation is a characteristic of peritoneal seeding, which usually occurs in cancers of the ovary.","own",""]],"t":"N1","sub":"","ref":"Robbins Basic Pathology, 10th edition","f":[]},"28a:22":{"id":"28a:22","ex":"2028 LE2","y":2028,"n":22,"p":6,"s":"Presence of Keratin pearls","c":[["A","Well circumscribed"],["B","Moderately circumscribed"],["C","Poorly circumscribed"],["D","Anaplastic"]],"k":"A","ks":["A"],"r":[["Keratin pearls are a hallmark of well-differentiated squamous cell carcinoma. It has a high degree of differentiation, low-grade malignancy, more organized tumor architecture","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"N1","sub":"","bm":1,"orig":"Keratin pearls are a hallmark of well-differentiated squamous cell carcinoma. It has a high degree of differentiation, low-grade malignancy, more organized tumor architecture","ref":"2027 Pathology LE 2; 2028 LE 2 Trans 1 & 2 (Neoplasia)","f":[]},"28a:23":{"id":"28a:23","ex":"2028 LE2","y":2028,"n":23,"p":6,"s":"Which of the following greatly influences cancer formation","c":[["A","Heredity"],["B","Environmental"],["C","Racial"],["D","immunodeficient"]],"k":"B","ks":["B"],"r":[["The 2028 feedback notes that inherited predisposition accounts for only about 5 to 10 percent of cancers.","gen",""],["More dominant cause than genetics (90-95%)","own",""],["Indirect or minimal Project-source note: The uploa rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"N2","sub":"","flag":"Cross-year discrepancy: 2028 keys C (immune failure). 2025 Q53 keyed 'autonomous and uncontrolled at the onset' for the same stem.","bm":1,"orig":"A transformed cell is one that has undergone genetic or epigenetic changes allowing it to escape normal growth control mechanisms. Abnormal mass of tissue growing autonomously and uncoordinated with surrounding normal tissue Neoplastic cells are transformed (i.e. continue growing without regard for normal control | Neoplastic cells are mostly autonomous (without control) but still depends on host cells for blood supply, some are endocrine dependent","ref":"2028 trans [PTH LEC - LE 2] 01 - Neoplasms I","f":[32]},"28a:27":{"id":"28a:27","ex":"2028 LE2","y":2028,"n":27,"p":7,"s":"A 44 year old woman was noted to have a 4.5 cm mass in the right upper quadrant of the breast. Palpable lymph nodes in the right axillary area were likewise noted. Chest X-ray showed multiple T SCORE nodules in the lungs. Which of the following TNM classification best indicates the stage of her disease?","c":[["A","T1N1M0"],["B","T1N0M1"],["C","T3N0M0"],["D","T4N1M1"]],"k":"D","ks":["D"],"r":[["T1N1M0 would be a small primary with regional nodes and no distant spread. It ignores the large primary and the lung nodules.","gen",""],["T1N0M1 would be a small primary with no nodal involvement but distant metastasis. The palpable axillary nodes rule it out.","gen",""],["T3N0M0 would be a large primary with neither nodal nor distant spread.","gen",""],["4.5 cm mass ≥ 4 cm, presence of regional lymph node involvement, and multiple nodules in lungs T-SCORE Stage Definition Tis In situ, non-invasive, confined to epithelium T1 Small, minimally invasive w/in primary organ site T2 Large, more invasive w/in primary organ site T3 Larger and/or invasive beyond margins of primary organ site T4 Very large and/or very invasive (≥ 4cm), spread to adjacent organs TX Tumor cannot be measured N SCORE N0 No lymph involvemenT N1 Regional lymph node involvement N2 Extensive regional lymph node involvement N3 More distant lymph node involvement NX Cannot be assessed M SCORE M0 No distant metastases M1 Present distant metastases MX Metastesis cannot be measured","own",""]],"t":"N1","sub":"","bm":1,"orig":"4.5 cm mass ≥ 4 cm, presence of regional lymph node involvement, and multiple nodules in lungs T-SCORE Stage Definition Tis In situ, non-invasive, confined to epithelium T1 Small, minimally invasive w/in primary organ site T2 Large, more invasive w/in primary organ site T3 Larger and/or invasive beyond margins of primary organ site T4 Very large and/or very invasive (≥ 4cm), spread to adjacent organs TX Tumor cannot be measured N SCORE N0 No lymph involvemenT N1 Regional lymph node involvement N2 Extensive regional lymph node involvement N3 More distant lymph node involvement NX Cannot be assessed M SCORE M0 No distant metastases M1 Present distant metastases MX Metastesis cannot be measured","ref":"2028 Lec Trans LE2 01 Neoplasms I","f":[19]},"28a:28":{"id":"28a:28","ex":"2028 LE2","y":2028,"n":28,"p":7,"s":"In tumor terminology, ‘oma’ denotes benign. Which of the following is malignant?","c":[["A","Fibroma"],["B","Chondroma"],["C","Lymphoma"],["D","Adenoma"]],"k":"C","ks":["C"],"r":[["A benign tumor of fibroblast-like cells, typically naming benign tumors of mesenchymal cells involves attaching the suffix “-oma” to the cell type of origin","own",""],["A benign cartilaginous tumor","own",""],["This is a deeply entrenched name used for malignant neoplasms arising from lymphoid tissue (tumors of lymphocytes or their precursors). Lymphomas are generally taken to be malignant.","own",""],["A benign epithelial neoplasm derived from glandular tissues","own",""]],"t":"N1","sub":"","ref":"2028 Lec Trans 01 Neoplasms I","f":[]},"28a:29":{"id":"28a:29","ex":"2028 LE2","y":2028,"n":29,"p":7,"s":"Which of the following neoplasms is most likely from the following clinical presentation? 27 year old woman in good health showing a 2cm soft, moveable mass beneath the skin of left forearm which does not change in size over so many years with no associated with no associated pain:","c":[["A","Lipoma"],["B","Leiomyoma"],["C","Polyp"],["D","Fibroma"]],"k":"A","ks":["A"],"r":[["Benign mass, unchanging over the years","own",""],["Benign tumor of smooth muscles, usually arise from the uterus","own",""],["Projection above the mucosal surface which can be benign or malignant","own",""],["Submucosal nodular fibrous tissue","own",""]],"t":"N1","sub":"","ref":"2027 Trans","f":[23]},"28a:30":{"id":"28a:30","ex":"2028 LE2","y":2028,"n":30,"p":8,"s":"Molecular Analysis of the 4 cm gastric antral ulceration shows DNA hypermethylation of CDKN2 complex. Which of the following mechanisms did this abnormal gene expression most likely occur?","c":[["A","Amplification"],["B","Epigenetic Modification"],["C","Point mutation"],["D","Translocation"]],"k":"B","ks":["B"],"r":[["Gene duplication leads to massively increased gene product, cytogenetic hallmark of cancer","own",""],["Created by DNA methyltransferases, tends to silence gene expression","own",""],["Causes a single nucleotide base change, insertion, or deletion of the genetic material, DNA or RNA","own",""],["Occurs when two chromosomes switch/ exchange segments with each other, altering their functionality","own",""]],"t":"N2","sub":"","ref":"2027 SB Ratio","f":[28]},"28a:31":{"id":"28a:31","ex":"2028 LE2","y":2028,"n":31,"p":8,"s":"Which of the following suppressor genes is mostly noted with malignancies?","c":[["A","p53"],["B","bcl"],["C","c-reb"],["D","Kras"]],"k":"A","ks":["A"],"r":[["Tumor suppressor gene, p53, is involved in slowing down cell division or timely cell apoptosis. Involved in the regulation of BCL-2 and BAX, two proteins which are heavily involved in apoptosis. Mutation of this gene accounts for more than 50% of cancers in people.","own",""],["P53 regulates BCL-2 and BAX.","own",""],["c-erb-B2, is an oncogene, responsible for overexpression of growth factor receptors making cells more sensitive to growth stimuli","own",""],["15-20% of all human tumors express mutated RAS proteins. (HRAS, KRAS, NRAS)","own",""]],"t":"N2","sub":"","ref":"2028 [PTH LEC - LE 2] 1B - Neoplasia 2","f":[]},"28a:32":{"id":"28a:32","ex":"2028 LE2","y":2028,"n":32,"p":8,"s":"A 5 cm right upper lobe lung mass was noted in a 62 year old man with 80 pack years of smoking history. He shows Cushing features. Fine needle aspirate of the mass showed small cell anaplastic carcinoma. What immunohistochemical staining would turn out to be positive?","c":[["A","Parathormone"],["B","Erythropoietin"],["C","ACTH"],["D","Cortisol"]],"k":"C","ks":["C"],"r":[["Parathyroid related peptide (PRP) PRP can be secreted as part of a paraneoplastic syndrome, leading to hypercalcemia, and is most likely associated with a squamous cell carcinoma","own",""],["Erythropoietin Erythropoietin secretion, which leads to increased production of red blood cells (polycythaemia), is noted in connection with Renal cell carcinomas","own",""],["ACTH is the correct choice because ectopic ACTH production by a tumour, such as small cell anaplastic lung carcinoma, results in features of Cushing syndrome","own",""],["Cortisol Cushing syndrome results from signs and symptoms of excessive cortisol levels. However, in the context of paraneoplastic syndrome caused by a malignancy like lung cancer, ACTH is the ectopically produced substance that stimulates the adrenal glands to release the excessive cortisol","own",""]],"t":"N2","sub":"","ref":"2027 [PTH LEC - LE 2] 3B - Neoplasia II (V1).","f":[33]},"28a:33":{"id":"28a:33","ex":"2028 LE2","y":2028,"n":33,"p":8,"s":"Testing breast tumors for both estrogen and progesterone receptors is a standard part of a breast cancer diagnosis. Which of the following applies to ER PR testing:","c":[["A","
