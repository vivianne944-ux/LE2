yloric stenosis: A condition in infants where the pylorus thickens and enlarges, blocking the passage. | Duodenal atresia: A congenital condition in which a portion of the duodenum is absent or closed off, leading to a blockage that prevents food from passing from the stomach into the intestines. | Necrotizing enterocolitis is the most common in premature infants. The | involved segment is distended, friable, and congested (with hemorrhagic infarction) or gangrenous. Submucosal gas bubbles (pneumatosis intestinalis) are present.","ref":"2027 [PTH LEC - LE 3] 01 - Diseases of Infancy and Childhood","f":[99]},"27b:32":{"id":"27b:32","ex":"2027 LE3","y":2027,"n":32,"p":11,"s":"A neonate is born at 35 weeks gestation with a birth weight and height measured at the 30th percentile. No congenital anomalies are noted. Which of the following factors is more likely to increase the risk of neonatal respiratory distress syndrome in this neonate?","c":[["A","Paternal diabetes mellitus"],["B","Delivery by cesarean section"],["C","Antenatal glucocorticoid therapy of the mother"],["D","Oligohydramnios"]],"k":"B","ks":["B"],"r":[["Maternal diabetes is the one that increases the risk of neonatal respiratory distress syndrome bcecause high insulin in infants suppresses surfactant synthesis, as insulin counteracts the effects of steroids.","own",""],["Cesarean labor SIGNIFICANTLY increases surfactant synthesis and CS done before onset of labor increases the risk of RDS.","own",""],["Antenatal glucocorticoid therapy of the mother reduces the risk of respiratory distress syndrome in neonates","own",""],["Oligohydramnios also increases the risk of neonatal respiratory distress syndrome in neonates as it can cause complications in pregnancy.","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"2027 [PTH LEC - LE 3] 01 - Diseases of Infancy and Childhood","f":[100]},"27b:33":{"id":"27b:33","ex":"2027 LE3","y":2027,"n":33,"p":11,"s":"A 12-year-old boy had fever and productive cough for the past 4 days. He was born term, but developed abdominal distention in the first week of life from meconium ileus. He had persistent steatorrhea for the past 4 years and frequent episodes of pneumonia with cough productive of thick, mucoid sputum for 3 years. Which among these tests will most likely detect an abnormality in this patient?","c":[["A","Hemoglobin A1c"],["B","Galactose-1-phosphate uridyl transferase (GALT)"],["C","Sweat chloride"],["D","Serum phenylalanine"]],"k":"C","ks":["C"],"r":[["HBA1c is the key laboratory test for monitoring long-term glucose control and diagnostic test for diabetes.","own",""],["Galactose-1-phosphate uridyl transferase is an enzyme required for conversion of galactose to glucose. It’s absence causes galactosemia, an autosomal recessive disorder.","own",""],["Thick viscid plugs of mucus may also be found in the small intestine of infants with Cystic Fibrosis. These may cause small bowel obstruction, known as meconium ileus.","own",""],["Measurement of serum phenylalanine levels is used to differentiate benign hyperphenylalaninemia from PKU.","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"Robbins & Kumar Basic Pathology 11th Edition p.91 chapter 4 Genetic and Pediatric Diseases","f":[]},"27b:34":{"id":"27b:34","ex":"2027 LE3","y":2027,"n":34,"p":11,"s":"A 4-year-old boy with mental retardation is noted to have an enlarging abdominal mass over the past 3 months. On physical examination, he has absence of the iris bilaterally and was found to be cryptorchid with hypospadia. There is a 5-cm solid mass in the right kidney on abdominal ultrasound. Which of the following disorders is the most likely diagnosis?","c":[["A","Beckwith-Wiedemann Syndrome"],["B","Klinefelter Syndrome"],["C","TURNER Syndrome"],["D","WAGR syndrome"]],"k":"D","ks":["D"],"r":[["Beckwith-Widemann Syndrome: Characterized by organomegaly, macroglossia, hemihypertrophy, omphalocele, and adrenal cytomegaly","own",""],["Klinefelter Syndrome: there is testicular dysgenesis, testicular atrophy, female characteristics are enhanced, mild mental retardation is present, and there is eunuchoid body habitus","own",""],["Turner Syndrome: Presented in female patients with decreasing female characteristics and gonadal dysgenesis.","own",""],["A pathogenesis of Wilm's tumor which is the most common primary renal tumor in children, main features include: Wilms tumor, Aniridia, Genital anomalies, and mental Retardation (WAGR)","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"[CUERVO] PTH LE2","f":[101]},"27b:35":{"id":"27b:35","ex":"2027 LE3","y":2027,"n":35,"p":11,"s":"Compared to its adult counterpart, malignant tumors in children","c":[["A","Mostly involve the skin, lung, breast, prostate and colon"],["B","Appear less primitive and more differentiated histologically"],["C","Have decreased survival or cure rates in most tumors"],["D","Have tendency to regress or differentiate spontaneously"]],"k":"D","ks":["D"],"r":[["2026 trans: Diseases of Infancy & Childhood Malignant tumors (childhood) ● Most common site of tumors in childhood cancers ○ Hematopoietic system ○ Nervous tissue ○ Soft tissue ○ Bones ○ Kidney ● Most common site of tumor in adults ○ Skin ○ Lung ○ Breast ○ Prostate ○ Colon","bor","2026 LE2 Q56"],["2026 trans: Diseases of Infancy & Childhood Malignant tumors (childhood) ● More primitive (embryonal), undifferentiated","bor","2026 LE2 Q56"],["2026 trans: Diseases of Infancy & Childhood Malignant tumors (childhood) ● Improved survival or cure of many childhood tumors","bor","2026 LE2 Q56"],["Common sites of tumor in adults: skin, lung, breast, prostate, colon Common sites of tumors in childhood: hematopoietic system, nervous tissue, soft tissue, bones, kidney Tumors in children are more primitive (embryonal) and undifferentiated, (often characterized by sheets of cells with small round nuclei, and frequently show features of organogenesis specific to the site of tumor origin.) There is improved survival or cure of many childhood tumors","own",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"Common sites of tumor in adults: skin, lung, breast, prostate, colon Common sites of tumors in childhood: hematopoietic system, nervous tissue, soft tissue, bones, kidney | Tumors in children are more primitive (embryonal) and undifferentiated, (often characterized by sheets of cells with small round nuclei, and frequently show features of organogenesis specific to the site of tumor origin.) | There is improved survival or cure of many childhood tumors","ref":"2027 Trans (PATHOLOGY | LE 3 Diseases of Infancy and Childhood) & Robbins and Cotran Pathology","f":[102]},"27b:36":{"id":"27b:36","ex":"2027 LE3","y":2027,"n":36,"p":12,"s":"The cause of cleft lip and cleft palate is:","c":[["A","Genetic"],["B","Environmental"],["C","Multifactorial"],["D","Infectious"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["More dominant cause than genetics (90-95%)","bor","2028 LE2 Q23"],["Cleft lip and cleft palate can be the result of the following: ● Genetic defects as seen in Patau’s syndrome (Trisomy 13) ● Ingestion of valproic acid during the embryonic period as seen in fetal valproate syndrome ● Excessive vitamin A consumption during the embryonic period As such, it is considered as a malformation syndrome that cannot be explained by a single direct cause due to its multifactorial origin.","own",""],["Infective endocarditis: Valve is coated with fibrin and microscopically there are dark blue blobs which represent the bacterial colonies. Staphylococcus aureus can infect either healthy or deformed valves an is the Major offender in IE among IV drug abusers while Streptococcus viridans is most common overall cause of previously damaged valves","bor","2025 LE2 Q113"]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"Cleft lip and cleft palate can be the result of the following: ● Genetic defects as seen in Patau’s syndrome (Trisomy 13) ● Ingestion of valproic acid during the embryonic period as seen in fetal valproate syndrome ● Excessive vitamin A consumption during the embryonic period As such, it is considered as a malformation syndrome that cannot be explained by a single direct cause due to its multifactorial origin.","ref":"Robbins and Cotran Pathologic Basis of Diseases & 2027 Trans on Infancy and Childhood Diseases","f":[]},"27b:37":{"id":"27b:37","ex":"2027 LE3","y":2027,"n":37,"p":12,"s":"Pregnant women are advised against use of retinoic acid since it can cause congenital malformations. The teratogenic effect of retinoic acid is most likely related to its ability to affect which of the following processes?","c":[["A","Increasing the risk of maternal infections"],["B","Increasing the likelihood of aneuploidy during cell division"],["C","Promoting abnormal development of blood vessels in the placenta"],["D","Down-regulating the transforming growth factor B (TGF-B) signaling pathway"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Retinoic acid disrupts TGF-β signaling, which is crucial for embryogenesis. This interference alters HOX gene expression, leading to craniofacial, CNS, and cardiac defects, such as cleft lip, cleft palate, and congenital heart abnormalities.","own",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"Retinoic acid disrupts TGF-β signaling, which is crucial for embryogenesis. This interference alters HOX gene expression, leading to craniofacial, CNS, and cardiac defects, such as cleft lip, cleft palate, and congenital heart abnormalities.","ref":"Robbins and Cotran Pathologic Basis of Diseases & 2027 Trans on Infancy and Childhood Diseases","f":[]},"27b:38":{"id":"27b:38","ex":"2027 LE3","y":2027,"n":38,"p":12,"s":"A 5-month-old male infant died suddenly and unexpectedly. Scene investigations reveals the infant was prone with no airway obstruction or evidence of trauma. There are no significant gross and microscopic findings at autopsy. Which of the following neurotransmitters that involves signaling within the brainstem medullary arousal centers is most likely implicated in the pathogenesis of this infant’s death?","c":[["A","Acetylcholine"],["B","Dopamine"],["C","Serotonin"],["D","Norepinephrine"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Although numerous factors have been proposed to account for a vulnerable infant, the most compelling hypothesis is that SIDS reflects a delayed development of \"arousal\" and cardiorespiratory control. The brainstem, and in particular the medulla oblongata, plays a critical role in the body's \"arousal\" response to noxious stimuli such as episodic hypercarbia, hypoxia, and thermal stress encoun-tered during sleep. The serotonergic (5-HT) system of the medulla is implicated in these \"arousal\" responses, as well as regulation of other critical homeostatic functions such as respiratory drive, blood pressure, and upper airway reflexes. Abnormalities in serotonin-dependent signaling in the brainstem may be the underlying basis for SIDS in some infants.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"Although numerous factors have been proposed to account for a vulnerable infant, the most compelling hypothesis is that SIDS reflects a delayed development of \"arousal\" and cardiorespiratory control. The brainstem, and in particular the medulla oblongata, plays a critical role in the body's \"arousal\" response to noxious stimuli such as episodic hypercarbia, hypoxia, and thermal stress encoun-tered during sleep. The serotonergic (5-HT) system of the medulla is implicated in these \"arousal\" responses, as well as regulation of other critical homeostatic functions such as respiratory drive, blood pressure, and upper airway reflexes. Abnormalities in serotonin-dependent signaling in the brainstem may be the underlying basis for SIDS in some infants.","ref":"Robbins and Cotran Pathologic Basis of Diseases & 2027 Trans on Infancy and Childhood Diseases","f":[]},"27b:39":{"id":"27b:39","ex":"2027 LE3","y":2027,"n":39,"p":12,"s":"A 5-year-old child has a palpable left abdominal mass. Urinalysis shows hematuria. A mass is excised and on microscopic examination shows a triphasic combination of blastemal, stromal and epithelial cell types. Which of the following is most likely the diagnosis?","c":[["A","Renal Cell Carcinoma"],["B","Wilms Tumor"],["C","Rhabdomyosarcoma"],["D","Neuroblastoma"]],"k":"B","ks":["B"],"r":[["Renal cell carcinoma have a rounded or polygonal shape and abundant clear or granular cytoplasm, which contains glycogen and lipids. It is well-differentiated but some show nuclear atypia with bizarre nuclei and giant cells.","own",""],["Wilms tumor is a common primary renal tumor in children that is 2 - 5 years old. Microscopic view of Wilms tumor is composed of blastemal, epithelial, and stromal components.","own",""],["Rhabdomyosarcomas usually have marked cellular and nuclear polymorphism, hyperchromatic nuclei, and tumor giant cells.","own",""],["Neuroblastoma is the most common extracranial solid tumor of childhood (median age of diagnosis is 18 months). Microscopic view of neuroblastoma shows small, primitive-appearing cells with dark nuclei, scanty cytoplasm, poorly defined cell borders growing in solid sheets, neuropil, and rosettes","own",""]],"t":"UNC","sub":"Infancy and childhood","bm":1,"orig":"Renal cell carcinoma have a rounded or polygonal shape and abundant clear or granular cytoplasm, which contains glycogen and lipids. It is well-differentiated but some show nuclear atypia with bizarre nuclei and giant cells. | Wilms tumor is a common primary renal tumor in children that is 2 - 5 years old. Microscopic view of Wilms tumor is composed of blastemal, | epithelial, and stromal components. | Rhabdomyosarcomas usually have marked cellular and nuclear polymorphism, hyperchromatic nuclei, and tumor giant cells. | Neuroblastoma is the most common extracranial solid tumor of childhood (median age of diagnosis is 18 months). Microscopic view of neuroblastoma shows small, primitive-appearing cells with dark nuclei, scanty cytoplasm, poorly defined cell borders growing in solid sheets, neuropil, and rosettes","ref":"[PTH LE 1] 01: Disease of Infancy and Childhood & Robbins and Cotran Pathologic Basis of Diseases","f":[]},"27b:40":{"id":"27b:40","ex":"2027 LE3","y":2027,"n":40,"p":13,"s":"Which error of morphogenesis involves a cascade of anomalies triggered by one initiating aberration?","c":[["A","Sequence"],["B","Deformation"],["C","Malformation"],["D","Disruption"]],"k":"A","ks":["A"],"r":[["Sequence: there is a cascade of anomalies triggered by one initiating aberration.","own",""],["Deformation: Extrinsic disturbance of development Cause: localized or generalized compression of the growing fetus by abN biochemical forces, leading to structural abnormalities","own",""],["Malformation: Intrinsically abnormal developmental process Cause: single gene or chromosome defect (genetic in nature), but commonly multifactorial","own",""],["Disruption results from secondary destruction of an organ or body region that was previously normal in development","own",""]],"t":"UNC","sub":"Infancy and childhood","ref":"2027 Trans (PATHOLOGY | LE 3 Diseases of Infancy and Childhood)","f":[]},"27b:41":{"id":"27b:41","ex":"2027 LE3","y":2027,"n":41,"p":13,"s":"Which of the following is/are true regarding the development of atherosclerosis? I. Vasospasm is the cornerstone of the response-to-injury II. The key processes in atherosclerosis are intimal thickening and lipid accumulation III. Atherosclerotic plaques have three principal components: cells, extracellular matrix, and extracellular lipid IV. Fatty streaks are the earliest lesion in atherosclerosis","c":[["A","II and IV only"],["B","II, III, and IV only"],["C","IV only"],["D","All of the above"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Endothelial cell injury is the cornerstone of the response to injury hypothesis of atherosClerosis Atherosclerosis ● Arteries are hardened due to deposits of basic lesions of intimal atheroma or fibro-fatty plaques. Monckeberg medial calcific sclerosis ● Arteries are hardened due to platelet-like calcification involving the medial layer of the arteries. Fibromuscular-intimal hyperplasia ● Caused by iatrogenic mechanism, the arteries hardened due to fibrosis and hyperplasia of the intima and media as a response to inflammation and mechanical injury of the blood vessels. Arteriolosclerosis ● Hyaline arteriolosclerosis ○ Involves small end arterioles that become thickened and hardened either by deposits of hyaline substance on its walls. ● Hyperplastic arteriolosclerosis ○ Thickening and hardening of the arterioles due to cellular proliferation of the intima and media.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Characteristic clinical feature of restrictive CMP - due to a restrictive ventricular filling and pressure overload","bor","2027 LE3 Q79"]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Endothelial cell injury is the cornerstone of the response to injury hypothesis of atherosClerosis | Atherosclerosis ● Arteries are hardened due to deposits of basic lesions of intimal atheroma or fibro-fatty plaques. Monckeberg medial calcific sclerosis ● Arteries are hardened due to platelet-like calcification involving the medial layer of the arteries. Fibromuscular-intimal hyperplasia ● Caused by iatrogenic mechanism, the arteries hardened due to fibrosis and hyperplasia of the intima and media as a response to inflammation and mechanical injury of the blood vessels. Arteriolosclerosis ● Hyaline arteriolosclerosis ○ Involves small end arterioles that become thickened and hardened either by deposits of hyaline substance on its walls. ● Hyperplastic arteriolosclerosis ○ Thickening and hardening of the arterioles due to cellular proliferation of the intima and media.","ref":"2027 Trans (Pathology of Blood Vessels I: Arteriosclerosis, HPN, Aneurysms)","f":[122]},"27b:42":{"id":"27b:42","ex":"2027 LE3","y":2027,"n":42,"p":13,"s":"A 44-year-old man with a family history of hypertension presents for a check-up. He denies past medical problems or intake of medicines, but has been told that his BP was a little high. He reports that over the previous 5 years he has gained 6.8 kg. Review of systems is otherwise non-contributory. P.E. is notable for obesity and BP 172/86 mmHg. The remainder of the examination is unremarkable. Patient was diagnosed with Essential hypertension. What would be the expected morphologic finding in the patient’s arterioles?","c":[["A","Concentric, lamellated thickening of the walls and luminal narrowing"],["B","Arterioles with homogenous, pink hyaline thickening with associated luminal narrowing"],["C","Calcific deposits which may undergo metaplastic change into bone"],["D","Fibrinoid Deposits and vessel wall necrosis"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Two morphological patterns are seen in hypertensive vascular diseases: Hyaline arteriolosclerosis ● Commonly seen among elderly and diabetic patients ● Arterioles are hardened because of deposits in the medial layer of the arterioles by pink homogenous hyaline material Hyperplastic arteriolosclerosis ● Arterioles are hardened because of concentric intimal medial proliferation and hyperplasia reminiscent of the onion skin thus called “onion-skin lesion” of the artery ● Associated with a malignant form of HTN, with a sudden acute and severe elevation of blood pressure usually with the diastolic form of hypertension In this case, the systolic BP is high and the patient is at risk of diabetes due to his obesity, which may imply hyaline arteriosclerosis.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Two morphological patterns are seen in hypertensive vascular diseases: Hyaline arteriolosclerosis ● Commonly seen among elderly and diabetic patients | ● Arterioles are hardened because of deposits in the medial layer of the arterioles by pink homogenous hyaline material Hyperplastic arteriolosclerosis ● Arterioles are hardened because of concentric intimal medial proliferation and hyperplasia reminiscent of the onion skin thus called “onion-skin lesion” of the artery ● Associated with a malignant form of HTN, with a sudden acute and severe elevation of blood pressure usually with the diastolic form of hypertension In this case, the systolic BP is high and the patient is at risk of diabetes due to his obesity, which may imply hyaline arteriosclerosis.","ref":"2027 Trans (Pathology of Blood Vessels I: Arteriosclerosis, HPN, Aneurysms)","f":[]},"27b:43":{"id":"27b:43","ex":"2027 LE3","y":2027,"n":43,"p":14,"s":"A 70-year-old woman complains of a throbbing unilateral headache and vision problems. She reports weight loss and mandibular pain while eating. The patient also has a history of recurrent bouts of fever accompanied by malaise and muscle aches. P.E. reveals nodular enlargement of the temporal artery with pain on palpation. A biopsy is obtained. What is the expected pathologic finding seen in the temporal artery of this patient?","c":[["A","Transmural neutrophilic inflammation with fibrinoid necrosis"],["B","Granulomatous inflammation of the media with giant cells and fragmentation of the elastic media"],["C","Thrombosis and acute inflammation with giant cells"],["D","Aneurysm and obliterative endarteritis"]],"k":"B","ks":["B"],"r":[["Feature of Polyarteritis nodosa","own",""],["Feature of Giant Cell Arteritis: lesion located in the branch of Carotid artery- Temporal artery which is mentioned in the case.","own",""],["Does not describe GCA, though thrombosis may occasionally occur.","own",""],["Seen in Tertiary Syphilis as a hallmark.","own",""]],"t":"UNC","sub":"Blood vessels","f":[115]},"27b:44":{"id":"27b:44","ex":"2027 LE3","y":2027,"n":44,"p":14,"s":"Kaposi’s sarcoma, when associated with AIDS, presents with this salient feature:","c":[["A","Indolent clinical course"],["B","Presence of generalized edema"],["C","Majority are Ashkenazi Jews"],["D","Atypical vascular proliferation with pericyte"]],"k":"B","ks":["B"],"r":[["Indolent clinical course: Feature of non-HIV-associated Chronic/European Kaposi’s Sarcoma","own",""],["Presence of generalized edema: Feature of Lymphadenopathic Kaposi’s Sarcoma","own",""],["Majority are Ashkenzi Jews: Feature of non-HIV-associated Chronic/European Kaposi’s Sarcoma","own",""],["Atypical vascular proliferation with pericyte: KSHV: Spindle-shaped endothelial cells and atypical vascular proliferation that often include irregular, slit-like spaces containing red blood cells, and are sometimes surrounded by pericytes.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2027 [PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[]},"27b:45":{"id":"27b:45","ex":"2027 LE3","y":2027,"n":45,"p":14,"s":"A biopsy of a medium-sized muscular artery revealed plate-like calcification in the medial layer. The statement that would be compatible with the clinical history of this condition is:","c":[["A","Severe, accelerated hypertension"],["B","Rapidly progressive renal failure"],["C","Commonly seen in aging population"],["D","Gangrene of digits"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Monckeberg’s Medial Calcific Sclerosis ● Arteries are hardened because of plate-like calcifications involving the tunica media/medial layer ● Degenerative and non-inflammatory calcification of the media of large and medium-sized muscular arteries ● Occurs principally in: → Older persons (>50 years of age) or aging population → Diabetics and those with chronic renal disease","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Monckeberg’s Medial Calcific Sclerosis ● Arteries are hardened because of plate-like calcifications involving the tunica media/medial layer ● Degenerative and non-inflammatory calcification of the media of large and medium-sized muscular arteries ● Occurs principally in: → Older persons (>50 years of age) or aging population → Diabetics and those with chronic renal disease","ref":"2027 [PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[]},"27b:46":{"id":"27b:46","ex":"2027 LE3","y":2027,"n":46,"p":15,"s":"This disease is implicated in Atherosclerosis:","c":[["A","Marfan syndrome"],["B","Buerger disease"],["C","Mycotic aneurysm"],["D","Cerebrovascular accident"]],"k":"D","ks":["D"],"r":[["Marfan Syndrome: Associated with Aortic Dissection","own",""],["Buerger Disease: The major factors are associated with smoking and tobacco consumption or exposure","own",""],["Mycotic aneurysm=m:Caused by weakening and dilatation of the vessel wall due to infection by microbial agent","own",""],["DISEASES ASSOCIATED WITH ATHEROSCLEROSIS The following diseases account for more than half of the annual mortality in the United states and Western countries. → Ischemic heart disease → Cerebrovascular accident (CVA) or Stroke → Myocardial infarction → Infarction (or gangrene) of extremities → Infarction of GIT → Abdominal aortic aneurysm","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2027 [PTH LEC - LE 3] 03 - Pathology of Blood Vessels I","f":[]},"27b:47":{"id":"27b:47","ex":"2027 LE3","y":2027,"n":47,"p":15,"s":"A 31 y/o male presents with recurrent severe headaches and increasing visual problems. Physical examination reveals his blood pressure to be 220/120 mmHg. Biopsy of arteries showed onion-skin pattern. His symptoms are most likely associated with:","c":[["A","Thromboangiitis obliterans"],["B","Hyperplastic arteriolosclerosis"],["C","Monkeberg’s medial calcific sclerosis"],["D","Hyaline arteriolosclerosis"]],"k":"B","ks":["B"],"r":[["Thromboangiitis Obliterans:Affected vessels show acute & chronic inflammation accompanied by luminal thrombosis. The late stage of the disease shows intima fibrosis thrombus formation, with evidence of organization and peri-arteritis","own",""],["Hyperplastic Arteriosclerosis: Arterioles are hardened because of concentric intimal-medial proliferation and hyperplasia of the intimal and smooth muscle cells of an arteriole, reminiscent of the onion skin, hence called onion-skinning of the artery. Associated with accelerated HPN.","own",""],["Monkeberg’s Medial Calcific Sclerosis: Arteries are hardened due to platelet-like calcification involving the medial layer of the arteries.","own",""],["Hyaline Arteriosclerosis: Arterioles are hardened because of deposits in the medial layer of the arterioles by dense, pink, homogenous hyaline material, and accumulation of plasma proteins","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2027 [PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[113]},"27b:48":{"id":"27b:48","ex":"2027 LE3","y":2027,"n":48,"p":15,"s":"In a patient with vasculitis, the finding serum antineutrophil cytoplasmic autoantibodies (ANCAs) that react by immunofluorescence staining in a cytoplasmic pattern (c-ANCAs) is most suggestive of:","c":[["A","Giant cell arteritis"],["B","Classic polyarteritis nodosa"],["C","Wegener’s granulomatosis"],["D","Churg-Strauss syndrome"]],"k":"C","ks":["C"],"r":[["Giant cell arteritis: A type of large vessel vasculitis and NOT positive for ANCA","own",""],["Classic polyarteritis nodosa: A type of medium vessel vasculitis and NOT positive for ANCA","own",""],["Wegener’s granulomatosis: A type of small vessel vasculitis and IS POSITIVE for ANCA in the cytoplasmic pattern (c-ANCA positive)","own",""],["Churg-Strauss syndrome: A type of small vessel vasculitis and IS POSITIVE for ANCA BUT NEGATIVE for the cytoplasmic pattern. Churg-Strauss is a p-ANCA type of small vessel vasculitis","own",""]],"t":"UNC","sub":"Blood vessels","ref":"2027 [PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[117]},"27b:49":{"id":"27b:49","ex":"2027 LE3","y":2027,"n":49,"p":15,"s":"A 30-year-old male smoker presents with gangrene of his extremities. Which of the following histologic findings from a biopsy of the blood vessels supplying this area would be most suggestive of the diagnosis of Buerger’s disease?","c":[["A","Granulomatous inflammation with giant cell"],["B","Intimo-medial proliferation and hyperplasia"],["C","Fibrinoid necrosis with overlying thrombosis"],["D","Thrombosis with microabscess"]],"k":"D","ks":["D"],"r":[["Giant Cell Arteritis ● Inflammatory cells are mononuclear with granulomatous patterns containing multinucleated giant cells (MNGC)","own",""],["Giant Cell Arteritis ● Inflammatory infiltration of the intimal and medial layers with marked narrowing of the vascular lumen","own",""],["Panarteritis nodosa ● Intimal fibrinoid necrosis","own",""],["Buerger’s disease ● Segmental, thrombosing, acute and chronic inflammation of small and medium arteries (tibial and radial arteries), occasionally veins and nerves → Thrombotic occlusion → Gangrene ● Microabscess: Made of neutrophils surrounded by granulomatous inflammation - may recanalize","own",""]],"t":"UNC","sub":"Blood vessels","ref":"[PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[112]},"27b:50":{"id":"27b:50","ex":"2027 LE3","y":2027,"n":50,"p":16,"s":"During a routine P.E., a 65-year-old male is found to have a 7cm pulsatile mass in his abdomen. Angiography reveals a marked dilation of his aorta distal to his renal arteries. This aneurysm is most likely the result of:","c":[["A","Bacterial colonization"],["B","Atherosclerosis"],["C","Cystic medial necrosis"],["D","Hypertension"]],"k":"B","ks":["B"],"r":[["Bacterial colonization: Cause of mycotic aneurysm which is most common in cerebral arteries","own",""],["Atherosclerosis: This is a case of abdominal aortic aneurysm primarily caused by atherosclerosis. This is common in males, smokers and elderly. It is grossly described as a spherical or fusiform dilatation involving the abdominal aorta and its branches (renal and superior/inferior mesenteric arteries) by direct extension or occlusion of the vessel ostie with mural thrombus","own",""],["Cystic medial necrosis:Known cause of aortic dissection or dissection aneurysm which causes tearing of the aortic intima","own",""],["Hypertension: Known cause of aortic dissection or dissection aneurysm which causes tearing of the aortic intima","own",""]],"t":"UNC","sub":"Blood vessels","ref":"[PTH LEC - LE 3] 02 - Pathology of Blood Vessels I","f":[119]},"27b:51":{"id":"27b:51","ex":"2027 LE3","y":2027,"n":51,"p":16,"s":"Fatty streak is…","c":[["A","Dangerous precedent to atherosclerosis"],["B","Prone to vascular ischemia"],["C","Associated with advanced atherosclerosis"],["D","None of the above"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["A. Presents no clinical significance B. Does NOT cause any disturbance in blood flow C. Precursor lesion of atherosclerosis","own",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"A. Presents no clinical significance | B. Does NOT cause any disturbance in blood flow | C. Precursor lesion of atherosclerosis","ref":"[PTH LEC - LE 3] 02 - Pathology of Blood Vessels I","f":[]},"27b:52":{"id":"27b:52","ex":"2027 LE3","y":2027,"n":52,"p":17,"s":"The following are true regarding hypertension","c":[["A","80-90% are unexplained"],["B","Chronic kidney disease as the common reason"],["C","Associated with right ventricular hypertrophy"],["D","Presence of medial deposits of hyaline material is diagnostic of malignant hypertension"]],"k":"A","ks":["A"],"r":[["95% of cases are unexplained","own",""],["Chronic kidney disease is associated with secondary hypertension which comprises only 5-10% of cases","own",""],["Malignant hypertension is associated with left ventricular hypertrophy","own",""],["HTN increases the normal flow of proteins into the vessel wall and the amount of high molecular weight proteins (e.g. fibrinogen) that passes through the junctions between the endothelial cells, resulting in protein deposition in the medial layer of the arterioles. These deposits are called hyaline in benign hypertension, and fibrinoid in malignant hypertension..","own",""]],"t":"UNC","sub":"Blood vessels","ref":"[PTH LEC - LE 3] 02 - Pathology of Blood Vessels I","f":[]},"27b:53":{"id":"27b:53","ex":"2027 LE3","y":2027,"n":53,"p":17,"s":"Glomus tumors are most commonly found in:","c":[["A","Head and neck"],["B","Lymph node and skin"],["C","Fingers and toes"],["D","Liver and spleen"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Glomus tumor (glomangioma) is a benign but painful tumor of the subungual (under the fingernail or nail bed).","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"Glomus tumor (glomangioma) is a benign but painful tumor of the subungual (under the fingernail or nail bed).","f":[123]},"27b:54":{"id":"27b:54","ex":"2027 LE3","y":2027,"n":54,"p":17,"s":"34 years old dies as a consequence of a stroke. At the autopsy, it was found she has a large basal ganglia hemorrhage. Her heart weighs 550 grams with concentric left ventricular hypertrophy. Her arteries demonstrates intimo- medial thickening and onion skinning.","c":[["A","Hyperplastic arteriosclerosis"],["B","Hyaline arteriosclerosis"],["C","Monckeberg arteriosclerosis"],["D","Atherosclerosis"]],"k":"A","ks":["A"],"r":[["Hyperplastic arteriosclerosis: The key finding of onion skinning in the arteries is a hallmark of hyperplastic arteriosclerosis, and this process is most commonly associated with malignant hypertension or very severe, chronic hypertension.","own",""],["Hyaline arteriosclerosis: can also be associated with hypertension, it typically does not exhibit onion skinning. The vascular changes seen here (onion skinning) are more specific to hyperplastic arteriosclerosis, not hyaline arteriosclerosis.","own",""],["Monckeberg arteriosclerosis primarily affects the media and does not typically cause the intimal changes (e.g., onion skinning) or result in the clinical manifestations seen here.","own",""],["Atherosclerosis can lead to cerebrovascular events, it typically involves larger arteries, such as the carotid or vertebral arteries, and is more common in older individuals or those with risk factors like hyperlipidemia. The vascular findings here, particularly the onion skinning, are more characteristic of hyperplastic arteriosclerosis due to severe hypertension, not the plaque buildup seen in atherosclerosis.","own",""]],"t":"UNC","sub":"Blood vessels","f":[113]},"27b:55":{"id":"27b:55","ex":"2027 LE3","y":2027,"n":55,"p":17,"s":"Involvement of the aortic arch by an inflammatory lesion composed of adventitial mononuclear infiltrate, giant cells and granuloma is characteristic of:","c":[["A","Giant cell arteritis"],["B","Syphilitic aortitis"],["C","Takayasu arteritis"],["D","Rheumatoid aortitis"]],"k":"B","ks":["B"],"r":[["Giant cell arteritis: Chronic, systemic inflammatory vasculitis involving large to small-sized arteries. Marked intimal thickening and edema, and a dense, sometimes granulomatous.","own",""],["Syphilitic aortitis: Characteristic gross finding is the “TREE BARKING” of the aorta due to the intimal wrinkling and fibrosis. Arch of aorta involvement.","own",""],["Takayasu arteritis: Rare granulomatous vasculitis that involves medium and larger arteries like the aorta.","own",""],["- Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Blood vessels","ref":"[PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[121]},"27b:56":{"id":"27b:56","ex":"2027 LE3","y":2027,"n":56,"p":18,"s":"A 19-year-old young woman who emigrated from Taiwan eight years ago presents with fever, malaise, myalgia, arthritis, and “coldness” of her upper extremities. She has a weak radial pulse bilaterally and a magnetic resonance angiogram demonstrating nearly 75% stenosis of the main arteries originating from the aorta. Which of the following conditions does she most likely have?","c":[["A","Buerger’s disease"],["B","Kawasaki disease"],["C","Raynaud’s disease"],["D","Takayasu arteritis"]],"k":"D","ks":["D"],"r":[["Buerger’s disease: This condition is most prevalent among middle-aged males, particularly those under 35 years of age. A significant risk factor for its development is smoking and tobacco consumption.","own",""],["Kawasaki disease is an acute febrile illness primarily affecting young children and infants. It is characterized by systemic vasculitis involving large and medium-sized arteries, often with mucocutaneous lymph node syndrome.","own",""],["Raynaud's disease is characterized by episodic, severe vasospasm—transient and marked constriction of small arteries—triggered by cold or emotional stress.","own",""],["Takayasau arteritis: This condition is characterized by weakened pulses and primarily affects young to middle-aged women, typically under 40 years of age. It commonly involves the aorta, the aortic arch, and its major branch vessels. In the later stages, the disease leads to the development of stenosis, luminal occlusion, transmural fibrosis and aneurysmal dilatation.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"[PTH LEC - LE 3] 03 - Pathology of Blood Vessels II","f":[116]},"27b:57":{"id":"27b:57","ex":"2027 LE3","y":2027,"n":57,"p":18,"s":"A 3 y/o boy is brought by his parents to the ER because of high fever for several days. On PE, the boy has conjunctival and oral erythema. He has palpable cervical lymphadenopathy and erythema of his palms and soles. What is a potential life-threatening complication of this disorder?","c":[["A","Aneurysm of the abdominal aorta"],["B","Dissection of the thoracic aorta"],["C","Aneurysm of the coronary arteries"],["D","Rupture of a berry aneurysm"]],"k":"C","ks":["C"],"r":[["Aneurysm of the abdominal aorta is a complication of atherosclerosis, usually seen in men, smokers, and the elderly. When ruptured, it can cause hemorrhage along the peritoneal cavity and through retroperitoneal tissues, leading to a fatal hemorrhage.","own",""],["Dissection of the thoracic aorta is caused by the filling of blood channels within the aortic medial wall that, when ruptured, causes hemorrhage.","own",""],["The boy’s symptoms are indicative of an infection. Thus, a possible complication would be the aneurysm of the coronary arteries secondary to either a septic embolus, the infection itself, or infective endocarditis.","own",""],["Berry aneurysm rupture is a complication of the bifurcation of blood vessels at the Circle of WIllis, potentially causing a fatal cranial hemorrhage.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"[PTH LEC - LE 3] 02 - Pathology of Blood Vessels I","f":[114]},"27b:58":{"id":"27b:58","ex":"2027 LE3","y":2027,"n":58,"p":18,"s":"What is the most common cause of tumors in the blood vessels?","c":[["A","Hemangiopericytoma"],["B","Lymphangioma"],["C","Capillary hemangioma"],["D","Glomangioma"]],"k":"C","ks":["C"],"r":[["Hemangiopericytoma is a type of soft-tissue sarcoma that originates in the pericytes on the walls of the capillaries.","own",""],["Lymphangioma is a benign tumor of the lymphatics.","own",""],["Hemangioma are benign tumors of the small capillaries. It is the most common vascular tumor in the human body. Capillary hemangioma is a type of hemangioma that occurs in the skin, subcutaneous tissues, and mucous membranes of the oral cavities and lips, liver, spleen, and kidneys.","own",""],["Glomangioma are benign but sometimes extremely painful blood vessel neoplasm, which is commonly located in the finger or beneath the nail bed.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"Trans of Batch 2027. LE3: Pathology of Blood Vessels II","f":[124]},"27b:59":{"id":"27b:59","ex":"2027 LE3","y":2027,"n":59,"p":19,"s":"63 y/old male hypertensive, experiencing “tearing” chest pain, radiating from upper to mid back since the first hour. What are the morphology of the aorta?","c":[["A","Focal mononuclear infiltrate and initimal tree barking"],["B","Cystic medial necrosis with dissection"],["C","Subintimal lipid deposition and smooth muscle necrosis"],["D","Immune complex-mediated vasculitis"]],"k":"B","ks":["B"],"r":[["It is primarily seen in syphilitic aneurysms where the “tree barking” feature is caused by fibrosis of the intima and media of the aorta.","own",""],["Aortic dissection is an acute illness where the intimal tear extends anterograde or retrograde along the aorta as far as the common iliac arteries. The main symptoms are acute onset of chest pain ranging from the anterior chest towards the back.","own",""],["A feature of atherosclerosis, where build up of lipids and subsequent SMC necrosis will lead to an occluded/semi-occluded blood vessel","own",""],["Rare disease where the immune system attacks certain parts of the body.","own",""]],"t":"UNC","sub":"Blood vessels","ref":"Trans of Batch 2027. LE3: Pathology of Blood Vessels II","f":[120]},"27b:60":{"id":"27b:60","ex":"2027 LE3","y":2027,"n":60,"p":19,"s":"A patient presented with fever. He was diagnosed with polyarteritis. What can be an associated disease?","c":[["A","Arsenic"],["B","Hepatitis B virus"],["C","Human herpesvirus 8"],["D","Human Immunodeficiency virus"]],"k":"B","ks":["B"],"r":[["A carcinogen in pesticides associated with angiosarcoma","bor","2028 LE2 Q90"],["A ⅓ of patients with polyarteritis have chronic Hepatitis B. It leads to the formation of HBsAg-HBsAb deposited in the affected vessels","own",""],["Associated with Kaposi Sarcoma","bor","2028 LE2 Q90"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Blood vessels","bm":1,"orig":"A ⅓ of patients with polyarteritis have chronic Hepatitis B. It leads to the formation of HBsAg-HBsAb deposited in the affected vessels","ref":"Trans of Batch 2027. LE3: Pathology of Blood Vessels II","f":[118]},"27b:61":{"id":"27b:61","ex":"2027 LE3","y":2027,"n":61,"p":19,"s":"A 5-year-old boy was brought to the hospital because of sudden onset of fever of 2 days, accompanied by pain initially in both knees later involving the ankles, and occasional involuntary movements of the upper and lower extremities. Two weeks ago, he had a sore throat lasting for 4 days. What is the MOST probable diagnosis?","c":[["A","Rheumatic fever"],["B","Post viral myocarditis"],["C","Friedler’s myocarditis"],["D","SLE Carditis"]],"k":"A","ks":["A"],"r":[["Rheumatic fever: Classic presentation: fever, migratory polyarthritis (knees →ankles), Sydenham chorea (involuntary movements), and recent sore throat. Fits Jones Criteria.","own",""],["Post viral myocarditis: Usually presents with signs of heart failure, not arthritis or chorea. No mention of viral prodrome or cardiomyopathy here.","own",""],["Friedler’s myocarditis: A rare idiopathic myocarditis, not associated with arthritis or chorea. Doesnâ€™t match the clinical picture.","own",""],["SLE Carditis: Systemic Lupus Erythematosus is rare in this age and doesn’t typically present with chorea or post-streptococcal features.","own",""]],"t":"UNC","sub":"Heart","ref":"Trans of Batch 2027. LE3: Pathology of Blood Vessels II","f":[]},"27b:62":{"id":"27b:62","ex":"2027 LE3","y":2027,"n":62,"p":19,"s":"A 3-year-old male complains of easy fatigability. The boy was born cyanotic. He is small and short for his age. Echocardiography reveals a large VSD with overriding aorta, pulmonary stenosis, and right ventricular hypertrophy. What is the most likely diagnosis?","c":[["A","Coarctation of the aorta"],["B","Patent ductus arteriosus"],["C","Tetralogy of Fallot"],["D","Ventricular septal defect"]],"k":"C","ks":["C"],"r":[["Coarctation of the aorta: This involves narrowing of the aorta and presents with hypertension in the upper limbs, with a much lower pressure in the vessels distals to the coarctation.","own",""],["Patent ductus arteriosus: It is a condition in which the ductus arteriosus fails to close after 72 hours. This allows the persistence of functional communication between the pulmonary artery and the aorta, producing a characteristic “machinery-like” murmur.","own",""],["Tetralogy of Fallot is a cyanotic congenital heart disease that includes four cardinal features: pulmonary stenosis, VSD, an overriding aorta, and right ventricular hypertrophy, all of which are present in this case.","own",""],["Ventricular septal defect: This abnormality involves defects in the ventricular septum, which allow left-to-right shunting. This leads to the mixing of oxygenated and deoxygenated blood, so patients with VSD typically have no cyanosis.","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Coarctation of the aorta: This involves narrowing of the aorta and presents with hypertension in the upper limbs, with a much lower pressure in the vessels distals to the coarctation. | Patent ductus arteriosus: It is a condition in which the ductus arteriosus | fails to close after 72 hours. This allows the persistence of functional communication between the pulmonary artery and the aorta, producing a characteristic “machinery-like” murmur. | Tetralogy of Fallot is a cyanotic congenital heart disease that includes four cardinal features: pulmonary stenosis, VSD, an overriding aorta, and right ventricular hypertrophy, all of which are present in this case. | Ventricular septal defect: This abnormality involves defects in the ventricular septum, which allow left-to-right shunting. This leads to the mixing of oxygenated and deoxygenated blood, so patients with VSD typically have no cyanosis.","ref":"[PTH LEC - LE 3] 06 - Pathology of the Heart III-V","f":[135]},"27b:63":{"id":"27b:63","ex":"2027 LE3","y":2027,"n":63,"p":20,"s":"A 50-year-old man presents to his physician with diarrhea, flushing, and wheezing. P.E. is significant for a grade II/VI diastolic murmur located at the right sternal border at the fourth intercostal space. Which of the following substance is most likely to be elevated in this patient's urine?","c":[["A","5-hydroxyindoleacetic acid (5-HIAA)"],["B","Homovanillic acid (HVA)"],["C","Phenylalanine"],["D","Vanillylmandelic acid (VMA)"]],"k":"A","ks":["A"],"r":[["The carcinoid syndrome results from bioactive compounds such as serotonin released by carcinoid tumors, manifestations include flushing, diarrhea, dermatitis, and bronchoconstriction. Plasma levels of serotonin and urinary excretion of the serotonin metabolite 5-hydroxyindoleacetic acid correlate with the severity of right-sided heart lesions. (+) 5-HIAA in urine = Carcinoid Tumor","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"The carcinoid syndrome results from bioactive compounds such as serotonin released by carcinoid tumors, manifestations include flushing, diarrhea, dermatitis, and bronchoconstriction. Plasma levels of serotonin and urinary excretion of the serotonin metabolite 5-hydroxyindoleacetic acid correlate with the severity of right-sided heart lesions. (+) 5-HIAA in urine = Carcinoid Tumor","ref":"Robbins Basic Pathology 11th Edition: Chapter 9 p.342","f":[]},"27b:64":{"id":"27b:64","ex":"2027 LE3","y":2027,"n":64,"p":20,"s":"A 60-year old male had chest pain and was hospitalized. On the first day of admission, the coronary angiogram revealed 90% stenosis of the left anterior descending coronary artery. Four days later, his condition worsens and he expires. Which of the following microscopic findings is most likely to be present in his left ventricular myocardium?","c":[["A","Extensive transmural collagen deposition"],["B","Lymphocytic interstitial infiltrate"],["C","Myocardial necrosis with neutrophils and macrophages"],["D","Edema with loss of striations"]],"k":"C","ks":["C"],"r":[["2-8 weeks: Increased collagen deposition, with decreased cellularity","own",""],["1-3 days: Coagulative necrosis, with loss of nuclei and striations, Brisk interstitial infiltrate of neutrophils","own",""],["3-7 days: Beginning disintegration of dead myofibers with dying neutrophils, Early phagocytosis of dead cells by macrophages at infarct border","own",""],["4-12 hours: Beginning coagulation necrosis, Edema and hemorrhage","own",""]],"t":"UNC","sub":"Heart","ref":"[PTH LEC - LE 3] 05 - Pathology of the Heart II","f":[128]},"27b:65":{"id":"27b:65","ex":"2027 LE3","y":2027,"n":65,"p":20,"s":"A 75-year-old male with a history of 5 years stable angina pectoris, is brought to the ER with severe chest pain. EKG reveals ST segment elevation with elevated Troponin-I and CPK-MB levels. He was stabilized and managed with diagnosis of AMI and subsequently admitted to the CCU. About 4 days later, the patient again complained of severe chest pain. P.E. showed pericardial friction rub and pulmonary rales. Which of the following complications is most likely present in this case?","c":[["A","Myocardial aneurysm"],["B","Arrhythmia"],["C","Fibrinous pericarditis"],["D","Myocardial rupture and cardiac tamponade"]],"k":"C","ks":["C"],"r":[["Myocardial aneurysm: Late complication resulting from large transmural and anteroseptal infarct which heals by formation of a thin wall of scar tissue. Can develop months to years post-infarct.","own",""],["Arrhythmia: Commonly in infarcts of the interventricular septum. Leads to myocardial irritability and conduction disturbances that cause sudden cardiac death. Risk for serious arrhythmias greatest in 1st hour post-infarct.","own",""],["Fibrinous pericarditis: Presents with a pericardial friction rub and possible persistent anterior chest pain. Typically develops 2-3 days post-infarct and gradually resolves over the next few days.","own",""],["Myocardial rupture and cardiac tamponade: Left ventricular free wall rupture (most common) occurs within 3-7 days post-infarct and results in rapidly fatal hemopericardium and cardiac tamponade.","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Myocardial aneurysm: Late complication resulting from large transmural and anteroseptal infarct which heals by formation of a thin wall of scar tissue. Can develop months to years post-infarct. | Arrhythmia: Commonly in infarcts of the interventricular septum. Leads to myocardial irritability and conduction disturbances that cause sudden cardiac death. Risk for serious arrhythmias greatest in 1st hour post-infarct. | Fibrinous pericarditis: Presents with a pericardial friction rub and possible persistent anterior chest pain. Typically develops 2-3 days post-infarct and gradually resolves over the next few days. | Myocardial rupture and cardiac tamponade: Left ventricular free wall rupture (most common) occurs within 3-7 days post-infarct and results in | rapidly fatal hemopericardium and cardiac tamponade.","ref":"[PTH LEC - LE 3] 05 - Pathology of the Heart II","f":[131]},"27b:66":{"id":"27b:66","ex":"2027 LE3","y":2027,"n":66,"p":21,"s":"A 35 yr old woman was diagnosed to have left atrial myxoma. She dies suddenly and unexpectedly. What is the cause of death?","c":[["A","Cerebral myxomatous embolization"],["B","Tumor prolapsed with mitral valve obstruction"],["C","Fatal arrhythmia"],["D","Acute congestive heart failure"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Atrial myxomas can obstruct the mitral valve during diastole, acting like a ball-valve, leading to sudden cardiac death due to obstruction of blood flow.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Atrial myxomas can obstruct the mitral valve during diastole, acting like a ball-valve, leading to sudden cardiac death due to obstruction of blood flow.","ref":"2027 [PTH LEC - LE3] 06 -Pathology of the Heart III","f":[133]},"27b:67":{"id":"27b:67","ex":"2027 LE3","y":2027,"n":67,"p":21,"s":"A 74 year old woman sees her physician for her annual physical exam . On PE, HR at 64 beats /min, RR of 14 / min and BP of 120/80 mmHg. On auscultation a systolic ejection murmur is heard . In gross examination, findings reveal heaped-up calcified masses within the aortic cusps , which of the following most likely contributed to the development of this lesion?","c":[["A","Aging"],["B","Metastatic calcification"],["C","Hyperlipidemia"],["D","Tumor of parathyroid gland"]],"k":"A","ks":["A"],"r":[["Aging is one of the main factors for the development of dystrophic calcification. Calcifications associated with aging are usually found on the aortic cusps causing stiffening of the aortic valve and leading to aortic stenosis","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Hyperlipidemia contributes to atherosclerosis, plaques of which can calcify. However, hyperlipidemia is more closely associated with coronary artery disease.","bor","2028 LE2 Q96"],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Aging is one of the main factors for the development of dystrophic calcification. Calcifications associated with aging are usually found on the aortic cusps causing stiffening of the aortic valve and leading to aortic stenosis","ref":"[CUERVO] PTH - LE3 (v1)","f":[132]},"27b:68":{"id":"27b:68","ex":"2027 LE3","y":2027,"n":68,"p":21,"s":"Causative factors which have been used to explain the development of idiopathic hypertrophic subaortic stenosis include:","c":[["A","Chronic alcoholism"],["B","Nutritional deficiency in pregnancy"],["C","Amyloid infiltration of the myocardium"],["D","B-MHC gene mutations of sarcomere proteins of myocardial fibers"]],"k":"D","ks":["D"],"r":[["Chronic alcoholism: Associated with Ventricular Septal Defect (VSD)","own",""],["Nutritional deficiency in pregnancy: Cause of Primary or Idiopathic Restrictive Cardiomyopathy (RCMP)","own",""],["Amyloid infiltration of the myocardium: One of the causes of Secondary Restrictive Cardiomyopathy along with radiation fibrosis, sarcoidosis, immune reactions","own",""],["B-MHC gene mutation of sarcomere proteins of myocardial fibers: Mutations causing Idiopathic Hypertrophic Subaortic Stenosis or Hypertrophic Cardiomyopathy (HCMP) is caused by mutations found most commonly in the genes encoding - Sarcomeric protein myosin-binding protein C (MYBP-C) or B-myosin heavy chain (B-MHC/ MYH7) which are the contractile unit of the cardiac and skeletal muscle","own",""]],"t":"UNC","sub":"Heart","ref":"2027 [PTH LEC - LE3] 06 -Pathology of the Heart III","f":[126]},"27b:69":{"id":"27b:69","ex":"2027 LE3","y":2027,"n":69,"p":21,"s":"A 30 year-old woman had atrial fibrillation that was poorly controlled, suffered an intractable heart failure. At autopsy, her 600 gm heart is noted to have a mitral valve with partial commissural fusion of the leaflets along with the thickening and the shortening of the chordae tendineae. There is an enlarged left atrium filled with subendocardial fibrosis and thickening. Which of the following is the expected morphologic findings of the mitral valve leaflets?","c":[["A","Aschoff bodies"],["B","Hypertrophic myocardial fiber disarray"],["C","Thrombotic endocarditis"],["D","Myxomatous degradation"]],"k":"A","ks":["A"],"r":[["Aschoff bodies, commissural fusion of cusps leading to stenosis, “Fish mouth deformity”, shortening/thickening of chordae tendineae, and Fibrosis Hypertonic myocardial fiber disarray: Seen in chronic ischemic heart disease Non-bacterial","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["thrombotic endocarditis with deposition of fibrin, platelets, and other cellular elements of blood (thrombus) on the valve leaflets, and sterile vegetations (no inflammation)","own",""],["Myxomatous degradation: Seen on the mitral valve prolapse with hooding/ballooning of the mitral leaflets","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Rheumatoid fever findings include: Aschoff bodies, commissural fusion of cusps leading to stenosis, “Fish mouth deformity”, shortening/thickening of chordae tendineae, and Fibrosis | Hypertonic myocardial fiber disarray: Seen in chronic ischemic heart disease | Non-bacterial thrombotic endocarditis with deposition of fibrin, platelets, and other cellular elements of blood (thrombus) on the valve leaflets, and sterile vegetations (no inflammation) | Myxomatous degradation: Seen on the mitral valve prolapse with | hooding/ballooning of the mitral leaflets","ref":"[CUERVO] PTH - LE3 (v1)","f":[129]},"27b:70":{"id":"27b:70","ex":"2027 LE3","y":2027,"n":70,"p":22,"s":"A 69-year-old woman with 10kg weight loss over the past 6 months, present with painless jaundice over the past 2 weeks. A biopsy of the head of the pancreas showed adenocarcinoma. The liver and lung disclosed multiple metastatic nodules by CT scan and chest radiograph. Which of the endocardial valvular lesions is she most likely to develop?","c":[["A","Acute infective endocarditis"],["B","Non-bacterial thrombotic endocarditis"],["C","Libman-Sacks endocarditis"],["D","Rheumatic endocarditis"]],"k":"B","ks":["B"],"r":[["A. Caused by highly virulent organisms","bor","2025 LE2 Q105"],["Non-bacterial thrombotic endocarditis ● Sterile vegetations ○ Characterized by deposition of fibrin, platelets, and other cellular elements of blood (thrombus) on the valve leaflets. ● Associated with debilitated patients, carcinoma (adenocarcinoma), and sepsis","own",""],["Libman–Sacks endocarditis: Seen in systemic lupus erythematosus (SLE), vegetations occur on both sides of the valve leaflets (not just lines of closure), and there’s immune complex deposition.","bor","2028 LE2 Q106"],["D. Acute immunologically mediated, multi-system inflammatory disease, following group A (beta-hemolytic) streptococcal pharyngitis","bor","2025 LE2 Q105"]],"t":"UNC","sub":"Heart","bm":1,"orig":"Non-bacterial thrombotic endocarditis ● Sterile vegetations ○ Characterized by deposition of fibrin, platelets, and other cellular elements of blood (thrombus) on the valve leaflets. ● Associated with debilitated patients, carcinoma (adenocarcinoma), and sepsis","ref":"Self-Assessment Part V (Heart Pathology Module) - Feedback by Dr. Yañez","f":[127]},"27b:71":{"id":"27b:71","ex":"2027 LE3","y":2027,"n":71,"p":22,"s":"A 66 y/o patient who was diagnosed with tuberculosis had signs and symptoms of congestive heart failure. On chest x-ray, cardiac shadow appears globularly enlarged. Physician’s initial impression was pericardial effusion. Which of the following types of pericarditis might this patient have?","c":[["A","Hemorrhagic"],["B","Fibrinous"],["C","Serous"],["D","Purulent"]],"k":"B","ks":["B"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Hemorrhagic is seen in malignancy, TB, or post-cardiac surgery. Tuberculosis is one of the classic causes of hemorrhagic pericarditis. The globular cardiac shadow suggests a large effusion.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Hemorrhagic is seen in malignancy, TB, or post-cardiac surgery. Tuberculosis is one of the classic causes of hemorrhagic pericarditis. The globular cardiac shadow suggests a large effusion.","ref":"[CUERVO] PTH - LE3 (v1)","f":[137]},"27b:72":{"id":"27b:72","ex":"2027 LE3","y":2027,"n":72,"p":22,"s":"A 30-year-old male on heroin IV mainlining, is brought to the hospital for high grade fever and chills. A loud changing murmur is auscultated, with scattered erythematous lesions on palms and soles and petechial and splinter hemorrhages in the nail beds. On which of the following heart valves would the appearance of vegetations be expected?","c":[["A","Aortic valve"],["B","Mitral valve"],["C","Pulmonic valve"],["D","Tricuspid valve"]],"k":"D","ks":["D"],"r":[["Commonly affected in left-sided infective endocarditis, especially in patients with congenital heart disease or degenerative valve disease, but not typically in IV drug users.","bor","2028 LE2 Q100"],["Another frequent site in left-sided endocarditis, especially with rheumatic heart disease. Vegetations here often present with pulmonary congestion rather than septic emboli to the lungs.","bor","2028 LE2 Q100"],["Rarely involved in infective endocarditis. Infection of this valve is uncommon even among IV drug users because of its lower pressure and less turbulent blood flow.","bor","2028 LE2 Q100"],["Tricuspid valves: Most commonly affected in IV drug users due to direct inoculation of pathogens into the venous system. Vegetations here lead to septic emboli to the lungs.","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Tricuspid valves: Most commonly affected in IV drug users due to direct inoculation of pathogens into the venous system. Vegetations here lead to septic emboli to the lungs.","f":[138]},"27b:73":{"id":"27b:73","ex":"2027 LE3","y":2027,"n":73,"p":22,"s":"A newborn infant with breathing difficulties immediately after birth, is diagnosed to have Tetralogy of Fallot. Of the four characteristic morphologic features, which one is responsible for the cyanosis and hypoxemia of this patient?","c":[["A","Overriding aorta"],["B","Right ventricular hypertrophy"],["C","Ventricular septal defect"],["D","Pulmonary stenosis"]],"k":"D","ks":["D"],"r":[["Overriding aorta: Aorta is misplaced and moves toward the right side over the VSD. In this anomaly, the positioning of the great vessels is arrested midway because of the failure of development of the membranous portion of the aorta.","own",""],["Right ventricular hypertrophy: Adaptive response caused by inability of blood to go to the pulmonary artery due to","own",""],["Ventricular septal defect: Allows blood to be shunted from the R to L side of the heart because blood cannot go to the pulmonary artery due to obstruction. Pulmonary stenosis: Most important determinant of the severity and clinical consequences of TOF: degree RV outflow obstruction due to pulmonary stenosis. Lesser obstruction, blood is shunted from L to R and permitted to preferentially enter the pulmonary circulation, allowing for oxygenation. Greater obstructions, blood is forced in the opposite direction away from the pulmonary circuit leftward towards the VSD, hence, the flow of the blood is from R to L side of the heart. According to Robbins, the clinical severity of TOF largely depends on the degree of the pulmonary outflow obstruction. More commonly, severe degrees of pulmonic stenosis cause early cyanosis. Moreover, as the child grows and the heart increases in size, the pulmonic orifice does not expand proportionately, leading to progressive worsening of the stenosis.","own",""],["pulmonary stenosis. Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Overriding aorta: Aorta is misplaced and moves toward the right side over the VSD. In this anomaly, the positioning of the great vessels is arrested midway because of the failure of development of the membranous portion of the aorta. | Right ventricular hypertrophy: Adaptive response caused by inability of blood to go to the pulmonary artery due to pulmonary stenosis. | Ventricular septal defect: Allows blood to be shunted from the R to L side of the heart because blood cannot go to the pulmonary artery due to obstruction. | Pulmonary stenosis: Most important determinant of the severity and clinical consequences of TOF: degree RV outflow obstruction due to pulmonary stenosis. Lesser obstruction, blood is shunted from L to R and permitted to preferentially enter the pulmonary circulation, allowing for oxygenation. Greater obstructions, blood is forced in the opposite direction away | from the pulmonary circuit leftward towards the VSD, hence, the flow of the blood is from R to L side of the heart. According to Robbins, the clinical severity of TOF largely depends on the degree of the pulmonary outflow obstruction. More commonly, severe degrees of pulmonic stenosis cause early cyanosis. Moreover, as the child grows and the heart increases in size, the pulmonic orifice does not expand proportionately, leading to progressive worsening of the stenosis.","ref":"[PTH LEC - LE 3] 06 - Pathology of the Heart III-V","f":[135]},"27b:74":{"id":"27b:74","ex":"2027 LE3","y":2027,"n":74,"p":23,"s":"A 30-year old female delivered a live baby boy by NSD (Normal Spontaneous Delivery). Upon 2 weeks postpartum, she developed Congestive Heart Failure. Chest x-ray revealed a global enlargement of the heart, pulmonary edema, and congestion. What is most likely her condition?","c":[["A","Infective cardiomyopathy"],["B","Restrictive cardiomyopathy"],["C","Idiopathic hypertrophic cardiomyopathy"],["D","Congestive/dilated cardiomyopathy"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Restrictive (also known as Infiltrative cardiomyopathy) is characterized by a primary decrease in ventricular compliance, resulting in impaired ventricular filling during diastole (simply put, the wall is stiffer). Amyloidosis Endomyocardial fibrosis, Loeffler endomyocarditis are examples of this.","bor","2025 LE2 Q116"],["Most cases of Hypertrophic cardiomyopathy are genetic: caused by missense mutations in one of several genes encoding proteins that form the contractile","bor","2025 LE2 Q116"],["The patient’s symptoms and the timing of the onset (2 weeks postpartum) likely suggest peripartum cardiomyopathy (PPCM), which is specifically linked to pregnancy and period of postpartum. The most likely condition is congestive/dilated cardiomyopathy. Hallmarks of Congestive/Dilated Cardiomyopathy: - Global enlargement of heart - Pulmonary edema - Pulmonary congestion","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"The patient’s symptoms and the timing of the onset (2 weeks postpartum) likely suggest peripartum cardiomyopathy (PPCM), which is specifically linked to pregnancy and period of postpartum. The most likely condition is congestive/dilated cardiomyopathy. Hallmarks of Congestive/Dilated Cardiomyopathy: - Global enlargement of heart - Pulmonary edema - Pulmonary congestion","ref":"Heart Pathology Module by Dr. Yanez","f":[134]},"27b:75":{"id":"27b:75","ex":"2027 LE3","y":2027,"n":75,"p":23,"s":"Which of the following choices is NOT a compensatory mechanism to maintain an adequate cardiac output in the Congestive Heart Failure","c":[["A","Renin-angiotensin-aldosterone activation"],["B","Increase heart rate"],["C","Peripheral vasoconstriction"],["D","Elaboration of corticosteroids by adrenal gland"]],"k":"D","ks":["D"],"r":[["Renin-angiotensin-aldosterone activation: A classic compensatory mechanism in CHF, increases blood volume and peripheral resistance to maintain cardiac output.","own",""],["Increase heart rate: Sympathetic nervous system stimulates tachycardia to preserve cardiac output (CO = HR x SV).","own",""],["Peripheral vasoconstriction: Helps redistribute blood flow to vital organs, common in CHF.","own",""],["Elaboration of corticosteroids by adrenal gland: Cortisol secretion is not a direct compensatory response in CHF and doesn’t significantly contribute to maintaining cardiac output.","own",""]],"t":"UNC","sub":"Heart","f":[130]},"27b:76":{"id":"27b:76","ex":"2027 LE3","y":2027,"n":76,"p":23,"s":"Which pathologic feature is compatible with Acute cor pulmonale?","c":[["A","LV hypertrophy"],["B","Global dilatation and enlargement of the heart"],["C","RV dilatation"],["D","RV hypertrophy"]],"k":"C","ks":["C"],"r":[["LV hypertrophy: An adaptive response to the pressure overload of chronic hypertension","own",""],["Global dilatation and enlargement of the heart: Indicative of dilated cardiomyopathy","own",""],["RV dilatation: ACUTE cor pulmonale (such as in acute massive pulmonary thromboembolism)","own",""],["RV hypertrophy: CHRONIC cor pulmonale (due to chronic RV pressure overload which appears in long-standing pulmonary hypertension)","own",""]],"t":"UNC","sub":"Heart","ref":"[PTH - LE 3] 05 - Pathology of the Heart II","f":[125]},"27b:77":{"id":"27b:77","ex":"2027 LE3","y":2027,"n":77,"p":23,"s":"A 54-year old male complains of episodic mild chest pain that develops whenever he attempts to climb the stairs. He relates that the pain goes away after a couple of minutes if he stops and rests. He also states that the pain has not increased in frequency or duration in the last several months. He most likely has:","c":[["A","Stable angina"],["B","Unstable angina"],["C","Prinzmetal angina"],["D","Myocardial infarction"]],"k":"C*/A","ks":["A","C"],"r":[["Stable angina: Exertional chest pain that is predictable, relieved by rest, and unchanged in frequency/severity over time. Classic presentation in this patient.","own",""],["Unstable angina: Occurs at rest or with minimal exertion, and worsens over time. Not consistent with this stable, exertion-only pattern.","own",""],["Prinzmetal angina: Caused by coronary vasospasm, usually occurs at rest and often at night or early morning. Pain not exertion-related.","own",""],["Myocardial infarction: Presents with severe, persistent chest pain, often not relieved by rest and associated with systemic symptoms (nausea, diaphoresis). Not seen here.","own",""]],"t":"UNC","sub":"Heart","flag":"Source-key warning: the key cell prints 'C*/A'. The accompanying rationale calls option A (Stable angina) the classic presentation in this patient. The asterisk marks uncertainty in the source.","orig":"Stable angina: Exertional chest pain that is predictable, relieved by rest, and unchanged in frequency/severity over time. Classic presentation in this patient. | Unstable angina: Occurs at rest or with minimal exertion, and worsens over time. Not consistent with this stable, exertion-only pattern. | Prinzmetal angina: Caused by coronary vasospasm, usually occurs at rest and often at night or early morning. Pain not exertion-related. | Myocardial infarction: Presents with severe, persistent chest pain, often not relieved by rest and associated with systemic symptoms (nausea, diaphoresis). Not seen here.","ref":"[PTH - LE3] Pathology of the Heart II","f":[]},"27b:78":{"id":"27b:78","ex":"2027 LE3","y":2027,"n":78,"p":24,"s":"Which of the following major valvular lesions is incorrectly paired with its frequent etiology","c":[["A","Mitral valve stenosis - myxomatous degeneration"],["B","Tricuspid insufficiency - substance abuse iv manual misaligning"],["C","Mitral stenosis - infective endocarditis"],["D","Aortic calcification - decalcification in aging"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["The most common cause of mitral stenosis is rheumatic fever, not infective endocarditis.","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","flag":"Cross-year discrepancy: 2027 keys the mitral stenosis - infective endocarditis pairing as the incorrect one. 2025 Q119 keyed the tricuspid insufficiency pairing.","bm":1,"orig":"The most common cause of mitral stenosis is rheumatic fever, not infective endocarditis.","f":[136]},"27b:79":{"id":"27b:79","ex":"2027 LE3","y":2027,"n":79,"p":24,"s":"Which of the following is consistent with hypertrophic cardiomyopathy?","c":[["A","Severe reduction of CO and SV"],["B","Global chamber dilatation"],["C","Extensive myocyte hypertrophy and myocardial fiber disarray"],["D","All of the above"]],"k":"C","ks":["C"],"r":[["HCMP produces muscular hypercontracting heart with INCREASED or normal ejection fraction and cardiac output","own",""],["Characteristic of Dilated CMP - concomitant progressive hypertrophy and global dilation, hypo-contracting heart, low LV ejection fraction, and low cardiac output.","own",""],["Myocardial disarray is specific for HCMP. Extensive myocyte hypertrophy is a microscopic findings of HCMP","own",""],["Characteristic clinical feature of restrictive CMP - due to a restrictive ventricular filling and pressure overload","own",""]],"t":"UNC","sub":"Heart","ref":"[PTH LEC - LE 3] 06 - Pathology of the Heart III-V","f":[126]},"27b:80":{"id":"27b:80","ex":"2027 LE3","y":2027,"n":80,"p":24,"s":"A 37-year-old woman presents with prolonged cramps, nausea, vomiting, diarrhea, and episodic flush of the skin. Additionally, she develops pearly white, plaque-like deposits on the tricuspid valve leaflets. These cardiac lesions are most likely due to:","c":[["A","Rheumatic heart disease"],["B","Amyloidosis"],["C","Iron overload"],["D","Carcinoid heart disease"]],"k":"D","ks":["D"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Carcinoid heart disease: Right-sided valvular fibrosis, especially tricuspid + GI symptoms (diarrhea, flushing). Pearly white plaques on valves are classic.","own",""]],"t":"UNC","sub":"Heart","bm":1,"orig":"Carcinoid heart disease: Right-sided valvular fibrosis, especially tricuspid + GI symptoms (diarrhea, flushing). Pearly white plaques on valves are classic.","f":[]},"27b:81":{"id":"27b:81","ex":"2027 LE3","y":2027,"n":81,"p":24,"s":"A previously healthy 32-year-old woman complained of progressive exertional dyspnea, orthopnea and bipedal edema of 2 weeks duration. She had a history of childbirth two months ago. Pertinent findings included bP of 90/60 mm/Hg; HR of 120 beats/min; RR of 22/min and a temperature of 36.7C. Bi-basal rales and cardiomegaly were elicited. A chest radiograph shows a globally enlarged heart. Which of the following cardiovascular conditions i she most likely to have.","c":[["A","Chronic Ischemic Heart Disease"],["B","Rheumatic Heart disease"],["C","Mitral valve prolapse"],["D","Congestive cardiomyopathy"]],"k":"A","ks":["A"],"r":[["Congestive cardiomyopathy: Occurs postpartum, presents with HF signs (dyspnea, orthopnea, edema), tachycardia, low BP, cardiomegaly","own",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""]],"t":"UNC","sub":"Heart","flag":"Source-key warning: the uploaded exam keys A (Chronic Ischemic Heart Disease), but the only rationale given supports D (Congestive cardiomyopathy, postpartum). 2027 LE3 Q74, 2028 LE2 Q102 and 2025 Q116 all key dilated cardiomyopathy for the same scenario.","bm":1,"orig":"Congestive cardiomyopathy: Occurs postpartum, presents with HF signs (dyspnea, orthopnea, edema), tachycardia, low BP, cardiomegaly","ref":"[PTH LEC - LE 3] 06 - Pathology of the Heart III-V","f":[134]},"27b:82":{"id":"27b:82","ex":"2027 LE3","y":2027,"n":82,"p":25,"s":"A 50 year old woman with advanced breast cancer was found to have fluid accumulation on the right side. She claims no heart abnormalities. What is the LEAST related finding associated with her condition?","c":[["A","The fluid in the thoracic space may give rise to
