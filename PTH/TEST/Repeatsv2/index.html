,""],["Competitive inhibition of oxygen binding: CO poisoning. → Oxygen, and the resultant carboxyhemoglobin cannot carry O2. → Systemic hypoxia develops when the hemoglobin is 20% to 30% saturated with CO, unconsciousness and death are likely with 60% to 70% saturation. Not found in the respiratory epithelium, which is damaged by ozone. Ozone generates reactive oxygen species, which increase oxidative stress, leading to damage of the respiratory epithelium and exacerbation of lung diseases. Interferes with enzymes involved in heme synthesis, mechanism of lead injury. → Lead has a high affinity for sulfhydryl groups and interferes with two enzymes involved in heme synthesis: delta-aminolevulinic acid dehydratase and ferrochelatase. → Iron incorporation into heme is impaired, leading to microcytosis (small red cells) and anemia. → Lead also inhibits sodium- and potassium-dependent adenosine triphosphatases (ATPases) in cell membranes, an effect that may increase the fragility of red cells, causing hemolysis.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ENV","sub":"","bm":1,"orig":"Competitive inhibition of oxygen binding: CO poisoning. → Oxygen, and the resultant carboxyhemoglobin cannot carry O2. → Systemic hypoxia develops when the hemoglobin is 20% to 30% saturated with CO, unconsciousness and death are likely with 60% to 70% saturation. | Not found in the respiratory epithelium, which is damaged by ozone. | Ozone generates reactive oxygen species, which increase oxidative stress, leading to damage of the respiratory epithelium and exacerbation of lung diseases. | Interferes with enzymes involved in heme synthesis, mechanism of lead injury. → Lead has a high affinity for sulfhydryl groups and interferes with two enzymes involved in heme synthesis: delta-aminolevulinic acid dehydratase and ferrochelatase. | esser consequence because they are generally removed in the nose or trapped by the mucociliary epithelium of the airways.","ref":"Robbins & Kumar Basic Pathology 11th Edition p. 409","f":[]},"27a:13":{"id":"27a:13","ex":"2027 LE2","y":2027,"n":13,"p":4,"s":"A 55-year-old male presents with tremors, irritability, and gingivitis. He has a 20-year history of occupational exposure to mercury while working in a thermometer factory. Considering his prolonged exposure, which organ is most likely to be affected by mercury toxicity?","c":[["A","Heart"],["B","Kidneys"],["C","Liver"],["D","Lungs"]],"k":"B","ks":["B"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Mercury has neuronal and kidney toxicities. The neuronal toxicity can be attributed to its lipid solubility and high binding affinity to thiol groups making the developing brain susceptible.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Long term exposure to radon and radon daughters can increase risk of lung cancer","own",""]],"t":"ENV","sub":"","ref":"LE2 Feedback","f":[]},"27a:14":{"id":"27a:14","ex":"2027 LE2","y":2027,"n":14,"p":4,"s":"What is the substance in cigarettes which is responsible for addiction?","c":[["A","Arsenic"],["B","Carbon monoxide"],["C","Phenol"],["D","Nicotine"]],"k":"D","ks":["D"],"r":[["A carcinogen in pesticides associated with angiosarcoma","bor","2028 LE2 Q90"],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Tobacco smoke contains more than 7000 compounds. Among these are nicotine, which is responsible for tobacco addiction, and potent carcinogens-- mainly, PAH, NKK, and aromatic amines. Nicotine also has other adverse effects particularly on fetal development, and is associated with preterm birth and stillbirth.","own",""]],"t":"ENV","sub":"","ref":"2027 LEC TRANS LE2 01 - ENVIRONMENTAL DISEASES (pg. 10)","f":[]},"27a:15":{"id":"27a:15","ex":"2027 LE2","y":2027,"n":15,"p":4,"s":"A 4-year-old child was brought to the Emergency Room after ingesting 50 tablets in a bottle left on the table by her father who was on medication for stroke. Two hours later, the child became progressively obtunded and then lapsed into a coma. The child exhibited tachypnea and tachycardia, but was afebrile. Laboratory studies with blood gas analysis showed metabolic acidosis. Which of the following substances did this child most likely ingest?","c":[["A","Acetylsalicylic acid"],["B","Ethanol"],["C","Lead"],["D","Warfarin"]],"k":"A","ks":["A"],"r":[["Acetylsalicylic acid → aka aspirin → used as low-dose medication to prevent heart attacks and strokes Aspirin ingestion can lead to metabolic acidosis. The tachypnea is a physiologic compensation with respiratory alkalosis. Acute toxicity → fatty liver, gastritis and ulcer, CNS depression Neurologic toxicity → due to altered calcium balance → children: neurologic impairment → adult: peripheral demyelinating neuropathy Hematologic toxicity → due to inhibition of ALA dehydratase and ferrochelatase in heme synthesis → microcytic hypochromic anemia Skeletal toxicity → due to interference with the normal remodeling of cartilage in primary bone trabeculae in the epiphysis → lead lines: radiodense appearance due to increased bone density","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ENV","sub":"","bm":1,"orig":"Acetylsalicylic acid → aka aspirin → used as low-dose medication to prevent heart attacks and strokes Aspirin ingestion can lead to metabolic acidosis. The tachypnea is a physiologic compensation with respiratory alkalosis. | Acute toxicity → fatty liver, gastritis and ulcer, CNS depression | Neurologic toxicity → due to altered calcium balance → children: neurologic impairment → adult: peripheral demyelinating neuropathy Hematologic toxicity → due to inhibition of ALA dehydratase and ferrochelatase in heme synthesis → microcytic hypochromic anemia Skeletal toxicity → due to interference with the normal remodeling of cartilage in primary bone trabeculae in the epiphysis → lead lines: radiodense appearance due to increased bone density","ref":"2027 LEC TRANS LE2 01 ENVIRONMENTAL DISEASES","f":[]},"27a:16":{"id":"27a:16","ex":"2027 LE2","y":2027,"n":16,"p":5,"s":"30-year-old woman presents with muscle weakness, nausea, and abdominal pain. She lives near a mining site and consumes well water. Blood tests reveal a significant increase in serum calcium and creatinine. Her urine shows high levels of cadmium. Which of the following long-term effects is this patient most at risk for developing?","c":[["A","Chronic kidney disease"],["B","Lung cancer"],["C","Neuropathy"],["D","Osteoporosis"]],"k":"A","ks":["A"],"r":[["Cadmium is preferentially toxic to the kidneys and the lungs through uncertain mechanisms that may involve increased production of ROS. Chronic cadmium exposure is associated with nephrotoxicity, which leads to chronic kidney disease. Cadmium is often found near mining sites and in contaminated drinking water.","own",""],["Tobacco smoking is strongly linked to smoking.","bor","2026 LE2 Q71"],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ENV","sub":"","bm":1,"orig":"Cadmium is preferentially toxic to the kidneys and the lungs through uncertain mechanisms that may involve increased production of ROS. Chronic cadmium exposure is associated with nephrotoxicity, which leads to chronic kidney disease. Cadmium is often found near mining sites and in contaminated drinking water.","ref":"Robbins p. 413","f":[]},"27a:17":{"id":"27a:17","ex":"2027 LE2","y":2027,"n":17,"p":5,"s":"Bisphenol A (BPA) is widely used in the production of plastics and can leach into food and beverages. Which of the following mechanisms best explains how BPA acts as an environmental toxin in the human body?","c":[["A","Inhibits DNA repair enzymes"],["B","Acts as an endocrine disruptor by mimicking estrogen"],["C","Promotes oxidative stress in mitochondrial pathways"],["D","Directly damages cellular proteins through covalent bonding"]],"k":"B","ks":["B"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Bisphenol A (BPA) ● used in the synthesis of polycarbonate food and water containers and of epoxy resins that line almost all food bottles and cans, as a result, exposure to BPA is virtually ubiquitous in humans. ● BPA has long been known as a potential endocrine disruptor. ● Several large retrospective studies have linked elevated urinary BPA levels to heart disease in adult populations. ● In addition, infants who drink from BPA-containing containers may be particularly susceptible to the endocrine effects of BPA. (Robbins. p. 415) BPA primarily acts as an endocrine disruptor, mimicking estrogen by binding to estrogen receptors. This can interfere with normal hormonal regulation and contribute to conditions like infertility, early puberty, and increased cancer risk.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ENV","sub":"","bm":1,"orig":"Bisphenol A (BPA) ● used in the synthesis of polycarbonate food and water containers and of epoxy resins that line almost all food bottles and cans, as a result, exposure to BPA is virtually ubiquitous in humans. ● BPA has long been known as a potential endocrine disruptor. ● Several large retrospective studies have linked elevated urinary BPA levels to heart disease in adult populations. ● In addition, infants who drink from BPA-containing containers may be particularly susceptible to the endocrine effects of BPA. (Robbins. p. 415) BPA primarily acts as an endocrine disruptor, mimicking estrogen by binding to estrogen receptors. This can interfere with normal hormonal regulation and contribute to conditions like infertility, early puberty, and increased cancer risk.","ref":"2027 DR. DEMAISIP LE2 RATIO ROBBINS. p. 415","f":[63]},"27a:18":{"id":"27a:18","ex":"2027 LE2","y":2027,"n":18,"p":5,"s":"What role does tobacco play in the carcinogenesis of lung cancer?","c":[["A","Enhances the activity of DNA repair enzymes"],["B","Increases the production of mucin"],["C","Induces genetic mutations"],["D","Promotes the synthesis of pro-inflammatory cytokines"]],"k":"C","ks":["C"],"r":[["Tobacco-related damage generally overwhelms repair mechanisms.","own",""],["Associated with irritation but not directly involved in carcinogenesis.","own",""],["Tobacco smoke contains carcinogens that induce chromosomal instability (B), leading to mutations that contribute to cancer development in the head and neck.","own",""],["is a general mechanism of inflammation but not specific to carcinogenesis.","own",""]],"t":"ENV","sub":"","ref":"2027 DR. DEMAISIP LE2 RATIO ROBBINS. p. 416","f":[]},"27a:19":{"id":"27a:19","ex":"2027 LE2","y":2027,"n":19,"p":6,"s":"A 35 year old male develops severe nausea, vomiting, and flushing after drinking alcohol at a party. She is later found to have a genetic polymorphism affecting an enzyme in ethanol metabolism. Which enzyme is mostly likely deficient in this patient?","c":[["A","Acetyl-Coa Synthetase"],["B","Alcohol Dehydrogenase"],["C","Aldehyde Dehydrogenase"],["D","Cytochrome P450 2E1 (CYP2E1)"]],"k":"C","ks":["C"],"r":[["is involved in fatty acid metabolism and not ethanol metabolism.","own",""],["Deficiency would slow ethanol metabolism but does not typically cause the same severe flushing reaction.","own",""],["A deficiency in Aldehyde dehydrogenase (ALDH), commonly seen in individuals of East Asian descent, leads to the accumulation of acetaldehyde after alcohol consumption, resulting in the \"alcohol flush reaction.\" ● About 50% of Asians have very low aldehyde dehydrogenase activity due to the substitution of lysine for glutamine at residue 487 (the normal allele is termed ALDH2*1, and the inactive variant is designated as ALDH2*2). ● The ALDH2*2 protein has dominant-negative activity, such that even one copy of the ALDH2*2 allele reduces enzyme activity significantly. ● Individuals homozygous for the ALDH2*2 allele are completely unable to oxidize acetaldehyde and cannot tolerate alcohol, experiencing nausea, flushing, tachycardia, and hyperventilation after its ingestion.","own",""],["Plays a role in high alcohol consumption but is not involved in the flushing reaction.","own",""]],"t":"ENV","sub":"","ref":"2027 DR. DEMAISIP LE2 RATIO ROBBINS p. 419","f":[]},"27a:20":{"id":"27a:20","ex":"2027 LE2","y":2027,"n":20,"p":6,"s":"A 30-year-old male presents with sudden-onset chest pain after using cocaine. His ECG reveals ST-segment elevation, and serum troponin levels are elevated. What is the most likely cause of his symptoms?","c":[["A","Atherosclerotic plaque rupture"],["B","Coronary artery vasospasm"],["C","Infective endocarditis"],["D","Pulmonary embolism"]],"k":"B","ks":["B"],"r":[["Atherosclerotic plaque rupture can cause MI but is not as likely in a young, otherwise healthy individual using cocaine.","own",""],["Infective endocarditis is more commonly related to IV drug use, not inhaled cocaine.","own",""],["Cocaine induces coronary artery vasospasm leading to myocardial ischemia and infarction, which is the most common cardiac complication of acute cocaine use.","own",""],["Pulmonary embolism is not directly associated with cocaine use in this case.","own",""]],"t":"ENV","sub":"","ref":"2027 DR. DEMAISIP LE2 RATIO ROBBINS p. 424","f":[]},"27a:21":{"id":"27a:21","ex":"2027 LE2","y":2027,"n":21,"p":6,"s":"A 20-year-old male was trapped inside a burning house and suffered 20% total body surface area (TBSA) burns on his arms. Though initially stable, he died 48 hours after. What is the MOST LIKELY cause?","c":[["A","Congestive Heart Failure"],["B","Extensive Burns"],["C","Full Thickness Burns"],["D","Inhalation Injury"]],"k":"D","ks":["D"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["The extent of his burns was not great, but a fire in a closed space is often accompanied by inhalation of hot gases that lead to inhalation injury.","own",""]],"t":"ENV","sub":"","ref":"2027 DR. DEMAISIP LE2 RATIO; ROBBINS. p. 427.","f":[]},"27a:22":{"id":"27a:22","ex":"2027 LE2","y":2027,"n":22,"p":7,"s":"A 65-year-old female presents with dry skin, poor wound healing, and night blindness. She is on a strict vegetarian diet. What vitamin deficiency is most likely her condition?","c":[["A","Vitamin A"],["B","Vitamin B12"],["C","Vitamin C"],["D","Vitamin D"]],"k":"A","ks":["A"],"r":[["Vitamin A deficiency leads to symptoms such as dry skin, poor wound healing, and night blindness. Vegetarians may be at risk if they do not consume fortified foods or adequate beta-carotene.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"NUT","sub":"","bm":1,"orig":"Vitamin A deficiency leads to symptoms such as dry skin, poor wound healing, and night blindness. Vegetarians may be at risk if they do not consume fortified foods or adequate beta-carotene.","ref":"2027 DR. DEMAISIP LE2 RATIO","f":[]},"27a:23":{"id":"27a:23","ex":"2027 LE2","y":2027,"n":23,"p":7,"s":"A 3-year-old boy presents with edema, hair changes, and an enlarged liver. His mother mentions that he is not eating enough protein-rich foods. Which of the following mechanisms best explains the clinical manifestations observed?","c":[["A","Decreased albumin synthesis"],["B","Decreased insulin secretion"],["C","Increased catecholamine levels"],["D","Increased cortisol levels"]],"k":"A","ks":["A"],"r":[["Decreased albumin synthesis (A) due to inadequate protein intake leads to hypoalbuminemia, causing edema and contributing to an enlarged liver seen in kwashiorkor.","own",""],["Decreased insulin secretion (B) is not a direct mechanism for the symptoms of kwashiorkor.","own",""],["Increased catecholamine levels (C) would lead to metabolic changes but not directly to the symptoms of kwashiorkor.","own",""],["Increased cortisol levels (D) can occur in stress but does not explain edema specifically.","own",""]],"t":"NUT","sub":"","ref":"2027 DR. DEMAISIP LE2 RATIO","f":[64]},"27a:24":{"id":"27a:24","ex":"2027 LE2","y":2027,"n":24,"p":7,"s":"A 24-year-old female with anorexia nervosa has developed amenorrhea for the past 6 months. Which of the following is the most likely explanation for her amenorrhea?","c":[["A","High level of estrogen hormones"],["B","High levels of insulin"],["C","Low level of gonadotropin-releasing hormone"],["D","Low levels of prolactin hormone"]],"k":"C","ks":["C"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["In anorexia nervosa, there is often hypothalamic suppression, leading to reduced secretion of GnRH, which in turn causes decreased levels of luteinizing hormone (LH) and follicle-stimulating hormone (FSH), resulting in amenorrhea.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"NUT","sub":"","bm":1,"orig":"In anorexia nervosa, there is often hypothalamic suppression, leading to reduced secretion of GnRH, which in turn causes decreased levels of luteinizing hormone (LH) and follicle-stimulating hormone (FSH), resulting in amenorrhea.","ref":"2027 LEC TRANS LE2 02 NUTRITIONAL DISEASES","f":[]},"27a:25":{"id":"27a:25","ex":"2027 LE2","y":2027,"n":25,"p":7,"s":"A 25-year-old female patient presents with a history of anorexia nervosa. She is severely underweight and exhibits signs of malnutrition, including fatigue, muscle weakness, and hair loss. Blood tests reveal normal serum calcium levels. Which of the following electrolyte imbalances is MOST likely to be present in this patient?","c":[["A","Hypercalcemia"],["B","Hypokalemia"],["C","Hypernatremia"],["D","Hyperkalemia"]],"k":"B","ks":["B"],"r":[["Calcium levels are normal. Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["This patient’s history is consistent with bulimia nervosa, characterized by binge eating followed by compensatory behaviors like vomiting. Self-induced vomiting leads to hypokalemia due to loss of potassium in gastric contents, along with metabolic alkalosis.","own",""],["Hypernatremia is more likely to be seen in cases of dehydration or excessive sodium intake, which are not typical features of anorexia nervosa.","own",""],["Hyperkalemia is rare in anorexia and usually associated with kidney problems or certain medications.","own",""]],"t":"NUT","sub":"","ref":"2027 LEC TRANS LE2 02 NUTRITIONAL DISEASES","f":[]},"27a:26":{"id":"27a:26","ex":"2027 LE2","y":2027,"n":26,"p":7,"s":"A 55-year-old man with central obesity and insulin resistance is found to have low adiponectin and high leptin levels. Despite high leptin, his appetite remains elevated. What is the most likely cause of his persistent appetite despite high leptin levels?","c":[["A","Ghrelin overproduction"],["B","Increased cortisol production"],["C","Leptin receptor deficiency"],["D","Leptin resistance"]],"k":"D","ks":["D"],"r":[["Ghrelin is a hunger-stimulating hormone. There is no evidence of ghrelin overproduction since it is not characterized by a dysfunction of elevated appetite despite high leptin levels.","own",""],["Cortisol levels do not directly interfere with leptin’s function.","own",""],["Leptin receptor deficiency is an extremely rare inherited condition causing severe obesity from an early age (early-onset obesity).","own",""],["In obesity, leptin resistance is common. Although leptin levels are elevated, the brain (hypothalamus) fails to respond effectively to leptin’s appetite-suppressing signals, leading to continued overeating and weight gain. It is possible that other genetic or acquired defects in the leptin pathway play a role in the more common forms of obesity. The anorexigenic response of leptin is blunted in states of obesity despite high levels of circulating leptin (leptin resistance). Ghrelin (gut hormone) levels are lower in obese individuals compared to normal weight individuals, and levels increase with reduction in obesity.","own",""]],"t":"NUT","sub":"","ref":"LE2 feedback; (Robbins p. 446)","f":[]},"27a:27":{"id":"27a:27","ex":"2027 LE2","y":2027,"n":27,"p":8,"s":"A 45-year-old man with a BMI of 38 presents with hypertension, hyperglycemia, and elevated triglycerides. Which of the following is the most likely diagnosis associated with his obesity?","c":[["A","Cushing syndrome"],["B","Hyperthyroidism"],["C","Metabolic syndrome"],["D","Type 2 diabetes"]],"k":"C","ks":["C"],"r":[["Cushing syndrome does not typically present with these specific metabolic derangements.","own",""],["Hyperthyroidism usually causes weight loss rather than obesity.","own",""],["Obesity has a central role in the development of a cluster of diseases known as the metabolic syndrome. MS is characterized by abnormalities of glucose and lipid metabolism/dyslipidemia (elevated triglycerides) coupled with hypertension and evidence of a systemic proinflammatory state.","own",""],["Type 2 diabetes - just one consequence of obesity. Obesity is a leading cause of insulin resistance, which can progress to T2DM. Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"NUT","sub":"","ref":"LE2 feedback","f":[]},"27a:28":{"id":"27a:28","ex":"2027 LE2","y":2027,"n":28,"p":8,"s":"Which among the following will predict a good prognosis for a woman with breast malignancy?","c":[["A","Tumor cells strongly estrogen receptor positive"],["B","No metastases in the sampled lymph nodes"],["C","One relative had a similar type of breast cancer"],["D","High grade tumor"]],"k":"B","ks":["B"],"r":[["Strongly estrogen receptor-positive tumor recurrence may still occur even years after treatment.","own",""],["This means that the malignancy has not spread from the primary site to the other sites.","own",""],["Family history is not a good prognosis factor for breast malignancies, but may possibly be considered a risk factor in its development.","own",""],["A tumor with high grade indicates a high level of differentiation. These cells generally grow and spread more rapidly which consequently affects its prognosis.","own",""]],"t":"N1","sub":"","ref":"LE2 feedback","f":[24]},"27a:29":{"id":"27a:29","ex":"2027 LE2","y":2027,"n":29,"p":8,"s":"Which of the following laboratory findings is most likely to be present in a patient with a moderately differentiated adenocarcinoma of the colon?","c":[["A","K-RAS mutation in the neoplastic cells"],["B","Neoplastic cells positive for vimentin"],["C","Stool culture positive for E. coli"],["D","Presence of HIV-1 RNA"]],"k":"A","ks":["A"],"r":[["KRAS mutations are one of the most dominant mutations in colorectal carcinoma","own",""],["Vimentin is an upregulated mesenchymal marker in Epithelial-mesenchymal transition (EMT) but is not specific for adenocarcinoma of the colon","own",""],["Not specific for adenocarcinoma of the colon","own",""],["The presence of HIV-1 RNA is more likely to be associated with Kaposi sarcoma and Non-Hodgkin’s lymphomas such as Burkitt’s lymphoma and not adenocarcinoma of the colon","own",""]],"t":"N2","sub":"","ref":"LE2 feedback","f":[140]},"27a:30":{"id":"27a:30","ex":"2027 LE2","y":2027,"n":30,"p":8,"s":"A 44 year old woman was noted to have a 4.5 cm mass in the right upper quadrant of the breast. Palpable lymph nodes in the right axillary area was likewise noted. Chest X-ray showed multiple nodules in the lungs. Which of the following TNM classification best indicates the stage of her disease?","c":[["A","T1N1M0"],["B","T1N0M1"],["C","T3N0M0"],["D","T4N1M1"]],"k":"D","ks":["D"],"r":[["T1N1M0 would be a small primary with regional nodes and no distant spread. It ignores the large primary and the lung nodules.","gen",""],["T1N0M1 would be a small primary with no nodal involvement but distant metastasis. The palpable axillary nodes rule it out.","gen",""],["T3N0M0 would be a large primary with neither nodal nor distant spread.","gen",""],["Tumor is big at 4.5 cm (T4), Nodes in the axillary region (N1), Multiple nodules in the lungs (M1) \\ T SCORE Stage Definition Tis In situ, non-invasive, confined to epithelium T1 Small, minimally invasive within the primary organ site. T2 Larger, more invasive within the primary organ site T3 Larger and/or invasive beyond margins of primary organ site Very large and/or very invasive (≥ 4cm), spread to adjacent T4 organs TX* Tumor cannot be measured. N SCORE N0 No lymph involvement N1 Regional lymph node involvement N2 Extensive regional lymph node involvement N3 More distant lymph node involvement NX* Cannot be assessed M SCORE M0 No distant metastases M1 Present distant metastases MX* Metastasis cannot be measured","own",""]],"t":"N1","sub":"","bm":1,"orig":"Tumor is big at 4.5 cm (T4), Nodes in the axillary region (N1), Multiple nodules in the lungs (M1) \\ T SCORE Stage Definition Tis In situ, non-invasive, confined to epithelium | T1 Small, minimally invasive within the primary organ site. T2 Larger, more invasive within the primary organ site T3 Larger and/or invasive beyond margins of primary organ site Very large and/or very invasive (≥ 4cm), spread to adjacent T4 organs TX* Tumor cannot be measured. N SCORE N0 No lymph involvement N1 Regional lymph node involvement N2 Extensive regional lymph node involvement N3 More distant lymph node involvement NX* Cannot be assessed M SCORE M0 No distant metastases M1 Present distant metastases MX* Metastasis cannot be measured","ref":"2027 Lec Trans LE2 03 Neoplasia I","f":[19]},"27a:31":{"id":"27a:31","ex":"2027 LE2","y":2027,"n":31,"p":9,"s":"Which of the following microscopic findings, most likely indicate that the neoplasm is malignant?","c":[["A","Pleomorphism"],["B","Atypia"],["C","Invasion"],["D","Increased nuclear/cytoplasmic ratio"]],"k":"C","ks":["C"],"r":[["Pleomorphism is variation in size and shape of cells and nuclei. It is a feature of anaplasia that suggests but does not prove malignancy.","gen",""],["Atypia refers to abnormal cytologic features. It can be seen in dysplasia and is not proof of malignancy.","gen",""],["Invasion and metastases are the indication of ability to invade a characteristic of malignancy Characteristics Benign Malignant Well differentiated, Some lack of Differentiation/anaplasstructure sometimes differentiation ia typical of tissue of (anaplasia), structure origin often atypical Usually progressive and Erratic, may be slow to slow, may come to a rapid, mitotic figures Rate of growth standstill or regress, may be numerous and mitotic figures rare and abnormal normal Usually cohesive, expansile, Locally invasive, well-demarcated infiltrating surrounding Local invasion masses that do not tissue, sometimes may invade or infiltrate be misleadingly surrounding normal cohesive and expansile tissues Frequent, more likely with large Metastasis Absent undifferentiated primary tumors","own",""],["An increased nuclear to cytoplasmic ratio reflects nuclear enlargement (the nucleus is normally about one quarter of the cell). It is a cytologic clue only.","gen",""]],"t":"N1","sub":"","bm":1,"orig":"Invasion and metastases are the indication of ability to invade a characteristic of malignancy Characteristics Benign Malignant Well differentiated, Some lack of Differentiation/anaplasstructure sometimes differentiation ia typical of tissue of (anaplasia), structure origin often atypical Usually progressive and Erratic, may be slow to slow, may come to a rapid, mitotic figures Rate of growth standstill or regress, may be numerous and mitotic figures rare and abnormal normal Usually cohesive, expansile, Locally invasive, well-demarcated infiltrating surrounding Local invasion masses that do not tissue, sometimes may invade or infiltrate be misleadingly surrounding normal cohesive and expansile tissues Frequent, more likely with large Metastasis Absent undifferentiated primary tumors","ref":"Table 7.2 Comparisons Between Benign and Malignant Tumors, Robbins & Cotran Pathologic Basis of Disease (10th Ed.)","f":[17]},"27a:32":{"id":"27a:32","ex":"2027 LE2","y":2027,"n":32,"p":9,"s":"Which of the following is the best interpretation for Grade 1 Stage 1 carcinoma for the patient noted to have a polypoid mass in the rectum?","c":[["A","Unlikely to be malignant"],["B","Arising from the epithelium"],["C","May spread via lymphatics and blood stream"],["D","Well differentiated and localized"]],"k":"D","ks":["D"],"r":[["A carcinoma is by definition malignant whatever its grade or stage.","gen",""],["Arising from epithelium is what the word carcinoma means. It does not interpret the grade or the stage.","gen",""],["Potential for lymphatic and blood-borne spread is true of carcinomas in general and says nothing specific about Grade 1 Stage 1.","gen",""],["Well differentiated which means it is very similarly to the tissue of origin and is classified Grade 1. Localized is stage 1 which means it is still within the locality of the tumor and has not spread yet. Grade Definition Stage Definition Presence of abnormal cells Well-differentiated but have not spread to I Cells look very similar to 0 nearby tissues tissue of origin Carcinoma in situ Moderately differentiated II Slightly looks like the tissue of origin Cancer is present Poorly differentiated 1, 2, 3 The larger the number, the No longer looks like the larger the cancer III tissue of origin, hard to determine origin Nearly anaplastic Cancer has spread to IV 4 Indistinguishable from distant parts of the body tissue of origin Sometimes called “undifferentiated”","own",""]],"t":"N1","sub":"","flag":"Cross-year discrepancy: 2027 keys D (Well differentiated and localized). 2028 LE2 Q13 prints B for the identical item.","bm":1,"orig":"Well differentiated which means it is very similarly to the tissue of origin and is classified Grade 1. Localized is stage 1 which means it is still within the locality of the tumor and has not spread yet. Grade Definition Stage Definition Presence of abnormal cells Well-differentiated but have not spread to I Cells look very similar to 0 nearby tissues tissue of origin Carcinoma in situ Moderately differentiated II Slightly looks like the tissue of origin Cancer is present Poorly differentiated 1, 2, 3 The larger the number, the No longer looks like the larger the cancer III tissue of origin, hard to determine origin Nearly anaplastic Cancer has spread to IV 4 Indistinguishable from distant parts of the body | tissue of origin Sometimes called “undifferentiated”","ref":"2027 Lec Trans LE2 03 Neoplasia I","f":[18]},"27a:33":{"id":"27a:33","ex":"2027 LE2","y":2027,"n":33,"p":10,"s":"A man with chronic exposure as a worker in a plastic pipe factory was noted to have a liver mass, with histologic features of spindle shaped malignant cells. Which among the following substance exposure is most likely to be involved?","c":[["A","Benzene"],["B","Asbestos"],["C","Vinyl chloride"],["D","Radon"]],"k":"C","ks":["C"],"r":[["Occupational exposure to benzene can increase the risk of leukemia.","own",""],["In asbestosis, calcium and iron salts gather about long slender spicules of asbestos in the lungs, creating exotic, beaded dumbbell forms known as asbestos bodies.","own",""],["Patient presents with Hepatic angiosarcoma. Inhalation of vinyl chloride (used in synthesis of polyvinyl resins or plastic pipes) can cause angiosarcoma of the liver.","own",""],["Long term exposure to radon and radon daughters can increase risk of lung cancer","own",""]],"t":"N1","sub":"","ref":"Robbins & Cotran Pathologic Basis of Disease (10th Ed.)","f":[25]},"27a:34":{"id":"27a:34","ex":"2027 LE2","y":2027,"n":34,"p":10,"s":"Which of the following neoplasms is most likely to occur in a child born with a single functional allele of a tumor suppressor gene, who later on lost the remaining normal allele resulting in loss of inhibition of cell cycle progression?","c":[["A","Cerebral astrocytoma"],["B","Ocular retinoblastoma"],["C","Wilm’s tumor"],["D","Acute lymphocytic leukemia"]],"k":"B","ks":["B"],"r":[["Gliomas of the brain are mostly sporadic.","own",""],["Usually occur at an early age born with a single functional allele of a tumor suppressor gene, who later on lost the remaining normal allele resulting in loss of inhibition of cell cycle progression The RB gene is a classic example of a two hit mechanism for loss of tumor suppression. About 60% of these tumors are sporadic, while others are familial, and there is inheritance of a mutated copy of the RB gene. Loss of the second copy in retinoblasts leads to the occurrence of retinoblastoma in childhood.","own",""],["Most common renal cancer in children <6 years old (common in ages 3-4)","own",""],["Most common type of cancer in children.","own",""]],"t":"N2","sub":"","ref":"2027 DR. DEMAISIP LE2 RATIO; 2027 LEC TRANS LE2 NEOPLASIA","f":[27]},"27a:35":{"id":"27a:35","ex":"2027 LE2","y":2027,"n":35,"p":10,"s":"Which of the following neoplasm is most likely to be noted in a 20 cm retroperitoneal mass noted on CT scan?","c":[["A","Melanoma"],["B","Hamartoma"],["C","Liposarcoma"],["D","Lymphoma"]],"k":"C","ks":["C"],"r":[["Malignancy of the skin involving the pigmented cells of the skin, melanocytes","own",""],["Disorganized benign masses indigenous to the involved site","own",""],["Liposarcoma is usually huge retroperitoneal mass","own",""],["Tumors of lymphocytes and their precursors","own",""]],"t":"N1","sub":"","ref":"2027 Neoplasia i Lecture/trans","f":[16]},"27a:36":{"id":"27a:36","ex":"2027 LE2","y":2027,"n":36,"p":10,"s":"Which of the following neoplasms most likely describes a 0.3 cm reddish nodule on the chest of a teenager for so many years, and did not change its appearance?","c":[["A","Hemangioma"],["B","Melanoma"],["C","Carcinoma"],["D","Sarcoma"]],"k":"A","ks":["A"],"r":[["A reddish nodule present for so many years without change in morphology is an indication of a benign tumor such as hemangioma.","own",""],["Exception to the -oma suffix but are malignant","own",""],["Malignant epithelial origin suffix","own",""],["Malignant mesenchymal origin suffix","own",""]],"t":"N1","sub":"","ref":"2027 LAB TRANS LE2 02 NEOPLASIA","f":[]},"27a:37":{"id":"27a:37","ex":"2027 LE2","y":2027,"n":37,"p":10,"s":"Which of the following is the most common initial pathway for metastases in a man with a 90 pack years of smoking history who developed lung carcinoma?","c":[["A","Blood stream"],["B","Lymphatics"],["C","Contiguous spread"],["D","Bronchial spread"]],"k":"B","ks":["B"],"r":[["Hematogenous spread occurs later, often to liver, bone, brain, adrenals","bor","2028 LE2 Q16"],["Sarcomas usually metastasize via hematogenous route Malignancy that arises in the lungs of heavy smokers is usually squamous cell carcinoma. Carcinomas usually metastasize via lymphatic spread","own",""],["Occurs later by local invasion","bor","2028 LE2 Q16"],["Carcinomas leave the primary site first through lymphatics. Spread along bronchi is not the usual initial route of metastasis.","gen",""]],"t":"N1","sub":"","bm":1,"orig":"Sarcomas usually metastasize via hematogenous route | Malignancy that arises in the lungs of heavy smokers is usually squamous cell carcinoma. Carcinomas usually metastasize via lymphatic spread","ref":"ROBBINS p. 275","f":[20]},"27a:38":{"id":"27a:38","ex":"2027 LE2","y":2027,"n":38,"p":11,"s":"Which of the following is associated with a multiple tumor masses of 2-5cm with central necrosis noted in CT scan of the liver?","c":[["A","Multicentric origin"],["B","Multifocal benign lesion"],["C","High grade"],["D","Metastatic advanced stage"]],"k":"D","ks":["D"],"r":[["Multicentric origin would mean several independent primary tumors. Multiple necrotic liver masses are read as metastases instead.","gen",""],["Benign lesions do not show central necrosis from outgrowing their blood supply.","gen",""],["Grade describes differentiation under the microscope. It cannot be read from the number of masses on a scan.","gen",""],["Tumor multiplicity with central necrosis is an indication of loss of blood supply to the central portion due to overcrowding from the periphery by the fast growing neoplastic cell.","own",""]],"t":"N1","sub":"","bm":1,"orig":"Tumor multiplicity with central necrosis is an indication of loss of blood supply to the central portion due to overcrowding from the periphery by the fast growing neoplastic cell.","ref":"2027 DR. RUEDA-CU LE2 Feedback","f":[21]},"27a:39":{"id":"27a:39","ex":"2027 LE2","y":2027,"n":39,"p":11,"s":"A firm nodule on the fundal portion of the uterus is noted in a 35 yr old woman. By ultrasound, it is solid and well circumscribed. Which of the following neoplasms is she most likely to have:","c":[["A","Leiomyoma"],["B","Leiomyosarcoma"],["C","Metastatic tumor"],["D","Hemangioma"]],"k":"A","ks":["A"],"r":[["Described as sharply circumscribed , round, firm lesion that is well delimited and no infiltrating borders Leiomyoma is a benign , solid well circumscribed tumor most common in women.","own",""],["Grows within the uterus where it has a bulky and fleshy mass. Not as well circumscribed compared to its counterpart, leiomyoma.","own",""],["Type of tumor that can migrate and spread to other parts of the body","own",""],["Common benign tumors of the blood vessel","own",""]],"t":"N1","sub":"","ref":"LE2 Feedback","f":[139]},"27a:40":{"id":"27a:40","ex":"2027 LE2","y":2027,"n":40,"p":11,"s":"Which of the following neoplasm is most likely in a darkly pigmented raised nodule from dorsum of the hand and shows darkly pigmented spindle-shaped cells on histology positive for vimentin?","c":[["A","Nevus"],["B","Melanoma"],["C","Squamous Cell Carcinoma"],["D","Adenocarcinoma of adnexal skin component"]],"k":"B","ks":["B"],"r":[["A nevus is the benign melanocytic counterpart of melanoma: tan to brown, uniformly pigmented, small and well defined.","gen",""],["Nevi can either be: Melanocytic - are tan to brown, uniformly pigmented, small (usually <6 mm), relatively flat macules or elevated papules with well-defined, rounded borders Dysplastic - may appear as flat macules, slightly raised plaques with a “pebbly” surface, or target-like lesions with a darker raised center and irregular flat periphery Melanoma grossly is darkly pigmented raised nodule and shows darkly pigmented spindle shaped cells on histology positive for vimentin","own",""],["squamous cell carcinoma (p63, p40) TTF-1 and p40 negative argue against adenocarcinoma and squamous cell carcinoma. Large cell carcinoma is considered an undifferentiated tumor that lacks the cytologic feature of adenocarcinoma or squamous differentiation.","bor","2028 LE3 Q85"],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"N1","sub":"","bm":1,"orig":"Nevi can either be: Melanocytic - are tan to brown, uniformly pigmented, small (usually <6 mm), relatively flat macules or elevated papules with well-defined, rounded borders Dysplastic - may appear as flat macules, slightly raised plaques with a “pebbly” surface, or target-like lesions with a darker raised center and irregular flat periphery | Melanoma grossly is darkly pigmented raised nodule and shows darkly pigmented spindle shaped cells on histology positive for vimentin","ref":"Robbins & Cotran Pathologic Basis of Disease (10th Ed.) 2027 DR. RUEDA-CU LE2 Feedback","f":[22]},"27a:41":{"id":"27a:41","ex":"2027 LE2","y":2027,"n":41,"p":11,"s":"Which of the following neoplasms is most likely from the following clinical presentation? 27 year old woman in good health showing a 2cm soft, movable mass beneath the skin of left forearm which does not change in size over so many year with no associated pain:","c":[["A","Lipoma"],["B","Leiomyoma"],["C","Polyp"],["D","Fibroma"]],"k":"A","ks":["A"],"r":[["Lipoma being benign is soft and movable and does not change in size over so many years.","own",""],["Benign tumor of smooth muscle that arises most frequently in the uterus","own",""],["A mass projects above a mucosal surface to form a visible palpable structure. It may be considered benign or malignant.","own",""],["Submucosal nodular fibrous tissue mass that form when chronic irritation results in reactive tissue hyperplasia","own",""]],"t":"N1","sub":"","ref":"Robbins & Cotran Pathologic Basis of Disease (10th Ed.) 2027 DR. LE2 Feedback","f":[23]},"27a:42":{"id":"27a:42","ex":"2027 LE2","y":2027,"n":42,"p":12,"s":"A 41 year old, commercial sex female worker had an exophytic 3 cm mass of the ectocervix. History of 60 pack years and diabetes for 10 years. Pap smear cytologic changes are consistent with squamous cell carcinoma. Which of the following is the most likely risk factor for her cervical carcinoma?","c":[["A","Human papillomavirus"],["B","Diabetes mellitus type 11"],["C","Cigarette smoking"],["D","Pelvic inflammatory disease"]],"k":"A","ks":["A"],"r":[["Human Papillomavirus may be sexually transmitted. Long lasting persistent infection with HPV causes virtually all cervical cancers","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"N2","sub":"","bm":1,"orig":"Human Papillomavirus may be sexually transmitted. Long lasting persistent infection with HPV causes virtually all cervical cancers","ref":"2027 DR. RUEDA-CU LE2 RATIO","f":[31]},"27a:43":{"id":"27a:43","ex":"2027 LE2","y":2027,"n":43,"p":12,"s":"Molecular Analysis of the 4 cm gastric antral ulceration shows DNA hypermethylation of CDKN2 complex. Which of the following mechanisms did this abnormal gene expression most likely occur?","c":[["A","Amplification"],["B","Epigenetic alteration"],["C","Point mutation"],["D","Translocation"]],"k":"B","ks":["B"],"r":[["Gene duplication leads to massively increased gene product, cytogenetic hallmark of cancer","own",""],["Created by DNA methyltransferases, tends to silence gene expression","own",""],["Causes a single nucleotide base change, insertion, or deletion of the genetic material, DNA or RNA","own",""],["Occurs when two chromosomes switch/ exchange segments with each other, altering their functionality","own",""]],"t":"N2","sub":"","ref":"Trans #3B Neoplasia II p. 2, 3, & 24","f":[28]},"27a:44":{"id":"27a:44","ex":"2027 LE2","y":2027,"n":44,"p":12,"s":"Which parameter of neoplastic cell best predicts a diminished chemotherapy response?","c":[["A","Doubling time"],["B","Extent of apoptosis"],["C","Gene amplification"],["D","Growth fraction"]],"k":"D","ks":["D"],"r":[["Doubling time indicates how quickly neoplastic cells are dividing. A rapidly proliferating mass will have a fast doubling time but this does not give the best indication why chemotherapy effectiveness diminishes","own",""],["One way cell proliferation is promoted during carcinogenesis but this does not predict diminished response to chemotherapy","own",""],["Gene duplication leads to massively increased gene product, cytogenetic hallmark of cancer","own",""],["Growth Fraction is an index of relationship between the proliferating cell population and the total cell population. Cancer cells grow and divide much more quickly than most normal cells in the body and it is the fast growing dividing cells that are targeted by chemotherapy. Aim of chemotherapy is to slow down cancer growth.","own",""]],"t":"N2","sub":"","ref":"Trans #3B Neoplasia II p. 26","f":[26]},"27a:45":{"id":"27a:45","ex":"2027 LE2","y":2027,"n":45,"p":12,"s":"The hemorrhagic manifestations of dengue hemorrhagic fever are due to the following abnormalities. Which is the EXEMPTION?","c":[["A","Endothelial damage"],["B","Platelet dysfunction"],["C","Deposition of immune complexes"],["D","Deficient clotting factor"]],"k":"C","ks":["C"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Bleeding due to deposition of immune complexes in the blood vessel wall occurs in Henoch-Schonlein purpura. Henoch-Scholnlein purpura is a systemic immune disorder which is characterized by purpura, colicky abdominal pain, polyarthralgia and acute glomerulonephritis. The hemorrhagic manifestations of dengue hemorrhagic fever are due to a combination of thrombocytopenia or platelet dysfunction, endothelial injury, cytokine-induced disseminated intravascular coagulation and deficiency of clotting factors because of hepatic injury.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID2","sub":"","bm":1,"orig":"Bleeding due to deposition of immune complexes in the blood vessel wall occurs in Henoch-Schonlein purpura. Henoch-Scholnlein purpura is a systemic immune disorder which is characterized by purpura, colicky abdominal pain, polyarthralgia and acute glomerulonephritis. The hemorrhagic manifestations of dengue hemorrhagic fever are due to a combination of thrombocytopenia or platelet dysfunction, endothelial injury, cytokine-induced disseminated intravascular coagulation and deficiency of clotting factors because of hepatic injury.","ref":"Robbins and Cotran Pathologic Basis of Disease p. 352","f":[]},"27a:46":{"id":"27a:46","ex":"2027 LE2","y":2027,"n":46,"p":12,"s":"What is the histological characteristic of a tissue response from syphilitic gummas?","c":[["A","Suppurative inflammation"],["B","Granulomatous inflammation"],["C","Purulent inflammation"],["D","Cytopathic-cyto proliferative reaction"]],"k":"B","ks":["B"],"r":[["This pattern is the reaction to acute tissue damage, characterized by increased vascular permeability and leukocytic infiltration, predominantly of neutrophils. The neutrophils are attracted to the site of infection by release of chemoattractants from the \"pyogenic\" bacteria that evoke this response, mostly extracellular Gram-positive cocci and Gram-negative rods.","bor","2025 LE2 Q79"],["The major histologic pattern of tissue reaction seen in syphilitic gummas is granulomatous inflammation. A syphilitic gumma appears as gray-white to rubbery, occur singly or in multiples, vary in size from microscopic lesions resembling tubercles to large tumor-like masses. On histologic examination, it has a center of coagulated , necrotic material. Its margins are composed of plump, palisading macrophages and fibroblasts surrounded by large numbers of mononuclear leukocytes, predominantly plasma cells. Suppurative inflammation is also known as purulent inflammation. This type of tissue reaction is evoked by “pyogenic” bacteria, mostly extracellular gram-positive cocci and gram-negative bacilli. Cytopathic-cytoproliferative reaction is a tissue reaction which is usually produced by viruses.","own",""],["Marked by presence of pus, or exudate consisting of neutrophils, necrotic debris, and edema fluid ○ cloudy appearance due to neutrophils and necrotic debris","bor","2026 LE2 Q3"],["Usually produced by viruses, characterized by either cell necrosis or cellular proliferation usually with sparse inflammatory cells. There is presence of inclusion bodies, multinucleated cells, epithelial cell detachment and proliferation, as well as possible development of malignant neoplasms.","bor","2028 LE2 Q57"]],"t":"ID4","sub":"","bm":1,"orig":"The major histologic pattern of tissue reaction seen in syphilitic gummas is granulomatous inflammation. A syphilitic gumma appears as gray-white to rubbery, occur singly or in multiples, vary in size from microscopic lesions resembling tubercles to large tumor-like masses. On histologic examination, it has a center of coagulated , necrotic material. Its margins are composed of plump, palisading macrophages | and fibroblasts surrounded by large numbers of mononuclear leukocytes, predominantly plasma cells. Suppurative inflammation is also known as purulent inflammation. This type of tissue reaction is evoked by “pyogenic” bacteria, mostly extracellular gram-positive cocci and gram-negative bacilli. Cytopathic-cytoproliferative reaction is a tissue reaction which is usually produced by viruses.","ref":"Robbins and Cotran Pathologic Basis of Disease p. 378; pp. 347-348","f":[52]},"27a:47":{"id":"27a:47","ex":"2027 LE2","y":2027,"n":47,"p":13,"s":"A dental hygienist presented with a painful blister on the skin near the fingernail of one finger of a few days duration. Microscopic examination of the fluid from the blister showed cells with a large pink intranuclear inclusion. What is the most likely diagnosis of this patient?","c":[["A","Paronychia"],["B","Felon"],["C","Herpetic whitlow"],["D","Onychomycosis"]],"k":"C","ks":["C"],"r":[["Paronychia refers to infection of the nail bed. Both infections are usually caused by Staphylococcus aureus. They may follow trauma or embedded splinters. If the infection is deep enough, it may destroy the bone of the terminal phalanx or detach the finger nail.","own",""],["Felon refers to infection of the palmar side of the fingertips. Usually caused by S. aureus along with paronychia","own",""],["Swollen, painful, erythematous HSV lesions of the finger or palm (herpetic whitlow) occur in infants or health care workers as a result of occupational exposure. HSV-infected cells contain large pink to purple, intranuclear inclusions.","own",""],["Onychomycosis refers to fungal infection of the finger nail.","own",""]],"t":"ID2","sub":"","ref":"Robbins and Cotran Pathologic Basis of Disease p. 360","f":[38]},"27a:48":{"id":"27a:48","ex":"2027 LE2","y":2027,"n":48,"p":13,"s":"A 7 y/o child was brought by his mother to a pediatrician because of a rash of several days duration. Prior to the appearance of the rash, the child had intermittent fever, red watery eyes, a runny nose and cough. After a few days, flat red spots appeared initially on the face which then spread downward to the trunk and the extremities. Microscopic examination of the sputum showed multinucleated giant cells with eosinophilic nuclear and cytoplasmic inclusions. In which of the following organs will these histologic findings also be seen?","c":[["A","Parotid gland"],["B","Lymph node"],["C","Liver"],["D","Spleen"]],"k":"B","ks":["B"],"r":[["The parotid gland is the target of mumps virus, which infects ductal epithelium of salivary glands.","gen",""],["Measles is an acute viral infection that affects multiple organs. Patients usually present with a blotchy, reddish brown rash on the face, trunk and extremities. Warthin-Finkeldey cells are multinucleated giant cells with eosinophilic nuclear and cytoplasmic inclusions. These cells are found in the lymph nodes, lungs and the sputum of patients with measles infection.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID2","sub":"","bm":1,"orig":"Measles is an acute viral infection that affects multiple organs. Patients usually present with a blotchy, reddish brown rash on the face, trunk and extremities. Warthin-Finkeldey cells are multinucleated giant cells with eosinophilic nuclear and cytoplasmic inclusions. These cells are found in the lymph nodes, lungs and the sputum of patients with measles infection.","ref":"Robbins and Cotran Pathologic Basis of Disease p. 350","f":[37]},"27a:49":{"id":"27a:49","ex":"2027 LE2","y":2027,"n":49,"p":13,"s":"Postmortem examination of a stillborn full term baby was done. Maternal history revealed that the 25 y/o mother had no prenatal check up and no history of immunization since birth. Physical examination revealed that the baby is small for gestational age and is microcephalic. Microscopic examination of the brain showed the presence of neurons which are markedly enlarged with a large, basophilic intranuclear inclusion surrounded by a clear halo and foci of calcification. Identify the most probable causative agent of this disease.","c":[["A","Epstein-Barr virus"],["B","Cytomegalovirus"],["C","Herpes simplex virus type 1"],["D","Herpes simplex virus type 2"]],"k":"B","ks":["B"],"r":[["A. Epstein-Barr virus ● X-linked lymphoproliferative syndrome: characterized by an inability to eliminate Epstein-Barr Virus (EBV) leading to: ○ Fulminant infectious mononucleosis ○ Development of B-cell tumors ● MOT: close human contact (via saliva when kissing) → virus binds to complement receptor 2 protein on surface of B lymphocytes","bor","2025 LE2 Q23"],["Infection acquired in utero may take many forms. When the virus is acquired from a mother with primary infection (who does not have protective antibodies), classic cytomegalic inclusion disease develops. It resembles erythroblastosis fetalis. Affected infants may suffer intrauterine growth restriction and present with jaundice, hepatosplenomegaly, anemia, bleeding due to thrombocytopenia and encephalitis. In fatal cases the brain is often smaller than normal and may show foci of calcification. Cells infected by CMV are strikingly enlarged and show cellular and nuclear pleomorphism. Prominent intranuclear basophilic inclusions spanning one-half of the nuclear diameter usually set off from the nuclear membrane by a clear halo.","own",""],["HSV infected cells contain large pink to purple glassy intranuclear (Cowdry type A) inclusions. They are not enlarged with a haloed basophilic inclusion, which is the CMV picture.","gen",""],["HSV infected cells contain large pink to purple glassy intranuclear (Cowdry type A) inclusions. They are not enlarged with a haloed basophilic inclusion, which is the CMV picture.","gen",""]],"t":"ID2","sub":"","bm":1,"orig":"Infection acquired in utero may take many forms. When the virus is acquired from a mother with primary infection (who does not have protective antibodies), classic cytomegalic inclusion disease develops. It resembles erythroblastosis fetalis. Affected infants may suffer intrauterine growth restriction and present with jaundice, hepatosplenomegaly, anemia, bleeding due to thrombocytopenia and encephalitis. In fatal cases the brain is often smaller than normal and may show foci of calcification. Cells infected by CMV are strikingly enlarged and show cellular and nuclear pleomorphism. Prominent intranuclear basophilic inclusions spanning one-half of the nuclear diameter usually set off from the nuclear membrane by a clear halo.","ref":"Robbins and Cotran Pathologic Basis of Disease p. 356","f":[39]},"27a:50":{"id":"27a:50","ex":"2027 LE2","y":2027,"n":50,"p":13,"s":"Hepatitis B is associated with which of the following neoplasms?","c":[["A","Hepatocellular adenoma"],["B","Hepatoblastoma"],["C","Hepatocellular carcinoma"],["D","Cholangiocarcinoma"]],"k":"C","ks":["C"],"r":[["Hepatocellular adenoma is a benign neoplasm that typically occurs in young women and is strongly associated with use of oral contraceptives and anabolic steroids","own",""],["Hepatoblastoma is a rare malignant tumor of the liver. It is the most common liver tumor of early childhood","own",""],["Hepatitis B virus (HBV) is linked to hepatocellular carcinoma due to its oncogenic effects, including chronic inflammation, hepatocyte proliferation, and activation of carcinogenic pathways via HBx protein. It accounts for 70–85% of hepatocellular carcinomas worldwide. Other options involve different pathologies, such as benign tumors or cancers unrelated to HBV.","own",""],["Cholangiocarcinoma is a malignant tumor arising from the bile ducts","own",""]],"t":"ID2","sub":"","ref":"Robbins p.357; p.326-327","f":[31]},"27a:51":{"id":"27a:51","ex":"2027 LE2","y":2027,"n":51,"p":14,"s":"A 5 y/o child was brought to the OPD by her mother because of fever and multiple vesicles on her trunk of several days duration. The vesicles contain cloudy and dark yellow fluid. A biopsy of the lesion showed detachment of the keratinocytes from each other at the level of the stratum granulosum. What is the most likely diagnosis of this patient?","c":[["A","Measles"],["B","Chickenpox"],["C","Bullous impetigo"],["D","Staphylococcal scalded skin syndrome"]],"k":"C","ks":["C"],"r":[["Measles gives a blotchy rash spreading from the face downward and the pathognomonic Warthin-Finkeldey multinucleated giant cells in lymphoid tissue, lung and sputum.","gen",""],["Chickenpox (varicella) rash starts on the trunk and spreads to head and limbs. The vesicle is intraepithelial with intranuclear inclusions in cells at its base.","gen",""],["The exfoliative A and B toxins produced by S. aureus are serine proteases that cleave the desmosomal protein desmoglein , which holds epidermal cells tightly together. This causes keratinocytes to detach from one another and from the underlying basement membrane, resulting in loss of barrier function that often leads to secondary skin infections. Exfoliation may occur locally at the site of infection(bullous impetigo) or may result in widespread loss of the superficial epidermis (staphylococcal scalded skin syndrome). The desquamation of the epidermis occurs at the level of the granulosa layer.","own",""],["Staphylococcal scalded skin syndrome is the widespread form of exfoliative toxin disease, with sheets of superficial epidermis lost at the granular layer. Localized blistering is bullous impetigo.","gen",""]],"t":"ID3","sub":"","bm":1,"orig":"The exfoliative A and B toxins produced by S. aureus are serine proteases that cleave the desmosomal protein desmoglein , which holds epidermal cells tightly together. This causes keratinocytes to detach from one another and from the underlying basement membrane, resulting in loss of barrier function that often leads to secondary skin infections. Exfoliation may occur locally at the site of infection(bullous impetigo) or may result in widespread loss of the superficial epidermis (staphylococcal scalded skin syndrome). The desquamation of the epidermis occurs at the level of the granulosa layer.","ref":"Robbins p. 360","f":[43]},"27a:52":{"id":"27a:52","ex":"2027 LE2","y":2027,"n":52,"p":14,"s":"A middle-aged alcoholic homeless male presented with tender, well-demarcated erythematous swelling of both cheeks of a few days duration. 3 days before the appearance of the cutaneous swelling, he had fever and generalized weakness. If a biopsy were done on the cheek, which of the following microscopic findings would most likely be seen?","c":[["A","Neutrophilic infiltration and marked tissue destruction"],["B","Neutrophilic infiltration and minimal tissue destruction"],["C","An intraepithelial vesicle with the epithelial cells at the base of the vesicles exhibiting intranuclear inclusions"],["D","An intraepithelial vesicle containing multinucleated giant cells with large, glassy, pink intranuclear inclusions"]],"k":"B","ks":["B"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Erysipelas is caused by exotoxins from superficial infection with Streptococcus pyogenes. It is characterized by a rapidly spreading erythematous cutaneous swelling that may begin on the face or less frequently on the body or an extremity. The rash has a sharp, well-demarcated serpiginous border. On histologic examination, there is a diffuse, edematous neutrophilic inflammatory reaction in the dermis and epidermis extending into the subcutaneous tissues. Microabscesses may form. Tissue necrosis is usually minor.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID3","sub":"","bm":1,"orig":"Erysipelas is caused by exotoxins from superficial infection with Streptococcus pyogenes. It is characterized by a rapidly spreading erythematous cutaneous swelling that may begin on the face or less frequently on the body or an extremity. The rash has a sharp, well-demarcated serpiginous border. On histologic examination, there is a diffuse, edematous neutrophilic inflammatory reaction in the dermis and epidermis extending into the subcutaneous tissues. Microabscesses may form. Tissue necrosis is usually minor.","ref":"Robbins p. 361","f":[41]},"27a:53":{"id":"27a:53","ex":"2027 LE2","y":2027,"n":53,"p":14,"s":"Identify the initial site of treponemal invasion in syphilis.","c":[["A","Soft chancre"],["B","Hard chancre"],["C","Chancroid"],["D","Chagoma"]],"k":"B","ks":["B"],"r":[["”The term “soft chancre” is used to describe the chancre ulcer. The border of the chancroid ulcer is not indurated.","own",""],["Primary syphilis features a single, firm, nontender, raised red lesion (chancre) at the site of treponemal invasion in the penis, cervix, vaginal wall or anus. The chancre of syphilis has a firm indurated border. This is the reason why it is also referred to as a “hard chancre.","own",""],["STD caused by Haemophilus ducreyi","own",""],["Swelling caused by Trypanosoma cruzi","own",""]],"t":"ID4","sub":"","ref":"Robbins pp. 376-377; p. 367","f":[50]},"27a:54":{"id":"27a:54","ex":"2027 LE2","y":2027,"n":54,"p":14,"s":"A 40 y/o male previously diagnosed with AIDS presented with fever occurring at night, cough, drenching night sweats and weight loss of several months duration. PE revealed a palpable cervical lymph node. AFB stain of his sputum showed acid-fast bacilli. If a lymph node biopsy were done on this patient, which of the following microscopic findings would most likely be seen?","c":[["A","Necrotizing granulomas"],["B","Non-necrotizing granulomas"],["C","Tissue destruction"],["D","Acid-fast bacilli within macrophages"]],"k":"D","ks":["D"],"r":[["Necrotizing (caseating) granulomas are the hallmark of tuberculosis in a host with intact T cell immunity.","gen",""],["Necrotizing (caseating) granulomas are the hallmark of tuberculosis in a host with intact T cell immunity.","gen",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Immunocompromised people do not form the characteristic “granulomas.” Instead, macrophages with large numbers of acid-fast bacilli are seen using the acid-fast stain.","own",""]],"t":"ID3","sub":"","bm":1,"orig":"Immunocompromised people do not form the characteristic “granulomas.” Instead, macrophages with large numbers of acid-fast bacilli are seen using the acid-fast stain.","ref":"Robbins p. 372","f":[48]},"27a:55":{"id":"27a:55","ex":"2027 LE2","y":2027,"n":55,"p":15,"s":"An autopsy was done on an elderly female who was admitted due to cough and marked weight loss of six months duration. During her hospital confinement, an AFB stain on her sputum showed numerous acid fast bacilli. Gross examination of the lungs showed multiple punctate, white to yellow foci spread all over the lung parenchyma. Microscopic examination of the foci showed necrotizing granulomas with multinucleated giant cells. Which of the following statements regarding the form of this disease is true?","c":[["A","Results from the extension of infection to adjacent lung"],["B","Occurs through iatrogenic spread such as contaminated surgical instruments"],["C","Occurs when the organisms drained through the lymphatics enter the venous blood and circulate back to the lungs"],["D","Occurs when the organisms disseminate through the systemic arterial system"]],"k":"C","ks":["C"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["C. difficile The clinical, gross and microscopic findings of this case are consistent with miliary pulmonary tuberculosis. It occurs when the organisms draining through the lymphatics enter the venous blood and circulate back to the lungs.","own",""],["Dissemination through the systemic arterial system produces systemic miliary tuberculosis, seeding liver, marrow, spleen, adrenals, meninges and kidneys.","gen",""]],"t":"ID3","sub":"","bm":1,"orig":"C. difficile | The clinical, gross and microscopic findings of this case are consistent with miliary pulmonary tuberculosis. It occurs when the organisms draining through the lymphatics enter the venous blood and circulate back to the lungs.","ref":"LE2 Feedback","f":[47]},"27a:56":{"id":"27a:56","ex":"2027 LE2","y":2027,"n":56,"p":15,"s":"If a tissue biopsy from a patient with lepromatous leprosy was done, what are the histological findings with a weak TH1 response?","c":[["A","Marked lymphocytic infiltration"],["B","Formation of non-necrotizing granuloma"],["C","Abundant acid-fast bacilli"],["D","Scant acid-fast bacilli"]],"k":"C","ks":["C"],"r":[["Autoimmune disorders/malignant lymphomas","own",""],["Usually do not have a central region of necrosis (sarcoidosis/foreign material)","own",""],["Lepromatous leprosy is also known as multibacillary leprosy. Lepromatous lesions contain large aggregates of lipid-laden macrophages of acid-fast bacilli. This indicates a weak TH1 response.","own",""],["Criteria for 1-9 AFB per 100 oil immersion fields in AFB microscopy","own",""]],"t":"ID3","sub":"","ref":"Robbins p. 374","f":[45]},"27a:57":{"id":"27a:57","ex":"2027 LE2","y":2027,"n":57,"p":15,"s":"All of th dules or plaques on the lower extremities","own",""]],"t":"ID4","sub":"","ref":"Robbins p. 378","f":[53]},"27a:59":{"id":"27a:59","ex":"2027 LE2","y":2027,"n":59,"p":16,"s":"Which of the following fungi can undergo phenotypic switching to evade host defenses?","c":[["A","Aspergillus spp."],["B","Cryptococcus spp."],["C","Mucor spp."],["D","None of the above"]],"k":"B","ks":["B"],"r":[["Aspergillus spp. are airborne, ubiquitous mold and can be isolated from vegetation (nuts, grains, decaying matter, soil, air)","bor","2025 LE2 Q88"],["Candida spp. and Cryptococcus spp. are the opportunistic fungal species who have the special ability to undergo phenotypic switching. They do this to adapt to different host environments and evade the host immune system.","own",""],["Mucor spp. are transmitted by airborne asexual spores, percutaneous exposure or ingestion.","bor","2025 LE2 Q88"],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID6","sub":"","bm":1,"orig":"Candida spp. and Cryptococcus spp. are the opportunistic fungal species who have the special ability to undergo phenotypic switching. They do this to adapt to different host environments and evade the host immune system.","ref":"Feedback","f":[55]},"27a:60":{"id":"27a:60","ex":"2027 LE2","y":2027,"n":60,"p":16,"s":"In which mode of transmission can neurocysticercosis develop?","c":[["A","Ingestion of infected undercooked beef"],["B","Ingestion of water or food contaminated with Taenia ova"],["C","Through larval skin penetration"],["D","Both A and B are correct."]],"k":"B","ks":["B"],"r":[["Eating undercooked meat containing cysticerci completes the tapeworm life cycle and gives an intestinal adult worm. It does not cause cysticercosis, which needs ingestion of ova.","gen",""],["Taenia saginata Cysticercosis, a disease caused by Taenia solium (Pork tapeworm) is transmitted by ingestion of water or food contaminated with Taenia ova. Hookworm filariform larvae","own",""],["Transmission through ingestion","bor","2026 LE2 Q35"],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID7","sub":"","bm":1,"orig":"Taenia saginata | Cysticercosis, a disease caused by Taenia solium (Pork tapeworm) is transmitted by ingestion of water or food contaminated with Taenia ova. | Hookworm filariform larvae","ref":"SUSHI LE3 #45","f":[58]},"27a:61":{"id":"27a:61","ex":"2027 LE2","y":2027,"n":61,"p":16,"s":"A 68-year-old Pakistani businessman presented with weight loss, hepatomegaly, swollen lymph nodes and fever. CBC done revealed pancytopenia. During confinement, he developed secondary pneumonia. Bone marrow exam revealed enlarged macrophages filled with parasitic amastigotes. This is a case of:","c":[["A","Cutaneous leishmaniasis"],["B","Diffuse cutaneous leishmaniasis"],["C","Mucocutaneous leishmaniasis"],["D","Visceral leishmaniasis"]],"k":"D","ks":["D"],"r":[["Chronic ulcerative skin lesions","own",""],["Multiple, atypical, widespread, infiltrated skin lesions","own",""],["Complication caused by cutaneous leishmaniasis which affects the mucous membranes like the nose, mouth, and throat","own",""],["Visceral leishmaniasis, also known as Kala-azar, is a severe form of leishmaniasis that affects internal organs like the spleen, liver and bone marrow. Patients who develop hyperpigmentation are usually of South Asian (like Pakistan) ancestry and they can present with fever, weight loss, hepatosplenomegaly, anemia and pancytopenia.","own",""]],"t":"ID7","sub":"","ref":"2027 PATHO LE2 Feedback","f":[59]},"27a:62":{"id":"27a:62","ex":"2027 LE2","y":2027,"n":62,"p":16,"s":"Which of the following protozoan infections can cause high levels of parasitemia, fever, and hemolytic anemia?","c":[["A","P. vivax malaria"],["B","P. ovale malaria"],["C","Babesiosis"],["D","Leishmaniasis"]],"k":"C","ks":["C"],"r":[["P. vivax, P. ovale, and P. malariae cause low levels of parasitemia, mild anemia, splenic rupture, and nephrotic syndrome.","own",""],["P. vivax, P. ovale, and P. malariae cause low levels of parasitemia, mild anemia, splenic rupture, and nephrotic syndrome.","own",""],["Babesia parasitize red cells and cause fever and hemolytic anemia. The Maltese cross or tetrad formations seen in RBSc can be indicative of high parasitemia. The same symptoms/presentations can also be observed in P.falciparum malaria, which is not given in the choices.","own",""],["Causes severe systemic infection (e.g. secondary bacterial infections, hemorrhages), weight loss, hepatomegaly, and splenomegaly.","own",""]],"t":"ID7","sub":"","ref":"2027 PATHO LE2 Feedback/2025 Patho Trans-2.09","f":[60]},"27a:63":{"id":"27a:63","ex":"2027 LE2","y":2027,"n":63,"p":16,"s":"The blood of a patient shows rupture of the red cells at higher concentrations while doing the osmotic fragility test. What is the condition of this patient have?","c":[["A","Autoimmune hemolytic anemia"],["B","G6PD"],["C","Spherocytosis"],["D","Sickle cell Anemia"]],"k":"C","ks":["C"],"r":[["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Project-source note: No PTH LEC lecture in the project covers this subject, and the uploaded feedback gives no rationale for this option.","none",""],["Usually diagnosed by Coombs’ Antiglobulin test, it is NOT affected by Osmotic Fragility test. (+) Heinz Bodies and Bite cells on PBS, it is NOT affected by Osmotic Fragility test. Congenital defect of the surface proteins (spectrin, actin, ankyrin) in red cells which normally maintain the biconcave shape of RBC which is usually diagnosed by Osmotic fragility test. SCA will hemolyse at lower concentration because the shape of the sickle cells will need more water duri
