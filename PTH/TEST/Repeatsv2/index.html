ore staging to find tumor","own",""],["Describes what staging is Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Why staging is done Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"N1","sub":"","ref":"2028 [PTH LEC - LE 2] 1A - Neoplasia 1","f":[]},"28a:35":{"id":"28a:35","ex":"2028 LE2","y":2028,"n":35,"p":9,"s":"Patients with chronic granulomatous disease are more susceptible to infections because of:","c":[["A","C2 deficiency"],["B","Defects in TLR signaling"],["C","Defects in microbicidal activity"],["D","Mutation in fucosyl transferase"]],"k":"C","ks":["C"],"r":[["C2 deficiency is a complement deficiency, the most common one, and is associated with SLE rather than with defective bacterial killing.","gen",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Seen in Systemic Lupus Erythematosus (SLE): resulting from inherent deficiencies in complement proteins such as C1q, C2, or C4. C2 deficiency is also the most common complement protein deficiency. Chronic Granulomatous Disease results from a defect in the bacterial killing process due to defective genes encoding phagocyte oxidase - an enzyme that generates superoxide","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","bm":1,"orig":"Seen in Systemic Lupus Erythematosus (SLE): resulting from inherent deficiencies in complement proteins such as C1q, C2, or C4. C2 deficiency is also the most common complement protein deficiency. | Chronic Granulomatous Disease results from a defect in the bacterial killing process due to defective genes encoding phagocyte oxidase - an enzyme that generates superoxide","ref":"2027 SB Ratio","f":[9]},"28a:36":{"id":"28a:36","ex":"2028 LE2","y":2028,"n":36,"p":9,"s":"How does adaptive immunity work?","c":[["A","A student who has specific immune response for any pathogen he was exposed to"],["B","A newborn who develops a specific immune response within minutes of exposure to a pathogen"],["C","A teenager who does not have specific immunity, but develops a temporary immune response that is then forgotten"],["D","A teacher who does not have specific immunity, but develops a specific immune response to the pathogen that is readily recalled after infection by the same pathogen"]],"k":"D","ks":["D"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Adaptive immunity is the part of the immune system that develops specific defenses against pathogens after exposure. It takes time to form but has memory, meaning it can recognize and respond more rapidly upon re-exposure to the same pathogen.","own",""]],"t":"I1","sub":"","bm":1,"orig":"Adaptive immunity is the part of the immune system that develops specific defenses against pathogens after exposure. It takes time to form but has memory, meaning it can recognize and respond more rapidly upon re-exposure to the same pathogen.","f":[]},"28a:37":{"id":"28a:37","ex":"2028 LE2","y":2028,"n":37,"p":9,"s":"Which of the following receptors are present in both plasma membrane and endosomal membrane?","c":[["A","Toll-like receptors (TLRs)"],["B","Nod-like receptors (NLR)"],["C","Rig-like receptors (RLR)"],["D","C-type Lectin Receptors (CLR)"]],"k":"A","ks":["A"],"r":[["Present in both plasma membrane and endosomal vesicles","own",""],["Cytosolic receptors that recognize products released from damaged cells","own",""],["Located in the cytosol of most cell types","own",""],["Expressed on plasma membrane of macrophages and dendritic cells","own",""]],"t":"I1","sub":"","ref":"03: Diseases of Immunity I","f":[]},"28a:38":{"id":"28a:38","ex":"2028 LE2","y":2028,"n":38,"p":9,"s":"Which is the CORRECT statement about regulatory T cells?","c":[["A","AIRE is essential for the development"],["B","IL-5 is required for development and maintenance"],["C","They decrease autoimmune response"],["D","They express high levels of CD23"]],"k":"C","ks":["C"],"r":[["AIRE (autoimmune regulator) stimulates expression of some peripheral tissue–restricted self antigens in the thymus and is thus critical for deletion of immature T cells specific for these antigens.","own",""],["Both IL-2 and FOXP3 are required for the development and maintenance of functional CD4+ regulatory T cells.","own",""],["May suppress immune responses by their inhibitory activity through the secretion of cytokines such as IL-10 and TGF-β","own",""],["The best-defined regulatory T cells are CD4+ cells that express high levels of CD25, the α chain of the IL-2 receptor, and FOXP3, a transcription factor of the forkhead family.","own",""]],"t":"I2","sub":"","ref":"Robbins Basic Pathology, 10th edition","f":[]},"28a:39":{"id":"28a:39","ex":"2028 LE2","y":2028,"n":39,"p":10,"s":"Which statement best describes the role of MHC alleles in disease susceptibility?","c":[["A","Present antigen for recognition of T cells"],["B","Determines allergies in a person"],["C","Acts as barrier in organ transplantation"],["D","All of the above"]],"k":"A","ks":["A"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Characteristic clinical feature of restrictive CMP - due to a restrictive ventricular filling and pressure overload","bor","2027 LE3 Q79"]],"t":"I1","sub":"","bm":1,"ref":"[PTH LEC - LE 2] 3 - Diseases of Immunity I (V1)","f":[]},"28a:40":{"id":"28a:40","ex":"2028 LE2","y":2028,"n":40,"p":10,"s":"What is the reason why patients with chronic granulomatous disease are more susceptible to infections?","c":[["A","C2 deficiency"],["B","Defects in TLR signaling"],["C","Defects in microbicidal activity"],["D","Mutation in fucosyl transferase"]],"k":"C","ks":["C"],"r":[["C2 deficiency is a complement deficiency, the most common one, and is associated with SLE rather than with defective bacterial killing.","gen",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Chronic granulomatous disease (Bridges-Good syndrome) ● The defect is in the bacterial killing process because of inherited defects in the genes and coding components of phagocyte oxidase, the enzyme that generates superoxide. ● The name of this disease came from the macrophage-rich chronic inflammatory reaction that tries to control the infection when the initial neutrophil defense is inadequate. This often leads to the formation of granulomas.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","bm":1,"orig":"Chronic granulomatous disease (Bridges-Good syndrome) ● The defect is in the bacterial killing process because of inherited defects in the genes and coding components of phagocyte oxidase, the enzyme that generates superoxide. ● The name of this disease came from the macrophage-rich chronic inflammatory reaction that tries to control the infection when the initial neutrophil defense is inadequate. This often leads to the formation of granulomas.","ref":"[PTH LEC - LE 2] 2B - Diseases of Immunity 2 (V2)","f":[9]},"28a:41":{"id":"28a:41","ex":"2028 LE2","y":2028,"n":41,"p":10,"s":"Which type of hypersensitivity cannot be transferred through serum antibody?","c":[["A","Hypersensitivity"],["B","Antibody mediated"],["C","Immune complex mediated"],["D","T cell mediated"]],"k":"D","ks":["D"],"r":[["Involves IgE antibody which causes immediate release of vasoactive amines and other mediators from mast cells, and later, recruitment of inflammatory cells.","own",""],["Involves IgG and IgM which binds to antigen on target cell or tissue, causing phagocytosis or lysis of target cell by activated complement or Fc receptors.","own",""],["Involves IgG and IgM antibodies which bind antigens, usually in the circulation, and the antigen-antibody complexes deposit in tissues and induce inflammation.","own",""],["It does NOT involve antibodies. Instead, it involves T lymphocytes that induce release of cytokines, inflammation, and macrophage activation, as well as T cell-mediated cytotoxicity.","own",""]],"t":"I1","sub":"","ref":"Robbins Basic Pathology, 10th edition","f":[1]},"28a:42":{"id":"28a:42","ex":"2028 LE2","y":2028,"n":42,"p":10,"s":"Which of the following most likely activates Toll Like Receptors?","c":[["A","Hepatitis B antigen, protein at the surface of Hepatitis B Virus"],["B","Lipoteichoic acid of Gram Positive Bacteria"],["C","M1 molecules of all the nucleated body cells"],["D","L-selectin in leukocytes"]],"k":"B","ks":["B"],"r":[["Recognized by adaptive immune receptors (antibodies, T-cell receptors), not by TLRs.","own",""],["Explicitly listed as a PAMP recognized by TLR2, a classic activator of innate immune response.","own",""],["Self molecules do not trigger TLRs, but interact with CD8+ T cells.","own",""],["A cell adhesion molecule involved in leukocyte migration, not pathogen recognition.","own",""]],"t":"I1","sub":"","ref":"Robbins Basic Pathology, 10th edition","f":[]},"28a:43":{"id":"28a:43","ex":"2028 LE2","y":2028,"n":43,"p":11,"s":"Humoral immunity is a type of adaptive immunity that results in the circulation of which of the following throughout the blood:","c":[["A","Antigen"],["B","Interleukin"],["C","Complement protein"],["D","Antibody"]],"k":"D","ks":["D"],"r":[["Substance that can cause an immune response","own",""],["Interleukin-1 - Mediator of inflammation that recruits leukocytes and induces fever.","bor","2025 LE2 Q12"],["Leads to the formation of MAC","own",""],["Humoral immunity is mediated by B lymphocytes which secrete products called antibodies or immunoglobulin","own",""]],"t":"I1","sub":"","ref":"2028 [PTH LEC - LE 2] Trans 2A - Diseases of Immunity I","f":[]},"28a:44":{"id":"28a:44","ex":"2028 LE2","y":2028,"n":44,"p":11,"s":"Recognition of self vs. non-self by the adaptive immune system in humans is accomplished in which of the following ways?","c":[["A","Exposure of B cells to the body’s own antigens in the thymus"],["B","Exposure of B cells to the body’s own antigens in the bursa of Fabricius"],["C","Exposure of T cells to the body’s own antigens in the bursa of Fabricius"],["D","Exposure of T cells to the body’s own antigens in the thymus"]],"k":"D","ks":["D"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Central tolerance is an efficient way of detecting cells capable of reacting to self-antigens It begins with antigen presentation of self-antigens to naive T cells in the thymus","own",""]],"t":"I2","sub":"","bm":1,"orig":"Central tolerance is an efficient way of detecting cells capable of reacting to self-antigens It begins with antigen presentation of self-antigens to naive T cells in the thymus","ref":"2028 [PTH LEC - LE 2] Trans 2B - Diseases of Immunity II","f":[]},"28a:45":{"id":"28a:45","ex":"2028 LE2","y":2028,"n":45,"p":11,"s":"What is often used to refer to Type IV hypersensitivity?","c":[["A","Immediate"],["B","Delayed"],["C","Anaphylactic"],["D","Anergic"]],"k":"B","ks":["B"],"r":[["Immediate hypersensitivity is Type I: antigen binds IgE on mast cells and triggers a rapid reaction (allergy).","gen",""],["Delayed hypersensitivity is Type IV, mediated by T cells rather than antibody. CD4+ cells release cytokines and CD8+ cells kill directly, and the reaction takes 24 to 48 hours to develop.","gen",""],["Anaphylactic describes the systemic form of Type I, IgE and mast cell mediated hypersensitivity.","gen",""],["Anergy is T cell unresponsiveness that results when antigen is recognised (signal 1) without costimulation (signal 2). It is a tolerance mechanism, not a hypersensitivity type.","gen",""]],"t":"I1","sub":"","bm":1,"ref":"PTH - LEC Trans 04 - Disease of Immunity I","f":[0]},"28a:46":{"id":"28a:46","ex":"2028 LE2","y":2028,"n":46,"p":11,"s":"Which of the following major effector molecules is included in Type IV hypersensitivity reaction?","c":[["A","Antibodies"],["B","Complement components"],["C","Cytokines"],["D","Prostaglandin"]],"k":"C","ks":["C"],"r":[["Antibodies are the effectors of Types I to III hypersensitivity. Type IV does not depend on them.","gen",""],["Complement is recruited in Type II and Type III reactions after antibody binds. It is not the major effector of T cell mediated Type IV reactions.","gen",""],["Antibody-mediated hypersensitivity reaction is Type II ● Type II: Production of IgG, IgM → binds to antigen on target cell or tissue → phagocytosis or lysis of target cell by activated complement or Fc receptors, recruitment of leukocytes Complement activation occurs in Type II (Antibody-mediated) and Type III (Immune complex-mediated) hypersensitivity reactions ● Type II: Production of IgG, IgM → binds to antigen on target cell or tissue → phagocytosis or lysis of target cell by activated complement or Fc receptors, recruitment of leukocytes ● Type III: Deposition of antigen-antibody complexes →complement activation→recruitment of leukocytes by complement products and Fc receptors → release of enzymes and other toxic molecules Delayed hypersensitivity (Type IV) reaction is T-cell mediated, primarily driven by cytokines released by CD4+ T-cells. ● Type IV: Activated T lymphocytes → (1) release of cytokines, inflammation and macrophage activation, (2) T cell-mediated cytotoxicity Modulates inflammation, but not a major effector of Type IV hypersensitivity reaction Immunity I","own",""],["Stimulates pain sensitive nerve endings","bor","2026 LE2 Q1"]],"t":"I1","sub":"","bm":1,"orig":"Antibody-mediated hypersensitivity reaction is Type II ● Type II: Production of IgG, IgM → binds to antigen on target cell or tissue → phagocytosis or lysis of target cell by activated complement or Fc receptors, recruitment of leukocytes | Complement activation occurs in Type II (Antibody-mediated) and Type III (Immune complex-mediated) hypersensitivity reactions ● Type II: Production of IgG, IgM → binds to antigen on target cell or tissue → phagocytosis or lysis of target cell by activated complement or Fc receptors, recruitment of leukocytes ● Type III: Deposition of antigen-antibody complexes →complement activation→recruitment of leukocytes by complement products and Fc receptors → release of enzymes and other toxic molecules | Delayed hypersensitivity (Type IV) reaction is T-cell mediated, primarily driven by cytokines released by CD4+ T-cells. ● Type IV: Activated T lymphocytes → (1) release of cytokines, inflammation and macrophage activation, (2) T cell-mediated cytotoxicity | Modulates inflammation, but not a major effector of Type IV hypersensitivity reaction | Immunity I","ref":"PTH - LEC Trans 04 - Disease of","f":[4]},"28a:47":{"id":"28a:47","ex":"2028 LE2","y":2028,"n":47,"p":12,"s":"Which cells cause itching, redness, and blistering around the earlobes after wearing new earrings?","c":[["A","T cells"],["B","B cells"],["C","Mast cells"],["D","Eosinophils"]],"k":"A","ks":["A"],"r":[["The reaction described is a type IV hypersensitivity reaction (delayed-type), commonly due to nickel in earrings. This immune response is cell-mediated, not antibody-mediated. Sensitized T cells, particularly CD4+ Th1 cells, recognize the allergen and release cytokines that recruit macrophages, causing itching, redness, and blistering after 24–48 hours.","own",""],["Involved in antibody (humoral) responses, not delayed hypersensitivity","own",""],["Mast cells initiate cellular immune responses at the infection site by recruitment of various subsets of T cells","bor","2026 LE2 Q16"],["Act mainly in parasitic infections and allergic asthma","own",""]],"t":"I1","sub":"","flag":"Cross-year discrepancy: 2025 Q21 keys C (Mast cells) for the identical earring stem, while 2028 keys A (T cells). The project lecture (Diseases of Immunity 1) files nickel contact dermatitis under Type IV, T cell mediated hypersensitivity, which supports the 2028 key.","orig":"The reaction described is a type IV hypersensitivity reaction (delayed-type), commonly due to nickel in earrings. This immune response is cell-mediated, not antibody-mediated. Sensitized T cells, particularly CD4+ Th1 cells, recognize the allergen and release cytokines that recruit macrophages, causing itching, redness, and blistering after 24–48 hours. | Involved in antibody (humoral) responses, not delayed hypersensitivity | Type 1 | Act mainly in parasitic infections and allergic asthma","ref":"PTH - LEC Trans 04 - Disease of Immunity I","f":[5]},"28a:48":{"id":"28a:48","ex":"2028 LE2","y":2028,"n":48,"p":12,"s":"Which antibodies are implicated in type II hypersensitivity?","c":[["A","IgA and IgM"],["B","IgM and IgG"],["C","IgG and IgA"],["D","IgE and IgM"]],"k":"B","ks":["B"],"r":[["IgA is primarily involved in mucosal immunity","own",""],["Both IgM and IgG are the key antibodies mediating Type II hypersensitivity","own",""],["IgA is primarily involved in mucosal immunity","own",""],["IgE mediates Type I hypersensitivity","own",""]],"t":"I1","sub":"","ref":"PTH - LEC Trans 04 - Disease of Immunity I","f":[3]},"28a:49":{"id":"28a:49","ex":"2028 LE2","y":2028,"n":49,"p":12,"s":"What characterizes Type II hypersensitivity?","c":[["A","Cell lysis"],["B","Strong antibody reactions against antigens"],["C","Leukotrienes release upon stimulation"],["D","Localized tissue reactions"]],"k":"A","ks":["A"],"r":[["Type II (Cytotoxic/Antibody-Mediated Cell Destruction)","own",""],["Type II (antibody mediated): ○ Transfusion reactions ○ Rh incompatibility ○ Methyldopa (+ coombs test)","bor","2026 LE2 Q7"],["Type I hypersensitivity (Immediate/Allergic)","own",""],["Type III hypersensitivity (Immune Complex)","own",""]],"t":"I1","sub":"","ref":"PTH - LEC Trans 04 - Disease of Immunity II","f":[2]},"28a:50":{"id":"28a:50","ex":"2028 LE2","y":2028,"n":50,"p":12,"s":"A 45-year-old woman has a purple rash on her sun exposed skin and eyelids, muscle weakness, and difficulty in swallowing. Which of the following antibodies is most likely to be identified on laboratory testing?","c":[["A","Anti-double stranded DNA"],["B","Anti-centromere"],["C","Scl-70"],["D","Jo-1"]],"k":"D","ks":["D"],"r":[["Anti–double-stranded DNA:SLE","bor","2027 LE2 Q103"],["Antinuclear antibody found in 20-30% of patients who have the CREST syndrome","own",""],["Seen in patients with diffuse systemic sclerosis/ scleroderma and is directed against DNA topoisomerase 1.","own",""],["Anti-Jo-1 antibodies are characteristic of inflammatory myopathies, including polymyositis and dermatomyositis. The patient presents with symptoms of dermatomyositis.","own",""]],"t":"I2","sub":"","ref":"2027 PTH LEC Trans 7B- Diseases of Immunity II","f":[10]},"28a:51":{"id":"28a:51","ex":"2028 LE2","y":2028,"n":51,"p":12,"s":"A 10-month-old child has a history of recurrent infections with multiple organisms, including bacterial, fungal, and viral. A careful family history and pedigree analysis show this to be a genetic disorder that is inherited in an autosomal recessive pattern. Which of the following laboratory studies is likely to be most useful in establishing the underlying mechanism of immunodeficiency in this Infant?","c":[["A","Adenosine deaminase levels in leukocytes"],["B","Enumeration of B cells in blood"],["C","Tests of neutrophil function"],["D","Quantitative serum immunoglobulin levels"]],"k":"A","ks":["A"],"r":[["Severe recurrent infections from all organism types (bacterial, viral, fungal) and autosomal recessive inheritance → Classic presentation of ADA-deficient Severe Combined Immunodeficiency (SCID). ADA deficiency → buildup of dATP → inhibits ribonucleotide reductase → prevents DNA synthesis → lymphocyte apoptosis → SCID.","own",""],["SCID affects both B and T cells. This is seen in Bruton Agammaglobulinemia.","own",""],["Neutrophil defects do not cause severe viral infections. Seen in Chronic granulomatous disease.","own",""],["Nonspecific in SCID and do not identify the underlying mechanism.","own",""]],"t":"I2","sub":"","ref":"Robbins & Cotran Pathologic Basis of Disease 10th edition","f":[]},"28a:52":{"id":"28a:52","ex":"2028 LE2","y":2028,"n":52,"p":13,"s":"A careless laboratory technician accidentally injects a chemical into her skin. The next day, she notes that an area of erythematous, indurated skin is forming around the site of injection. Two days later, the induration measures 10 mm in diameter. A microscopic section from this area shows perivascular accumulation of lymphocytes. Which of the following immunological reactions is most consistent with this appearance?","c":[["A","Arthus reaction"],["B","Delayed-type hypersensitivity"],["C","Serum sickness"],["D","Systemic anaphylaxis"]],"k":"B","ks":["B"],"r":[["Type III hypersensitivity ● Occurs within hours and shows immune complex–mediated neutrophilic inflammation, not lymphocytes.","own",""],["This is the correct answer. Type IV hypersensitivity shows perivascular mononuclear infiltrates, especially activated T lymphocytes and macrophages. The classic example is the tuberculin skin test, which produces induration at 48–72 hours due to cytokine-mediated inflammation.","own",""],["Type III hypersensitivity ● A systemic immune complex disease with fever, arthralgias, rash—not a localized skin induration.","own",""],["Type I hypersensitivity ● Immediate (minutes), IgE-mediated, leads to urticaria, bronchospasm, hypotension—not delayed induration.","own",""]],"t":"I1","sub":"","ref":"Robbins & Cotran Pathologic Basis of Disease 10th edition","f":[0]},"28a:53":{"id":"28a:53","ex":"2028 LE2","y":2028,"n":53,"p":13,"s":"A 10-year-old boy notes blotchy areas of erythema that are pruritic over the skin of his arms, legs, and trunk within an hour every time he eats shrimps. This is followed by diarrhea. These problems abate within 3 hours. What immunologic abnormality is he most likely to have?","c":[["A","Localized allergy"],["B","Cell mediated hypersensitivity"],["C","Hypergammaglobulinemia"],["D","Immune complex deposition"]],"k":"A","ks":["A"],"r":[["Type I hypersensitivity - occurs within minutes to hours, symptoms include urticaria, pruritus, flushing, diarrhea","own",""],["Type IV hypersensitivity - delayed onset T-cell mediated reaction","own",""],["Generalized increase of antibodies, not specific to allergy","own",""],["Type III hypersensitivity - involves immune complexes, symptoms occur after several days, not immediately","own",""]],"t":"I1","sub":"","ref":"[PTH LEC - LE 2] 2A - Diseases of Immunity 1","f":[]},"28a:54":{"id":"28a:54","ex":"2028 LE2","y":2028,"n":54,"p":13,"s":"A biopsy of a transplanted kidney was done. The following histologic changes were seen: interstitial inflammatory infiltrates, fibrosis, tubular atrophy. What type of rejection is present?","c":[["A","Acute cellular rejection"],["B","Acute humoral rejection"],["C","Chronic rejection"],["D","Hyperacute rejection"]],"k":"C","ks":["C"],"r":[["Acute cellular rejection is T cell mediated, occurs within days to weeks, and shows interstitial and tubular mononuclear infiltrates.","gen",""],["Acute humoral (antibody mediated) rejection shows inflammation and necrosis of graft vessels.","gen",""],["- ACUTE ANTIBODY-MEDIATED REJECTION (B CELL-MEDIATED) ● Typically consist of inflammation of the glomeruli and peritubular capillaries. ● Small vessels may also show focal thrombosis. CHRONIC REJECTION (B CELL-MEDIATED) ● Dominated by vascular changes ○ Intimal thickening with inflammation ○ Glomerulopathy ○ Duplication of the basement membrane ○ Peritubular capillaritis. ● Secondary to vascular lesions: interstitial fibrosis and tubular atrophy with loss of renal parenchyma HYPERACUTE REJECTION (B CELL-MEDIATED) GROSS: ● Rapidly cyanotic, mottled and may excrete a few drops of bloody urine MICROSCOPIC: ● Immunoglobulin and complement are deposited in the vessel wall → endothelial injury and fibrin platelet thrombi ● Neutrophils rapidly accumulate within the arterioles, glomeruli, peritubular capillaries. ● When changes become more diffuse and intense → glomeruli undergo thrombotic occlusion of the capillaries and fibrinoid necrosis occurs in the arterial walls.","own",""],["Hyperacute rejection occurs within minutes because preformed antibodies are already circulating in the recipient. It shows neutrophils and thrombosis.","gen",""]],"t":"I2","sub":"","bm":1,"orig":"- | ACUTE ANTIBODY-MEDIATED REJECTION (B CELL-MEDIATED) ● Typically consist of inflammation of the glomeruli and peritubular capillaries. ● Small vessels may also show focal thrombosis. | CHRONIC REJECTION (B CELL-MEDIATED) ● Dominated by vascular changes ○ Intimal thickening with inflammation ○ Glomerulopathy ○ Duplication of the basement membrane ○ Peritubular capillaritis. ● Secondary to vascular lesions: interstitial fibrosis and tubular atrophy with loss of renal parenchyma | HYPERACUTE REJECTION (B CELL-MEDIATED) GROSS: ● Rapidly cyanotic, mottled and may excrete a few drops of bloody urine MICROSCOPIC: ● Immunoglobulin and complement are deposited in the vessel wall → endothelial injury and fibrin platelet thrombi ● Neutrophils rapidly accumulate within the arterioles, glomeruli, peritubular capillaries. ● When changes become more diffuse and intense → glomeruli undergo thrombotic occlusion of the capillaries and fibrinoid | necrosis occurs in the arterial walls.","ref":"[PTH LEC - LE 2] 04 - Diseases of Immunity 2 (V2)","f":[12]},"28a:55":{"id":"28a:55","ex":"2028 LE2","y":2028,"n":55,"p":14,"s":"Which of the following is a characteristic feature of amyloid deposition and its primary pathological effect?","c":[["A","The deposits consist of normally folded proteins and are easily broken down by enzymes."],["B","The deposits are extracellular aggregates of proteins with a random, undefined structure."],["C","The deposits are extracellular, composed of misfolded proteins in a 𝛽-pleated sheet configuration leading to organ dysfunction."],["D","The deposits are intracellular aggregates of misfolded protein causing"]],"k":"C","ks":["C"],"r":[["Amyloid consists of misfolded proteins","own",""],["Amyloid has a specific, highly ordered β-pleated sheet configuration","own",""],["Amyloid deposits are extracellular, composed of misfolded proteins in a 𝛽-pleated sheet configuration leading to organ dysfunction","own",""],["Amyloid = extracellular Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"I2","sub":"","f":[15]},"28a:56":{"id":"28a:56","ex":"2028 LE2","y":2028,"n":56,"p":14,"s":"Which of the following is a mechanism by which viruses damage or kill host cells?","c":[["A","Use of adhesin to attach to host cells"],["B","Release of exotoxin"],["C","Release of superantigen"],["D","Activation of pro-apoptotic pathways"]],"k":"D","ks":["D"],"r":[["This is a step in a viral infection facilitating attachment but does not directly damage or kill cells","own",""],["This is a mechanism associated with bacterial pathogens, not viruses","own",""],["This is a mechanism associated with bacterial pathogens, not viruses","own",""],["Viruses can damage or kill host cells through mechanisms such as activating pro-apoptotic pathways, causing direct cytopathic effects, disrupting cellular macromolecular synthesis, and inducing cell lysis","own",""]],"t":"ID1","sub":"","f":[35]},"28a:57":{"id":"28a:57","ex":"2028 LE2","y":2028,"n":57,"p":14,"s":"Identify predominant histologic pattern of tissue reaction in liver abscess caused by entamoeba histolytica?","c":[["A","Granulomatous inflammation and suppurative inflammation"],["B","Tissue necrosis and suppurative inflammation"],["C","Cytopathic-cytoproliferative reaction"],["D","Chronic inflammation and scarring"]],"k":"B","ks":["B"],"r":[["Distinctive form of mononuclear inflammation usually evoked by infectious agents that resist eradication & are capable of stimulating strong T-cell mediated immunity. There is presence of accumulation of epithelioid cells, Langhan giant cells and granulomas may contain central caseous necrosis. (Ex. Mycobacterium tuberculosis, Histoplasma capsulatum, Schistosome eggs)","own",""],["The parasite, Entamoeba histolytica, causes colonic ulcers and liver abscess characterized by extensive tissue destruction with liquefactive necrosis & little inflammatory infiltrate.","own",""],["Usually produced by viruses, characterized by either cell necrosis or cellular proliferation usually with sparse inflammatory cells. There is presence of inclusion bodies, multinucleated cells, epithelial cell detachment and proliferation, as well as possible development of malignant neoplasms.","own",""],["Chronic inflammation may lead to either: → Complete healing, OR → Extensive scarring","own",""]],"t":"ID1","sub":"","ref":"[PTH LEC - LE 2] 05 - General Principles of Microbial Pathogenesis","f":[36]},"28a:58":{"id":"28a:58","ex":"2028 LE2","y":2028,"n":58,"p":14,"s":"An elderly female presented with fever and decreasing sensorium of 4 days duration. PE showed she has fever, hypotension and decreasing sensorium. Complete blood count showed an elevated WBC with neutrophilia. Blood cultures were positive for a gram-negative bacillus. She has disseminated intravascular coagulation and pulmonary diffuse alveolar damage with respiratory distress. Which of the following substances elaborated by this organism caused these clinical and laboratory findings?","c":[["A","Endotoxin"],["B","Exotoxin"],["C","Mycolic acid"],["D","Tumor Necrosis Factor"]],"k":"A","ks":["A"],"r":[["endotoxin is a lipopolysaccharide (LPS) in the outer membrane of gram-negative bacteria that both stimulates host immune responses and injures the host.","own",""],["Exotoxins are secreted bacterial proteins that cause cellular injury and disease. This can be found in both gram-negative and positive bacteria. Mycobacteria have a unique waxy cell wall composed of unusual glycolipids and lipids including","own",""],["mycolic acid, which makes them acid-fast, meaning they will retain stains, even on treatment with a mixture of acid and alcohol. Bacteria with mycolic acid are gram-positive. TNF is a cytokine released by host immune cells, not a bacterial substance, its release is actually triggered by endotoxin.","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID1","sub":"","bm":1,"orig":"Bacterial endotoxin is a lipopolysaccharide (LPS) in the outer membrane of gram-negative bacteria that both stimulates host immune responses and injures the host. | Exotoxins are secreted bacterial proteins that cause cellular injury and disease. This can be found in both gram-negative and positive bacteria. | Mycobacteria have a unique waxy cell wall composed of unusual glycolipids and lipids including mycolic acid, which makes them acid-fast, meaning they will retain stains, even on treatment with a | mixture of acid and alcohol. Bacteria with mycolic acid are gram-positive. | TNF is a cytokine released by host immune cells, not a bacterial substance, its release is actually triggered by endotoxin.","ref":"Robbins & Cotran Pathologic Basis of Disease 10th edition Chapter 8 (2020)","f":[]},"28a:59":{"id":"28a:59","ex":"2028 LE2","y":2028,"n":59,"p":15,"s":"A child was brought by his mother to a pediatrician because of red to pale brown flat spots on the face, trunk and extremities of several days duration. The rash started on the face and spread downward to the trunk and the extremities. 3 days prior to the appearance of the rash, he had fever, cough, a runny nose and red eyes. Microscopic examination of the sputum showed multinucleated giant cells with eosinophilic nuclear and cytoplasmic inclusions. In which of the following organs are these cells most likely to be found?","c":[["A","Liver and Pancreas"],["B","Lungs and Lymph Nodes"],["C","Kidneys and Adrenal Gland"],["D","Meninges and Bone"]],"k":"B","ks":["B"],"r":[["Not sites of measles viral replication or giant cell formation","own",""],["The red-to-brown maculopapular rash that begins on the face and spreads to the trunks and extremities, together with the 3 C’s (cough, coryza, conjunctivitis) and the presence of Warthin–Finkeldey multinucleated giant cells (pathognomonic sign), is characteristic of Measles (Rubeola). The measles virus initially replicates in the respiratory epithelium of the lungs and then spreads to nearby lymphoid tissues","own",""],["Not sites of measles viral replication or giant cell formation","own",""],["Not sites of measles viral replication or giant cell formation","own",""]],"t":"ID2","sub":"","ref":"[PTH LEC - LE2] 06 - Infectious Disease I_Viral Infections","f":[37]},"28a:60":{"id":"28a:60","ex":"2028 LE2","y":2028,"n":60,"p":15,"s":"A 45y/o nurse presented with a painful blister under the nose for a few days duration. Aspiration of the fluid from the blister was done. Microscopic examination of the fluid from the blister was performed and showed cells with glassy eosinophilic intranuclear inclusion. Identify these cells","c":[["A","Negri bodies"],["B","Molluscum bodies"],["C","Type A Cowdry inclusions"],["D","Meyers-Kouvenaar bodies"]],"k":"C","ks":["C"],"r":[["Negri bodies are seen in rabies","own",""],["Molluscum bodies are seen in molluscum contagiosum","own",""],["Patient most likely has a fever blister which is caused by Herpes simplex virus. The epithelial cells infected by HSV from the fluid aspirate would show eosinophilic intranuclear inclusions. These cells are called Cowdry type A inclusion bodies.","own",""],["Meyers-Kouvenaar bodies are remnants of dead microfilaria covered in eosinophilic amorphous material and form a granuloma. They are seen in filariasis","own",""]],"t":"ID2","sub":"","ref":"[PTH LEC - LE 2] 3B - Infectious Disease I: Viral Infections","f":[38]},"28a:61":{"id":"28a:61","ex":"2028 LE2","y":2028,"n":61,"p":15,"s":"61. For infective mononucleosis of epstein barr virus what initiates the infection to proliferate.","c":[["A","Macrophage"],["B","Neutrophils"],["C","B lymphocytes"],["D","T lymphocytes"]],"k":"C","ks":["C"],"r":[["While macrophages may help clear viral debris, they are not the primary target or initiator.","own",""],["T cells (specifically CD8+ Cytotoxic T cells) are the response to the infection, not the initiator. They proliferate to kill the infected B cells.","own",""],["EBV initiates the infection by attaching to the CD21 receptor (also known as CR2) on the surface of B cells. This infection drives the B cells to proliferate and establish a latent infection, which triggers the body's immune response.","own",""],["Neutrophils are the first responders for bacterial infections, but they do not play a significant role in initiating viral infections like EBV/Mononucleosis.","own",""]],"t":"ID2","sub":"","flag":"Cross-year note: 2025 Q74 and 2026 Q16 ask which cell PROLIFERATES reactively in EBV infection and key T cells. This 2028 item asks what initiates the infection and keys B lymphocytes. Read the stem before answering.","orig":"While macrophages may help clear viral debris, they are not the primary target or initiator. | T cells (specifically CD8+ Cytotoxic T cells) are the response to the infection, not the initiator. They proliferate to kill the infected B cells. | EBV initiates the infection by attaching to the CD21 receptor (also known as CR2) on the surface of B cells. This infection drives the B cells to proliferate and establish a latent infection, which triggers the body's immune response. | Neutrophils are the first responders for bacterial infections, but they do not play a significant role in initiating viral infections like EBV/Mononucleosis.","ref":"[PTH LEC - LE 2] 3B - Infectious Disease I: Viral Infections","f":[40]},"28a:62":{"id":"28a:62","ex":"2028 LE2","y":2028,"n":62,"p":15,"s":"The first column has oncogenic viruses. The second column has conditions associated with their corresponding malignancies. Among these, which is INCORRECT?","c":[["A","HBV : Hepatocellular Carcinoma"],["B","EBV : Nasopharyngeal Carcinoma"],["C","HPV : Cervical Carcinoma"],["D","HTLV-1 : Burkitt’s Lymphoma"]],"k":"D","ks":["D"],"r":[["Hepatitis B virus (HBV) is linked to hepatocellular carcinoma due to its oncogenic effects, including chronic inflammation, hepatocyte proliferation, and activation of carcinogenic pathways via HBx protein. It accounts for 70–85% of hepatocellular carcinomas worldwide. Other options involve different pathologies, such as benign tumors or cancers unrelated to HBV.","bor","2027 LE2 Q50"],["EBV is linked to nasopharyngeal carcinoma and Burkitt lymphoma, so this pairing is correct.","gen",""],["Persistent HPV infection causes virtually all cervical carcinomas, so this pairing is correct.","gen",""],["HTLV-1 is associated with Adult - T Cell Leukemia","own",""]],"t":"ID2","sub":"","note":"The options are printed as a two-column matching table in the source PDF.","f":[31]},"28a:63":{"id":"28a:63","ex":"2028 LE2","y":2028,"n":63,"p":16,"s":"A middle-aged HIV-positive male presents with a 2 day history of fever and nonproductive cough. He has mild hypoxemia but denies chest pain or hemoptysis. He is febrile and has fine crackles. A chest X-ray reveals diffuse interstitial infiltrates. Microscopic examination of his lung biopsy shows enlarged cells with basophilic intranuclear inclusions surrounded by a clear halo. What is most likely the cause of this patient’s disease?","c":[["A","Measles"],["B","Cytomegalovirus"],["C","Respiratory syncytial virus"],["D","Herpes zoster virus"]],"k":"B","ks":["B"],"r":[["Measles gives a blotchy rash spreading from the face downward and the pathognomonic Warthin-Finkeldey multinucleated giant cells in lymphoid tissue, lung and sputum.","gen",""],["CMV causes fetal abnormalities such as Chromosomal abnormalities (Trisomies), congenital anomalies (not present in PE of the patient), congenital infections (TORCH). “Mnemonics: TORCH” T-Toxoplasmosis O-Others (Syphilis, Hepa B) R- Rubella C-Cytomegalovirus H- Herpes Simplex Virus","bor","2027 LE3 Q28"],["Is a common respiratory virus that usually causes mild, cold-like symptoms. Most people recover in a week or two,","bor","2025 LE2 Q77"],["Varicella-zoster virus causes chickenpox and then lies latent in sensory ganglia, reactivating as shingles with intranuclear inclusions.","gen",""]],"t":"ID2","sub":"","bm":1,"ref":"[PTH LEC - LE 2] 3B - Infectious Disease I: Viral Infections","f":[39]},"28a:64":{"id":"28a:64","ex":"2028 LE2","y":2028,"n":64,"p":16,"s":"A 55-year-old diabetic female was admitted due to fever and loss of appetite of 1 week duration. PE showed a temperature of 39°C. She has a shiny, red, raised, tender rash with sharply defined margins on the face. A skin biopsy shows minimal tissue destruction, neutrophilic infiltration in dermis, epidermis, and subcutaneous and subepidermal edema. What is the most likely diagnosis?","c":[["A","Shingles"],["B","Erysipelas"],["C","Bullous impetigo"],["D","Lepromatous leprosy"]],"k":"B","ks":["B"],"r":[["Shingles Description: ● Reactivation of latent Varicella-Zoster Virus (VZV) = Shingles/Herpes Zoster Gross Pathology ● Painful dermatomal vesicular rash ● VZV infects keratinocytes -> vesicular lesions with intense itching, burning, or sharp pain ● Pain especially severe with trigeminal nerve involvement ● Rash appears in unilateral dermatomal distribution ● Herpes Zoster Ophthalmia: Involvement of ophthalmic division of CN V (V1) in 10-15% of cases Microscopic Pathology ● Intraepithelial vesicle formation ● Intranuclear inclusions in epithelial cells at the base of vesicles ● Dorsal root ganglion: shows ganglion cell necrosis with mononuclear inflammation and herpetic intranuclear inclusions in neurons and supporting cells","own",""],["Erysipelas Description: ● Rapidly spreading erythematous cutaneous swelling with well-demarcated, serpiginous border Microscopic Findings: ● Neutrophilic infiltration of epidermis, dermis, & subcutaneous tissue ● Minimal tissue necrosis Clinical Features: ● Affects bilateral cheeks and bridge of the nose (Butterfly distribution) ● Sharp demarcation between the erythematous area and the normal skin ● Acute lesion shows neutrophilic infiltration, minimal tissue destruction, and marked subepidermal edema Staphylococcal","own",""],["Bullous Impetigo Cause: S. aureus produces exfoliative toxins A and B that cleave desmoglein-1, a desmosomal protein holding keratinocytes together â†’ localized exfoliation and blister formation. Clinical Findings: ● Blisters with honey-yellow crusts ● Itchy lesions","own",""],["Lepromatous leprosy Clinical Findings: ● Symmetric skin thickening and nodular lesions involving the face, earlobes, wrists, knees, and ankles ● Late involvement of peripheral nerves Gross Findings: ● Lesions may be macular, papular, or nodular ● Development of leonine facies (disfiguring nodularity and thickening of the skin resembling a lion’s face) Histologic Findings: ● Nerves invaded by numerous acid-fast bacilli with minimal inflammatory response ● Presence of Lepra cells (foamy macrophages filled with bacilli) ● Formation of Globi (clusters of bacilli within macrophages) ● Absent granuloma formation","own",""]],"t":"ID3","sub":"","bm":1,"orig":"Shingles Description: ● Reactivation of latent Varicella-Zoster Virus (VZV) = Shingles/Herpes Zoster Gross Pathology ● Painful dermatomal vesicular rash ● VZV infects keratinocytes -> vesicular lesions with intense itching, burning, or sharp pain ● Pain especially severe with trigeminal nerve involvement ● Rash appears in unilateral dermatomal distribution ● Herpes Zoster Ophthalmia: Involvement of ophthalmic division of CN V (V1) in 10-15% of cases Microscopic Pathology ● Intraepithelial vesicle formation ● Intranuclear inclusions in epithelial cells at the base of vesicles ● Dorsal root ganglion: shows ganglion cell necrosis with mononuclear inflammation and herpetic intranuclear inclusions in neurons and supporting cells | Erysipelas Description: ● Rapidly spreading erythematous cutaneous swelling with well-demarcated, serpiginous border Microscopic Findings: ● Neutrophilic infiltration of epidermis, dermis, & subcutaneous tissue ● Minimal tissue necrosis Clinical Features: ● Affects bilateral cheeks and bridge of the nose (Butterfly distribution) ● Sharp demarcation between the erythematous area and the normal skin ● Acute lesion shows neutrophilic infiltration, minimal tissue destruction, and marked subepidermal edema | Staphylococcal Bullous Impetigo | Cause: S. aureus produces exfoliative toxins A and B that cleave desmoglein-1, a desmosomal protein holding keratinocytes together â†’ localized exfoliation and blister formation. Clinical Findings: ● Blisters with honey-yellow crusts ● Itchy lesions | Lepromatous leprosy Clinical Findings: ● Symmetric skin thickening and nodular lesions involving the face, earlobes, wrists, knees, and ankles ● Late involvement of peripheral nerves Gross Findings: ● Lesions may be macular, papular, or nodular ● Development of leonine facies (disfiguring nodularity and thickening of the skin resembling a lion’s face) Histologic Findings: ● Nerves invaded by numerous acid-fast bacilli with minimal inflammatory response ● Presence of Lepra cells (foamy macrophages filled with bacilli) ● Formation of Globi (clusters of bacilli within macrophages) ● Absent granuloma formation","ref":"Infectious Diseases I: Viral Infections Infectious Diseases I: Bacterial Infections I","f":[41]},"28a:65":{"id":"28a:65","ex":"2028 LE2","y":2028,"n":65,"p":17,"s":"Which of the following pathological findings is due to the dissemination of exotoxins produced by Corynebacterium diphtheriae?","c":[["A","Encephalitis"],["B","Pseudomembranous Colitis"],["C","Myocarditis"],["D","Pancreatitis"]],"k":"C","ks":["C"],"r":[["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""],["DIPTHERIC MYOCARDITIS ● Interstitial mononuclear inflammation in the heart ● C. diptheriae produces potent A-B exotoxin which blocks protein synthesis of host cells and mediates formation of pseudomembrane ● Can cause toxin-mediated damage in the heart, nerves and other organs","own",""],["Project-source note: The uploaded feedback gives no rationale for this option, and the available project materials do not provide enough detail for a fuller study rationale.","none",""]],"t":"ID3","sub":"","bm":1,"orig":"DIPTHERIC MYOCARDITIS ● Interstitial mononuclear inflammation in the heart ● C. diptheriae produces potent A-B exotoxin which blocks protein synthesis of host cells and mediates formation of pseudomembrane ● Can cause toxin-mediated damage in the heart, nerves and other organs","ref":"Infectious Diseases I: Bacterial Infections I","f":[42]},"28a:66":{"id":"28a:66","ex":"2028 LE2","y":2028,"n":66,"p":17,"s":"35 y/o male sexual worker sought consultation because of an ulcer on his scrotum of 3 weeks duration. PE shows a shallow ulcer with clean border and indurated borders. Dark field microscopy of the scalping from the base of the ulcer showed spiral shaped bacteria. Identify the ulcer of this patient.","c":[["A","Eschar"],["B","Chancroid"],["C","Soft Chancre"],["D","Hard Chancre"]],"k":"D","ks":["D"],"r":[["Refers to a necrotic black scab at the site of a tick or mite bite of Rickettsiosis, or seen in cutaneous anthrax (e.g., scrub typhus)","own",""],["Chancroid = soft chancre caused by Haemophilus ducreyi","own",""],["Caused by Haemophilus ducreyi. It is a painful, ragged, non-indurated ulcer with purulent base","own",""],["Syphilis is caused by a spiral or corkscrew-shaped bacterium (spirochete) known as Treponema pallidum, that can appear as a helical coil under dark field microscopy. During the primary stage of syphilis, the lesion is characterized by a red, firm, and nontender papule that erodes to form a shallow, clean-based ulcer with indurated (“hard”) borders, giving it a button-like appearance. The syphilitic chancre is also referred to as a “hard chancre” because of its indurated or firm margin. Common sites of the chance in men include: Penis, scrotum, anus and rectum.","own",""]],"t":"ID4","sub":"","ref":"Infectious Diseases I: Bacterial Infections II (V1)","f":[50]},"28a:67":{"id":"28a:67","ex":"2028 LE2","y":2028,"n":67,"p":17,"s":"Which lesion will most likely be seen at the site of invasion of Haemophilus ducreyi?","c":[["A","Hard chancre"],["B","Soft chancre"],["C","Scrofula"],["D","Erythema migrans"]],"k":"B","ks":["B"],"r":[["Syphilis is caused by a spiral or corkscrew-shaped bacterium (spirochete) known as Treponema pallidum, that can appear as a helical coil under dark field microscopy. During the primary stage of syphilis, the lesion is characterized by a red, firm, and nontender papule that erodes to form a shallow, clean-based ulcer with indurated (“hard”) borders, giving it a button-like appearance. The syphilitic chancre is also referred to as a “hard chancre” because of its indurated or firm margin. Common sites of the chance in men include: Penis, scrotum, anus and rectum.","bor","2028 LE2 Q66"],["Caused by Treponema pallidum Also known as chancroid, it is a sexually transmitted disease characterized as painful and soft with irregular-edged sores caused by the bacteria Haemophilus ducreyi. Cervical lymphadenitis caused by Mycobacterium tuberculosis A classical sign of Lyme disease caused by Borrelia burgdorferi [2028] Infectious Diseases I: Bacterial Infections I","own",""],["Scrofula is tuberculous lymphadenitis, most often of the cervical nodes. It is unifocal in HIV-negative patients.","gen",""],["Erythema migrans is the stage 1 skin lesion of Lyme disease at the tick bite site.","gen",""]],"t":"ID3","sub":"","bm":1,"orig":"Caused by Treponema pallidum | Also known as chancroid, it is a sexually transmitted disease characterized as painful and soft with irregular-edged sores caused by the bacteria Haemophilus ducreyi. | Cervical lymphadenitis caused by Mycobacterium tuberculosis | A classical sign of Lyme disease caused by Borrelia burgdorferi | [2028] Infectious Diseases I: Bacterial Infections I","f":[49]},"28a:68":{"id":"28a:68","ex":"2028 LE2","y":2028,"n":68,"p":18,"s":"At which stage in Lyme disease is chronic arthritis with joint pain can be seen?","c":[["A","Stage 1"],["B","Stage 2"],["C","Stage 3"],["D","All of the stages"]],"k":"C","ks":["C"],"r":[["Stage 1: Erythema migrans (a.k.a. erythema chronicum migrans) at site of the tick bite","bor","2026 LE2 Q25"],["Stage 2: Hematogenous dissemination of spirochetes","bor","2026 LE2 Q25"],["Stage 3 Lyme disease is late disease, months to years after infection, with chronic arthritis of large joints such as the knees.","gen",""],["Each Lyme stage has its own lesion: erythema migrans in stage 1, dissemination in stage 2, large joint arthritis in stage 3. No lesion in these items spans all stages.","gen",""]],"t":"ID4","sub":"","bm":1,"ref":"[2028] - Infectious Diseases I: Bacterial Infections II","f":[53]},"28a:69":{"id":"28a:69","ex":"2028 LE2","y":2028,"n":69,"p":18,"s":"Which of the following pathologic findings characterizes benign tertiary syphilis?","c":[["A","Chancer"],["B","Condyloma acuminata"],["C","Aortitis"],["D","Gumma"]],"k":"D","ks":["D"],"r":[["The chancre is the lesion of primary syphilis at the site of inoculation, not of the tertiary stage.","gen",""],["Condyloma acuminatum is the anogenital wart caused by HPV. It is not a lesion of syphilis, whose secondary stage gives condyloma latum.","gen",""],["Syphilitic aortitis is the cardiovascular form of tertiary syphilis, with obliterative endarteritis of the vasa vasorum. Benign tertiary syphilis is defined by the gumma instead.","gen",""],["Seen in Primary Syphilis A manifestation of human papillomavirus (HPV) infection Seen in cardiovascular tertiary syphilis, not benign tertiary syphilis","own",""]],"t":"ID4","sub":"","bm":1,"orig":"Seen in Primary Syphilis | A manifestation of human papillomavirus (HPV) infection | Seen in cardiovascular tertiary syphilis, not benign tertiary syphilis","f":[52]},"28a:70":{"id":"28a:70","ex":"2028 LE2","y":2028,"n":70,"p":18,"s":"An autopsy was done on a poorly nourished 60 year-old woman admitted for respiratory distress. She had cough, remitting fever at night, and weight loss for 6 months duration. Gross examination of the lungs show pinhead-sized, yellow-white, soft to firm areas scattered on the lungs. These yellow to white areas are confined to the lungs. Microscopic areas show caseating and non-caseating granulomas. What is the possible diagnosis?","c":[["A","Isolated organ tuberculosis"],["B","Primary tuberculosis"],["C","Miliary pulmonary tuberculosis"],["D","Systemic miliary tuberculosis"]],"k":"C","ks":["C"],"r":[["Localized to non-pulmonary site (meninges, kidney, adrenal gland etc.)","own",""],["Usually a single Ghon focus with hilar lymph node involvement","own",""],["Numerous granulomas throughout the lungs","own",""],["Hematogenous spread, multiple miliary lesions but in multiple organs","own",""]],"t":"ID3","sub":"","ref":"[PTH LEC - LE 2] Infectious Diseases Bacterial Infections I","f":[47]},"28a:71":{"id":"28a:71","ex":"2028 LE2","y":2028,"n":71,"p":18,"s":"An HIV patient is found to have progressive, bilateral pneumonia secondary to fungal infection. What form of the fungus appears ovoid and cup-shaped with a central dot?","c":[["A","Cyst"],["B","Hyphae"],["C","Sporocytes"],["D","Trophozoite"]],"k":"A","ks":["A"],"r":[["PNEUMOCYSTIS INFECTION ● Significant opportunistic infection seen in AIDS
