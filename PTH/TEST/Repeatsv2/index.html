mooth muscle cells migrate from media to intima. Fatty streaks are early and calcification is late.","pat":"The same statements are recycled as TRUE, INCORRECT and roman-numeral combination items.","flag":false},{"id":38,"title":"Herpes simplex: Cowdry type A intranuclear inclusions","cat":"C","t":"ID2","sub":"","items":["28a:60","27a:47","27b:120","26:15","25:66"],"years":[2025,2026,2027,2028],"n":5,"rule":"HSV infected cells carry large pink to purple glassy intranuclear (Cowdry type A) inclusions. Lesion names follow the site: fever blister at the lip, gingivostomatitis in the mouth, herpetic whitlow on the finger.","pat":"The 2027 LE3 oral pathology item keys Koilocytes for an HSV vignette. See the flag.","flag":true},{"id":0,"title":"Type IV hypersensitivity is the delayed type","cat":"D","t":"I1","sub":"","items":["28a:45","28a:52","27a:94","27b:20","25:24"],"years":[2025,2027,2028],"n":5,"rule":"Type IV is delayed, T cell mediated hypersensitivity. Type I is immediate or anaphylactic, Type II is antibody mediated, Type III is immune complex mediated.","pat":"Asked almost word for word every year, with Immediate, Anaphylactic and Anergic as the standing distractors. 2028 adds a vignette version (chemical injected into skin, induration the next day).","flag":false},{"id":126,"title":"Hypertrophic cardiomyopathy","cat":"C","t":"UNC","sub":"Heart","items":["28a:129","28a:97","27b:68","27b:79","25:104"],"years":[2025,2027,2028],"n":5,"rule":"Myocyte hypertrophy with fiber disarray, a hypercontractile heart without dilation, caused by mutations of sarcomere protein genes such as beta-MHC.","pat":"","flag":false},{"id":39,"title":"Cytomegalovirus: owl's eye inclusion","cat":"D","t":"ID2","sub":"","items":["28a:63","27a:49","26:17","25:62"],"years":[2025,2026,2027,2028],"n":4,"rule":"CMV infected cells are enlarged with a large basophilic intranuclear inclusion surrounded by a clear halo (owl's eye).","pat":"The host changes (transplant recipient, HIV patient, stillborn infant) but the histology sentence is constant.","flag":false},{"id":29,"title":"t(9;22) BCR-ABL and chronic myelogenous leukemia","cat":"C","t":"N2","sub":"","items":["28a:115","27a:89","26:110","25:60"],"years":[2025,2026,2027,2028],"n":4,"rule":"t(9;22), the Philadelphia chromosome, fuses BCR and ABL to give a constitutively active tyrosine kinase. It is the signature of CML, where neutrophils predominate and blasts stay under 20 percent.","pat":"Each year asks a different end of the same fact: the gene (2025), the translocation (2026), the predominant cell (2027), the disease (2028).","flag":false},{"id":37,"title":"Measles: Warthin-Finkeldey giant cells","cat":"C","t":"ID2","sub":"","items":["28a:59","27a:48","26:13","25:77"],"years":[2025,2026,2027,2028],"n":4,"rule":"Measles gives a rash starting on the face and spreading down, with multinucleated giant cells containing eosinophilic nuclear and cytoplasmic inclusions (Warthin-Finkeldey cells) in lymph nodes, lungs and sputum.","pat":"Same vignette, rotating question: the virus (2025), the cell name (2026), the organ (2027 and 2028).","flag":false},{"id":41,"title":"Erysipelas","cat":"C","t":"ID3","sub":"","items":["28a:64","27a:52","26:19","25:75"],"years":[2025,2026,2027,2028],"n":4,"rule":"Erysipelas is a superficial S. pyogenes infection: sharply demarcated, raised, erythematous facial swelling with neutrophilic infiltration and minimal tissue destruction.","pat":"2027 inverts it and asks for the biopsy finding.","flag":false},{"id":50,"title":"Primary syphilis: hard chancre","cat":"C","t":"ID4","sub":"","items":["28a:66","27a:53","26:23","25:82"],"years":[2025,2026,2027,2028],"n":4,"rule":"The primary lesion at the site of treponemal invasion is a firm, non-tender, indurated ulcer (hard chancre) rich in spirochetes with proliferative endarteritis and plasma cells.","pat":"Same four options recur: soft chancre, hard chancre, chancroid, chagoma.","flag":false},{"id":125,"title":"Acute cor pulmonale: right ventricular dilation","cat":"C","t":"UNC","sub":"Heart","items":["28a:110","27b:76","26:61","25:99"],"years":[2025,2026,2027,2028],"n":4,"rule":"Acute cor pulmonale (massive pulmonary embolism) dilates the right ventricle. Chronic cor pulmonale hypertrophies it.","pat":"","flag":false},{"id":53,"title":"Lyme disease stages","cat":"I","t":"ID4","sub":"","items":["28a:68","27a:58","26:25","25:80"],"years":[2025,2026,2027,2028],"n":4,"rule":"Stage 1 is erythema (chronicum) migrans at the tick bite. Stage 2 is dissemination. Stage 3 is chronic arthritis of large joints.","pat":"Alternates between the stage 1 lesion and the stage 3 arthritis.","flag":false},{"id":60,"title":"High parasitemia with hemolytic anemia: P. falciparum and Babesia, not P. vivax","cat":"I","t":"ID7","sub":"","items":["28a:76","27a:62","26:36","25:89"],"years":[2025,2026,2027,2028],"n":4,"rule":"P. falciparum and Babesia give high parasitemia, fever and hemolytic anemia. P. vivax, P. ovale and P. malariae give low parasitemia and mild anemia.","pat":"EXCEPT in 2026 and 2028, direct in 2027.","flag":false},{"id":127,"title":"Nonbacterial thrombotic (marantic) endocarditis","cat":"D","t":"UNC","sub":"Heart","items":["28a:106","28a:128","27b:70","25:105"],"years":[2025,2027,2028],"n":4,"rule":"Small sterile vegetations along lines of closure in debilitated patients with cancer or sepsis.","pat":"","flag":false},{"id":130,"title":"Compensatory mechanisms in heart failure (EXCEPT corticosteroids)","cat":"D","t":"UNC","sub":"Heart","items":["28a:103","28a:108","27b:75","25:108"],"years":[2025,2027,2028],"n":4,"rule":"Hypertrophy, tachycardia from catecholamines and renin-angiotensin-aldosterone activation compensate. Adrenal corticosteroid release does not.","pat":"Asked twice inside the 2028 paper.","flag":false},{"id":134,"title":"Peripartum cardiomyopathy is a dilated cardiomyopathy","cat":"D","t":"UNC","sub":"Heart","items":["28a:102","27b:74","27b:81","25:116"],"years":[2025,2027,2028],"n":4,"rule":"Heart failure with global cardiac enlargement weeks after delivery is peripartum dilated (congestive) cardiomyopathy.","pat":"2027 LE3 asks it twice. The second printing keys a different option. See the flag.","flag":true},{"id":135,"title":"Tetralogy of Fallot: pulmonary stenosis sets the cyanosis","cat":"D","t":"UNC","sub":"Heart","items":["28a:101","27b:62","27b:73","25:117"],"years":[2025,2027,2028],"n":4,"rule":"Severity of cyanosis depends on the degree of pulmonary outflow obstruction.","pat":"","flag":false},{"id":7,"title":"Type III immune complex disease","cat":"C","t":"I1","sub":"","items":["28a:119","27a:105","27a:98","25:27"],"years":[2025,2027,2028],"n":4,"rule":"Type III injury comes from antigen-antibody complexes that deposit in vessels, kidney and joints, fix complement and draw in neutrophils. Granular immunofluorescence and acute vasculitis are the tissue signature.","pat":"Framing changes each year: serum sickness (2025), drug-induced vasculitis and granular C1q staining (2027), vessel image (2028).","flag":false},{"id":33,"title":"Small cell carcinoma and ectopic ACTH (paraneoplastic)","cat":"C","t":"N2","sub":"Lung items are outside the lecture set","items":["28a:32","28b:84","27b:89","26:69"],"years":[2026,2027,2028],"n":4,"rule":"Small cell lung carcinoma is the lung tumor most associated with paraneoplastic syndromes, classically ectopic ACTH with Cushing features.","pat":"","flag":false},{"id":36,"title":"Histologic patterns of tissue reaction to infection","cat":"C","t":"ID1","sub":"","items":["28a:57","26:11","25:79","25:81"],"years":[2025,2026,2028],"n":4,"rule":"Five patterns: suppurative (pyogenic bacteria), mononuclear and granulomatous, cytopathic-cytoproliferative (viruses), tissue necrosis (toxin producers such as C. perfringens, and E. histolytica), and chronic inflammation with scarring (schistosome eggs).","pat":"A new organism each year, the same five pattern names as options.","flag":false},{"id":100,"title":"Risk factors for neonatal respiratory distress syndrome","cat":"C","t":"UNC","sub":"Infancy and childhood","items":["28b:86","28b:94","27b:32","26:54"],"years":[2026,2027,2028],"n":4,"rule":"Prematurity, male sex, maternal diabetes and cesarean delivery before labor raise the risk. Antenatal corticosteroids lower it.","pat":"","flag":false},{"id":113,"title":"Malignant hypertension: hyperplastic arteriolosclerosis (onion skin)","cat":"C","t":"UNC","sub":"Blood vessels","items":["28a:86","27b:47","27b:54","25:97"],"years":[2025,2027,2028],"n":4,"rule":"Concentric intimo-medial proliferation (onion skinning) accompanies accelerated hypertension. Hyaline arteriolosclerosis is the benign form.","pat":"","flag":false},{"id":120,"title":"Aortic dissection: cystic medial necrosis","cat":"C","t":"UNC","sub":"Blood vessels","items":["28a:132","28a:94","27b:59","25:110"],"years":[2025,2027,2028],"n":4,"rule":"Tearing chest pain radiating to the back with a normal ECG is dissection, whose lesion is cystic medial necrosis (connective tissue weakness, as in Marfan syndrome).","pat":"","flag":false},{"id":129,"title":"Rheumatic heart disease: Aschoff bodies and fish-mouth mitral stenosis","cat":"C","t":"UNC","sub":"Heart","items":["28a:98","27b:69","25:107","25:113"],"years":[2025,2027,2028],"n":4,"rule":"Commissural fusion, thickened shortened chordae and Aschoff bodies identify rheumatic valvulitis.","pat":"","flag":false},{"id":9,"title":"Chronic granulomatous disease: defective microbicidal activity (phagocyte oxidase)","cat":"D","t":"I2","sub":"","items":["28a:35","28a:40","28a:9","27a:95"],"years":[2027,2028],"n":4,"rule":"CGD is a defect in phagocyte oxidase (NADPH oxidase), so phagocytes cannot generate superoxide and cannot kill ingested bacteria.","pat":"Asked twice inside the same 2028 paper with near-identical wording, plus a third time asking for the enzyme.","flag":false},{"id":73,"title":"Edema and Starling forces","cat":"C","t":"UNC","sub":"LE1 recall","items":["27a:8","27b:7","25:6","25:8"],"years":[2025,2027],"n":4,"rule":"Fluid leaves vessels when hydrostatic pressure rises (heart failure), plasma oncotic pressure falls (nephrotic syndrome) or lymphatics are obstructed (post-mastectomy).","pat":"","flag":false},{"id":90,"title":"Multiple myeloma","cat":"C","t":"UNC","sub":"RBC/WBC disorders","items":["27a:75","27a:86","26:102","26:103"],"years":[2026,2027],"n":4,"rule":"Lytic bone lesions, Bence Jones proteinuria, rouleaux with high ESR, and an M-spike on protein electrophoresis that confirms the diagnosis.","pat":"","flag":false},{"id":1,"title":"Type IV cannot be transferred with serum antibody","cat":"D","t":"I1","sub":"","items":["28a:41","26:6","25:37"],"years":[2025,2026,2028],"n":3,"rule":"Types I to III are antibody driven so serum can transfer them. Type IV is carried by T cells, so serum antibody cannot transfer it.","pat":"2028 swaps the Roman numerals for mechanism names (IgE mediated, antibody mediated, immune complex mediated, T cell mediated).","flag":true},{"id":2,"title":"Type II hypersensitivity is characterized by cell lysis","cat":"D","t":"I1","sub":"","items":["28a:49","26:7","25:25"],"years":[2025,2026,2028],"n":3,"rule":"Type II antibodies (IgM or IgG) bind antigens on cell surfaces, leading to opsonization, complement activation and cell lysis.","pat":"The same four options rotate position every year: cell lysis, strong antibody reactions, leukotriene release, localized tissue reactions.","flag":false},{"id":10,"title":"Dermatomyositis: anti-Jo-1","cat":"D","t":"I2","sub":"","items":["28a:50","27a:103","25:35"],"years":[2025,2027,2028],"n":3,"rule":"Purple rash on sun-exposed skin and eyelids, proximal muscle weakness and dysphagia point to dermatomyositis, whose marker here is anti-Jo-1.","pat":"Identical vignette every year. The distractors are the markers of SLE (anti-dsDNA), CREST scleroderma (anticentromere) and diffuse scleroderma (Scl-70).","flag":false},{"id":16,"title":"20 cm retroperitoneal mass: liposarcoma","cat":"D","t":"N1","sub":"","items":["28a:15","27a:35","25:49"],"years":[2025,2027,2028],"n":3,"rule":"A huge deep soft tissue or retroperitoneal mass in an adult is the classic presentation of liposarcoma.","pat":"Same four options every year: melanoma, hamartoma, liposarcoma, lymphoma.","flag":false},{"id":58,"title":"Cysticercosis comes from ingesting Taenia solium ova","cat":"D","t":"ID7","sub":"","items":["28a:78","27a:60","26:35"],"years":[2026,2027,2028],"n":3,"rule":"Eating cysticerci in undercooked pork gives an intestinal tapeworm. Swallowing ova lets larvae disseminate and encyst in brain and muscle, which is cysticercosis.","pat":"The undercooked meat option is the constant trap.","flag":false},{"id":97,"title":"Sudden infant death syndrome: no abnormalities at autopsy","cat":"D","t":"UNC","sub":"Infancy and childhood","items":["28b:90","27b:27","26:51"],"years":[2026,2027,2028],"n":3,"rule":"SIDS is a diagnosis of exclusion after autopsy, scene examination and history all fail to give a cause.","pat":"","flag":false},{"id":99,"title":"Necrotizing enterocolitis","cat":"D","t":"UNC","sub":"Infancy and childhood","items":["28b:93","27b:31","26:53"],"years":[2026,2027,2028],"n":3,"rule":"Premature infant with abdominal distention, bloody stools and pneumatosis intestinalis has necrotizing enterocolitis.","pat":"","flag":false},{"id":102,"title":"Childhood malignancies tend to regress or differentiate spontaneously","cat":"D","t":"UNC","sub":"Infancy and childhood","items":["28b:95","27b:35","26:56"],"years":[2026,2027,2028],"n":3,"rule":"Childhood tumors are more primitive, arise in hematopoietic, nervous, soft tissue, bone and kidney sites, have improved cure rates, and may regress or differentiate spontaneously.","pat":"","flag":false},{"id":112,"title":"Buerger disease: thrombosis with microabscesses","cat":"D","t":"UNC","sub":"Blood vessels","items":["28a:83","27b:49","25:96"],"years":[2025,2027,2028],"n":3,"rule":"Young male smoker with gangrene of the extremities. The thrombus contains microabscesses.","pat":"","flag":false},{"id":115,"title":"Giant cell (temporal) arteritis","cat":"D","t":"UNC","sub":"Blood vessels","items":["28a:131","27b:43","25:103"],"years":[2025,2027,2028],"n":3,"rule":"Elderly patient with headache, visual symptoms and jaw claudication. Biopsy shows granulomatous inflammation of the media with giant cells and fragmented elastic lamina.","pat":"","flag":false},{"id":131,"title":"Pericarditis a few days after myocardial infarction","cat":"D","t":"UNC","sub":"Heart","items":["28a:95","27b:65","25:111"],"years":[2025,2027,2028],"n":3,"rule":"A friction rub days after a transmural infarct is fibrinous pericarditis according to the 2027 and 2028 keys.","pat":"2025 printed Serous. See the flag.","flag":true},{"id":12,"title":"Chronic rejection of the transplanted kidney","cat":"C","t":"I2","sub":"","items":["28a:54","27a:96","25:30"],"years":[2025,2027,2028],"n":3,"rule":"Chronic rejection occurs over months to years and is dominated by vascular changes with glomerulopathy, interstitial fibrosis and tubular atrophy.","pat":"2025 and 2028 give the biopsy and ask for the type. 2027 gives the type and asks for the histology.","flag":false},{"id":42,"title":"Diphtheria exotoxin","cat":"C","t":"ID3","sub":"","items":["28a:65","26:18","25:64"],"years":[2025,2026,2028],"n":3,"rule":"The exotoxin released at the site of attachment causes epithelial necrosis and a fibrinosuppurative pseudomembrane. Disseminated toxin causes diphtheritic myocarditis.","pat":"2028 moves from the local lesion to the disseminated toxin effect.","flag":false},{"id":47,"title":"Miliary pulmonary tuberculosis","cat":"C","t":"ID3","sub":"","items":["28a:70","27a:55","25:84"],"years":[2025,2027,2028],"n":3,"rule":"When organisms drain through lymphatics into venous blood and return to the lungs the result is miliary pulmonary TB. Spread through the systemic arteries gives systemic miliary TB.","pat":"Mechanism to name (2025), vignette to mechanism (2027), vignette to name (2028).","flag":false},{"id":59,"title":"Leishmaniasis forms","cat":"C","t":"ID7","sub":"","items":["28a:80","27a:61","26:34"],"years":[2026,2027,2028],"n":3,"rule":"Visceral leishmaniasis: fever, weight loss, hepatosplenomegaly, pancytopenia, amastigotes in marrow macrophages. Cutaneous leishmaniasis: a shallow ulcer with heaped-up borders that heals by itself.","pat":"Same Pakistani businessman vignette in 2026 and 2027, then the cutaneous form in 2028 with the same four options.","flag":false},{"id":140,"title":"KRAS","cat":"C","t":"N2","sub":"","items":["28a:24","27a:29","26:77"],"years":[2026,2027,2028],"n":3,"rule":"KRAS is an oncogene G-protein downstream of receptor tyrosine kinases. It is keyed for lung adenocarcinoma (2026), colorectal adenocarcinoma (2027) and RTK signalling (2028).","pat":"Same agent, different property each year.","flag":true},{"id":95,"title":"Galactosemia versus PKU","cat":"C","t":"UNC","sub":"Infancy and childhood","items":["28b:87","27b:23","26:49"],"years":[2026,2027,2028],"n":3,"rule":"Galactose-1-phosphate uridyltransferase deficiency gives vomiting and diarrhea with milk, jaundice, cataracts, delay and E. coli sepsis. PKU gives mental retardation without cataracts.","pat":"Cataracts are the answer clue for galactosemia and the distractor in the 2028 PKU item.","flag":false},{"id":114,"title":"Kawasaki disease: coronary artery aneurysm","cat":"C","t":"UNC","sub":"Blood vessels","items":["28a:88","27b:57","25:98"],"years":[2025,2027,2028],"n":3,"rule":"Acute febrile illness of early childhood with a predilection for the coronary arteries.","pat":"","flag":false},{"id":132,"title":"Calcific aortic stenosis of aging","cat":"C","t":"UNC","sub":"Heart","items":["28a:96","27b:67","25:112"],"years":[2025,2027,2028],"n":3,"rule":"Aortic stenosis in the elderly is dystrophic calcification from wear and tear.","pat":"","flag":false},{"id":133,"title":"Cardiac myxoma","cat":"C","t":"UNC","sub":"Heart","items":["28a:107","27b:66","25:114"],"years":[2025,2027,2028],"n":3,"rule":"Myxoma is the most common primary cardiac tumor of adults, usually left atrial, and can obstruct the mitral valve.","pat":"","flag":false},{"id":40,"title":"Epstein-Barr virus: infected cell versus proliferating cell","cat":"I","t":"ID2","sub":"","items":["28a:61","26:16","25:74"],"years":[2025,2026,2028],"n":3,"rule":"EBV infects B cells. The lymphadenopathy, splenomegaly and atypical lymphocytes are reactive T cells responding to them.","pat":"2025 and 2026 key T cells for the reactive proliferation. 2028 asks what the virus infects first and keys B lymphocytes.","flag":true},{"id":45,"title":"Leprosy: T cell immunity decides the histology","cat":"I","t":"ID3","sub":"","items":["27a:56","26:21","25:65"],"years":[2025,2026,2027],"n":3,"rule":"Tuberculoid leprosy has strong T cell immunity with granulomas and few bacilli. Lepromatous leprosy has weak TH1 immunity with lipid-laden macrophages packed with acid-fast bacilli.","pat":"Flips between the two poles and between direct and EXCEPT wording.","flag":false},{"id":98,"title":"Small for gestational age: proportionate versus disproportionate growth restriction","cat":"I","t":"UNC","sub":"Infancy and childhood","items":["28b:92","27b:30","26:52"],"years":[2026,2027,2028],"n":3,"rule":"Head-sparing (disproportionate) growth restriction points to placental causes such as single umbilical artery. Proportionate restriction points to fetal causes such as TORCH infection.","pat":"2028 changed one phrase in the stem (all measurements proportionately decreased) and the key moved from single umbilical artery to toxoplasmosis.","flag":false},{"id":11,"title":"Sjogren syndrome: anti-SS-A (Ro) and anti-SS-B (La)","cat":"D","t":"I2","sub":"","items":["27a:101","27a:102","25:36"],"years":[2025,2027],"n":3,"rule":"Sjogren syndrome is diagnosed with anti-SS-A (Ro) and anti-SS-B (La). Its most serious complication is non-Hodgkin (MALT) lymphoma.","pat":"","flag":false},{"id":17,"title":"Invasion is the feature that proves malignancy","cat":"D","t":"N1","sub":"","items":["28a:12","27a:31","27b:13"],"years":[2027,2028],"n":3,"rule":"Pleomorphism, atypia and a high N/C ratio suggest malignancy, but invasion (and metastasis) establishes it.","pat":"2028 re-dresses it as a follicular thyroid tumor where capsular invasion is the answer.","flag":false},{"id":21,"title":"Multiple liver masses with central necrosis: metastatic advanced stage","cat":"D","t":"N1","sub":"","items":["28a:112","28a:17","27a:38"],"years":[2027,2028],"n":3,"rule":"Multiple masses with central necrosis indicate metastatic disease. The centre outgrows its blood supply.","pat":"","flag":false},{"id":82,"title":"Hypersegmented neutrophils in megaloblastic anemia","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:92","27b:19","26:95"],"years":[2026,2027],"n":3,"rule":"Hypersegmented neutrophils mark megaloblastic anemia. Dohle bodies go with infection, smudge cells with CLL, Heinz bodies with G6PD deficiency.","pat":"","flag":false},{"id":87,"title":"Auer rods and myeloperoxidase: acute myelogenous leukemia","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:88","27b:18","26:97"],"years":[2026,2027],"n":3,"rule":"Myeloperoxidase marks myeloid blasts. PAS and TdT mark lymphoid tumors and non-specific esterase marks monocytic ones.","pat":"","flag":false},{"id":6,"title":"Hemolytic disease of the newborn: antibody to cell surface (Type II)","cat":"C","t":"I1","sub":"","items":["27a:106","25:28","25:34"],"years":[2025,2027],"n":3,"rule":"Maternal IgG against fetal red cell surface antigens crosses the placenta and destroys fetal red cells. This is Type II, antibody to cell surface with complement mediated destruction.","pat":"2025 asks the mechanism directly twice. 2027 hides it in a hydrops fetalis vignette.","flag":false},{"id":27,"title":"RB and the two-hit mechanism","cat":"C","t":"N2","sub":"","items":["28a:116","28a:14","27a:34"],"years":[2027,2028],"n":3,"rule":"RB is the classic two-hit tumor suppressor. One inherited mutant allele plus loss of the second allele removes the G1 to S checkpoint and produces retinoblastoma in childhood.","pat":"Asked as the tumor (2027), as the gene (2028) and as the theory (2028 projection).","flag":false},{"id":49,"title":"Chancroid (soft chancre) from Haemophilus ducreyi","cat":"C","t":"ID3","sub":"","items":["28a:123","28a:67","25:78"],"years":[2025,2028],"n":3,"rule":"H. ducreyi causes a painful, soft, ragged genital ulcer with a gray-yellow exudate and tender nodes. Soft chancre is the standing distractor in the hard chancre items.","pat":"","flag":false},{"id":52,"title":"Tertiary syphilis: gumma","cat":"C","t":"ID4","sub":"","items":["28a:124","28a:69","27a:46"],"years":[2027,2028],"n":3,"rule":"The gumma of benign tertiary syphilis is a granulomatous lesion with a necrotic centre, palisading macrophages and plasma cells.","pat":"","flag":false},{"id":139,"title":"Leiomyoma: benign, firm, well circumscribed","cat":"C","t":"N1","sub":"","items":["28a:111","27a:39","27b:14"],"years":[2027,2028],"n":3,"rule":"Leiomyoma is the benign smooth muscle tumor of the uterus: firm, solid, sharply circumscribed, with no infiltrating border.","pat":"2027 asks for the diagnosis twice (LE2 and LE3). The 2028 projection item shows the tumor and asks which feature marks it as benign.","flag":false},{"id":75,"title":"Patterns of necrosis","cat":"C","t":"UNC","sub":"LE1 recall","items":["27a:2","27b:1","25:14"],"years":[2025,2027],"n":3,"rule":"Coagulative necrosis preserves cell outlines and is the pattern of infarcts outside the brain. Caseous necrosis is amorphous granular debris in tuberculosis. Liquefactive necrosis is seen in brain and abscesses.","pat":"","flag":false},{"id":85,"title":"Thalassemia: microcytic hypochromic with target cells, raised HbF","cat":"C","t":"UNC","sub":"RBC/WBC disorders","items":["27a:66","27a:69","26:82"],"years":[2026,2027],"n":3,"rule":"Defective globin synthesis gives microcytic hypochromic red cells, target cells and basophilic stippling. Beta thalassemia raises HbA2 and HbF.","pat":"","flag":false},{"id":86,"title":"Intravascular hemolysis markers","cat":"C","t":"UNC","sub":"RBC/WBC disorders","items":["27a:87","26:86","26:92"],"years":[2026,2027],"n":3,"rule":"Intravascular hemolysis gives hemoglobinuria, methemoglobinemia and DECREASED haptoglobin.","pat":"","flag":false},{"id":89,"title":"Chronic myelogenous leukemia: clinical and lab picture","cat":"C","t":"UNC","sub":"RBC/WBC disorders","items":["27a:84","27a:93","26:106"],"years":[2026,2027],"n":3,"rule":"Very high WBC with all stages of myeloid maturation, blasts under 20 percent, marked splenomegaly and a LOW leukocyte alkaline phosphatase score.","pat":"","flag":false},{"id":92,"title":"Reed-Sternberg cell and Hodgkin lymphoma","cat":"C","t":"UNC","sub":"RBC/WBC disorders","items":["27a:77","26:100","26:107"],"years":[2026,2027],"n":3,"rule":"Hodgkin lymphoma requires Reed-Sternberg cells, which are B lineage, CD15 and CD30 positive, multinucleated and a minority of the cells in the node.","pat":"","flag":false},{"id":104,"title":"Oligohydramnios (Potter) sequence","cat":"C","t":"UNC","sub":"Infancy and childhood","items":["28b:88","28b:89","27b:29"],"years":[2027,2028],"n":3,"rule":"Bilateral renal agenesis causes oligohydramnios, which deforms the fetus: flattened facies, positional limb defects and hypoplastic lungs.","pat":"","flag":false},{"id":106,"title":"ARDS: hyaline membranes (diffuse alveolar damage)","cat":"C","t":"UNC","sub":"Lung pathology","items":["27b:85","27b:87","26:63"],"years":[2026,2027],"n":3,"rule":"Acute lung injury shows hyaline membranes lining alveoli with epithelial necrosis and neutrophils.","pat":"","flag":false},{"id":117,"title":"c-ANCA: Wegener granulomatosis","cat":"C","t":"UNC","sub":"Blood vessels","items":["28a:82","28a:93","27b:48"],"years":[2027,2028],"n":3,"rule":"Cytoplasmic ANCA points to Wegener granulomatosis.","pat":"","flag":false},{"id":128,"title":"Myocardial infarct around day 4","cat":"C","t":"UNC","sub":"Heart","items":["27b:64","25:106","25:115"],"years":[2025,2027],"n":3,"rule":"At 3 to 7 days the infarct shows necrotic muscle with neutrophils giving way to macrophages. Granulation tissue appears from day 7 to 10.","pat":"","flag":true},{"id":144,"title":"Squamous cell carcinoma of the lung","cat":"C","t":"UNC","sub":"Lung pathology","items":["27b:93","26:80","26:81"],"years":[2026,2027],"n":3,"rule":"Central tumor of smokers with intercellular bridges, preceded by squamous metaplasia and dysplasia, with TP53 and CDKN2A mutations.","pat":"","flag":false},{"id":15,"title":"Amyloid: properties and types","cat":"I","t":"I2","sub":"","items":["28a:118","28a:55","27a:104"],"years":[2027,2028],"n":3,"rule":"Amyloid is extracellular misfolded protein in beta-pleated sheets that stains with Congo red. AA protein is the reactive (secondary) type seen with chronic inflammation. Transthyretin deposits in the heart in senile systemic amyloidosis.","pat":"AA protein is a distractor in 2027 and the keyed answer in 2028.","flag":false},{"id":54,"title":"Monkeypox transmission","cat":"I","t":"UNC","sub":"Monkeypox is not in the PTH LEC set","items":["27a:57","27b:17","25:83"],"years":[2025,2027],"n":3,"rule":"Monkeypox spreads by close contact with lesions, respiratory secretions and contaminated materials. It is not mosquito borne.","pat":"Always an EXCEPT item. The false option changes.","flag":false},{"id":76,"title":"Sex chromosome karyotypes","cat":"I","t":"UNC","sub":"LE1 recall","items":["27b:10","27b:9","26:5"],"years":[2026,2027],"n":3,"rule":"Klinefelter is 47,XXY and Turner is 45,X. Each appears as the other's distractor.","pat":"","flag":false},{"id":3,"title":"Antibody classes in Type II hypersensitivity: IgM and IgG","cat":"D","t":"I1","sub":"","items":["28a:48","25:39"],"years":[2025,2028],"n":2,"rule":"Type II reactions use IgM and IgG. IgE belongs to Type I.","pat":"","flag":false},{"id":4,"title":"Effector molecules of Type IV hypersensitivity: cytokines","cat":"D","t":"I1","sub":"","items":["28a:46","25:26"],"years":[2025,2028],"n":2,"rule":"In Type IV reactions CD4+ T cells release cytokines and CD8+ T cells kill directly. Antibodies and complement are not the effectors.","pat":"","flag":false},{"id":8,"title":"HBV hepatocyte injury: CD8+ T cells recognising peptide on MHC class I","cat":"D","t":"I1","sub":"","items":["27a:107","25:40"],"years":[2025,2027],"n":2,"rule":"Infected hepatocytes display viral peptide on MHC class I. CD8+ cytotoxic T cells recognise it and kill the cell. MHC class II is limited to antigen presenting cells and antibodies do not lyse the hepatocytes.","pat":"","flag":false},{"id":18,"title":"Interpreting Grade 1 Stage 1 carcinoma","cat":"D","t":"N1","sub":"","items":["28a:13","27a:32"],"years":[2027,2028],"n":2,"rule":"Grade describes differentiation and stage describes extent. Grade 1 is well differentiated and stage 1 is localized.","pat":"Identical stem and choices, different printed keys. See the discrepancy flag.","flag":true},{"id":19,"title":"TNM staging: 4.5 cm breast mass, axillary nodes, lung nodules","cat":"D","t":"N1","sub":"","items":["28a:27","27a:30"],"years":[2027,2028],"n":2,"rule":"T grows with size and local invasion, N records regional nodes, M records distant spread. Large primary plus axillary nodes plus lung nodules is T4N1M1.","pat":"","flag":false},{"id":20,"title":"Carcinomas spread first through lymphatics","cat":"D","t":"N1","sub":"","items":["28a:16","27a:37"],"years":[2027,2028],"n":2,"rule":"Carcinomas typically metastasize first by lymphatics while sarcomas favour the hematogenous route.","pat":"","flag":false},{"id":22,"title":"Pigmented spindle cell nodule, vimentin positive: melanoma","cat":"D","t":"N1","sub":"","items":["28a:18","27a:40"],"years":[2027,2028],"n":2,"rule":"A darkly pigmented raised nodule with pigmented spindle cells that are vimentin positive is melanoma, a malignant tumor despite the -oma suffix.","pat":"","flag":false},{"id":23,"title":"Soft movable subcutaneous forearm mass: lipoma","cat":"D","t":"N1","sub":"","items":["28a:29","27a:41"],"years":[2027,2028],"n":2,"rule":"A soft, movable, painless subcutaneous mass that stays the same size for years is a lipoma.","pat":"","flag":false},{"id":24,"title":"Good prognosis in breast cancer: no nodal metastasis","cat":"D","t":"N1","sub":"","items":["28a:20","27a:28"],"years":[2027,2028],"n":2,"rule":"Absence of metastasis in sampled axillary nodes means the tumor has not left the primary site, which is the best prognostic sign among the options.","pat":"","flag":false},{"id":25,"title":"Vinyl chloride and hepatic angiosarcoma","cat":"D","t":"N1","sub":"","items":["27a:33","25:51"],"years":[2025,2027],"n":2,"rule":"Vinyl chloride exposure in plastic pipe manufacture causes angiosarcoma of the liver. Vimentin positive and cytokeratin negative marks a sarcoma.","pat":"","flag":false},{"id":26,"title":"Growth fraction predicts chemotherapy response","cat":"D","t":"N2","sub":"","items":["28a:19","27a:44"],"years":[2027,2028],"n":2,"rule":"Chemotherapy targets dividing cells, so a low growth fraction predicts a diminished response.","pat":"","flag":false},{"id":28,"title":"CDKN2 hypermethylation: epigenetic silencing","cat":"D","t":"N2","sub":"","items":["28a:30","27a:43"],"years":[2027,2028],"n":2,"rule":"DNA hypermethylation silences a gene without changing its sequence. That is an epigenetic alteration.","pat":"","flag":false},{"id":56,"title":"Endemic mycoses are caused by dimorphic fungi","cat":"D","t":"ID6","sub":"","items":["26:31","25:93"],"years":[2025,2026],"n":2,"rule":"Dimorphic fungi (Blastomyces, Histoplasma, Coccidioides, Sporothrix) cause serious systemic disease even in healthy hosts.","pat":"","flag":false},{"id":63,"title":"Bisphenol A is an endocrine disruptor","cat":"D","t":"ENV","sub":"","items":["27a:17","26:38"],"years":[2026,2027],"n":2,"rule":"BPA, used in polycarbonate containers and epoxy resins, is a potential endocrine disruptor.","pat":"","flag":false},{"id":65,"title":"Sun exposure redness: vasodilation","cat":"D","t":"UNC","sub":"LE1 recall","items":["27b:4","25:1"],"years":[2025,2027],"n":2,"rule":"Redness (rubor) after sun exposure is hyperemia from vasodilation.","pat":"","flag":false},{"id":67,"title":"Diabetes mellitus is polygenic: severity follows the number of deleterious genes","cat":"D","t":"UNC","sub":"LE1 recall","items":["27a:9","25:16"],"years":[2025,2027],"n":2,"rule":"Multigenic disorders show a dosage effect and cluster in families without Mendelian transmission.","pat":"","flag":false},{"id":68,"title":"Pain in inflammation: prostaglandin and bradykinin","cat":"D","t":"UNC","sub":"LE1 recall","items":["27a:4","26:1"],"years":[2026,2027],"n":2,"rule":"Prostaglandin and bradykinin mediate pain. Histamine and serotonin mainly increase vascular permeability. C3b is an opsonin.","pat":"","flag":false},{"id":69,"title":"Angiogenesis in repair: fibroblast growth factor","cat":"D","t":"UNC","sub":"LE1 recall","items":["28a:3","25:18"],"years":[2025,2028],"n":2,"rule":"Among the listed substances FGF (with VEGF) stimulates new capillary formation.","pat":"","flag":false},{"id":78,"title":"Polycythemia vera: JAK2 mutation","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:65","26:96"],"years":[2026,2027],"n":2,"rule":"Raised cell counts with low erythropoietin mean erythropoietin-independent growth from a JAK2 mutation.","pat":"","flag":false},{"id":79,"title":"Microcytic hypochromic anemia in a child with low reticulocytes: iron deficiency","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:73","26:87"],"years":[2026,2027],"n":2,"rule":"Low MCV and MCHC with a low reticulocyte count and no splenomegaly points to a nutritional cause, iron deficiency.","pat":"","flag":false},{"id":80,"title":"Iron deficiency: the lab finding that does NOT fit","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:82","26:90"],"years":[2026,2027],"n":2,"rule":"Iron deficiency lowers ferritin and marrow iron and RAISES total iron binding capacity.","pat":"","flag":false},{"id":81,"title":"Alcoholic with megaloblastic anemia and no neurologic deficit: homocysteine","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:78","26:88"],"years":[2026,2027],"n":2,"rule":"Folate deficiency raises homocysteine only. B12 deficiency also raises methylmalonic acid and gives neurologic signs.","pat":"","flag":false},{"id":83,"title":"Painter with pancytopenia: aplastic anemia, fatty marrow","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:79","26:89"],"years":[2026,2027],"n":2,"rule":"Pancytopenia with a low reticulocyte count is aplastic anemia. The marrow is replaced by fat.","pat":"","flag":false},{"id":93,"title":"Red tender node draining an infection: acute lymphadenitis","cat":"D","t":"UNC","sub":"RBC/WBC disorders","items":["27a:68","26:105"],"years":[2026,2027],"n":2,"rule":"A painful red node draining a suppurative focus is acute lymphadenitis. Lymphoma nodes are painless.","pat":"","flag":false},{"id":94,"title":"Leading cause of infant death: congenital anomalies","cat":"D","t":"UNC","sub":"Infancy and childhood","items":["27b:21","26:48"],"years":[2026,2027],"n":2,"rule":"In infants under 1 year congenital malformations rank first, then prematurity and low birth weight, then SIDS.","pat":"","flag":false},{"id":96,"title":"Adrenal small round blue cell tumor with rosettes: neuroblastoma","cat":"D","t":"UNC","sub":"Infancy and childhood","items":["27b:25","26:50"],"years":[2026,2027],"n":2,"rule":"A young child with an adrenal mass of small round blue cells arranged around a central space has neuroblastoma.","pat":"","flag":false},{"id":101,"title":"WAGR syndrome","cat":"D","t":"UNC","sub":"Infancy and childhood","items":["27b:34","26:55"],"years":[2026,2027],"n":2,"rule":"Wilms tumor, Aniridia, Genital anomalies and mental Retardation.","pat":"","flag":false},{"id":103,"title":"Stillbirth with chorioamnionitis: Group B Streptococcus","cat":"D","t":"UNC","sub":"Infancy and childhood","items":["28b:91","27b:28"],"years":[2027,2028],"n":2,"rule":"Ascending (transcervical) infection with chorioamnionitis is most often Group B Streptococcus.","pat":"","flag":false},{"id":105,"title":"Pulmonary edema from microvascular injury: bacterial pneumonia","cat":"D","t":"UNC","sub":"Lung pathology","items":["27b:100","26:62"],"years":[2026,2027],"n":2,"rule":"Infection injures the alveolar wall directly. Heart failure, volume overload and cirrhosis cause hemodynamic edema.","pat":"","flag":false},{"id":107,"title":"Sarcoidosis: non-caseating granulomas with asteroid bodies","cat":"D","t":"UNC","sub":"Lung pathology","items":["27b:88","26:76"],"years":[2026,2027],"n":2,"rule":"Hilar lymphadenopathy, reticulonodular infiltrates and non-caseating granulomas with asteroid or Schaumann bodies.","pat":"","flag":false},{"id":108,"title":"Emphysema of smokers is centriacinar","cat":"D","t":"UNC","sub":"Lung pathology","items":["27b:86","26:68"],"years":[2026,2027],"n":2,"rule":"Centriacinar (centrilobular) emphysema is the smoker's type and favours upper lobes. Panacinar goes with alpha-1 antitrypsin deficiency.","pat":"","flag":false},{"id":116,"title":"Takayasu arteritis","cat":"D","t":"UNC","sub":"Blood vessels","items":["28a:87","27b:56"],"years":[2027,2028],"n":2,"rule":"Young Asian woman with weak upper limb pulses and narrowing of the aortic arch branches has Takayasu arteritis.","pat":"Same vignette. 2028 prints a different key. See the flag.","flag":true},{"id":118,"title":"Polyarteritis nodosa and hepatitis B","cat":"D","t":"UNC","sub":"Blood vessels","items":["28a:90","27b:60"],"years":[2027,2028],"n":2,"rule":"Polyarteritis nodosa is associated with hepatitis B infection.","pat":"","flag":false},{"id":119,"title":"Abdominal aortic aneurysm: atherosclerosis","cat": mark of SLE is production of antinuclear antibodies, so ANA is the screening test. The 2028 feedback lists the homogeneous pattern as the one commonly seen in SLE.","pat":"","flag":false},{"id":30,"title":"Burkitt lymphoma: t(8;14), c-MYC, starry sky","cat":"C","t":"N2","sub":"","items":["28a:25","27a:91"],"years":[2027,2028],"n":2,"rule":"Burkitt lymphoma carries t(8;14) with MYC deregulation and shows a starry sky pattern. t(8;14) and c-myc also recur as distractors in the 2026 leukemia items.","pat":"","flag":false},{"id":34,"title":"Environmental factors dominate cancer causation","cat":"C","t":"N2","sub":"","items":["28a:23","25:57"],"years":[2025,2028],"n":2,"rule":"Most cancers are sporadic and environmentally driven. Bronchogenic carcinoma from smoking is the stock example, while familial retinoblastoma and Li-Fraumeni are inherited.","pat":"","flag":false},{"id":43,"title":"Staphylococcal exfoliative toxin: split at the granular layer","cat":"C","t":"ID3","sub":"","items":["27a:51","25:70"],"years":[2025,2027],"n":2,"rule":"Exfoliative toxins cleave desmoglein so the epidermis separates at the stratum granulosum. Localized disease is bullous impetigo and widespread disease is scalded skin syndrome.","pat":"Desquamation at the granular layer also appears as a distractor in the 2026 chickenpox item.","flag":false},{"id":44,"title":"Pseudomonas pneumonia: organisms in vessel walls","cat":"C","t":"ID3","sub":"","items":["26:28","25:71"],"years":[2025,2026],"n":2,"rule":"Pseudomonas necrotizing pneumonia shows gram-negative bacilli invading vessel walls (perivascular blue haze) with thrombosis and hemorrhage.","pat":"Pertussis (organisms entangled in cilia) is the standing distractor and was itself keyed in 2025 Q73.","flag":false},{"id":48,"title":"Mycobacteria in AIDS: acid-fast bacilli within macrophages, no granulomas","cat":"C","t":"ID3","sub":"","items":["27a:54","25:85"],"years":[2025,2027],"n":2,"rule":"Without CD4+ T cell help granulomas do not form. Ma   pop.innerHTML=`<label class="all"><input type="checkbox" data-all="1"> ${allLabel}</label>`+items.map(([v,l])=>`<label><input type="checkbox" value="${v}"> ${esc(l)}</label>`).join('');
  pop.addEventListener('change',e=>{const c=e.target;
    if(c.dataset.all){ if(c.checked){items.forEach(([v])=>set.add(v))} else {set.clear()} }
    else { const v=isNaN(c.value)?c.value:+c.value; c.checked?set.add(v):set.delete(v) }
    syncMS();renderMain();});
}
function syncMS(){
  [['#popY',st.years,YEARS.length,'#btnY','Years','All Years'],['#popT',st.topics,usedTopics.length,'#btnT','Topics','All Topics']].forEach(([p,set,n,b,w,al])=>{
    document.querySelectorAll(p+' input').forEach(c=>{ if(c.dataset.all) c.checked=set.size===n; else c.checked=set.has(isNaN(c.value)?c.value:+c.value) });
    $(b).textContent=set.size===n?al:set.size===0?`No ${w.toLowerCase()} selected`:set.size===1?[...set].map(v=>T[v]||v)[0]:`${set.size} ${w.toLowerCase()}`;
  });
}
buildMS($('#popY'),YEARS.map(y=>[y,String(y)]),st.years,'All Years');
buildMS($('#popT'),usedTopics.map(t=>[t,T[t]]),st.topics,'All Topics');
document.addEventListener('click',e=>{document.querySelectorAll('.ms').forEach(m=>{ if(m.contains(e.target)){ if(e.target.closest('.ms>button')) m.classList.toggle('open') } else m.classList.remove('open') })});
// ---------- rendering pieces
const TAG={own:'source feedback',bor:'from ',gen:'project sources',none:'no source rationale'};
function choiceList(q){return `<ol class="cho">${q.c.map(([l,t])=>`<li class="${q.ks.includes(l)?'k':''}">${l}. ${esc(t)}${q.ks.includes(l)?' ✓':''}</li>`).join('')}</ol>`}
function ratList(q){
  let h=q.c.map(([l,t],k)=>{const r=q.r[k],isk=q.ks.includes(l);
    return `<p class="rl ${isk?'k':''} ${r[1]==='none'?'none':''}"><span class="lab">${l}. ${esc(t)} — ${isk?'<span class="ok">Correct ✓</span>':'<span class="no">Incorrect.</span>'}</span> <span class="tx">${esc(r[0])}</span><span class="tag">[${TAG[r[1]]}${r[1]==='bor'?esc(r[2]):''}]</span></p>`}).join('');
  if(!q.c.length) h=`<p class="rl none">Options could not be separated for this item.</p>`;
  if(q.bm) h+=`<div class="inf">The source PDF gives one rationale block for this item rather than a rationale per option. Where the block names the options it was split across them, otherwise it is attached to the keyed option. The full block is shown below.</div>`;
  if(q.orig) h+=`<details class="orig"><summary>Original PDF Rationale</summary>${esc(q.orig)}</details>`;
  if(q.ref) h+=`<div class="reflink">Source reference: ${esc(q.ref)}</div>`;
  return h;
}
function notes(q){return (q.flag?`<div class="warn">${esc(q.flag)}</div>`:'')+(q.note?`<div class="inf">${esc(q.note)}</div>`:'')}
function keyTxt(q){return q.k?esc(q.k):'none printed'}
function famBody(f){
  let h=`<div class="rule"><i>Master rule</i>${esc(f.rule)}</div>`;
  if(f.pat) h+=`<div class="pat"><i>Examiner pattern</i>${esc(f.pat)}</div>`;
  if(f.t==='UNC') h+=`<div class="inf">Uncategorized: ${esc(f.sub||'no PTH LEC lecture covers this subject')}. Rationales here rely on the uploaded exam feedback only.</div>`;
  h+=`<div class="tw"><table class="ft"><thead><tr><th>Source</th><th>Question and complete choices</th><th>Key</th><th>Choice-by-choice rationale</th></tr></thead><tbody>`;
  f.items.forEach(i=>{const q=Q[i];h+=`<tr><td class="src">${esc(q.ex.replace(' LE',' · LE'))} Q${q.n}<small>PDF page ${q.p}</small></td><td><p class="stem">${esc(q.s)}</p>${choiceList(q)}${notes(q)}</td><td class="key">${keyTxt(q)}</td><td>${ratList(q)}</td></tr>`});
  return h+`</tbody></table></div>`;
}
function bankBody(q){
  const fl=q.f.length?`<div class="inf">Part of repeat famil${q.f.length>1?'ies':'y'}: ${q.f.map(id=>esc(F.find(f=>f.id===id).title)).join(' · ')}</div>`:'';
  return `${notes(q)}<div class="qwrap"><div><p class="stem">${esc(q.s)}</p>${choiceList(q)}<p class="key" style="margin:6px 0 0">Printed key: ${keyTxt(q)}</p></div><div>${ratList(q)}</div></div>${fl}`;
}
function card(id,head,metaHtml){const o=st.open.has(id);return `<section class="card ${o?'open':''}" data-id="${id}"><button class="ch" type="button" aria-expanded="${o}"><span class="car">▶</span><span class="ttl">${head}<span class="meta">${metaHtml}</span></span></button><div class="body">${o?bodyFor(id):''}</div></section>`}
function bodyFor(id){return id[0]==='f'?famBody(F.find(f=>'f'+f.id===id)):bankBody(Q[id.slice(1)])}
let visible=[];
function renderMain(){
  const m=$('#main');visible=[];let h='';
  if(st.tab==='radar'){ 
    h=`<p class="subt" style="margin:4px 0 10px">Every concept found in more than one class year across all six PDFs, with its coverage in this build. Rows with a lighter left edge are two-year concepts. Click a covered row to filter to its topic.</p><div class="tw"><table class="rad"><thead><tr><th>Years</th><th>Concept</th><th>Topic</th><th>#</th><th>Coverage in this build</th></tr></thead><tbody>`+
    R.map((r,i)=>`<tr class="${r.go?'go':'inert'} ${r.ny<=2?'two':''}" data-i="${i}"><td>${esc(r.y)}</td><td>${esc(r.c)}</td><td>${topicBadge(r.t,r.sub)}</td><td><span class="ny">${r.ny}</span></td><td>${esc(r.st)}</td></tr>`).join('')+`</tbody></table></div>`;
    m.innerHTML=h;$('#count').textContent=R.length+' concepts';$('#tog').style.visibility='hidden';return;
  }
  $('#tog').style.visibility='visible';
  if(st.tab==='bank'){
    const ids=DATA.bank.filter(i=>st.years.has(Q[i].y)&&st.topics.has(Q[i].t));
    let cur='';
    ids.forEach(i=>{const q=Q[i];if(q.ex!==cur){cur=q.ex;const n=ids.filter(j=>Q[j].ex===cur).length;h+=`<div class="yh">${esc(cur)} <span>${n} question${n!==1?'s':''} shown</span></div>`}
      visible.push('q'+i);
      h+=card('q'+i,`<span class="q"><b style="display:inline">Q${q.n}.</b> ${esc(q.s.length>170?q.s.slice(0,170)+'…':q.s)}</span>`,`${topicBadge(q.t,q.sub)}<span class="bd">Key ${keyTxt(q)}</span>${q.f.length?'<span class="bd cat">repeat family</span>':''}${q.flag?'<span class="bd flag">⚠ key flag</span>':''}${q.bm?'<span class="bd">block rationale</span>':''}`)});
    if(!ids.length) h=`<div class="empty">No bank questions match the selected years and topics. The bank holds 2027 and 2028 only.</div>`;
    $('#count').textContent=ids.length+' of '+DATA.bank.length+' questions';
  } else {
    const fs=famsFor(st.tab).filter(f=>st.topics.has(f.t)&&f.years.some(y=>st.years.has(y)));
    fs.forEach(f=>{visible.push('f'+f.id);
      h+=card('f'+f.id,`<b>${esc(f.title)}</b>`,`<span class="bd cnt">${f.n}× asked</span>${f.years.map(y=>`<span class="bd yr">${y}</span>`).join('')}<span class="bd cat">${CAT[f.cat]}</span>${topicBadge(f.t,f.sub)}${f.flag?'<span class="bd flag">⚠ key discrepancy</span>':''}`)});
    if(!fs.length) h=`<div class="empty">No families match the selected years and topics.</div>`;
    $('#count').textContent=fs.length+' of '+famsFor(st.tab).length+' families';
  }
  m.innerHTML=h;syncTog();
}
function syncTog(){const all=visible.length&&visible.every(id=>st.open.has(id));$('#tog').textContent=all?'Collapse All':'Expand All'}
$('#main').addEventListener('click',e=>{
  const row=e.target.closest('tr.go');
  if(row){const r=R[+row.dataset.i];st.topics=new Set([r.t]);st.years=new Set(YEARS);rebindSets();st.tab=r.go==='fam'?'all':'bank';render();window.scrollTo({top:$('.bar').offsetTop});return}
  const b=e.target.closest('.ch');if(!b)return;const c=b.parentElement,id=c.dataset.id;
  if(st.open.has(id)){st.open.delete(id);c.classList.remove('open')}else{st.open.add(id);c.classList.add('open');const bd=c.querySelector('.body');if(!bd.innerHTML)bd.innerHTML=bodyFor(id)}
  b.setAttribute('aria-expanded',st.open.has(id));syncTog();
});
function rebindSets(){ // multiselect handlers hold references to the original sets, so mutate in place
}
$('#tog').addEventListener('click',()=>{const all=visible.length&&visible.every(id=>st.open.has(id));visible.forEach(id=>all?st.open.delete(id):st.open.add(id));renderMain()});
function render(){renderTabs();syncMS();renderMain()}
// make radar click mutate the same Set objects used by the multiselects
(function(){const Y=st.years,Tp=st.topics;Object.defineProperty(st,'years',{get:()=>Y,set:v=>{Y.clear();v.forEach(x=>Y.add(x))}});Object.defineProperty(st,'topics',{get:()=>Tp,set:v=>{Tp.clear();v.forEach(x=>Tp.add(x))}})})();
render();
</script>
