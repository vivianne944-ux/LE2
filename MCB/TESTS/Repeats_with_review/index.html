dae</b></td><td>linear dsDNA</td><td>enveloped</td><td><b>complex</b></td><td>I</td><td>variola, vaccinia, monkeypox, molluscum contagiosum</td></tr></tbody></table></div><h5>The other DNA-virus rules from Table 19</h5><ul class=\"l1\"><li>All DNA viruses are double-stranded <b>except</b> <b>Parvoviridae</b>.</li><li>All replicate in the nucleus <b>except</b> <b>Poxviridae</b>, which carry their own enzymes and replicate in the <b>cytoplasm</b>.</li><li>DNA viruses fall in Baltimore groups I, II and VII.<ul class=\"l2\"><li>There are no negative-strand DNA viruses.</li></ul></li><li>Most have linear genomes.<ul class=\"l2\"><li>The circular ones are papilloma, polyoma and hepadna.</li></ul></li><li><b>Mnemonic for group I:</b> HAPPPy (Herpes, Adeno, Papilloma, Pox, Polyoma).</li></ul><p class=\"rsrc\">Source: MCB 2.01 III.D Capsid, X Classification, Tables 15 and 19</p>","2028-9":"<h5>How oncogenic viruses cause cancer</h5><ul class=\"l1\"><li>In 2.01 this is the \"viral transformation\" type of persistent infection: the virus or a viral gene product induces unregulated cell growth that forms a tumor.<ul class=\"l2\"><li>2.06 then explains the molecular mechanisms.</li></ul></li><li><b>Direct-acting viruses integrate into the host genome and disrupt or activate cellular genes</b>, or produce oncoproteins that bind and inactivate tumor suppressors.<ul class=\"l2\"><li>Indirect-acting viruses cause <b>chronic</b> inflammation, necrosis and regeneration (<b>hepatitis B</b> and C) or immunosuppression (<b>HIV</b>) that predisposes to cancer.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Mechanism</th><th>Tumor</th></tr></thead><tbody><tr><td><b>HPV 16 and 18</b></td><td><ul class=\"cl\"><li>E6 degrades p53, E7 binds pRb and releases E2F</li><li>DNA integrated in cancer cells</li></ul></td><td>cervical, anal, penile, vulvar, oropharyngeal carcinoma</td></tr><tr><td><b>SV40 and polyomaviruses</b></td><td>large T antigen binds both p53 and pRb, small t targets PP2A</td><td>model tumor virus, Merkel cell carcinoma (Merkel cell virus, clonally integrated)</td></tr><tr><td><b>Adenovirus</b></td><td>E1A binds pRb, E1B-55k binds p53</td><td>animal tumors</td></tr><tr><td><b>EBV</b></td><td>LMP1 behaves as a permanently switched-on growth receptor (NF-κB, MAPK), EBNA1 keeps B cells immortalized</td><td>Burkitt lymphoma, nasopharyngeal carcinoma, Hodgkin disease, post-transplant lymphoproliferative disease</td></tr><tr><td><b>HHV-8</b></td><td>latency in endothelial cells</td><td>Kaposi sarcoma, primary effusion lymphoma</td></tr><tr><td><b>Hepatitis B</b></td><td>persistent infection with necrosis, inflammation and regeneration, plus the X transactivator protein and aflatoxin as cofactor</td><td>hepatocellular carcinoma</td></tr><tr><td><b>Hepatitis C</b></td><td>chronic inflammation and cirrhosis</td><td>hepatocellular carcinoma in 1 to 5% of chronic carriers</td></tr><tr><td><b>HTLV-1</b></td><td>Tax transregulator, no oncogene</td><td>adult T-cell leukemia-lymphoma</td></tr><tr><td><b>Acute transforming retroviruses</b></td><td>carry a host-derived oncogene</td><td>sarcomas and leukemias in animals</td></tr><tr><td><b>HIV</b></td><td>immunosuppression only, not transforming</td><td>Kaposi sarcoma, lymphomas, cervical cancer via other viruses</td></tr></tbody></table></div><h5>General principles from 2.06</h5><ul class=\"l1\"><li>Proto-oncogenes normally regulate growth and become oncogenes when mutated, overexpressed or placed next to a viral promoter.<ul class=\"l2\"><li>Tumor suppressors are negative regulators and both alleles must be lost (Rb loss gives retinoblastoma, <b>p53</b> is mutated in half of all cancers).</li></ul></li><li>Tumor viruses establish persistent infection, act after long latent periods, are usually cofactors that are necessary but not sufficient, vary in oncogenic potential between strains, leave viral markers in tumor cells, and one virus can cause more than one tumor.<ul class=\"l2\"><li>About 15 to 20% of human tumors have a viral cause.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.01 VII.C Persistent Infection, MCB 2.06 IV Human Cancer Viruses, Tables 10, 11, 16, 17</p>","POX":"<h5>Poxviridae, the DNA virus that breaks the rules</h5><ul class=\"l1\"><li>The general rule is that DNA viruses replicate in the nucleus because they borrow the host DNA-dependent RNA polymerase.<ul class=\"l2\"><li><b>Poxviruses complete the entire multiplication cycle in the cytoplasm</b> because the virion carries all its own enzymes, including a viral DNA-dependent RNA polymerase, DNA polymerase and thymidine kinase.</li></ul></li><li>Poxviruses also break the symmetry rule.<ul class=\"l2\"><li>Nearly every DNA virus is <b>icosahedral</b>, but pox is <b>complex</b>: oval or brick-shaped, ridged surface, a dumbbell core with two lateral bodies.</li><li>It is the largest DNA virus and very resistant to inactivation.</li></ul></li></ul><h5>Replication cycle as taught in 2.02</h5><ol class=\"l1\"><li>The particle attaches and fuses with the cell membrane, releasing the viral core into the <b>cytoplasm</b>.</li><li>Uncoating liberates the DNA from the core, and early viral mRNA is transcribed by the virus's own polymerase.</li><li>Late mRNA is translated into large amounts of structural proteins and enzymes.</li><li>Final maturation is the acquisition of a lipoprotein envelope as the virus buds from the cell.</li><li>The cycle is rapid and shuts off all host macromolecular synthesis, so the cell dies.</li></ol><ul class=\"l1\"><li><b>Immune evasion</b><ul class=\"l2\"><li>Poxvirus genes mimic mammalian genes for the TNF receptor, the IFN-γ receptor, the IL-1 receptor and complement-binding proteins</li><li>These decoys soak up host defenses</li></ul></li></ul><h5>The rule-and-exception table the examiners keep using</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Rule</th><th>Exception</th></tr></thead><tbody><tr><td>DNA viruses replicate in the nucleus</td><td>Poxviridae (cytoplasm)</td></tr><tr><td>RNA viruses replicate in the cytoplasm</td><td>Orthomyxoviridae (influenza) and Retroviridae (HIV, HTLV), plus HBV as a reverse-transcribing virus</td></tr><tr><td>DNA viruses are double-stranded</td><td>Parvoviridae (single-stranded)</td></tr><tr><td>DNA viruses are icosahedral</td><td>Poxviridae (complex)</td></tr><tr><td>DNA genomes are linear</td><td>papilloma, polyoma and hepadna (circular)</td></tr><tr><td>Enveloped viruses bud from the plasma membrane</td><td>Herpesviridae (nuclear membrane)</td></tr></tbody></table></div><h5>Members and what they cause</h5><ul class=\"l1\"><li><b>Variola</b> (smallpox): eradicated in 1980, the first viral disease eradicated.<ul class=\"l2\"><li>Humans are <b>the only</b> host with no carrier state.</li><li>Spread most efficiently by inhalation, less by scab material or fomites.</li><li>Lesions are all in the same stage of development, whereas chickenpox comes in crops.</li></ul></li><li><b>Vaccinia:</b> the live vaccine agent, also protects against monkeypox.</li><li><b>Cowpox:</b><ul class=\"l2\"><li>Rodent reservoir</li><li>Milkers get hand lesions</li><li>Deep red hemorrhagic lesions distinguish it from <b>vaccinia</b></li></ul></li><li>Monkeypox (<b>Mpox</b>): similar to smallpox but milder, with prominent cervical and submandibular lymphadenopathy not seen in smallpox or chickenpox.</li><li><b>Molluscum contagiosum</b><ul class=\"l2\"><li>Benign umbilicated waxy papules with caseous plugs</li><li>Spread by contact, fomites and sex</li><li>Treated with imiquimod</li></ul></li><li>Diagnosis is <b>PCR</b> from skin lesions, with pocks on the chorioallantoic membrane and pink eosinophilic cytoplasmic inclusions in culture.</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.B Poxviridae, MCB 2.01 VI.D Synthesis, Table 19</p>","HBVCHR":"<h5>The hepatitis B serology table the lecturer flagged for the exam</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Marker</th><th>What it means</th></tr></thead><tbody><tr><td><b>HBsAg</b></td><td><ul class=\"cl\"><li>the first marker to appear</li><li>Its presence always means <b>active infection</b></li><li>Persistence for <b>more than 6 months means chronic infection</b></li></ul></td></tr><tr><td><b>Anti-HBs</b></td><td><ul class=\"cl\"><li>antibody to the surface antigen</li><li>Its appearance (seroconversion) means the infection has cleared</li><li>Anti-HBs alone, with nothing else, means <b>vaccination</b></li><li>A level above 10 mIU/mL means immunity</li></ul></td></tr><tr><td><b>HBcAg</b></td><td>core antigen, inside the nucleocapsid, not measured in routine practice</td></tr><tr><td><b>Anti-HBc IgM</b></td><td><ul class=\"cl\"><li>recent infection within the last 6 months</li><li>During the <b>window period</b>, when HBsAg has fallen and anti-HBs has not yet risen, anti-HBc (with anti-HBe) is <b>the only</b> positive marker</li></ul></td></tr><tr><td><b>Anti-HBc total (IgG)</b></td><td>evidence of infection at some point, present in both resolved and chronic infection, never produced by the vaccine</td></tr><tr><td><b>HBeAg</b></td><td>associated with the nucleocapsid, present in acute and chronic infection, indicates <b>active replication and high infectivity</b></td></tr><tr><td><b>Anti-HBe</b></td><td>marks the transition from active disease to the inactive carrier state, only ever comes from natural infection</td></tr><tr><td><b>HBV DNA</b></td><td><ul class=\"cl\"><li>quantifies replication</li><li>High viral load means higher risk of progression to cirrhosis and hepatocellular carcinoma</li></ul></td></tr></tbody></table></div><h5>The patterns</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Situation</th><th>HBsAg</th><th>Anti-HBs</th><th>Anti-HBc</th><th>HBeAg</th><th>Anti-HBe</th></tr></thead><tbody><tr><td><b>Incubation</b></td><td>positive</td><td>negative</td><td>negative</td><td>may be positive</td><td>negative</td></tr><tr><td><b>Acute infection, high infectivity</b></td><td>positive</td><td>negative</td><td>IgM positive</td><td>positive</td><td>negative</td></tr><tr><td><b>Window period</b></td><td>negative</td><td>negative</td><td>positive</td><td>negative</td><td>positive</td></tr><tr><td><b>Chronic replicating</b></td><td>positive</td><td>negative</td><td>positive</td><td>positive</td><td>negative</td></tr><tr><td><b>Chronic non-replicating (inactive carrier)</b></td><td>positive</td><td>negative</td><td>positive</td><td>negative</td><td>positive</td></tr><tr><td><b>Recovered</b></td><td>negative</td><td>positive</td><td>positive</td><td>negative</td><td>positive</td></tr><tr><td><b>Vaccinated</b></td><td>negative</td><td>positive</td><td>negative</td><td>negative</td><td>negative</td></tr><tr><td><b>Susceptible</b></td><td>negative</td><td>negative</td><td>negative</td><td>negative</td><td>negative</td></tr></tbody></table></div><h5>Course and prognosis</h5><ul class=\"l1\"><li>Incubation is 45 to 120 days, then a preicteric phase of malaise, anorexia, myalgia and nausea, then an icteric phase of 1 to 2 months with dark urine and a tender liver.</li><li>About 95% of adults clear the infection within 6 months and need no specific treatment.<ul class=\"l2\"><li>Infants infected at birth become <b>chronic</b> up to 90% of the time, which is why perinatal infection matters so much.</li></ul></li><li>Fulminant hepatitis occurs in 1 to 2% of jaundiced patients within the first 8 weeks, more often with HDV or HCV co-infection.</li><li>The risk of <b>cirrhosis</b> is highest in carriers who never clear <b>HBeAg</b>.<ul class=\"l2\"><li><b>Hepatocellular carcinoma</b> appears many years later.</li></ul></li><li>Chronic disease is treated with <b>pegylated interferon alfa</b>, <b>entecavir</b> or <b>tenofovir</b>.<ul class=\"l2\"><li>Prevention is the recombinant vaccine (the <b>most effective</b> measure), screening of every pregnant woman and immunoprophylaxis of exposed infants.</li></ul></li></ul><h5>Comparison with the other hepatitis viruses</h5><ul class=\"l1\"><li>Only HBV is a DNA virus.<ul class=\"l2\"><li>HAV (<b>Picornaviridae</b>) and HEV (<b>Hepeviridae</b>) are naked, fecal-oral and never <b>chronic</b>.</li><li>HCV (<b>Flaviviridae</b>) becomes chronic and causes <b>HCC</b>.</li><li>HDV is a defective satellite that needs <b>HBsAg</b>.</li><li>HAV diagnosis is <b>IgM</b> anti-HAV by ELISA and immunity is <b>lifelong</b> after one serotype.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.02 II.C HBV Serology, Chronic Carriers, Table 20</p>","HSVROUTE":"<h5>HSV-1 and HSV-2 side by side</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>HSV-1</th><th>HSV-2</th></tr></thead><tbody><tr><td><b>Primary site</b></td><td>oropharyngeal region</td><td>genital tract</td></tr><tr><td><b>Transmission</b></td><td><b>saliva, kissing, contaminated fingers</b></td><td><b>sexual intercourse, passage through an infected birth canal</b></td></tr><tr><td><b>Site of latency</b></td><td>trigeminal ganglia</td><td>sacral ganglia</td></tr><tr><td><b>Classic diseases</b></td><td>gingivostomatitis in children 1 to 5 years, fever sores, dendritic keratoconjunctivitis, herpetic whitlow, herpes gladiatorum, eczema herpeticum, and the <b>most common</b> sporadic fatal encephalitis in the United States</td><td><ul class=\"cl\"><li>genital herpes with painful vesicoulcerative lesions of the penis or of the cervix, vulva, vagina and perineum, with fever, malaise, dysuria and inguinal lymphadenopathy</li><li>The majority of neonatal herpes</li></ul></td></tr></tbody></table></div><ul class=\"l1\"><li>Both are enveloped double-stranded DNA alphaherpesviruses that multiply in the epithelium where they are inoculated, produce vesicles and shallow ulcers, then enter sensory neurons and travel to the regional ganglion for <b>lifelong</b> latency.</li><li>Transmission is always by contact with lesions, saliva or genital secretions.<ul class=\"l2\"><li>HSV is never fecal-oral (that route belongs to naked viruses such as <b>poliovirus</b>, <b>rotavirus</b> and HAV) and never vector-borne.</li></ul></li><li><b>The crossover is now common:</b> <b>HSV-1</b> is increasingly transmitted sexually and causes genital disease, and <b>HSV-2</b> oral infection is rising.<ul class=\"l2\"><li>The two are indistinguishable without the laboratory.</li></ul></li></ul><h5>Reactivation and severe disease</h5><ul class=\"l1\"><li>Latent virus is reactivated by axonal injury, fever, physical or emotional stress and UV light, and travels back down the axon to the skin or mucosa.<ul class=\"l2\"><li>Recurrences are usually milder than the primary episode.</li></ul></li><li>Severe or disseminated disease is seen in malnutrition, AIDS, hematologic malignancy and transplant recipients.</li><li>Genital ulcers increase the acquisition of <b>HIV</b>.<ul class=\"l2\"><li>An initial <b>HSV-2</b> infection in someone already immune to <b>HSV-1</b> tends to be less severe because of antigenic cross-reactivity.</li></ul></li></ul><h5>Neonatal herpes</h5><ul class=\"l1\"><li>Acquired in utero, during birth (the <b>most common</b> route, through contact with lesions in the birth canal) or postnatally from family or staff shedding virus.<ul class=\"l2\"><li>Caesarean section is used when the mother has active genital lesions.</li></ul></li><li><b>Three categories of neonatal herpes</b><ul class=\"l2\"><li>Localized skin, eye and mouth disease</li><li>Encephalitis, with or without skin lesions</li><li>Disseminated multi-organ disease with about <b>80% mortality</b></li><li>Primary maternal infection before 20 weeks is associated with abortion</li></ul></li></ul><h5>Diagnosis and treatment</h5><ul class=\"l1\"><li><b>PCR</b> is the <b>gold standard</b> and the <b>test of choice</b> for CSF (meningitis, encephalitis).<ul class=\"l2\"><li>Culture is still used for mucocutaneous disease.</li><li>A Giemsa or Tzanck smear of the vesicle base shows multinucleated giant cells, which cannot separate <b>HSV-1</b>, <b>HSV-2</b> and <b>VZV</b>.</li></ul></li><li><b>Acyclovir</b>, valacyclovir and vidarabine inhibit viral DNA synthesis, shorten healing and reduce recurrences.<ul class=\"l2\"><li>Patients should know that asymptomatic shedding occurs and that suppressive therapy plus condoms lower transmission.</li></ul></li></ul><h5>The other alphaherpesvirus to compare</h5><ul class=\"l1\"><li><b>VZV</b> (HHV-3) also establishes latency in sensory ganglia, spreads by <b>airborne</b> droplets and contact, and reactivates as dermatomal zoster.<ul class=\"l2\"><li>Its vesicles come in crops with all stages present at once, and it has a live attenuated vaccine, which HSV does not.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.02 II.A.1 Herpes Simplex Virus, Table 11</p>","B19SLAP":"<h5>Parvovirus B19 and erythema infectiosum</h5><ul class=\"l1\"><li><b>The smallest DNA virus:</b> single-stranded linear DNA, naked, <b>icosahedral</b>, <b>the only</b> family in Baltimore group II.<ul class=\"l2\"><li>Because it has no envelope it is extremely stable (pH 3 to 9, 56°C for 60 minutes) and is inactivated only by formalin, beta-propiolactone and strong oxidizers.</li></ul></li><li>Portal of entry is the respiratory tract.<ul class=\"l2\"><li>It is also transmitted by blood products (clotting factors) and vertically from mother to fetus.</li><li>Outbreaks occur in schools, and the classic disease affects children 5 to 18 years.</li></ul></li></ul><h5>The clinical timeline</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Phase</th><th>Timing</th><th>Findings</th><th>Infectious</th></tr></thead><tbody><tr><td><b>Incubation and viremia</b></td><td>1 to 2 weeks, viremia at day 7 to 10</td><td>virus shed in nasal washes and gargles</td><td>yes, highly</td></tr><tr><td><b>Prodrome</b></td><td>during viremia</td><td>mild fever, malaise, coryza, nausea, headache, diarrhea, myalgia</td><td>yes</td></tr><tr><td><b>Rash phase 1</b></td><td>once antibody appears</td><td><b>slapped cheek</b> intense malar erythema</td><td>no longer infectious</td></tr><tr><td><b>Rash phase 2</b></td><td>follows</td><td>fine lacy maculopapular rash on trunk and limbs that fades in 2 to 4 days</td><td>no</td></tr></tbody></table></div><ul class=\"l1\"><li>The rash is an antibody phase event, so a child with the rash is no longer contagious.<ul class=\"l2\"><li>This is the reverse of <b>measles</b>, where the child is contagious during the rash.</li></ul></li><li>Adults, especially women, get a symmetrical small-joint arthritis of the hands that can last weeks to months.</li></ul><h5>The severe forms by host</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Host</th><th>Disease</th><th>Why</th></tr></thead><tbody><tr><td><b>Immunocompromised (AIDS, malignancy, transplant)</b></td><td>pure red cell aplasia with chronic anemia</td><td>cannot clear the virus, infectious for months to years, needs immunoglobulin</td></tr><tr><td><b>Pregnant woman</b></td><td>fetal anemia, non-immune hydrops fetalis, fetal loss</td><td>high viral load crosses the placenta</td></tr><tr><td><b>Sickle cell, thalassemia</b></td><td>transient aplastic crisis, can be fatal</td><td>red cells are short-lived so a brief halt in production is dangerous</td></tr></tbody></table></div><ul class=\"l1\"><li>Diagnosis is <b>PCR</b> for viral DNA, <b>IgM</b> positive from day 7 to 10 and <b>IgG</b> from day 15.<ul class=\"l2\"><li>Treatment is supportive, with transfusion for severe anemia and <b>IVIG</b> for persistent infection.</li><li>There is <b>no vaccine</b> and <b>no antiviral</b>.</li></ul></li></ul><h5>The childhood exanthems compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Virus</th><th>Distinguishing feature</th></tr></thead><tbody><tr><td><b>Measles (first disease)</b></td><td>measles virus</td><td>3 C prodrome (cough, coryza, conjunctivitis), Koplik spots, rash starts at the head and turns brownish</td></tr><tr><td><b>Scarlet fever (second)</b></td><td>group A streptococcus</td><td>not viral</td></tr><tr><td><b>Rubella (third)</b></td><td>rubella virus</td><td>mild, rash face to trunk gone in 3 days, post-auricular nodes, dangerous only to the fetus</td></tr><tr><td><b>Fifth disease</b></td><td>parvovirus B19</td><td>slapped cheek, then lacy rash, child no longer infectious</td></tr><tr><td><b>Roseola (sixth)</b></td><td>HHV-6B (and HHV-7)</td><td>high fever 39 to 40°C for 3 to 5 days, rash on trunk appears as the fever breaks, febrile seizures</td></tr><tr><td><b>Varicella</b></td><td>VZV</td><td>crops of vesicles in all stages, centrifugal, pruritic</td></tr><tr><td><b>Hand-foot-mouth</b></td><td>coxsackie A16, EV71</td><td>vesicles on palms, soles and mouth that heal without crusting</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.02 I.A Parvoviridae, Table 2</p>","ADPOOL":"<h5>Adenovirus and the eye</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Pharyngoconjunctival fever</th><th>Epidemic keratoconjunctivitis</th></tr></thead><tbody><tr><td><b>Common name</b></td><td><b>swimming pool conjunctivitis</b></td><td>none</td></tr><tr><td><b>Serotypes</b></td><td>3 and 7</td><td>8, 19 and 37</td></tr><tr><td><b>Who</b></td><td>school-aged children at camps and family pools</td><td>primarily adults</td></tr><tr><td><b>Picture</b></td><td>fever, nasal congestion, cough, sore throat and conjunctivitis as one respiratory syndrome, mild ocular involvement</td><td>acute conjunctivitis with redness, tearing and foreign-body sensation that progresses to keratitis, serious and highly contagious</td></tr><tr><td><b>Source</b></td><td>sporadic cases and outbreaks from chlorine-deficient pools</td><td>fomites such as towels and sinks, ophthalmic solutions, improperly sterilized eye instruments and tonometers (the virus stays viable on surfaces for weeks)</td></tr><tr><td><b>Course</b></td><td>resolves in 1 to 2 weeks with no sequelae</td><td>acute phase resolves in 2 weeks but corneal opacities can persist for 2 years</td></tr></tbody></table></div><h5>Adenovirus basics</h5><ul class=\"l1\"><li>Naked, linear double-stranded DNA, <b>icosahedral</b>.<ul class=\"l2\"><li>Fibers project from each of the 12 vertices and carry the type-specific antigen, hemagglutinate and attach to the cell.</li><li>The penton base has toxin-like activity that rounds cells up, and the hexon is the largest and most abundant <b>capsid</b> protein (target of anti-hexon immunofluorescence).</li></ul></li><li>Replicates only in epithelial cells of the respiratory tract, eye, gut and urinary tract, producing about 100,000 particles per cell, and stays localized in regional lymph nodes.</li><li>A single serotype can cause several diseases and several serotypes can cause the same disease.<ul class=\"l2\"><li>Serotypes 1 to 7 cause most illness.</li></ul></li></ul><h5>The other adenovirus syndromes</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Syndrome</th><th>Serotypes</th><th>Notes</th></tr></thead><tbody><tr><td><b>Acute febrile pharyngitis in children</b></td><td>1, 2, 5</td><td>5% of pediatric respiratory disease, indistinguishable from other colds</td></tr><tr><td><b>Acute respiratory disease in military recruits</b></td><td>4 and 7</td><td>crowding and stress, a vaccine exists for this group</td></tr><tr><td><b>Pneumonia</b></td><td>3, 7, 21</td><td>10 to 20% of childhood pneumonias, 10% mortality in infants</td></tr><tr><td><b>Infantile gastroenteritis</b></td><td>40 and 41</td><td>5 to 15% of viral gastroenteritis, fecal-oral</td></tr><tr><td><b>Hemorrhagic cystitis</b></td><td></td><td>boys, hematuria, virus recoverable from urine</td></tr><tr><td><b>Disseminated disease</b></td><td>1 to 7</td><td>transplant recipients (hepatitis in liver grafts, myocarditis in heart grafts) and AIDS</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Immune evasion:</b><ul class=\"l2\"><li>VA RNA protects against interferon</li><li>E3 proteins inhibit cytolysis</li><li>The E3 gp19 kDa protein blocks MHC I transport so infected cells hide from cytotoxic T cells</li></ul></li><li>Diagnosis is <b>PCR</b> (<b>test of choice</b>), anti-hexon immunofluorescence, stool ELISA for the enteric types, and a fourfold rise in complement-fixing antibody.<ul class=\"l2\"><li>There is <b>no antiviral</b>.</li><li>Prevention is hand hygiene, bleach, single-use towels and proper pool chlorination.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.02 I.B Adenoviridae, Tables 4 and 5</p>","ADROUTE":"<h5>How adenovirus spreads, and how it does not</h5><ul class=\"l1\"><li>The routes listed in 2.02 are direct contact, fecal-oral spread, respiratory droplets, contaminated fomites, hand-to-eye contact and swimming pools.</li><li>Blood transfusion is <b>not a route</b> of <b>adenovirus</b> infection.<ul class=\"l2\"><li>The DNA viruses that are transmitted through blood and blood products in these lectures are <b>parvovirus B19</b> (coagulation factor concentrates), <b>hepatitis B</b>, <b>CMV</b> (carried in leukocytes) and <b>HHV-8</b>.</li><li>Among RNA viruses, <b>HIV</b>, HTLV, HCV and <b>Zika</b> are transfusion-transmissible.</li></ul></li><li>Adenovirus tolerates so many routes because it is naked: resistant to drying, detergents and gastric acid, and able to survive for weeks on surfaces such as sinks and hand towels.</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Route</th><th>Adenovirus disease produced</th></tr></thead><tbody><tr><td><b>Respiratory droplets</b></td><td>acute febrile pharyngitis, acute respiratory disease in recruits, pneumonia</td></tr><tr><td><b>Fecal-oral</b></td><td>infantile gastroenteritis (types 40 and 41)</td></tr><tr><td><b>Fomites and hand-to-eye contact</b></td><td>epidemic keratoconjunctivitis (types 8, 19, 37), nosocomial spread from tonometers</td></tr><tr><td><b>Chlorine-deficient pool water</b></td><td>pharyngoconjunctival fever (types 3 and 7)</td></tr></tbody></table></div><h5>The transmission logic across the DNA viruses</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Envelope</th><th>Main routes</th></tr></thead><tbody><tr><td><b>Adenovirus</b></td><td>naked</td><td>contact, fecal-oral, droplet, fomites, water</td></tr><tr><td><b>Parvovirus B19</b></td><td>naked</td><td>respiratory, blood products, vertical</td></tr><tr><td><b>HPV</b></td><td>naked</td><td>direct skin and sexual contact, birth canal for laryngeal papillomas</td></tr><tr><td><b>Polyomaviruses</b></td><td>naked</td><td>respiratory droplets, possibly urine</td></tr><tr><td><b>HSV</b></td><td>enveloped</td><td>saliva, sexual contact, birth canal</td></tr><tr><td><b>VZV</b></td><td>enveloped</td><td>airborne droplets and contact</td></tr><tr><td><b>CMV</b></td><td>enveloped</td><td>saliva, urine, breast milk, sex, transfusion, transplant, transplacental</td></tr><tr><td><b>EBV</b></td><td>enveloped</td><td>saliva</td></tr><tr><td><b>HBV</b></td><td>enveloped</td><td>blood, sex, perinatal</td></tr><tr><td><b>Poxviruses</b></td><td>enveloped but unusually stable</td><td>inhalation, contact with lesions and fomites</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Prevention for adenovirus follows the routes:</b><ul class=\"l2\"><li>Strict hand hygiene</li><li><b>Hypochlorite</b> disinfection of surfaces</li><li>Single-use paper towels during outbreaks</li><li>Proper pool chlorination</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.02 I.B Adenoviridae Serotypes and Transmission, Prevention, MCB 2.01 Table 17</p>","HSV1KID":"<h5>Primary HSV-1: herpetic gingivostomatitis</h5><ul class=\"l1\"><li>A primary infection occurs in someone without prior antibodies.<ul class=\"l2\"><li>Most primary <b>HSV-1</b> infections are asymptomatic, but the symptomatic form in a small child of 1 to 5 years is gingivostomatitis.</li></ul></li><li>Incubation 3 to 5 days, illness 2 to 3 weeks.<ul class=\"l2\"><li>Fever, sore throat, malaise, and vesicular then ulcerative lesions of the buccal and gingival mucosa.</li><li>Swollen, tender, bleeding gums are the most striking and constant sign.</li></ul></li><li>Primary infection in adults more often presents as pharyngitis or tonsillitis.</li><li>After the primary infection the virus becomes latent in the trigeminal ganglion and returns as fever sores, clusters of vesicles at the lip border that are intensely painful, progress through pustule and crust, and heal without scar in 4 to 5 days.</li><li>Newborns carry maternal antibody for about 6 months, so the period of greatest susceptibility to primary herpes is 6 months to 2 years.</li></ul><h5>Mouth lesions in a child, the differentials</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Condition</th><th>Agent</th><th>Location and clue</th></tr></thead><tbody><tr><td><b>Herpetic gingivostomatitis</b></td><td>HSV-1</td><td>anterior mouth, gums and buccal mucosa, swollen gums, fever, child 1 to 5 years</td></tr><tr><td><b>Herpangina</b></td><td>coxsackie A</td><td><b>posterior</b> oropharynx (soft palate, tonsils, pharynx), abrupt fever, no gum swelling</td></tr><tr><td><b>Hand-foot-and-mouth disease</b></td><td>coxsackie A16 and enterovirus 71</td><td>oral ulcers plus vesicles on palms and soles that heal without crusting</td></tr><tr><td><b>Koplik spots</b></td><td>measles</td><td>small bluish-white spots on the buccal mucosa opposite the lower molars, appear just before the rash</td></tr><tr><td><b>Oral thrush</b></td><td>Candida albicans</td><td>white pseudomembranous patches that scrape off, budding yeast and pseudohyphae on KOH</td></tr><tr><td><b>Streptococcal pharyngitis</b></td><td>group A streptococcus</td><td>exudative tonsillitis, not vesicles or ulcers</td></tr><tr><td><b>Oral hairy leukoplakia</b></td><td>EBV in AIDS</td><td>wart-like growth on the lateral tongue, does not scrape off</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Laboratory:</b> <b>PCR</b> is the <b>gold standard</b>.<ul class=\"l2\"><li>A Giemsa-stained scraping from the vesicle base shows multinucleated giant cells (<b>HSV-1</b>, <b>HSV-2</b> and <b>VZV</b> all give this picture).</li><li><b>Acyclovir</b> shortens the course.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.02 II.A.1 HSV Clinical Illnesses, Gingivostomatitis, Fever Sores</p>","SMALLPOX":"<h5>The smallpox vaccine is live vaccinia</h5><ul class=\"l1\"><li>The vaccine contains <b>vaccinia virus</b>, a live orthopoxvirus, not <b>variola</b>.<ul class=\"l2\"><li>Because the orthopoxviruses share antigens, <b>vaccinia</b> protects against smallpox and gives about 85% protection against monkeypox.</li></ul></li><li>The historical root is Jenner's observation in the 1700s that milkmaids who had caught cowpox from teats and udders were immune to smallpox.</li><li>Vaccination is protective if given within 3 days of exposure and gives immunity for at least 5 years, sometimes longer.<ul class=\"l2\"><li>It is prophylactic, not curative.</li><li>Methisazone was historically evaluated against poxviruses, and cidofovir is the experimental antiviral that is also used for molluscum contagiosum.</li></ul></li><li>Waning smallpox-vaccine immunity after vaccination stopped in 1980 to 1982 is one of the reasons given in 2.10 for the emergence of <b>Mpox</b>.</li></ul><h5>Smallpox itself</h5><ul class=\"l1\"><li>Eradicated in 1980, the first viral disease eradicated.<ul class=\"l2\"><li>Humans are <b>the only</b> natural host and there is no carrier state.</li></ul></li><li>Spread most efficiently by inhalation, less by scabs, pustular material or fomites.<ul class=\"l2\"><li>Patients are <b>most infectious</b> during the first week of the rash.</li></ul></li><li>Incubation 10 to 14 days, then 1 to 5 days of fever and malaise, then macules, papules, vesicles and pustules with all lesions in the same stage.<ul class=\"l2\"><li>Chickenpox lesions arrive in crops and are most abundant on the face.</li></ul></li><li><b>Four types:</b><ul class=\"l2\"><li><b>Variola</b> minor (common, less fatal)</li><li>Variola major (more deadly)</li><li>Hemorrhagic and malignant (flat) forms that are rare and deadly</li></ul></li><li>Diagnosis relies on <b>PCR</b> from skin lesions (the <b>specimen of choice</b>), electron microscopy, antigen detection, culture on the chorioallantoic membrane, and least importantly antibody.<ul class=\"l2\"><li>It remains a potential bioweapon.</li></ul></li></ul><h5>Live versus killed vaccines across the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Live attenuated</th><th>Inactivated or subunit</th></tr></thead><tbody><tr><td>vaccinia (smallpox), Sabin oral polio, MMR, varicella, zoster (14 times more potent varicella), RotaTeq and Rotarix, yellow fever 17D, nasal influenza, Dengvaxia and Qdenga</td><td>Salk inactivated polio, hepatitis A, hepatitis B (recombinant HBsAg), HPV (capsid virus-like particles), injectable influenza, JE, rabies, COVID-19</td></tr></tbody></table></div><ul class=\"l1\"><li>Live vaccines replicate and give broad, durable immunity including mucosal <b>IgA</b> (<b>OPV</b>, <b>rotavirus</b>) but are contraindicated in pregnancy and immunodeficiency and can revert (<b>cVDPV</b>) or cause disease in the immunocompromised.</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.B Smallpox, Immunity, Treatment and Prevention, MCB 2.10 V.C</p>","B19ERY":"<h5>Why parvovirus B19 attacks red cell precursors</h5><ul class=\"l1\"><li>The cellular receptor is the blood group <b>P antigen (globoside)</b>, expressed on mature erythrocytes, erythroid progenitors, megakaryocytes, endothelial cells, the placenta and fetal liver and heart.<ul class=\"l2\"><li>Only primary erythroid progenitors are fully permissive, which is why the virus is almost impossible to culture.</li></ul></li></ul><h5>Mechanism, step by step</h5><ol class=\"l1\"><li>The virion enters by endocytosis and the genome is uncoated in the nucleus.</li><li>The virus cannot force the cell into S phase, so it waits until the host cell naturally enters S phase.</li><li>Once S phase begins the host is forced to synthesize viral DNA, <b>capsid</b> proteins accumulate in the nucleus and empty capsids are filled.</li><li>The cell lyses to release virions.<ul class=\"l2\"><li>Viral replication therefore kills the erythroblast directly, producing erythrocyte maturation arrest and erythroblast intranuclear inclusions.</li></ul></li></ol><ul class=\"l1\"><li>The consequence depends on the host's marrow reserve: a healthy child barely notices the pause, a child with sickle cell disease or thalassemia has an <b>aplastic crisis</b>, an immunocompromised patient gets <b>pure red cell aplasia</b> and <b>chronic</b> anemia, and a fetus develops severe anemia and hydrops.</li></ul><h5>Baltimore group II</h5><ul class=\"l1\"><li><b>Parvoviridae</b> is <b>the only</b> group II family.<ul class=\"l2\"><li>The positive-sense single-stranded DNA first forms a double-stranded replicative intermediate, then follows the conventional DNA to mRNA to protein path.</li><li>There are no negative-strand DNA viruses.</li></ul></li></ul><h5>Receptor and tropism pairs across the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Receptor</th><th>Cell targeted</th></tr></thead><tbody><tr><td><b>Parvovirus B19</b></td><td>P antigen</td><td>erythroid progenitors</td></tr><tr><td><b>EBV</b></td><td>C3d receptor (CD21)</td><td>B lymphocytes</td></tr><tr><td><b>HHV-6</b></td><td>CD46</td><td>lymphoid cells</td></tr><tr><td><b>HIV</b></td><td>CD4 with CCR5 or CXCR4</td><td>CD4 T cells, macrophages</td></tr><tr><td><b>Poliovirus</b></td><td>PVR, also called CD155</td><td>anterior horn motor neurons</td></tr><tr><td><b>Coxsackie B</b></td><td>CAR</td><td>myocytes</td></tr><tr><td><b>Echovirus</b></td><td>DAF</td><td></td></tr><tr><td><b>Rhinovirus</b></td><td>ICAM-1 (major), LDL receptor (minor)</td><td>nasal epithelium</td></tr><tr><td><b>Measles</b></td><td>CD46 or CD150</td><td>epithelium, lymphoid cells</td></tr><tr><td><b>RSV</b></td><td>CX3CR1 and CR1</td><td>ciliated airway cells</td></tr><tr><td><b>Metapneumovirus</b></td><td>αvβ1 integrin</td><td>respiratory epithelium</td></tr><tr><td><b>Rabies</b></td><td>nicotinic acetylcholine receptor</td><td>neuromuscular junction, neurons</td></tr><tr><td><b>SARS-CoV-2</b></td><td>ACE2 with TMPRSS2</td><td>alveolar and airway cells</td></tr><tr><td><b>MERS-CoV</b></td><td>DPP4 (CD26)</td><td></td></tr><tr><td><b>HCoV-229E</b></td><td>aminopeptidase N</td><td></td></tr><tr><td><b>KSHV</b></td><td>CD98</td><td>endothelium</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.02 I.A Parvoviridae Tropism, Receptors and Pathogenesis, MCB 2.01 Group II</p>","HPV":"<h5>HPV types and their risk</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Types</th><th>Risk category</th><th>Lesion</th></tr></thead><tbody><tr><td><b>1, 2, 4, 7</b></td><td>benign cutaneous</td><td>common warts on hands, plantar warts on soles, flat warts on arms, face and knees</td></tr><tr><td><b>5 and 8</b></td><td>rare</td><td>epidermodysplasia verruciformis, an inherited predisposition that gives rise to squamous cell carcinoma on sun-exposed skin</td></tr><tr><td><b>6 and 11</b></td><td>low-risk mucosal</td><td>90% of anogenital warts (condyloma acuminata), laryngeal papillomas in children infected in the birth canal</td></tr><tr><td><b>16 and 18</b></td><td><b>high-risk</b></td><td>more than 70% of cervical cancers (16 is the <b>most common</b>), plus vulvar, penile, anal and oropharyngeal cancers (16 in the oropharynx)</td></tr><tr><td><b>31, 33, 45, 56</b></td><td>high-risk, moderate association</td><td></td></tr><tr><td><b>13 and 32</b></td><td>oral</td><td>benign oral papillomas</td></tr></tbody></table></div><ul class=\"l1\"><li>HPV causes more than 99% of cervical cancers, more than 80% of anal cancers, about 25% of mouth cancers and 35% of throat cancers.<ul class=\"l2\"><li>Genital HPV is the <b>most common</b> viral infection of the reproductive tract.</li><li>Immunocompromised patients and men who have sex with men are at higher risk.</li></ul></li></ul><h5>How the high-risk types cause cancer</h5><ol class=\"l1\"><li>The virus infects basal stem cells of the epithelium through microabrasions and replicates in parallel with keratinocyte maturation, shedding virions only from the terminally differentiated surface layers.<ul class=\"l2\"><li>This makes it impossible to culture and, because the infection is non-lytic and confined to the epithelium, it evades the immune system.</li></ul></li><li>In benign lesions the viral DNA is episomal.<ul class=\"l2\"><li>In cancer cells it is integrated.</li></ul></li><li>The early proteins <b>E6 and E7</b> bind the tumor suppressors: <b>E6</b> degrades <b>p53</b> and disrupts the polarity proteins DLG, MAGI-1 and MUPP1, and <b>E7</b> binds <b>pRb</b> and releases the E2F transcription factors.<ul class=\"l2\"><li>The cell loses its brakes and its ability to die, chromosomal abnormalities accumulate, and over years to decades a persistent high-risk infection becomes carcinoma.</li><li>Persistence is the absolute prerequisite, and most infections clear on their own within 2 to 3 years.</li></ul></li></ol><h5>Screening, prevention and treatment</h5><ul class=\"l1\"><li><b>Pap smear</b> screening detects dysplasia early and must be done regularly regardless of vaccination status.<ul class=\"l2\"><li>HPV DNA testing by hybridization or <b>PCR</b> adds sensitivity for 16, 18 and the other high-risk types, but women under 20 are not routinely tested because early infections clear.</li></ul></li><li>Vaccines are prophylactic <b>capsid</b> vaccines, not therapeutic: bivalent (16, 18), quadrivalent Gardasil (6, 11, 16, 18) and 9-valent (adds 31, 33, 45, 52, 58).<ul class=\"l2\"><li>Recommended for both sexes, immunity at least 10 years.</li></ul></li><li>Warts are treated with patient-applied imiquimod, podofilox or sinecatechins, or provider-applied cryotherapy, surgery, laser, TCA or BCA.<ul class=\"l2\"><li>Recurrence is common because virus remains in the surrounding basal cells.</li><li>Interferon causes regression of laryngeal papillomas.</li></ul></li></ul><h5>The other oncogenic DNA viruses to compare</h5><ul class=\"l1\"><li>Polyomaviruses use the large T antigen to bind both <b>p53</b> and <b>pRb</b> (<b>Merkel cell virus</b> causes <b>Merkel cell carcinoma</b>).<ul class=\"l2\"><li><b>Adenovirus</b> E1A binds pRb and E1B binds p53.</li><li><b>EBV</b> uses <b>LMP1</b> as a permanently active growth receptor.</li><li>HBV acts through <b>chronic</b> inflammation and the X protein.</li><li>All DNA tumor viruses share the theme of viral oncoproteins that bind and disable normal cellular proteins.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.02 I.C Papillomaviridae, MCB 2.06 VI.C Papillomaviruses, Table 21</p>","2028-11":"<h5>Which body fluids transmit hepatitis B</h5><ul class=\"l1\"><li>2.02 states that infectious HBV is present in <b>all body fluids</b> of an infected person.<ul class=\"l2\"><li>Blood, semen, saliva and breast milk are named explicitly as sources of infection, and vaginal secretions are implied by sexual transmission.</li></ul></li><li><b>Routes:</b> parenteral (transfusion, shared needles, hemodialysis, improperly sterilized syringes and scalpels, tattooing, ear piercing, needlestick), sexual, and perinatal from a chronically infected mother or from infected siblings.<ul class=\"l2\"><li>Perinatal and early childhood infection carries the <b>highest risk</b> of becoming a <b>chronic</b> carrier.</li></ul></li><li><b>High-risk groups:</b><ul class=\"l2\"><li>Parenteral drug users</li><li>Institutionalized persons</li><li>Healthcare personnel</li><li>Multiply transfused patients</li><li>Transplant recipients</li><li>Hemodialysis patients and staff</li><li>Highly promiscuous persons</li><li>Newborns of HBsAg-positive mothers</li></ul></li></ul><h5>Why HBV is so transmissible</h5><ul class=\"l1\"><li>The virus is stable at 37°C for 60 minutes and survives drying at 25°C for at least a week, so a contaminated sharp or surface stays infectious.<ul class=\"l2\"><li>It is inactivated by 100°C for 1 minute, 60°C for 10 hours, or 0.5% sodium <b>hypochlorite</b> within 3 minutes.</li><li>Ultraviolet light does not destroy <b>HBsAg</b>.</li></ul></li><li>The surface antigen is produced in vast excess by infected hepatocytes and circulates as empty particles, and HBeAg-positive blood is the <b>most infectious</b>.</li></ul><h5>Occupational exposure risk (2.06 and 2.09)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Risk from one percutaneous exposure</th></tr></thead><tbody><tr><td><b>Hepatitis B</b></td><td><b>6 to 30%</b>, the highest</td></tr><tr><td><b>Hepatitis C</b></td><td>about 1.8%</td></tr><tr><td><b>HIV</b></td><td>about 0.3% (0.09% for mucous membrane exposure)</td></tr></tbody></table></div><h5>The bloodborne group compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Family and genome</th><th>Chronic carrier</th><th>Main routes</th></tr></thead><tbody><tr><td><b>HBV</b></td><td>Hepadnaviridae, gapped dsDNA</td><td>yes, especially neonates</td><td>blood, sex, perinatal</td></tr><tr><td><b>HCV</b></td><td>Flaviviridae, positive RNA</td><td>yes, 70 million carriers</td><td>blood, less often sex</td></tr><tr><td><b>HDV</b></td><td>defective satellite, circular negative RNA</td><td>only with HBV</td><td>blood, sex</td></tr><tr><td><b>HIV-1 and HIV-2</b></td><td>Retroviridae, lentivirus</td><td><b>lifelong</b></td><td>blood, semen, sex, perinatal, breastfeeding</td></tr><tr><td><b>HTLV-1 and HTLV-2</b></td><td>Retroviridae, deltaretrovirus</td><td><b>lifelong</b></td><td>breastfeeding, transfusion, needles, sex</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Prevention:</b> treat all blood and body fluids as infectious, gloves and PPE, mask and eye protection for splashes, disposable needles discarded without resheathing, bleach for surfaces.<ul class=\"l2\"><li>The recombinant vaccine is the <b>most effective</b> measure, all pregnant women are screened for <b>HBsAg</b>, and exposed infants receive immunoprophylaxis.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.02 II.C HBV Pathology, Stability, Prevention and Control, MCB 2.06 Occupational Exposure</p>","NORO":"<h5>Norovirus (Norwalk virus) and how it differs from rotavirus</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Norovirus</th><th>Rotavirus</th></tr></thead><tbody><tr><td><b>Family and structure</b></td><td><ul class=\"cl\"><li>Caliciviridae</li><li>Naked, positive-sense single-stranded RNA, non-segmented, 27 to 40 nm</li><li>The capsid is a single protein (VP1) with the cup-shaped depressions that give the family its name (calyx means cup)</li></ul></td><td><ul class=\"cl\"><li>Reoviridae</li><li>Naked, double-stranded RNA in 11 segments, triple-layered capsid, 60 to 80 nm</li></ul></td></tr><tr><td><b>Who gets sick</b></td><td><b>adults and all ages</b>, as epidemics in closed settings: <b>cruise ships</b>, nursing homes, schools, disaster shelters</td><td><ul class=\"cl\"><li>infants and children under 5</li><li>By age 3 about 90% of children are seropositive</li></ul></td></tr><tr><td><b>Incubation and course</b></td><td>24 to 48 hours, then <b>sudden-onset vomiting</b>, watery diarrhea, low-grade fever, cramps and malaise for 12 to 60 hours</td><td>1 to 3 days, then watery diarrhea, vomiting, fever and abdominal pain leading to dehydration</td></tr><tr><td><b>Infectious dose and shedding</b></td><td>as few as 10 particles cause disease, shedding up to 1 month, survives mild chlorine, 60°C and steamed oysters</td><td>up to 10^12 particles per gram of stool, shedding 2 to 12 days, longer in the malnourished</td></tr><tr><td><b>Transmission</b></td><td>fecal-oral, food (shellfish, infected food handlers), water, person to person, fomites and <b>aerosolized vomitus</b></td><td>fecal-oral, with frequent nosocomial spread</td></tr><tr><td><b>Diagnosis</b></td><td><ul class=\"cl\"><li><b>RT-PCR is the gold standard</b>, on stool, vomitus, food or water</li><li>Electron microscopy has low sensitivity, serology is research only</li></ul></td><td>stool enzyme immunoassay for the VP6 antigen, rapid lateral-flow antigen tests, PCR is <b>most sensitive</b> but costly</td></tr><tr><td><b>Treatment</b></td><td>fluid and electrolyte replacement</td><td>oral or IV rehydration and electrolytes</td></tr><tr><td><b>Prevention</b></td><td><ul class=\"cl\"><li>rigorous hand washing, proper food handling, disinfection of vomitus and stool, safe water</li><li><b>No vaccine</b></li></ul></td><td>live attenuated oral vaccines RotaTeq (pentavalent human-bovine reassortant) and Rotarix (monovalent human)</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Norovirus</b> genogroups GI, GII and GIV infect humans, and GII.4 strains drive the worldwide outbreaks.<ul class=\"l2\"><li>Sapovirus (Sapporo-like) is the other human calicivirus and causes childhood gastroenteritis.</li></ul></li><li><b>Mnemonic from the trans:</b><ul class=\"l2\"><li>N for nausea and vomiting</li><li>O for outbreaks</li><li>R for rapid onset and recovery</li><li>O for oral-fecal transmission</li></ul></li></ul><h5>Why the distractors are wrong</h5><ul class=\"l1\"><li><b>Poliovirus</b> and coxsackievirus are picornaviruses.<ul class=\"l2\"><li>They are naked positive-sense RNA viruses spread fecal-orally, but they cause paralysis, meningitis, herpangina and myocarditis, not epidemic gastroenteritis.</li></ul></li><li><b>Adenovirus</b> types 40 and 41 cause infantile gastroenteritis but are DNA viruses.<ul class=\"l2\"><li>Astroviruses are another cause of childhood diarrhea.</li></ul></li><li>Hepatitis A is a naked fecal-oral picornavirus that travels the same routes (shellfish, contaminated water) but produces hepatitis rather than vomiting and diarrhea.</li></ul><h5>Infection-control note (2.09)</h5><ul class=\"l1\"><li><b>Norovirus</b> and <b>rotavirus</b> are naked, so alcohol hand rub is not enough.<ul class=\"l2\"><li><b>Contact precautions</b> with soap-and-water hand washing and <b>hypochlorite</b> cleaning are required, and proton-pump inhibitors predispose to ward outbreaks.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.03 III Caliciviruses, II Reoviridae, MCB 2.09 Table 1</p>","ROTADS":"<h5>Rotavirus: the double-stranded RNA virus</h5><ul class=\"l1\"><li><b>Reoviridae</b> is the <b>only family with a double-stranded RNA genome</b> (Baltimore group III).<ul class=\"l2\"><li><b>Rotavirus</b> has <b>11 segments</b>, is naked and <b>icosahedral</b>, and has a triple-layered <b>capsid</b>.</li><li>It is stable to heat at 50°C, pH 3 to 9 and lipid solvents, and is inactivated by ethanol, phenol and chlorine.</li></ul></li><li>The trans pearl on the family name: R for respiratory, E for enteric, O for orphan, from the mistaken early belief that they caused no disease.</li><li><b>Why dsRNA needs its own polymerase:</b> the positive strand is hydrogen-bonded to the negative strand and cannot serve as mRNA, so the virion core carries an RNA-dependent RNA polymerase (VP1) that works as transcriptase (makes mRNA) and replicase (rebuilds the double-stranded genome).</li></ul><h5>Replication, step by step</h5><ol class=\"l1\"><li>The VP4 spike attaches to the host cell.</li><li>Partial uncoating in lysosomes removes the outer VP4 and VP7 layer, leaving a double-layered core intact for protection.</li><li>Inside the core, VP1 transcribes the negative strand into capped mRNAs.</li><li>The mRNAs are exported to the <b>cytoplasm</b> as templates for protein synthesis, and structural proteins and viroplasms (replication factories) are made.</li><li>In the viroplasm the mRNAs are copied back into double-stranded genomes inside immature particles.</li><li>Immature particles bud into the endoplasmic reticulum, acquire a temporary membrane, lose it, and gain the outer VP4 and VP7 layer.</li><li>Mature virions are released by cell lysis.</li></ol><ul class=\"l1\"><li>The segmented genome allows <b>reassortment</b> when two strains co-infect a cell, which is a form of genetic shift, maintains diversity between human and animal rotaviruses, and is the basis of the human-bovine reassortant vaccine.</li></ul><h5>Antigens and classification</h5><ul class=\"l1\"><li>VP6 is the group-specific antigen detected by ELISA.<ul class=\"l2\"><li>VP7 defines the G type and VP4 the P type, both neutralizing and type-specific.</li><li>Group A is the main human pathogen, and group B causes adult outbreaks.</li></ul></li></ul><h5>Genome types across the whole course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Genome</th><th>Families</th></tr></thead><tbody><tr><td><b>double-stranded RNA</b></td><td><b>Reoviridae</b> only (plus Picobirnaviridae)</td></tr><tr><td><b>positive-sense single-stranded RNA</b></td><td>Picorna, Calici, Hepe, Astro, Corona, Toga, Flavi (\"CaTCH Pico\" plus Flavi)</td></tr><tr><td><b>negative-sense single-stranded RNA</b></td><td>Orthomyxo, Paramyxo, Rhabdo, Filo, Arena, Bunya, Borna and the delta agent (\"Always Bring Polymerase Or Fail Replication\")</td></tr><tr><td><b>single-stranded RNA that reverse-transcribes</b></td><td>Retroviridae</td></tr><tr><td><b>segmented RNA</b></td><td><ul class=\"cl\"><li>Bunya (3), Orthomyxo (8), Arena (2), Reo (10 to 12), remembered as B-O-A-R</li><li>All segmented viruses are RNA viruses</li></ul></td></tr><tr><td><b>single-stranded DNA</b></td><td>Parvoviridae only</td></tr><tr><td><b>gapped double-stranded DNA that reverse-transcribes</b></td><td>Hepadnaviridae</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.03 II Reoviridae, Table 14 and 15, MCB 2.01 Group III, Table 9</p>","POLIO":"<h5>Poliovirus and the anterior horn</h5><ul class=\"l1\"><li><b>Picornaviridae</b>, genus Enterovirus.<ul class=\"l2\"><li>Small (27 to 30 nm), naked, <b>icosahedral</b>, positive-sense single-stranded RNA.</li><li>Acid-stable and ether-resistant, so it survives the stomach.</li><li>Inactivated by heat (55°C for 30 minutes) and chlorine.</li></ul></li><li>Three antigenic types with no cross-protection.<ul class=\"l2\"><li>Type 1 <b>most commonly</b> causes paralysis and is <b>the only</b> wild type still circulating.</li><li>Humans are <b>the only</b> natural reservoir.</li></ul></li><li>The receptor is <b>PVR, also called CD155</b>, a primate-specific membrane protein.<ul class=\"l2\"><li>Animals lacking it are resistant.</li><li>This receptor requirement, not a special gene, is what restricts the host range.</li></ul></li></ul><h5>Pathogenesis, step by step</h5><ol class=\"l1\"><li>The virus is swallowed in fecally contaminated food or water and multiplies in the oropharynx (tonsils) and in the Peyer's patches of the intestine.</li><li>It spreads through lymph nodes into the blood as a minor then a major viremia, and reaches the CNS through the blood or along peripheral nerve axons.</li><li>It multiplies in nerve cells and destroys them by cytolysis.<ul class=\"l2\"><li>The targets are the <b>anterior horn motor neurons</b> of the spinal cord and brainstem, that is the lower motor neurons.</li></ul></li><li>The virus does not multiply in muscle.<ul class=\"l2\"><li>Muscles waste because the motor neurons that innervate them have died.</li></ul></li><li>Virus is shed in stool for weeks, even after symptoms stop, which is the main source of spread.<ul class=\"l2\"><li>Incubation is 7 to 14 days and antibodies appear before paralysis.</li></ul></li></ol><h5>Clinical spectrum</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Form</th><th>Frequency</th><th>Picture</th></tr></thead><tbody><tr><td><b>Asymptomatic</b></td><td>95%</td><td>none</td></tr><tr><td><b>Minor or abortive illness</b></td><td>about 4% (90 to 95% of symptomatic cases)</td><td>headache, sore throat, fever, nausea, malaise, full recovery in days</td></tr><tr><td><b>Nonparalytic (aseptic meningitis)</b></td><td>part of the 1% major illness</td><td>nuchal rigidity, headache, mental status change, indistinguishable from other enteroviral meningitis, recovers in 2 to 10 days</td></tr><tr><td><b>Paralytic poliomyelitis</b></td><td>rare</td><td><ul class=\"cl\"><li><b>asymmetric flaccid paralysis</b>, usually the legs, with hypotonia and absent reflexes and no sensory loss</li><li>Bulbar disease of the medulla kills the phrenic, intercostal and cranial nerves 9, 10 and 12, causing respiratory paralysis (the iron lung)</li></ul></td></tr><tr><td><b>Post-polio syndrome</b></td><td>20 to 30% of paralytic survivors</td><td>new weakness 25 to 35 years later, not reactivation but late failure of the compensatory axonal sprouts</td></tr></tbody></table></div><h5>Upper versus lower motor neuron viruses</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Lesion</th><th>Signs</th><th>Viruses</th></tr></thead><tbody><tr><td><b>Lower motor neuron (anterior horn)</b></td><td>flaccid paralysis, hypotonia, areflexia</td><td>poliovirus, enterovirus 71, Japanese encephalitis (polio-like paralysis), West Nile, paralytic rabies</td></tr><tr><td><b>Upper motor neuron</b></td><td>spastic paralysis, hyperreflexia</td><td>coxsackie in mice, late SSPE</td></tr></tbody></table></div><h5>Diagnosis, immunity and prevention</h5><ul class=\"l1\"><li><b>Specimens:</b> throat swab early, stool gives the longest yield, CSF rarely positive.<ul class=\"l2\"><li><b>RT-PCR</b> is rapid and specific, culture shows cytopathic effect in 3 to 6 days, and neutralization with specific antiserum confirms.</li><li>CSF shows lymphocytic pleocytosis with normal glucose.</li><li>MRI shows <b>anterior horn</b> involvement.</li></ul></li><li>Immunity is type-specific and <b>lifelong</b>, mostly neutralizing antibody.<ul class=\"l2\"><li>Maternal antibody protects up to 6 months.</li><li>Antibody in blood cannot help once virus is in the brain, so immunization only works before CNS symptoms.</li></ul></li><li>Vaccination is <b>the only</b> effective prevention.<ul class=\"l2\"><li><b>Salk</b> <b>IPV</b> is killed, injected, gives humoral immunity only and does not block gut infection.</li><li><b>Sabin</b> <b>OPV</b> is live attenuated, oral, gives <b>IgG</b> plus gut <b>IgA</b>, interrupts transmission and immunizes contacts, but carries one vaccine-associated paralysis per 2 million doses and can revert to <b>cVDPV</b>.</li><li>Quarantine is useless because 90 to 95% of infections are silent.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.03 I Poliovirus, Tables 4, 5, 7, 8</p>","COXA":"<h5>Coxsackieviruses: group A versus group B</h5><ul class=\"l1\"><li><b>Picornaviridae</b>, genus Enterovirus.<ul class=\"l2\"><li>Naked, positive-sense single-stranded RNA, acid-stable.</li><li>Historically separated by the paralysis they caused in mice (group A flaccid, group B spastic), but the human syndromes are different.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Group A, \"above the neck\"</th><th>Group B, \"below the neck and body organs\"</th></tr></thead><tbody><tr><td><ul class=\"cl\"><li><b>Herpangina</b>: abrupt fever and sore throat with discrete vesicles and ulcers on the posterior palate, pharynx, tonsils and tongue</li><li>The contrast with streptococcal pharyngitis is exudate versus ulcer</li></ul></td><td><b>Pleurodynia</b> (Bornholm disease): abrupt fever with stabbing chest or abdominal pain for 2 days to 2 weeks, self-limited but may relapse</td></tr><tr><td><ul class=\"cl\"><li><b>Hand-foot-and-mouth disease</b>: coxsackie A16 mostly, also other strains and enterovirus 71</li><li>Oral and pharyngeal ulcers with a vesicular rash on palms and soles on an erythematous base that heals without crusting, unlike herpes and pox lesions</li><li>Children in schools and daycare, rash lasts 5 to 10 days</li></ul></td><td><b>Myocarditis and pericarditis</b>: the <b>most common</b> cause of viral heart disease, enters myocytes through the CAR receptor, can be fatal in neonates and leave permanent damage</td></tr><tr><td>Acute hemorrhagic conjunctivitis: the A24 variant (classically enterovirus 70)</td><td><b>Generalized disease of infants</b>: simultaneous infection of heart, liver and brain, sometimes transplacental, may be fatal</td></tr></tbody></table></div><ul class=\"l1\"><li>Both groups cause febrile illness, respiratory infection, aseptic meningitis (all type B and many type A), meningoencephalitis and a non-paralytic, reversible weakness.</li></ul><h5>Transmission, diagnosis, control</h5><ul class=\"l1\"><li>Fecal-oral and respiratory spread, incubation 2 to 9 days, summer and early fall peaks, family clusters.<ul class=\"l2\"><li>Virus is in blood early, in the throat for a few days and in stool for 5 to 6 weeks.</li></ul></li><li><b>RT-PCR</b> is the <b>method of choice</b>.<ul class=\"l2\"><li>Culture shows cytopathic effect in 5 to 14 days.</li><li>Specimens are throat swab early, stool for weeks, vesicular fluid, conjunctival swab or CSF depending on the syndrome.</li></ul></li><li><b>No vaccine</b> and <b>no antiviral</b>.<ul class=\"l2\"><li>Prevention is hygiene and sanitation.</li></ul></li></ul><h5>Why the answer is Picornaviridae</h5><ul class=\"l1\"><li>Picorna means small RNA virus.<ul class=\"l2\"><li>The family contains 12 genera, and the human pathogens are Enterovirus (<b>poliovirus</b>, <b>coxsackie A</b> and B, <b>echoviruses</b>, <b>enterovirus 70</b> and 71, and now rhinoviruses), Hepatovirus (hepatitis A) and Parechovirus (former echoviruses 22 and 23, the \"red angry baby\" virus with neonatal sepsis-like illness).</li></ul></li><li>Enteroviruses replicate at 37°C and are acid-stable, rhinoviruses replicate best at 33°C and are acid-labile, and hepatovirus replicates in the liver.</li><li>Other viruses that cause mouth or throat vesicles and ulcers are <b>HSV-1</b> (anterior mouth and gums), <b>VZV</b> (crops of vesicles including buccal mucosa) and <b>measles</b> (<b>Koplik spots</b>).<ul class=\"l2\"><li>Only the coxsackie lesions favour the posterior oropharynx.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.03 I Coxsackieviruses, Table 9</p>","EV70":"<h5>Acute hemorrhagic conjunctivitis</h5><ul class=\"l1\"><li>The classic agent is <b>enterovirus 70</b>, which caused pandemics in 1969 to 1971.<ul class=\"l2\"><li>The coxsackievirus A24 variant causes the same picture, so both are enteroviruses within <b>Picornaviridae</b>.</li></ul></li><li>The virus infects the conjunctival epithelium and produces a sudden painful red eye with subconjunctival hemorrhage, edema and intense inflammation.<ul class=\"l2\"><li>It is highly contagious and self-limited in 5 to 7 days, resolving in about 10 days.</li></ul></li><li>It is one of the <b>coxsackie A</b> \"Triple H\": Hand-foot-and-mouth disease, Herpangina and Hemorrhagic conjunctivitis.</li><li>Diagnosis is a conjunctival swab for <b>RT-PCR</b>.<ul class=\"l2\"><li>There is <b>no vaccine</b> or antiviral, so prevention is hand hygiene and avoiding shared towels.</li></ul></li></ul><h5>The viral red eyes in this course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Agent</th><th>Picture</th><th>Setting</th></tr></thead><tbody><tr><td><b>Enterovirus 70 or coxsackie A24</b></td><td>sudden, painful, subconjunctival hemorrhage, both eyes</td><td>epidemics, highly contagious</td></tr><tr><td><b>Adenovirus types 3 and 7</b></td><td>pharyngoconjunctival fever, mild conjunctivitis with pharyngitis and fever</td><td>children after swimming pools</td></tr><tr><td><b>Adenovirus types 8, 19, 37</b></td><td>epidemic keratoconjunctivitis, foreign-body sensation, keratitis, corneal opacities up to 2 years</td><td>adults, fomites, tonometers, eye clinics</td></tr><tr><td><b>HSV-1</b></td><td>dendritic keratitis, corneal ulcer, vesicles on the eyelid, recurrent, can blind</td><td>reactivation</td></tr><tr><td><b>VZV ophthalmic zoster</b></td><td>dermatomal vesicles in the ophthalmic division of the trigeminal nerve, 10 to 15% of zoster</td><td>elderly and immunocompromised</td></tr><tr><td><b>Measles</b></td><td>conjunctival redness and photophobia in the prodrome</td><td>with cough, coryza and Koplik spots</td></tr><tr><td><b>Zika</b></td><td>non-purulent conjunctivitis with rash and arthralgia</td><td>Aedes exposure, pregnancy concern</td></tr><tr><td><b>Dengue</b></td><td>conjunctival injection with retro-orbital headache</td><td>febrile, thrombocytopenia</td></tr><tr><td><b>CMV retinitis</b></td><td>pizza-pie retina, blindness</td><td>AIDS, the <b>most severe</b> ocular complication of HIV</td></tr></tbody></table></div><h5>Echoviruses and the other enteroviruses</h5><ul class=\"l1\"><li>Echo stands for Enteric Cytopathogenic Human Orphan, named when no disease was linked to them.<ul class=\"l2\"><li>They cause aseptic meningitis (summer outbreaks), febrile illness with rash in young children, encephalitis and respiratory disease.</li><li>Fifteen serotypes cause 80% of cases, and serology is impractical because there are too many types.</li></ul></li><li><b>Enterovirus 71</b> is the major enterovirus cause of CNS disease (meningitis, encephalitis, polio-like paralysis) and of severe or fatal hand-foot-and-mouth outbreaks.</li></ul><p class=\"rsrc\">Source: MCB 2.03 I Coxsackie A Acute Hemorrhagic Conjunctivitis, Echoviruses, Table 13</p>","PICOCYTO":"<h5>Where each kind of virus replicates</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Genome</th><th>Site of replication</th><th><b>Exceptions</b></th></tr></thead><tbody><tr><td><b>RNA viruses</b></td><td><b>cytoplasm</b></td><td><ul class=\"cl\"><li>Orthomyxoviridae (influenza replicates and transcribes in the nucleus, where it steals host mRNA caps) and Retroviridae (HIV and HTLV integrate into host chromosomes)</li><li>Hepatitis B, a reverse-transcribing DNA virus, also uses the nucleus</li></ul></td></tr><tr><td><b>DNA viruses</b></td><td>nucleus</td><td>Poxviridae replicate entirely in the cytoplasm using their own enzymes</td></tr></tbody></table></div><h5>The picornavirus cycle, all in the cytoplasm and complete in 5 to 10 hours</h5><ol class=\"l1\"><li>The virus binds its receptor, which sets the tropism: <b>PVR</b> for <b>poliovirus</b>, CAR for <b>coxsackie B</b>, DAF for <b>echoviruses</b>, ICAM-1 or the LDL receptor for rhinoviruses.</li><li>Uncoating releases the RNA into the cytosol.</li><li>The positive-sense genome is directly infectious and is translated as one long polyprotein.</li><li>Viral proteases cleave the polyprotein into structural proteins (VP0, VP1, VP3) and replication proteins.</li><li>The viral RNA-dependent RNA polymerase copies the genome into a negative strand, which then serves as the template for new positive strands.</li><li>Encapsidation follows, VP0 is cleaved into VP2 and VP4, and infectious virions are released by lysis.</li></ol><ul class=\"l1\"><li>The genome carries a VPg protein at its 5' end as a primer and a poly-A tail at its 3' end for stability.</li></ul><h5>Positive versus negative sense in one line each</h5><ul class=\"l1\"><li>Positive-sense RNA has the same polarity as mRNA, can be translated immediately, and the purified RNA is infectious.<ul class=\"l2\"><li>Picornaviruses, flaviviruses, togaviruses, coronaviruses, caliciviruses and hepeviruses.</li></ul></li><li>Negative-sense RNA is complementary to mRNA, must be transcribed first, and the virion must carry its own RNA-dependent RNA polymerase.<ul class=\"l2\"><li>Paramyxoviruses, orthomyxoviruses, rhabdoviruses, filoviruses, arenaviruses and bunyaviruses.</li></ul></li><li>Retroviruses are positive-sense but are not used as mRNA.<ul class=\"l2\"><li>They are reverse-transcribed into DNA and integrated.</li></ul></li></ul><h5>Inclusion bodies as a marker of the replication site</h5><ul class=\"l1\"><li>Because RNA viruses replicate in the <b>cytoplasm</b>, their inclusion bodies are cytoplasmic: acidophilic cytoplasmic inclusions in paramyxovirus infections, <b>Negri bodies</b> in <b>rabies</b>.<ul class=\"l2\"><li><b>Measles</b> is <b>the exception</b> that also produces intranuclear inclusions.</li><li>DNA viruses give nuclear inclusions (herpes Cowdry bodies, <b>CMV</b> owl's eye, parvovirus erythroblast inclusions), <b>except</b> poxvirus with its cytoplasmic Guarnieri bodies.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.03 I Picornavirus Replication Cycle, Table 3, MCB 2.01 VI.D Synthesis and Polarity</p>","ROTAPREV":"<h5>Preventing rotavirus</h5><ul class=\"l1\"><li><b>Rotavirus</b> is transmitted fecal-orally, with frequent nosocomial spread and a winter peak.<ul class=\"l2\"><li>It is the <b>leading cause</b> of gastroenteritis under 5 years, with 3 to 5 billion cases and up to 1 million child deaths a year, mostly in Africa, Asia and Latin America.</li></ul></li><li><b>Hierarchy of control from the trans:</b> <b>vaccines are the best control strategy worldwide</b>, sanitation and hand hygiene are the day-to-day measures, and maternal antibody protects infants under 6 months from severe disease.<ul class=\"l2\"><li>Reinfection is common but each episode is milder.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Vaccine</th><th>Composition</th><th>Status</th></tr></thead><tbody><tr><td><b>RotaShield (1998)</b></td><td>rhesus-based</td><td><b>withdrawn in 1999</b> because of intussusception</td></tr><tr><td><b>RotaTeq</b></td><td>live attenuated, oral, pentavalent human-bovine reassortant</td><td>safe and effective, in use</td></tr><tr><td><b>Rotarix</b></td><td>live attenuated, oral, monovalent human strain</td><td>safe and effective, in use</td></tr></tbody></table></div><ul class=\"l1\"><li>Both current vaccines are live and oral because natural immunity is mucosal.<ul class=\"l2\"><li>The same logic applies to the <b>Sabin</b> oral polio vaccine, which produces gut <b>IgA</b>, in contrast to the injected <b>Salk</b> vaccine that produces only serum <b>IgG</b>.</li></ul></li><li><b>Treatment is entirely supportive:</b> oral or intravenous rehydration and electrolyte replacement.<ul class=\"l2\"><li>There is <b>no antiviral</b>.</li></ul></li><li>Infection control in wards (2.09): rotavirus and <b>norovirus</b> are naked viruses that resist alcohol, so <b>contact precautions</b>, soap-and-water hand washing and <b>hypochlorite</b> disinfection are needed.</li><li><b>Mnemonic from the trans:</b> R for RNA, <b>Reoviridae</b>, double-stranded and segmented, O for oral-fecal spread and oral vaccine, T for the <b>NSP4</b> toxin and tiny people, A for acute diarrhea in infants.</li></ul><h5>Other enteric viruses and their prevention</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Prevention</th></tr></thead><tbody><tr><td><b>Hepatitis A</b></td><td><ul class=\"cl\"><li>inactivated vaccine for children over 1 year, travelers, MSM, drug users and chronic liver disease, plus immune globulin within 2 weeks of exposure</li><li>Not in the Philippine NIP but recommended</li></ul></td></tr><tr><td><b>Poliovirus</b></td><td>OPV and IPV in the routine schedule, Sabayang Patak campaigns</td></tr><tr><td><b>Norovirus</b></td><td><b>no vaccine</b>, hand washing, food handling, disinfection</td></tr><tr><td><b>Adenovirus</b></td><td>vaccine for military recruits only (types 4 and 7), hand hygiene and pool chlorination</td></tr><tr><td><b>Enteroviruses (coxsackie, echo)</b></td><td><b>no vaccine</b>, hygiene</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.03 II.A Rotavirus Treatment and Prevention, Epidemiology, Table 16</p>","PICOVP":"<h5>The picornavirus capsid</h5><ul class=\"l1\"><li>The <b>icosahedral</b> shell is made of 60 subunits, and each subunit contains <b>four proteins, VP1 to VP4</b>.<ul class=\"l2\"><li>VP1, VP2 and VP3 form the outer surface and VP4 lies internally.</li></ul></li><li>VP1 and VP3 carry the sites that neutralizing antibody binds.</li><li>The junction of VP1, VP2 and VP3 forms a <b>canyon</b> on the surface.<ul class=\"l2\"><li>The receptor-binding site lies deep inside the canyon, and the canyon is too narrow for an antibody to enter, so the site that the virus uses to attach to cells is shielded from neutralization.</li></ul></li><li>Maturation is the cleavage of VP0 into VP2 and VP4, which turns the assembled particle into an infectious virion.</li><li>Parechoviruses, which diverged from enteroviruses with less than 30% sequence identity, have only three <b>capsid</b> proteins because VP0 is never cleaved.</li><li>The genome is positive-sense single-stranded RNA of 7 to 8 kb, non-segmented and directly infectious, with VPg at the 5' end and a poly-A tail at the 3' end.</li></ul><h5>Structural proteins to keep straight across the viruses</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Capsid or envelope proteins and what they do</th></tr></thead><tbody><tr><td><b>Picornavirus</b></td><td>VP1 to VP4, canyon at the VP1-VP2-VP3 junction, VPg primer</td></tr><tr><td><b>Rotavirus</b></td><td>VP4 spike (P type, attachment), VP7 (G type), VP6 (group antigen for ELISA), VP1 polymerase, NSP4 enterotoxin</td></tr><tr><td><b>Calicivirus</b></td><td>a single capsid protein VP1 with cup-shaped depressions</td></tr><tr><td><b>Adenovirus</b></td><td>hexon (largest and most abundant), penton base (toxin-like), fibers at the 12 vertices (attachment and hemagglutination)</td></tr><tr><td><b>Influenza</b></td><td>HA (attachment, neutralizing antibody), NA (release), M2 proton channel, M1 matrix, NP and the polymerase subunits PA, PB1, PB2</td></tr><tr><td><b>Paramyxovirus</b></td><td>HN or H or G for attachment, F for fusion, M matrix, N, P and L for the ribonucleoprotein</td></tr><tr><td><b>Coronavirus</b></td><td>S spike (entry), E, M (assembly organizer), N nucleocapsid</td></tr><tr><td><b>Rabies</b></td><td>N, P, M, G (spike, receptor binding, antibody target) and L polymerase</td></tr><tr><td><b>Filovirus</b></td><td>NP, VP35, VP40, GP, VP30, VP24, L</td></tr><tr><td><b>HIV</b></td><td>gp120 (SU, binds CD4), gp41 (TM, fusion), p24 core, reverse transcriptase, integrase, protease</td></tr><tr><td><b>Flavivirus</b></td><td>envelope protein and the non-structural proteins such as NS1 used in dengue testing</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.03 I Picornavirus Properties, Table 2, Parechovirus</p>","2028-20":"<h5>Where wild poliovirus survives</h5><ul class=\"l1\"><li>The virus that causes asymmetric flaccid paralysis by destroying <b>anterior horn</b> cells is <b>poliovirus</b>.</li><li>The WHO eradication campaign that began in 1988 reduced cases from 350,000 in 125 countries to fewer than 2,000 a year, and in 2024 only 99 cases remained.<ul class=\"l2\"><li>Polio-free regions include the Americas (1994), the Western Pacific (2000) and Europe (2002).</li></ul></li><li>Wild type 2 was eradicated in 1999, wild type 3 has not been seen since November 2012, and wild type 1 causes 100% of wild cases.</li><li>The remaining endemic countries are <b>Afghanistan and Pakistan</b>.<ul class=\"l2\"><li>Lecture 2.03 still lists Nigeria, but 2.10 and its review question state two countries only, so read the question for which lecture it draws on.</li></ul></li></ul><h5>Polio in the Philippines</h5><ul class=\"l1\"><li>Declared polio-free in 2000.<ul class=\"l2\"><li>In July 2019 vaccine-derived <b>poliovirus</b> type 1 was found in Manila Bay sewage, on September 14 a confirmed <b>cVDPV2</b> case with acute flaccid paralysis was reported from Lanao del Sur, and the national outbreak was declared on September 19, 2019.</li><li>Cases were mostly cVDPV2 in Mindanao, Laguna, Quezon City and Nueva Ecija, and the outbreak was declared over on June 11, 2021.</li></ul></li><li>The cause was low immunization coverage that let the oral vaccine virus mutate in unvaccinated children.<ul class=\"l2\"><li>The response was Sabayang Patak Kontra Polio, mass <b>OPV</b> for all children under 5 regardless of status, plus AFP surveillance and risk communication.</li></ul></li></ul><h5>Salk versus Sabin</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Salk (IPV)</th><th>Sabin (OPV)</th></tr></thead><tbody><tr><td>killed virus, injected</td><td>live attenuated, oral</td></tr><tr><td>serum IgG only, no intestinal immunity, vaccinated people still shed virus</td><td>IgG, IgM and gut IgA, interrupts transmission, spreads immunity to contacts</td></tr><tr><td>cannot revert, safe in the immunocompromised</td><td>one vaccine-associated paralysis per 2 million doses, can revert to cVDPV, interference by other enteroviruses, may activate in the immunocompromised</td></tr><tr><td>contains all three types</td><td>bivalent since 2015, type 2 removed because it causes 86% of cVDPV</td></tr><tr><td>PH schedule 2026: 14 weeks and 9 months</td><td>PH schedule 2026: 6, 10 and 14 weeks</td></tr></tbody></table></div><ul class=\"l1\"><li>Treatment is supportive only.<ul class=\"l2\"><li>Quarantine fails because 90 to 95% of infections are silent.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.03 I Poliovirus Epidemiology, Prevention and Control, MCB 2.10 II.D Polio, Tables 8 to 10</p>","2028-23":"<h5>Rotavirus: dehydration is the whole problem</h5><ul class=\"l1\"><li><b>Rotavirus</b> infects the villus cells of the small intestine, never the stomach or colon, and causes diarrhea by two mechanisms.<ul class=\"l2\"><li>The non-structural protein <b>NSP4 is a viral enterotoxin</b> that inhibits the sodium-glucose transporter SGLT1.<ul class=\"l3\"><li>Sodium and glucose stay in the lumen and drag water with them, producing secretory diarrhea.</li></ul></li><li>Villus destruction replaces mature absorptive cells with immature crypt cells, producing malabsorption.<ul class=\"l3\"><li>Villi take 3 to 8 weeks to recover.</li></ul></li></ul></li><li>Incubation is 1 to 3 days.<ul class=\"l2\"><li>Watery diarrhea, vomiting, fever and abdominal pain lead to <b>dehydration</b>, which is what kills about 600,000 children a year in developing countries.</li><li>Disease is severe in infants, prolonged in immunodeficient children, and usually mild in adults.</li></ul></li><li><b>Treatment is supportive only:</b> <b>oral or intravenous rehydration and electrolyte replacement</b>.<ul class=\"l2\"><li><b>No antiviral</b> exists.</li></ul></li><li>Diagnosis is a stool enzyme immunoassay for the VP6 antigen, a rapid immunochromatographic strip, or <b>PCR</b> for genotyping.<ul class=\"l2\"><li>It cannot be distinguished clinically from other diarrheal agents.</li></ul></li></ul><h5>The viral diarrheas compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Age group</th><th>Setting and clue</th></tr></thead><tbody><tr><td><b>Rotavirus</b></td><td>infants and young children</td><td>winter, nosocomial, dehydration</td></tr><tr><td><b>Norovirus</b></td><td>adults and all ages</td><td>cruise ships, nursing homes, schools, sudden vomiting</td></tr><tr><td><b>Adenovirus 40 and 41</b></td><td>young children</td><td>5 to 15% of viral gastroenteritis, DNA virus</td></tr><tr><td><b>Sapovirus</b></td><td>children</td><td>Sapporo-like calicivirus</td></tr><tr><td><b>Astrovirus</b></td><td>children</td><td>naked positive RNA enteric virus</td></tr><tr><td><b>Hepatitis A and E</b></td><td>any age</td><td>fecal-oral but cause hepatitis with dark urine, not diarrhea</td></tr><tr><td><b>Rhinovirus</b></td><td>any</td><td>a picornavirus that is acid-labile and stays in the nose, not enteric</td></tr></tbody></table></div><ul class=\"l1\"><li><b>All the true enteric viruses are naked:</b><ul class=\"l2\"><li><b>Picornaviridae</b> (enterovirus genus)</li><li><b>Caliciviridae</b></li><li>Astroviridae</li><li><b>Reoviridae</b></li><li>Among DNA viruses <b>Adenoviridae</b> and <b>Parvoviridae</b></li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.03 II.A Rotavirus Pathogenesis, Clinical Features, Treatment, MCB 2.04 Enteric Viruses</p>","2028-24":"<h5>Picornaviridae versus Reoviridae replication</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Picornaviridae</th><th>Reoviridae (rotavirus)</th></tr></thead><tbody><tr><td><b>Genome</b></td><td>positive-sense single-stranded RNA, non-segmented, directly infectious</td><td>double-stranded RNA in 11 segments, not infectious on its own</td></tr><tr><td><b>Uncoating</b></td><td><ul class=\"cl\"><li>complete</li><li>The RNA is released into the cytosol</li></ul></td><td><ul class=\"cl\"><li><b>partial</b></li><li>The outer VP4 and VP7 layer is removed in the lysosome and the double-layered core stays intact, transcribing from inside</li></ul></td></tr><tr><td><b>First event after entry</b></td><td>the genome is translated as one polyprotein by host ribosomes</td><td>the packaged VP1 polymerase transcribes capped mRNA inside the core and exports it</td></tr><tr><td><b>Polymerase</b></td><td>made after translation (RNA-dependent RNA polymerase)</td><td>carried in the virion core</td></tr><tr><td><b>Site</b></td><td>cytoplasm</td><td>cytoplasm, in viroplasm factories</td></tr><tr><td><b>Assembly</b></td><td>encapsidation, VP0 cleaved to VP2 and VP4</td><td>particles bud into the ER, lose the membrane, gain the outer capsid</td></tr><tr><td><b>Release</b></td><td>lysis</td><td>lysis</td></tr><tr><td><b>Reassortment</b></td><td>impossible, non-segmented</td><td>possible, segmented</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Why partial uncoating:</b> double-stranded RNA cannot be read as mRNA and would trigger host defenses, so the double-layered core acts as a protected transcription machine.</li><li>Both families are naked, so both enter by viropexis, leave by lysis, resist ether and acid, and spread fecal-orally.</li></ul><h5>Replication strategies of the other RNA groups for contrast</h5><ul class=\"l1\"><li>Negative-sense viruses (paramyxo, orthomyxo, rhabdo, fil
