<td><b>Burkitt lymphoma</b></td><td>jaw tumor, African children; malaria expands EBV-infected pool; EBNA1 the only protein expressed</td></tr><tr><td><b>Nasopharyngeal carcinoma</b></td><td>epithelial; Chinese/SE Asian males; high anti-EBV titers</td></tr><tr><td><b>Hodgkin disease</b></td><td>EBV genome in Reed-Sternberg cells</td></tr><tr><td>Non-Hodgkin / CNS lymphoma, PTLD</td><td>immunodeficient, transplant, AIDS; monitor EBV DNA load</td></tr><tr><td>Gastric carcinoma</td><td>with H. pylori</td></tr><tr><td>Oral hairy leukoplakia</td><td>AIDS</td></tr></tbody></table></div><ul><li>NOT EBV: <b>Merkel cell carcinoma = Merkel cell polyomavirus</b>; Kaposi sarcoma = HHV-8; cervical ca = HPV; HCC = HBV/HCV; ATL = HTLV-1</li></ul><p class=\"mech\"><i>Mechanism</i>saliva → oropharyngeal epithelium → <b>B cells via C3d receptor (CD21)</b> → early genes cause proliferation and <b>immortalization</b>, not death; latency in B cells; <b>LMP1</b> = permanently-on growth receptor (NF-κB, MAPK); EBNAs needed for immortalization; polyclonal B-cell activation → heterophile Ab</p><ul><li>Diagnosis: EBV-specific serology (anti-VCA IgM/IgG, anti-EA, anti-EBNA); heterophile test; ISH for EBER = gold standard in tissue</li><li>Treatment: acyclovir reduces shedding but not symptoms or immortalized B cells</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.A.3 EBV, Table 13; MCB 2.06 VI.D Herpesviruses</p>","HBVHCC":"<h5>Hepatitis B and hepatocellular carcinoma</h5><ul><li>HBV = Hepadnaviridae, enveloped 42 nm, <b>partially double-stranded circular (\"gapped\") DNA</b>, Baltimore VII, replicates through an RNA pregenome with reverse transcriptase (rcDNA → cccDNA in nucleus)</li><li>Risk: infection in neonates/young children becomes chronic up to 90%; <b>persistent infection established early = highest HCC risk</b>; &gt;250 million chronic carriers, 800,000+ deaths/yr</li></ul><p class=\"mech\"><i>Mechanism</i>persistent viral infection → cell-mediated immune attack (CTLs against HBcAg/HBeAg on hepatocytes) → <b>necrosis, inflammation, repeated regeneration</b> → cirrhosis → background for HCC. Add-ons: viral <b>X protein</b> (transactivator, potential oncoprotein), <b>aflatoxin</b> cofactor, high HBV DNA load, HBeAg persistence, HDV/HCV co-infection</p><ul><li>HCC presents years later: weight loss, RUQ pain, fever, GI bleeding; slow-growing</li><li>Prevention: <b>HBV vaccine reduces HCC</b>; first-line for chronic disease pegIFN-α, entecavir, tenofovir</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Hepatitis virus</th><th>Family</th><th>Genome</th><th>Chronic?</th><th>Cancer?</th></tr></thead><tbody><tr><td>HAV</td><td>Picorna</td><td>+RNA naked</td><td>no (\"no afterlife\")</td><td>no</td></tr><tr><td><b>HBV</b></td><td>Hepadna</td><td>gapped dsDNA</td><td>yes (esp. infants)</td><td><b>HCC</b></td></tr><tr><td>HCV</td><td>Flavi</td><td>+RNA</td><td>yes (70 M carriers)</td><td>HCC (1-5%)</td></tr><tr><td>HDV</td><td>Kolmioviridae/satellite</td><td>circular -RNA</td><td>with HBV only</td><td>worsens HBV</td></tr><tr><td>HEV</td><td>Hepe</td><td>+RNA naked</td><td>no</td><td>no</td></tr></tbody></table></div><ul><li>Only HBV is a DNA hepatitis virus; all five belong to different families</li></ul><p class=\"rsrc\">Source: MCB 2.06 VI.A Hepatitis B Virus; MCB 2.02 HBV Chronic Carriers, Risk of Cirrhosis/HCC</p>","RABREC":"<h5>Rabies virus attachment</h5><ul><li>Rhabdoviridae, genus Lyssavirus; <b>bullet-shaped</b>, enveloped, helical, (-)ssRNA non-segmented (~12 kb), 5 proteins <b>N, P, M, G, L</b>; carries its own RdRp; one serotype</li><li><b>G glycoprotein</b> trimers form the 10 nm spikes → binds host receptors, best on neurons: <b>nicotinic acetylcholine receptor</b> at neuromuscular junction (also muscle and other cells); G determines <b>neuroinvasiveness and pathogenicity</b>; purified spikes induce <b>neutralizing antibody</b> → the antibody target and the vaccine antigen</li><li>Antiserum to <b>nucleocapsid (N)</b> is the diagnostic reagent (immunofluorescence)</li></ul><p class=\"mech\"><i>Mechanism</i>bite inoculates saliva → virus stays near site (incubation 20-90 d, up to &gt;1 y) → binds nAChR at NMJ → <b>retrograde fast axonal transport</b> (~250 mm/d, 12 h delay per synapse) centripetally to spinal cord/brainstem → CNS dissemination → centrifugal spread along sensory/autonomic nerves to <b>salivary glands</b> (acinar cells), heart, adrenals, skin; <b>no hematogenous spread</b>, never isolated from blood</p><ul><li>Immune evasion: N hides RNA from RIG-I; P blocks IRF3/7 and ISGs; M dampens innate genes; G reduces T-cell activation, raises IL-10 → poor cytokine response, little CNS leukocyte infiltration, <b>no neutralizing antibody</b></li><li>Transmission risk higher with multiple bites and highly innervated sites (face, hands)</li><li>PH burden: 426 deaths 2024, all fatal; 59,000 deaths/yr worldwide</li></ul><p class=\"rsrc\">Source: MCB 2.06 I.A-B Rabies Properties, Antigenic Properties, Pathogenesis</p>","NEGRI":"<h5>Negri bodies</h5><ul><li><b>Eosinophilic cytoplasmic inclusions</b> in neurons made of rabies virus proteins + viral RNA</li><li>Seen in <b>Purkinje cells of the cerebellum</b> and <b>pyramidal neurons of the hippocampus</b></li><li><b>Pathognomonic</b> for rabies but present in only ~80% of cases → absence does not exclude</li><li>A histopathologic (post-mortem brain) finding; also listed under \"inclusion bodies\" in chick-embryo/culture methods (2.01)</li><li>Highest virus titers in the submaxillary salivary glands; virus never isolated from blood</li></ul><h5>Rabies diagnosis</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Test</th><th>Notes</th></tr></thead><tbody><tr><td>Immunofluorescence / immunoperoxidase with anti-rabies monoclonal Ab</td><td>viral antigen in tissue; definitive = Negri bodies in brain/cord</td></tr><tr><td>RT-PCR</td><td>fixed or unfixed brain, saliva; sequencing identifies strain</td></tr><tr><td>Serology (IF, neutralization)</td><td>supportive, late</td></tr><tr><td>Viral isolation</td><td>hamster/mouse cell lines 2-4 d, confirmed by FA</td></tr><tr><td>Animal observation</td><td>10 days; euthanise and examine if signs</td></tr></tbody></table></div><ul><li>No test diagnoses rabies <b>before</b> symptoms</li></ul><h5>Inclusion bodies across the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Inclusion</th><th>Virus</th></tr></thead><tbody><tr><td>Negri (eosinophilic, cytoplasmic, neurons)</td><td>rabies</td></tr><tr><td>Owl's eye (intranuclear, cytomegalic cell)</td><td>CMV</td></tr><tr><td>Cowdry / intranuclear + multinucleated giant cells</td><td>HSV, VZV</td></tr><tr><td>Guarnieri (eosinophilic cytoplasmic)</td><td>poxvirus</td></tr><tr><td>Acidophilic cytoplasmic (+ intranuclear in measles)</td><td>paramyxoviruses</td></tr><tr><td>Erythroblast intranuclear</td><td>parvovirus B19</td></tr><tr><td>Measles antigen in brain inclusions</td><td>SSPE</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.06 I.C Pathology of Rabies; I.F Diagnostics, Table 3</p>","2028-28":"<h5>Where retroviral oncogenes come from</h5><ul><li>RNA tumor viruses = mostly retroviruses; they carry RT → DNA provirus integrates into host DNA</li><li>Two kinds of oncogenic retroviruses<ul><li><b>Highly oncogenic / direct (acute) transforming: carry their own oncogene (v-onc) that originally came from a host cell</b> (transduced cellular proto-oncogene); rapid tumors; often replication-defective</li><li>Weakly oncogenic / slowly transforming: <b>no oncogene</b>; act indirectly by promoter/enhancer insertion next to a proto-oncogene or by transactivation (HTLV-1 Tax); years to leukemia</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>DNA tumor viruses</th><th>RNA tumor viruses</th></tr></thead><tbody><tr><td>transforming genes are <b>essential for viral replication</b></td><td>oncogenes are transduced cellular genes <b>not needed for replication</b>, or act indirectly</td></tr><tr><td><b>no normal cellular homologs</b></td><td>v-onc has a cellular counterpart (proto-oncogene)</td></tr><tr><td>oncoproteins bind and disable host proteins (p53, pRb): large T, E6/E7, E1A/E1B, LMP1</td><td>integration, promoter insertion, Tax</td></tr></tbody></table></div><ul><li>Proto-oncogenes normally regulate growth; mutation/overexpression/viral promoter insertion converts them to oncogenes; tumor suppressors need both alleles lost</li><li>HCV (Flaviviridae) is the other RNA tumor virus: indirect via chronic inflammation → cirrhosis → HCC</li></ul><p class=\"rsrc\">Source: MCB 2.06 IV.A Tumor Viruses; V RNA Tumor Viruses; Table 16</p>","2028-29":"<h5>Clinical forms of rabies</h5><ul><li>Incubation 1-3 months (5 d to years); prodrome nonspecific (fever, malaise, headache, nausea) with <b>paresthesia/pain/pruritus at the bite site</b> as the first specific sign; atypical encephalitis with preserved consciousness</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Encephalitic (furious) 80%</th><th>Paralytic 20%</th></tr></thead><tbody><tr><td>fever, confusion, <b>hallucinations, agitation, combativeness</b>, seizures</td><td>early prominent <b>flaccid weakness</b> starting distally → quadriparesis, facial weakness</td></tr><tr><td>autonomic: <b>hypersalivation</b>, gooseflesh, arrhythmia, priapism</td><td>sphincter involvement, mild sensory change</td></tr><tr><td>early brainstem involvement → <b>hydrophobia, aerophobia</b></td><td>hydrophobia and excitability absent</td></tr><tr><td>hyperexcitability alternating with lucid intervals that shorten</td><td>often misdiagnosed as <b>Guillain-Barré</b></td></tr><tr><td>coma and death within days</td><td>survive a few days longer; multiorgan failure</td></tr></tbody></table></div><ul><li>Both fatal once symptomatic; no treatment; symptomatic care only</li><li>Post-exposure prophylaxis by category: I (touch/lick intact skin) wash only; II (nibble, superficial scratch, no bleeding) wash + vaccine to day 7, no RIG; III (transdermal bite, bleeding scratch, mucosa lick, bat exposure, head/neck cat II) wash + vaccine + <b>RIG</b>; all regardless of animal status</li><li>Pre-exposure: 2-site ID or 1-site IM day 0 and 7</li></ul><p class=\"rsrc\">Source: MCB 2.06 I.E Clinical Presentation; I.H PEP, Table 4</p>","2028-31":"<h5>Host response in rabies: why immunity fails</h5><ul><li>Normal antiviral pathway: RIG-I senses viral RNA → IRF3/IRF7 → IFN-β → JAK-STAT → interferon-stimulated genes; plus cytokines, chemokines, autophagy, apoptosis</li><li>Rabies proteins switch it off</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Protein</th><th>Evasion</th></tr></thead><tbody><tr><td>N (nucleoprotein)</td><td>hides RNA from RIG-I</td></tr><tr><td>P (phosphoprotein)</td><td>inhibits IRF3/7 and ISGs → less IFN-β</td></tr><tr><td>M (matrix)</td><td>dampens innate gene expression, drives apoptosis</td></tr><tr><td>G (glycoprotein)</td><td>reduces T-cell activation, promotes IL-10</td></tr></tbody></table></div><ul><li>Net effect: <b>poor cytokine/chemokine response, limited leukocyte infiltration of CNS, absent neutralizing antibodies</b>, immune-cell apoptosis → unchecked spread along axons, relentless neurologic decline</li><li>The virus travels inside neurons (immune-privileged, no viremia), so antibody has nothing to bind until late; serum antibody is only supportive evidence in later stages</li><li>Therefore prevention hinges on vaccine + RIG before the virus reaches the CNS (vaccine gives CD4 help, T cells, early plasmablasts; booster = faster response)</li><li>Contrast prions: no immune response because there is no foreign antigen; contrast HIV: antibody made but virus persists via latency and mutation</li></ul><p class=\"rsrc\">Source: MCB 2.06 I.D Immunologic Response; How Rabies Evades Innate Immunity</p>","2028-36":"<h5>Managing antiretroviral failure</h5><ul><li><b>Monotherapy quickly selects resistance</b> (error-prone RT, quasispecies, 10^10 virions/day) → viral load rebounds with resistance mutations</li><li>Correct move: <b>HAART (1996) = combination of drugs from multiple classes hitting different life-cycle stages</b> → suppress replication to undetectable, restore immunity, delay resistance (cross-resistance within a class still possible)</li><li>Do resistance testing (genotypic sequencing of RT/protease; phenotypic if complex) at diagnosis and at every failure, and check adherence (most important patient-education point)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Class</th><th>Stage blocked</th><th>Examples</th></tr></thead><tbody><tr><td>NRTI / NNRTI</td><td>RNA → DNA (reverse transcriptase)</td><td>tenofovir, lamivudine, zidovudine / efavirenz, nevirapine</td></tr><tr><td>Integrase inhibitor</td><td>provirus integration</td><td>dolutegravir, raltegravir</td></tr><tr><td>Protease inhibitor</td><td>Gag cleavage / maturation</td><td>ritonavir, darunavir, atazanavir</td></tr><tr><td>Fusion inhibitor</td><td>gp41 fusion</td><td>enfuvirtide</td></tr><tr><td>Entry (CCR5) inhibitor</td><td>coreceptor binding</td><td>maraviroc</td></tr></tbody></table></div><ul><li>HAART does not cure: latent reservoir in resting memory CD4 cells (&lt;1 per million cells on ART, ~70 y to clear); stopping ART → rebound</li><li>Monitoring: plasma viral load = best long-term predictor and ART monitor; CD4 = short-term risk of opportunistic infections (&lt;200/μL)</li><li>Prevention uses: PrEP; AZT cuts mother-to-child transmission by up to 70%</li></ul><p class=\"rsrc\">Source: MCB 2.06 VI.L Prevention, Treatment and Control; HAART; Resistance Testing</p>","KOH":"<h5>Fungal microscopy: the rapid first test</h5><ul><li><b>10-20% KOH</b> dissolves keratin/host tissue and leaves fungal elements: yeast, hyphae, pseudohyphae, spores; rapid and cheap, sensitivity variable</li><li><b>Calcofluor white</b> binds chitin → fluorescence, more sensitive (needs UV microscope)</li><li>Histology stains: <b>GMS</b> (fungal wall black), <b>PAS</b> (red/magenta), capsule stains, India ink for Cryptococcus</li><li>Culture (SDA ± chloramphenicol, cycloheximide) is <b>more sensitive than microscopy</b> but takes 1-3 wk (dermatophytes) to weeks (dimorphics)</li></ul><h5>Dermatophytosis lab pathway</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Step</th><th>Finding</th></tr></thead><tbody><tr><td>Specimen</td><td>skin scrapings, nail clippings, infected hairs</td></tr><tr><td>KOH</td><td><b>branching septate hyphae + chains of arthroconidia</b></td></tr><tr><td>Hair pattern</td><td>ectothrix (spores outside shaft, Microsporum, Wood's lamp +) vs endothrix (inside, T. tonsurans, no fluorescence)</td></tr><tr><td>Wood's lamp</td><td>green fluorescence in M. canis (and Malassezia)</td></tr><tr><td>Culture 25-30°C</td><td>colony texture/colour, macro/microconidia, hair perforation test</td></tr></tbody></table></div><ul><li>Tinea capitis is the scalp dermatophytosis of children; kerion (boggy, zoophilic) and favus (scutula) are inflammatory forms; needs <b>oral</b> therapy (griseofulvin, terbinafine, itraconazole) + shampoo</li></ul><h5>KOH appearances to memorise</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>KOH picture</th><th>Organism</th></tr></thead><tbody><tr><td>septate branching hyphae + arthroconidia</td><td>dermatophytes</td></tr><tr><td>\"spaghetti and meatballs\" (short hyphae + round yeast)</td><td>Malassezia (pityriasis versicolor)</td></tr><tr><td>budding yeast + pseudohyphae</td><td>Candida</td></tr><tr><td>encapsulated budding yeast (India ink halo)</td><td>Cryptococcus</td></tr><tr><td>sclerotic / muriform / copper-penny bodies</td><td>chromoblastomycosis</td></tr><tr><td>granules with septate hyphae</td><td>eumycetoma</td></tr><tr><td>spherules with endospores</td><td>Coccidioides</td></tr><tr><td>broad non-septate ribbon hyphae, 90°</td><td>Mucorales</td></tr><tr><td>narrow septate hyphae, 45°</td><td>Aspergillus</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.07 II.B Microscopy; V.G Dermatophytosis Laboratory Diagnosis</p>","SPORO":"<h5>Sporotrichosis: the dimorphic subcutaneous mycosis</h5><ul><li><b>Sporothrix schenckii complex</b> (S. brasiliensis zoonotic from cats, S. globosa); soil, sphagnum moss, plants, <b>rose thorns</b>; gardeners, farmers, florists; also zoonotic</li><li><b>Thermally dimorphic</b> — the only subcutaneous mycosis that is</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>25°C (mold, environment/culture)</th><th>37°C (yeast, tissue/BHI agar)</th></tr></thead><tbody><tr><td>septate hyphae with pear-shaped (piriform) conidia along hyphae or in <b>rosette/flower-like clusters</b>; colony cream → brown/black (melanin)</td><td>small <b>cigar-shaped budding yeast</b> (3-5 μm); asteroid bodies around yeast in tissue</td></tr></tbody></table></div><ul><li>Clinical forms<ul><li><b>Lymphocutaneous (75%)</b>: nodule at inoculation → ulcer → chain of nodules/abscesses along draining lymphatics (cord-like)</li><li>Fixed cutaneous: single localized lesion, no lymphatic spread (endemic areas)</li><li>Disseminated (immunocompromised), pulmonary (TB-like)</li></ul></li><li>Diagnosis: <b>culture = gold standard</b> (SDA/IMA 25-30°C, then convert to yeast at 35-37°C); KOH often negative (sparse yeast); GMS/PAS raise sensitivity; serology not recommended; sporotrichin skin test supportive</li><li>Treatment: <b>itraconazole</b> drug of choice (cutaneous/lymphocutaneous); SSKI older alternative; amphotericin B for disseminated/severe</li></ul><h5>Subcutaneous mycoses side by side</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Sporotrichosis</th><th>Chromoblastomycosis</th><th>Mycetoma (eumycetoma)</th></tr></thead><tbody><tr><td>Agent</td><td>Sporothrix (dimorphic)</td><td>dematiaceous molds: Fonsecaea, Phialophora, Cladophialophora</td><td>Madurella, Pseudallescheria/Scedosporium, Exophiala</td></tr><tr><td>Lesion</td><td>nodules along lymphatics</td><td>verrucous cauliflower plaque, black dots</td><td>swelling + sinuses + granules, bone invasion</td></tr><tr><td>Microscopy</td><td>cigar yeast</td><td>sclerotic (Medlar) bodies</td><td>granules of septate hyphae</td></tr><tr><td>Tx</td><td>itraconazole</td><td>itraconazole/flucytosine + surgery/heat</td><td>surgery + long azoles/ampho B</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.07 VI.B Sporotrichosis, Table 4</p>","MCANIS":"<h5>Tinea capitis: ectothrix vs endothrix</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Ectothrix</th><th>Endothrix</th></tr></thead><tbody><tr><td>Spores</td><td>arthroconidia in dense sheets <b>outside</b> the hair shaft</td><td>arthroconidia <b>inside</b> the hair shaft</td></tr><tr><td>Typical agent</td><td><b>Microsporum</b> (M. canis from cats/dogs, M. audouinii, M. gypseum from soil)</td><td><b>Trichophyton tonsurans</b>, T. violaceum, T. schoenleinii (favus)</td></tr><tr><td>Wood's lamp</td><td><b>fluoresces green</b></td><td><b>no fluorescence</b></td></tr><tr><td>Host response</td><td>zoophilic → acute inflammation, kerion</td><td>anthropophilic → chronic, low-grade, \"black dot\"</td></tr></tbody></table></div><ul><li>Wood's lamp also lights Malassezia (pityriasis versicolor); Hortaea/tinea nigra and dermatophytes on skin do not</li><li>Dermatophyte ecology: geophilic (soil), zoophilic (animals; acute inflammatory, may self-resolve), anthropophilic (humans; most cases, mild chronic)</li><li>Genus rules: <b>Microsporum</b> = skin + hair, large thick rough-walled macroconidia; <b>Trichophyton</b> = skin, hair, nails, many microconidia; <b>Epidermophyton</b> = skin + nails, club-shaped smooth macroconidia, no microconidia, never hair</li><li>Dermatophytes cannot grow at 37°C → stay in non-viable keratin; mildly contagious (fomites: combs, towels, gym mats); the only contagious fungal group</li><li>Kerion = painful boggy scalp lesion (zoophilic); favus = yellow crust scutula, chronic</li><li>Tinea capitis treatment: oral griseofulvin/terbinafine/itraconazole + shampoo; topicals insufficient</li></ul><p class=\"rsrc\">Source: MCB 2.07 V.B, V.E.06 Tinea Capitis, V.G Hair infection</p>","DERMID":"<h5>Identifying dermatophytes in culture (SDA/IMA, 25-30°C, 1-3 wk)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Organism</th><th>Colony</th><th>Microscopy</th></tr></thead><tbody><tr><td><b>T. rubrum</b></td><td>white cottony surface, <b>red (wine) reverse</b></td><td>tear-drop microconidia along hyphae, rare pencil macroconidia; most common cause of tinea pedis/cruris/corporis/unguium</td></tr><tr><td>T. mentagrophytes</td><td>white to cream, powdery</td><td>clusters of round microconidia, <b>spiral hyphae</b>, urease +</td></tr><tr><td><b>T. tonsurans</b></td><td></td><td>numerous elongated microconidia on supporting hyphae; endothrix tinea capitis</td></tr><tr><td>T. schoenleinii</td><td></td><td>no conidia; <b>favic chandeliers</b> (antler hyphae); favus</td></tr><tr><td><b>M. canis</b></td><td>white, <b>yellow-orange reverse</b></td><td>large spindle, thick rough-walled macroconidia with hooked ends; ectothrix, fluoresces</td></tr><tr><td>M. gypseum</td><td></td><td>numerous thin rough-walled macroconidia; geophilic</td></tr><tr><td><b>E. floccosum</b></td><td>khaki/greenish</td><td><b>club-shaped smooth macroconidia in clusters, NO microconidia</b>; skin and nails only</td></tr></tbody></table></div><ul><li>Identification uses colony texture/colour/growth rate + conidia type/arrangement + nutritional tests, hair-perforation test, PCR</li><li>Media additives: cycloheximide (kills saprophytic molds; do NOT use for Cryptococcus), chloramphenicol (bacteria)</li><li>Treatment by site: topical azoles/tolnaftate 2-4 wk for corporis/mild pedis; <b>oral</b> griseofulvin (binds tubulin, concentrates in stratum corneum), terbinafine (squalene epoxidase), itraconazole for capitis, unguium, extensive disease; luliconazole penetrates nail bed</li></ul><p class=\"rsrc\">Source: MCB 2.07 V.B-C Dermatophyte Genera and Morphology; V.H Culture</p>","TPEDIS":"<h5>Tinea pedis (athlete's foot)</h5><ul><li><b>Most prevalent form of dermatophytosis</b>; starts in interdigital toe webs; scaling, peeling, maceration, fissures, secondary bacterial infection; variants interdigital, moccasin (plantar hyperkeratosis), vesicular, ulcerative; wet feet/flooding raise risk</li><li>Agents: <b>Trichophyton rubrum</b> (most common overall, chronic moccasin type) and <b>T. mentagrophytes</b> (acute vesicular; spiral hyphae, urease +); E. floccosum less often</li><li>How the papers separate the two: a bare \"most commonly associated\" → T. rubrum; extra clues of spiral hyphae/urease/acute vesicles → T. mentagrophytes; club-shaped macroconidia without microconidia → E. floccosum</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Tinea site</th><th>Name</th><th>Notes</th></tr></thead><tbody><tr><td>feet</td><td>tinea pedis</td><td>most prevalent</td></tr><tr><td>nails</td><td>tinea unguium (onychomycosis)</td><td>thick yellow brittle nails; months of oral therapy, nail removal; luliconazole</td></tr><tr><td>groin/inner thigh</td><td>tinea cruris</td><td>adult males; scrotal involvement suggests Candida instead</td></tr><tr><td>body</td><td>tinea corporis</td><td>annular, raised active border, central clearing</td></tr><tr><td>hands</td><td>tinea manuum</td><td>often one hand</td></tr><tr><td>scalp</td><td>tinea capitis</td><td>children; ectothrix/endothrix</td></tr><tr><td>beard</td><td>tinea barbae</td><td>adult males; mimics bacterial folliculitis</td></tr></tbody></table></div><ul><li>Trichophytid (id) reaction: sterile vesicular eruption on hands from hypersensitivity to dermatophyte antigen elsewhere; trichophytin skin test +; clears when primary infection treated</li><li>Treatment: topical for mild pedis (miconazole, clotrimazole, tolnaftate, 2-4 wk, continue 1-2 wk after clearing), keep dry; oral for extensive/refractory</li></ul><p class=\"rsrc\">Source: MCB 2.07 V.E.01 Tinea Pedis; V.B Trichophyton</p>","CHROMO":"<h5>Chromoblastomycosis</h5><ul><li>Chronic subcutaneous infection by <b>dematiaceous (melanin-pigmented) fungi</b> after traumatic implantation from soil/vegetation, usually legs/feet of barefoot farm workers in the tropics</li><li>Agents: Phialophora verrucosa (cup-shaped collarettes), <b>Fonsecaea pedrosoi</b> (polymorphic conidiation), F. compacta, Rhinocladiella aquaspersa, Cladophialophora carrionii (long chains) — conidial detail not required</li><li>Lesion: papule/nodule → slowly enlarging <b>warty, verrucous, cauliflower-like</b> plaque with crusting, abscesses, ulceration, <b>black dots</b>; satellite lesions by lymphatics/autoinoculation; lymphatic obstruction → elephantiasis; dissemination rare; not contagious</li><li>Diagnostic hallmark: <b>sclerotic / muriform / Medlar / copper-penny bodies</b> on KOH — thick-walled brown 4-12 μm cells with transverse and longitudinal septa; histology = epidermal hyperplasia + granulomas with intracellular muriform cells; culture dark green/brown/black velvety colonies</li><li>Treatment: <b>surgical excision</b> for small lesions; <b>itraconazole or flucytosine</b> for large/extensive; <b>local heat/cryotherapy</b> as adjunct; prolonged, relapse common</li><li>Prevention: footwear, protective clothing, prompt wound care</li></ul><h5>Pigmented (dematiaceous) fungi in the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Organism</th></tr></thead><tbody><tr><td>Tinea nigra (dark macule palm/sole)</td><td>Hortaea werneckii</td></tr><tr><td>Black piedra (hard hair nodules)</td><td>Piedraia hortae</td></tr><tr><td>Chromoblastomycosis</td><td>Fonsecaea, Phialophora, Cladophialophora</td></tr><tr><td>Black-grain eumycetoma</td><td>Madurella, Exophiala</td></tr><tr><td>Sporothrix mold colony darkens</td><td>melanin</td></tr></tbody></table></div><ul><li>Melanin = virulence (oxidative stress protection); flucytosine is active against dematiaceous fungi</li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.C Chromoblastomycosis</p>","MYCETOMA":"<h5>Mycetoma</h5><ul><li>Chronic granulomatous infection of skin and subcutis from <b>traumatic implantation of soil organisms</b>; feet, hands, lower limbs; extends to muscle and bone → deformity</li><li><b>Triad: localized swelling + multiple draining sinuses + granules</b> (grains = colonies of the organism)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Eumycetoma</th><th>Actinomycetoma</th></tr></thead><tbody><tr><td>Agent</td><td>true <b>fungi</b>: Madurella mycetomatis, M. grisea, Pseudallescheria boydii (Scedosporium apiospermum), Exophiala jeanselmei, Acremonium</td><td>filamentous <b>bacteria</b> (Nocardia, Actinomadura, Streptomyces)</td></tr><tr><td>Granule</td><td><b>septate hyphae 3-5 μm</b>, intertwined, up to 2 mm, firm; <b>black/red-black = Madurella, Exophiala</b>; white = Pseudallescheria</td><td>fine bacterial filaments</td></tr><tr><td>Histology</td><td>fungal hyphae in granule</td><td>thin branching filaments</td></tr><tr><td>Treatment</td><td><b>surgical excision/debridement + long-term antifungals</b> (itraconazole, ketoconazole, amphotericin B)</td><td>antibiotics</td></tr></tbody></table></div><ul><li>Diagnosis: granules from sinus pus or biopsy → KOH → culture on SDA/IMA; identify by granule colour/size/consistency, hyphal morphology, culture</li><li>Treatment is difficult and prolonged; dissemination uncommon (immunocompromised)</li><li>Prevention: footwear in endemic areas, wound hygiene</li><li>Grain colour is what differentiates the two mycetomas on histology: black grains with true septate hyphae = eumycetoma</li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.D Mycetoma</p>","2028-38":"<h5>Stains for fungi in tissue</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Stain</th><th>Result</th><th>Use</th></tr></thead><tbody><tr><td><b>PAS (periodic acid-Schiff)</b></td><td>fungal walls <b>red/magenta</b></td><td>routine histopathology sections</td></tr><tr><td><b>GMS (Gomori/Grocott methenamine silver)</b></td><td>fungal walls <b>black</b></td><td>histopathology; Pneumocystis cysts; sporotrichosis</td></tr><tr><td>H&amp;E</td><td>fungi often faint</td><td>general; muriform cells visible</td></tr><tr><td>Giemsa</td><td>intracellular Histoplasma in macrophages</td><td>blood/marrow smears</td></tr><tr><td>Calcofluor white</td><td>fluorescence (chitin)</td><td>direct specimens, Pneumocystis, Coccidioides</td></tr><tr><td>India ink</td><td>capsule halo</td><td>Cryptococcus in CSF</td></tr><tr><td>Toluidine blue</td><td>Pneumocystis cysts</td><td>BAL</td></tr><tr><td>KOH 10-20%</td><td>clears keratin</td><td>skin, nail, hair scrapings</td></tr><tr><td>Lactophenol cotton blue</td><td>mold structures</td><td>culture identification</td></tr><tr><td>Mucicarmine</td><td>capsule red</td><td>Cryptococcus in tissue</td></tr></tbody></table></div><ul><li>Fungal walls are polysaccharide (chitin, glucans, mannans) that resist degradation → stain with PAS/GMS; Gram stain shows yeast (Candida) as Gram-positive but not tissue molds</li><li>Serology/antigen: cryptococcal antigen (latex/EIA), 1,3-β-D-glucan (Fungitell) for invasive candidiasis/aspergillosis, galactomannan; PCR; MALDI-TOF</li><li>Culture remains the most sensitive test but slow</li></ul><p class=\"rsrc\">Source: MCB 2.07 II.B Microscopy; VI.B.03 Sporotrichosis Histopathology; MCB 2.08 stains</p>","2028-44":"<h5>Treating sporotrichosis</h5><ul><li>Vignette = lymphocutaneous sporotrichosis (gardener, ulcerated hand nodules, lymphangitic spread, <b>cigar-shaped yeast</b>)</li><li>Trans drug list: <b>itraconazole = drug of choice</b> for cutaneous and lymphocutaneous disease; <b>saturated KI</b> older, effective but poorly tolerated; <b>amphotericin B</b> for systemic/disseminated/severe; some localized cases self-limited</li><li>The printed key chose fluconazole; note the lecture text says itraconazole. Fluconazole is an alternative azole but is not the trans answer — keep both in mind and follow the exam key for this paper</li></ul><h5>Azole selection cheat-sheet (2.08)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Drug</th><th>First-choice uses</th><th>Caveat</th></tr></thead><tbody><tr><td>Itraconazole</td><td>histoplasmosis, blastomycosis, <b>sporotrichosis</b>, chromoblastomycosis, onychomycosis, aspergilloma, paracoccidioidomycosis</td><td>hepatitis</td></tr><tr><td>Fluconazole</td><td><b>best CNS penetration</b>: cryptococcal and coccidioidal meningitis maintenance; oropharyngeal candidiasis in AIDS; candidemia</td><td>C. glabrata/krusei resistant</td></tr><tr><td>Voriconazole</td><td>invasive aspergillosis</td><td>reversible visual disturbance 30%</td></tr><tr><td>Posaconazole</td><td>fluconazole-resistant Candida, mucormycosis, ampho-resistant Aspergillus</td><td></td></tr><tr><td>Ketoconazole</td><td>CMC, dermatophytes, non-meningeal endemic mycoses</td><td>most toxic: blocks testosterone/cortisol</td></tr></tbody></table></div><ul><li>Azole MOA: block CYP450 14α-demethylase → no ergosterol → membrane disruption; fungistatic</li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.B.05 Sporotrichosis Treatment; MCB 2.08 IV.C Azoles</p>","2028-45":"<h5>Sporotrichosis forms and mimics</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Form</th><th>Picture</th><th>Mimics</th></tr></thead><tbody><tr><td>Lymphocutaneous (75%)</td><td>nodule → ulcer → nodules along lymphatics</td><td>nocardiosis, atypical mycobacteria, leishmaniasis</td></tr><tr><td><b>Fixed / isolated cutaneous</b></td><td>single localized ulcerated or verrucous plaque, no lymphatic spread; endemic high-exposure areas</td><td><b>pyoderma gangrenosum</b>, bacterial ulcer, SCC, chromoblastomycosis</td></tr><tr><td>Disseminated</td><td>debilitated/immunocompromised</td><td></td></tr><tr><td>Pulmonary</td><td>cavitary, TB-like</td><td>tuberculosis</td></tr></tbody></table></div><ul><li>Why it misleads: a solitary chronic ulcer with undermined edges in a farmer or gardener looks like pyoderma gangrenosum; steroids for PG would worsen a fungal ulcer → biopsy and <b>culture (gold standard)</b> before treating; KOH may be negative because yeast are sparse</li><li>Cigar-shaped yeast at 37°C, rosette conidia at 25°C confirm; itraconazole treats</li><li>Other subcutaneous look-alikes: chromoblastomycosis (cauliflower plaque, copper-penny bodies), mycetoma (sinuses + grains), cutaneous blastomycosis (verrucous granuloma with advancing border, broad-based budding yeast)</li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.B.02 Clinical Features of Sporotrichosis, Table 4</p>","DIMORPH":"<h5>The four endemic (systemic) dimorphic mycoses</h5><ul><li>Common thread: <b>thermal dimorphism</b> (mold 25°C in soil; yeast/spherule 37°C in host), inhalation of conidia (&gt;90%), lungs first, ~90% asymptomatic/self-limited, dissemination when Th1 immunity fails, males more disseminated disease, not contagious</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Histoplasma capsulatum</th><th>Blastomyces dermatitidis</th><th>Coccidioides immitis/posadasii</th><th>Paracoccidioides brasiliensis</th></tr></thead><tbody><tr><td>Where</td><td>Ohio/Mississippi valleys; soil with <b>bat/bird guano</b> (caves, chicken coops)</td><td>North America river valleys; also Africa, Asia; dogs</td><td>SW USA desert (Lower Sonoran), Central/South America; <b>Filipinos most susceptible</b>, pregnancy</td><td>rural Latin America, farmers, men 30-60</td></tr><tr><td>Mold 25°C</td><td><b>tuberculate macroconidia</b> 8-16 μm + small infectious microconidia; slow 4-12 wk</td><td>septate hyphae with lollipop conidia</td><td><b>barrel-shaped arthroconidia</b> alternating with disjunctor cells; highly infectious (bioweapon), BSC required</td><td>slow, fine hyphae, chlamydospores</td></tr><tr><td>Tissue 37°C</td><td>tiny 2-4 μm yeast <b>inside macrophages</b>, narrow-based bud</td><td>large 8-15 μm thick-walled yeast with <b>single broad-based bud</b></td><td><b>spherules</b> up to 80 μm full of endospores (not a yeast)</td><td>large multiple-budding yeast up to 30 μm, narrow necks = <b>ship's wheel / pilot's wheel</b></td></tr><tr><td>Disease</td><td>Darling's disease; acute pulmonary (heals with calcification), chronic cavitary (men, emphysema), disseminated (mucocutaneous ulcers, HSM, marrow)</td><td>pyogranulomatous pneumonia; ulcerated verrucous skin, bone, GU, CNS</td><td>Valley fever/desert rheumatism, erythema nodosum; dissemination to skin, bone, <b>meninges</b></td><td>pulmonary granuloma; painful oral mucosal ulcers, adrenal, LN</td></tr><tr><td>Dx</td><td>GMS/PAS/Giemsa yeast in macrophages; CF, ID (H = active, M = past), <b>antigen ELISA</b> most sensitive</td><td>broad-based buds; convert to yeast at 37°C; antigen A; skin test unreliable</td><td>spherules on KOH/calcofluor; coccidioidin/spherulin skin test &gt;5 mm; IgM active/IgG past</td><td>KOH; CF/ID serology most useful; convert at 36°C</td></tr><tr><td>Tx</td><td>itraconazole mild; <b>ampho B</b> disseminated; itraconazole maintenance in AIDS</td><td>itraconazole 6 mo localized; ampho B severe</td><td>supportive; itraconazole; ampho B severe; <b>fluconazole for meningitis</b></td><td><b>itraconazole</b>; ketoconazole/TMP-SMX alternative; ampho B severe</td></tr></tbody></table></div><ul><li>Blastomyces \"FALSE\" trap: it buds singly with a broad base; multiple ship's-wheel budding is Paracoccidioides</li><li>Histoplasma survival trick: alkalinizes the phagolysosome (HCO3-, NH3), blocks fusion → multiplies inside macrophages</li></ul><p class=\"rsrc\">Source: MCB 2.08 II Endemic Mycoses A-D and Table 8 summary</p>","CANDIDA":"<h5>Candida albicans</h5><ul><li>Endogenous opportunist: normal flora of skin, mucosa, GI tract from birth; <b>most prevalent systemic mycosis</b>; not communicable</li><li>Morphology: oval budding yeast 3-6 μm; <b>pseudohyphae</b> (buds that fail to detach, constricted at septa) and <b>true hyphae</b> (C. albicans is dimorphic); soft cream colonies with yeasty odor</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Test</th><th>Result identifying C. albicans</th></tr></thead><tbody><tr><td><b>Germ tube test</b></td><td>serum 37°C 60-90 min → true hyphae/germ tubes (thinner, uniform, no constriction)</td></tr><tr><td>Chlamydospore</td><td>nutritionally deficient media → large spherical chlamydospores</td></tr><tr><td>CHROMagar</td><td><b>green</b> (tropicalis blue, glabrata dark purple, others pink)</td></tr></tbody></table></div><ul><li>C. glabrata: yeast only, no pseudohyphae, azole-resistant; C. auris multidrug-resistant</li><li>Virulence: yeast-hypha switching (pseudohyphae hard to phagocytose), ALS adhesins, secreted aspartyl proteinases (degrade IgA), phospholipase B1, <b>biofilm</b> on catheters/valves</li><li>Clinical<ul><li><b>Thrush</b>: white pseudomembranous patches on tongue, gums, palate = epithelium + yeast + pseudohyphae; infants, AIDS (most), antibiotics, steroids</li><li>Vulvovaginitis: pruritus, curdy discharge; diabetes, pregnancy, antibiotics, OCPs</li><li>Intertrigo, diaper rash, interdigital (wet work), onychomycosis/paronychia</li><li>Systemic: candidemia (catheters, surgery, IVDU, neutropenia), endocarditis on prosthetic valves, kidney, eye, meninges; neutrophils are the key defense</li><li>Chronic mucocutaneous candidiasis: T-cell defect, hypoparathyroidism/autoimmunity, lifelong azoles</li></ul></li><li>Diagnosis: Gram/KOH/calcofluor → budding yeast + pseudohyphae; culture at RT or 37°C; germ tube; CHROMagar 1-4 d</li><li>Treatment: nystatin/clotrimazole troche, oral fluconazole for mucosal; <b>amphotericin B ± flucytosine/fluconazole/caspofungin</b> for systemic; echinocandins for resistant species; remove catheters/antibiotics</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.A Candidiasis, Table 6</p>","PJP":"<h5>Pneumocystis jirovecii pneumonia</h5><ul><li>Once thought a protozoan; <b>fungus</b>; human species (P. carinii is the rat species); extracellular pathogen living in the <b>surfactant layer above alveolar epithelium</b>; cannot be cultured</li><li>Host: <b>AIDS with CD4 &lt;200/μL</b> (major cause of AIDS death), transplants, steroids, malignancy, premature/malnourished infants</li><li>Morphology: <b>thin-walled trophozoites</b> and <b>thick-walled spherical/elliptical cysts 4-6 μm with 4-8 nuclei</b>, in tight masses; stain with <b>silver (GMS), toluidine blue, calcofluor white</b>, Giemsa for trophs</li><li>Clinical: nonproductive cough, dyspnea, fever, hypoxia; CXR bilateral interstitial/ground-glass infiltrates; in non-AIDS hosts an interstitial plasma-cell pneumonitis with foamy alveolar exudate</li><li>Diagnosis: BAL or induced sputum microscopy for cysts/trophozoites; surface glycoprotein serology only for prevalence</li><li>Treatment and prophylaxis: <b>TMP-SMX</b>; pentamidine isethionate alternative/prophylaxis; start prophylaxis when CD4 &lt;200</li></ul><h5>Fungal pneumonias in the immunocompromised</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Organism</th><th>Host clue</th><th>Lab clue</th></tr></thead><tbody><tr><td>Pneumocystis</td><td>CD4 &lt;200, ground-glass</td><td>cysts on silver stain, no culture</td></tr><tr><td>Aspergillus</td><td>neutropenia, leukemia, steroids, CD4 &lt;50</td><td>septate 45° hyphae, halo sign, galactomannan</td></tr><tr><td>Cryptococcus</td><td>AIDS, pigeon droppings</td><td>encapsulated yeast, antigen</td></tr><tr><td>Mucorales</td><td>DKA, iron overload</td><td>broad non-septate hyphae, black necrosis</td></tr><tr><td>Histoplasma</td><td>caves, bats</td><td>yeast in macrophages</td></tr><tr><td>Candida</td><td>catheters, antibiotics</td><td>pseudohyphae; rarely true pneumonia</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.08 III.E Pneumocystis Pneumonia</p>","CRYPTO":"<h5>Cryptococcus neoformans and C. gattii</h5><ul><li>Environmental basidiomycetous yeasts; <b>large polysaccharide capsule</b>; all encapsulated, <b>urease +</b>, grow at 37°C, make <b>melanin via laccase</b> (bird seed/caffeic acid agar → brown colonies); inhibited by cycloheximide media</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>C. neoformans</th><th>C. gattii</th></tr></thead><tbody><tr><td>Frequency</td><td>90% of cases, worldwide</td><td>less common, tropical trees</td></tr><tr><td>Habitat</td><td><b>dry pigeon droppings</b> (birds not infected), soil</td><td>trees (eucalyptus)</td></tr><tr><td>Host</td><td>immunocompromised (AIDS, malignancy)</td><td>immunocompetent</td></tr><tr><td>Serotype</td><td>A, D, AD</td><td>B, C</td></tr></tbody></table></div><ul><li>What sets these two apart from other Cryptococcus spp.: capsule, laccase/melanin, urease, growth at 37°C, virulence in humans — they do NOT cause \"coccidiosis\" (that is a Coccidioides/coccidian term, the trap in 2028 Q54)</li></ul><p class=\"mech\"><i>Mechanism</i>inhale dry, poorly encapsulated yeast/basidiospores → pulmonary infection (usually asymptomatic/flu-like, resolves) → in immunocompromised, yeast multiplies and disseminates, <b>neurotropic</b> → <b>chronic meningitis</b> (headache, neck stiffness, disorientation; high CSF pressure, protein, cells, low/normal glucose) → fatal untreated; skin and other organs</p><ul><li>Immune evasion: <b>capsule (glucuronoxylomannan, GXM) inhibits phagocytosis</b>; melanin resists oxidative killing; capsule shed during infection = antigen detected by <b>latex agglutination / EIA</b> (+ in ~90% meningitis)</li><li>Diagnosis: <b>India ink</b> wet mount of CSF → halo around budding yeast 5-10 μm; culture whitish mucoid colonies 2-3 d; cryptococcal antigen; urease</li><li>Treatment: <b>amphotericin B + flucytosine</b> induction; <b>fluconazole</b> suppression (excellent CNS penetration) especially AIDS; HAART lowers incidence</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.B Cryptococcosis, Table 7</p>","BIOFILM":"<h5>Biofilm as a fungal virulence factor</h5><ul><li>Definition (2.07/2.08): community of yeast + pseudohyphae attached to a biological or prosthetic surface and embedded in a self-produced <b>extracellular matrix</b></li></ul><p class=\"mech\"><i>Mechanism</i>matrix resists penetration by host immune cells/antibodies and by antifungal drugs → cells inside are shielded; slow metabolic state and efflux add tolerance → persistent, relapsing infection; sheds cells into blood</p><ul><li>Candida contexts: <b>catheters</b> (candidemia), <b>prosthetic heart valves</b> (recalcitrant endocarditis), shunts, dentures, oral thrush pseudomembranes (intractable biofilm); management usually needs <b>device removal</b> plus amphotericin B/echinocandin</li><li>Other Candida virulence factors for comparison</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Factor</th><th>Effect</th></tr></thead><tbody><tr><td>Morphogenesis (yeast &lt;→ hypha)</td><td>hyphae/pseudohyphae hard to phagocytose, invade tissue, \"de facto motility\"</td></tr><tr><td>ALS adhesins</td><td>bind epithelial/endothelial receptors</td></tr><tr><td>Secreted aspartyl proteinases (10 SAPs)</td><td>degrade membranes, destroy IgA</td></tr><tr><td>Phospholipase B1</td><td>disrupts host membrane phospholipids</td></tr><tr><td>Cell wall mannan/glucan</td><td>attachment; also triggers PRRs</td></tr></tbody></table></div><ul><li>Same idea in bacteria (2.09): S. epidermidis biofilm on prosthetic valves, shunts, lines; Candida auris persistence on surfaces</li><li>Cryptococcus uses a different evasion: capsule (anti-phagocytic) and melanin; Histoplasma alkalinizes the phagolysosome; Aspergillus/Mucor angioinvasion cuts off drug delivery</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.A Candidiasis Pathogenesis, Virulence Factors; MCB 2.07 I.D</p>","ASPERG":"<h5>Aspergillus</h5><ul><li>Ubiquitous saprophytic mold; <b>A. fumigatus</b> most common (gray-green colony, uniseriate conidiophore with columnar conidia); flavus, niger, terreus, lentulus</li><li>Structure: aerial hyphae; conidiophore with terminal <b>vesicle</b> bearing phialides → chains of conidia (easily aerosolized)</li><li>In tissue/KOH: <b>hyaline, septate, uniform ~4 μm hyphae branching dichotomously at acute (45°) angles</b></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Aspergillus</th><th>Mucorales (Rhizopus, Mucor, Lichtheimia)</th></tr></thead><tbody><tr><td>Hyphae</td><td>narrow, <b>septate</b>, <b>45°</b> acute branching</td><td><b>broad 10-15 μm, ribbon-like, non/pauci-septate, 90°</b> irregular branching</td></tr><tr><td>Host</td><td>neutropenia, leukemia/lymphoma, stem-cell transplant, steroids, AIDS CD4 &lt;50</td><td>diabetic ketoacidosis, iron overload/deferoxamine, transfusions</td></tr><tr><td>Signature</td><td>aspergilloma (fungus ball) in old cavity; angioinvasion</td><td>rhinocerebral \"black fungus\", angioinvasion</td></tr><tr><td>Drug</td><td>voriconazole (invasive), itraconazole/ampho B (aspergilloma), caspofungin refractory; posaconazole for terreus/flavus/lentulus</td><td>ampho B + surgical debridement</td></tr></tbody></table></div><ul><li>Clinical spectrum<ul><li>Allergic: asthma (IgE), <b>ABPA</b> (colonizes bronchi without invasion; asthma, infiltrates, eosinophilia, type I + III hypersensitivity, precipitins; steroids), extrinsic allergic alveolitis</li><li><b>Aspergilloma</b>: conidia germinate in a pre-existing cavity (TB, sarcoid) → hyphal ball; cough, hemoptysis, weight loss; rarely invasive; surgery if symptomatic</li><li>Colonization: sinuses, ear canal, cornea, nails</li><li><b>Invasive</b>: hyphae invade vessel walls → thrombosis, infarction, necrosis; spreads to GI, kidney, liver, brain; fever, cough, dyspnea, hemoptysis</li></ul></li><li>Diagnosis: KOH/calcofluor/histology, culture in days, galactomannan/β-D-glucan</li><li>Hospital link (2.09): construction dust → airborne Aspergillus spores; neutropenic patients need <b>positive-pressure protective environment + HEPA</b></li></ul><p class=\"rsrc\">Source: MCB 2.08 III.C Aspergillosis; III.D Mucormycosis</p>","2028-50":"<h5>Coccidioidal meningitis and CNS antifungals</h5><ul><li>Disseminated coccidioidomycosis (&lt;1%) favors <b>skin, bones/joints, and meninges</b>; risk: Filipinos &gt; African Americans &gt; Native Americans, pregnancy (estrogen-binding proteins), males, extremes of age, impaired CMI</li><li><b>Fluconazole = treatment of choice for coccidioidal meningitis because of excellent CNS penetration</b>; long-term/lifelong to keep the CNS clear</li><li>Amphotericin B is the drug for severe non-meningeal disease (then oral itraconazole for months) but penetrates CSF and joints poorly → intrathecal needed if used</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Drug</th><th>CNS penetration</th><th>CNS indication</th></tr></thead><tbody><tr><td><b>Fluconazole</b></td><td><b>best</b></td><td>cryptococcal and coccidioidal meningitis maintenance</td></tr><tr><td>Flucytosine</td><td>good</td><td>with ampho B for cryptococcal meningitis</td></tr><tr><td>Amphotericin B</td><td>poor (intrathecal)</td><td>induction for cryptococcal meningitis, severe systemic disease</td></tr><tr><td>Voriconazole</td><td>good</td><td>CNS aspergillosis</td></tr><tr><td>Itraconazole</td><td>poor</td><td>not for meningitis</td></tr><tr><td>Echinocandins</td><td>poor</td><td>not for meningitis</td></tr></tbody></table></div><ul><li>Coccidioides recap: arthroconidia (25°C) → spherules with endospores (37°C, diagnostic); Valley fever, erythema nodosum; skin test coccidioidin/spherulin; IgM active, IgG past; dust control (pave roads, plant grass)</li></ul><p class=\"rsrc\">Source: MCB 2.08 II.A.06 Coccidioidomycosis Treatment; IV.C Fluconazole</p>","2028-52":"<h5>Mucormycosis (zygomycosis)</h5><ul><li>Order <b>Mucorales</b>; ubiquitous thermotolerant saprophytes; leading agents <b>Rhizopus</b> (R. oryzae most prevalent), Rhizomucor, Lichtheimia (Absidia), Cunninghamella, Mucor</li></ul><p class=\"mech\"><i>Mechanism</i>spores adhere to basement-membrane matrix → lipolytic/glycosidic enzymes and proteases degrade stroma → hyphae invade vessels (<b>angioinvasion = most characteristic</b>) → thrombosis → ischemia and <b>necrosis</b> → black eschar; poor blood supply also keeps drugs and leukocytes out. Free iron drives growth: acidosis (DKA) releases iron from transferrin; transfusion iron overload, deferoxamine</p><ul><li>Normal host: neutrophils engulf hyphae; susceptible hosts: uncontrolled diabetes/ketoacidosis, iron overload, neutropenia, steroids, transplants</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Form</th><th>Picture</th></tr></thead><tbody><tr><td><b>Rhinocerebral</b> (major form)</td><td>spores germinate in nasal passages → sinuses, orbit, cranial bones, brain; facial edema, <b>bloody nasal discharge, black necrotic nasal/palatal tissue</b>, orbital cellulitis, cranial nerve loss; survivors may lose an eye</td></tr><tr><td>Thoracic/pulmonary</td><td>inhaled spores invade parenchyma and vessels (\"black fungus\")</td></tr><tr><td>Cutaneous, GI, disseminated</td><td></td></tr></tbody></table></div><ul><li>Microscopy: <b>broad (10-15 μm) hyphae, irregular thickness, sparse septa, right-angle branching</b>; culture rapid, cottony; identify by sporangia</li><li>Treatment: <b>urgent surgical debridement + amphotericin B</b> (posaconazole alternative) + control of underlying disease (correct DKA, stop deferoxamine)</li><li>Contrast Aspergillus: narrow septate 45°; neutropenia; voriconazole</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.D Mucormycosis</p>","2028-53":"<h5>Azole-resistant Candida</h5><ul><li>Widespread fluconazole use selected resistant species: <b>C. glabrata, C. krusei, C. lusitaniae</b>; <b>C. auris = multidrug-resistant</b></li><li>C. glabrata: yeast only, <b>no pseudohyphae</b>, CHROMagar <b>dark purple</b>; intrinsically reduced azole susceptibility; C. krusei intrinsically fluconazole-resistant (pink on CHROMagar)</li><li>Alternative therapy: <b>echinocandins</b> (caspofungin, micafungin, anidulafungin; inhibit 1,3-β-glucan synthase → cell wall failure; IV; well tolerated; \"resistant Candida infections\"), amphotericin B, posaconazole (fluconazole-resistant Candida)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Species</th><th>Pseudohyphae</th><th>Germ tube</th><th>CHROMagar</th><th>Azole</th></tr></thead><tbody><tr><td>C. albicans</td><td>yes (+ true hyphae)</td><td>+</td><td>green</td><td>susceptible</td></tr><tr><td>C. tropicalis</td><td>yes</td><td>-</td><td>blue</td><td>usually susceptible</td></tr><tr><td>C. glabrata</td><td><b>no</b></td><td>-</td><td>dark purple</td><td><b>resistant-prone</b></td></tr><tr><td>C. krusei</td><td>yes</td><td>-</td><td>pink</td><td>intrinsically fluconazole-R</td></tr><tr><td>C. parapsilosis</td><td>yes</td><td>-</td><td>pink</td><td>susceptible; catheters, neonates</td></tr><tr><td>C. auris</td><td></td><td></td><td></td><td>multidrug-R, hospital surfaces (contact precautions)</td></tr></tbody></table></div><ul><li>Antifungal classes and targets: polyenes (ampho B, nystatin) bind ergosterol → pores; azoles block ergosterol synthesis (14α-demethylase); echinocandins block glucan synthase; flucytosine → 5-FU blocks nucleic acid synthesis (used with ampho B, resistance emerges fast alone); griseofulvin disrupts microtubules; terbinafine inhibits squalene epoxidase</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.A Candidiasis (resistant species); IV.C Echinocandins</p>","DROPLET":"<h5>Transmission-based precautions (layered on standard, never instead)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Contact</th><th>Droplet</th><th>Airborne (AII)</th></tr></thead><tbody><tr><td>Particle</td><td>hands, fomites, surfaces</td><td>large droplets &gt;5 μm, fall within 1-2 m, not suspended</td><td>droplet nuclei ≤5 μm, suspended for hours, travel on air currents</td></tr><tr><td>Room</td><td>single/cohort, ≥1 m, curtain</td><td>single/cohort, ≥1 m, <b>door may stay open, no special air</b></td><td><b>negative-pressure</b> room, ≥12 air changes/h, exhaust outdoors/HEPA, door closed</td></tr><tr><td>Barrier</td><td><b>gown + gloves</b> on entry; dedicated equipment</td><td><b>surgical mask</b> on entry; eye protection for splash</td><td><b>fit-tested N95</b> on before entry, remove after leaving; add gown/gloves for varicella/disseminated zoster</td></tr><tr><td>Organisms</td><td>MRSA, VRE, ESBL/CRE, Acinetobacter, <b>C. difficile (soap + water, sporicidal)</b>, <b>norovirus/rotavirus (soap + water, hypochlorite)</b>, RSV, parainfluenza, C. auris, scabies/lice, draining wounds, diapered/incontinent diarrhea</td><td>influenza, <b>pertussis</b> (5 d macrolide), <b>N. meningitidis</b> (24 h therapy), Hib, group A strep (24 h), Mycoplasma, adenovirus, rhinovirus, <b>rubella, mumps</b> (5 d), diphtheria, pneumonic plague, RSV (+contact), SARS-CoV-2</td><td><b>M. tuberculosis</b>, <b>measles</b>, <b>varicella</b>, disseminated zoster (+contact), smallpox, SARS-CoV-2 during aerosol-generating procedures; Aspergillus spores need a positive-pressure PROTECTIVE environment for the patient</td></tr></tbody></table></div><ul><li>Droplet rule of three: no negative pressure, no respirator, surgical mask + hand washing are the interventions; mask the patient on transport</li><li>Pertussis is both a droplet pathogen and a re-emerging VPD (waning acellular-vaccine immunity, 2024 PH surge)</li><li>Contrast pairs the examiners love: <b>mumps/rubella = droplet vs measles = airborne</b>; <b>pertussis/meningococcus = droplet vs TB = airborne</b>; localized zoster = contact vs disseminated = airborne + contact</li><li>Duration: contagious even on treatment until the organism-specific window ends</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.F.03 Droplet Transmission; III.B.02 Droplet Precaution, Table 1</p>","CONTACT":"<h5>Transmission-based precautions (layered on standard, never instead)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Contact</th><th>Droplet</th><th>Airborne (AII)</th></tr></thead><tbody><tr><td>Particle</td><td>hands, fomites, surfaces</td><td>large droplets &gt;5 μm, fall within 1-2 m, not suspended</td><td>droplet nuclei ≤5 μm, suspended for hours, travel on air currents</td></tr><tr><td>Room</td><td>single/cohort, ≥1 m, curtain</td><td>single/cohort, ≥1 m, <b>door may stay open, no special air</b></td><td><b>negative-pressure</b> room, ≥12 air changes/h, exhaust outdoors/HEPA, door closed</td></tr><tr><td>Barrier</td><td><b>gown + gloves</b> on entry; dedicated equipment</td><td><b>surgical mask</b> on entry; eye protection for splash</td><td><b>fit-tested N95</b> on before entry, remove after leaving; add gown/gloves for varicella/disseminated zoster</td></tr><tr><td>Organisms</td><td>MRSA, VRE, ESBL/CRE, Acinetobacter, <b>C. difficile (soap + water, sporicidal)</b>, <b>norovirus/rotavirus (soap + water, hypochlorite)</b>, RSV, parainfluenza, C. auris, scabies/lice, draining wounds, diapered/incontinent diarrhea</td><td>influenza, <b>pertussis</b> (5 d macrolide), <b>N. meningitidis</b> (24 h therapy), Hib, group A strep (24 h), Mycoplasma, adenovirus, rhinovirus, <b>rubella, mumps</b> (5 d), diphtheria, pneumonic plague, RSV (+contact), SARS-CoV-2</td><td><b>M. tuberculosis</b>, <b>measles</b>, <b>varicella</b>, disseminated zoster (+contact), smallpox, SARS-CoV-2 during aerosol-generating procedures; Aspergillus spores need a positive-pressure PROTECTIVE environment for the patient</td></tr></tbody></table></div><h5>Why contact for C. difficile</h5><ul><li>Antibiotic-driven, <b>spore-mediated</b>, environmental reservoir; spores resist alcohol and routine disinfectants and persist for months</li><li>Alcohol hand rub is the default (60-95%, enveloped viruses, vegetative bacteria) but is <b>not sporicidal</b> → <b>soap and water with mechanical friction 40-60 s</b> after C. difficile care, visibly soiled hands, and suspected norovirus (non-enveloped viruses resist alcohol)</li><li>Room: <b>hypochlorite/sporicidal</b> daily and terminal cleaning; dedicated stethoscope/cuff/thermometer; gown + gloves on entry, removed inside the room, hand hygiene on exit</li><li>Contact indications list also includes draining wounds/uncontained secretions and diapered or incontinent diarrhea (rotavirus, norovirus)</li><li>Prior room occupant with an MDRO raises your patient's risk → environment is part of the chain</li><li>Survival on surfaces: gram-negatives outlast gram-positives; spores and mycobacteria longest; Klebsiella up to 600 days; C. difficile, MRSA, VRE, Acinetobacter, C. auris = months → target the environment; RSV hours, influenza 1-2 d → target hands and air</li></ul><p class=\"rsrc\">Source: MCB 2.09 III.B.01 Contact Precaution; III.A.01 Hand Hygiene; Survival of HAI Pathogens</p>","AIRBORNE":"<h5>Transmission-based precautions (layered on standard, never instead)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Contact</th><th>Droplet</th><th>Airborne (AII)</th></tr></thead><tbody><tr><td>Particle</td><td>hands, fomites, surfaces</td><td>large droplets &gt;5 μm, fall within 1-2 m, not suspended</td><td>droplet nuclei ≤5 μm, suspended for hours, travel on air currents</td></tr><tr><td>Room</td><td>single/cohort, ≥1 m, curtain</td><td>single/cohort, ≥1 m, <b>door may stay open, no special air</b></td><td><b>negative-pressure</b> room, ≥12 air changes/h, exhaust outdoors/HEPA, door closed</td></tr><tr><td>Barrier</td><td><b>gown + gloves</b> on entry; dedicated equipment</td><td><b>surgical mask</b> on entry; eye protection for splash</td><td><b>fit-tested N95</b> on before entry, remove after leaving; add gown/gloves for varicella/disseminated zoster</td></tr><tr><td>Organisms</td><td>MRSA, VRE, ESBL/CRE, Acinetobacter, <b>C. difficile (soap + water, sporicidal)</b>, <b>norovirus/rotavirus (soap + water, hypochlorite)</b>, RSV, parainfluenza, C. auris, scabies/lice, draining wounds, diapered/incontinent diarrhea</td><td>influenza, <b>pertussis</b> (5 d macrolide), <b>N. meningitidis</b> (24 h therapy), Hib, group A strep (24 h), Mycoplasma, adenovirus, rhinovirus, <b>rubella, mumps</b> (5 d), diphtheria, pneumonic plague, RSV (+contact), SARS-CoV-2</td><td><b>M. tuberculosis</b>, <b>measles</b>, <b>varicella</b>, disseminated zoster (+contact), smallpox, SARS-CoV-2 during aerosol-generating procedures; Aspergillus spores need a positive-pressure PROTECTIVE environment for the patient</td></tr></tbody></table></div><h5>Airborne specifics</h5><ul><li>Droplet nuclei (≤5 μm) are desiccated residues that behave like a gas: inhaled deep into the lower airway, bypass upper-airway defenses, infect without face-to-face contact; TB persists 24-48 h in air but dies in sunlight</li><li>Requirements: negative pressure relative to corridor (air flows in), ≥12 ACH (≥6 in old buildings), exhaust outdoors or HEPA, door closed, daily pressure monitoring, N95 with seal check before entry, patient masked for transport, <b>immune staff for measles/varicella</b>, limit visitors</li><li>A surgical mask (even doubled) is not enough</li><li>Positive pressure = protective isolation for immunocompromised (BMT) against Aspergillus, the opposite of AII</li><li>Measles reminders: R0 12-18 → herd threshold 92-94%; airborne contagious prodrome to 2-5 d of rash; TB is the classic BSL-3/airborne organism</li><li>Occupational infections listed in 2.09: HBV, HCV, HIV, TB, influenza, pertussis, measles → vaccinate staff (HBV, flu, MMR, varicella, Tdap, COVID), fit-test yearly, TB screen, report exposures</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.F.04 Airborne; III.B.03 Airborne Infection Isolation</p>","STD":"<h5>Standard precautions</h5><ul><li>Applied to <b>every patient, every encounter, regardless of diagnosis</b> — you cannot know who is colonised</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Component</th><th>Content</th></tr></thead><tbody><tr><td><b>Hand hygiene</b></td><td>alcohol rub default (60-95%, 20-30 s); soap and water when visibly soiled, after C. difficile/spore-formers, suspected norovirus; short nails, no artificial nails; gloves are not a substitute; WHO 5 moments</td></tr><tr><td><b>PPE by anticipated exposure</b></td><td>gloves for non-intact skin/mucosa/fluids, gown if clothing may be soiled, mask + eye protection for splashes; donning: hand hygiene → gown → mask → goggles → gloves; doffing: gloves → goggles → gown → mask (after leaving room) → hand hygiene</td></tr><tr><td><b>Respiratory hygiene / cough etiquette</b></td><td>cover, dispose, clean hands, mask the symptomatic source, separate ≥1 m, signage; introduced after SARS; replace mask after 8 h</td></tr><tr><td><b>Safe injection practices</b></td><td>one needle, one syringe, one time; never re-enter a vial</td></tr><tr><td>Safe handling of equipment/linen, sharps safety</td><td>engineered devices, immediate disposal</td></tr><tr><td>Workforce protection</td><td>immunisation (HBV, flu, MMR, varicella, Tdap, COVID), fit testing, TB screening, exposure reporting/PEP, stay home when ill</td></tr></tbody></table></div><ul><li>NOT part of standard precautions: <b>N95/negative pressure</b> (airborne), gown + gloves on entry (contact), <b>antibiotic prophylaxis for staff</b>, isolation rooms</li><li>Expanded (transmission-based) precautions are added on top by route; some organisms need two (RSV contact + droplet; disseminated zoster airborne + contact)</li><li>Resident vs transient flora: residents live deep (only reduced by chlorhexidine/alcohol scrubs, provide colonisation resistance); transients lie superficially, survive minutes-hours, are removed by friction/alcohol, and are where HAI pathogens live (MRSA, C. difficile, respiratory and enteric viruses) → the whole case for hand hygiene</li></ul><p class=\"rsrc\">Source: MCB 2.09 III.A Standard Precaution; II.D Resident vs Transient Flora</p>","2028-68":"<h5>Healthcare-associated (nosocomial) infection</h5><ul><li>CDC: infection that occurs in a patient during the process of receiving health care that was <b>not present or incubating at the time of admission</b></li><li>Includes infections that manifest after discharge (SSI up to 30 d, 90 d with implant; C. difficile weeks later) and occupational infections in staff</li><li>Convention: onset <b>≥48 h after admission</b> (or within 10 d after discharge) = HAI; &lt;48 h = community-acquired; the cut-off approximates an incubation period, so test it against the suspected organism</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>HAI</th><th>Community-acquired</th></tr></thead><tbody><tr><td>acquired during care for another condition</td><td>present/incubating on admission</td></tr><tr><td>MDR hospital flora (MRSA, ESBL, CRE, Acinetobacter, C. difficile)</td><td>usually drug-susceptible strains</td></tr><tr><td>overlap: dialysis, nursing-home, outpatient-infusion patients carry hospital organisms</td><td></td></tr></tbody></table></div><ul><li>Burden: 1 in 10 admissions; sepsis risk 23.5%; AMR, mortality, longer stay, cost; prevalence fell 1 in 31 (2015) → 1 in 38 (2023) because prevention works</li><li>Types: device-associated (SSI, CAUTI, VAP, CLABSI) vs the <b>majority (&gt;60%) not device-related</b> (non-ventilator pneumonia — now the largest category, C. difficile, norovirus/rotavirus, pressure-ulcer infections, adenovirus keratoconjunctivitis from tonometers)</li><li>Patient safety = absence of preventable harm; primum non nocere</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.A-C Healthcare-Associated Infections</p>","2028-69":"<h5>Sites and organisms of HAI (2.09 Types of HAIs)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Type</th><th>Leading organisms</th><th>Note</th></tr></thead><tbody><tr><td><b>CAUTI</b></td><td><b>E. coli</b> most common; Klebsiella, Proteus, Enterococcus, P. aeruginosa, Candida</td><td>urinary tract = classically the most common HAI site; risk rises with each catheter-day</td></tr><tr><td>VAP / non-ventilator HAP</td><td><b>P. aeruginosa</b> most common VAP; S. aureus/MRSA second; Acinetobacter, Klebsiella, Enterobacter; aspiration of oral flora in HAP</td><td>pneumonia is now the largest HAI category, mostly non-ventilator</td></tr><tr><td>SSI</td><td>S. aureus, coagulase-negative staph, E. coli, Enterococcus, anaerobes</td><td>counted to 30 d / 90 d with implant</td></tr><tr><td>CLABSI</td><td>coagulase-negative staph, S. aureus, Enterococcus, Candida, Klebsiella</td><td>skin flora, gram-positives</td></tr><tr><td>C. difficile</td><td>antibiotic-driven, spores</td><td>contact + soap/water</td></tr><tr><td>GI outbreaks</td><td>norovirus, rotavirus</td><td>PPI use predisposes</td></tr><tr><td>Skin/pressure ulcer</td><td>S. aureus, streptococci, anaerobes</td><td>bedbound</td></tr><tr><td>Eye</td><td>adenovirus (tonometers)</td><td>fomite</td></tr></tbody></table></div><ul><li>Printed 2028 key = urinary tract for \"most common site\"; the same lecture notes pneumonia has become the largest category in recent surveys — know both statements</li><li>Risk factors: extremes of age, immunosuppression, diabetes, barrier loss, MDRO colonisation, broad-spectrum antibiotics, PPIs, devices (catheters, lines, ventilators), long stay/ICU, understaffing, poor hand hygiene, construction (Aspergillus), water systems (Legionella, Pseudomonas)</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C Types of HAIs; II.E Risk Factors</p>","2028-70":"<h5>Nosocomial pneumonia</h5><ul><li><b>Ventilator-associated pneumonia: P. aeruginosa most common</b>, S. aureus incl. MRSA second, then Acinetobacter, Klebsiella, Enterobacter</li><li>Non-ventilator hospital-acquired pneumonia (now the largest HAI category): aspiration of oral flora, S. aureus, gram-negative rods; elderly, bedbound, sedated, poorly mobilised → oral care and mobilisation prevent it</li><li>Pseudomonas ecology: moist reservoirs (sinks, water systems, tanks), survives on surfaces, intrinsically multidrug-resistant; Acinetobacter survives dry (ICU); Klebsiella up to 600 d on surfaces</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Setting</th><th>Typical pneumonia organisms</th></tr></thead><tbody><tr><td>Community</td><td>S. pneumoniae, H. influenzae, Mycoplasma, viruses</td></tr><tr><td>Post-influenza</td><td>S. aureus, S. pneumoniae, H. influenzae (2.04)</td></tr><tr><td>Hospital/VAP</td><td><b>P. aeruginosa</b>, MRSA, Acinetobacter, Klebsiella, Enterobacter</td></tr><tr><td>Immunocompromised</td><td>Pneumocystis (CD4 &lt;200), Aspergillus, CMV, Legionella</td></tr></tbody></table></div><ul><li>Why HAI vs CAP matters: organisms and therefore antibiotic regimens differ</li><li>Prevention: hand hygiene, head-of-bed elevation, oral care, daily sedation/extubation assessment, insertion bundles for the device-related fraction</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C.01-02 Device-associated and non-device HAIs</p>","2028-72":"<h5>The 48-hour convention</h5><ul><li>CDC/lecture: HAIs develop <b>48 hours or more after admission</b>, may also appear within 10 days after discharge; not present or incubating at admission</li><li>&lt;24-48 h after admission → probably community-acquired (was incubating)</li><li>It is a convention, not a biologic law: approximates a typical incubation period; exceptions counted as HAI beyond 48 h include SSI (30 d; 90 d with implant) and C. difficile (weeks after discharge); always check the incubation period of the organism you suspect</li><li>Also HAI: infection acquired in the facility but manifesting after discharge; occupational infection in healthcare workers</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Timeframe</th><th>Classification</th></tr></thead><tbody><tr><td>&lt;48 h</td><td>community-acquired</td></tr><tr><td>≥48 h after admission</td><td>healthcare-associated</td></tr><tr><td>≤10 d after discharge</td><td>healthcare-associated</td></tr><tr><td>≤30 d post-op (90 d with implant)</td><td>surgical site infection</td></tr></tbody></table></div><ul><li>Related definitions: nosocomial = hospital-acquired HAI; community-acquired = present/incubating on admission, drug-susceptible strains</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.A-B Definition; The 48-hour Convention</p>","2028-74":"<h5>CAUTI risk</h5><ul><li><b>Duration of catheterisation is the single most important risk factor</b>; risk rises with every catheter-day → daily necessity review and early removal are the key preventions</li><li>Organisms: <b>E. coli</b> most common; Klebsiella, Proteus, Enterococcus, P. aeruginosa, Candida</li><li>Other device risk factors in 2.09: central venous/arterial catheters (CLABSI), endotracheal tube/ventilation (VAP), surgery/drains/dialysis/parenteral nutrition, reprocessed endoscopes</li><li>Host and therapeutic risk factors: extremes of age, immunosuppression, diabetes, malnutrition, obesity, barrier loss (burns, wounds, pressure ulcers, mucositis), MDRO colonisation, broad-spectrum antibiotics (select MDROs and C. difficile), PPIs, biologics, prolonged therapy</li><li>Institutional: long stay, ICU, understaffing, crowding, low hand-hygiene compliance (~50% baseline), poor cleaning, prior MDRO occupant, construction, water systems</li><li>Insertion bundles help only the device-related ~39%; hand hygiene, oral care, mobilisation and cleaning act on the rest</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C Types of HAIs; II.E Risk Factors; Formative quiz Q5</p>","2028-76":"<h5>UTI after catheterisation: E. coli</h5><ul><li>Catheter-associated UTI organisms in order: <b>E. coli (most common)</b>, Klebsiella, Proteus, Enterococcus, P. aeruginosa, Candida</li><li>Timing 3 days after catheter = ≥48 h → healthcare-associated</li><li>Mechanism: resident gut flora (E. coli) translocating along the catheter; catheter breaches the barrier and gives a biofilm surface; each catheter-day adds risk</li><li>Resident flora turning pathogenic when they cross a barrier (2.09): E. coli → UTI/peritonitis; S. epidermidis → biofilm on valves/lines; viridans strep → endocarditis; Candida overgrowth after broad-spectrum antibiotics</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>HAI</th><th>#1 organism</th></tr></thead><tbody><tr><td>CAUTI</td><td>E. coli</td></tr><tr><td>VAP</td><td>P. aeruginosa (MRSA #2)</td></tr><tr><td>CLABSI</td><td>coagulase-negative staphylococci</td></tr><tr><td>SSI</td><td>S. aureus</td></tr><tr><td>Antibiotic-associated colitis</td><td>C. difficile</td></tr><tr><td>Ward gastroenteritis outbreak</td><td>norovirus, rotavirus</td></tr></tbody></table></div><ul><li>Prevention: avoid unnecessary catheters, aseptic insertion, closed drainage, daily removal review, hand hygiene</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C.01 CAUTI</p>","2028-77":"<h5>MRSA in healthcare</h5><ul><li>Significance = <b>resistance to multiple antibiotics</b> (methicillin/all β-lactams, often others) → limited treatment options, worse outcomes, longer stay, spread within facilities</li><li>Where it lives: <b>transient flora</b> on hands and surfaces (the most common transient HAI pathogens: MRSA, C. difficile, respiratory and enteric viruses); ~20-30% of people are persistent nasal carriers of S. aureus (nose touching can seed a surgical site)</li><li>Roles: SSI (#1), VAP (#2 after Pseudomonas), CLABSI, skin/soft tissue, pressure ulcers; occupational risk to staff is via contact, not droplets</li><li>Transmission: direct + indirect contact → <b>contact precautions: gown and gloves on entry</b>, dedicated equipment, hand hygiene (alcohol works; MRSA is not a spore)</li><li>Survives on dry surfaces for months (S. aureus persists longer when dry, unlike most bacteria that like humidity) → daily and terminal cleaning</li><li>Other MDROs in the same bracket: VRE, ESBL and carbapenemase-producing Enterobacterales (CRE), Acinetobacter baumannii, C. auris; prior colonisation or a prior room occupant with an MDRO raises risk; broad-spectrum antibiotics select them</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.D Transient Flora; II.F Direct/Indirect Contact; III.B.01 Contact Precaution; Survival of HAI Pathogens</p>","2028-78":"<h5>Surgical asepsis vs the other cleanliness levels</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Term</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>Cleaning/sanitation</td><td>remove soil, reduce microbes</td><td>washing surfaces</td></tr><tr><td>Disinfection</td><td>kill most vegetative organisms on inanimate objects</td><td>hypochlorite on bed rails</td></tr><tr><td>Antisepsis</td><td>reduce microbes on living tissue (resident flora only reduced, never eliminated)</td><td>chlorhexidine/alcohol hand scrub</td></tr><tr><td>Sterilisation</td><td>destroy all microbes including spores</td><td>autoclaved instruments</td></tr><tr><td>Medical (clean) asepsis</td><td>reduce number/transfer of organisms</td><td>standard precautions, hand hygiene, clean gloves</td></tr><tr><td><b>Surgical (sterile) asepsis</b></td><td>keep an area <b>free of all microorganisms</b>: surgical scrub, sterile gown and gloves, sterile field, sterile instruments</td><td>CABG preparation in the vignette</td></tr></tbody></table></div><ul><li>The 3-minute chlorhexidine scrub to the elbows targets <b>resident flora</b> (deep in stratum corneum, follicles, glands; not removed by routine washing, only reduced by antiseptic scrubs); sterile gown/gloves then keep transient flora off the field</li><li>Skin is disinfected, never sterilised (sanitation → disinfection → sterilisation)</li><li>Donning order for PPE: hand hygiene → gown → mask/respirator → goggles → gloves; doffing: gloves → goggles → gown → mask → hand hygiene</li><li>Surgical site infection organisms: S. aureus (nasal carriers), coagulase-negative staph, E. coli, Enterococcus, anaerobes; counts up to 30 d (90 d with implant)</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.D Resident Flora; III.A.02 PPE; II.C.01 SSI</p>","AVIAN":"<h5>Avian influenza</h5><ul><li>\"Bird flu\"/fowl plague: influenza <b>A</b> subtypes of birds (wild birds, waterfowl, poultry reservoir); occasionally jumps to humans by direct/indirect poultry contact; human-to-human very rare</li><li>\"Highly pathogenic\" = genetic traits causing lethal poultry outbreaks</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>A(H5N1)</th><th>A(H7N9)</th><th>A(H5N6)</th><th>Pandemic A(H1N1)pdm09</th></tr></thead><tbody><tr><td>First</td><td>Hong Kong 1997, 3-y-old; A/Goose/Guangdong/1/96 lineage</td><td>Eastern China 2013, 87-y-old; quadruple reassortant of Eurasian avian viruses</td><td><b>Philippines 2017</b>, Pampanga &amp; Nueva Ecija; 37,000 birds died, 600,000 culled, no human case</td><td>2009, first 21st-century pandemic; bird-human-swine reassortment</td></tr><tr><td>Age</td><td>children and young adults</td><td>older, median 61, 71% male</td><td>—</td><td>children/young adults; 87% of deaths &lt;65</td></tr><tr><td>Severity</td><td>CFR ~48-59% (WPR 66%); <b>severe pneumonia</b>, high mortality</td><td>severe; low pathogenicity in poultry so hard to track/cull</td><td>poultry only</td><td>usually mild, CFR 0.02%; viral pneumonitis/secondary bacterial pneumonia</td></tr><tr><td>Why</td><td><b>tropism for α2,3 sialic acid receptors in the LOWER respiratory tract</b> → severe illness but limited person-to-person spread</td><td></td><td></td><td></td></tr></tbody></table></div><ul><li>Drivers: bird migration, poultry trade, illegal bird transport; 2026 H5N9 in Oriental Mindoro</li><li>Pandemic potential: adaptation of HA from α2,3 (avian) to α2,6 (human) receptors, or reassortment in pigs (both receptors) → antigenic shift</li><li>Prevention: avoid sick/dying birds, wash hands, PPE for handling/culling, no home slaughter of live chickens, cook poultry and eggs thoroughly; pandemic response = surveillance, isolation, school closure, monovalent vaccine, neuraminidase inhibitors</li></ul><p class=\"rsrc\">Source: MCB 2.10 III.A Avian Influenza; Appendix comparison table</p>","CVDPV":"<h5>Circulating vaccine-derived poliovirus</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Category</th><th>Meaning</th></tr></thead><tbody><tr><td>Wild poliovirus</td><td>natural types 1, 2, 3; type 2 eradicated 1999, type 3 gone since 2012, type 1 = 100% of wild cases; endemic Afghanistan and Pakistan</td></tr><tr><td>Sabin / Sabin-like</td><td>live attenuated OPV strain, shed after vaccination, minimally diverged</td></tr><tr><td>VDPV</td><td>Sabin virus that mutated (&gt;1% divergence types 1/3, &gt;0.6% type 2) and regained neurovirulence</td></tr><tr><td><b>cVDPV</b></td><td>VDPV with <b>person-to-person transmission</b> in a community (human or environmental detections)</td></tr></tbody></table></div><ul><li><b>Type 2 causes 86%</b> of cVDPV (type 1 13%, type 3 1%) → type 2 removed from OPV in 2015 (trivalent → bivalent); IPV still contains all three and cannot revert</li></ul><p class=\"mech\"><i>Mechanism</i>OPV virus replicates in the gut of an under-immunised population → error-prone polymerase accumulates mutations (~1 per genome replication) and recombines → virulence returns → spreads where coverage is low</p><ul><li>Philippines timeline: polio-free 2000; July 2019 VDPV1 in Manila Bay sewage; Sept 14 2019 confirmed <b>cVDPV2 AFP case, Lanao del Sur</b>; outbreak declared Sept 19 2019; cases mostly cVDPV2 in Mindanao, Laguna, QC, Nueva Ecija; declared over June 11 2021; response = AFP surveillance, supplementary immunisation (Sabayang Patak), monitoring, risk communication</li><li>PPS 2026: OPV 6, 10, 14 wk; IPV 14 wk and 9 mo; OPV is cheaper so IPV transition is slow</li><li>Eradication (global, permanent zero) vs elimination (zero in a defined area)</li></ul><p class=\"rsrc\">Source: MCB 2.10 II.D Polio, Table 7-10; MCB 2.03 Poliovirus Epidemiology</p>","PERT":"<h5>Pertussis re-emergence</h5><ul><li>Multifactorial: better diagnosis (awareness, surveillance, PCR), microbial adaptation of circulating strains, <b>vaccine characteristics: waning immunity after acellular vaccine</b> (which replaced whole-cell because of reactogenicity), vaccine refusal over safety fears, coverage gaps and schedules (PH gives primary doses only, no boosters; DPT3 coverage 71%)</li><li>PH: low stable counts to 2017, spike 2018-19, <b>massive surge peaking 2024 (&gt;800 cases)</b>; diphtheria also spiked 2024</li><li>Herd immunity: R0 5-17 → threshold 92-94%; child is fully immunised only after all three doses</li></ul><h5>Factors behind re-emergence of vaccine-preventable diseases</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Factor</th><th>Example</th></tr></thead><tbody><tr><td>Failure to vaccinate (system)</td><td>missed opportunities, pandemic interruption of services</td></tr><tr><td>Refusal/deferral</td><td>beliefs, <b>Dengvaxia hesitancy</b></td></tr><tr><td>Vaccine failure/waning</td><td><b>acellular pertussis</b></td></tr><tr><td>Pathogen escape</td><td>pneumococcal serotype replacement/capsular switching</td></tr></tbody></table></div><ul><li>Measles: target 95%; MCV1 1982, MCV2 2009; coverage 70-80% → pockets of outbreaks as susceptibles accumulate (cycle)</li><li>Diphtheria re-emergence = interruption of immunisation programmes; polio = cVDPV in low-coverage areas</li><li>In the ward pertussis is a <b>droplet</b> pathogen, contagious until 5 days of macrolide therapy (2.09)</li></ul><p class=\"rsrc\">Source: MCB 2.10 II.B Pertussis; II.E Factors; Table 2, 5, 11</p>","VOC":"<h5>SARS-CoV-2 variant categories (WHO)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Category</th><th>Definition</th></tr></thead><tbody><tr><td>Variant under monitoring (VUM)</td><td>genetic changes suspected to affect virus properties, needs watching</td></tr><tr><td><b>Variant of interest (VOI)</b></td><td>mutations predicted/known to affect transmissibility, severity, imm
