ction and leaves immunity.</li></ol><ul class=\"l1\"><li><b>Clinical</b><ul class=\"l2\"><li>Very rapid onset of fever, nausea and headache</li><li>Joint pain, especially in the extremities, which may be prolonged and recur</li><li>Rash in half of patients</li><li>Neurological involvement is uncommon, mainly seizures or encephalopathy in children</li><li>Mortality is about 1 in 1,000</li><li><b>No vaccine</b> and <b>no antiviral</b>, only anti-inflammatory drugs for the joints and mosquito control as for <b>dengue</b></li></ul></li></ul><h5>Togaviridae versus Flaviviridae among the arboviruses</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Togaviridae, genus Alphavirus</th><th>Flaviviridae, genus Flavivirus</th></tr></thead><tbody><tr><td><b>Size</b></td><td>70 nm</td><td>50 nm</td></tr><tr><td><b>Members</b></td><td>chikungunya, eastern equine encephalitis (30% mortality, wild birds, horses and humans dead-end, half of survivors with sequelae), western equine encephalitis (milder), Venezuelan equine encephalitis, Mayaro, O'nyong-nyong, Ross River</td><td>dengue, yellow fever, Japanese encephalitis, Zika, West Nile, St. Louis encephalitis, tick-borne encephalitis, plus hepatitis C in a separate genus</td></tr><tr><td><b>Note</b></td><td>the genus Rubivirus (rubella) has been moved out to Matonaviridae and is not an arbovirus</td><td>RNA is infectious and works directly as mRNA</td></tr></tbody></table></div><h5>Joint pain differentials among the viruses</h5><ul class=\"l1\"><li><b>Chikungunya:</b> <b>synovial</b> tropism, severe, prolonged and recurring polyarthralgia.<ul class=\"l2\"><li><b>Dengue:</b> breakbone myalgia and arthralgia that resolve.</li><li><b>Zika:</b> mild arthralgia with conjunctivitis and rash.</li><li><b>Parvovirus B19:</b> symmetrical small-joint arthritis of the hands in adult women.</li><li><b>Rubella:</b> arthralgia in adult women.</li><li><b>Hepatitis B:</b> a serum-sickness-like arthritis in the prodrome.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.05 B.1 Chikungunya, Tables 32 to 34, MCB 2.10 III.C Chikungunya, Table 13</p>","PML":"<h5>Progressive multifocal leukoencephalopathy</h5><ul class=\"l1\"><li>The agent is the <b>JC virus</b>, a member of <b>Polyomaviridae</b>: small (45 nm), naked, <b>icosahedral</b>, circular double-stranded DNA of about 5 kb, three structural proteins with the DNA condensed by cellular histones, replication in the nucleus, Baltimore group I.</li></ul><h5>Pathogenesis, step by step</h5><ol class=\"l1\"><li>Infection occurs in childhood, usually silently, through respiratory droplets and possibly urine.<ul class=\"l2\"><li>Seventy to eighty percent of adults carry antibody.</li></ul></li><li>The virus persists in the kidneys and lymphoid tissue for life.</li><li>Immunosuppression (AIDS, where about 5% develop PML, transplantation, immunosuppressive drugs, and therapeutic monoclonal antibodies) allows reactivation.</li><li>The reactivated virus reaches the CNS through the bloodstream and carries out a <b>cytocidal infection of oligodendrocytes</b>, the myelin-producing cells.</li><li>The result is <b>demyelination confined to the white matter</b>, with lesions in the centrum semiovale, parietal and occipital lobes and cerebellum.</li></ol><ul class=\"l1\"><li><b>Clinical:</b><ul class=\"l2\"><li>Visual deficits</li><li>Impaired speech and mental capacity</li><li>Weakness</li><li>Ataxia and seizures</li><li>Progressing to paralysis and sensory loss</li><li>With death usually in 3 to 6 months</li></ul></li><li><b>Laboratory</b><ul class=\"l2\"><li>MRI shows multifocal, asymmetric, coalescing white-matter lesions</li><li><b>CSF PCR for JC virus DNA</b> has 92 to 100% specificity with variable sensitivity</li></ul></li><li>No consistently effective therapy exists.<ul class=\"l2\"><li>Mirtazapine may inhibit binding of the virus to its receptor on <b>oligodendrocytes</b>.</li><li>Restoring immune function is the real treatment.</li></ul></li></ul><h5>The three human polyomaviruses</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Disease</th><th>Tissue</th><th>Patient</th></tr></thead><tbody><tr><td><b>JC virus</b></td><td>progressive multifocal leukoencephalopathy</td><td>CNS white matter, oligodendrocytes</td><td>immunocompromised, especially AIDS</td></tr><tr><td><b>BK virus</b> (human polyomavirus 1)</td><td>hemorrhagic cystitis in bone marrow transplant patients, polyomavirus-associated nephropathy with graft failure in about 5% of kidney transplant recipients</td><td>urinary tract and bladder</td><td>immunocompromised, sheds in urine</td></tr><tr><td><b>Merkel cell virus</b></td><td>Merkel cell carcinoma, a rare aggressive neuroendocrine skin cancer with clonally integrated viral DNA whose oncogenes are needed for tumor growth</td><td>skin</td><td>older adults and the immunosuppressed</td></tr><tr><td><b>SV40</b></td><td>model tumor virus, large T antigen binds p53 and pRb</td><td></td><td></td></tr></tbody></table></div><h5>The slow virus infections, which the papers keep swapping</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Agent</th><th>Type of agent</th><th><b>Hallmark</b></th></tr></thead><tbody><tr><td><b>PML</b></td><td>JC virus</td><td>conventional DNA virus</td><td>white-matter demyelination in the immunosuppressed, CSF JCV PCR</td></tr><tr><td><b>SSPE</b></td><td>measles virus</td><td>conventional RNA virus</td><td>years after childhood measles, high CSF measles antibody, myoclonus</td></tr><tr><td><b>Creutzfeldt-Jakob disease and kuru</b></td><td>prion</td><td>unconventional agent without nucleic acid</td><td>dementia, ataxia, myoclonus, no inflammation</td></tr></tbody></table></div><ul class=\"l1\"><li>All three share a long asymptomatic gap of months or years between exposure and disease, which is what \"slow virus\" means.</li></ul><p class=\"rsrc\">Source: MCB 2.02 Polyomavirinae, Table 8, MCB 2.06 II.C PML, VI.B Polyomaviruses, Table 18</p>","RETRO":"<h5>Retrovirus replication and the drugs that block each step</h5><ul class=\"l1\"><li><b>Retroviridae</b><ul class=\"l2\"><li>Spherical, 80 to 110 nm, enveloped, with a <b>helical</b> nucleoprotein core inside an <b>icosahedral</b> <b>capsid</b></li><li>The genome is <b>diploid positive-sense single-stranded RNA</b> of 7 to 11 kb, but it is never used as mRNA</li><li>The virion carries <b>reverse transcriptase</b>, and the defining event is copying RNA into DNA that integrates into the host chromosome as a provirus</li></ul></li><li><b>Core genes</b><ul class=\"l2\"><li><b>gag</b>: core proteins</li><li><b>pro</b>: protease</li><li><b>pol</b>: <b>reverse transcriptase</b>, and with it <b>integrase</b></li><li><b>env</b>: the envelope glycoproteins gp120 and gp41</li></ul></li><li><b>HIV adds six accessory genes</b><ul class=\"l2\"><li>tat boosts transcription</li><li>rev exports unspliced RNA</li><li>nef raises infectivity and downregulates <b>CD4</b> and MHC I</li><li>vpr handles nuclear transport and G2 arrest</li><li>vpu degrades CD4</li><li>vif blocks APOBEC3G</li></ul></li></ul><h5>The life cycle, step by step, with the matching drug class</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Step</th><th>What happens</th><th>Drug class</th></tr></thead><tbody><tr><td><b>Attachment</b></td><td>gp120 binds CD4, then a chemokine co-receptor: CCR5 for macrophage-tropic strains, CXCR4 for lymphocyte-tropic strains</td><td>entry inhibitor maraviroc blocks CCR5</td></tr><tr><td><b>Fusion</b></td><td>gp41 exposes its fusion domain and the envelope fuses with the cell membrane</td><td>fusion inhibitor enfuvirtide</td></tr><tr><td><b>Release and uncoating</b></td><td>the capsid core moves toward the nucleus and begins to uncoat</td><td></td></tr><tr><td><b>Reverse transcription</b></td><td><b>reverse transcriptase, an RNA-dependent DNA polymerase encoded by pol, copies the RNA into double-stranded DNA</b></td><td>nucleoside and nucleotide RTIs (zidovudine, lamivudine, emtricitabine, tenofovir, abacavir, didanosine, stavudine) and non-nucleoside RTIs (efavirenz, nevirapine, rilpivirine, etravirine, delavirdine)</td></tr><tr><td><b>Integration</b></td><td><b>integrase inserts the viral DNA into the host chromosome as a provirus</b>, which stays for the life of the cell</td><td>integrase inhibitors dolutegravir, raltegravir</td></tr><tr><td><b>Transcription and translation</b></td><td>host machinery transcribes the provirus into genomic RNA and mRNAs, tat amplifies this, and env proteins are inserted into the ER membrane</td><td></td></tr><tr><td><b>Assembly and budding</b></td><td>RNA and proteins gather at the plasma membrane and immature particles bud off</td><td></td></tr><tr><td><b>Maturation</b></td><td>viral protease cleaves the Gag polyprotein so the particle becomes infectious</td><td>protease inhibitors ritonavir, darunavir, atazanavir, saquinavir, indinavir, nelfinavir, tipranavir, fosamprenavir</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Reverse transcriptase</b> must act first, because <b>integrase</b> can only insert DNA.<ul class=\"l2\"><li>This order is the answer to which enzyme is most essential and to the MOA questions.</li></ul></li><li>Most retroviruses are not cytolytic and the provirus can sit silently, which is why many are tumor viruses.<ul class=\"l2\"><li>Lentiviruses such as <b>HIV</b> are <b>the exception</b> and kill the cells they infect.</li></ul></li><li>RNA viruses replicate in the <b>cytoplasm</b>, <b>except</b> orthomyxoviruses and retroviruses, which use the nucleus.</li></ul><h5>Baltimore group VI and group VII</h5><ul class=\"l1\"><li>Group VI (<b>Retroviridae</b>, <b>HIV</b> and HTLV): positive RNA copied to DNA by <b>reverse transcriptase</b>, integrated, then transcribed by host RNA polymerase.<ul class=\"l2\"><li>Group VII (<b>Hepadnaviridae</b>, <b>hepatitis B</b>): a gapped double-stranded DNA genome that replicates through an RNA pregenome and its own reverse transcriptase.</li><li><b>Tenofovir</b> and lamivudine act on both HIV and HBV for this reason.</li></ul></li></ul><h5>Resistance</h5><ul class=\"l1\"><li>Resistance to <b>reverse transcriptase</b> inhibitors comes from <b>point mutations</b> in the pol gene, produced by the error-prone enzyme and the billions of virions made daily.<ul class=\"l2\"><li>Genotypic testing sequences the reverse transcriptase and protease genes at diagnosis and at treatment failure, and other assays cover <b>integrase</b>, fusion inhibitor resistance and co-receptor tropism.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 V.B Retroviruses, Table 15, VI.C Lentiviruses, VI.L Antiviral Drugs, Table 26, MCB 2.01 Groups VI and VII</p>","PRIONSHAPE":"<h5>Prion protein conformation</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>PrP^C, the normal cellular protein</th><th>PrP^Sc, the scrapie isoform</th></tr></thead><tbody><tr><td>a normal component of our cells, synthesized in the ER, transported through the Golgi to the cell surface and attached by a glycosylphosphatidylinositol anchor</td><td>a misfolded version of the same protein</td></tr><tr><td>rich in <b>alpha-helix</b></td><td>rich in <b>beta-pleated sheet</b></td></tr><tr><td>soluble and protease-sensitive</td><td>aggregates into amyloid fibrils and plaques, resists protease, heat, disinfectants and irradiation</td></tr><tr><td>harmless</td><td>self-propagating: it forces normal PrP^C to change shape, the protein-only hypothesis</td></tr></tbody></table></div><h5>The misfolding cascade, step by step</h5><ol class=\"l1\"><li>PrP^C is made and delivered to the plasma membrane.</li><li>At the cell surface or inside endocytic vesicles, PrP^Sc contacts PrP^C and forces it into the beta-sheet conformation.</li><li>Misfolded proteins join other misfolded proteins to form oligomers.<ul class=\"l2\"><li>Lipid raft microdomains and cofactors such as sulfated glycosaminoglycans make the conversion more efficient.</li></ul></li><li>PrP^Sc accumulates in lysosomes, stays in the plasma membrane, or is deposited outside the cell as amyloid.</li><li>These deposits cause the <b>spongiform</b> neurodegeneration seen in <b>prion</b> disease.</li></ol><h5>Why prions are unlike any virus</h5><ul class=\"l1\"><li>They are proteinaceous infectious particles with no nucleic acid, <b>the only</b> known transmissible pathogens without a genome, and they are described as epigenetically heritable.<ul class=\"l2\"><li>Distinct strains fold slightly differently and behave differently.</li></ul></li><li>Small (under 100 nm), incurable, extremely resistant to heat, disinfectants and irradiation but inactivated by strong chemicals such as phenol, periodate, sodium hydroxide and sodium <b>hypochlorite</b>.<ul class=\"l2\"><li>They replicate slowly with incubation periods up to 35 years, cannot be cultured, and provoke no immune or inflammatory response and no interferon, so they persist silently until the brain is badly damaged.</li></ul></li><li><b>Prion</b> diseases can be infectious (kuru from ritual cannibalism, iatrogenic CJD from growth hormone, dura grafts and instruments, bovine <b>spongiform</b> encephalopathy), genetic (PRNP mutation) or sporadic (spontaneous conversion).<ul class=\"l2\"><li>Scrapie is the sheep disease.</li></ul></li></ul><h5>Contrast with the conventional slow viruses</h5><ul class=\"l1\"><li>SSPE (<b>measles</b>) and PML (<b>JC virus</b>) are true viruses with genomes, they can be detected by antibody, antigen or <b>PCR</b>, and SSPE at least has an immune signature (high CSF antibody).<ul class=\"l2\"><li><b>Prion</b> disease has none of these.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 III Prions, Transmissible Spongiform Encephalopathies, Table 8</p>","SSPE":"<h5>Subacute sclerosing panencephalitis</h5><ul class=\"l1\"><li>A rare demyelinating disease of the CNS caused by a <b>chronic non-permissive infection with measles virus</b>.<ul class=\"l2\"><li>It is listed with PML as a slow virus disease caused by a conventional virus, in contrast to the unconventional agents that cause kuru and CJD.</li></ul></li><li>Frequency is about 1 per 100,000 to 500,000 <b>measles</b> cases.<ul class=\"l2\"><li>The typical history is measles at an early age (around 2 years), a latent interval of 6 to 8 years, then a progressive neurologic disorder.</li></ul></li></ul><h5>Pathogenesis</h5><ol class=\"l1\"><li>After acute <b>measles</b> the virus persists in the brain in a defective or altered form inside neurons and glial cells.</li><li><b>The infection is non-permissive:</b> virus is present but full replication is blocked, so no infectious virions are released.</li><li>Over years the persistent infection produces progressive inflammation, <b>demyelination</b> and neuronal damage, and large amounts of measles antigen accumulate inside inclusion bodies in brain cells.</li></ol><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Stage</th><th>Findings</th></tr></thead><tbody><tr><td><b>Initial</b></td><td>poor school performance, mood and personality changes</td></tr><tr><td><b>Progression</b></td><td>focal or generalized seizures, <b>myoclonus</b>, ataxia, visual disturbances</td></tr><tr><td><b>Late</b></td><td>unresponsive, quadriparetic, spastic with hyperactive reflexes and extensor plantar responses</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Laboratory:</b> <b>CSF anti-measles antibody is invariably elevated</b> with oligoclonal bands.<ul class=\"l2\"><li>Brain tissue can be cultured by cocultivation, and immunocytochemistry, in situ hybridization and <b>PCR</b> detect antigen and genome.</li></ul></li><li>No definitive therapy.<ul class=\"l2\"><li>Prevention is measles vaccination, and 2.10 sets the coverage target at 95% because measles has an R0 of 12 to 18.</li></ul></li></ul><h5>Where SSPE sits among the measles complications</h5><ul class=\"l1\"><li>Otitis media is the <b>most common</b> complication, secondary bacterial pneumonia the most life-threatening, giant-cell pneumonia strikes those with deficient cell-mediated immunity, acute encephalitis occurs in 1 per 1,000, acute disseminated encephalomyelitis is an autoimmune reaction to myelin basic protein, and SSPE is the rare late one.</li></ul><h5>The three chronic CNS diseases the papers swap</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Agent</th><th>Host</th><th>How to recognize it</th></tr></thead><tbody><tr><td><b>SSPE</b></td><td>measles, an RNA paramyxovirus</td><td>child years after measles</td><td>myoclonus, high CSF measles antibody</td></tr><tr><td><b>PML</b></td><td>JC virus, a DNA polyomavirus</td><td>immunosuppressed adult</td><td>white-matter lesions on MRI, CSF JCV PCR</td></tr><tr><td><b>CJD and kuru</b></td><td>prion, no nucleic acid</td><td>sporadic, genetic or iatrogenic</td><td>dementia, ataxia, myoclonus, no inflammation, no immune response</td></tr></tbody></table></div><ul class=\"l1\"><li>Other <b>measles</b> look-alikes for the \"years later\" pattern: <b>HIV</b> dementia complex is a late complication of HIV, and progressive <b>rubella</b> panencephalitis is the rare rubella equivalent.</li></ul><p class=\"rsrc\">Source: MCB 2.06 II.B SSPE, Tables 5 to 7, MCB 2.04 D.03 Measles Complications</p>","CJD":"<h5>Creutzfeldt-Jakob disease</h5><ul class=\"l1\"><li>A <b>transmissible spongiform encephalopathy caused by prions</b>, the unconventional agents of slow CNS disease.<ul class=\"l2\"><li>The conventional slow viruses are <b>measles</b> (SSPE) and <b>JC virus</b> (PML), which is why \"slow virus\" is a trap answer.</li></ul></li><li>The classic picture develops gradually with <b>progressive dementia, ataxia and myoclonus</b> and leads to death.<ul class=\"l2\"><li>The key clue in the vignette is that pathology shows <b>no inflammation</b>: <b>prions</b> provoke no inflammatory response, no immune response, no interferon and no change in B or T cell production.</li><li><b>Chronic</b> inflammation elsewhere in the body can actually help prions accumulate in those organs.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Type of CJD</th><th>Cause</th></tr></thead><tbody><tr><td><b>Sporadic</b></td><td>spontaneous transformation of normal prion protein into the abnormal isoform, no clear cause</td></tr><tr><td><b>Genetic</b></td><td>mutation in the PRNP gene</td></tr><tr><td><b>Iatrogenic</b></td><td>contaminated growth hormone preparations, cadaveric dura mater grafts, contaminated surgical instruments, because prions survive routine sterilization</td></tr><tr><td><b>Kuru</b></td><td>spread by ritual cannibalism in the Eastern Highlands of Papua New Guinea</td></tr><tr><td><b>Variant CJD</b></td><td>from bovine spongiform encephalopathy (mad cow disease)</td></tr></tbody></table></div><h5>The agent</h5><ul class=\"l1\"><li>A proteinaceous infectious particle that lacks nucleic acid, composed of misfolded protein that self-propagates.<ul class=\"l2\"><li>PrP^Sc, the scrapie isoform, accumulates in the brain and damages neural tissue.</li><li>Distinct strains have different biologic properties because they fold slightly differently.</li></ul></li><li>Under 100 nm, incurable, cannot be cultured, extremely resistant to heat, disinfectants and irradiation, inactivated only by phenol, periodate, sodium hydroxide or <b>hypochlorite</b>.<ul class=\"l2\"><li>Slow replication with incubation up to 35 years.</li></ul></li><li>There is no treatment, so it is always fatal.</li></ul><h5>The distractors and how to exclude them</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Distractor</th><th>Why it is not the answer</th></tr></thead><tbody><tr><td><b>Slow virus (SSPE, PML)</b></td><td>real viruses with genomes, detectable by PCR or antibody, and with inflammation or a CSF antibody signature</td></tr><tr><td><b>HSV encephalitis</b></td><td>acute, febrile, inflammatory, temporal lobe, the <b>most common</b> sporadic fatal encephalitis, diagnosed by CSF PCR, treated with acyclovir</td></tr><tr><td><b>Rabies</b></td><td>hydrophobia, agitation and hypersalivation with Negri bodies, always fatal but acute</td></tr><tr><td><b>JC virus</b></td><td>demyelination in the immunosuppressed, not dementia with myoclonus in a young man</td></tr><tr><td><b>HIV dementia complex</b></td><td>late-stage AIDS with memory loss and apathy, immunosuppression is the clue</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.06 III Prions, III.B Prion Diseases, Table 9</p>","HIVDIV":"<h5>Why HIV is so variable</h5><ul class=\"l1\"><li><b>HIV</b> exists as a spectrum of related viruses, and each infected person harbours a <b>quasispecies</b>, a swarm of closely related genomes.<ul class=\"l2\"><li>The trans attributes this to two things: a <b>high viral replication rate</b> (about 10 billion particles are produced and destroyed every day during clinical latency) and the <b>high error rate of reverse transcriptase</b>, which has no proofreading.</li></ul></li><li>A third contributor is the <b>diploid genome</b>.<ul class=\"l2\"><li>Every virion carries two copies of the RNA, which gives a genetic backup and allows <b>recombination</b> when the enzyme switches templates during reverse transcription.</li></ul></li><li>The structural genes gag and pol are highly conserved.<ul class=\"l2\"><li>The envelope glycoproteins show extensive variability, with gp120 carrying five variable regions of which V3 is key for neutralization.</li></ul></li></ul><h5>What the variability produces</h5><ul class=\"l1\"><li>Escape from neutralizing antibody and cytotoxic T cells, so the infection persists <b>lifelong</b> despite an antibody response.</li><li>Rapid drug resistance under monotherapy, which is why <b>HAART</b> combines several drug classes and why genotypic resistance testing sequences <b>reverse transcriptase</b> and protease at diagnosis and at failure.<ul class=\"l2\"><li>About 19% of perinatally infected infants already carry resistant strains.</li></ul></li><li>Failure of every candidate vaccine so far, because of high antigenic variability, incomplete clearance by the immune system, unknown correlates of protection and poor animal models (chimpanzees do not develop AIDS).</li><li>A shift in tropism over the course of disease, from macrophage-tropic CCR5-using strains early to lymphocyte-tropic CXCR4-using strains that are more virulent and cytopathic late.</li><li><b>Classification:</b> HIV-1 (global pandemic, groups M with many subtypes, N and O, from chimpanzee SIV) and HIV-2 (mainly West Africa, subtypes A to H, from sooty mangabeys).</li></ul><h5>Mechanisms of viral diversity across the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Mechanism</th><th>Viruses</th></tr></thead><tbody><tr><td><b>Point mutation from an error-prone polymerase</b></td><td>HIV reverse transcriptase, influenza drift, enteroviruses including vaccine-derived poliovirus, SARS-CoV-2 variants, rhinovirus serotypes</td></tr><tr><td><b>Recombination between templates in a co-infected cell</b></td><td>HIV (diploid genome), enteroviruses when two strains replicate together</td></tr><tr><td><b>Reassortment of genome segments</b></td><td>influenza A shift, rotavirus, hantavirus and the other B-O-A-R viruses</td></tr><tr><td><b>Antigenic stability</b></td><td>paramyxoviruses (measles, mumps, parainfluenza), rubella, which are monotypic</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.06 VI.B Classification, VI.D HIV Genetic Diversity and env Gene, VI.I Viral Evolution, VI.L Vaccine Challenges</p>","HTLV":"<h5>HTLV-1</h5><ul class=\"l1\"><li>Human T-lymphotropic virus type 1 is a <b>deltaretrovirus</b> that has existed in humans for thousands of years and is the causative agent of <b>adult T-cell leukemia-lymphoma (ATL)</b> and of HTLV-1-associated myelopathy, also called <b>tropical spastic paraparesis</b>.</li><li>Unlike the acute transforming retroviruses it <b>does not carry an oncogene</b>.<ul class=\"l2\"><li><b>It is a transregulating virus:</b> its <b>Tax</b> gene alters the expression of both viral and cellular genes, supporting replication and disrupting the normal control of cell growth.</li><li>Transformation is slow and takes decades.</li></ul></li><li>It has a marked affinity for mature <b>CD4</b> T cells but is expressed at very low levels.<ul class=\"l2\"><li>Its promoter and enhancer sequences in the long terminal repeat respond to signals of T-cell activation, so the virus replicates in step with the host cell, which spreads it efficiently.</li></ul></li><li>About 20 million people are infected worldwide.<ul class=\"l2\"><li><b>Transmission is mainly by cell-associated virus:</b><ul class=\"l3\"><li><b>Mother to child through breastfeeding</b></li><li>Blood transfusion</li><li>Shared needles</li><li>Sexual intercourse</li></ul></li><li>Infection early in life carries the <b>highest risk</b> of ATL later.</li></ul></li></ul><h5>HTLV-1 and HIV compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>HTLV-1</th><th>HIV</th></tr></thead><tbody><tr><td><b>Genus</b></td><td>Deltaretrovirus</td><td>Lentivirus</td></tr><tr><td><b>Effect on the cell</b></td><td>transforming, non-cytolytic</td><td>cytolytic, non-transforming</td></tr><tr><td><b>Cancer</b></td><td>direct, adult T-cell leukemia-lymphoma</td><td>indirect through immunosuppression: Kaposi sarcoma (HHV-8), non-Hodgkin lymphoma (EBV), cervical and anogenital cancer (HPV)</td></tr><tr><td><b>Key regulatory gene</b></td><td>tax</td><td>tat, rev, nef, vpr, vpu, vif</td></tr><tr><td><b>Neurologic disease</b></td><td>tropical spastic paraparesis</td><td>AIDS dementia complex, vacuolar myelopathy, peripheral neuropathy</td></tr><tr><td><b>Course</b></td><td><b>lifelong</b>, most carriers asymptomatic</td><td><b>lifelong</b>, progression to AIDS in about 10 years untreated</td></tr></tbody></table></div><h5>Retroviral oncogenesis in general</h5><ul class=\"l1\"><li>Highly oncogenic, directly transforming retroviruses carry a v-onc gene originally captured from a host cell and push cells toward cancer quickly.<ul class=\"l2\"><li>Weakly oncogenic, slowly transforming retroviruses lack an oncogene and act indirectly, through promoter insertion beside a proto-oncogene or through transactivation as <b>HTLV-1</b> does.</li><li>Retroviruses mainly cause tumors of the reticuloendothelial and hematopoietic systems: leukemias, lymphomas and sarcomas.</li></ul></li><li>Retroviruses are classified morphologically as type A (intracellular, non-infectious), B (eccentric nucleoid), C (the largest group, central nucleoid) and D (eccentric nucleoid with short spikes), and into seven genera: alpha, beta, gamma, delta (HTLV, bovine leukemia virus), epsilon, spumavirus (foamy cells, no disease) and lentivirus (<b>HIV</b>).</li></ul><p class=\"rsrc\">Source: MCB 2.06 V.C Human Retroviruses, Human T-Lymphotropic Viruses, Tables 10, 12 and 13</p>","EBV":"<h5>Epstein-Barr virus (HHV-4)</h5><ul class=\"l1\"><li>A gammaherpesvirus that replicates in mucosal epithelium and establishes latency in B cells, which it immortalizes.<ul class=\"l2\"><li>Spread almost entirely by saliva, during primary infection and during repeated episodes of asymptomatic shedding.</li><li>Primary infection in children is usually silent, in adolescents and adults it causes infectious mononucleosis.</li></ul></li></ul><h5>Pathogenesis, step by step</h5><ol class=\"l1\"><li>Infected saliva reaches the oropharynx and the virus replicates in epithelial cells of the pharynx and salivary glands.<ul class=\"l2\"><li>Infected people shed low levels of virus for weeks to months.</li></ul></li><li>Progeny infect <b>B lymphocytes through the C3d receptor (CD21)</b>.</li><li>Only a limited set of early proteins is made in B cells, and their expression leads to latency and immortalization rather than cell death.</li><li>Infected B cells spread through the body, driving polyclonal B-cell proliferation and a non-specific rise in <b>IgM</b>, <b>IgG</b> and <b>IgA</b>, which produces the heterophile antibody.</li><li>Most infected cells are cleared, but a small number of latently infected lymphocytes persist for life.<ul class=\"l2\"><li>Reactivation raises virus in saliva and is usually silent, <b>except</b> in the immunosuppressed.</li></ul></li></ol><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>EBV-associated disease</th><th>Details</th></tr></thead><tbody><tr><td><b>Infectious mononucleosis</b></td><td><ul class=\"cl\"><li>incubation 4 to 7 weeks, triad of fever, pharyngitis and cervical lymphadenopathy, splenomegaly, raised liver enzymes, atypical (Downey) T lymphocytes, <b>heterophile antibody positive</b></li><li>CMV mononucleosis is the heterophile-negative mimic</li></ul></td></tr><tr><td><b>Burkitt lymphoma</b></td><td>B-cell tumor of the jaw in African children, EBV DNA in most tumors, malaria expands the pool of infected cells, EBNA1 is <b>the only</b> protein consistently expressed</td></tr><tr><td><b>Nasopharyngeal carcinoma</b></td><td>epithelial cancer of Chinese and Southeast Asian males, EBV DNA regularly found, high antibody titers</td></tr><tr><td><b>Hodgkin disease</b></td><td>EBV genome in Reed-Sternberg cells</td></tr><tr><td><b>Non-Hodgkin, CNS and B-cell lymphomas, post-transplant lymphoproliferative disorder</b></td><td>immunodeficient, transplant and AIDS patients, all CNS non-Hodgkin lymphomas are EBV-associated, monitored by EBV DNA load</td></tr><tr><td><b>Gastric carcinoma</b></td><td>with Helicobacter co-infection</td></tr><tr><td><b>Oral hairy leukoplakia</b></td><td>wart-like tongue lesion in AIDS</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Not EBV:</b><ul class=\"l2\"><li><b>Merkel cell carcinoma</b> is caused by Merkel cell polyomavirus</li><li><b>Kaposi sarcoma</b> by <b>HHV-8</b></li><li>Cervical cancer by HPV</li><li><b>Hepatocellular carcinoma</b> by <b>hepatitis B</b> and C</li><li>Adult T-cell leukemia by <b>HTLV-1</b></li></ul></li></ul><h5>Oncogenesis</h5><ul class=\"l1\"><li><b>LMP1</b> acts like a growth-factor receptor that is permanently switched on, interacting with TRAFs to activate NF-κB and MAPK and driving survival and growth.<ul class=\"l2\"><li>The EBNA nuclear antigens are required for B-cell immortalization, and EBNA1 also blocks antigen processing so infected cells escape cytotoxic T cells.</li></ul></li></ul><h5>Diagnosis and treatment</h5><ul class=\"l1\"><li>EBV-specific serology is the <b>method of choice</b>: anti-VCA <b>IgM</b> and <b>IgG</b>, anti-EA IgG, anti-EBNA IgG, plus the heterophile agglutination test.<ul class=\"l2\"><li>In tissue, in situ hybridization for EBER is the <b>gold standard</b>, more sensitive than immunohistochemistry.</li><li>Quantitative <b>PCR</b> gives viral loads that predict post-transplant lymphoproliferative disorder.</li></ul></li><li><b>Acyclovir</b> reduces oropharyngeal shedding but does nothing to immortalized B cells or the symptoms of mononucleosis.</li></ul><h5>The herpesvirus family for context</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Subfamily</th><th>Members</th><th>Latency site</th></tr></thead><tbody><tr><td><b>Alpha</b></td><td>HSV-1, HSV-2, VZV</td><td>neurons of sensory ganglia</td></tr><tr><td><b>Beta</b></td><td>CMV, HHV-6, HHV-7</td><td>lymphoreticular and glandular tissue</td></tr><tr><td><b>Gamma</b></td><td>EBV, HHV-8</td><td>B cells (EBV), endothelial cells (HHV-8)</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.02 II.A.3 EBV, Table 13, MCB 2.06 VI.D Herpesviruses, Table 17</p>","HBVHCC":"<h5>Hepatitis B and hepatocellular carcinoma</h5><ul class=\"l1\"><li>Hepatitis B is a member of <b>Hepadnaviridae</b>, a 42 nm spherical enveloped virus with a partly double-stranded circular (\"gapped\") DNA genome that replicates through an RNA pregenome using its own <b>reverse transcriptase</b> (Baltimore group VII).<ul class=\"l2\"><li>The relaxed circular DNA is converted to covalently closed circular DNA in the nucleus and this cccDNA templates all transcripts.</li></ul></li><li>More than 250 million people are chronically infected and more than 800,000 die each year from <b>cirrhosis</b> and liver cancer.<ul class=\"l2\"><li>Most adult infections resolve, but infection of neonates and young children becomes <b>chronic</b> up to 90% of the time, and <b>persistent infection established early in life carries the </b>highest risk<b> of hepatocellular carcinoma</b>.</li></ul></li></ul><h5>The mechanism of carcinogenesis</h5><ol class=\"l1\"><li>Fully differentiated hepatocytes are infected.<ul class=\"l2\"><li>The virus itself is not the main destroyer of liver cells.</li></ul></li><li>Cytotoxic T cells recognize fragments of HBcAg and <b>HBeAg</b> displayed on infected hepatocytes and kill them, producing inflammation and <b>necrosis</b>.</li><li>Because the reticulin framework is preserved, hepatocytes <b>regenerate</b>, restoring the lobule after acute disease in 8 to 12 weeks.</li><li>In <b>chronic</b> infection this cycle of necrosis, inflammation and repeated regeneration continues for years, produces bridging fibrosis and <b>cirrhosis</b>, and creates the background of genetic instability on which <b>HCC</b> arises.</li><li><b>Additional contributors:</b> the viral <b>X protein</b>, a transactivator that acts as a potential oncoprotein, <b>aflatoxin</b> in contaminated food as a cofactor, a high HBV DNA load, failure to clear HBeAg, and co-infection with HDV or HCV.</li></ol><ul class=\"l1\"><li>HCC appears many years after primary infection, grows slowly and rarely metastasizes.<ul class=\"l2\"><li>Patients present with weight loss, right upper quadrant pain, fever and intestinal bleeding.</li></ul></li><li>The HBV vaccine prevents infection and significantly reduces HCC risk.<ul class=\"l2\"><li>First-line drugs for chronic <b>hepatitis B</b> are <b>pegylated interferon alfa</b>, <b>entecavir</b> and <b>tenofovir</b>, with telbivudine second line and lamivudine and adefovir third line.</li></ul></li></ul><h5>The hepatitis viruses side by side</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Family and genome</th><th>Envelope</th><th>Route</th><th>Chronic</th><th>Cancer</th><th>Vaccine</th></tr></thead><tbody><tr><td><b>HAV</b></td><td>Picornaviridae, positive RNA</td><td>naked</td><td>fecal-oral, shellfish, water</td><td>never (\"no afterlife\")</td><td>no</td><td>inactivated</td></tr><tr><td><b>HBV</b></td><td>Hepadnaviridae, gapped double-stranded DNA</td><td>enveloped</td><td>blood, sex, perinatal</td><td>yes, especially infants</td><td><b>HCC</b></td><td>recombinant HBsAg</td></tr><tr><td><b>HCV</b></td><td>Flaviviridae, positive RNA</td><td>enveloped</td><td>blood, less often sex</td><td>yes, 70 million carriers</td><td>HCC in 1 to 5%</td><td>none</td></tr><tr><td><b>HDV</b></td><td>Kolmioviridae, defective circular negative RNA</td><td>uses HBsAg</td><td>blood, sex, only with HBV</td><td>with HBV</td><td>worsens HBV disease</td><td>HBV vaccine</td></tr><tr><td><b>HEV</b></td><td>Hepeviridae, positive RNA</td><td>naked</td><td>fecal-oral</td><td>no</td><td>no</td><td>none in these lectures</td></tr></tbody></table></div><ul class=\"l1\"><li>Only HBV is a DNA virus, and the five belong to five unrelated families.<ul class=\"l2\"><li>In the oncogenic virus list HBV is the DNA tumor virus of the liver and HCV the RNA tumor virus of the liver.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 VI.A Hepatitis B Virus, V.A Hepatitis C, MCB 2.02 HBV Pathology, Chronic Carriers, Risk of Cirrhosis and HCC</p>","RABREC":"<h5>Rabies virus and its attachment protein</h5><ul class=\"l1\"><li><b>Rhabdoviridae</b>, genus Lyssavirus.<ul class=\"l2\"><li>A rod or <b>bullet-shaped</b> particle (75 by 180 nm), enveloped, with 10 nm spikes made of trimers of the viral <b>glycoprotein G</b>.</li><li>Inside is a <b>helical</b> ribonucleocapsid with a non-segmented negative-sense RNA of about 12 kb encoding five proteins in the order N, P, M, G, L, and the virion carries its own RNA-dependent RNA polymerase (the L and P proteins).</li></ul></li><li>There is a single serotype.<ul class=\"l2\"><li>The <b>G glycoprotein</b> binds host receptors, most effectively on nerve cells but also on muscle and other cells, and it determines <b>neuroinvasiveness and pathogenicity</b>.</li><li>Purified spikes induce <b>neutralizing antibody</b>, so G is the antibody target for the vaccine and for any therapeutic monoclonal antibody.</li><li>Antiserum to the nucleocapsid, by contrast, is the diagnostic reagent used in immunofluorescence.</li></ul></li></ul><h5>The journey from bite to brain</h5><ol class=\"l1\"><li><b>Rabies</b> is present in large amounts in the saliva of the infected animal and is inoculated by a bite or scratch.<ul class=\"l2\"><li>Risk rises with multiple bites and with bites on richly innervated sites such as the face and hands.</li></ul></li><li>During the incubation period of 20 to 90 days (as short as days or longer than a year) the virus stays at or near the site of inoculation.</li><li>In muscle it binds <b>nicotinic acetylcholine receptors on postsynaptic membranes at neuromuscular junctions</b>.</li><li>It spreads centripetally along peripheral nerves toward the spinal cord and brainstem by retrograde fast axonal transport at up to 250 mm per day, delayed about 12 hours at each synapse.</li><li>It enters the CNS and disseminates rapidly along neuroanatomic connections.</li><li>It then spreads centrifugally along sensory and autonomic nerves to the salivary glands, heart, adrenals and skin.<ul class=\"l2\"><li>Replication in the acinar cells of the salivary glands puts virus into the saliva that infects the next host.</li></ul></li></ol><ul class=\"l1\"><li>There is no documented hematogenous spread and the virus has never been isolated from blood.<ul class=\"l2\"><li>The highest titers are in the submaxillary salivary glands.</li></ul></li></ul><h5>Immune evasion by the same proteins</h5><ul class=\"l1\"><li>N conceals the RNA from RIG-I, P inhibits IRF3 and IRF7 and the interferon-stimulated genes, M dampens innate gene expression and induces apoptosis, and G reduces T-cell activation and promotes IL-10.<ul class=\"l2\"><li>The result is a poor cytokine and chemokine response, little leukocyte infiltration into the CNS and absent neutralizing antibodies.</li></ul></li></ul><h5>Other viral attachment proteins that are antibody targets</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Attachment protein</th><th>Receptor</th></tr></thead><tbody><tr><td><b>Rabies</b></td><td>G glycoprotein</td><td>nicotinic acetylcholine receptor</td></tr><tr><td><b>Influenza</b></td><td>hemagglutinin</td><td>sialic acid</td></tr><tr><td><b>HIV</b></td><td>gp120</td><td>CD4 with CCR5 or CXCR4</td></tr><tr><td><b>SARS-CoV-2</b></td><td>spike</td><td>ACE2</td></tr><tr><td><b>Measles</b></td><td>H protein</td><td>CD46 or CD150</td></tr><tr><td><b>Paramyxoviruses</b></td><td>HN or G plus the F fusion protein</td><td></td></tr><tr><td><b>Hepatitis B</b></td><td>HBsAg</td><td>hepatocyte</td></tr><tr><td><b>Picornavirus</b></td><td>VP1 and VP3 (canyon)</td><td>PVR, CAR, DAF, ICAM-1</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Burden</b><ul class=\"l2\"><li>About 59,000 deaths a year worldwide</li><li>Philippine cases rose from 235 to 426 between 2020 and 2024, all fatal</li><li>Most came from domestic pets and animals of uncertain vaccination status</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 I.A Properties of the Rabies Virus, Antigenic Properties, I.B Pathogenesis, I.D Immune Evasion</p>","NEGRI":"<h5>Negri bodies</h5><ul class=\"l1\"><li><b>Eosinophilic cytoplasmic inclusions in brain neurons</b>, composed of <b>rabies</b> virus proteins and viral RNA.</li><li>Seen in the <b>Purkinje cells of the cerebellum</b> and the <b>pyramidal neurons of the hippocampus</b>.</li><li><b>Pathognomonic</b> for rabies, but present in only about 80% of cases, so their absence does not exclude the diagnosis.</li><li>They are a histopathologic finding, examined in brain tissue after death or in an animal that has been euthanized.<ul class=\"l2\"><li>2.01 lists inclusion bodies, including <b>Negri bodies</b>, among the things detected after growth of a virus in a chick embryo.</li></ul></li></ul><h5>How rabies is diagnosed</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Method</th><th>What it does</th></tr></thead><tbody><tr><td><b>Immunofluorescence or immunoperoxidase staining</b></td><td><ul class=\"cl\"><li>anti-rabies monoclonal antibody detects viral antigen in tissue</li><li>Negri bodies in brain or spinal cord are the definitive pathologic diagnosis</li></ul></td></tr><tr><td><b>Reverse transcription PCR</b></td><td>amplifies rabies genome from fixed or unfixed brain tissue or from saliva, and sequencing identifies the infecting strain</td></tr><tr><td><b>Serology</b></td><td>antibody detected by immunofluorescence or neutralization, supportive evidence in later stages</td></tr><tr><td><b>Viral isolation</b></td><td>hamster and mouse cell lines grow the virus in 2 to 4 days, confirmed by fluorescent antibody</td></tr><tr><td><b>Animal observation</b></td><td>animals suspected rabid go to laboratory examination, other biting animals are observed for 10 days and euthanized for testing if they develop signs</td></tr></tbody></table></div><ul class=\"l1\"><li>There is no test that diagnoses <b>rabies</b> before symptoms appear, which is why post-exposure prophylaxis cannot wait for laboratory confirmation.</li></ul><h5>Inclusion bodies across the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Inclusion</th><th>Location</th><th>Virus</th></tr></thead><tbody><tr><td><b>Negri body</b></td><td>cytoplasm of neurons, eosinophilic</td><td>rabies</td></tr><tr><td><b>Owl's eye</b></td><td>nucleus of an enlarged cytomegalic cell, with perinuclear cytoplasmic inclusions</td><td>CMV</td></tr><tr><td><b>Cowdry type A with multinucleated giant cells</b></td><td>nucleus</td><td>HSV and VZV</td></tr><tr><td><b>Guarnieri body</b></td><td>cytoplasm, pink and eosinophilic, with cell swelling</td><td>poxvirus</td></tr><tr><td><b>Acidophilic cytoplasmic inclusions, sites of viral synthesis</b></td><td>cytoplasm (plus nucleus for measles)</td><td>paramyxoviruses</td></tr><tr><td><b>Erythroblast intranuclear inclusions</b></td><td>nucleus of erythroid precursors</td><td>parvovirus B19</td></tr><tr><td><b>Measles antigen inside inclusion bodies of brain cells</b></td><td>neurons and glia</td><td>SSPE</td></tr><tr><td><b>Councilman body</b></td><td>dying hepatocyte with dense eosinophilic cytoplasm</td><td>yellow fever (not an inclusion but <b>pathognomonic</b>)</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Rule of thumb for inclusion bodies</b><ul class=\"l2\"><li>RNA viruses replicate in the <b>cytoplasm</b>, so they give <b>cytoplasmic</b> inclusions</li><li>DNA viruses replicate in the nucleus, so they give <b>nuclear</b> inclusions</li><li><b>Exceptions</b> are poxvirus (a DNA virus with cytoplasmic Guarnieri bodies) and <b>measles</b> (an RNA virus that also makes nuclear inclusions)</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 I.C Pathology of Rabies, I.F Diagnostics, Table 3, MCB 2.01 IX.D</p>","2028-28":"<h5>Where the oncogenes of RNA tumor viruses come from</h5><ul class=\"l1\"><li>RNA tumor viruses are mostly retroviruses.<ul class=\"l2\"><li>What makes them special is the RNA-directed DNA polymerase (<b>reverse transcriptase</b>) that converts the RNA genome into a DNA provirus that integrates into host DNA.</li></ul></li><li>Retroviruses come in two kinds with respect to cancer.<ul class=\"l2\"><li><b>Highly oncogenic, directly transforming viruses carry their own oncogene, which originally came from a host cell.</b><ul class=\"l3\"><li>The v-onc gene is a captured cellular proto-oncogene, the transduced copy is not needed for viral replication, and these viruses push a cell toward cancer quickly.</li></ul></li><li>Weakly oncogenic, slowly transforming viruses carry no oncogene and cause cancer indirectly, by inserting a viral promoter next to a cellular proto-oncogene or by transactivation (<b>HTLV-1</b> <b>Tax</b>).<ul class=\"l3\"><li>Cancers such as leukemia appear only after years.</li></ul></li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>DNA tumor viruses</th><th>RNA tumor viruses</th></tr></thead><tbody><tr><td>the transforming genes are essential for viral replication</td><td>the oncogenes are transduced cellular genes not needed for replication, or the virus acts indirectly</td></tr><tr><td>the viral oncoproteins have no normal cellular counterparts</td><td>v-onc genes have cellular homologs, the proto-oncogenes</td></tr><tr><td>oncoproteins bind and alter normal cell proteins such as p53 and pRb (large T, E6 and E7, E1A and E1B, LMP1)</td><td>transformation through integration, promoter insertion, transactivation or a captured oncogene</td></tr></tbody></table></div><ul class=\"l1\"><li>Hepatitis C, a flavivirus, is the other RNA tumor virus in the lecture.<ul class=\"l2\"><li>It acts indirectly through <b>chronic</b> inflammation and <b>cirrhosis</b> rather than through an oncogene.</li></ul></li></ul><h5>Proto-oncogenes and tumor suppressors</h5><ul class=\"l1\"><li>Proto-oncogenes normally regulate cell growth, proliferation, division, differentiation and genome integrity.<ul class=\"l2\"><li>Mutation, overexpression or a viral promoter insertion converts them to oncogenes that drive proliferation.</li></ul></li><li>Tumor suppressor genes are negative regulators of growth.<ul class=\"l2\"><li>Both alleles must be inactivated.</li><li>Rb prevents entry into S phase and its loss gives retinoblastoma. <b>p53</b> halts the cycle or induces apoptosis after DNA damage and is mutated in 50% of human cancers.</li></ul></li><li><b>Viral carcinogenesis is multistep:</b> infection, persistence, genetic instability, immortalization, hyperplasia, preneoplasia and finally malignancy.<ul class=\"l2\"><li>The virus is usually a cofactor, necessary but not sufficient, and host immunity decides whether persistence progresses to cancer, which is why the immunosuppressed get <b>EBV</b> lymphomas and HPV cancers.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 IV.A Tumor Viruses, Molecular Mechanisms, V RNA Tumor Viruses, VI Table 16</p>","2028-29":"<h5>The two clinical forms of rabies</h5><ul class=\"l1\"><li>Incubation is 1 to 3 months, ranging from 5 days to years.<ul class=\"l2\"><li>The prodrome is a nonspecific atypical encephalitis with relative preservation of consciousness: fever, malaise, headache, nausea, vomiting, anxiety and agitation.</li><li>The earliest specific sign is paresthesia, pain or pruritus at the site of the bite.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Encephalitic (furious) rabies, 80%</th><th>Paralytic rabies, 20%</th></tr></thead><tbody><tr><td>fever, confusion, <b>hallucinations</b>, combativeness, <b>agitation</b> and seizures</td><td>early and prominent flaccid muscle weakness, often beginning in a distal limb and spreading to quadriparesis and facial weakness</td></tr><tr><td>autonomic dysfunction: <b>hypersalivation</b>, gooseflesh, cardiac arrhythmia, priapism</td><td>sphincter involvement common, sensory involvement mild</td></tr><tr><td>early brainstem involvement gives the classic <b>hydrophobia and aerophobia</b></td><td>excitability and hydrophobia absent</td></tr><tr><td>episodes of hyperexcitability alternate with lucid intervals that shorten as the disease progresses</td><td>commonly misdiagnosed as Guillain-Barré syndrome</td></tr><tr><td>brainstem dysfunction progresses rapidly to coma and death within days</td><td>patients survive a few days longer, then multiple organ failure</td></tr></tbody></table></div><ul class=\"l1\"><li>Aggressive management may be complicated by cardiac and respiratory failure, arrhythmias, water-balance disturbances, non-cardiogenic pulmonary edema and GI hemorrhage.<ul class=\"l2\"><li>There is no established treatment, and the outcome is almost always fatal.</li></ul></li></ul><h5>Post-exposure prophylaxis (Philippine categories)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Category</th><th>Exposure</th><th>Management</th></tr></thead><tbody><tr><td><b>I, no real exposure</b></td><td>feeding or touching an animal, licking of intact skin, sharing utensils or casual contact with a rabies patient</td><td>wash with soap and water, <b>no vaccine</b> or RIG, consider pre-exposure prophylaxis for high-risk persons</td></tr><tr><td><b>II, minor</b></td><td>nibbling of uncovered skin, superficial scratches or abrasions without bleeding</td><td>wash the wound, start the vaccine immediately and complete the schedule to day 7 regardless of the animal, no RIG</td></tr><tr><td>III, <b>highest risk</b></td><td>transdermal bites, scratches with spontaneous bleeding, licks on broken skin or mucosa, exposure of mucosa or open skin to a rabies patient's fluids, handling an infected carcass, eating raw infected meat, exposure to bats, and any category II exposure on the head and neck</td><td>wash the wound, start the vaccine and <b>rabies immunoglobulin</b> immediately, complete to day 7</td></tr></tbody></table></div><ul class=\"l1\"><li>Pre-exposure prophylaxis for naive individuals is a 2-site intradermal or 1-site intramuscular dose on days 0 and 7, with boosters or titers for those who remain at high risk.<ul class=\"l2\"><li>The vaccine drives <b>CD4</b> help, T cells and early plasmablasts, and boosters give faster and stronger responses.</li></ul></li></ul><h5>Encephalitis viruses to keep apart</h5><ul class=\"l1\"><li><b>HSV-1:</b> acute febrile temporal-lobe encephalitis, CSF <b>PCR</b>, <b>acyclovir</b>.<ul class=\"l2\"><li><b>Japanese encephalitis and West Nile:</b><ul class=\"l3\"><li>Mosquito-borne</li><li>Seizures</li><li>Flaccid paralysis</li><li>Sequelae</li></ul></li><li><b>Nipah:</b> bat exposure, fever and respiratory illness then brain swelling and coma.</li><li><b>Measles:</b> acute encephalitis, ADEM and late SSPE.</li><li><b>Rabies</b> is <b>the only</b> one with <b>hydrophobia</b> and a bite history.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 I.E Clinical Presentation of Rabies, I.G Treatment, I.H Control, Table 4</p>","2028-31":"<h5>Why the immune system fails against rabies</h5><ul class=\"l1\"><li><b>The normal antiviral pathway</b><ul class=\"l2\"><li>RIG-I detects viral RNA</li><li>Kinases activate the interferon regulatory factors IRF3 and IRF7</li><li>These drive <b>IFN-β</b> production</li><li>IFN-β signals through JAK-STAT to express interferon-stimulated genes and antiviral effectors</li><li>Infection also normally triggers inflammatory cytokines, chemokines, autophagy and apoptosis</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Rabies protein</th><th>How it shuts the pathway down</th></tr></thead><tbody><tr><td><b>Nucleoprotein (N)</b></td><td>conceals the viral RNA from RIG-I so the sensor never fires</td></tr><tr><td><b>Phosphoprotein (P)</b></td><td>inhibits interferon-stimulated genes and IRF3 and IRF7, reducing IFN-β</td></tr><tr><td><b>Matrix protein (M)</b></td><td>dampens innate immune gene expression and induces apoptosis of host cells</td></tr><tr><td><b>Glycoprotein (G)</b></td><td>reduces T-cell activation and promotes IL-10 secretion</td></tr></tbody></table></div><ul class=\"l1\"><li>The net result, in the words of the trans: <b>poor cytokine and chemokine response, limited leukocyte infiltration into the CNS, absent neutralizing antibodies, and immune cell apoptosis</b>.<ul class=\"l2\"><li>The virus spreads along axons inside neurons, where antibody cannot reach it, and there is no viremia to expose it.</li><li>Serum antibody, when it appears, is only supportive evidence late in disease.</li></ul></li><li>Because the host cannot mount an effective response, <b>the only</b> protection is immunity established before the virus reaches the CNS: wound washing, vaccine and <b>rabies immunoglobulin</b> for category III exposures, and pre-exposure vaccination for the high-risk.</li></ul><h5>Contrast with how other viruses handle the immune system</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Relationship to host immunity</th></tr></thead><tbody><tr><td><b>Rabies</b></td><td>actively blocks the interferon response and hides in neurons</td></tr><tr><td><b>Prions</b></td><td>no immune response at all because there is no foreign nucleic acid or antigen, and no inflammation</td></tr><tr><td><b>HIV</b></td><td>antibody is produced but the virus persists through latency in memory CD4 cells, rapid mutation and destruction of the CD4 cells that coordinate the response</td></tr><tr><td><b>Measles</b></td><td>provokes <b>lifelong</b> immunity yet suppresses cell-mediated immunity for months, leading to secondary bacterial infection</td></tr><tr><td><b>Poxvirus</b></td><td>secretes decoy receptors for TNF, IFN-γ, IL-1 and complement</td></tr><tr><td><b>Adenovirus</b></td><td>VA RNA blocks interferon and E3 gp19 hides MHC I from cytotoxic T cells</td></tr><tr><td><b>HPV</b></td><td>non-lytic and confined to epithelium, so it is barely seen</td></tr><tr><td><b>EBV</b></td><td>EBNA1 blocks antigen processing so infected B cells escape cytotoxic T cells</td></tr><tr><td><b>Influenza</b></td><td>escapes by drift and shift, but cytotoxic T cells clear the infection</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.06 I.D Immunologic Response, How Rabies Virus Evades Innate Immunity, Immunization</p>","2028-36":"<h5>What to do when antiretroviral monotherapy fails</h5><ul class=\"l1\"><li><b>Monotherapy quickly leads to resistance.</b><ul class=\"l2\"><li>The reason is the biology described in 2.06: about 10 billion virions are produced and destroyed daily, <b>reverse transcriptase</b> is error-prone, and the <b>quasispecies</b> always contains a mutant that a single drug cannot suppress.</li><li>Viral load rebounds and resistance mutations appear.</li></ul></li><li>The correct response is <b>HAART (highly active antiretroviral therapy, introduced in 1996)</b>, a combination of drugs from multiple classes that block replication at different stages of the life cycle.<ul class=\"l2\"><li>Combination therapy suppresses plasma viral load to undetectable, restores the immune response, prolongs survival, turned <b>HIV</b> into a manageable <b>chronic</b> disease, and delays resistance, although cross-resistance within a drug class can still occur.</li></ul></li><li>Before switching, resistance testing guides the choice: genotypic testing sequences the reverse transcriptase and protease genes and is interpreted with expert databases, phenotypic testing grows recombinant virus with drugs for complex patterns, and both are recommended at diagnosis and at every treatment failure.<ul class=\"l2\"><li>Adherence must be checked, because it is the <b>single most important</b> point of patient education.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Drug class</th><th>Stage blocked</th><th>Examples</th></tr></thead><tbody><tr><td><b>Nucleoside and nucleotide reverse transcriptase inhibitors</b></td><td>RNA to DNA conversion</td><td>zidovudine, lamivudine, emtricitabine, tenofovir, abacavir, didanosine, stavudine</td></tr><tr><td><b>Non-nucleoside reverse transcriptase inhibitors</b></td><td>RNA to DNA conversion</td><td>efavirenz, nevirapine, rilpivirine, etravirine, delavirdine</td></tr><tr><td><b>Integrase inhibitors</b></td><td>integration of viral DNA into the host chromosome</td><td>dolutegravir, raltegravir</td></tr><tr><td><b>Protease inhibitors</b></td><td>cleavage of Gag, maturation into an infectious particle</td><td>ritonavir, darunavir, atazanavir, saquinavir, indinavir, nelfinavir, tipranavir, fosamprenavir</td></tr><tr><td><b>Fusion inhibitor</b></td><td>gp41-mediated fusion and entry</td><td>enfuvirtide</td></tr><tr><td><b>Entry (CCR5) inhibitor</b></td><td>binding of the co-receptor</td><td>maraviroc</td></tr></tbody></table></div><h5>Why HAART does not cure</h5><ul class=\"l1\"><li>Some infected <b>CD4</b> cells revert to a resting memory state and form a latent reservoir that produces no virus and persists for decades.<ul class=\"l2\"><li>On ART fewer than 1 in a million CD4 cells carry provirus, but the reservoir would take about 70 years to clear naturally, and stopping ART or antigen exposure reactivates it.</li><li>Macrophages, stem cells and brain cells may be additional reservoirs.</li><li>The Berlin patient of 2007, cured by a bone marrow transplant from a CCR5-mutant donor, is the famous exception.</li></ul></li></ul><h5>Monitoring and prevention</h5><ul class=\"l1\"><li><b>Monitoring</b><ul class=\"l2\"><li>Plasma <b>viral load</b> is the best predictor of long-term outcome and the tool for monitoring therapy</li><li><b>CD4 count</b> predicts the short-term risk of opportunistic infection, which begins below 200 cells per μL</li></ul></li><li><b>Antivirals also prevent infection</b><ul class=\"l2\"><li>Pre-exposure prophylaxis</li><li><b>Zidovudine</b> cuts mother-to-child transmission by up to 70%</li><li>Shorter zidovudine or nevirapine regimens are used in resource-limited settings</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.06 VI.K Resistance Testing, VI.L Antiviral Drugs, HAART, Challenges, Table 26</p>","KOH":"<h5>Fungal microscopy, the rapid first test</h5><ul class=\"l1\"><li>A <b>10 to 20% potassium hydroxide preparation</b> dissolves keratin and host tissue and leaves the fungal elements standing out: yeast, hyphae, <b>pseudohyphae</b> and spores.<ul class=\"l2\"><li>It is rapid and cheap, but its sensitivity is variable.</li></ul></li><li><b>Calcofluor white</b> binds chitin in the fungal wall and fluoresces, which raises sensitivity but requires a fluorescence microscope.</li><li>Special stains for histopathology are Gomori methenamine silver (fungal walls black), periodic acid-Schiff (fungal walls red) and capsule stains such as <b>India ink</b> for <b>Cryptococcus</b>.</li><li>Culture on Sabouraud dextrose agar, with chloramphenicol to suppress bacteria and cycloheximide to suppress saprophytic molds, is more sensitive than microscopy and is the <b>most sensitive</b> method for diagnosing a mycosis, but it takes days for yeasts at 37°C and weeks for molds at 30°C.<ul class=\"l2\"><li>Serology, antigen tests (cryptococcal antigen, 1,3-beta-D-glucan), <b>PCR</b> and MALDI-TOF are adjuncts.</li></ul></li></ul><h5>The laboratory pathway for tinea capitis</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Step</th><th>Finding</th></tr></thead><tbody><tr><td><b>Specimen</b></td><td>skin scrapings, nail clippings and infected hairs from the edge of the lesion</td></tr><tr><td><b>KOH mount</b></td><td><b>branching septate hyphae and chains of arthroconidia</b> in keratinized tissue, the rapid confirmation of a dermatophyte</td></tr><tr><td><b>Hair pattern</b></td><td>ectothrix (arthroconidia in sheets outside the shaft, Microsporum, fluoresces green under Wood's lamp) or endothrix (arthroconidia inside the shaft, Trichophyton tonsurans, no fluorescence)</td></tr><tr><td><b>Wood's lamp</b></td><td>positive for Microsporum canis and for Malassezia, negative for Trichophyton</td></tr><tr><td><b>Culture at 25 to 30°C on SDA or inhibitory mold agar</b></td><td>growth in 1 to 3 weeks, identified by colony texture, colour and growth rate, the type and arrangement of macroconidia and microconidia, nutritional tests, the hair-perforation test and PCR</td></tr></tbody></table></div><ul class=\"l1\"><li>Tinea capitis is the scalp dermatophytosis of children.<ul class=\"l2\"><li>Its inflammatory forms are kerion (painful boggy lesion, zoophilic) and favus (yellow crusts called scutula).</li><li>It always needs oral therapy with <b>griseofulvin</b>, <b>terbinafine</b> or <b>itraconazole</b> plus frequent shampooing, because topical agents cannot reach the hair follicle.</li></ul></li></ul><h5>KOH appearances to memorize</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>KOH or histology picture</th><th>Organism</th></tr></thead><tbody><tr><td>septate branching hyphae with arthroconidia</td><td>dermatophytes (Trichophyton, Microsporum, Epidermophyton)</td></tr><tr><td>short unbranched hyphae with round yeast, \"spaghetti and meatballs\"</td><td>Malassezia, pityriasis versicolor</td></tr><tr><td>branched septate pigmented hyphae and yeast</td><td>Hortaea werneckii, tinea nigra</td></tr><tr><td>budding yeast with pseudohyphae, germ tube in serum</td><td>Candida albicans</td></tr><tr><td>encapsulated budding yeast with a halo on India ink</td><td>Cryptococcus</td></tr><tr><td>sclerotic, muriform or copper-penny bodies</td><td>chromoblastomycosis</td></tr><tr><td>granules of intertwined septate hyphae</td><td>eumycetoma</td></tr><tr><td>cigar-shaped yeast, sparse</td><td>Sporothrix</td></tr><tr><td>tuberculate macroconidia in culture, tiny yeast in macrophages in tissue</td><td>Histoplasma</td></tr><tr><td>broad-based single budding yeast</td><td>Blastomyces</td></tr><tr><td>ship's wheel multiple budding</td><td>Paracoccidioides</td></tr><tr><td>spherules full of endospores</td><td>Coccidioides</td></tr><tr><td>narrow septate hyphae branching at 45 degrees</td><td>Aspergillus</td></tr><tr><td>broad ribbon-like non-septate hyphae branching at 90 degrees</td><td>Mucorales</td></tr><tr><td>thick-walled cysts with 4 to 8 nuclei on silver stain</td><td>Pneumocystis</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.07 II.B Microscopy, II.C Culture, V.G Dermatophytosis Laboratory Diagnosis</p>","SPORO":"<h5>Sporotrichosis, the dimorphic subcutaneous mycosis</h5><ul class=\"l1\"><li>Caused by the <b>Sporothrix schenckii complex</b>, which includes S. brasiliensis (<b>zoonotic</b>, from cats) and S. globosa (non-lymphatic forms).<ul class=\"l2\"><li>The fungus lives in soil, sphagnum moss, plants and rose bushes, and infection follows traumatic implantation of a thorn or splinter, so gardeners, farmers and florists are the classic patients.</li><li>It can also be acquired from infected animals.</li></ul></li><li>It is <b>thermally dimorphic</b>, and it is <b>the only</b> subcutaneous mycosis that is.<ul class=\"l2\"><li>Chromoblastomycosis and mycetoma are caused by molds that stay molds in tissue.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>At 25°C, in the environment or on Sabouraud agar</th><th>At 37°C, in tissue or on brain-heart infusion agar</th></tr></thead><tbody><tr><td><ul class=\"cl\"><li>a mold with septate hyphae and delicate pear-shaped (piriform) conidia arranged along the sides of the hyphae or in <b>rosette or flower-like clusters</b></li><li>The colony starts cream or light-coloured and turns brown to black as melanin accumulates</li></ul></td><td>small <b>cigar-shaped budding yeast cells</b> of 3 to 5 μm, sometimes surrounded by asteroid bodies in tissue</td></tr></tbody></table></div><h5>Clinical forms</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Form</th><th>Features</th></tr></thead><tbody><tr><td><b>Lymphocutaneous, about 75%</b></td><td>a granulomatous nodule at the inoculation site that ulcerates, then a chain of nodules or abscesses spreading along the draining lymphatic channels in a cord-like pattern</td></tr><tr><td><b>Fixed cutaneous</b></td><td>a single localized lesion with no lymphatic spread, more common in endemic areas of high exposure, can mimic pyoderma gangrenosum</td></tr><tr><td><b>Disseminated</b></td><td>uncommon, in debilitated or immunocompromised patients</td></tr><tr><td><b>Pulmonary</b></td><td>rare, clinically resembles tuberculosis</td></tr></tbody></table></div><h5>Diagnosis and treatment</h5><ul class=\"l1\"><li>Specimens are biopsy material or aspirate from a nodule.<ul class=\"l2\"><li>Direct <b>KOH</b> or calcofluor is often negative because yeast cells are sparse.</li><li>Gomori methenamine silver and PAS stains raise the sensitivity and show cigar-shaped yeast and asteroid bodies.</li></ul></li><li><b>Culture is the gold standard</b>: the mold grows on inhibitory mold agar or Sabouraud agar at 25 to 30°C and identification is confirmed by converting it to the yeast phase at 35 to 37°C.<ul class=\"l2\"><li>Lactophenol cotton blue shows the conidial arrangement.</li><li>Serology is not routinely recommended, and a delayed skin test with sporotrichin only supports the diagnosis.</li></ul></li><li><b>Itraconazole is the drug of choice</b> for cutaneous and lymphocutaneous disease.<ul class=\"l2\"><li><b>Saturated potassium iodide</b> is the older alternative, effective but poorly tolerated.</li><li>Amphotericin B is for systemic, disseminated or severe disease.</li><li>Some localized cases are self-limited.</li></ul></li><li>Prevention is gloves, long sleeves and care around rose thorns, sphagnum moss and decaying wood.</li></ul><h5>The three subcutaneous mycoses compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Sporotrichosis</th><th>Chromoblastomycosis</th><th>Eumycetoma</th></tr></thead><tbody><tr><td><b>Agent</b></td><td>Sporothrix, thermally dimorphic</td><td>dematiaceous molds (Fonsecaea, Phialophora, Cladophialophora, Rhinocladiella)</td><td>Madurella, Pseudallescheria boydii (Scedosporium), Exophiala, Acremonium</td></tr><tr><td><b>Entry</b></td><td>thorn or plant trauma, animal scratch</td><td>traumatic implantation of soil, barefoot farmers</td><td>traumatic implantation of soil</td></tr><tr><td><b>Lesion</b></td><td>nodules and ulcers along lymphatics</td><td>verrucous cauliflower plaque with black dots</td><td>swelling with draining sinuses and granules, spreads to bone</td></tr><tr><td><b>Microscopy</b></td><td>cigar-shaped yeast, sparse</td><td>sclerotic (copper-penny) bodies</td><td>grains of septate hyphae, black or white</td></tr><tr><td><b>Treatment</b></td><td>itraconazole, SSKI, amphotericin B</td><td>surgery for small lesions, itraconazole or flucytosine, local heat</td><td>surgery plus prolonged itraconazole, ketoconazole or amphotericin B</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.07 VI.B Sporotrichosis, Table 4, VI.C, VI.D</p>","MCANIS":"<h5>Tinea capitis: ectothrix and endothrix</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Ectothrix</th><th>Endothrix</th></tr></thead><tbody><tr><td><b>Where the spores sit</b></td><td>arthroconidia form dense sheets <b>outside</b> the hair shaft</td><td>arthroconidia lie <b>inside</b> the hair shaft</td></tr><tr><td><b>Typical organisms</b></td><td><b>Microsporum</b> species: M. canis from cats and dogs, M. audouinii from humans, M. gypseum from soil</td><td><b>Trichophyton tonsurans</b>, T. violaceum, and T. schoenleinii in favus</td></tr><tr><td><b>Wood's lamp</b></td><td><b>infected hairs fluoresce green</b></td><td><b>no fluorescence</b></td></tr><tr><td><b>Host response</b></td><td>zoophilic species cause acute inflammation, kerion</td><td>anthropophilic species cause chronic low-grade disease and black-dot alopecia</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Wood's lamp</b> also lights up <b>Malassezia</b> in pityriasis versicolor.<ul class=\"l2\"><li>Tinea nigra and skin dermatophytosis do not fluoresce.</li></ul></li></ul><h5>Dermatophyte ecology decides the inflammation</h5><ul class=\"l1\"><li>Geophilic species come from soil, zoophilic species from animals including household pets, and anthropophilic species are adapted to humans and cause most cases.<ul class=\"l2\"><li>Anthropophilic strains give mild, <b>chronic</b>, low-grade infection, whereas zoophilic and geophilic strains give acute inflammatory infection that may resolve on its own.</li></ul></li><li>Transmission is skin-to-skin contact, infected animals, and fomites such as clothing, towels, combs and gym mats.<ul class=\"l2\"><li>Dermatophytes are mildly contagious, which makes them unique among fungi.</li><li>Predisposing factors are heat, humidity, moisture, skin trauma, genetics and impaired immunity, and some people have IgE-mediated hypersensitivity with poor cell-mediated immunity.</li></ul></li><li>Dermatophytes cannot grow at 37°C, so they stay in the non-viable keratinized layers and infections are chronic but never life-threatening.</li></ul><h5>The three genera</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Genus</th><th>Tissues</th><th>Conidia</th></tr></thead><tbody><tr><td><b>Microsporum</b></td><td>skin and hair, never nails</td><td>large, thick-walled, rough, multicellular macroconidia, sometimes with hooked ends</td></tr><tr><td><b>Trichophyton</b></td><td>skin, hair and nails</td><td>numerous microconidia and occasional smooth-walled macroconidia</td></tr><tr><td><b>Epidermophyton floccosum</b></td><td>skin and nails, never hair</td><td>club-shaped smooth macroconidia in clusters, no microconidia</td></tr></tbody></table></div><h5>Other scalp and hair conditions to separate</h5><ul class=\"l1\"><li>Kerion is a painful boggy inflammatory scalp mass from zoophilic dermatophytes.<ul class=\"l2\"><li>Favus is <b>chronic</b> infection with yellowish scutula.</li><li>Black piedra (Piedraia hortae) and white piedra (Trichosporon) are nodules on the hair shaft treated by cutting the hair.</li><li>Seborrheic dermatitis and <b>Malassezia</b> dandruff are not dermatophyte infections.</li></ul></li><li>Treatment of tinea capitis is oral <b>griseofulvin</b>, <b>terbinafine</b> or <b>itraconazole</b> with shampoo, never topical alone.</li></ul><p class=\"rsrc\">Source: MCB 2.07 V.B Dermatophyte Genera, V.D Epidemiology and Host Response, V.E.06 Tinea Capitis, V.G Hair Infection</p>","DERMID":"<h5>Identifying dermatophytes in culture</h5><ul class=\"l1\"><li>Cultures are set up on Sabouraud dextrose agar or inhibitory mold agar with cycloheximide (kills contaminating saprophytic molds) and chloramphenicol (suppresses bacteria), incubated at room temperature, and take 1 to 3 weeks.<ul class=\"l2\"><li>Identification rests on colony texture, colour and growth rate, the microscopic type and arrangement of conidia, nutritional tests, the hair-perforation test and <b>PCR</b>.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Organism</th><th>Colony</th><th>Microscopy and clinical link</th></tr></thead><tbody><tr><td><b>Trichophyton rubrum</b></td><td>white cottony surface with a <b>red or wine-coloured reverse</b></td><td><ul class=\"cl\"><li>tear-drop microconidia along the hyphae, occasional pencil-shaped macroconidia</li><li>The <b>most common</b> cause of tinea pedis, cruris, corporis and unguium worldwide</li></ul></td></tr><tr><td><b>Trichophyton mentagrophytes</b></td><td>white to cream, powdery</td><td><ul class=\"cl\"><li>clusters of round microconidia, spiral hyphae, urease positive</li><li>Acute vesicular tinea pedis</li></ul></td></tr><tr><td><b>Trichophyton tonsurans</b></td><td></td><td><ul class=\"cl\"><li>numerous elongated microconidia attached to supporting hyphae</li><li>Endothrix tinea capitis without fluorescence</li></ul></td></tr><tr><td><b>Trichophyton schoenleinii</b></td><td></td><td><ul class=\"cl\"><li>no conidia, favic chandeliers (antler-shaped hyphal tips)</li><li>Favus</li></ul></td></tr><tr><td><b>Microsporum canis</b></td><td>white surface with a <b>yellow to orange reverse</b></td><td><ul class=\"cl\"><li>large spindle-shaped, thick-walled, rough macroconidia with hooked ends</li><li>Ectothrix tinea capitis that fluoresces, acquired from cats and dogs</li></ul></td></tr><tr><td><b>Microsporum gypseum</b></td><td></td><td><ul class=\"cl\"><li>numerous individual thin-walled rough macroconidia</li><li>Geophilic</li></ul></td></tr><tr><td><b>Epidermophyton floccosum</b></td><td>khaki to greenish</td><td><ul class=\"cl\"><li><b>club-shaped, thin, smooth-walled macroconidia arising in small clusters, and no microconidia</b></li><li>Skin and nails only, never hair</li></ul></td></tr></tbody></table></div><ul class=\"l1\"><li>Cycloheximide is useful here but must never be used when <b>Cryptococcus</b> is suspected, because it inhibits that yeast.</li></ul><h5>Treatment by site</h5><ul class=\"l1\"><li><b>Mild localized tinea corporis, cruris and pedis</b><ul class=\"l2\"><li>Topical miconazole, clotrimazole or tolnaftate for 2 to 4 weeks</li><li>Continued 1 to 2 weeks after the skin clears</li><li>Debridement of dead tissue and a dry environment</li></ul></li><li>Extensive or refractory disease, tinea capitis and tinea unguium: oral <b>griseofulvin</b> (binds tubulin and disrupts the mitotic spindle, concentrates in the stratum corneum, acts only on growing hyphae, months of therapy, headache the commonest side effect), <b>terbinafine</b> (an allylamine that inhibits squalene epoxidase, good for nails, pulse dosing) or <b>itraconazole</b>.<ul class=\"l2\"><li>Nail disease may need months of therapy or surgical removal, and luliconazole penetrates the nail bed well.</li></ul></li></ul><h5>Other superficial fungi with identifying features</h5><ul class=\"l1\"><li><b>Malassezia:</b> lipophilic yeast of the normal skin flora, hyper- or hypopigmented macules on trunk and arms, spaghetti-and-meatball <b>KOH</b>, <b>Wood's lamp</b> positive, treated with selenium sulfide or azoles to reduce rather than eradicate.<ul class=\"l2\"><li><b>Hortaea werneckii:</b><ul class=\"l3\"><li>Dark macule on palm or sole</li><li>Pigmented septate hyphae</li><li>Keratolytics</li><li>Azoles</li></ul></li><li><b>Piedraia hortae and Trichosporon:</b> black and white hair nodules.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.07 V.B and V.C Dermatophyte Genera and Morphology, V.H Culture, V.I Treatment, MCB 2.08 IV Griseofulvin and Terbinafine</p>","TPEDIS":"<h5>Tinea pedis, athlete's foot</h5><ul class=\"l1\"><li>The <b>most prevalent</b> form of dermatophytosis, not limited to athletes.<ul class=\"l2\"><li>It usually begins in the interdigital toe webs with scaling, peeling, maceration and fissures, and <b>chronic</b> cases get secondary bacterial infection.</li><li>Clinical variants are interdigital, moccasin-type with plantar hyperkeratosis, vesicular with blistering, and ulcerative.</li><li>Repeatedly wet feet, as in flooding, raise the risk.</li></ul></li><li>The agents are <b>Trichophyton rubrum</b>, which is the <b>most common</b> dermatophyte overall and produces the chronic dry moccasin type, and <b>Trichophyton mentagrophytes</b>, which produces the acute vesicular type and is recognised in culture by spiral hyphae and a positive urease test.<ul class=\"l2\"><li><b>Epidermophyton floccosum</b> is a less common cause.</li></ul></li><li><b>How the papers tell them apart:</b> a bare \"<b>most commonly</b> associated with tinea pedis\" means <b>T. rubrum</b>.<ul class=\"l2\"><li>Extra clues of spiral hyphae, urease positivity or acute vesicles mean <b>T. mentagrophytes</b>.</li><li>Club-shaped macroconidia without microconidia mean <b>E. floccosum</b>.</li></ul></li></ul><h5>The clinical forms of tinea by site</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Site</th><th>Name</th><th>Notes</th></tr></thead><tbody><tr><td><b>Feet</b></td><td>tinea pedis</td><td><b>most prevalent</b>, toe webs first</td></tr><tr><td><b>Nails</b></td><td>tinea unguium or onychomycosis</td><td>thickened, discoloured, brittle, friable nails, particularly resistant, months of oral therapy, sometimes nail removal</td></tr><tr><td><b>Groin and upper inner thighs</b></td><td>tinea cruris, jock itch</td><td><ul class=\"cl\"><li>adult males, dry pruritic sharply demarcated lesions</li><li>Prominent scrotal involvement suggests candidiasis instead</li></ul></td></tr><tr><td><b>Glabrous skin</b></td><td>tinea corporis, classic ringworm</td><td>annular, pruritic, raised erythematous active margin, peripheral scaling, central clearing</td></tr><tr><td><b>Hands</b></td><td>tinea manuum</td><td>dry scaly plaques, often only one hand</td></tr><tr><td><b>Scalp</b></td><td>tinea capitis</td><td>children, ectothrix or endothrix, kerion, favus</td></tr><tr><td><b>Beard</b></td><td>tinea barbae</td><td>adult males, inflammatory, mimics bacterial folliculitis</td></tr></tbody></table></div><ul class=\"l1\"><li>The same species can produce several clinical forms, and one clinical form can be caused by several species.<ul class=\"l2\"><li>The word ringworm describes the annular lesion and has nothing to do with a worm.</li></ul></li></ul><h5>The trichophytid (id) reaction</h5><ul class=\"l1\"><li>A hypersensitivity response to dermatophyte antigen during an active infection elsewhere, usually a vesicular eruption on the hands distant from the primary site.<ul class=\"l2\"><li>It reflects immune sensitization rather than fungal invasion, the trichophytin skin test is positive, and it resolves when the primary infection is treated.</li></ul></li></ul><h5>Treatment</h5><ul class=\"l1\"><li>Mild tinea pedis responds to topical miconazole, clotrimazole or tolnaftate for 2 to 4 weeks, continued 1 to 2 weeks after clearing, with the feet kept dry.<ul class=\"l2\"><li>Extensive, persistent or refractory disease and any nail involvement need oral <b>griseofulvin</b>, <b>terbinafine</b> or <b>itraconazole</b>.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.07 V.E Dermatophytosis Clinical Forms, V.F Trichophytid Reaction, V.I Treatment, V.B Trichophyton</p>","CHROMO":"<h5>Chromoblastomycosis</h5><ul class=\"l1\"><li>A <b>chronic</b> subcutaneous infection caused by <b>dematiaceous (melanin-pigmented) fungi</b> introduced by traumatic implantation from soil or vegetation.<ul class=\"l2\"><li>It usually affects the legs and feet of barefoot agricultural workers in the tropics and is not transmitted from person to person.</li></ul></li><li><b>Agents:</b> Phialophora verrucosa (phialides with cup-shaped collarettes), <b>Fonsecaea pedrosoi</b> (polymorphic conidiation), Fonsecaea compacta, Rhinocladiella aquaspersa and Cladophialophora carrionii (long branching chains of conidia).<ul class=\"l2\"><li>The lecturer said the conidial details need not be memorized.</li></ul></li></ul><h5>Clinical course</h5><ol class=\"l1\"><li>A slowly enlarging papule or nodule develops at the site of inoculation.</li><li>It becomes a warty, verrucous, <b>cauliflower-like</b> plaque with crusting, abscesses, ulceration and black dots on the surface.</li><li>Satellite lesions appear through lymphatic spread and autoinoculation, and lymphatic obstruction can produce elephantiasis.</li><li>The disease is <b>chronic</b> and slowly progressive, and systemic dissemination is rare.</li></ol><ul class=\"l1\"><li>The lesion is not painful but may be itchy, and the epidermal hyperplasia is marked.</li></ul><h5>Diagnosis</h5><ul class=\"l1\"><li>The diagnostic finding is the <b>muriform, sclerotic, Medlar or copper-penny body</b>: a thick-walled brown spherical fungal cell of 4 to 12 μm with transverse and longitudinal septa, seen on <b>KOH</b>.<ul class=\"l2\"><li>Histology shows epidermal hyperplasia, granulomatous inflammation and <b>muriform</b> cells inside cells.</li><li>Culture on inhibitory mold agar or Sabouraud agar gives compact, velvety or wrinkled, dark green, brown or black colonies whose colour comes from melanin.</li></ul></li></ul><h5>Treatment</h5><ul class=\"l1\"><li><b>Surgical excision</b> is preferred for small localized lesions.<ul class=\"l2\"><li><b>Itraconazole or flucytosine</b> is used for larger or extensive lesions, and <b>local heat therapy or cryotherapy</b> assists.</li><li>Treatment is prolonged and relapse is common.</li><li>Prevention is footwear, protective clothin
