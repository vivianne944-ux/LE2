g and prompt wound care.</li></ul></li></ul><h5>The pigmented fungi of this course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Organism</th><th>Pigment link</th></tr></thead><tbody><tr><td><b>Tinea nigra</b></td><td>Hortaea werneckii</td><td>dark macule on palms or soles</td></tr><tr><td><b>Black piedra</b></td><td>Piedraia hortae</td><td>hard black hair nodules</td></tr><tr><td><b>Chromoblastomycosis</b></td><td>Fonsecaea, Phialophora, Cladophialophora</td><td>black colonies, brown sclerotic bodies</td></tr><tr><td><b>Black-grain eumycetoma</b></td><td>Madurella, Exophiala</td><td>black to red-black granules</td></tr><tr><td><b>Sporotrichosis</b></td><td>Sporothrix</td><td>mold colony darkens as melanin accumulates</td></tr><tr><td><b>Cryptococcus</b></td><td>laccase makes melanin on bird-seed agar</td><td>brown colonies</td></tr></tbody></table></div><ul class=\"l1\"><li>Melanin in the cell wall protects against oxidative stress and host immunity, and <b>flucytosine</b> is noted as effective against many dematiaceous infections including chromoblastomycosis, mycetoma and fungal sinusitis.</li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.C Chromoblastomycosis, MCB 2.08 IV.C Flucytosine</p>","MYCETOMA":"<h5>Mycetoma</h5><ul class=\"l1\"><li>A <b>chronic</b> granulomatous infection of skin and subcutaneous tissue acquired by <b>traumatic implantation of soil-dwelling organisms</b>, usually into the feet, hands or lower limbs.<ul class=\"l2\"><li>The defining <b>triad is localized swelling, multiple draining sinuses or fistulae, and granules</b> that contain colonies of the organism.</li></ul></li><li>Two types exist.<ul class=\"l2\"><li><b>Eumycetoma</b> is caused by true fungi and <b>actinomycetoma</b> by filamentous bacteria (Nocardia, Actinomadura, Streptomyces), which the fungal lecture does not cover.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Eumycetoma</th><th>Actinomycetoma</th></tr></thead><tbody><tr><td><b>Agents</b></td><td>Pseudallescheria boydii (also called Scedosporium apiospermum), Madurella mycetomatis, Madurella grisea, Exophiala jeanselmei, Acremonium falciforme</td><td>filamentous bacteria</td></tr><tr><td><b>Granule</b></td><td><ul class=\"cl\"><li>densely intertwined <b>septate hyphae of 3 to 5 μm</b>, distorted at the periphery, granules up to 2 mm, firm and hard to fragment</li><li><b>Black to red-black grains suggest Madurella or Exophiala</b>, white grains suggest Pseudallescheria</li></ul></td><td>fine bacterial filaments</td></tr><tr><td><b>Treatment</b></td><td><b>surgical excision or debridement combined with long-term antifungal therapy</b> (itraconazole, ketoconazole or amphotericin B), difficult and prolonged</td><td>antibiotics</td></tr></tbody></table></div><h5>Pathogenesis and course</h5><ol class=\"l1\"><li>Trauma introduces spores from soil or plant material into the skin.</li><li><b>Chronic</b> infection produces suppurative inflammation, granuloma formation and draining sinus tracts.</li><li>The discharge carries the granules.</li><li>Untreated disease extends into muscle and bone and causes deformity, disability and loss of function.<ul class=\"l2\"><li>Dissemination is uncommon and occurs in the immunocompromised.</li></ul></li></ol><ul class=\"l1\"><li><b>Diagnosis:</b> collect granules from sinus pus or biopsy, examine them in <b>KOH</b>, and culture on Sabouraud dextrose agar or inhibitory mold agar.<ul class=\"l2\"><li>Identification uses granule colour, size and consistency, hyphal morphology and culture characteristics.</li></ul></li><li>Prevention is protective footwear in endemic regions, wound hygiene and prompt wound care.</li></ul><h5>Draining lesions to differentiate</h5><ul class=\"l1\"><li>Sporotrichosis drains from nodules along lymphatics with cigar-shaped yeast.<ul class=\"l2\"><li>Chromoblastomycosis is verrucous with <b>copper-penny</b> bodies.</li><li>Actinomycosis and nocardiosis give sulfur granules of bacterial filaments.</li><li>Tuberculous osteomyelitis and <b>chronic</b> bacterial osteomyelitis also produce sinuses but no fungal grains.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.D Mycetoma</p>","2028-38":"<h5>Stains for fungi</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Stain</th><th>Result</th><th>Where it is used</th></tr></thead><tbody><tr><td><b>Periodic acid-Schiff (PAS)</b></td><td>fungal cell walls stain <b>red or magenta</b></td><td>histopathologic sections, the answer to this question</td></tr><tr><td><b>Gomori methenamine silver (GMS)</b></td><td>fungal cell walls stain <b>black</b></td><td>histopathologic sections, Pneumocystis cysts, sporotrichosis, histoplasmosis</td></tr><tr><td><b>Hematoxylin and eosin</b></td><td>fungi stain faintly, muriform cells and spherules can be seen</td><td>routine sections</td></tr><tr><td><b>Giemsa</b></td><td>intracellular Histoplasma yeast in macrophages, Pneumocystis trophozoites</td><td>blood, marrow and BAL smears</td></tr><tr><td><b>Calcofluor white</b></td><td>fluorescence of chitin</td><td>direct specimens, Coccidioides, Pneumocystis</td></tr><tr><td><b>India ink</b></td><td>negative stain that outlines the capsule as a halo</td><td>Cryptococcus in CSF</td></tr><tr><td><b>Toluidine blue</b></td><td>Pneumocystis cysts</td><td>BAL</td></tr><tr><td><b>Potassium hydroxide 10 to 20%</b></td><td>clears keratin</td><td>skin, nail and hair scrapings</td></tr><tr><td><b>Lactophenol cotton blue</b></td><td>mold structures and conidial arrangement</td><td>culture identification</td></tr><tr><td><b>Gram stain</b></td><td>yeast such as Candida appear Gram-positive</td><td>smears</td></tr></tbody></table></div><ul class=\"l1\"><li>The fungal wall is made of cross-linked polysaccharides (chitin, glucans, mannans) with embedded glycoproteins and lipids.<ul class=\"l2\"><li>These are poorly degraded in tissue, which is why polysaccharide stains such as PAS and silver stains detect them so well, and why the wall activates pattern-recognition receptors and complement.</li></ul></li></ul><h5>Beyond the microscope</h5><ul class=\"l1\"><li>Culture on Sabouraud dextrose agar is the <b>most sensitive</b> method but slow.<ul class=\"l2\"><li>Serology detects antibody in immunocompetent patients and antigen in the immunocompromised: cryptococcal capsular antigen by latex agglutination or EIA, 1,3-beta-D-glucan (Fungitell) as a rapid screen for invasive candidiasis or aspergillosis, <b>Histoplasma</b> polysaccharide antigen by ELISA.</li><li><b>PCR</b> assays exist for <b>Candida</b> and <b>Aspergillus</b>, and MALDI-TOF identifies species from protein spectra.</li></ul></li><li>Antifungal susceptibility testing reports an MIC against CLSI breakpoints, and commercial Etest and Sensititre YeastOne kits standardize it.<ul class=\"l2\"><li>Most antifungals are fungistatic, so the MIC is a guide rather than a guarantee.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.07 II.B Microscopy, II.D Serology and Molecular Diagnosis, III Antifungal Susceptibility Testing, VI.B.03 Sporotrichosis Histopathology</p>","2028-44":"<h5>Treating sporotrichosis</h5><ul class=\"l1\"><li><b>The vignette describes lymphocutaneous sporotrichosis:</b> a gardener with ulcerated hand lesions, proximal lymphangitic spread and <b>cigar-shaped yeast</b> on biopsy.</li><li>The 2.07 treatment list is explicit.<ul class=\"l2\"><li><b>Itraconazole is the drug of choice</b> for most cutaneous and lymphocutaneous cases.</li><li>Saturated solution of potassium iodide is the older alternative, effective but frequently poorly tolerated.</li><li>Amphotericin B is indicated for systemic, disseminated or severe disease, and some localized cases are self-limited.</li></ul></li><li>The printed key for this paper chose <b>fluconazole</b>.<ul class=\"l2\"><li>Fluconazole is an azole that can be used for sporotrichosis, but the trans names <b>itraconazole</b>.</li><li><b>Keep both in mind:</b> follow the key for this exam, and know that itraconazole is the textbook answer.</li></ul></li></ul><h5>Choosing an azole (2.08)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Drug</th><th>First-choice uses</th><th>Caution</th></tr></thead><tbody><tr><td><b>Itraconazole</b></td><td>histoplasmosis and blastomycosis (<b>first choice</b>), <b>sporotrichosis</b>, chromoblastomycosis, paracoccidioidomycosis, coccidioidomycosis, aspergillosis and aspergilloma, onychomycosis due to dermatophytes and molds</td><td>asymptomatic liver enzyme rise, hepatitis, poor CNS penetration</td></tr><tr><td><b>Fluconazole</b></td><td><b>best CNS penetration</b>, so maintenance therapy for cryptococcal and coccidioidal meningitis, oropharyngeal candidiasis in AIDS, candidemia in the immunocompetent</td><td>Candida glabrata and krusei are resistant</td></tr><tr><td><b>Voriconazole</b></td><td>invasive aspergillosis, broad activity against molds and yeasts</td><td>reversible visual impairment in 30%</td></tr><tr><td><b>Posaconazole</b></td><td>fluconazole-resistant Candida, aspergillosis, mucormycosis, invasive molds</td><td>well tolerated</td></tr><tr><td><b>Ketoconazole</b></td><td>chronic mucocutaneous candidiasis, dermatophytosis, non-meningeal blastomycosis, coccidioidomycosis, paracoccidioidomycosis, histoplasmosis</td><td>the most toxic azole, inhibits testosterone and cortisol synthesis giving gynecomastia, impotence, menstrual irregularity and adrenal insufficiency</td></tr></tbody></table></div><ul class=\"l1\"><li>Azoles inhibit the cytochrome P450-dependent 14-alpha-demethylation of lanosterol, blocking ergosterol synthesis.<ul class=\"l2\"><li>The fungal enzyme is 100 to 1,000 times more sensitive than the mammalian one, but inhibition of human P450 causes the side effects.</li><li>Azoles are fungistatic and replace <b>amphotericin B</b> for less severe mycoses because they are oral and less toxic.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.B.05 Treatment and Control of Sporotrichosis, MCB 2.08 IV.C Azoles</p>","2028-45":"<h5>Sporotrichosis forms and what they mimic</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Form</th><th>Picture</th><th>Mimics</th></tr></thead><tbody><tr><td><b>Lymphocutaneous, about 75%</b></td><td>nodule at the inoculation site, ulceration, then a cord of nodules along the draining lymphatics</td><td>nocardiosis, atypical mycobacterial infection, cutaneous leishmaniasis</td></tr><tr><td><b>Fixed or isolated cutaneous</b></td><td>a single localized ulcerated or verrucous lesion with no lymphatic spread, more common in areas of endemic exposure</td><td><b>pyoderma gangrenosum</b>, chronic bacterial ulcer, squamous cell carcinoma, chromoblastomycosis</td></tr><tr><td><b>Disseminated</b></td><td>uncommon, in debilitated or immunocompromised patients</td><td></td></tr><tr><td><b>Pulmonary</b></td><td>rare, cavitary</td><td>tuberculosis</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Why the fixed form misleads clinicians:</b> a solitary <b>chronic</b> ulcer with undermined edges in a farmer or gardener looks like pyoderma gangrenosum, which is treated with steroids and immunosuppression that would make a fungal ulcer worse.<ul class=\"l2\"><li>The lesson is to biopsy and culture before treating, remembering that <b>KOH</b> is often negative because yeast cells are sparse and that culture is the <b>gold standard</b>.</li></ul></li><li>The diagnosis is confirmed by cigar-shaped yeast at 37°C and rosette-arranged conidia at 25°C, and <b>itraconazole</b> is the treatment.</li></ul><h5>Other subcutaneous and cutaneous look-alikes</h5><ul class=\"l1\"><li><b>Chromoblastomycosis:</b> cauliflower plaque with black dots and <b>copper-penny</b> bodies.<ul class=\"l2\"><li><b>Mycetoma:</b> swelling, sinuses and grains.</li><li><b>Cutaneous blastomycosis:</b> ulcerated verrucous granuloma with an advancing border and central scarring, broad-based budding yeast.</li><li><b>Cutaneous cryptococcosis:</b> lesions in disseminated disease of the immunocompromised.</li><li><b>Disseminated histoplasmosis:</b> mucocutaneous ulcers of the nose, mouth and tongue.</li><li><b>Paracoccidioidomycosis:</b> painful oral mucosal sores in Latin American farmers.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.07 VI.B.02 Clinical Features of Sporotrichosis, Table 4, VI.B.03 Diagnostic Laboratory Tests</p>","DIMORPH":"<h5>The four endemic systemic mycoses</h5><ul class=\"l1\"><li><b>What they share:</b> all four are <b>thermally dimorphic</b>, existing as a mold at 25°C in the environment and as a yeast (or spherule for <b>Coccidioides</b>) at 36 to 37°C in the host.<ul class=\"l2\"><li>Dimorphism is essential for their pathogenicity.</li><li>More than 90% of infections follow inhalation of conidia, the lungs are the primary site, about 90% of infections in the immunocompetent are asymptomatic or self-limited, dissemination occurs when Th1 cell-mediated immunity fails, disseminated disease is significantly more common in males, none is contagious, and serology has diagnostic and prognostic value.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Histoplasma capsulatum</th><th>Blastomyces dermatitidis</th><th>Coccidioides immitis and posadasii</th><th>Paracoccidioides brasiliensis</th></tr></thead><tbody><tr><td><b>Geography</b></td><td><ul class=\"cl\"><li>Ohio and Mississippi river valleys</li><li>Natural habitat is soil enriched with bat, chicken and starling droppings (caves, coops) because of the nitrogen content</li></ul></td><td><ul class=\"cl\"><li>North and Central America, river valleys, also Africa, South America and Asia</li><li>Rarely isolated from the environment, common in dogs</li></ul></td><td><ul class=\"cl\"><li>Southwestern United States, Central and South America, the hot dry alkaline Lower Sonoran Life Zone</li><li>C. immitis in California, C. posadasii in Arizona, Texas and South America</li><li><b>Filipinos are the most susceptible group</b>, then African Americans, Native Americans, Hispanics and Asians, and pregnancy raises risk because the fungus has estrogen-binding proteins</li></ul></td><td>rural Latin America, farmers, 90% men aged 30 to 60</td></tr><tr><td><b>Mold at 25°C</b></td><td><ul class=\"cl\"><li>brown colony after 4 weeks, very slow (4 to 12 weeks)</li><li><b>Large tuberculate macroconidia</b> of 8 to 16 μm with spiny projections plus small infectious microconidia of 2 to 5 μm</li></ul></td><td>hyaline septate hyphae with lollipop-shaped conidia, white or brownish colony</td><td><ul class=\"cl\"><li>white to tan colony</li><li>Hyphae fragment into alternating <b>barrel-shaped arthroconidia</b> separated by disjunctor cells</li><li>The arthroconidia stay viable for years and are so infectious that a biosafety cabinet is mandatory and the organism is a potential bioweapon</li></ul></td></tr><tr><td><b>Form in tissue at 37°C</b></td><td>tiny 2 to 4 μm oval yeast with a single narrow-based bud, living as a <b>facultative intracellular parasite inside macrophages</b></td><td>large 8 to 15 μm thick-walled multinucleated yeast with a <b>single broad-based bud</b> that enlarges to the size of the parent before detaching</td><td><ul class=\"cl\"><li><b>spherules</b> up to 80 μm with doubly refractile walls containing hundreds of 2 to 5 μm endospores, which rupture and each endospore becomes a spherule</li><li>Spherules are diagnostic</li></ul></td><td>large multiple-budding yeast up to 30 μm with thin walls and narrow-necked buds arranged like the spokes of a <b>ship's wheel or pilot's wheel</b></td></tr><tr><td><b>Disease</b></td><td><ul class=\"cl\"><li>Darling's disease</li><li>95% subclinical flu-like illness</li><li>Acute pulmonary form with hilar nodes and infiltrates that heal with calcification</li><li>Chronic pulmonary form in men with emphysema, a reactivation with cavities</li><li>Severe disseminated disease in infants, the elderly and the immunosuppressed with mucocutaneous ulcers of nose, mouth and tongue, hepatosplenomegaly, high fever, anemia and yeast in marrow macrophages</li></ul></td><td><ul class=\"cl\"><li>mostly mild and undiagnosed pulmonary infiltrates, chronic pneumonia, pyogranulomatous reaction with non-caseating granulomas</li><li>Dissemination to skin (ulcerated verrucous granuloma with advancing border and central scarring), bone, genitalia and CNS</li></ul></td><td><ul class=\"cl\"><li>60% asymptomatic</li><li>Valley fever, San Joaquin Valley fever or desert rheumatism with fever, cough, arthralgia, hilar adenopathy, erythema nodosum or multiforme in 15%</li><li>Dissemination in under 1% to skin, bones and joints and <b>meninges</b></li></ul></td><td>pulmonary granuloma that may sit dormant for decades, chronic disease with painful oral mucosal ulcers and granulomatous lesions of lymph nodes, spleen, adrenals and liver, granulomas with central caseation</td></tr><tr><td><b>Diagnosis</b></td><td><ul class=\"cl\"><li>GMS, PAS or Giemsa show small oval yeast inside macrophages, usually positive in disseminated disease</li><li>Culture on glucose-cysteine-blood agar at 37°C or SDA at 25 to 30°C over 4 to 12 weeks</li><li>Complement fixation to histoplasmin (positive 2 to 5 weeks), immunodiffusion with H antigen for active disease and M antigen for past exposure or skin testing, and ELISA for circulating polysaccharide antigen, one of the <b>most sensitive</b> tests</li></ul></td><td><ul class=\"cl\"><li>broad-based buds on microscopy, culture in 2 weeks at 30°C, identity confirmed by conversion to yeast at 37°C, antigen A detection, complement fixation and immunodiffusion</li><li>The blastomycin skin test lacks sensitivity and specificity</li></ul></td><td><ul class=\"cl\"><li>KOH or calcofluor for spherules and endospores, H&amp;E, GMS or PAS, culture on inhibitory mold agar or brain-heart infusion</li><li>Skin test with coccidioidin (mycelial filtrate) or spherulin, positive at more than 5 mm at 24 to 48 hours, used for exposure surveys</li><li>ELISA IgM for active infection and IgG for past infection</li></ul></td><td>KOH or calcofluor, culture on Sabouraud or yeast extract agar at room temperature, conversion to yeast at 36°C is confirmatory, serology by complement fixation and immunodiffusion is the most useful test</td></tr><tr><td><b>Treatment</b></td><td><ul class=\"cl\"><li>supportive plus itraconazole for mild to moderate acute disease, <b>amphotericin B</b> for disseminated disease with prolonged therapy, itraconazole maintenance in AIDS because relapse is typical</li><li>Face masks in caves and poultry houses, formaldehyde on soil</li></ul></td><td>itraconazole for 6 months for confined lesions, amphotericin B for severe disease</td><td><ul class=\"cl\"><li>supportive for self-limited disease, itraconazole for symptoms, amphotericin B for severe disease followed by months of itraconazole, and <b>fluconazole for coccidioidal meningitis</b> because of its CNS penetration</li><li>Dust control by paving and planting</li></ul></td><td><b>itraconazole</b> is <b>most effective</b>, ketoconazole and TMP-SMX are alternatives, amphotericin B for severe disease</td></tr></tbody></table></div><ul class=\"l1\"><li><b>The Blastomyces \"which is false\" trap:</b> <b>Blastomyces</b> buds singly with a broad base.<ul class=\"l2\"><li>Multiple budding on a ship's wheel is <b>Paracoccidioides</b>, <b>spherules</b> are Coccidioides, and intracellular tiny yeast are <b>Histoplasma</b>.</li></ul></li><li>Histoplasma survives inside macrophages by producing bicarbonate and ammonia that alkalinize the phagolysosome and by preventing phagolysosomal fusion, then rides the macrophages to lymph nodes, liver, spleen and marrow.</li></ul><h5>The two serotypes of Histoplasma</h5><ul class=\"l1\"><li>H. capsulatum var. capsulatum causes classical histoplasmosis in the United States with 1 to 5 μm yeast and narrow bases.<ul class=\"l2\"><li>H. capsulatum var. duboisii causes African histoplasmosis with 5 to 12 μm yeast that affects skin, subcutaneous tissue and bone.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.08 II Endemic Mycoses, Coccidioidomycosis, Histoplasmosis, Blastomycosis, Paracoccidioidomycosis, Tables 1 to 5 and the Table 8 summary</p>","CANDIDA":"<h5>Candida albicans</h5><ul class=\"l1\"><li><b>Candida</b> species are part of the normal flora of skin, mucous membranes and the gastrointestinal tract and colonize every human soon after birth, so candidiasis is an endogenous opportunistic infection and is not considered communicable.<ul class=\"l2\"><li>It is the <b>most prevalent</b> systemic mycosis.</li><li>The common species are <b>C. albicans</b>, C. parapsilosis, <b>C. glabrata</b>, C. tropicalis, C. guilliermondii and C. dubliniensis.</li><li>Widespread <b>fluconazole</b> use has selected the azole-resistant C. glabrata, <b>C. krusei</b> and C. lusitaniae, and <b>C. auris</b> is multidrug-resistant.</li></ul></li></ul><h5>Morphology and identification</h5><ul class=\"l1\"><li>In culture or tissue <b>Candida</b> grows as oval budding yeast of 3 to 6 μm.<ul class=\"l2\"><li>When buds keep growing but fail to detach they form <b>pseudohyphae</b>, chains of elongated cells pinched at the septa.</li><li><b>C. albicans</b> is dimorphic and also makes true hyphae.</li><li>On agar at 37°C or room temperature the colonies are soft, cream-coloured and yeasty-smelling, with <b>pseudohyphae</b> as submerged growth.</li><li><b>C. glabrata</b> makes yeast cells only, with no pseudohyphae.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Test</th><th>Result that identifies C. albicans</th></tr></thead><tbody><tr><td><b>Germ tube test</b></td><td>incubation in serum at 37°C for 60 to 90 minutes produces true hyphae or germ tubes, which are thinner and more uniform than pseudohyphae</td></tr><tr><td><b>Chlamydospore formation</b></td><td>on nutritionally deficient media C. albicans produces large spherical chlamydospores</td></tr><tr><td><b>CHROMagar, 1 to 4 days</b></td><td>C. albicans <b>green</b>, C. tropicalis blue, C. glabrata dark purple, C. parapsilosis, lusitaniae, guilliermondii and krusei pink</td></tr></tbody></table></div><ul class=\"l1\"><li>Two serotypes exist, A (which includes C. tropicalis) and B.</li></ul><h5>Virulence factors</h5><ul class=\"l1\"><li>The cell wall of mannan, glucans, polysaccharides, proteins and glycoproteins stimulates host defenses and mediates attachment.<ul class=\"l2\"><li>Morphogenesis, the reversible switch between yeast and hyphal growth, confuses the immune response, produces <b>pseudohyphae</b> that are hard to phagocytose, gives a form of motility, expresses more surface receptors and opsonin binding, and builds <b>biofilm</b> on prosthetic surfaces where an extracellular matrix resists immune cells and antifungals.</li><li>Agglutinin-like sequence adhesins bind host receptors.</li><li>Ten secreted aspartyl proteinases degrade membranes and destroy <b>IgA</b>, and phospholipase B1 degrades membrane phospholipids.</li></ul></li></ul><h5>Clinical forms</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Form</th><th>Features</th></tr></thead><tbody><tr><td><b>Oral thrush</b></td><td><ul class=\"cl\"><li>patchy to confluent whitish pseudomembranous lesions on tongue, lips, gums or palate made of epithelium, yeast and pseudohyphae that can form intractable biofilm</li><li>Infants (transmitted from mother or nursery caregivers), most AIDS patients, antibiotic or steroid users</li></ul></td></tr><tr><td><b>Vulvovaginal candidiasis</b></td><td>irritation, pruritus and vaginal discharge, with diabetes, pregnancy, antibacterial drugs and local acidity as risk factors</td></tr><tr><td><b>Skin</b></td><td>intertrigo in warm moist folds, diaper rash, interdigital infection from prolonged immersion (homemakers, bartenders, cooks, fish handlers), onychomycosis with paronychia-like nail-fold swelling</td></tr><tr><td><b>Systemic candidiasis and candidemia</b></td><td><ul class=\"cl\"><li>follows broad-spectrum antibiotics, indwelling catheters, surgery, IV drug use, or damage to skin and gut</li><li>Yeast enters through the intestinal mucosa and seeds kidney, prosthetic valves, joints, meninges and eyes</li><li>Functional neutrophils are the critical defense, so candidemia is transient in the normal host and invasive in the neutropenic, in leukemia, lymphoma, aplastic anemia, chronic granulomatous disease and chronic steroid use</li><li>Endocarditis forms recalcitrant biofilm on prosthetic valves</li></ul></td></tr><tr><td><b>Chronic mucocutaneous candidiasis</b></td><td>rare granulomatous crusty lesions of skin, oral mucosa and scalp from a genetic cellular immune defect, associated with autoimmunity and hypoparathyroidism, needs <b>lifelong</b> azoles</td></tr></tbody></table></div><h5>Diagnosis and treatment</h5><ul class=\"l1\"><li>Gram-stained smears or histology show <b>pseudohyphae</b> and budding cells, <b>KOH</b> or calcofluor for skin and nails, culture at room temperature or 37°C on fungal or bacterial media, <b>germ tube</b> or chlamydospore for <b>C. albicans</b>, CHROMagar for rapid species identification.</li><li><b>Thrush and mucocutaneous forms</b><ul class=\"l2\"><li>Topical <b>nystatin</b></li><li>Oral <b>ketoconazole</b> or <b>fluconazole</b></li><li>Removal of contributing factors such as moisture and antibiotics</li></ul></li><li><b>Systemic disease</b><ul class=\"l2\"><li><b>Amphotericin B</b> is the <b>treatment of choice</b></li><li>It is combined with oral <b>flucytosine</b>, fluconazole or <b>caspofungin</b></li><li><b>Echinocandins</b> are used for resistant species</li><li>Prevention means not disturbing the normal microbiota and host defenses</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.08 III.A Candidiasis, Table 6</p>","PJP":"<h5>Pneumocystis jirovecii pneumonia</h5><ul class=\"l1\"><li><b>Pneumocystis jirovecii</b> was once thought to be a protozoan but is a fungus.<ul class=\"l2\"><li>It is the human species (<b>Pneumocystis</b> carinii is the rat species), is present in the lungs of many animals, rarely causes disease <b>except</b> in the immunocompromised, and is an extracellular pathogen.</li><li>It cannot be cultured.</li></ul></li><li>It is a major cause of death in AIDS.<ul class=\"l2\"><li>The host is the patient with <b>CD4 counts below 200 per μL</b>, and also transplant recipients, patients on steroids or chemotherapy, and premature or malnourished infants.</li></ul></li><li><b>Morphology:</b> <b>thin-walled trophozoites</b> and <b>thick-walled spherical to elliptical cysts of 4 to 6 μm containing four to eight nuclei</b>, found together in tight masses.<ul class=\"l2\"><li>Cysts stain with silver stain (GMS), toluidine blue and calcofluor white, and trophozoites with Giemsa.</li></ul></li><li><b>Pathogenesis:</b> growth is limited to the surfactant layer above the alveolar epithelium.<ul class=\"l2\"><li>In non-AIDS patients it causes an interstitial plasma-cell pneumonitis with infiltration of alveolar spaces by plasma cells, and the alveoli fill with a foamy exudate.</li></ul></li><li><b>Clinical:</b><ul class=\"l2\"><li>Nonproductive cough</li><li>Dyspnea</li><li>Fever and hypoxia</li><li>With bilateral interstitial or ground-glass infiltrates on the chest film</li></ul></li><li>Diagnosis is microscopy of bronchoalveolar lavage or induced sputum for cysts and trophozoites.<ul class=\"l2\"><li>A surface glycoprotein can be detected in sera of acutely ill and normal people and is used only to establish prevalence.</li></ul></li><li>Treatment of acute disease is <b>trimethoprim-sulfamethoxazole</b>, with pentamidine isethionate as the alternative.<ul class=\"l2\"><li>Both are also used as prophylaxis in the immunocompromised, started when the <b>CD4</b> count falls below 200.</li></ul></li></ul><h5>Fungal lung disease in the immunocompromised, compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Organism</th><th>Host clue</th><th>Laboratory clue</th><th>Drug</th></tr></thead><tbody><tr><td><b>Pneumocystis</b></td><td>AIDS with CD4 under 200, ground-glass infiltrates</td><td>cysts on silver stain, no culture possible</td><td>TMP-SMX</td></tr><tr><td><b>Aspergillus</b></td><td>neutropenia, leukemia, lymphoma, stem-cell transplant, long-term steroids, AIDS with CD4 under 50</td><td>narrow septate hyphae branching at 45 degrees, angioinvasion, galactomannan</td><td>voriconazole</td></tr><tr><td><b>Cryptococcus</b></td><td>AIDS, pigeon droppings, then meningitis</td><td>encapsulated yeast on India ink, capsular antigen</td><td>amphotericin B plus flucytosine, then fluconazole</td></tr><tr><td><b>Mucorales</b></td><td>diabetic ketoacidosis, iron overload, deferoxamine</td><td>broad non-septate hyphae at 90 degrees, black necrosis</td><td>amphotericin B plus debridement</td></tr><tr><td><b>Histoplasma</b></td><td>caves, bat and bird droppings, disseminated in AIDS</td><td>tiny yeast in macrophages, antigen ELISA</td><td>amphotericin B, itraconazole maintenance</td></tr><tr><td><b>Coccidioides</b></td><td>Southwestern US, Filipino ancestry, pregnancy</td><td>spherules with endospores</td><td>itraconazole, amphotericin B, fluconazole for meningitis</td></tr><tr><td><b>Candida</b></td><td>catheters, antibiotics, neutropenia</td><td>pseudohyphae, germ tube</td><td>amphotericin B, echinocandins</td></tr></tbody></table></div><ul class=\"l1\"><li>Among opportunistic infections of AIDS the trans lists the fungi <b>Candida</b>, <b>Cryptococcus</b>, <b>Histoplasma</b> and <b>Pneumocystis</b>, the viruses <b>CMV</b>, HSV, <b>VZV</b> and <b>JC virus</b>, the protozoa Toxoplasma, Isospora and Cryptosporidium, and the bacteria M. avium, M. tuberculosis, Listeria and Salmonella.</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.E Pneumocystis Pneumonia, MCB 2.06 Opportunistic Infections</p>","CRYPTO":"<h5>Cryptococcus neoformans and Cryptococcus gattii</h5><ul class=\"l1\"><li>Environmental basidiomycetous yeasts with <b>large polysaccharide capsules</b>.<ul class=\"l2\"><li>Infection follows inhalation of desiccated yeast cells or the smaller basidiospores, the lung is the primary organ, and the yeasts are neurotropic, migrating to the CNS to cause meningoencephalitis.</li><li>They can also infect skin and other organs.</li><li>The disease is not transmitted from person to person.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>C. neoformans</th><th>C. gattii</th></tr></thead><tbody><tr><td><b>Frequency</b></td><td>the more common species, 90% of infections, worldwide</td><td>less common, mainly tropical areas</td></tr><tr><td><b>Habitat</b></td><td><b>dry pigeon droppings</b> are the reservoir and optimal growth medium, although the birds are not infected, plus trees and soil</td><td>mainly trees</td></tr><tr><td><b>Host</b></td><td>immunocompromised patients: HIV/AIDS, hematologic malignancy, immunosuppression</td><td>mainly normal, immunocompetent hosts</td></tr><tr><td><b>Capsular serotype</b></td><td>A, D or AD</td><td>B or C</td></tr></tbody></table></div><h5>What distinguishes these two from the other cryptococci</h5><ul class=\"l1\"><li>All isolates are encapsulated, produce urease, grow at 37°C, and produce <b>laccase (phenol oxidase)</b>, which forms melanin from phenolic substrates such as catecholamines and reduces ferric to ferrous iron to aid iron acquisition.<ul class=\"l2\"><li>On bird-seed agar containing caffeic acid they grow as brown colonies.</li><li>The two species are separated by capsular serotype, genotype, biochemical reactions and clinical picture.</li></ul></li><li>They do not cause coccidiosis.<ul class=\"l2\"><li>That word belongs to <b>Coccidioides</b> (a dimorphic mold) or to coccidian parasites, which is the trap in 2028 Q54.</li></ul></li></ul><h5>Virulence and immune evasion</h5><ul class=\"l1\"><li>The capsular polysaccharide, mainly <b>glucuronoxylomannan (GXM)</b>, is the major antigen and it <b>inhibits phagocytosis</b>.<ul class=\"l2\"><li>It is shed during infection, which is why it can be detected in serum and CSF by latex agglutination or enzyme immunoassay.</li><li>Laccase-derived melanin resists oxidative killing, and urease helps invasion.</li></ul></li></ul><h5>Pathogenesis and clinical picture</h5><ol class=\"l1\"><li>Dry, minimally encapsulated, easily aerosolized yeast is inhaled.</li><li>The primary pulmonary infection is usually asymptomatic or a flu-like illness that resolves spontaneously.</li><li>In the immunocompromised the yeast multiplies and disseminates, with a preference for the CNS.</li><li><b>Chronic meningitis</b> is the major clinical manifestation: headache, neck stiffness and disorientation, high CSF pressure, protein and cell count with normal or low glucose.<ul class=\"l2\"><li>It resembles a brain tumor, abscess, degenerative disease or tuberculous meningitis, fluctuates when treated and is fatal untreated.</li></ul></li></ol><h5>Diagnosis and treatment</h5><ul class=\"l1\"><li><b>India ink</b> wet mount of CSF shows spherical budding yeast of 5 to 10 μm surrounded by a thick non-staining capsule (the halo effect).<ul class=\"l2\"><li>Culture gives whitish mucoid colonies in 2 to 3 days at room temperature or 37°C, sometimes brown from melanin.</li><li>Cycloheximide-containing media must be avoided.</li><li>Latex agglutination or EIA for GXM is positive in about 90% of meningitis cases.</li></ul></li><li>Standard treatment of cryptococcal meningitis is <b>amphotericin B combined with flucytosine</b>, which act synergistically and both penetrate CSF.<ul class=\"l2\"><li>Amphotericin B is curative in most non-AIDS patients.</li><li>AIDS patients relapse when it is withdrawn, so they receive suppressive <b>fluconazole</b>, which has excellent CNS penetration.</li><li><b>HAART</b> lowers the incidence.</li></ul></li></ul><h5>Meningitis agents to contrast</h5><ul class=\"l1\"><li><b>Coccidioides</b> meningitis is treated with <b>fluconazole</b> for the same reason of CNS penetration, <b>Candida</b> meningitis follows candidemia, and viral aseptic meningitis (enteroviruses, <b>mumps</b>) has normal glucose and no encapsulated yeast.</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.B Cryptococcosis, Table 7</p>","BIOFILM":"<h5>Biofilm as a fungal virulence factor</h5><ul class=\"l1\"><li>The trans defines fungal <b>biofilm</b> as an accumulation of yeast and <b>pseudohyphae</b> on biological or prosthetic surfaces, <b>protected by extracellular matrix material that resists penetration by the host immune response and by antifungal drugs</b>.</li></ul><h5>How it protects the fungus</h5><ol class=\"l1\"><li>Adhesins attach yeast cells to a surface such as a catheter, prosthetic valve, shunt, denture or mucosa.</li><li>Cells switch to hyphal and pseudohyphal growth and multiply into a community.</li><li>The community secretes an extracellular polysaccharide matrix that physically blocks antibodies, complement, phagocytes and drugs.</li><li>Cells deep in the <b>biofilm</b> grow slowly and pump drugs out, so the infection persists and relapses even when planktonic cells are susceptible.</li><li>The biofilm periodically sheds cells into the bloodstream, seeding distant organs.</li></ol><ul class=\"l1\"><li>Clinical settings in 2.08: <b>catheter-related candidemia</b>, <b>candidal endocarditis</b> with recalcitrant biofilm on prosthetic valves or vegetations, and intractable oral thrush pseudomembranes.<ul class=\"l2\"><li>Management almost always requires removal of the device in addition to <b>amphotericin B</b> or an echinocandin.</li></ul></li><li>In 2.09 the same principle applies to Staphylococcus epidermidis on prosthetic valves, shunts and lines, and to <b>Candida</b> auris persisting on hospital surfaces for months.</li></ul><h5>The other Candida virulence factors, for contrast</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Factor</th><th>What it does</th></tr></thead><tbody><tr><td><b>Morphogenesis, the yeast-to-hypha switch</b></td><td>pseudohyphae resist phagocytosis, invade tissue, act as a form of motility and express more receptors</td></tr><tr><td><b>Agglutinin-like sequence adhesins</b></td><td>bind host cell membrane receptors on epithelium and endothelium</td></tr><tr><td><b>Secreted aspartyl proteinases, ten of them</b></td><td>degrade host membranes and destroy secretory IgA</td></tr><tr><td><b>Phospholipase B1</b></td><td>degrades membrane phospholipids and increases permeability</td></tr><tr><td><b>Cell wall mannan and glucans</b></td><td>mediate attachment, and also alert the immune system through pattern recognition</td></tr></tbody></table></div><h5>Immune evasion strategies across the fungi</h5><ul class=\"l1\"><li><b>Cryptococcus</b> uses an antiphagocytic capsule and melanin.<ul class=\"l2\"><li><b>Histoplasma</b> alkalinizes the phagolysosome and blocks its fusion so it can live inside macrophages.</li><li><b>Aspergillus</b> and <b>Mucorales</b> invade blood vessels, causing thrombosis and necrosis that keep drugs and leukocytes out.</li><li>Alpha-1,3-glucan masks immunogenic wall components, and melanin in dematiaceous fungi protects against oxidative stress.</li><li><b>Coccidioides</b> <b>arthroconidia</b> resist harsh environments and its melanin may protect against host defenses.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.08 III.A Candidiasis Pathogenesis and Virulence Factors, MCB 2.07 I.D Virulence Factors, MCB 2.09 Resident Flora</p>","ASPERG":"<h5>Aspergillus</h5><ul class=\"l1\"><li>Ubiquitous saprophytic molds found worldwide.<ul class=\"l2\"><li><b>Aspergillus fumigatus</b> is the <b>most common</b> human pathogen, with A. flavus, A. niger, A. terreus and A. lentulus also causing disease.</li><li>The fungus grows rapidly with aerial hyphae bearing long conidiophores that end in a vesicle, phialides on the vesicle produce basipetal chains of conidia, and species are identified by these structures.</li><li>A. fumigatus gives a gray-green colony on potato flakes agar with uniseriate conidiophores and columnar conidia.</li></ul></li><li>In tissue the hyphae are <b>hyaline, septate and uniform, about 4 μm wide, and branch dichotomously at acute angles of about 45 degrees</b>.</li></ul><h5>Aspergillus and Mucorales side by side</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Aspergillus</th><th>Mucorales (Rhizopus, Mucor, Lichtheimia)</th></tr></thead><tbody><tr><td><b>Hyphae</b></td><td>narrow, <b>septate</b>, branching at <b>45 degrees</b></td><td>broad, 10 to 15 μm, ribbon-like, <b>non-septate or sparsely septate</b>, irregular branching at <b>90 degrees</b></td></tr><tr><td><b>Typical host</b></td><td>neutropenia, leukemia and lymphoma, stem-cell transplant, long-term steroids, AIDS with CD4 under 50</td><td>diabetic ketoacidosis, iron overload from repeated transfusion, deferoxamine, neutropenia</td></tr><tr><td><b>Signature disease</b></td><td>aspergilloma in an old cavity, allergic bronchopulmonary aspergillosis, invasive angioinvasive disease</td><td>rhinocerebral \"black fungus\" with facial necrosis, angioinvasion</td></tr><tr><td><b>Drug</b></td><td>voriconazole for invasive disease, itraconazole or amphotericin B for aspergilloma, caspofungin for refractory disease, posaconazole for the amphotericin-resistant A. terreus, flavus and lentulus</td><td>amphotericin B plus surgical debridement, posaconazole as alternative</td></tr></tbody></table></div><h5>The clinical forms</h5><ul class=\"l1\"><li><b>Allergic forms</b><ul class=\"l2\"><li>Immediate asthmatic reaction from IgE against conidial antigens</li><li><b>Allergic bronchopulmonary aspergillosis</b><ul class=\"l3\"><li>Conidia germinate and hyphae colonize the bronchial tree without invading parenchyma</li><li>Asthma, recurrent infiltrates and eosinophilia</li><li>Type I and type III skin reactivity, sputum positive for <b>Aspergillus</b>, serum precipitins</li><li>Eventually permanent scarring</li></ul></li><li>Extrinsic allergic alveolitis after a massive conidial dose in normal hosts</li><li>Treated with corticosteroids and disodium cromoglycate</li></ul></li><li><b>Aspergilloma (fungus ball)</b>: inhaled conidia enter a pre-existing cavity from tuberculosis or other disease, germinate and produce a mass of hyphae.<ul class=\"l2\"><li>Patients may be asymptomatic or have cough, dyspnea, weight loss, fatigue and hemoptysis.</li><li>It rarely becomes invasive and is treated with <b>itraconazole</b> or <b>amphotericin B</b> and surgery when symptomatic.</li></ul></li><li>Localized non-invasive colonization of nasal sinuses, ear canal, cornea and nails.</li><li><b>Invasive aspergillosis</b><ul class=\"l2\"><li>Occurs in the immunocompromised, whose macrophages fail to destroy conidia</li><li>Conidia swell and germinate, and hyphae invade the lumens and walls of blood vessels</li><li>The result is thrombosis, infarction and necrosis</li><li>Spread follows to the gut, kidney, liver, brain and other organs with abscesses</li><li>Symptoms are fever, cough, dyspnea and hemoptysis</li><li>Treated with amphotericin B or <b>voriconazole</b>, plus cytokine immunotherapy such as G-CSF or IFN-γ</li><li><b>Chronic</b> necrotizing disease is treated with <b>voriconazole</b> or itraconazole</li></ul></li><li>Diagnosis is <b>KOH</b>, calcofluor or histology showing the hyphae, culture within days on most media at room temperature, and the galactomannan or 1,3-beta-D-glucan antigen assays.</li><li>Hospital link (2.09): construction dust releases Aspergillus spores, which travel as <b>airborne</b> particles, so severely immunocompromised patients are placed in a positive-pressure protective environment with HEPA filtration, the opposite of an airborne isolation room.</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.C Aspergillosis, III.D Mucormycosis, MCB 2.09 Table 1</p>","2028-50":"<h5>Coccidioidal meningitis and the CNS antifungals</h5><ul class=\"l1\"><li>Disseminated coccidioidomycosis occurs in less than 1% of infections, usually within a year of the primary infection, spreading hematogenously or by direct extension to the <b>skin, bones and joints, and meninges</b>.<ul class=\"l2\"><li>Risk factors are heredity, male sex, pregnancy (the fungus has estrogen-binding proteins), the very young and old, compromised cell-mediated immunity, and race, with <b>Filipinos</b> most affected.</li></ul></li><li><b>Oral fluconazole is the </b>treatment of choice<b> for coccidioidal meningitis because of its good CNS penetration</b>, given long term to eradicate the fungus from the CNS.</li><li>Amphotericin B given parenterally is the <b>treatment of choice</b> for severe non-meningeal disease, followed by months of oral <b>itraconazole</b>.<ul class=\"l2\"><li>It penetrates the CNS and joints poorly, so intrathecal or intra-articular administration is sometimes needed.</li><li>Symptomatic primary infection is self-limited and needs only support, with itraconazole to reduce symptoms.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Drug</th><th>CNS penetration</th><th>CNS role</th></tr></thead><tbody><tr><td><b>Fluconazole</b></td><td>the <b>best</b> of all</td><td>cryptococcal and coccidioidal meningitis maintenance and treatment, no effect on human steroidogenesis, side effects limited to liver enzymes and hepatitis</td></tr><tr><td><b>Flucytosine</b></td><td>good</td><td>combined with amphotericin B for cryptococcal meningitis, where both penetrate CSF and act synergistically</td></tr><tr><td><b>Amphotericin B</b></td><td>poor</td><td>induction for cryptococcal meningitis and severe systemic mycoses, intrathecal when needed</td></tr><tr><td><b>Voriconazole</b></td><td>good</td><td>CNS aspergillosis</td></tr><tr><td><b>Itraconazole</b></td><td>poor</td><td>not for meningitis</td></tr><tr><td><b>Echinocandins</b></td><td>poor</td><td>not for meningitis</td></tr><tr><td><b>Ketoconazole</b></td><td>poor</td><td>non-meningeal disease only</td></tr></tbody></table></div><h5>Coccidioides recap</h5><ul class=\"l1\"><li><b>Arthroconidia</b> at 25 to 30°C, <b>spherules</b> with <b>endospores</b> at 37°C.<ul class=\"l2\"><li>Valley fever with fever, malaise, cough, arthralgia, headache, hilar adenopathy, and hypersensitivity rashes such as erythema nodosum in 15%.</li><li>Diagnosis by <b>KOH</b> or calcofluor for spherules, culture in a biosafety cabinet, skin test with coccidioidin or spherulin, ELISA <b>IgM</b> for active and <b>IgG</b> for past infection.</li><li>Control is dust suppression by paving roads and planting grass.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.08 II.A Coccidioidomycosis Clinical Manifestations, Treatment and Control, IV.C Fluconazole</p>","2028-52":"<h5>Mucormycosis, also called zygomycosis</h5><ul class=\"l1\"><li>Caused by ubiquitous, thermotolerant saprophytic molds of the order <b>Mucorales</b>.<ul class=\"l2\"><li>The leading pathogens are Rhizopus, Rhizomucor, Lichtheimia (Absidia), Cunninghamella and Mucor, and <b>Rhizopus oryzae is the </b>most prevalent<b> agent</b>.</li></ul></li></ul><h5>Pathogenesis, step by step</h5><ol class=\"l1\"><li>In a normal host, neutrophils engulf the hyphae and contain the infection.</li><li>In a susceptible host, fungal spores adhere to extracellular matrix proteins of the basement membrane and secrete lipolytic and glycosidic enzymes and proteases that degrade the stroma.</li><li>Hyphae invade blood vessels.<ul class=\"l2\"><li><b>Angioinvasion is the </b>most characteristic<b> feature</b> of mucormycosis.</li></ul></li><li>Vessel thrombosis causes ischemia and necrosis, seen as black discoloured tissue.</li><li>The dead, bloodless tissue also protects the fungus, because systemic antifungals and inflammatory cells cannot reach it.</li></ol><ul class=\"l1\"><li><b>The role of iron:</b> free iron drives fungal growth.<ul class=\"l2\"><li>Acidosis, as in diabetic ketoacidosis, impairs the iron-binding capacity of transferrin and frees ferrous iron, and repeated transfusions cause iron overload, so both predispose to mucormycosis, as does deferoxamine.</li></ul></li></ul><h5>Clinical forms</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Form</th><th>Features</th></tr></thead><tbody><tr><td><b>Rhinocerebral</b></td><td><ul class=\"cl\"><li>the <b>major clinical form</b></li><li>Sporangiospores germinate in the nasal passages, hyphae invade vessels, and thrombosis, infarction and necrosis progress rapidly into the sinuses, orbit, cranial bones and brain</li><li>Facial edema, bloody nasal exudate, black necrotic nasal and palatal tissue, orbital cellulitis, damaged vessels and nerves</li><li>Survival is good with prompt treatment but residual facial paralysis or loss of an eye is common</li></ul></td></tr><tr><td><b>Thoracic or pulmonary</b></td><td>inhaled spores invade lung parenchyma and vessels, the \"black fungus\"</td></tr><tr><td><b>Cutaneous, gastrointestinal and disseminated</b></td><td>in trauma, burns or profound immunosuppression</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Diagnosis:</b> microscopy shows <b>broad hyphae of 10 to 15 μm with uneven thickness, irregular right-angle branching and sparse septa</b>.<ul class=\"l2\"><li>Culture grows rapidly into abundant cottony colonies, and identification rests on the sporangial structures.</li></ul></li><li>Treatment is <b>urgent surgical debridement plus amphotericin B</b> and control of the underlying disease (correct ketoacidosis, stop deferoxamine, reduce immunosuppression).<ul class=\"l2\"><li><b>Posaconazole</b> is the azole with activity.</li></ul></li></ul><h5>Facial and nasal infections to distinguish</h5><ul class=\"l1\"><li><b>Aspergillus</b> can also invade sinuses but shows narrow septate 45-degree hyphae in neutropenic hosts and is treated with <b>voriconazole</b>.<ul class=\"l2\"><li>Rhinoscleroma and nasal NK/T-cell lymphoma are non-fungal mimics.</li><li>Chromoblastomycosis and mycetoma are subcutaneous, slow, and never angioinvasive.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.08 III.D Mucormycosis</p>","2028-53":"<h5>Azole-resistant Candida and the alternative drugs</h5><ul class=\"l1\"><li>The trans states that the widespread use of <b>fluconazole</b> has triggered the azole-resistant species <b>C. glabrata, C. krusei and C. lusitaniae</b>, and that <b>C. auris is multidrug-resistant</b>.</li><li><b>C. glabrata</b> produces only yeast cells and no <b>pseudohyphae</b>, is dark purple on CHROMagar, and has intrinsically reduced azole susceptibility.<ul class=\"l2\"><li><b>C. krusei</b> is intrinsically resistant to fluconazole and pink on CHROMagar.</li><li><b>C. auris</b> persists on hospital surfaces for months and needs <b>contact precautions</b> (2.09).</li></ul></li><li><b>Alternative therapy</b><ul class=\"l2\"><li><b>Echinocandins</b> (<b>caspofungin</b>, micafungin, anidulafungin)<ul class=\"l3\"><li>Inhibit 1,3-beta-glucan synthase and destroy cell wall integrity</li><li>Given intravenously and well tolerated</li><li>The drugs for resistant <b>Candida</b> infections and refractory aspergillosis, as well as esophageal candidiasis and prophylaxis in stem-cell transplant</li></ul></li><li>Amphotericin B</li><li><b>Posaconazole</b>, which is effective against fluconazole-resistant Candida</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Species</th><th>Pseudohyphae</th><th>Germ tube</th><th>CHROMagar</th><th>Azole susceptibility</th></tr></thead><tbody><tr><td><b>C. albicans</b></td><td>yes, plus true hyphae</td><td>positive</td><td>green</td><td>susceptible</td></tr><tr><td><b>C. tropicalis</b></td><td>yes</td><td>negative</td><td>blue</td><td>usually susceptible, serotype A</td></tr><tr><td><b>C. glabrata</b></td><td><b>none</b></td><td>negative</td><td>dark purple</td><td><b>resistance common</b></td></tr><tr><td><b>C. krusei</b></td><td>yes</td><td>negative</td><td>pink</td><td>intrinsically fluconazole-resistant</td></tr><tr><td><b>C. parapsilosis</b></td><td>yes</td><td>negative</td><td>pink</td><td>susceptible, catheters and neonates</td></tr><tr><td><b>C. lusitaniae, C. guilliermondii</b></td><td>yes</td><td>negative</td><td>pink</td><td>lusitaniae azole-resistant</td></tr><tr><td><b>C. auris</b></td><td></td><td></td><td></td><td>multidrug-resistant, hospital outbreaks</td></tr></tbody></table></div><h5>The antifungal classes and their targets</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Class</th><th>Target</th><th>Members and notes</th></tr></thead><tbody><tr><td><b>Polyenes</b></td><td>bind ergosterol and form pores that leak potassium, fungicidal</td><td>amphotericin B (intravenous, broad, <b>most effective</b> for severe systemic mycoses, nephrotoxicity, hypokalemia, fever and chills, lipid preparations are less toxic) and nystatin (topical only, too toxic parenterally)</td></tr><tr><td><b>Azoles</b></td><td>block cytochrome P450 14-alpha-demethylase and ergosterol synthesis, fungistatic</td><td>imidazoles (ketoconazole, miconazole, clotrimazole) and triazoles (fluconazole, itraconazole, voriconazole, posaconazole)</td></tr><tr><td><b>Echinocandins</b></td><td>inhibit 1,3-beta-glucan synthase in the cell wall</td><td>caspofungin, micafungin, anidulafungin</td></tr><tr><td><b>Flucytosine</b></td><td>transported by a permease, deaminated by fungal cytosine deaminase to 5-fluorouracil, which blocks thymidylate synthetase and DNA synthesis</td><td>oral, used with amphotericin B for cryptococcosis and candidiasis, good CSF penetration, active against dematiaceous fungi, resistance emerges fast alone, marrow suppression</td></tr><tr><td><b>Griseofulvin</b></td><td>binds tubulin and disrupts the mitotic spindle in growing hyphae</td><td>dermatophytes only, concentrates in stratum corneum, long courses, headache</td></tr><tr><td><b>Allylamines</b></td><td>inhibit squalene epoxidase</td><td>terbinafine, oral, dermatophytes and nails, pulse dosing</td></tr><tr><td><b>Investigational</b></td><td>nikkomycin inhibits chitin synthase, sordarins block elongation factor 2</td><td></td></tr></tbody></table></div><ul class=\"l1\"><li>Fungi are eukaryotes that share pathways with human cells, which limits the drug targets and explains the toxicity of some agents.</li></ul><p class=\"rsrc\">Source: MCB 2.08 III.A Candidiasis, IV Antifungals, Classification and Systemic Agents, Table 6</p>","DROPLET":"<h5>The three transmission-based precautions, layered on standard precautions</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Contact</th><th>Droplet</th><th>Airborne (airborne infection isolation)</th></tr></thead><tbody><tr><td><b>The particle</b></td><td>organisms on hands, fomites and surfaces</td><td>large droplets over 5 μm that fall within 1 to 2 meters and do not stay suspended</td><td>droplet nuclei of 5 μm or less that stay suspended for hours and travel on air currents</td></tr><tr><td><b>The room</b></td><td>single room or cohort, at least 1 meter between beds, privacy curtain, door may stay open</td><td>single room or cohort, at least 1 meter between beds, <b>door may stay open, no special air handling</b></td><td>single room with <b>negative pressure</b>, at least 12 air changes per hour (6 in older buildings), air exhausted outdoors or through HEPA, <b>door kept closed</b>, daily pressure monitoring</td></tr><tr><td><b>The barrier</b></td><td><b>gown and gloves on entry</b>, removed before leaving, hand hygiene on exit, dedicated stethoscope, cuff and thermometer</td><td><b>surgical mask on entry</b>, eye protection for splash, mask the patient during transport</td><td><b>fit-tested N95 or higher respirator</b> put on before entering and removed after leaving, seal check, mask the patient for transport, gown and gloves added for varicella and disseminated zoster</td></tr><tr><td><b>Organisms</b></td><td>MRSA, VRE, ESBL and carbapenem-resistant Enterobacterales, Acinetobacter, Candida auris, <b>Clostridioides difficile</b> (soap and water, sporicidal cleaning), <b>norovirus and rotavirus</b> (soap and water, hypochlorite), RSV and parainfluenza in children, scabies and lice, draining wounds, diapered or incontinent diarrhea</td><td>influenza, <b>pertussis</b> (until 5 days of macrolide), <b>Neisseria meningitidis</b> (until 24 hours of therapy), Haemophilus influenzae type b, group A streptococcus (24 hours), Mycoplasma, adenovirus, rhinovirus, <b>rubella and mumps</b> (5 days after parotitis), diphtheria, pneumonic plague, RSV with contact, SARS-CoV-2 in routine care</td><td><ul class=\"cl\"><li><b>Mycobacterium tuberculosis</b>, <b>measles</b>, <b>varicella</b>, disseminated herpes zoster with contact, smallpox, SARS-CoV-2 during aerosol-generating procedures</li><li>Aspergillus spores from construction dust need the reverse, a positive-pressure protective environment</li></ul></td></tr></tbody></table></div><h5>What droplet precautions do and do not need</h5><ul class=\"l1\"><li>Because droplets fall within about 1 meter and do not linger, there is no need for <b>negative pressure</b>, special ventilation or a respirator.<ul class=\"l2\"><li>The interventions are a <b>surgical mask</b>, a closed-enough distance, hand hygiene after contact with respiratory secretions, and a mask on the patient when moving.</li></ul></li><li>Pertussis is a droplet pathogen that remains contagious until 5 days of macrolide therapy have been completed, and it is also the re-emerging vaccine-preventable disease of 2.10 whose Philippine surge peaked in 2024.</li></ul><h5>The pairs the examiners love to swap</h5><ul class=\"l1\"><li><b>Mumps</b> and <b>rubella</b> are droplet, but <b>measles</b> is <b>airborne</b> even though all three are in the <b>MMR</b> vaccine.</li><li>Pertussis and meningococcus are droplet, but tuberculosis is airborne even though all three are respiratory bacteria.</li><li>Localized herpes zoster is contact, but disseminated zoster and varicella are airborne plus contact.</li><li><b>RSV</b> and <b>parainfluenza</b> are contact (with droplet for RSV) because they survive on hands and fomites, while influenza is droplet.</li><li><b>Duration matters:</b> patients stay contagious even on treatment until the organism-specific window ends, so precautions are not lifted the moment antibiotics start.</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.F.03 Droplet Transmission, III.B.02 Droplet Precaution, Table 1</p>","CONTACT":"<h5>The three transmission-based precautions, layered on standard precautions</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Contact</th><th>Droplet</th><th>Airborne (airborne infection isolation)</th></tr></thead><tbody><tr><td><b>The particle</b></td><td>organisms on hands, fomites and surfaces</td><td>large droplets over 5 μm that fall within 1 to 2 meters and do not stay suspended</td><td>droplet nuclei of 5 μm or less that stay suspended for hours and travel on air currents</td></tr><tr><td><b>The room</b></td><td>single room or cohort, at least 1 meter between beds, privacy curtain, door may stay open</td><td>single room or cohort, at least 1 meter between beds, <b>door may stay open, no special air handling</b></td><td>single room with <b>negative pressure</b>, at least 12 air changes per hour (6 in older buildings), air exhausted outdoors or through HEPA, <b>door kept closed</b>, daily pressure monitoring</td></tr><tr><td><b>The barrier</b></td><td><b>gown and gloves on entry</b>, removed before leaving, hand hygiene on exit, dedicated stethoscope, cuff and thermometer</td><td><b>surgical mask on entry</b>, eye protection for splash, mask the patient during transport</td><td><b>fit-tested N95 or higher respirator</b> put on before entering and removed after leaving, seal check, mask the patient for transport, gown and gloves added for varicella and disseminated zoster</td></tr><tr><td><b>Organisms</b></td><td>MRSA, VRE, ESBL and carbapenem-resistant Enterobacterales, Acinetobacter, Candida auris, <b>Clostridioides difficile</b> (soap and water, sporicidal cleaning), <b>norovirus and rotavirus</b> (soap and water, hypochlorite), RSV and parainfluenza in children, scabies and lice, draining wounds, diapered or incontinent diarrhea</td><td>influenza, <b>pertussis</b> (until 5 days of macrolide), <b>Neisseria meningitidis</b> (until 24 hours of therapy), Haemophilus influenzae type b, group A streptococcus (24 hours), Mycoplasma, adenovirus, rhinovirus, <b>rubella and mumps</b> (5 days after parotitis), diphtheria, pneumonic plague, RSV with contact, SARS-CoV-2 in routine care</td><td><ul class=\"cl\"><li><b>Mycobacterium tuberculosis</b>, <b>measles</b>, <b>varicella</b>, disseminated herpes zoster with contact, smallpox, SARS-CoV-2 during aerosol-generating procedures</li><li>Aspergillus spores from construction dust need the reverse, a positive-pressure protective environment</li></ul></td></tr></tbody></table></div><h5>Why Clostridioides difficile is a contact-precaution organism</h5><ul class=\"l1\"><li>The infection is antibiotic-driven and spore-mediated, and the environment is its reservoir.<ul class=\"l2\"><li>Spores resist alcohol and routine disinfectants and persist on surfaces for months.</li></ul></li><li>Alcohol-based hand rub is the default for most patient contact (60 to 95% alcohol, 20 to 30 seconds, kills enveloped viruses and vegetative bacteria), but it is not sporicidal.<ul class=\"l2\"><li><b>Soap and water with mechanical friction for 40 to 60 seconds is required</b> after caring for a patient with <b>C. difficile</b>, when hands are visibly soiled, and in suspected <b>norovirus</b>, because non-enveloped viruses also resist alcohol.</li></ul></li><li>The room needs daily and terminal cleaning with a <b>hypochlorite</b> or other sporicidal agent, dedicated equipment, <b>gown and gloves</b> on entry, removal inside the room, and hand hygiene on exit.</li><li>A prior occupant with a multidrug-resistant organism raises the next patient's risk, which proves the environment is part of the chain of infection.</li></ul><h5>How long organisms survive on surfaces, and what that means</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Organism</th><th>Survival</th><th>Control emphasis</th></tr></thead><tbody><tr><td><b>Gram-negative bacilli</b></td><td>survive dry surfaces longer than gram-positives in general, Klebsiella up to 600 days, Acinetobacter for months in the ICU</td><td>environmental cleaning</td></tr><tr><td><b>Spores and mycobacteria</b></td><td>the longest</td><td>sporicidal agents, terminal cleaning</td></tr><tr><td><b>Staphylococcus aureus and MRSA</b></td><td>months, and S. aureus persists longer when dry</td><td>cleaning plus hand hygiene</td></tr><tr><td><b>VRE, C. difficile, C. auris</b></td><td>months</td><td>cleaning and contact precautions</td></tr><tr><td><b>RSV</b></td><td>hours</td><td>hand hygiene</td></tr><tr><td><b>Influenza</b></td><td>1 to 2 days</td><td>hand hygiene and droplet precautions</td></tr><tr><td><b>Most bacteria</b></td><td>prefer humidity</td><td>keep surfaces dry</td></tr></tbody></table></div><ul class=\"l1\"><li>The lesson of 2.09: organisms that live long on surfaces are controlled by attacking the environment, organisms that die quickly are controlled by attacking hands and air.</li></ul><p class=\"rsrc\">Source: MCB 2.09 III.B.01 Contact Precaution, III.A.01 Hand Hygiene, Survival of HAI Pathogens</p>","AIRBORNE":"<h5>The three transmission-based precautions, layered on standard precautions</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Contact</th><th>Droplet</th><th>Airborne (airborne infection isolation)</th></tr></thead><tbody><tr><td><b>The particle</b></td><td>organisms on hands, fomites and surfaces</td><td>large droplets over 5 μm that fall within 1 to 2 meters and do not stay suspended</td><td>droplet nuclei of 5 μm or less that stay suspended for hours and travel on air currents</td></tr><tr><td><b>The room</b></td><td>single room or cohort, at least 1 meter between beds, privacy curtain, door may stay open</td><td>single room or cohort, at least 1 meter between beds, <b>door may stay open, no special air handling</b></td><td>single room with <b>negative pressure</b>, at least 12 air changes per hour (6 in older buildings), air exhausted outdoors or through HEPA, <b>door kept closed</b>, daily pressure monitoring</td></tr><tr><td><b>The barrier</b></td><td><b>gown and gloves on entry</b>, removed before leaving, hand hygiene on exit, dedicated stethoscope, cuff and thermometer</td><td><b>surgical mask on entry</b>, eye protection for splash, mask the patient during transport</td><td><b>fit-tested N95 or higher respirator</b> put on before entering and removed after leaving, seal check, mask the patient for transport, gown and gloves added for varicella and disseminated zoster</td></tr><tr><td><b>Organisms</b></td><td>MRSA, VRE, ESBL and carbapenem-resistant Enterobacterales, Acinetobacter, Candida auris, <b>Clostridioides difficile</b> (soap and water, sporicidal cleaning), <b>norovirus and rotavirus</b> (soap and water, hypochlorite), RSV and parainfluenza in children, scabies and lice, draining wounds, diapered or incontinent diarrhea</td><td>influenza, <b>pertussis</b> (until 5 days of macrolide), <b>Neisseria meningitidis</b> (until 24 hours of therapy), Haemophilus influenzae type b, group A streptococcus (24 hours), Mycoplasma, adenovirus, rhinovirus, <b>rubella and mumps</b> (5 days after parotitis), diphtheria, pneumonic plague, RSV with contact, SARS-CoV-2 in routine care</td><td><ul class=\"cl\"><li><b>Mycobacterium tuberculosis</b>, <b>measles</b>, <b>varicella</b>, disseminated herpes zoster with contact, smallpox, SARS-CoV-2 during aerosol-generating procedures</li><li>Aspergillus spores from construction dust need the reverse, a positive-pressure protective environment</li></ul></td></tr></tbody></table></div><h5>The specifics of airborne precautions</h5><ul class=\"l1\"><li>Droplet nuclei are the desiccated residues of droplets.<ul class=\"l2\"><li>At 5 μm or less they behave like a gas, remain suspended for hours, are inhaled deep into the lower airway where they bypass upper-airway defenses, and infect people who never had face-to-face contact with the patient.</li><li>Tuberculosis persists in the air for 24 to <b>48 hours</b> but dies quickly in sunlight.</li></ul></li><li><b>Requirements in full:</b><ul class=\"l2\"><li><b>Negative pressure</b> relative to the corridor so air flows in</li><li>At least 12 air changes per hour</li><li>Exhaust outdoors or through HEPA</li><li>Door kept closed</li><li>Daily pressure monitoring</li><li>An <b>N95</b> or higher respirator with a seal check before entry</li><li>A <b>surgical mask</b> on the patient during any transport</li><li>Visitors limited</li><li><b>Immune staff assigned to measles and varicella patients</b></li></ul></li><li>A surgical mask, even doubled, is never sufficient for <b>airborne</b> pathogens because it does not seal.</li><li><b>Positive pressure is the opposite idea:</b> protective isolation for bone-marrow transplant and other severely immunocompromised patients against <b>Aspergillus</b> spores, with air flowing out of the room and HEPA filtration in.</li></ul><h5>Why measles, varicella and tuberculosis</h5><ul class=\"l1\"><li><b>Measles</b> has an R0 of 12 to 18, the highest of any vaccine-preventable disease, and needs 92 to 94% coverage for herd immunity.<ul class=\"l2\"><li>It is contagious from the prodrome to 2 to 5 days after the rash, and 2.09 lists it among occupational infections of healthcare workers.</li></ul></li><li>Varicella virus is shed from the respiratory tract before the rash appears and from the vesicles afterwards, so both <b>airborne</b> and <b>contact precautions</b> apply until every lesion is crusted.<ul class=\"l2\"><li>Disseminated zoster behaves the same way.</li></ul></li><li>Tuberculosis is the classic airborne organism and is also the classic BSL-3 organism in the laboratory.</li><li><b>Staff protection</b><ul class=\"l2\"><li>Vaccination against <b>hepatitis B</b>, influenza, <b>MMR</b>, varicella, Tdap and COVID-19</li><li>Annual fit testing</li><li>Tuberculosis screening</li><li>Immediate reporting of exposures for post-exposure prophylaxis</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.09 II.F.04 Airborne Transmission, III.B.03 Airborne Infection Isolation, Table 1</p>","STD":"<h5>Standard precautions</h5><ul class=\"l1\"><li>Applied to <b>every patient in every encounter regardless of diagnosis</b>, because you cannot know who is colonized or infected.</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Component</th><th>What it involves</th></tr></thead><tbody><tr><td><b>Hand hygiene</b></td><td><ul class=\"cl\"><li>alcohol-based rub as the default (60 to 95% alcohol, 20 to 30 seconds), soap and water for 40 to 60 seconds when hands are visibly soiled, after C. difficile or other spore-formers, and in suspected norovirus</li><li>Short nails, no artificial nails, gloves are never a substitute, and the WHO five moments: before touching a patient, before a clean or aseptic procedure, after body-fluid exposure, after touching a patient, after touching the patient's surroundings</li></ul></td></tr><tr><td><b>Personal protective equipment by anticipated exposure</b></td><td><ul class=\"cl\"><li>gloves for contact with blood, body fluids, mucous membranes and non-intact skin, a gown when clothing may be soiled, a mask and eye protection when splashes are likely</li><li>Donning order: hand hygiene, gown, mask or respirator, goggles or face shield, gloves</li><li>Doffing order: gloves, goggles, gown, mask outside the room, hand hygiene</li></ul></td></tr><tr><td><b>Respiratory hygiene and cough etiquette</b></td><td><ul class=\"cl\"><li>cover the mouth and nose, dispose of tissues, clean hands, mask the coughing patient, separate symptomatic patients by at least 1 meter, and use signage</li><li>Introduced after SARS</li></ul></td></tr><tr><td><b>Safe injection practices</b></td><td>one needle, one syringe, one time, never re-enter a vial</td></tr><tr><td><b>Safe handling of equipment, linen and sharps</b></td><td>engineered safety devices, no resheathing, immediate disposal in sharps containers</td></tr><tr><td><b>Workforce protection</b></td><td>immunization, fit testing, TB screening, exposure reporting and post-exposure prophylaxis, staying home when ill</td></tr></tbody></table></div><ul class=\"l1\"><li>What is <b>not</b> part of <b>standard precautions</b>: an <b>N95</b> respirator or negative-pressure room (<b>airborne</b>), <b>gown and gloves</b> on entry to every room (contact), routine antibiotic prophylaxis for staff, and isolation rooms.<ul class=\"l2\"><li>These are added by transmission-based precautions when the pathogen calls for them, and some organisms need two categories, such as <b>RSV</b> (contact plus droplet) and disseminated zoster (airborne plus contact).</li></ul></li></ul><h5>Resident and transient flora, the reasoning behind hand hygiene</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Resident flora</th><th>Transient flora</th></tr></thead><tbody><tr><td><b>Where</b></td><td>deep in the stratum corneum, hair follicles and glands</td><td>superficial, picked up from patients and surfaces</td></tr><tr><td><b>Effect of washing</b></td><td>only reduced by antiseptic scrubs with chlorhexidine or alcohol, never removed</td><td>removed by friction with soap and water or alcohol rub</td></tr><tr><td><b>Role</b></td><td>colonization resistance against pathogens, but can cause disease when a barrier is breached (E. coli urinary infection, S. epidermidis biofilm on valves and lines, viridans streptococci endocarditis, Candida after antibiotics)</td><td>survive minutes to hours and are the vehicle of healthcare-associated pathogens such as MRSA, C. difficile, respiratory and enteric viruses</td></tr></tbody></table></div><ul class=\"l1\"><li>Because <b>transient flora</b> is where the HAI pathogens live and it is easily removed, hand hygiene is the single <b>most effective</b> measure against healthcare-associated infection.</li></ul><p class=\"rsrc\">Source: MCB 2.09 III.A Standard Precaution, Hand Hygiene, PPE, Respiratory Hygiene, II.D Resident and Transient Flora</p>","2028-68":"<h5>What a healthcare-associated infection is</h5><ul class=\"l1\"><li>The CDC definition used in 2.09: an infection that occurs in a patient during the process of receiving healthcare that was <b>not present or incubating at the time of admission</b>.<ul class=\"l2\"><li>It includes infections that only become apparent after discharge and occupational infections in healthcare workers.</li></ul></li><li><b>The 48-hour convention</b><ul class=\"l2\"><li>Infections that begin <b>48 hours or more after admission</b>, or within 10 days of discharge, are counted as healthcare-associated</li><li>Infections that begin earlier were probably incubating at admission and are community-acquired</li><li>The cut-off approximates an incubation period, so it is checked against the suspected organism</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Healthcare-associated</th><th>Community-acquired</th></tr></thead><tbody><tr><td>acquired while receiving care for another condition</td><td>present or incubating on admission</td></tr><tr><td>caused by hospital flora that is often multidrug-resistant (MRSA, ESBL and carbapenemase producers, Acinetobacter, C. difficile)</td><td>usually drug-susceptible strains</td></tr><tr><td>the categories overlap in dialysis, nursing-home and outpatient-infusion patients who carry hospital organisms</td><td></td></tr></tbody></table></div><ul class=\"l1\"><li><b>Burden</b><ul class=\"l2\"><li>About <b>1 in 10</b> hospital admissions develops an HAI</li><li>The risk of sepsis in HAI is 23.5%</li><li>HAIs drive antimicrobial resistance, mortality, longer stays and cost</li><li>US point prevalence fell from 1 in 31 patients (2015) to 1 in 38 (2023), which shows that prevention works</li></ul></li><li><b>Types of HAI</b><ul class=\"l2\"><li><b>Device-associated:</b><ul class=\"l3\"><li>Surgical site infection</li><li>Catheter-associated urinary tract infection</li><li>Ventilator-associated pneumonia</li><li>Central-line-associated bloodstream infection</li></ul></li><li>Not device-related, the <b>majority (more than 60%)</b>:<ul class=\"l3\"><li>Non-ventilator hospital-acquired pneumonia, now the largest single category</li><li><b>C. difficile</b> infection</li><li><b>Norovirus</b> and <b>rotavirus</b> gastroenteritis</li><li>Pressure-ulcer infections</li><li><b>Adenovirus</b> keratoconjunctivitis from tonometers</li></ul></li></ul></li><li>Patient safety in the trans is defined as the absence of preventable harm to a patient during healthcare, and the guiding principle is primum non nocere.</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.A Definition, II.B Burden, II.C Types of HAIs</p>","2028-69":"<h5>The sites and organisms of healthcare-associated infection</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Type</th><th>Leading organisms</th><th>Notes from the trans</th></tr></thead><tbody><tr><td><b>Catheter-associated urinary tract infection</b></td><td><b>Escherichia coli</b> <b>most common</b>, then Klebsiella, Proteus, Enterococcus, Pseudomonas aeruginosa and Candida</td><td>the urinary tract is classically the <b>most common</b> site of HAI, and the risk rises with every catheter-day</td></tr><tr><td><b>Ventilator-associated pneumonia and non-ventilator hospital-acquired pneumonia</b></td><td><ul class=\"cl\"><li><b>Pseudomonas aeruginosa</b> is the <b>most common</b> cause of VAP, Staphylococcus aureus including MRSA is second, then Acinetobacter, Klebsiella and Enterobacter</li><li>Non-ventilator pneumonia follows aspiration of oral flora</li></ul></td><td>pneumonia has become the largest HAI category in recent surveys, and most of it is not ventilator-related</td></tr><tr><td><b>Surgical site infection</b></td><td>S. aureus (from nasal carriers), coagulase-negative staphylococci, E. coli, Enterococcus, anaerobes</td><td>counted up to 30 days after surgery, or 90 days with an implant</td></tr><tr><td><b>Central-line-associated bloodstream infection</b></td><td>coagulase-negative staphylococci, S. aureus, Enterococcus, Candida, Klebsiella</td><td>skin flora entering along the catheter</td></tr><tr><td><b>C. difficile infection</b></td><td>C. difficile spores</td><td>antibiotic-driven, contact precautions with soap and water</td></tr><tr><td><b>Gastroenteritis outbreaks</b></td><td>norovirus, rotavirus</td><td>proton-pump inhibitors predispose, contact precautions</td></tr><tr><td><b>Skin and pressure-ulcer infection</b></td><td>S. aureus, streptococci, anaerobes</td><td>bedbound patients</td></tr><tr><td><b>Eye</b></td><td>adenovirus</td><td>fomites such as tonometers</td></tr></tbody></table></div><ul class=\"l1\"><li>The 2028 key names the urinary tract as the <b>most common</b> site, which is the classical answer.<ul class=\"l2\"><li>The same lecture notes that pneumonia is now the largest category, so know both statements and read the question's wording.</li></ul></li></ul><h5>Risk factors from 2.09</h5><ul class=\"l1\"><li><b>Host:</b><ul class=\"l2\"><li>Extremes of age</li><li>Immunosuppression</li><li>Diabetes</li><li>Malnutrition</li><li>Obesity</li><li>Breaks in the skin and mucosal barriers (burns, wounds, pressure ulcers, mucositis)</li><li>Colonization with a multidrug-resistant organism</li></ul></li><li><b>Therapy:</b><ul class=\"l2\"><li>Broad-spectrum antibiotics that select resistant organisms and <b>C. difficile</b></li><li>Proton-pump inhibitors</li><li>Biologics</li><li>Prolonged therapy</li></ul></li><li><b>Devices:</b><ul class=\"l2\"><li>Urinary catheters</li><li>Central and arterial lines</li><li>Ventilators</li><li>Surgery</li><li>Drains</li><li>Dialysis</li><li>Parenteral nutrition</li><li>Reprocessed endoscopes</li></ul></li><li><b>Institution:</b><ul class=\"l2\"><li>Long stay</li><li>ICU</li><li>Understaffing and crowding</li><li>Hand-hygiene compliance around 50%</li><li>Poor cleaning</li><li>A previous room occupant with an MDRO</li><li>Construction (<b>Aspergillus</b>)</li><li>Water systems (Legionella, Pseudomonas)</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C Types of HAIs, II.E Risk Factors</p>","2028-70":"<h5>Nosocomial pneumonia</h5><ul class=\"l1\"><li><b>Pseudomonas aeruginosa is the </b>most common<b> cause of ventilator-associated pneumonia</b>, with <b>Staphylococcus aureus</b> including <b>MRSA</b> in second place, followed by Acinetobacter, Klebsiella and Enterobacter.</li><li>Non-ventilator hospital-acquired pneumonia is now the largest HAI category.<ul class=\"l2\"><li>It follows aspiration of oral flora in elderly, bedbound, sedated or poorly mobilized patients, and its organisms are <b>S. aureus</b> and gram-negative rods.</li><li>Oral care and early mobilization prevent it.</li></ul></li><li><b>Pseudomonas ecology</b><ul class=\"l2\"><li>Lives in moist reservoirs such as sinks, water systems and tanks</li><li>Survives on surfaces</li><li>Intrinsically resistant to many antibiotics</li><li>Compare Acinetobacter (survives dry ICU surfaces) and Klebsiella (survives up to 600 days)</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Setting</th><th>Typical pneumonia organisms</th></tr></thead><tbody><tr><td><b>Community-acquired</b></td><td>Streptococcus pneumoniae, Haemophilus influenzae, Mycoplasma, respiratory viruses</td></tr><tr><td><b>After influenza (2.04)</b></td><td>S. aureus, S. pneumoniae, H. influenzae invading the damaged mucosa</td></tr><tr><td><b>Hospital-acquired and ventilator-associated</b></td><td><b>P. aeruginosa</b>, MRSA, Acinetobacter, Klebsiella, Enterobacter</td></tr><tr><td><b>Immunocompromised</b></td><td>Pneumocystis when CD4 is under 200, Aspergillus in neutropenia, CMV in transplant recipients, Legionella from water systems</td></tr><tr><td><b>Bone-marrow transplant with construction nearby</b></td><td>Aspergillus spores, hence positive-pressure protective rooms</td></tr></tbody></table></div><ul class=\"l1\"><li>The distinction matters because the organisms and therefore the empiric antibiotics differ, and because hospital organisms are multidrug-resistant.</li><li><b>Prevention</b><ul class=\"l2\"><li>Hand hygiene</li><li>Elevation of the head of the bed</li><li>Oral care</li><li>Daily sedation holidays and extubation assessment</li><li>Insertion bundles for the device-related fraction, remembering that bundles help only the minority of HAIs that involve a device</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C.01 Device-associated HAIs, II.C.02 Non-device-associated HAIs</p>","2028-72":"<h5>The 48-hour convention</h5><ul class=\"l1\"><li>Healthcare-associated infections develop <b>48 hours or more after admission</b>, and may also appear within 10 days after discharge.<ul class=\"l2\"><li>They were not present or incubating at the time of admission.</li></ul></li><li>An infection that appears within the first 24 to <b>48 hours</b> was probably incubating on arrival and is classified as community-acquired.</li><li>It is a convention rather than a biological law.<ul class=\"l2\"><li>It approximates a typical incubation period, and <b>exceptions</b> counted as HAI beyond the window include surgical site infections up to 30 days (90 days with an implant) and <b>C. difficile</b> infection that appears weeks after discharge.</li><li>Always check the incubation period of the organism you suspect.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Timeframe</th><th>Classification</th></tr></thead><tbody><tr><td>under 48 hours after admission</td><td>community-acquired</td></tr><tr><td>48 hours or more aft
