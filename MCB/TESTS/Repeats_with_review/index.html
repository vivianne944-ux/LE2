er admission</td><td>healthcare-associated</td></tr><tr><td>up to 10 days after discharge</td><td>healthcare-associated</td></tr><tr><td>up to 30 days after surgery, 90 days with an implant</td><td>surgical site infection</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Related terms</b><ul class=\"l2\"><li>Nosocomial means hospital-acquired and is one kind of HAI</li><li>HAI also covers nursing homes, dialysis units and outpatient clinics</li><li>Occupational infection in healthcare workers is counted as HAI too</li></ul></li><li>The definition drives surveillance and reporting, which is how the fall from 1 in 31 patients (2015) to 1 in 38 (2023) was measured.</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.A Definition, II.B The 48-hour Convention</p>","2028-74":"<h5>The single biggest risk factor for catheter-associated urinary tract infection</h5><ul class=\"l1\"><li><b>Duration of catheterization is the </b>single most important<b> risk factor.</b><ul class=\"l2\"><li>The risk of infection rises with every day the catheter stays in, so the key preventive measures are a daily review of whether it is still needed and removal at the earliest opportunity.</li></ul></li><li>Organisms are <b>E. coli</b> <b>most commonly</b>, then Klebsiella, Proteus, Enterococcus, <b>Pseudomonas aeruginosa</b> and <b>Candida</b>.</li></ul><h5>The device-associated risk factors as 2.09 lists them</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Device</th><th>Infection</th></tr></thead><tbody><tr><td><b>Urinary catheter</b></td><td>CAUTI, rising with duration</td></tr><tr><td><b>Central venous and arterial catheters</b></td><td>CLABSI</td></tr><tr><td><b>Endotracheal tube and mechanical ventilation</b></td><td>VAP</td></tr><tr><td><b>Surgery, drains, dialysis, parenteral nutrition</b></td><td>SSI, bloodstream infection</td></tr><tr><td><b>Reprocessed endoscopes</b></td><td>transmission of MDROs</td></tr></tbody></table></div><h5>Host, therapeutic and institutional risk factors</h5><ul class=\"l1\"><li><b>Host</b><ul class=\"l2\"><li>Extremes of age</li><li>Immunosuppression</li><li>Diabetes, malnutrition, obesity</li><li>Loss of skin or mucosal barriers from burns, wounds, pressure ulcers or mucositis</li><li>Colonization with a multidrug-resistant organism</li></ul></li><li><b>Therapy:</b><ul class=\"l2\"><li>Broad-spectrum antibiotics that select MDROs and <b>C. difficile</b></li><li>Proton-pump inhibitors</li><li>Biologics</li><li>Prolonged treatment</li></ul></li><li><b>Institution:</b><ul class=\"l2\"><li>Long or ICU stay</li><li>Understaffing</li><li>Crowding</li><li>Hand-hygiene compliance around 50% at baseline</li><li>Poor cleaning</li><li>A prior room occupant with an MDRO</li><li>Construction dust</li><li>Water systems</li></ul></li><li>Insertion bundles address only the roughly 39% of HAIs that involve a device.<ul class=\"l2\"><li>Hand hygiene, oral care, mobilization and environmental cleaning act on the majority that do not.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C Types of HAIs, II.E Risk Factors, Formative quiz question 5</p>","2028-76":"<h5>A urinary infection three days after catheterization</h5><ul class=\"l1\"><li>Three days is beyond the 48-hour threshold, so the infection is healthcare-associated, and the most likely organism in catheter-associated urinary tract infection is <b>Escherichia coli</b>, followed by Klebsiella, Proteus, Enterococcus, <b>Pseudomonas aeruginosa</b> and <b>Candida</b>.</li><li><b>Mechanism:</b> <b>E. coli</b> is resident gut flora that migrates along the outside or inside of the catheter.<ul class=\"l2\"><li>The catheter breaches the urethral barrier, gives the bacteria a surface for <b>biofilm</b>, and interferes with the flushing action of normal voiding.</li><li>Each catheter-day adds risk.</li></ul></li><li>This is the 2.09 principle that <b>resident flora</b> becomes pathogenic when it crosses a barrier: E. coli causes UTI and peritonitis, Staphylococcus epidermidis forms biofilm on prosthetic valves and lines, viridans streptococci cause endocarditis, and Candida overgrows after broad-spectrum antibiotics.</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Healthcare-associated infection</th><th>Number one organism</th></tr></thead><tbody><tr><td><b>Catheter-associated urinary tract infection</b></td><td>E. coli</td></tr><tr><td><b>Ventilator-associated pneumonia</b></td><td>P. aeruginosa, with MRSA second</td></tr><tr><td><b>Central-line-associated bloodstream infection</b></td><td>coagulase-negative staphylococci</td></tr><tr><td><b>Surgical site infection</b></td><td>S. aureus</td></tr><tr><td><b>Antibiotic-associated colitis</b></td><td>C. difficile</td></tr><tr><td><b>Ward gastroenteritis outbreak</b></td><td>norovirus and rotavirus</td></tr><tr><td><b>Keratoconjunctivitis from tonometers</b></td><td>adenovirus</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Prevention:</b><ul class=\"l2\"><li>Avoid unnecessary catheters</li><li>Aseptic insertion</li><li>A closed drainage system</li><li>Daily review for removal</li><li>Hand hygiene before and after handling the system</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.09 II.C.01 CAUTI, II.D Resident Flora</p>","2028-77":"<h5>Why MRSA matters in healthcare</h5><ul class=\"l1\"><li>Its significance is <b>resistance to multiple antibiotics</b>, including methicillin and every beta-lactam and often other classes as well, which limits treatment options, worsens outcomes, lengthens stays, and allows spread within and between facilities.</li><li><b>Where it lives:</b> <b>MRSA</b> is a <b>transient flora</b> organism carried on hands and surfaces, and 2.09 names it with <b>C. difficile</b> and the respiratory and enteric viruses as the <b>most common</b> transient HAI pathogens.<ul class=\"l2\"><li>About 20 to 30% of people are persistent nasal carriers of <b>Staphylococcus aureus</b>, and a surgeon touching the nose can seed a surgical site.</li></ul></li><li><b>Its roles:</b> the number one surgical site pathogen, the number two ventilator-associated pneumonia pathogen after Pseudomonas, a cause of central-line infections, skin and soft-tissue infections and pressure-ulcer infections.<ul class=\"l2\"><li>Its danger to staff is through contact, not droplets.</li></ul></li><li><b>Control:</b> direct and indirect contact transmission means <b>contact precautions with gown and gloves on entry</b>, dedicated equipment, and hand hygiene.<ul class=\"l2\"><li>Alcohol rub works because MRSA is not a spore.</li><li><b>S. aureus</b> survives on dry surfaces for months, and persists longer when dry, so daily and terminal cleaning matter.</li></ul></li></ul><h5>The multidrug-resistant organisms of 2.09</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Organism</th><th>Notes</th></tr></thead><tbody><tr><td><b>MRSA</b></td><td>gram-positive, contact precautions, nasal carriage</td></tr><tr><td><b>Vancomycin-resistant Enterococcus</b></td><td>gram-positive, survives months on surfaces, contact</td></tr><tr><td><b>ESBL-producing and carbapenem-resistant Enterobacterales (Klebsiella, E. coli)</b></td><td>gram-negative, Klebsiella survives up to 600 days</td></tr><tr><td><b>Acinetobacter baumannii</b></td><td>survives dry ICU surfaces, contact</td></tr><tr><td><b>Pseudomonas aeruginosa</b></td><td>intrinsically resistant, moist reservoirs</td></tr><tr><td><b>Candida auris</b></td><td>multidrug-resistant yeast, hospital surfaces for months, contact</td></tr><tr><td><b>C. difficile</b></td><td>not an MDRO in the same sense but antibiotic-driven and spore-forming</td></tr></tbody></table></div><ul class=\"l1\"><li>Colonization with an MDRO, a prior room occupant with an MDRO, and broad-spectrum antibiotic exposure are all listed risk factors for HAI.</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.D Transient Flora, II.E Risk Factors, II.F Contact Transmission, III.B.01 Contact Precaution, Survival of HAI Pathogens</p>","2028-78":"<h5>Surgical asepsis and the other levels of cleanliness</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Term</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td><b>Cleaning or sanitation</b></td><td>removal of soil and reduction of microbial numbers</td><td>washing a surface</td></tr><tr><td><b>Disinfection</b></td><td>killing most vegetative organisms on inanimate objects, not spores</td><td>hypochlorite on bed rails</td></tr><tr><td><b>Antisepsis</b></td><td>reducing microbes on living tissue, which only reduces resident flora and never eliminates it</td><td>chlorhexidine or alcohol hand scrub</td></tr><tr><td><b>Sterilization</b></td><td>destruction of all microbes including spores</td><td>autoclaved surgical instruments</td></tr><tr><td><b>Medical or clean asepsis</b></td><td>reducing the number and transfer of organisms</td><td>standard precautions, hand hygiene, clean gloves</td></tr><tr><td><b>Surgical or sterile asepsis</b></td><td>keeping an area <b>free of all microorganisms</b> through a surgical scrub, sterile gown and gloves, a sterile field and sterile instruments</td><td>the preparation for a coronary bypass in the vignette</td></tr></tbody></table></div><ul class=\"l1\"><li>The 3-minute <b>chlorhexidine</b> scrub to the elbows targets <b>resident flora</b>, which lives deep in the stratum corneum, hair follicles and glands and cannot be removed by ordinary washing, only reduced by antiseptic scrubs.<ul class=\"l2\"><li>Sterile <b>gown and gloves</b> then keep <b>transient flora</b> off the field.</li><li>Skin itself is disinfected, never sterilized, which is why the hierarchy runs sanitation, disinfection, sterilization.</li></ul></li><li><b>PPE donning order:</b> hand hygiene, gown, mask or respirator, goggles or face shield, gloves.<ul class=\"l2\"><li><b>Doffing order:</b><ul class=\"l3\"><li>Gloves</li><li>Goggles</li><li>Gown</li><li>Mask after leaving the room</li><li>Hand hygiene</li></ul></li></ul></li><li>Surgical site infection organisms are <b>S. aureus</b> from nasal carriers, coagulase-negative staphylococci, <b>E. coli</b>, Enterococcus and anaerobes, and the infection counts as healthcare-associated for 30 days after surgery or 90 days with an implant.</li></ul><p class=\"rsrc\">Source: MCB 2.09 II.D Resident Flora, III.A.02 Personal Protective Equipment, II.C.01 Surgical Site Infection</p>","AVIAN":"<h5>Avian influenza</h5><ul class=\"l1\"><li>Also called bird flu or fowl plague, it is caused by influenza <b>A</b> subtypes that naturally infect wild birds, waterfowl and poultry.<ul class=\"l2\"><li>Humans are infected occasionally through direct or indirect contact with infected poultry, and human-to-human transmission is very rare. \"Highly pathogenic\" describes genetic traits that cause lethal outbreaks in poultry.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>A(H5N1)</th><th>A(H7N9)</th><th>A(H5N6)</th><th>Pandemic A(H1N1)pdm09</th></tr></thead><tbody><tr><td><b>First appearance</b></td><td>Hong Kong 1997 in a 3-year-old, from the A/Goose/Guangdong/1/96 lineage</td><td>Eastern China 2013 in an 87-year-old, a quadruple reassortant of Eurasian avian viruses</td><td><b>Philippines 2017</b>, Pampanga and Nueva Ecija, with 37,000 birds dead and 600,000 culled, no human case</td><td>2009, the first pandemic of the 21st century, from bird, human and swine reassortment</td></tr><tr><td><b>Age affected</b></td><td>children and young adults</td><td>older adults, median 61, 71% male</td><td>poultry only</td><td>children and young adults, 87% of deaths under 65</td></tr><tr><td><b>Severity</b></td><td>case fatality 48 to 59%, 66% in the Western Pacific, severe pneumonia</td><td>severe, and hard to track because it causes only low pathogenicity in poultry so culling is delayed</td><td></td><td>usually mild, case fatality 0.02%, viral pneumonitis or secondary bacterial pneumonia</td></tr><tr><td><b>Why severe but poorly transmissible</b></td><td><b>tropism for α2,3 sialic acid receptors that sit in the lower respiratory tract</b>, so it causes deep pneumonia but is not easily shed from the upper airway</td><td></td><td></td><td></td></tr></tbody></table></div><ul class=\"l1\"><li>Drivers of spread are bird migration, the poultry trade and illegal bird transport.<ul class=\"l2\"><li>In 2026 H5N9 was found in Oriental Mindoro.</li></ul></li><li>Pandemic potential requires either adaptation of the <b>HA</b> from α2,3 (avian) to α2,6 (human) receptors, or <b>reassortment</b> in <b>pigs</b>, which carry both receptor types, producing <b>antigenic shift</b> (2.04).</li><li><b>Prevention</b><ul class=\"l2\"><li>Avoid contact with sick or dead birds and their droppings</li><li>Wash hands</li><li>PPE for handling and culling</li><li>No home slaughter of live chickens</li><li>Cook poultry and eggs thoroughly</li><li>Pandemic response adds surveillance, isolation, school closure, a monovalent vaccine and <b>neuraminidase</b> inhibitors</li></ul></li></ul><h5>The emerging respiratory zoonoses compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Animal source</th><th>Receptor</th><th>Human-to-human spread</th></tr></thead><tbody><tr><td><b>Avian influenza H5N1</b></td><td>poultry and wild birds</td><td>α2,3 sialic acid in the lower airway</td><td>very rare</td></tr><tr><td><b>SARS-CoV</b></td><td>bats through civets</td><td>ACE2</td><td>yes</td></tr><tr><td><b>MERS-CoV</b></td><td>bats through dromedary camels</td><td>DPP4</td><td>limited</td></tr><tr><td><b>SARS-CoV-2</b></td><td>bats, possibly pangolins</td><td>ACE2 with TMPRSS2</td><td>efficient</td></tr><tr><td><b>Nipah</b></td><td>fruit bats through pigs and horses</td><td></td><td>yes, through body fluids</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.10 III.A Avian Influenza, Appendix comparison of H5N1, H7N9 and H1N1</p>","CVDPV":"<h5>Circulating vaccine-derived poliovirus</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Category</th><th>Meaning</th></tr></thead><tbody><tr><td><b>Wild poliovirus</b></td><td><ul class=\"cl\"><li>the naturally occurring types 1, 2 and 3</li><li>Type 2 was eradicated in 1999, type 3 has not been detected since 2012, and type 1 causes all current wild cases in Afghanistan and Pakistan</li></ul></td></tr><tr><td><b>Sabin or Sabin-like virus</b></td><td>the live attenuated strain in the oral vaccine, shed in stool after vaccination and minimally diverged from the vaccine</td></tr><tr><td><b>Vaccine-derived poliovirus</b></td><td>a Sabin virus that has mutated during prolonged replication, more than 1% divergence for types 1 and 3 and more than 0.6% for type 2, and regained neurovirulence</td></tr><tr><td><b>Circulating vaccine-derived poliovirus</b></td><td>a vaccine-derived virus with evidence of <b>person-to-person transmission in the community</b>, detected in people or the environment</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Type 2 causes 86% of cVDPV</b> (type 1 causes 13% and type 3 about 1%), which is why type 2 was removed from <b>OPV</b> in 2015 in the switch from trivalent to bivalent vaccine.<ul class=\"l2\"><li><b>IPV</b> still contains all three types and cannot revert.</li></ul></li></ul><h5>How a vaccine virus turns dangerous</h5><ol class=\"l1\"><li>The oral vaccine virus replicates in the intestine of the vaccinated child, which is what produces gut immunity and herd protection.</li><li>In an under-immunized community the virus keeps passing from child to child instead of being stopped by immune contacts.</li><li>The error-prone RNA polymerase introduces about one mutation per genome copy and the virus recombines with other enteroviruses.</li><li>Over months the attenuating mutations are lost, neurovirulence returns, and the virus causes paralysis identical to wild polio.</li></ol><h5>The Philippine timeline</h5><ul class=\"l1\"><li>Declared polio-free in 2000.<ul class=\"l2\"><li>In July 2019 vaccine-derived type 1 was found in Manila Bay sewage.</li><li>On September 14, 2019 a confirmed <b>cVDPV2</b> case with acute flaccid paralysis was reported from Lanao del Sur, and the outbreak was declared on September 19.</li><li>Cases were mostly cVDPV2 in Mindanao, Laguna, Quezon City and Nueva Ecija.</li><li>The outbreak was declared over on June 11, 2021.</li></ul></li><li>The response was acute flaccid paralysis surveillance, supplementary immunization through Sabayang Patak Kontra Polio for all children under 5 regardless of status, environmental monitoring, and risk communication.</li><li>The 2026 Philippine schedule gives <b>OPV</b> at 6, 10 and 14 weeks and <b>IPV</b> at 14 weeks and 9 months.<ul class=\"l2\"><li>OPV is cheaper, so the transition to IPV is slow.</li></ul></li><li>Eradication means permanent reduction to zero worldwide, elimination means zero in a defined area, and <b>cVDPV</b> shows how quickly elimination is lost when coverage falls.</li></ul><p class=\"rsrc\">Source: MCB 2.10 II.D Polio, Tables 7 to 10, MCB 2.03 I Poliovirus Epidemiology</p>","PERT":"<h5>Why pertussis came back</h5><ul class=\"l1\"><li>The re-emergence is multifactorial.<ul class=\"l2\"><li>The trans lists better diagnosis (awareness, surveillance and <b>PCR</b>), microbial adaptation of circulating strains, <b>vaccine characteristics, in particular waning immunity after the acellular vaccine</b> that replaced the whole-cell vaccine because of reactogenicity, vaccine refusal driven by safety fears, and coverage gaps and schedules.</li><li>The Philippines gives only the primary doses with no boosters, and DPT3 coverage was 71%.</li></ul></li><li><b>Philippine data:</b> low stable counts until 2017, a spike in 2018 to 2019, and a massive surge that peaked in 2024 at more than 800 cases.<ul class=\"l2\"><li>Diphtheria also spiked in 2024.</li></ul></li><li><b>Herd immunity:</b> pertussis has an R0 of 5 to 17 and a threshold of 92 to 94%, and a child is fully immunized only after all three doses.</li></ul><h5>The four reasons vaccine-preventable diseases re-emerge</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Factor</th><th>Example</th></tr></thead><tbody><tr><td><b>Failure to vaccinate (health-system failure)</b></td><td>missed opportunities, interruption of services during the pandemic, low DPT3 coverage</td></tr><tr><td><b>Refusal or deferral</b></td><td>vaccine hesitancy after the Dengvaxia controversy</td></tr><tr><td><b>Vaccine failure or waning immunity</b></td><td>acellular pertussis</td></tr><tr><td><b>Pathogen escape</b></td><td>pneumococcal serotype replacement and capsular switching after conjugate vaccines</td></tr></tbody></table></div><h5>The other re-emerging vaccine-preventable diseases in 2.10</h5><ul class=\"l1\"><li><b>Measles:</b> target coverage 95% because of its R0 of 12 to 18.<ul class=\"l2\"><li>MCV1 introduced in 1982 and MCV2 in 2009, coverage sits at 70 to 80%, so susceptibles accumulate and outbreaks recur in cycles.</li></ul></li><li><b>Diphtheria:</b> re-emerges when immunization programs are interrupted, spiked in 2024.</li><li><b>Polio:</b> <b>cVDPV</b> in under-immunized communities, 2019 to 2021 outbreak.</li><li>In the hospital pertussis is a droplet-precaution pathogen, contagious until 5 days of macrolide therapy (2.09).</li></ul><p class=\"rsrc\">Source: MCB 2.10 II.B Pertussis, II.E Factors, Tables 2, 5 and 11</p>","VOC":"<h5>The WHO categories for SARS-CoV-2 variants</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Category</th><th>Definition in 2.10</th></tr></thead><tbody><tr><td><b>Variant under monitoring</b></td><td>genetic changes suspected to affect virus characteristics, with signals that it may pose a future risk and needs watching</td></tr><tr><td><b>Variant of interest</b></td><td>mutations predicted or known to affect transmissibility, severity, immune escape, diagnostics or treatment, with significant community transmission or clusters in several countries</td></tr><tr><td><b>Variant of concern</b></td><td>a variant of interest that has demonstrated <b>increased transmissibility</b>, increased virulence or clinical severity, or <b>decreased effectiveness of public-health measures, diagnostics, vaccines or treatments</b></td></tr></tbody></table></div><ul class=\"l1\"><li>Hundreds of variants have emerged because of <b>point mutations</b> from error-prone RNA replication.<ul class=\"l2\"><li>Mutations that stabilize the spike protein and improve binding to <b>ACE2</b> are selected, and this is the genetic and biologic driver of emergence that 2.10 lists alongside influenza mutation and drug resistance.</li></ul></li><li><b>Named variants of concern in these years:</b><ul class=\"l2\"><li>Alpha</li><li>Beta</li><li>Gamma</li><li>Delta</li><li>Omicron</li></ul></li></ul><h5>SARS-CoV-2 recap from 2.04</h5><ul class=\"l1\"><li>Betacoronavirus, enveloped, <b>helical</b> nucleocapsid, positive-sense RNA, the S protein binds <b>ACE2</b> with TMPRSS2, bats are the reservoir and pangolins the suspected intermediate.<ul class=\"l2\"><li>Severe disease is a <b>cytokine storm</b> with lymphopenia, neutrophilia, high D-dimer, ARDS and coagulopathy.</li><li>RT-qPCR of ORF1ab, N and E is the foundational test, with rapid antigen tests for screening.</li><li>In the hospital routine care is droplet, aerosol-generating procedures need <b>airborne</b> precautions (2.09).</li></ul></li></ul><h5>How other viruses generate variants, for contrast</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Mechanism</th><th>Consequence</th></tr></thead><tbody><tr><td><b>SARS-CoV-2</b></td><td>point mutation in spike</td><td>variants of interest and concern</td></tr><tr><td><b>Influenza</b></td><td>point mutation (drift) and reassortment (shift)</td><td>seasonal epidemics and pandemics</td></tr><tr><td><b>HIV</b></td><td>error-prone reverse transcriptase and recombination</td><td>quasispecies, drug resistance, <b>no vaccine</b></td></tr><tr><td><b>Poliovirus</b></td><td>point mutation and recombination in the gut</td><td>vaccine-derived poliovirus</td></tr><tr><td><b>Chikungunya</b></td><td>a single E1 mutation (A226V)</td><td>better fitness in Aedes albopictus and wider spread</td></tr><tr><td><b>Mpox</b></td><td>genetic evolution toward human-to-human spread</td><td>the 2022 clade IIb outbreak</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Definitions:</b><ul class=\"l2\"><li>An emerging disease has newly appeared or is rapidly rising in incidence or range</li><li>A re-emerging disease was previously controlled and is rising again</li><li>About 75% of emerging infections are <b>zoonotic</b></li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.10 Abbreviations, I.C Genetic and Biologic Factors, MCB 2.04 C Coronaviridae</p>","2028-90":"<h5>Mpox and the 2022 global outbreak</h5><ul class=\"l1\"><li><b>Mpox</b> is caused by an orthopoxvirus (<b>Poxviridae</b>), an enveloped double-stranded DNA virus that replicates in the <b>cytoplasm</b>, in the same genus as <b>variola</b>, <b>vaccinia</b> and cowpox.</li><li><b>History</b><ul class=\"l2\"><li>Isolated from monkeys in Copenhagen in 1958</li><li>First human case in the DRC in 1970</li><li>Endemic in West and Central Africa</li><li>A 2003 outbreak in the United States from prairie dogs</li><li><b>First reports outside Africa, in Europe, in May 2022</b></li><li><b>Declared a public health emergency of international concern on July 23, 2022</b></li><li>91,123 cases by September 2023</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Clade</th><th>Notes</th></tr></thead><tbody><tr><td><b>Clade I (Congo Basin)</b></td><td>more severe, with subclades Ia and Ib, Ib spreading beyond Africa since August 2024</td></tr><tr><td><b>Clade II (West African)</b></td><td>milder with lower fatality, and <b>clade IIb caused the 2022 global outbreak</b></td></tr></tbody></table></div><ul class=\"l1\"><li><b>The 2022 pattern:</b> <b>mainly sexually transmitted (88%)</b>, 87% in men who have sex with men, rash in 91%, genital rash in 52%, fever in 49%, lymphadenopathy in 26%, case fatality 0.3%.<ul class=\"l2\"><li>The Philippines recorded 287 cases and 6 deaths, mostly males aged 20 to 59, 95% without travel history meaning community transmission, and 24% living with <b>HIV</b>.</li></ul></li><li><b>Transmission:</b> direct contact with the rash or body fluids, close respiratory secretions, fomites, and transplacental spread.<ul class=\"l2\"><li>It is not readily transmitted by droplets or air.</li></ul></li><li><b>Why it emerged:</b> deforestation, hunting and human movement, <b>waning smallpox-vaccine immunity</b> after vaccination stopped in 1980 to 1982 (the smallpox vaccine is about 85% protective and the unvaccinated make up 80 to 96% of cases), and genetic evolution toward human-to-human transmission.</li><li>Distinguishing clinical feature from smallpox and chickenpox (2.02): prominent cervical and submandibular lymphadenopathy.</li><li><b>Diagnosis:</b> lesion scrapings sent to the DOH for <b>PCR</b> or antigen detection in the acute stage, and <b>IgM</b> from day 4 to 56 during recovery.</li><li>Treatment is supportive.<ul class=\"l2\"><li>Severe cases and high-risk groups (immunocompromised, children under 8, pregnant women, atopic dermatitis) may receive <b>tecovirimat</b>, cidofovir, brincidofovir or vaccinia immune globulin.</li><li>Prevention is avoiding contact with infected animals, people, fomites and anonymous sexual contact, PPE with gown, gloves, mask and eye protection, and a vaccine used only in outbreaks and not locally registered.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.10 V Mpox Virus, Table 18, MCB 2.02 II.B Mpox</p>","2028-98":"<h5>When isolation for Mpox ends</h5><ul class=\"l1\"><li><b>Isolation is discontinued only after all lesions have crusted</b>, the scabs have fallen off and a fresh layer of skin has formed.<ul class=\"l2\"><li>The patient is infectious from the onset of the rash through the vesicular and pustular stages because lesion material carries the virus.</li></ul></li><li>Poxvirus lesions progress through macule, papule, vesicle, pustule and crust, all in the same stage of development, unlike chickenpox which comes in crops.</li><li><b>Infection control:</b> single room, disposable gown, gloves, face mask and eye protection, contact plus <b>droplet precautions</b>, hand washing, and lesion specimens for <b>PCR</b>.<ul class=\"l2\"><li>Complications affect about 1 in 5 patients (secondary bacterial infection, encephalitis, sepsis, hemorrhagic or confluent lesions) and are criteria for hospital admission.</li></ul></li></ul><h5>Infectious periods and end-points across the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Infectious period or end-point</th></tr></thead><tbody><tr><td><b>Mpox</b></td><td>until all lesions have crusted</td></tr><tr><td><b>Varicella</b></td><td>shortly before the rash until all lesions are crusted, airborne plus contact</td></tr><tr><td><b>Smallpox</b></td><td><b>most infectious</b> in the first week of the rash, airborne</td></tr><tr><td><b>Measles</b></td><td>prodrome to 2 to 5 days after the rash, airborne</td></tr><tr><td><b>Rubella</b></td><td>1 week before to 1 week after the rash, droplet</td></tr><tr><td><b>Mumps</b></td><td>3 days before to 9 days after gland swelling, droplet for 5 days after onset of parotitis</td></tr><tr><td><b>Parvovirus B19</b></td><td>during viremia before the rash, no longer infectious once the slapped cheek appears</td></tr><tr><td><b>Pertussis</b></td><td>droplet until 5 days of macrolide therapy</td></tr><tr><td><b>Meningococcus and group A streptococcus</b></td><td>droplet until 24 hours of effective therapy</td></tr><tr><td><b>Hepatitis A</b></td><td><b>most infectious</b> in the 2 weeks before jaundice</td></tr><tr><td><b>Poliovirus and enteroviruses</b></td><td>stool shedding for weeks</td></tr><tr><td><b>Norovirus</b></td><td>shedding up to 1 month, contact</td></tr><tr><td><b>Rotavirus</b></td><td>shedding 2 to 12 days, contact</td></tr><tr><td><b>Rabies animal</b></td><td>saliva infectious 3 to 5 days before symptoms, hence the 10-day observation</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.10 V.F Mpox Prevention and Control, MCB 2.02 II.B Poxviridae, MCB 2.09 Table 1</p>","2028-99":"<h5>The epidemiology of emerging and re-emerging infections</h5><ul class=\"l1\"><li>An emerging infectious disease is one that has newly appeared in a population or is rapidly increasing in incidence or geographic range: SARS in 2003, pandemic H1N1 in 2009, MERS in 2012, H7N9 in 2013, COVID-19 in 2019, <b>Mpox</b> in 2022.<ul class=\"l2\"><li>A re-emerging disease was previously controlled and is rising again: pertussis, <b>measles</b>, diphtheria, polio (<b>cVDPV</b>), tuberculosis, malaria, <b>yellow fever</b>, <b>rabies</b>, cryptosporidiosis and schistosomiasis.</li></ul></li><li><b>About 75% of the emerging infections of the last three decades are zoonotic</b>, arising in animals and crossing the species barrier because of increased human-animal contact through bushmeat, exotic pets (tortoises and Salmonella), wet markets, farming near bats (<b>Nipah</b>), and poultry (H5N1).</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Group of contributing factors</th><th>Examples from 2.10</th></tr></thead><tbody><tr><td><b>Human behaviour and demographics</b></td><td>travel and commerce, technology and industry, breakdown of public health measures, poverty and social inequality, war and famine, lack of political will, intent to harm</td></tr><tr><td><b>Physical and environmental</b></td><td>changes in land use, urbanization, environmental degradation</td></tr><tr><td><b>Ecological</b></td><td>ecosystem succession, climate change, dam building (schistosomiasis)</td></tr><tr><td><b>Genetic and biological</b></td><td>microbial adaptation (pertussis strains, influenza and coronavirus mutation, antimicrobial resistance), and host susceptibility: CCR5 alleles protect against HIV, hemoglobin S and thalassemia against malaria, Duffy-negative blood against Plasmodium vivax, blood group O predisposes to severe cholera, HLA alleles shape susceptibility to tuberculosis and leprosy</td></tr></tbody></table></div><ul class=\"l1\"><li>Re-emergence of vaccine-preventable disease is multifactorial: health-system failure to vaccinate, refusal and deferral, waning or failed vaccine immunity, and pathogen escape.</li><li><b>Herd immunity thresholds rise with R0:</b><ul class=\"l2\"><li>Measles 92 to 94%</li><li>Pertussis 92 to 94%</li><li>Polio 50 to 95%</li><li>Influenza 30 to 77%</li></ul></li><li><b>Successes to remember:</b><ul class=\"l2\"><li>Smallpox eradicated in 1980</li><li>Polio and diphtheria reduced by 100% in the United States</li><li>The Philippines declared polio-free in 2000 (before the 2019 setback)</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.10 I Introduction A to C, Tables 1 to 3, II.A Vaccine-Preventable Diseases</p>"}};

function famBody(f){
 let h=`<div class="hbar"><button type="button" class="rvall">Reveal all answers in this family</button><span>Answers are hidden. Click Show on a question, or click any blurred box, to see it.</span></div><div class="rule cz"><i>Master Rule</i>${esc(f.rule)}</div>`;
 if(f.pat)h+=`<div class="pat cz"><i>Examiner Pattern</i>${esc(f.pat)}</div>`;
 if(f.flag)h+=`<div class="warn cz">${esc(f.flag)}</div>`;
 h+=`<div class="tw"><table class="ft hasrev"><thead><tr><th>Source</th><th>Question and Complete Choices</th><th>Key</th><th>Choice-by-Choice Rationale</th><th class="revh">Lecture Review (from the trans)</th></tr></thead><tbody>`;
 f.qs.forEach((id,ix)=>{const q=Q[id];
  h+=`<tr class="qa"><td class="src">${q.y} Q${esc(q.n)}<small>PDF page ${q.p}</small></td><td><p class="stem">${esc(q.s)}</p>${choicesHTML(q)}</td><td class="keyc">${keyHTML(q)}<button type="button" class="rv1" data-r="Show" data-h="Hide">Show</button></td><td class="ratc"><div class="ratin">${ratHTML(q)}${notesHTML(q)}</div></td>${ix===0?`<td class="revc" rowspan="${f.qs.length}"><div class="rev cz">${REV[f.id]||"<p class=\"inf\">No review available.</p>"}</div></td>`:""}</tr>`});
 return h+`</tbody></table></div>`}
function revBlock(q){
 let rv=null,lab="";
 if(REV[q.id]){rv=REV[q.id];lab="Lecture review for this question"}
 else if(q.f&&REV[q.f]){rv=REV[q.f];lab=`Lecture review for its repeat family: ${esc(FBY[q.f].title)}`}
 if(!rv)return "";
 return `<div class="revwrap"><div class="revlab">${lab}</div><div class="rev">${rv}</div></div>`}
function bankBody(q){
 let h=`<div class="qa"><div class="qnote">${notesHTML(q)}</div>`;
 h+=`<div class="qwrap"><div><p class="stem"><b>${esc(q.s)}</b></p>${choicesHTML(q)}<p class="reflink">Printed key: <span class="pk">${hasKey(q)?esc(q.k):"none"}</span> · PDF page ${q.p}</p><button type="button" class="rv1" data-r="Reveal answer" data-h="Hide answer">Reveal answer</button></div><div class="ratc"><div class="ratin">${ratHTML(q)}</div></div></div>`;
 if(q.f){const f=FBY[q.f];h+=`<div class="inf qnote">Part of repeat family: <b>${esc(f.title)}</b> (${f.n} appearances, ${f.years.join(", ")}).</div>`}
 h+=revBlock(q);
 return h+`</div>`}
function famVisible(f){return (S.tab==="all"||f.cat===S.tab)&&f.years.some(y=>S.years.has(y))&&S.topics.has(f.t)}
function qVisible(q){return S.years.has(q.y)&&S.topics.has(q.t)}
function cardHTML(key,head,body){const o=S.open.has(key);
 return `<div class="card ${o?"open":""}" data-k="${key}"><button type="button" class="ch" aria-expanded="${o}"><span class="car">▶</span><span class="ttl">${head}</span></button><div class="body">${o?body():""}</div></div>`}
function render(){
 const m=$("main");let h="",n=0,label="";
 if(S.tab==="radar"){
  h=`<p class="subt" style="margin:4px 0 10px">Every concept seen in more than one paper, with its coverage in this build. Rows with a lighter edge are two-year concepts. Click a row with coverage to filter to its topic.</p><div class="tw"><table class="rad"><thead><tr><th>Years</th><th>Concept</th><th>Source lecture</th><th>Count</th><th>Coverage in this build</th></tr></thead><tbody>`;
  RADAR.forEach((r,i)=>{const two=r.years.length===2;
   h+=`<tr class="${r.go?"go":"inert"} ${two?"two":""}" data-i="${i}"><td>${r.years.join(", ")}</td><td>${esc(r.name)}</td><td>${esc(T[r.t])}</td><td><span class="ny">${r.years.length}</span></td><td>${esc(r.status)}</td></tr>`});
  h+=`</tbody></table></div>`;n=RADAR.length;label="concepts";
 }else if(S.tab==="bank"){
  DATA.BANKYEARS.forEach(y=>{const qs=BANK.map(id=>Q[id]).filter(q=>q.y===y&&qVisible(q));
   if(!S.years.has(y))return;
   h+=`<div class="yh">${y}<span>${qs.length} question${qs.length!==1?"s":""} shown</span></div>`;
   qs.forEach(q=>{n++;h+=cardHTML("q:"+q.id,`<b>${q.y} Q${esc(q.n)} <span class="q">${esc(q.s.length>150?q.s.slice(0,150)+"…":q.s)}</span></b><span class="meta">${tbadge(q.t)}${q.f?`<span class="bd cat">repeat family</span>`:""}${q.w.length?`<span class="bd flag">flagged</span>`:""}</span>`,()=>bankBody(q))})});
  if(!n)h+=`<div class="empty">No bank questions match the current filters. The bank holds 2028 and 2027 only.</div>`;label="questions";
 }else{
  FAM.filter(famVisible).forEach(f=>{n++;
   h+=cardHTML("f:"+f.id,`<b class="ftitle">${esc(f.title)}</b><span class="meta"><span class="bd cnt">${f.n}×</span>${f.years.map(y=>`<span class="bd yr">${y}</span>`).join("")}${f.dy?`<span class="bd">${esc(f.dy)}</span>`:""}<span class="bd cat">${esc(CAT[f.cat])}</span>${tbadge(f.t)}${f.flag?`<span class="bd flag">discrepancy</span>`:""}</span>`,()=>famBody(f))});
  if(!n)h=`<div class="empty">No families match the current filters.</div>`;label="families";
 }
 m.innerHTML=h;$("count").textContent=n+" "+label+" shown";syncTog();
}
function bodyFor(key){return key[0]==="f"?famBody(FBY[key.slice(2)]):bankBody(Q[key.slice(2)])}
function setOpen(card,o){const k=card.dataset.k;card.classList.toggle("open",o);card.querySelector(".ch").setAttribute("aria-expanded",o);
 const b=card.querySelector(".body");if(o){S.open.add(k);if(!b.innerHTML)b.innerHTML=bodyFor(k)}else S.open.delete(k)}
function syncTog(){const cs=[...document.querySelectorAll("#main .card")];const t=$("tog");
 t.disabled=!cs.length;t.style.opacity=cs.length?1:.5;
 t.textContent=cs.length&&cs.every(c=>c.classList.contains("open"))?"Collapse All":"Expand All"}
$("main").addEventListener("click",e=>{
 const rb=e.target.closest(".rv1");if(rb){const qa=rb.closest(".qa");const s=qa.classList.toggle("shown");rb.textContent=s?rb.dataset.h:rb.dataset.r;return}
 const ra=e.target.closest(".rvall");if(ra){const card=ra.closest(".card");const s=!card.classList.contains("tshown");card.classList.toggle("tshown",s);
  card.querySelectorAll(".qa,.cz").forEach(x=>x.classList.toggle("shown",s));card.querySelectorAll(".rv1").forEach(b=>b.textContent=s?b.dataset.h:b.dataset.r);
  ra.textContent=s?"Hide all answers in this family":"Reveal all answers in this family";return}
 if(document.body.classList.contains("hideans")){
  const cz=e.target.closest(".cz:not(.shown)");if(cz){cz.classList.add("shown");return}
  const rc=e.target.closest(".ratc,.revwrap,.pk,.qnote");if(rc){const qa=rc.closest(".qa:not(.shown)");if(qa){qa.classList.add("shown");const b=qa.querySelector(".rv1");if(b)b.textContent=b.dataset.h;return}}}
 const ch=e.target.closest(".ch");if(ch){const c=ch.parentNode;setOpen(c,!c.classList.contains("open"));syncTog();return}
 const tr=e.target.closest("tr.go");if(tr){const r=RADAR[+tr.dataset.i];
  S.topics=new Set([r.t]);S.years=new Set(YEARS);S.tab=r.go==="fam"?"all":"bank";buildFilters();buildTabs();render();window.scrollTo({top:$("main").offsetTop-120})}});
$("anstog").addEventListener("click",()=>{const on=document.body.classList.toggle("hideans");const b=$("anstog");b.textContent=on?"Show Answers":"Hide Answers";b.setAttribute("aria-pressed",on);
 document.querySelectorAll(".shown,.tshown").forEach(x=>x.classList.remove("shown","tshown"));
 document.querySelectorAll(".rv1").forEach(x=>x.textContent=x.dataset.r);document.querySelectorAll(".rvall").forEach(x=>x.textContent="Reveal all answers in this family")});
$("revtog").addEventListener("click",()=>{document.body.classList.toggle("norev");$("revtog").textContent=document.body.classList.contains("norev")?"Show Lecture Review":"Hide Lecture Review"});
$("tog").addEventListener("click",()=>{const cs=[...document.querySelectorAll("#main .card")];
 const open=!cs.every(c=>c.classList.contains("open"));cs.forEach(c=>setOpen(c,open));syncTog()});
function buildTabs(){
 const cnt={all:FAM.length,D:0,C:0,I:0,bank:BANK.length,radar:RADAR.length};FAM.forEach(f=>cnt[f.cat]++);
 $("tabs").innerHTML=TABS.map(([k,l])=>`<button type="button" class="tab" role="tab" data-t="${k}" aria-selected="${S.tab===k}">${esc(l)} <small>${cnt[k]}</small></button>`).join("")}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;S.tab=b.dataset.t;buildTabs();render()});
function buildMS(pop,btn,items,set,allLabel,noun){
 const all=items.every(([v])=>set.has(v));
 pop.innerHTML=`<label class="all"><input type="checkbox" data-v="__all" ${all?"checked":""}>${allLabel}</label>`+items.map(([v,l])=>`<label><input type="checkbox" data-v="${v}" ${set.has(v)?"checked":""}>${esc(l)}</label>`).join("");
 btn.textContent=all?allLabel:(set.size+" "+noun+(set.size!==1?"s":""))}
function buildFilters(){
 buildMS($("popY"),$("btnY"),YEARS.map(y=>[y,String(y)]),S.years,"All Years","year");
 buildMS($("popT"),$("btnT"),usedT.map(t=>[t,T[t]]),S.topics,"All Topics","topic")}
function wireMS(ms,pop,getSet,setSet,values,parse){
 ms.querySelector("button").addEventListener("click",e=>{e.stopPropagation();const o=ms.classList.contains("open");document.querySelectorAll(".ms").forEach(x=>x.classList.remove("open"));if(!o)ms.classList.add("open")});
 pop.addEventListener("click",e=>e.stopPropagation());
 pop.addEventListener("change",e=>{const v=e.target.dataset.v;let s=getSet();
  if(v==="__all"){s=new Set(values())}else{const pv=parse(v);if(e.target.checked)s.add(pv);else s.delete(pv)}
  setSet(s);buildFilters();render()})}
wireMS($("msY"),$("popY"),()=>S.years,s=>S.years=s,()=>YEARS,v=>+v);
wireMS($("msT"),$("popT"),()=>S.topics,s=>S.topics=s,()=>usedT,v=>v);
document.addEventListener("click",()=>document.querySelectorAll(".ms").forEach(x=>x.classList.remove("open")));
$("stats").innerHTML=STATS.map(([b,s])=>`<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
$("notebody").innerHTML=NOTE;
buildTabs();buildFilters();render();
</script>
</body></html>
