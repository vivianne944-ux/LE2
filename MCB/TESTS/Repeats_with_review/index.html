ead><tbody><tr><td>Nickname</td><td><b>swimming pool conjunctivitis</b></td><td>none</td></tr><tr><td>Types</td><td>3, 7</td><td>8, 19, 37</td></tr><tr><td>Who</td><td>school-age children (camps, family pools)</td><td>adults</td></tr><tr><td>Picture</td><td>fever + pharyngitis + nasal congestion + conjunctivitis; mild</td><td>red eye, tearing, foreign-body sensation → keratitis; serious, highly contagious</td></tr><tr><td>Source</td><td>chlorine-deficient pools</td><td>fomites: towels, sinks, eye drops, tonometers (survives weeks)</td></tr><tr><td>Course</td><td>1-2 wk, no sequelae</td><td>2 wk, corneal opacities up to 2 yr</td></tr></tbody></table></div><ul><li>Adenovirus basics: naked dsDNA icosahedral, 12 vertex fibers (type-specific antigen, hemagglutination, attachment), penton base with toxin-like activity; replicates in epithelium of respiratory tract, eye, GI, urinary tract; stays in regional nodes</li><li>Other syndromes: ARD in children (types 1,2,5), military recruits (4, 7; vaccine), pneumonia (3,7,21), infantile gastroenteritis (40, 41), hemorrhagic cystitis in boys, disseminated disease in transplants/AIDS</li><li>Immune evasion: VA RNA blocks IFN; E3 gp19 kDa hides MHC I from CTLs</li><li>Diagnosis: PCR test of choice; anti-hexon immunofluorescence; CPE = grape-like clusters</li><li>Prevention: hand hygiene, bleach, single-use towels, <b>chlorinate pools</b>; treatment supportive</li></ul><p class=\"rsrc\">Source: MCB 2.02 I.B Adenoviridae, Table 5</p>","ADROUTE":"<h5>Adenovirus transmission (2.02)</h5><ul><li>Listed routes: <b>direct contact, fecal-oral, respiratory droplets, contaminated fomites, hand-to-eye, swimming pools</b></li><li>NOT listed and not a route: blood transfusion. The transfusion-transmitted DNA viruses in these lectures are <b>parvovirus B19</b> (blood products, clotting factors), <b>HBV</b>, <b>CMV</b> (leukocytes), HHV-8</li><li>Why so many routes: naked capsid → resistant to drying, detergents, gastric acid; survives weeks on surfaces</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Route</th><th>Adenovirus disease</th></tr></thead><tbody><tr><td>Droplet</td><td>febrile pharyngitis, ARD in recruits</td></tr><tr><td>Fecal-oral</td><td>gastroenteritis (types 40, 41)</td></tr><tr><td>Fomite / hand-to-eye</td><td>epidemic keratoconjunctivitis (8, 19, 37)</td></tr><tr><td>Pool water</td><td>pharyngoconjunctival fever (3, 7)</td></tr></tbody></table></div><ul><li>Compare envelope logic: enveloped viruses (HIV, HBV, herpes) travel by contact/parenteral/sexual routes; naked viruses tolerate the environment and the gut</li></ul><p class=\"rsrc\">Source: MCB 2.02 I.B Serotypes &amp; Transmission; MCB 2.01 Table 17</p>","HSV1KID":"<h5>Primary HSV-1: gingivostomatitis</h5><ul><li>Primary infection = no prior antibodies; usually <b>asymptomatic</b> but when symptomatic in a small child (1-5 y) = gingivostomatitis<ul><li>Incubation 3-5 d; illness 2-3 wk</li><li>Fever, sore throat, malaise, <b>vesicular and ulcerative lesions of buccal and gingival mucosa</b>; swollen tender gums = most striking sign</li></ul></li><li>Primary infection in adults: pharyngitis, tonsillitis</li><li>Recurrent HSV-1 = fever sores at the lip border, painful, crusting, heal without scar in 4-5 d; latency in <b>trigeminal ganglion</b></li><li>Newborns lose maternal antibody by 6 months; peak susceptibility to primary herpes = <b>6 months to 2 years</b></li></ul><h5>Mouth lesion differentials in a child</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Condition</th><th>Agent</th><th>Clue</th></tr></thead><tbody><tr><td>Herpetic gingivostomatitis</td><td>HSV-1</td><td>vesicles/ulcers on gums and buccal mucosa, swollen gums, fever</td></tr><tr><td>Herpangina</td><td>Coxsackie A</td><td>vesicles/ulcers on <b>posterior</b> oropharynx (soft palate, tonsils)</td></tr><tr><td>Hand-foot-mouth</td><td>Coxsackie A16, EV71</td><td>oral ulcers + vesicles on palms and soles; heal without crusting</td></tr><tr><td>Koplik spots</td><td>measles</td><td>bluish-white dots opposite lower molars, before rash</td></tr><tr><td>Thrush</td><td>Candida</td><td>white pseudomembrane that scrapes off; budding yeast + pseudohyphae</td></tr></tbody></table></div><ul><li>Diagnosis: PCR gold standard; Giemsa/Tzanck = multinucleated giant cells</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.A.1 Gingivostomatitis</p>","SMALLPOX":"<h5>Smallpox vaccine</h5><ul><li>The vaccine agent is <b>vaccinia virus</b>, a live orthopoxvirus that cross-protects against variola (and monkeypox: ~85% protective)</li><li>Jenner: milkmaids with cowpox were immune to smallpox</li><li>Protective if given within 3 days of exposure; immunity ≥5 years; prophylactic, not curative</li><li>Methisazone = historical antipoxvirus agent; cidofovir = experimental treatment</li></ul><h5>Variola facts</h5><ul><li>Eradicated <b>1980</b>; first viral disease eradicated; humans only host, no carrier state</li><li>Spread mainly by inhalation; infectious first week of rash</li><li>Incubation 10-14 d; fever 1-5 d → macules → papules → vesicles → pustules, <b>all lesions in the same stage</b> (chickenpox = crops, mixed stages, more on face)</li><li>Types: variola minor, major, hemorrhagic, malignant (flat)</li><li>Diagnosis: PCR from skin lesion (specimen of choice); EM; pocks on CAM; antibody least important</li></ul><h5>Live vaccines in these lectures (compare)</h5><ul><li>Vaccinia (smallpox), Sabin OPV, MMR, varicella, zoster, rotavirus (RotaTeq, Rotarix), yellow fever 17D, nasal LAIV</li><li>Killed/inactivated: Salk IPV, HAV, HBV (recombinant subunit), injectable flu, rabies</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.B Smallpox, Treatment and Prevention</p>","B19ERY":"<h5>Tropism of parvovirus B19</h5><ul><li>Receptor = blood group <b>P antigen (globoside)</b> on mature RBC, <b>erythroid progenitors</b>, megakaryocytes, endothelium, placenta, fetal liver/heart</li><li>Only primary erythroid progenitors are permissive → almost impossible to culture</li></ul><p class=\"mech\"><i>Mechanism</i>virus enters by endocytosis → uncoated in nucleus → waits (cannot force S phase) → host enters S phase → viral DNA synthesized → capsids assembled in nucleus → cell lysis. Replication kills the erythroblast → erythrocyte maturation arrest → erythroblast intranuclear inclusions</p><ul><li>Consequence table</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Normal marrow reserve</th><th>Reduced/none</th></tr></thead><tbody><tr><td>Healthy child: fifth disease, transient drop unnoticed</td><td>Sickle cell/thalassemia: aplastic crisis</td></tr><tr><td></td><td>Immunocompromised: pure red cell aplasia, chronic anemia</td></tr><tr><td></td><td>Fetus: severe anemia → hydrops fetalis</td></tr></tbody></table></div><ul><li>Baltimore II: (+) ssDNA → forms ds replicative intermediate → mRNA → protein (no negative-strand DNA viruses exist)</li><li>Other tropism pairs to keep straight: EBV → C3d (CD21) on B cells; HHV-6 → CD46; HIV → CD4 + CCR5/CXCR4; polio → PVR/CD155; rabies → nicotinic ACh receptor; SARS-CoV-2 → ACE2; MERS → DPP4</li></ul><p class=\"rsrc\">Source: MCB 2.02 I.A Tropism, Receptors &amp; Pathogenesis</p>","HPV":"<h5>HPV types</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Types</th><th>Risk</th><th>Lesion</th></tr></thead><tbody><tr><td>1, 2, 4, 7</td><td>benign</td><td>common, plantar, flat warts</td></tr><tr><td>5, 8</td><td>rare</td><td>epidermodysplasia verruciformis → SCC on sun-exposed skin</td></tr><tr><td>6, 11</td><td>low-risk mucosal</td><td>90% of anogenital warts (condyloma acuminata), laryngeal papillomas (acquired at birth)</td></tr><tr><td><b>16, 18</b></td><td><b>high-risk</b></td><td>&gt;70% of cervical cancer (16 most common), vulvar, penile, anal, oropharyngeal (16)</td></tr><tr><td>31, 33, 45, 56</td><td>high-risk, moderate</td><td></td></tr><tr><td>13, 32</td><td></td><td>oral papillomas</td></tr></tbody></table></div><ul><li>&gt;99% of cervical cancers and &gt;80% of anal cancers are HPV-linked; ~25% mouth and 35% throat cancers</li></ul><p class=\"mech\"><i>Mechanism</i>persistent high-risk infection (necessary prerequisite) → <b>E6 degrades p53</b>, <b>E7 binds pRb</b> (releases E2F) → apoptosis blocked, cell cycle unregulated, chromosomal instability → years to decades → carcinoma. Episomal DNA in benign lesions; <b>integrated</b> DNA in cancer cells</p><ul><li>Virus: naked, circular dsDNA, icosahedral; replicates in basal stem cells; virions assembled and shed only in terminally differentiated superficial keratinocytes → cannot be cultured; nonlytic → evades immunity</li><li>Screening: <b>Pap smear regularly regardless of vaccination</b>; HPV DNA testing (PCR/hybridization), not routine &lt;20 y because most infections clear in 2-3 y</li><li>Vaccines: bivalent (16,18), quadrivalent Gardasil (6,11,16,18), 9-valent (adds 31,33,45,52,58); prophylactic only, both sexes</li><li>Warts: imiquimod, podofilox, sinecatechins, cryotherapy, TCA; recurrence common (virus persists in basal cells); interferon for laryngeal papillomas</li></ul><p class=\"rsrc\">Source: MCB 2.02 I.C Papillomaviridae; MCB 2.06 VI.C</p>","2028-11":"<h5>HBV transmission</h5><ul><li>HBV is present in <b>all body fluids</b> of an infected person: <b>blood, semen, saliva, breast milk</b>, vaginal secretions</li><li>Routes: parenteral (transfusion, needles, dialysis, tattooing/piercing, needlestick), sexual, <b>perinatal</b> (mother to infant; the main route in high-prevalence areas and the one most likely to become chronic)</li><li>High-risk groups: IV drug users, institutionalized, healthcare workers, multiply transfused, transplant, hemodialysis, promiscuous, newborns of HBsAg+ mothers</li><li>Stability: survives drying a week at 25°C, 37°C for 60 min; killed by 100°C 1 min or 0.5% hypochlorite in 3 min; HBsAg not destroyed by UV</li></ul><h5>Occupational needlestick risk (2.06 / 2.09)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Risk per percutaneous exposure</th></tr></thead><tbody><tr><td>HBV</td><td><b>6-30%</b> (highest)</td></tr><tr><td>HCV</td><td>~1.8%</td></tr><tr><td>HIV</td><td>~0.3% (mucous membrane 0.09%)</td></tr></tbody></table></div><ul><li>Bloodborne group (2.04): HBV, HCV, HDV, HIV-1/2, HTLV-1/2</li><li>Prevention: universal precautions (treat all blood/fluids as infectious), gloves, no resheathing, bleach; <b>vaccine = most effective measure</b>; screen all pregnant women; HBIG + vaccine to exposed infants</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.C HBV Pathology, Prevention; MCB 2.06 Occupational exposure</p>","NORO":"<h5>Norovirus (Caliciviridae) vs Rotavirus (Reoviridae)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Norovirus / Norwalk</th><th>Rotavirus</th></tr></thead><tbody><tr><td>Family / genome</td><td>Caliciviridae; naked, (+)ssRNA, non-segmented, cup-shaped (calyx) capsid of single VP1</td><td>Reoviridae; naked, <b>dsRNA, 11 segments</b>, triple-layered capsid</td></tr><tr><td>Who</td><td><b>adults</b>, epidemics in closed settings: <b>cruise ships</b>, nursing homes, schools, shelters</td><td>infants and children &lt;5 (90% seropositive by age 3)</td></tr><tr><td>Onset</td><td>24-48 h incubation; <b>sudden vomiting</b> + watery diarrhea, low fever, cramps; 12-60 h</td><td>1-3 d incubation; watery diarrhea, vomiting, fever → dehydration</td></tr><tr><td>Infectious dose</td><td>as few as 10 particles; shedding up to 1 month; survives 60°C, mild chlorine, steamed oysters</td><td>10^12 particles/g stool; shedding 2-12 d</td></tr><tr><td>Transmission</td><td>fecal-oral, food (shellfish, handlers), water, person-to-person, fomites, <b>aerosolized vomitus</b></td><td>fecal-oral, nosocomial</td></tr><tr><td>Diagnosis</td><td><b>RT-PCR = gold standard</b> (stool, vomitus, food, water); EM low sensitivity; serology research only</td><td>stool EIA for VP6 antigen; rapid lateral-flow; PCR most sensitive but costly</td></tr><tr><td>Treatment</td><td>fluids/electrolytes</td><td>rehydration (oral or IV)</td></tr><tr><td>Prevention</td><td>hand washing, food handling, disinfection, safe water; <b>no vaccine</b></td><td>live oral vaccines RotaTeq (pentavalent), Rotarix (monovalent)</td></tr></tbody></table></div><ul><li>Mnemonic from trans: N-ausea/vomiting, O-utbreaks, R-apid onset &amp; recovery, O-ral-fecal</li><li>Genogroups GI, GII, GIV infect humans; GII.4 drives worldwide outbreaks; sapovirus = childhood gastroenteritis</li><li>Fixed distractors: poliovirus and coxsackie are picornaviruses (naked +RNA) but not diarrhea agents in these papers</li></ul><p class=\"rsrc\">Source: MCB 2.03 III Caliciviruses; II Reoviridae</p>","ROTADS":"<h5>The only dsRNA family: Reoviridae (Baltimore III)</h5><ul><li><b>Rotavirus</b> = dsRNA, <b>segmented (11 segments)</b>, naked, icosahedral, triple-layered capsid, 60-80 nm</li><li>Group III logic: the (+) strand of dsRNA is hydrogen-bonded to the (-) strand so it cannot act as mRNA → virus packs its own RNA-dependent RNA polymerase (VP1) = transcriptase and replicase</li></ul><p class=\"mech\"><i>Mechanism</i>VP4 spike attaches → partial uncoating in lysosome (outer VP4/VP7 removed, double-layered core stays) → VP1 transcribes capped mRNAs inside the core → export to cytoplasm → viroplasm replication factories → mRNA copied back to dsRNA → bud into ER (transient membrane) → membrane lost, VP4/VP7 added → lysis</p><ul><li>Segmented genome → <b>reassortment</b> during co-infection (human-animal strains) = genetic shift; basis of the human-bovine reassortant vaccine</li></ul><h5>Genome quick table</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Genome</th><th>Families</th></tr></thead><tbody><tr><td>dsRNA</td><td><b>Reoviridae</b> only (Picobirnaviridae)</td></tr><tr><td>(+)ssRNA</td><td>Picorna, Calici, Hepe, Astro, Corona, Toga, Flavi</td></tr><tr><td>(-)ssRNA</td><td>Orthomyxo, Paramyxo, Rhabdo, Filo, Arena, Bunya, Borna</td></tr><tr><td>ssRNA-RT</td><td>Retroviridae</td></tr><tr><td>Segmented RNA (B-O-A-R)</td><td>Bunya (3), Orthomyxo (8), Arena (2), Reo (10-12)</td></tr><tr><td>ssDNA</td><td>Parvoviridae only</td></tr><tr><td>dsDNA-RT (gapped)</td><td>Hepadnaviridae</td></tr></tbody></table></div><ul><li>Antigens: VP6 = group antigen (ELISA target); VP7 = G type; VP4 = P type (neutralizing)</li><li>Pathogenesis: villus cells of small intestine; <b>NSP4 enterotoxin</b> inhibits SGLT1 → secretory diarrhea; villus destruction → malabsorption</li></ul><p class=\"rsrc\">Source: MCB 2.03 II Reoviridae; MCB 2.01 Group III, Table 9</p>","POLIO":"<h5>Poliovirus pathogenesis</h5><ul><li>Picornaviridae, genus Enterovirus; small (27-30 nm), <b>naked, icosahedral, (+)ssRNA</b>; acid-stable, ether-resistant; killed by heat 55°C/30 min and chlorine</li><li>3 antigenic types; <b>type 1 most paralytic</b>; no cross-protection; humans only reservoir</li><li>Receptor: <b>PVR = CD155</b>, a primate-specific receptor (absence = resistance)</li></ul><p class=\"mech\"><i>Mechanism</i>ingested → multiplies in oropharynx (tonsils) and Peyer's patches → lymph nodes → minor then major viremia → CNS via blood or peripheral nerve axons → replicates in and lyses <b>anterior horn motor neurons</b> (lower motor neurons) → denervated muscle wastes. Virus does NOT multiply in muscle</p><ul><li>Clinical spectrum: 95% no illness; ~4% minor (abortive); 1% major = nonparalytic (aseptic meningitis) or paralytic</li><li>Paralytic polio = <b>asymmetric flaccid paralysis</b> (usually legs), hypotonia, areflexia, no sensory loss; bulbar form hits medulla → phrenic/intercostal/CN 9,10,12 → respiratory paralysis (iron lung)</li><li>Post-polio syndrome: 25-35 y later, not reactivation but late failure of axonal sprouts</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Motor neuron lesion</th><th>Sign</th><th>Virus</th></tr></thead><tbody><tr><td>Lower (anterior horn)</td><td>flaccid, hypotonia, areflexia</td><td>poliovirus, EV71, JE (polio-like), WNV, paralytic rabies</td></tr><tr><td>Upper</td><td>spastic, hyperreflexia</td><td>coxsackie in mice; SSPE late</td></tr></tbody></table></div><ul><li>Diagnosis: stool (longest yield), throat swab early, rarely CSF; RT-PCR rapid; CSF = lymphocytic pleocytosis, normal glucose; MRI anterior horn</li><li>Immunity type-specific lifelong; maternal antibody protects to 6 months; antibody in blood does not help once virus is in brain</li></ul><p class=\"rsrc\">Source: MCB 2.03 I Poliovirus, Table 4, 5</p>","COXA":"<h5>Coxsackie A vs B (Picornaviridae, genus Enterovirus)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Group A \"Above the neck\"</th><th>Group B \"Below the neck / body\"</th></tr></thead><tbody><tr><td><b>Herpangina</b>: abrupt fever, sore throat, discrete vesicles/ulcers on posterior palate, pharynx, tonsils (vs strep = exudate)</td><td><b>Pleurodynia</b> (Bornholm): fever, stabbing chest pain, 2 d - 2 wk</td></tr><tr><td><b>Hand-foot-mouth</b>: A16 (also EV71); oral ulcers + vesicles on palms/soles on erythematous base; heal WITHOUT crusting (unlike herpes/pox)</td><td><b>Myocarditis/pericarditis</b>: most common viral heart disease; fatal in neonates; enters via CAR receptor</td></tr><tr><td>Acute hemorrhagic conjunctivitis (A24; classically EV70)</td><td>Generalized neonatal disease (heart, liver, brain)</td></tr></tbody></table></div><ul><li>Both: aseptic meningitis (all B, many A), febrile illness, respiratory, non-paralytic</li><li>Transmission fecal-oral + respiratory; virus in blood early, throat a few days, <b>stool 5-6 weeks</b>; summer/early fall; incubation 2-9 d</li><li>Diagnosis: <b>RT-PCR method of choice</b>; culture 5-14 d; specimens throat, stool, vesicle fluid, conjunctiva, CSF</li><li>No vaccine, no antiviral; hygiene</li></ul><h5>Family placement (why \"Picornaviridae\" is the answer)</h5><ul><li>Picorna = pico (small) RNA; genera Enterovirus (polio, coxsackie, echo, EV70/71, rhino), Hepatovirus (HAV), Parechovirus (former echo 22/23; \"red angry baby\")</li><li>Enterovirus vs rhinovirus: 37°C and acid-stable vs 33°C and acid-labile</li></ul><p class=\"rsrc\">Source: MCB 2.03 I Coxsackieviruses, Table 9</p>","EV70":"<h5>Acute hemorrhagic conjunctivitis</h5><ul><li>Classic agent: <b>Enterovirus 70</b> (pandemics 1969-71); variant <b>coxsackie A24</b> also</li><li>Highly contagious; virus infects conjunctival epithelium → <b>sudden painful red eye, subconjunctival hemorrhage</b>, edema, intense inflammation; self-limited 5-7 (up to 10) days</li><li>Part of coxsackie A \"Triple H\": Hand-foot-mouth, Herpangina, hemorrhagic conjunctivitis</li></ul><h5>Conjunctivitis differentials in these lectures</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Agent</th><th>Picture</th></tr></thead><tbody><tr><td>EV70 / CVA24</td><td>painful, hemorrhagic, sudden, epidemic</td></tr><tr><td>Adenovirus 3, 7</td><td>pharyngoconjunctival fever after swimming pools, mild</td></tr><tr><td>Adenovirus 8, 19, 37</td><td>epidemic keratoconjunctivitis, fomites/tonometers, corneal opacities</td></tr><tr><td>HSV</td><td>dendritic keratitis, corneal ulcer, eyelid vesicles, recurrent</td></tr><tr><td>Measles</td><td>prodromal red eyes + photophobia</td></tr><tr><td>Zika</td><td>non-purulent conjunctivitis with rash and arthralgia</td></tr><tr><td>Dengue</td><td>conjunctival injection with retro-orbital headache</td></tr></tbody></table></div><ul><li>Echoviruses (Enteric Cytopathogenic Human Orphan): aseptic meningitis, febrile rash, resemble coxsackie/EV70; EV71 = severe HFMD + CNS disease</li><li>Diagnosis: conjunctival swab, RT-PCR</li></ul><p class=\"rsrc\">Source: MCB 2.03 I Coxsackie A, Echoviruses (Table 13)</p>","PICOCYTO":"<h5>Site of replication rule</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Genome</th><th>Site</th><th>Exceptions</th></tr></thead><tbody><tr><td>RNA viruses</td><td><b>cytoplasm</b></td><td>Orthomyxoviridae (influenza, needs nuclear splicing/capping), Retroviridae (HIV/HTLV integrate; HBV)</td></tr><tr><td>DNA viruses</td><td>nucleus</td><td>Poxviridae (cytoplasm, own enzymes)</td></tr></tbody></table></div><ul><li>Picornavirus cycle (all cytoplasmic, 5-10 h): receptor binding (PVR polio, CAR coxsackie B, DAF echo, ICAM-1/LDLR rhino) → RNA released → translated as <b>one polyprotein</b> → viral proteases cleave to VP0/VP1/VP3 + replication proteins → viral RdRp makes (-) strand template → new (+) genomes → encapsidation, VP0 → VP2 + VP4 → lysis</li><li>(+)ssRNA genome is directly infectious (acts as mRNA); 5' VPg primer, 3' poly-A tail</li><li>Cytoplasmic inclusion bodies are the visible marker of RNA-virus replication (paramyxo acidophilic cytoplasmic inclusions; Negri bodies of rabies); measles is the odd paramyxovirus that also makes intranuclear inclusions</li></ul><p class=\"rsrc\">Source: MCB 2.03 I Replication cycle, Table 3; MCB 2.01 Synthesis</p>","ROTAPREV":"<h5>Rotavirus control</h5><ul><li>Transmission is <b>fecal-oral</b> (nosocomial spread common); winter peak; leading cause of gastroenteritis &lt;5 y; up to 1 million child deaths/yr</li><li>Prevention hierarchy from the trans: <b>vaccines = best control strategy worldwide</b>; sanitation and hand hygiene for day-to-day; maternal antibody protects &lt;6 months</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Vaccine</th><th>Type</th><th>Note</th></tr></thead><tbody><tr><td>RotaShield (1998)</td><td>rhesus-based</td><td><b>withdrawn 1999: intussusception</b></td></tr><tr><td>RotaTeq</td><td>live attenuated, oral, pentavalent human-bovine reassortant</td><td>safe, effective</td></tr><tr><td>Rotarix</td><td>live attenuated, oral, monovalent human</td><td>safe, effective</td></tr></tbody></table></div><ul><li>Treatment is only supportive: oral/IV rehydration and electrolytes (no antiviral)</li><li>Rotavirus is naked → resists alcohol; in the ward this means <b>contact precautions + soap-and-water + hypochlorite</b> (2.09)</li><li>Mnemonic: R-NA/Reo/dsRNA segmented, O-ral-fecal/Oral vaccine, T-oxin NSP4/Tiny people, A-cute diarrhea in infants</li></ul><p class=\"rsrc\">Source: MCB 2.03 II.A Rotavirus Treatment and Prevention, Table 16</p>","PICOVP":"<h5>Picornavirus capsid</h5><ul><li>Icosahedral shell of <b>60 subunits</b>, each with <b>four proteins VP1-VP4</b><ul><li>VP1, VP2, VP3 on the surface; <b>VP4 internal</b></li><li>VP1 and VP3 carry the neutralizing antibody sites</li><li>Junction of VP1-VP2-VP3 forms a surface <b>canyon</b>; the receptor-binding site sits deep inside and the canyon is too narrow for antibodies → receptor site protected from neutralization</li></ul></li><li>Maturation: VP0 cleaved → VP2 + VP4 gives infectious virion</li><li>Parechovirus contrast: only 3 capsid proteins because VP0 is not cleaved</li><li>Genome: (+)ssRNA 7-8 kb, non-segmented, infectious; VPg at 5', poly-A at 3'</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Capsid / structural protein trivia</th></tr></thead><tbody><tr><td>Picornavirus</td><td>VP1-VP4, canyon</td></tr><tr><td>Rotavirus</td><td>VP4 spike (P type), VP7 (G type), VP6 group antigen</td></tr><tr><td>Calicivirus</td><td>single VP1, cup-shaped</td></tr><tr><td>Adenovirus</td><td>hexon (largest), penton base, fibers at 12 vertices</td></tr><tr><td>Influenza</td><td>HA, NA, M2 in envelope; M1 matrix; NP + PA/PB1/PB2</td></tr><tr><td>Rabies</td><td>N, P, M, G, L</td></tr><tr><td>HIV</td><td>gp120 (SU), gp41 (TM), p24 core</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.03 I Picornavirus Properties, Table 2</p>","2028-20":"<h5>Where polio still is</h5><ul><li>The virus with <b>asymmetric flaccid paralysis</b> = poliovirus (anterior horn cell destruction)</li><li>Global eradication (WHO 1988): 350,000 cases → &lt;2000/yr; 99% drop; 2024: 99 cases</li><li>Polio-free regions: Americas 1994, Western Pacific 2000, Europe 2002</li><li>Wild type 2 eradicated 1999; wild type 3 not seen since Nov 2012; wild type 1 causes 100% of wild cases</li><li><b>Remaining endemic: Afghanistan and Pakistan</b> (Nigeria formerly listed; 2.03 still names it, 2.10 says two countries)</li><li>Philippines: polio-free 2000; <b>cVDPV2 outbreak Sept 2019 - June 2021</b> (Lanao del Sur AFP case; Mindanao, NCR, Luzon) due to low OPV coverage; response = Sabayang Patak Kontra Polio (OPV to all &lt;5 regardless of status)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Salk IPV</th><th>Sabin OPV</th></tr></thead><tbody><tr><td>killed, injected</td><td>live attenuated, oral</td></tr><tr><td>humoral IgG only; no gut immunity; still sheds</td><td>IgG + IgA gut immunity; interrupts transmission; herd effect via shedding</td></tr><tr><td>cannot revert</td><td>1 VAPP per 2 million; can become cVDPV; interference by other enteroviruses</td></tr><tr><td>all three types</td><td>bivalent since 2015 (type 2 removed)</td></tr></tbody></table></div><ul><li>PH schedule (2026 PPS): OPV 6, 10, 14 wk; IPV 14 wk and 9 mo</li></ul><p class=\"rsrc\">Source: MCB 2.03 Poliovirus Epidemiology; MCB 2.10 II.D Polio</p>","2028-23":"<h5>Rotavirus: why dehydration management is the treatment</h5><ul><li>Infection of small-intestine villus cells (not stomach/colon) → two mechanisms of diarrhea<ul><li><b>NSP4 viral enterotoxin</b> inhibits SGLT1 → Na+ and glucose stay in lumen → water follows = secretory diarrhea</li><li>villus destruction, replaced by immature crypt cells = malabsorption; villi recover in 3-8 wk</li></ul></li><li>Clinical: incubation 1-3 d; watery diarrhea, vomiting, fever, abdominal pain → <b>dehydration</b> is the killer (600,000+ child deaths/yr in developing countries)</li><li>Severe in infants and immunodeficient; mild in adults (group B = adult outbreaks)</li><li>Treatment = supportive only: <b>oral or IV rehydration, electrolytes</b>; no antiviral</li><li>Diagnosis: stool EIA for VP6, lateral-flow antigen, PCR</li></ul><h5>Diarrhea viruses compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Age</th><th>Setting</th></tr></thead><tbody><tr><td>Rotavirus</td><td>infants/young children</td><td>winter, nosocomial</td></tr><tr><td>Norovirus</td><td>adults, all ages</td><td>cruise ships, homes, schools</td></tr><tr><td>Adenovirus 40/41</td><td>young children</td><td>5-15% of viral gastroenteritis</td></tr><tr><td>Sapovirus</td><td>children</td><td>Sapporo-like</td></tr><tr><td>HAV</td><td>any</td><td>hepatitis, not diarrhea</td></tr></tbody></table></div><ul><li>HAV and rotavirus are both naked → fecal-oral, acid-stable; rhinovirus is the picornavirus that is acid-labile and stays in the nose</li></ul><p class=\"rsrc\">Source: MCB 2.03 II.A Rotavirus Pathogenesis, Clinical, Treatment</p>","2028-24":"<h5>Picornaviridae vs Reoviridae replication</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Picornaviridae</th><th>Reoviridae (rotavirus)</th></tr></thead><tbody><tr><td>Genome</td><td>(+)ssRNA, non-segmented; directly infectious</td><td>dsRNA, 11 segments; NOT infectious alone</td></tr><tr><td>Uncoating</td><td>complete: RNA released into cytosol</td><td><b>partial</b>: outer VP4/VP7 removed in lysosome, core stays intact and transcribes inside</td></tr><tr><td>First step</td><td>genome translated as one polyprotein</td><td>VP1 transcriptase makes capped mRNA inside the core</td></tr><tr><td>Polymerase</td><td>made after translation (RdRp)</td><td>packaged in the virion core</td></tr><tr><td>Replication site</td><td>cytoplasm</td><td>cytoplasm (viroplasm)</td></tr><tr><td>Assembly</td><td>encapsidation, VP0 → VP2+VP4</td><td>bud into ER, lose membrane, add outer capsid</td></tr><tr><td>Release</td><td>lysis</td><td>lysis</td></tr><tr><td>Reassortment</td><td>no (non-segmented)</td><td>yes (segmented)</td></tr></tbody></table></div><ul><li>Why partial uncoating: dsRNA would trigger host defenses and cannot be read as mRNA, so the double-layered core acts as a protected transcription machine</li><li>Both are naked → viropexis entry, lysis release, fecal-oral spread, acid- and ether-resistant</li></ul><p class=\"rsrc\">Source: MCB 2.03 Table 3 and Table 14</p>","2028-27":"<h5>RotaShield and intussusception</h5><ul><li><b>RotaShield</b> (1998), a rhesus-based live oral vaccine, was <b>withdrawn in 1999 because of intussusception</b> (telescoping of bowel)</li><li>Current vaccines are safe and effective: <b>RotaTeq</b> (pentavalent human-bovine reassortant) and <b>Rotarix</b> (monovalent human), both live attenuated oral</li><li>Why oral live vaccines: mimic natural fecal-oral infection → mucosal IgA in the gut (same logic as Sabin OPV vs Salk IPV)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Vaccine problem</th><th>Vaccine</th></tr></thead><tbody><tr><td>Intussusception</td><td>RotaShield</td></tr><tr><td>Vaccine-associated paralytic polio / cVDPV</td><td>Sabin OPV (type 2 = 86% of cVDPV)</td></tr><tr><td>Antibody-dependent enhancement in seronegatives</td><td>Dengvaxia (CYD-TDV), registration revoked in PH</td></tr><tr><td>Waning immunity, reactogenicity swap</td><td>acellular pertussis replaced whole-cell</td></tr><tr><td>Contraindicated &lt;9 mo, pregnancy, egg allergy, immunocompromised</td><td>yellow fever 17D</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.03 II.A Table 16; MCB 2.10 vaccines</p>","PIV":"<h5>Parainfluenza (Paramyxoviridae)</h5><ul><li>Replication in the immunocompetent host is <b>limited to respiratory epithelium</b>; viremia uncommon; can be just a common cold</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Type</th><th>Disease</th></tr></thead><tbody><tr><td>1 and 2</td><td><b>croup</b> (laryngotracheobronchitis) in 6-18 month olds: larynx/upper trachea swelling → barking cough worse at night</td></tr><tr><td>3</td><td>deeper: bronchiolitis and pneumonia in infants &lt;6 mo; most prevalent (antibodies by age 2)</td></tr><tr><td>4</td><td>mild; otitis media = most common complication overall</td></tr></tbody></table></div><ul><li>Types 1, 2, 3 are distinct serotypes with no cross-neutralization; maternal antibody does not prevent infection; reinfection common (secretory IgA protective but short-lived)</li><li>HN protein has neuraminidase (parainfluenza and mumps only among paramyxos); F protein must be cleaved F0 → F1 for fusion</li><li>Transmission direct contact / large droplets; school children, hospitals → <b>contact precautions</b> in 2.09</li><li>Diagnosis: RT-PCR of nasopharyngeal wash; immunofluorescence on exfoliated cells; paired sera (4-fold rise)</li><li>Parainfluenza is <b>not zoonotic</b> (strictly person-to-person), unlike Nipah/Hendra in the same family</li></ul><h5>Lower respiratory viruses in children</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Peak</th><th>Hallmark</th></tr></thead><tbody><tr><td>RSV</td><td>&lt;6 mo, Nov-Jan</td><td>bronchiolitis, ciliated-cell tropism</td></tr><tr><td>hMPV</td><td>6-12 mo, Feb-Apr</td><td>RSV-like, less bronchiolitis</td></tr><tr><td>PIV 1,2</td><td>6-18 mo</td><td>croup</td></tr><tr><td>PIV 3</td><td>&lt;6 mo</td><td>bronchiolitis/pneumonia</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 D.01 Human Parainfluenza Virus, Table 12</p>","SHIFT":"<h5>Antigenic shift vs drift</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Drift</th><th>Shift</th></tr></thead><tbody><tr><td>Change</td><td>gradual, minor</td><td>abrupt, major</td></tr><tr><td>Mechanism</td><td><b>point mutations</b> in HA/NA antigenic sites (error-prone RNA polymerase)</td><td><b>genetic reassortment</b> of the 8 RNA segments when two influenza A strains (human + avian/swine) co-infect one cell; also direct avian adaptation (α2,3 → α2,6 sialic acid) or re-emergence of old strain</td></tr><tr><td>Result</td><td>escape from existing antibody → seasonal epidemics</td><td>new HA/NA subtype → no population immunity → <b>pandemics</b></td></tr><tr><td>Which types</td><td>A, B, (C)</td><td><b>influenza A only</b></td></tr><tr><td>Examples</td><td>yearly vaccine update</td><td>1918 H1N1 (avian direct), 1957 H2N2 Asian, 1968 H3N2 Hong Kong, 2009 H1N1pdm</td></tr></tbody></table></div><ul><li>Why only influenza A: has many hosts (birds, pigs, humans, seals, horses), 18 HA and 11 NA subtypes; pigs carry both avian and human receptors = mixing vessel. Influenza B (human only) and C do not reassort with A because internal NP/M proteins have no cross-reactivity</li><li><b>Non-segmented viruses cannot reassort</b>: paramyxoviruses (parainfluenza, mumps, measles) are antigenically stable, single serotypes</li><li>Segmented RNA viruses B-O-A-R: Bunya 3, Orthomyxo 8, Arena 2, Reo 10-12</li><li>Nomenclature: A/host/place/strain/year (HxNy); human isolates omit host</li></ul><p class=\"rsrc\">Source: MCB 2.04 E Orthomyxoviridae, Table 19; MCB 2.01 Table 9</p>","CRS":"<h5>Congenital rubella syndrome</h5><ul><li>Rubella = Matonaviridae (ex-Togaviridae, genus Rubivirus); enveloped, icosahedral, (+)ssRNA, <b>one serotype</b>, NOT arthropod-borne</li></ul><p class=\"mech\"><i>Mechanism</i>maternal viremia → placenta → fetus → limited number of fetal cells infected → reduced growth rate → hypoplastic, deranged organogenesis → structural anomalies. Earlier = worse (1st trimester, during organogenesis); defects uncommon after 20 wk</p><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Classic triad</th><th>Details</th></tr></thead><tbody><tr><td>Congenital heart disease</td><td>PDA, ASD, VSD, peripheral pulmonary artery stenosis</td></tr><tr><td>Ocular defects</td><td>cataract, microphthalmia, glaucoma, retinitis</td></tr><tr><td>Hearing loss</td><td>sensorineural deafness</td></tr></tbody></table></div><ul><li>Also: microcephaly (not in triad), mental retardation, meningoencephalitis, progressive rubella panencephalitis, growth retardation, radiolucent bone disease, hepatosplenomegaly, thrombocytopenia/purpura (\"blueberry muffin\"), IDDM, thyroiditis</li><li><b>Diagnosis = infant rubella-specific IgM</b>: maternal IgM cannot cross the placenta, so infant IgM was made in utero; maternal IgG does cross and lasts ~6 months</li><li>TORCH group (2.02): Toxoplasma, Others (syphilis, HBV), Rubella, CMV, HSV; CMV is the most common intrauterine viral infection</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Congenital infection</th><th>Signature</th></tr></thead><tbody><tr><td>Rubella</td><td>triad above, 1st trimester worst</td></tr><tr><td>CMV</td><td>jaundice, petechiae, HSM, periventricular calcification, hearing loss, microcephaly</td></tr><tr><td>Zika</td><td>microcephaly, preterm, miscarriage</td></tr><tr><td>Parvovirus B19</td><td>hydrops fetalis</td></tr><tr><td>HSV</td><td>neonatal skin-eye-mouth, encephalitis, disseminated (80% mortality)</td></tr></tbody></table></div><ul><li>Prevention: live attenuated vaccine (single dose &gt;95%), MR/MMR/MMRV; PPS gives rubella at 9 months because maternal antibody lasts to 6 months</li></ul><p class=\"rsrc\">Source: MCB 2.04 B.02 Congenital Rubella Syndrome, Table 4, 5</p>","ONETYPE":"<h5>Single antigenic type → lifelong immunity</h5><ul><li>Paramyxoviridae are <b>monotypic and antigenically stable</b>: non-segmented genome (no reassortment) and glycoproteins that tolerate no substitutions (no drift)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Serotypes</th><th>Immunity after one infection</th></tr></thead><tbody><tr><td>Mumps</td><td>1</td><td>permanent; even subclinical infection immunizes; HN antibody correlates with immunity</td></tr><tr><td>Measles</td><td>1</td><td>lifelong; neutralizing antibody to H protein</td></tr><tr><td>Rubella</td><td>1</td><td>lifelong; IgG persists for life, IgM gone in 6 wk</td></tr><tr><td>Yellow fever</td><td>1</td><td>17D vaccine ≥30 y</td></tr><tr><td>West Nile</td><td>1</td><td>presumably permanent</td></tr><tr><td>HAV</td><td>1 (3 genotypes)</td><td>lifelong</td></tr><tr><td>Poliovirus</td><td>3</td><td>type-specific only</td></tr><tr><td>Parainfluenza</td><td>1, 2, 3 distinct</td><td>reinfection common</td></tr><tr><td>Dengue</td><td>4</td><td>serotype-specific; second serotype → ADE</td></tr><tr><td>Rhinovirus</td><td>150+</td><td>reinfection the rule</td></tr><tr><td>Influenza</td><td>A subtypes, drift</td><td>reinfection; yearly vaccine</td></tr></tbody></table></div><ul><li>Mumps details: incubation 14-18 d; shedding 3 d before to 9 d after parotid swelling; 1/3 subclinical; parotitis not obligatory; CNS 10-30% (aseptic meningitis); post-pubertal orchitis (unilateral); NP antibody appears first (3-7 d), HN antibody at 4 wk and persists</li><li>MMR = live attenuated → subclinical noncommunicable infection</li></ul><p class=\"rsrc\">Source: MCB 2.04 D.02 Mumps Immunity; Paramyxoviridae Genetic and Antigenic Stability</p>","DRIFT":"<h5>Consequence of antigenic drift</h5><p class=\"mech\"><i>Mechanism</i>error-prone RNA polymerase → <b>point mutations</b> in HA (and NA) antigenic regions → a single critical amino acid change lets the mutant escape antibodies focused on that region → mutant survives, multiplies, passes to the next person where different antibodies select again → yearly epidemics; vaccine must be reformulated annually</p><ul><li>Immune pressure in adults with wide antibody experience pushes the virus toward higher receptor affinity; in naive children affinity drifts down</li><li>What drift is NOT: no new subtype, no pandemic, no animal reassortment (those are shift)</li><li>Person with antibody to the original strain gets <b>milder</b> disease with the drifted strain; original antigenic sin = later responses reinforce the first subtype ever met</li><li>Internal proteins (NP, M) do not drift → basis of type A/B/C distinction and cross-reactive CTL responses</li></ul><h5>Immunity to influenza</h5><ul><li>HA antibody = main protection (blocks attachment); NA antibody also protective</li><li>Three types A, B, C are antigenically unrelated: no cross-protection</li><li>CTLs clear established infection; cross-reactive across subtypes</li><li>Vaccines: inactivated parenteral, intradermal quadrivalent, live attenuated nasal; yearly from 6 months</li></ul><p class=\"rsrc\">Source: MCB 2.04 E Antigenic Drift and Shift, Immunity</p>","FLUDEATH":"<h5>Effect of influenza on the host cell: death</h5><ul><li>Influenza infection = <b>lytic</b>: destroys the superficial mucosa of the respiratory tract but spares the basal layer; repair takes up to 1 month</li><li>Two killers of the cell: viral replication (shut-off of host synthesis) and <b>CD8+ CTLs</b> that recognise viral peptide/MHC-I and release granzymes and perforin</li><li>Damaged epithelium (loss of cilia, phagocyte dysfunction, alveolar exudate as culture medium) → secondary bacterial pneumonia: <b>S. aureus, S. pneumoniae, H. influenzae</b></li><li>HA must be cleaved (HA1/HA2) by host proteases that exist only in the respiratory tract → infection stays there (unlike H5N1 with lower-tract tropism)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Outcome of infection</th><th>Pattern</th><th>Examples</th></tr></thead><tbody><tr><td>Cell death</td><td>lytic</td><td>influenza, poliovirus, HSV lytic cycle, pox</td></tr><tr><td>Persistent, chronic</td><td>low-level production</td><td>HBV, HCV</td></tr><tr><td>Latent</td><td>genome stays, reactivates</td><td>HSV, VZV, EBV, CMV, JC/BK</td></tr><tr><td>Transformation</td><td>unregulated growth</td><td>HPV, EBV, HTLV-1</td></tr><tr><td>Abortive</td><td>non-permissive</td><td>HDV without HBV</td></tr></tbody></table></div><ul><li>Complications: pneumonia (viral, bacterial, mixed) in elderly/debilitated; <b>Reye syndrome</b> (children 2-16, encephalopathy + fatty liver)</li></ul><p class=\"rsrc\">Source: MCB 2.04 E Orthomyxoviridae Pathogenesis, Clinical Findings; MCB 2.01 Table 22</p>","RUBIGG":"<h5>Maternal antibody and infant protection</h5><ul><li>Immune mothers pass rubella <b>IgG</b> across the placenta → infant protected for <b>4-6 months</b>, lost over 6 months</li><li>Reason PPS schedules the rubella-containing vaccine at 9 months: maternal antibody is gone by the 6th month</li><li>Postnatal rubella immunity: IgM appears as rash fades and is gone by 6 wk; <b>IgG persists for life</b> (one antigenic type → one attack = lifelong immunity)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Maternal antibody protects infant for</th></tr></thead><tbody><tr><td>Rubella</td><td>4-6 months</td></tr><tr><td>Measles</td><td>months (vaccine 9 months)</td></tr><tr><td>Mumps</td><td>~6 months (rare in infants &lt;6 mo)</td></tr><tr><td>Poliovirus</td><td>up to 6 months (transplacental + breast milk)</td></tr><tr><td>Rotavirus</td><td>&lt;6 months from severe disease</td></tr><tr><td>RSV</td><td>falls by 2-4 months → severe bronchiolitis window</td></tr><tr><td>HSV</td><td>lost by 6 months → primary herpes peak 6 mo - 2 y</td></tr><tr><td>Adenovirus</td><td>protects newborns from severe respiratory disease</td></tr></tbody></table></div><ul><li>Passive vs active: transplacental IgG = natural passive; immunoglobulin (VZIG, HBIG, rabies RIG) = artificial passive; vaccine = active</li><li>Serology pair: IgM = recent infection (day 4 after rash, peaks 1-2 wk); IgG = past infection or vaccine</li></ul><p class=\"rsrc\">Source: MCB 2.04 B.01 Post Natal Rubella Immunity, Table 3</p>","MERS":"<h5>Coronaviridae zoonoses</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Receptor</th><th>Reservoir</th><th>Intermediate host</th><th>Year</th></tr></thead><tbody><tr><td>HCoV-229E</td><td>aminopeptidase N</td><td></td><td></td><td>common cold</td></tr><tr><td>SARS-CoV</td><td><b>ACE2</b></td><td>bats</td><td>civet cats</td><td>2003</td></tr><tr><td>MERS-CoV</td><td><b>DPP4 (CD26)</b></td><td>bats</td><td><b>dromedary camels</b></td><td>2012</td></tr><tr><td>SARS-CoV-2</td><td>ACE2 (+TMPRSS2)</td><td>bats</td><td>pangolins</td><td>2019</td></tr></tbody></table></div><ul><li>Genera infecting humans: Alphacoronavirus (229E, NL63) and Betacoronavirus (OC43, HKU1, SARS, MERS, SARS-CoV-2)</li><li>Structure: enveloped, helical, (+)ssRNA (largest RNA genome), non-segmented; proteins S (spike, entry), E, M (assembly organiser), N (nucleocapsid), HE in some</li><li>(+) sense → genome acts as mRNA immediately; replication in cytoplasm</li><li>COVID-19 pathogenesis: S-ACE2 entry → alveolar infection → macrophage cytokines (IL-1, 6, TNF-α...) → cytokine storm, <b>lymphopenia</b>, neutrophilia + high D-dimer in fatal cases → ARDS, coagulopathy, MOF</li><li>Diagnosis: RT-qPCR (ORF1ab, N, E) foundational; rapid antigen lateral flow (nucleocapsid) as screening</li><li>Zoonotic list for the \"EXCEPT\" pattern: Nipah, Hendra, MERS, SARS, avian flu, rabies, hanta, Ebola — parainfluenza and mumps/measles/rubella are human-only</li></ul><p class=\"rsrc\">Source: MCB 2.04 C Coronaviridae, Table 6, 7; 2028 Trans review Q4</p>","HENIPA":"<h5>Henipaviruses (Paramyxoviridae, genus Henipavirus)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Species</th><th>Facts</th></tr></thead><tbody><tr><td><b>Nipah</b></td><td>1999 Malaysia (Sungai Nipah) pig farmers; bats → pigs → people; outbreaks Bangladesh, India, Malaysia, Singapore, <b>Philippines (2014 Sultan Kudarat, 17 cases, 9 deaths, 53% CFR, horses)</b></td></tr><tr><td><b>Hendra</b></td><td>1994 Hendra, Australia; bats → horses → humans; only 7 human cases, 57% fatal; horse vaccine only (Australia)</td></tr><tr><td><b>Langya</b></td><td>identified <b>August 2022 in febrile patients, Eastern China</b></td></tr><tr><td>Mojiang, Cedar, Ghanaian</td><td>not known to cause human disease</td></tr></tbody></table></div><ul><li>Reservoir: <b>Pteropus fruit bats (flying foxes)</b>, present in the Philippines (13.6% seropositive)</li><li>Transmission: direct contact with infected bats/pigs/horses (spillover), foodborne (raw date palm sap, bat-bitten fruit), <b>human-to-human via body fluids</b></li><li>Clinical: 4-14 d incubation; fever, headache, cough, sore throat, dyspnea → encephalitis (confusion, drowsiness, seizures, coma in 24-48 h)</li><li><b>No vaccine and no antiviral for humans</b> → prevention is avoidance: no contact with bats/sick pigs/horses, wash hands, boil date palm sap, wash fruit, PPE when slaughtering, protect pig sheds from bats, standard + contact + droplet precautions in hospital</li><li>Zoonotic vs not: Nipah, Hendra, MERS, avian flu = zoonotic; <b>parainfluenza = strictly human-to-human</b></li></ul><p class=\"rsrc\">Source: MCB 2.04 D.04-05 Nipah and Hendra; MCB 2.10 IV Nipah Virus, Table 17</p>","2028-82":"<h5>Syncytium formation in paramyxoviruses</h5><p class=\"mech\"><i>Mechanism</i>infected cell displays attachment (HN/H/G) and <b>fusion (F)</b> glycoproteins on its surface → host proteases cleave F0 → active F1 → adjacent membranes fuse → large multinucleated giant cells (<b>syncytia</b>) → virus spreads cell-to-cell without leaving the cell</p><ul><li>Effects: hallmark CPE of paramyxovirus infection (RSV, measles, mumps), direct cell-to-cell spread that shields virus from antibody, giant cells in lesions (measles Koplik spots and giant cell pneumonia; Warthin-Finkeldey), tissue damage</li><li>Syncytia do <b>not</b> cause genetic mutation; paramyxoviruses are antigenically stable</li><li>Fusion happens at neutral pH at the cell surface → paramyxoviruses bypass endosomes</li><li>Acidophilic cytoplasmic inclusions = sites of viral synthesis; measles also intranuclear</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus with syncytia/giant cells</th><th>Note</th></tr></thead><tbody><tr><td>RSV</td><td>name = respiratory syncytial</td></tr><tr><td>Measles</td><td>giant cell pneumonia in immunodeficient</td></tr><tr><td>Mumps</td><td>syncytium + hemadsorption in culture</td></tr><tr><td>HSV, VZV</td><td>multinucleated giant cells on Tzanck</td></tr><tr><td>CMV</td><td>cytomegalic cells with owl's-eye inclusions</td></tr><tr><td>HIV</td><td>CD4 cell syncytia</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 D Paramyxoviridae, Syncytium Formation and Inclusion Bodies; MCB 2.01 CPE</p>","2028-83":"<h5>Why measles (rubeola) has a rash</h5><ul><li>Timeline: respiratory entry → local multiplication → regional nodes → <b>primary viremia</b> (reticuloendothelial system) → <b>secondary viremia</b> seeds epithelial surfaces, skin, respiratory tract, conjunctiva</li><li>Maculopapular rash appears <b>day 14, exactly when circulating antibody (IgM then IgG) becomes detectable</b> → the rash is <b>immune-mediated</b>: sensitized lymphocytes, antibody and complement react with viral antigen on dermal capillary <b>endothelial cells</b></li><li>Same logic in rubella: rash appears with antibody → immunological basis</li><li>Practical proof: patients with defective cell-mediated immunity may get <b>no rash</b> but giant cell pneumonia</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Rash</th><th>Mechanism</th></tr></thead><tbody><tr><td>Measles, rubella</td><td>immune reaction to virus in endothelium</td></tr><tr><td>Dengue</td><td>cytokine/complement response; petechiae from thrombocytopenia and leakage</td></tr><tr><td>Parvovirus B19</td><td>appears with antibody (non-infectious by then)</td></tr><tr><td>Varicella / smallpox</td><td>direct viral replication in skin → vesicles</td></tr><tr><td>HFMD</td><td>direct enterovirus replication in skin</td></tr></tbody></table></div><ul><li>Measles clinical: prodrome fever, cough, coryza, conjunctivitis/photophobia, <b>Koplik spots</b> (bluish-white on buccal mucosa opposite lower molars, contain giant cells); rash head → trunk → limbs, pink maculopapules coalescing, brownish in 5-10 d; lymphopenia; contagious prodrome to 2-5 d of rash</li><li>Complications: otitis media most common; bacterial pneumonia most lethal; encephalitis 1:1000; ADEM (myelin basic protein autoimmunity); SSPE years later</li></ul><p class=\"rsrc\">Source: MCB 2.04 D.03 Measles Pathogenesis, Table 13; 2.04 review Q4</p>","2028-85":"<h5>RSV pathogenesis</h5><ul><li>Enters upper respiratory tract; <b>targets ciliated cells of the large airways</b> → cell rounding and detachment from the apical epithelium</li><li>Spreads to bronchioles where replication is more efficient → ciliated cells sloughed → debris obstructs the lumen</li><li>Epithelial damage lets virus and cytokines reach smooth muscle → inflammation and hyperreactivity → further narrowing</li><li>Basal cells infected → <b>goblet cell proliferation</b> → mucus; eosinophils and many <b>neutrophils</b> recruited; <b>NETs</b> (neutrophil DNA + histones) accumulate</li><li>End result: mucus + debris + NETs block narrow bronchioles → alveolar collapse = <b>bronchiolitis</b> (wheeze, dyspnea, tachypnea, apnea in infants)</li><li>Receptors: CX3CR1 and CR1; giant cells and intracytoplasmic inclusions; rare viremia; incubation 3-5 d</li><li>Immunity: maternal antibody falls → severe disease at 2-4 months; poor memory (IgG but not IgA memory B cells) → reinfection common</li><li>Diagnosis: rRT-PCR most sensitive; antigen tests good in children, poor in adults</li><li>Infection control: <b>contact + droplet</b> precautions, pediatric wards (2.09)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>RSV</th><th>hMPV</th></tr></thead><tbody><tr><td>&lt;6 mo peak, Nov-Jan, bronchiolitis common</td><td>6-12 mo, Feb-Apr, less bronchiolitis, more pneumonia</td></tr><tr><td>receptor CX3CR1/CR1</td><td>αvβ1 integrin</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 D.06 Human RSV, Table 15; D.07 hMPV</p>","2028-86":"<h5>Influenza glycoproteins</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Protein</th><th>Where</th><th>Job</th></tr></thead><tbody><tr><td><b>HA (hemagglutinin)</b></td><td>envelope spike</td><td>binds sialic acid → attachment; agglutinates RBC; must be cleaved HA1/HA2 by host protease for fusion; <b>main target of neutralizing antibody</b>; drift/shift</td></tr><tr><td><b>NA (neuraminidase)</b></td><td>envelope spike</td><td><b>sialidase</b>: removes sialic acid from glycoconjugates → releases budding virions from the cell surface, prevents self-aggregation, helps virus cross respiratory mucin; <b>target of oseltamivir (Tamiflu)</b>, peramivir</td></tr><tr><td>M2</td><td>envelope</td><td>proton channel (uncoating)</td></tr><tr><td>M1</td><td>under envelope</td><td>matrix</td></tr><tr><td>NP, PA, PB1, PB2</td><td>vRNP</td><td>nucleoprotein + RdRp subunits; NP/M define types A/B/C</td></tr></tbody></table></div><ul><li>All three listed NA functions are correct → \"all of the above\"</li><li>Attachment vs release pair: HA gets the virus in, NA lets progeny out (end of the cycle)</li><li>Same concept in paramyxos: HN of parainfluenza and mumps has neuraminidase; other paramyxoviruses (measles H, RSV G) do not</li><li>Subtypes: 18 HA (H1-H18), 11 NA (N1-N11); type A only</li><li>Detection: hemagglutination and hemadsorption in culture (3-5 d), HI test for serology (paired sera), RT-PCR, rapid antigen test detects surface proteins/nucleoprotein</li></ul><p class=\"rsrc\">Source: MCB 2.04 E Hemagglutinin, Neuraminidase; 2.04 review Q7</p>","ZIKA":"<h5>Zika virus (Flaviviridae)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Feature</th><th>Zika</th></tr></thead><tbody><tr><td>Vector</td><td>Aedes aegypti, Aedes albopictus (day-biting)</td></tr><tr><td>Reservoir</td><td>non-human primates, humans (NOT a dead-end host)</td></tr><tr><td>Other routes</td><td><b>vertical (mother to fetus), sexual</b>, transfusion, organ transplant</td></tr><tr><td>Incubation</td><td>3-14 d; majority asymptomatic</td></tr><tr><td>Illness</td><td>rash, fever, <b>non-purulent conjunctivitis</b>, arthralgia, myalgia, headache for 2-7 d</td></tr><tr><td>Complications</td><td><b>congenital Zika syndrome / microcephaly</b>, preterm birth, miscarriage; <b>Guillain-Barré</b>, neuropathy, transverse myelitis</td></tr><tr><td>Treatment / vaccine</td><td>none; plan pregnancy, avoid travel/bites</td></tr></tbody></table></div><ul><li>History: Zika forest Uganda 1947; Yap 2007 first large outbreak; Brazil 2015 microcephaly link; present in the Philippines (86 countries)</li></ul><h5>Arbovirus-manifestation pairs (the 2028 Q94 pattern)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Main manifestation</th></tr></thead><tbody><tr><td>Dengue</td><td>fever, breakbone myalgia/arthralgia, hemorrhagic fever/shock (ADE)</td></tr><tr><td>Chikungunya</td><td>prolonged severe <b>polyarthralgia</b> (synovial tropism)</td></tr><tr><td>Zika</td><td>rash + conjunctivitis; <b>microcephaly</b>, GBS</td></tr><tr><td>Japanese encephalitis</td><td>encephalitis, neurologic sequelae</td></tr><tr><td>Yellow fever</td><td>hemorrhagic fever + jaundice (Councilman bodies)</td></tr><tr><td>West Nile / St. Louis</td><td>febrile illness or neuroinvasive disease (Culex, birds)</td></tr></tbody></table></div><ul><li>Three arbovirus syndromes: undifferentiated fever, encephalitis, hemorrhagic fever</li><li>Other pregnancy viruses to keep separate: rubella (triad), CMV (most common intrauterine), B19 (hydrops), HSV (birth canal)</li></ul><p class=\"rsrc\">Source: MCB 2.05 A.4 Zika Virus, Table 2; MCB 2.10 III.C Zika</p>","HANTA":"<h5>Hantavirus (Bunyaviridae): a ROBOvirus, not an arbovirus</h5><ul><li>Arbovirus = arthropod-borne; <b>robovirus = rodent-borne</b>, no vector; transmission by <b>inhaled aerosols of rodent urine, feces, saliva</b>; lifelong infection of the rodent; no human-to-human spread</li><li>Structure: spherical, enveloped, <b>segmented (3) (-)ssRNA</b>, ambisense; own RdRp; named for the Hantan River (Korean War UN troops)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Hemorrhagic fever with renal syndrome (HFRS)</th><th>Hantavirus pulmonary syndrome (HPS)</th></tr></thead><tbody><tr><td>Virus</td><td>Hantaan, Dobrava, Seoul (urban rats)</td><td><b>Sin Nombre virus</b></td></tr><tr><td>Reservoir</td><td>urban rats; spread worldwide by ships</td><td><b>deer mouse, Peromyscus maniculatus</b></td></tr><tr><td>Organ</td><td>kidney: acute interstitial nephritis, renal failure, hemorrhage, shock</td><td>lung: fever/myalgia → rapidly progressive pulmonary edema, respiratory failure; <b>no hemorrhage</b></td></tr><tr><td>Mortality</td><td>variable</td><td>≥30%</td></tr><tr><td>Lab</td><td>RT-PCR, IHC on tissue, ELISA IgM/IgG</td><td>same</td></tr><tr><td>Treatment</td><td>supportive, rodent control</td><td>supportive, oxygen; ribavirin</td></tr></tbody></table></div><h5>Rodent-borne group</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Family</th><th>Reservoir</th><th>Disease</th></tr></thead><tbody><tr><td>Hantaan / Sin Nombre</td><td>Bunyaviridae</td><td>rats / deer mouse</td><td>HFRS / HPS</td></tr><tr><td>Lassa</td><td>Arenaviridae (2 segments)</td><td>Mastomys rat, excreta</td><td>hemorrhagic fever, West Africa</td></tr><tr><td>Ebola, Marburg</td><td>Filoviridae</td><td>fruit bats (suspected)</td><td>hemorrhagic fever, contact spread</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.05 III.B Bunyavirus, Table 39-41; Table 1 Arbo vs Robo</p>","JE":"<h5>Japanese encephalitis ecology</h5><ul><li>Flaviviridae; <b>main cause of viral encephalitis in Asia</b> and the common arboviral encephalitis in the Philippines (year-round, all regions; 131 cases 2025, +198%)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Element</th><th>JE</th></tr></thead><tbody><tr><td>Vector</td><td><b>Culex tritaeniorhynchus, C. vishnui</b>: breed in rice fields and stagnant water, evening/night biters, outdoor</td></tr><tr><td>Enzootic cycle</td><td>water birds (egrets, herons) &lt;→ mosquito</td></tr><tr><td>Amplifying host</td><td><b>pigs</b>: high prolonged viremia so mosquitoes pick up enough virus</td></tr><tr><td>Humans</td><td>incidental <b>dead-end hosts</b> (too little viremia to infect mosquitoes)</td></tr><tr><td>Most at risk</td><td>farmers in rural rice-growing, flood-irrigated areas, near piggeries</td></tr></tbody></table></div><ul><li>Clinical: most asymptomatic; febrile illness, aseptic meningitis, seizures, encephalitis, polio-like flaccid paralysis; &gt;50% of severe cases die or keep sequelae (mental retardation, spasticity, paralysis); gray matter of cortex, midbrain, brainstem</li><li>Pathology: neuronal degeneration, necrosis, microglial nodules, perivascular infiltrates; brain cannot regenerate → irreversible</li><li>Treatment supportive; <b>JE vaccine locally available</b></li></ul><h5>Mosquito vectors in the Philippines (2.10)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Vector</th><th>Biting</th><th>Breeding</th></tr></thead><tbody><tr><td>Malaria</td><td>Anopheles flavirostris, litoralis, balabacensis (Palawan)</td><td>night, indoor</td><td>puddles, tanks, ditches</td></tr><tr><td>Dengue, chikungunya, Zika</td><td>Aedes aegypti, albopictus (tiger)</td><td><b>day</b></td><td>clear water in containers</td></tr><tr><td>JE</td><td>Culex tritaeniorhynchus, vishnui</td><td>night, outdoor</td><td><b>rice fields</b></td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.05 A.3 Japanese Encephalitis; MCB 2.10 III.C vectors</p>","AEDES":"<h5>Aedes-borne diseases share one prevention strategy: vector control</h5><ul><li>Dengue, chikungunya, Zika, (urban) yellow fever all use <b>Aedes aegypti / A. albopictus</b>: black-and-white \"tiger\" mosquito, <b>day biter</b>, breeds in clean stagnant water in containers, indoor and outdoor</li><li>No antiviral for any of them; <b>no FDA-approved dengue vaccine in the Philippines</b> (Dengvaxia registration revoked because seronegatives risk ADE; Qdenga under FDA review) → the main public-health measure is <b>vector control</b></li><li>DOH 4S: <b>S</b>earch and destroy breeding sites, <b>S</b>ecure self-protection (long sleeves, repellent, screens), <b>S</b>eek early consultation, <b>S</b>upport fogging only in outbreaks/hotspots</li><li>4T for containers: Taob, Taktak, Tuyo, Takip</li><li>General arbovirus prevention table (2.05): vector control, vector avoidance, protective clothing, repellents, window screens, vaccination where available (JE, yellow fever 17D)</li><li>Dengue burden: most important human arboviral disease; 40% of world at risk; PH 2025 ~414k cases, CFR 0.4%; serotypes 1, 2, 3 circulate; classified with warning signs 56%, without 43%, severe 1%</li><li>Dengue treatment: paracetamol; <b>avoid aspirin, ibuprofen, mefenamic acid</b> (bleeding); recognise warning signs early</li></ul><p class=\"rsrc\">Source: MCB 2.05 A.2 Dengue Treatment and Prevention, Table 27; MCB 2.10 Dengue</p>","FILO":"<h5>Filoviridae: Ebola and Marburg</h5><ul><li>Filum = thread; pleomorphic long filaments; <b>(-)ssRNA</b>, enveloped, 7 genes (NP, VP35, VP40, GP, VP30, VP24, L)</li><li>Genera: Marburg; Ebola species Zaire, Sudan, Bundibugyo (current DRC outbreak), Ivory Coast, <b>Reston (Philippines: cynomolgus monkeys 1989, pigs; low human pathogenicity)</b></li><li>Reservoir suspected <b>fruit bats</b>; humans and NHPs highly susceptible</li><li>Transmission: <b>direct contact with blood or body fluids</b>, funeral practices; slower spread than aerosol COVID-19; no vector</li><li>Tropism: <b>macrophages, dendritic cells</b>, fibroblasts, endothelium → later liver, spleen, lungs, kidneys</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Marburg</th><th>Ebola</th></tr></thead><tbody><tr><td>Incubation</td><td>3-9 d</td><td>2-21 d</td></tr><tr><td>Course</td><td>fever, headache, sore throat, myalgia → abdominal pain, vomiting, diarrhea, rash → <b>internal and external bleeding</b> → shock, death</td><td>same</td></tr><tr><td>Mortality</td><td>25-90%, highest of all VHFs</td><td>same</td></tr></tbody></table></div><ul><li>Diagnosis: <b>RT-PCR</b>, ELISA antigen/antibody; specimens dangerous → <b>BSL-4</b> (most clinical labs BSL-2; TB BSL-3)</li><li>Control: isolation in hospital is the most effective measure; no approved vaccine or antiviral in the trans; support renal function, electrolytes, hemorrhage, shock</li></ul><h5>Viral hemorrhagic fever agents compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Family</th><th>Spread</th></tr></thead><tbody><tr><td>Ebola/Marburg</td><td>Filo</td><td>contact with fluids</td></tr><tr><td>Lassa</td><td>Arena</td><td>rodent excreta</td></tr><tr><td>Hantaan</td><td>Bunya</td><td>rodent aerosol</td></tr><tr><td>Dengue, yellow fever</td><td>Flavi</td><td>Aedes</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.05 III.A Filovirus, Table 37, 38</p>","DEADEND":"<h5>Arbovirus epidemiology (2.05)</h5><ul><li>Arbovirus is an <b>ecological group, not a family</b>; enveloped (+)ssRNA (Toga, Flavi) or (-)ssRNA (Bunya, Filo, Arena)</li><li>Cycle: virus replicates in a <b>reservoir without disease</b> → blood-feeding arthropod takes it up → <b>virus replicates in the arthropod without harming it</b> → bite transmits to the next vertebrate</li><li>Some are kept in nature by <b>transovarial transmission</b> (eggs hatch already infected)</li><li>Humans are usually <b>dead-end hosts</b> (viremia too low to infect another mosquito)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Dead-end host</th><th>Exceptions (humans amplify)</th></tr></thead><tbody><tr><td>Japanese encephalitis, West Nile, St. Louis encephalitis, EEE, WEE</td><td><b>dengue, urban yellow fever, Zika, chikungunya</b></td></tr></tbody></table></div><ul><li>Reservoirs: birds (encephalitis viruses), pigs (JE amplifier), monkeys (YF, dengue jungle cycle), rodents, horses (EEE dead-end), bats</li><li>Vectors: mosquitoes (PH), ticks, sandflies, midges</li><li>Distribution depends on vector, reservoir, climate, rainfall, human activity (distinct geography, unlike influenza)</li><li>General pathogenesis: bite → local replication → regional node → viremia → target organ by tropism → fever / encephalitis / hemorrhagic fever</li><li>Diagnosis PCR and serology; treatment supportive; prevention vector control, protection, vaccines (JE, YF)</li></ul><p class=\"rsrc\">Source: MCB 2.05 II Arthropod-borne viruses, Transmission Cycle, Table 6</p>","YF":"<h5>Yellow fever</h5><ul><li>Prototype flavivirus; only tropical <b>Africa and South America</b> (spread by the slave trade); absent from Asia despite Aedes (quarantine/vaccine, biologic incompatibility, dengue cross-immunity, or luck)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Cycle</th><th>Chain</th></tr></thead><tbody><tr><td>Jungle (sylvatic)</td><td>monkey → Haemagogus/Aedes → monkey; humans incidental</td></tr><tr><td>Urban</td><td>human → Aedes aegypti → human</td></tr><tr><td>Intermediate (savannah)</td><td>monkey/human → mosquito → monkey/human</td></tr></tbody></table></div><ul><li>Reservoir: <b>humans and monkeys</b>; humans are NOT dead-end in the urban cycle</li><li>Clinical: 2/3 asymptomatic; <b>biphasic</b>: viremic phase (fever, headache, myalgia, vomiting) → remission 1-2 d → intoxication phase (fever returns, <b>petechiae, hematemesis, jaundice</b>, renal failure, shock); 15-20% die untreated</li></ul><p class=\"mech\"><i>Mechanism</i>infects inflammatory and endothelial cells → nodes → viremia → Kupffer cells then hepatocytes → necrosis/apoptosis (jaundice) → cytokine storm damages endothelium + loss of clotting factors → hemorrhage</p><ul><li>Pathology: <b>midzonal necrosis with Councilman bodies</b> (pathognomonic)</li><li>Diagnosis: RT-PCR early, IgM capture EIA later, liver enzymes</li><li>Prevention: <b>live attenuated 17D vaccine</b> — one dose, 95% seroconversion, ≥30 y protection; contraindicated &lt;9 months, pregnancy, egg allergy, immunocompromised; in the Philippines only at the Bureau of Quarantine for travelers; mosquito control; no antiviral</li></ul><p class=\"rsrc\">Source: MCB 2.05 A.1 Yellow Fever, Table 14-19</p>","2028-60":"<h5>Dengue diagnostics by day of illness</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Test</th><th>Detects</th><th>Best window</th></tr></thead><tbody><tr><td><b>NS1 antigen</b></td><td>non-structural protein 1 (viral antigen)</td><td><b>early, days 1-5</b> of fever (before antibody)</td></tr><tr><td>RT-PCR</td><td>viral RNA</td><td>early</td></tr><tr><td>IgM</td><td>patient antibody</td><td>later (from ~day 5)</td></tr><tr><td>IgG</td><td>past or secondary infection</td><td>interpret by timing; high early IgG suggests secondary</td></tr></tbody></table></div><ul><li>NS1 rapid test: capture antibody wraps the NS1 antigen → line; IgM/IgG test is the reverse (antigen catches antibody)</li><li>Warning signs prompting admission: abdominal pain, persistent vomiting, mucosal bleed, lethargy, hepatomegaly, rising hematocrit with falling platelets; <b>tourniquet test</b> ≥20 petechiae positive</li><li>Uncomplicated dengue: saddle-back biphasic fever, retro-orbital headache, conjunctivitis, measles-like rash, petechiae, breakbone myalgia</li><li>Severe dengue (5%): plasma leakage, thrombocytopenia &lt;100k, bleeding, shock; 90% occur in a <b>second infection with a different serotype</b> → <b>antibody-dependent enhancement</b> (non-neutralizing antibody opsonises virus into monocytes → more replication, cytokines, permeability)</li><li>Treatment: paracetamol; avoid NSAIDs/aspirin; fluids; recognise critical phase 2-3 d after defervescence</li></ul><p class=\"rsrc\">Source: MCB 2.05 A.2 Dengue Laboratory Testing, Table 26</p>","2028-65":"<h5>Chikungunya (Togaviridae, genus Alphavirus)</h5><ul><li>Name = \"to become contorted\" (severe joint pain); Tanzania 1952; &gt;60 countries; PH outbreaks (835 cases 2025)</li></ul><p class=\"mech\"><i>Mechanism</i>bite → endothelial cells, macrophages, local tissue → lymph nodes → viremia → <b>carried by infected monocytes/macrophages to synovial tissue of joints</b> → inflammatory response = <b>severe, prolonged, recurring polyarthralgia</b> (esp. extremities)</p><ul><li>Rapid onset fever, nausea, headache, rash in half; neuro involvement rare (children); mortality ~1/1000; no vaccine, no antiviral; NSAIDs for joints; vector control</li><li>E1 glycoprotein A226V mutation → better fitness in <b>Aedes albopictus</b> (wider range)</li><li>Reservoir: humans (urban), NHPs/rodents/birds (sylvatic); humans are NOT dead-end</li></ul><h5>Togaviridae vs Flaviviridae arboviruses</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Togaviridae (Alphavirus)</th><th>Flaviviridae</th></tr></thead><tbody><tr><td>Size</td><td>70 nm</td><td>50 nm</td></tr><tr><td>Members</td><td>chikungunya, EEE (30% mortality, birds, horses dead-end), WEE, VEE, Mayaro, O'nyong-nyong, Ross River</td><td>dengue, YF, JE, Zika, WNV, SLE, tick-borne encephalitis</td></tr><tr><td>Note</td><td>Rubivirus (rubella) moved out to Matonaviridae, not arthropod-borne</td><td>HCV also a flavivirus (Hepacivirus)</td></tr></tbody></table></div><ul><li>Arthralgia differentials: chikungunya (joint tropism, prolonged) vs dengue (breakbone myalgia, self-limited) vs Zika (mild arthralgia + conjunctivitis) vs parvovirus B19 (small joints of hands in women)</li></ul><p class=\"rsrc\">Source: MCB 2.05 B.1 Chikungunya, Table 32-34; MCB 2.10 Chikungunya</p>","PML":"<h5>Progressive multifocal leukoencephalopathy</h5><ul><li>Agent: <b>JC virus</b>, Polyomaviridae (naked, circular dsDNA, 45 nm, replicates in nucleus; Baltimore I, \"HAPPPy\")</li></ul><p class=\"mech\"><i>Mechanism</i>childhood infection → latency in kidney and lymphoid tissue (70-80% of adults seropositive) → immunosuppression (AIDS ~5%, transplant, monoclonal antibody therapy) → reactivation → bloodstream → CNS → <b>cytocidal infection of oligodendrocytes</b> (myelin makers) → <b>demyelination</b> confined to white matter</p><ul><li>Clinical: visual deficits, impaired speech and cognition, weakness, ataxia, seizures → paralysis; death in 3-6 months</li><li>Lab: MRI multifocal asymmetric coalescing white-matter lesions (centrum semiovale, parieto-occipital, cerebellum); <b>CSF PCR for JCV DNA</b> (specificity 92-100%)</li><li>Treatment: none consistent (mirtazapine may block receptor); prevention = immune restoration</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Human polyomavirus</th><th>Disease</th><th>Site</th></tr></thead><tbody><tr><td><b>JC</b></td><td>PML</td><td>CNS white matter, immunocompromised</td></tr><tr><td><b>BK</b> (HPyV1)</td><td>hemorrhagic cystitis (BMT), polyomavirus nephropathy (kidney transplant, graft loss)</td><td>urinary tract</td></tr><tr><td><b>Merkel cell virus</b></td><td>Merkel cell carcinoma (clonally integrated DNA)</td><td>skin neuroendocrine cells, elderly/immunosuppressed</td></tr><tr><td>SV40</td><td>model tumor virus: large T binds p53 + pRb</td><td></td></tr></tbody></table></div><h5>Slow virus infections (2.06)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Conventional viruses</th><th>Unconventional agents</th></tr></thead><tbody><tr><td><b>SSPE</b> (measles), <b>PML</b> (JC virus)</td><td>kuru, CJD (prions)</td></tr></tbody></table></div><ul><li>Do not confuse: SSPE = measles; PML = JC; CJD = prion; all are chronic CNS diseases with long asymptomatic gaps</li></ul><p class=\"rsrc\">Source: MCB 2.02 Polyomavirinae, Table 8; MCB 2.06 II.C PML, VI.B Polyomaviruses</p>","RETRO":"<h5>Retrovirus replication (Baltimore VI) and the drugs that copy its steps</h5><ul><li>Retroviridae: enveloped, icosahedral capsid with helical core, <b>diploid (+)ssRNA</b> (two copies), 7-11 kb; virion carries <b>reverse transcriptase</b>; NOT used directly as mRNA</li><li>Genes: <b>gag</b> (core proteins), <b>pro</b> (protease), <b>pol</b> (reverse transcriptase [and integrase]), <b>env</b> (gp120/gp41); HIV adds tat, rev, nef, vpr, vpu, vif</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Step</th><th>Enzyme / protein</th><th>Drug class</th></tr></thead><tbody><tr><td>Attachment</td><td>gp120 → CD4, coreceptor CCR5 (macrophage-tropic) / CXCR4 (T-tropic)</td><td>entry inhibitor maraviroc (CCR5)</td></tr><tr><td>Fusion</td><td>gp41 fusion domain</td><td>fusion inhibitor enfuvirtide</td></tr><tr><td><b>RNA → DNA</b></td><td><b>reverse transcriptase (RNA-dependent DNA polymerase), encoded by pol</b></td><td>NRTIs (zidovudine, lamivudine, tenofovir, abacavir, emtricitabine) and NNRTIs (efavirenz, nevirapine, rilpivirine)</td></tr><tr><td><b>DNA → host chromosome (provirus)</b></td><td><b>integrase</b></td><td>dolutegravir, raltegravir</td></tr><tr><td>Transcription/translation</td><td>host machinery; tat boosts</td><td></td></tr><tr><td>Maturation</td><td>viral protease cleaves Gag</td><td>protease inhibitors (ritonavir, darunavir, atazanavir)</td></tr></tbody></table></div><ul><li>Order matters: RT acts first in the cytoplasm/at nuclear envelope, then integrase inserts dsDNA into the host genome; provirus persists for the life of the cell (retroviruses usually non-cytolytic, lentiviruses cytocidal)</li><li>Why a (+)RNA virus needs RT: the genome is not read as mRNA; it must become DNA to be integrated and transcribed by host RNA polymerase II</li><li>Group VII (HBV) also uses RT but from a gapped dsDNA genome via an RNA pregenome (tenofovir works on both)</li><li>RNA viruses replicate in cytoplasm EXCEPT orthomyxo and retro (nucleus)</li><li>Resistance to RTIs = point mutations in the <b>pol</b> gene (error-prone RT, ~10^10 virions/day); genotypic testing sequences RT and protease genes</li></ul><p class=\"rsrc\">Source: MCB 2.06 V.B Retroviruses, Table 15; VI.L Antiviral Drugs, Table 26; MCB 2.01 Group VI</p>","PRIONSHAPE":"<h5>Prion protein conformation</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>PrP^C (normal)</th><th>PrP^Sc (scrapie isoform)</th></tr></thead><tbody><tr><td>normal body component made in ER → Golgi → cell surface, GPI-anchored</td><td>misfolded version of the same protein</td></tr><tr><td><b>α-helix</b> rich</td><td><b>β-pleated sheet</b> rich</td></tr><tr><td>protease-sensitive, soluble</td><td>protease-resistant, aggregates into amyloid fibrils/plaques</td></tr><tr><td>harmless</td><td>self-propagating: forces PrP^C to refold (protein-only hypothesis)</td></tr></tbody></table></div><p class=\"mech\"><i>Mechanism</i>PrP^Sc contacts PrP^C at the cell surface or in endocytic vesicles → template-directed misfolding → oligomers (helped by lipid rafts, glycosaminoglycans) → accumulation in lysosomes, membrane, extracellular amyloid → <b>spongiform neurodegeneration</b></p><ul><li>No nucleic acid → only transmissible pathogens without a genome; \"epigenetically heritable\"; strains = slightly different folds</li><li>Resistant to heat, disinfectants, irradiation; inactivated by phenol, periodate, NaOH, hypochlorite</li><li>No immune or inflammatory response, no interferon; cannot be cultured; incubation up to 35 years; incurable</li><li>Origins: sporadic (spontaneous conversion), genetic (<b>PRNP</b> mutation), infectious/iatrogenic (growth hormone, dura grafts, instruments; kuru from cannibalism; BSE/mad cow)</li></ul><p class=\"rsrc\">Source: MCB 2.06 III Prions, Table 8</p>","SSPE":"<h5>Subacute sclerosing panencephalitis</h5><ul><li>A <b>slow virus disease of measles</b> (conventional virus): rare demyelinating CNS disease; ~1 per 100,000-500,000 measles cases</li></ul><p class=\"mech\"><i>Mechanism</i>measles at an early age (&lt;2 y) → virus persists in a <b>defective/altered, non-permissive</b> form inside neurons and glia → 6-8 y latent interval → large amounts of measles antigen in intracellular inclusion bodies → progressive inflammation, demyelination, neuronal loss</p><ul><li>Stages: poor school performance, mood/personality change → seizures, <b>myoclonus</b>, ataxia, visual loss → quadriparesis, spasticity, hyperreflexia, unresponsive</li><li>Lab: <b>CSF anti-measles antibody invariably elevated</b>, oligoclonal; brain culture (cocultivation), immunocytochemistry, in situ hybridization, PCR</li><li>No therapy; prevented by measles vaccination (MMR, target 95% coverage)</li></ul><h5>The three chronic CNS \"slow\" diseases</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Agent</th><th>Host</th><th>Hallmark</th></tr></thead><tbody><tr><td>SSPE</td><td>measles (Paramyxo, RNA)</td><td>child years after measles</td><td>high CSF measles Ab, myoclonus</td></tr><tr><td>PML</td><td>JC virus (Polyoma, DNA)</td><td>immunosuppressed</td><td>white-matter demyelination, CSF JCV PCR</td></tr><tr><td>CJD / kuru</td><td>prion</td><td>sporadic/genetic/iatrogenic</td><td>dementia, ataxia, myoclonus, <b>no inflammation</b></td></tr></tbody></table></div><ul><li>Other measles CNS complications: acute encephalitis 1:1000; ADEM (autoimmune to myelin basic protein)</li></ul><p class=\"rsrc\">Source: MCB 2.06 II.B SSPE, Table 5-7; MCB 2.04 Measles Complications</p>","CJD":"<h5>Creutzfeldt-Jakob disease</h5><ul><li>A <b>transmissible spongiform encephalopathy</b> caused by <b>prions</b> (unconventional agent) — the other \"slow\" CNS diseases (SSPE, PML) are conventional viruses</li><li>Triad: <b>progressive dementia, ataxia, myoclonus</b> → death; long incubation, late in life</li><li>Pathology: spongiform change, PrP^Sc amyloid; <b>no inflammation, no immune response, no interferon</b>, normal B/T cells — the \"no inflammation\" clue is the tell</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Type</th><th>Cause</th></tr></thead><tbody><tr><td>Sporadic CJD</td><td>spontaneous PrP^C → PrP^Sc conversion</td></tr><tr><td>Genetic</td><td>PRNP mutation</td></tr><tr><td>Iatrogenic</td><td>contaminated growth hormone, dura mater grafts, surgical instruments (prions survive routine sterilization)</td></tr><tr><td>Kuru</td><td>ritual cannibalism, Papua New Guinea</td></tr><tr><td>BSE / variant CJD</td><td>mad cow</td></tr></tbody></table></div><ul><li>Agent properties: proteinaceous infectious particle, no nucleic acid, &lt;100 nm, cannot be cultured, resists heat/disinfectants/irradiation (inactivate with NaOH, hypochlorite, phenol, periodate)</li><li>Treatment: none; always fatal</li><li>Distractors: \"slow virus\" (SSPE/PML have real viruses), HSV encephalitis (acute, inflammatory, temporal lobe, PCR CSF), rabies (Negri bodies, hydrophobia)</li></ul><p class=\"rsrc\">Source: MCB 2.06 III.B Prion Diseases, Table 9</p>","HIVDIV":"<h5>Why HIV is so variable</h5><ul><li>Two engines: <b>diploid genome</b> (two RNA copies → template switching and <b>recombination</b> during reverse transcription) and an <b>error-prone reverse transcriptase</b> with no proofreading, on top of ~10^10 virions produced/destroyed daily</li><li>Result: each patient carries a <b>quasispecies</b> swarm; env (gp120, esp. V3 loop) mutates constantly while gag/pol are conserved</li><li>Consequences<ul><li>escape from neutralizing antibody and CTLs</li><li>drug resistance under monotherapy → HAART combination needed; genotypic resistance testing of RT/protease genes at diagnosis and at failure</li><li>vaccine failure: extensive envelope variability, no correlates of protection, poor animal models</li><li>tropism shift over years: M-tropic (CCR5) early → T-tropic (CXCR4) late, more cytopathic</li></ul></li><li>Classification: HIV-1 (global; groups M, N, O; chimpanzee SIV) vs HIV-2 (West Africa, sooty mangabey)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Mechanism of viral diversity</th><th>Virus</th></tr></thead><tbody><tr><td>Point mutation by error-prone polymerase</td><td>HIV (RT), influenza drift, enterovirus (VDPV), SARS-CoV-2 variants</td></tr><tr><td>Recombination between templates in one cell</td><td>HIV, enteroviruses (co-infection)</td></tr><tr><td>Reassortment of segments</td><td>influenza A shift, rotavirus, hantavirus</td></tr><tr><td>Antigenically stable</td><td>paramyxoviruses (mumps, measles), rubella</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.06 VI.D HIV Genetic Diversity, env gene; VI.I Viral Evolution</p>","HTLV":"<h5>HTLV-1 (Deltaretrovirus)</h5><ul><li>Causes <b>adult T-cell leukemia-lymphoma (ATL)</b> and HTLV-1-associated myelopathy / <b>tropical spastic paraparesis</b></li><li>Unlike acute transforming retroviruses it <b>does not carry an oncogene</b>; it is a <b>transregulating</b> virus: <b>Tax</b> gene alters transcription of viral and cellular genes → disrupts growth control; slowly transforming (years)</li><li>Marked affinity for mature CD4 T cells; expressed at very low levels; LTR promoter responds to T-cell activation so virus replicates with the cell</li><li>~20 million infected; transmission is cell-associated: <b>breastfeeding (mother-to-child), transfusion, shared needles, sex</b>; early-life infection = highest ATL risk</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>HTLV-1</th><th>HIV</th></tr></thead><tbody><tr><td>Genus</td><td>Deltaretrovirus</td><td>Lentivirus</td></tr><tr><td>Effect on cell</td><td>transforming, non-cytolytic</td><td>cytolytic, non-transforming</td></tr><tr><td>Cancer</td><td>direct: ATL</td><td>indirect via immunosuppression: Kaposi (HHV-8), NHL (EBV), cervical/anal (HPV)</td></tr><tr><td>Key gene</td><td>tax</td><td>tat, rev, nef, vpr, vpu, vif</td></tr></tbody></table></div><ul><li>Retroviral tumor types: highly oncogenic/direct = carry host-derived v-onc; weakly oncogenic/slow = no oncogene, promoter insertion or transactivation (HTLV-1)</li></ul><p class=\"rsrc\">Source: MCB 2.06 V.C Human T-Lymphotropic Viruses, Table 10</p>","EBV":"<h5>EBV (HHV-4, Gammaherpesvirinae) associations</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>EBV-associated</th><th>Details</th></tr></thead><tbody><tr><td>Infectious mononucleosis</td><td>kissing disease; incubation 4-7 wk; fever + pharyngitis + cervical lymphadenopathy, splenomegaly, atypical (Downey) T cells, <b>heterophile antibody +</b> (CMV mono is heterophile-negative)</td></tr><tr>
