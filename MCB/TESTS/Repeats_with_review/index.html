o, bunya, arena) must carry a polymerase and transcribe before translation.<ul class=\"l2\"><li>Their genomes are not infectious.</li></ul></li><li>Positive-sense enveloped viruses (flavi, toga, corona) behave like picornaviruses: the genome is mRNA and one polyprotein is cleaved, but they assemble on the ER and Golgi and leave by exocytosis or budding rather than lysis.</li><li>Retroviruses reverse-transcribe into DNA and integrate.<ul class=\"l2\"><li>Influenza replicates in the nucleus.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.03 Table 3 and Table 14, Positive and Negative Sense</p>","2028-27":"<h5>RotaShield and intussusception</h5><ul class=\"l1\"><li><b>RotaShield</b>, a rhesus-based live oral <b>rotavirus</b> vaccine licensed in 1998, was <b>withdrawn in 1999 because it caused intussusception</b>, the telescoping of one segment of bowel into another.</li><li>The current vaccines are <b>RotaTeq</b> (live attenuated, oral, pentavalent human-bovine reassortant) and <b>Rotarix</b> (live attenuated, oral, monovalent human).<ul class=\"l2\"><li>Both are described in the trans as safe and effective and are the best control strategy worldwide.</li></ul></li><li>Live oral vaccines are used because natural immunity to rotavirus is mucosal.<ul class=\"l2\"><li>The <b>Sabin</b> oral polio vaccine uses the same logic and produces gut <b>IgA</b> that the injected <b>Salk</b> vaccine cannot.</li></ul></li></ul><h5>Vaccine complications and controversies in this course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Problem</th><th>Vaccine</th><th>Detail</th></tr></thead><tbody><tr><td><b>Intussusception</b></td><td>RotaShield</td><td>withdrawn within a year</td></tr><tr><td><b>Vaccine-associated paralytic polio and cVDPV</b></td><td>Sabin OPV</td><td>one case per 2 million doses, type 2 causes 86% of cVDPV, removed in 2015</td></tr><tr><td><b>Antibody-dependent enhancement in seronegatives</b></td><td>Dengvaxia (CYD-TDV)</td><td>the vaccine acts like a first infection, registration revoked in the Philippines, source of vaccine hesitancy</td></tr><tr><td><b>Reactogenicity, then waning immunity</b></td><td>whole-cell pertussis replaced by acellular pertussis</td><td>the trade contributed to pertussis re-emergence</td></tr><tr><td><b>Contraindications</b></td><td>yellow fever 17D</td><td>infants under 9 months, pregnancy, egg allergy, immunocompromised</td></tr><tr><td><b>No therapeutic effect</b></td><td>HPV vaccine</td><td>prophylactic only, Pap smears still needed</td></tr><tr><td><b>Oral vaccine interference</b></td><td>OPV</td><td>immunity blocked if another enterovirus is replicating at the time</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.03 II.A Table 16, MCB 2.10 II.E and Table 12</p>","PIV":"<h5>Parainfluenza viruses</h5><ul class=\"l1\"><li><b>Paramyxoviridae</b>, single-stranded negative-sense non-segmented enveloped RNA.<ul class=\"l2\"><li>The HN protein of <b>parainfluenza</b> and <b>mumps</b> has <b>neuraminidase</b> activity, which the other paramyxoviruses lack.</li><li>The F protein must be cleaved from F0 to F1 for fusion, and fusion occurs at neutral pH at the cell surface.</li></ul></li><li>In the immunocompetent host <b>replication is limited to the respiratory epithelium</b>.<ul class=\"l2\"><li>Viremia, if it occurs at all, is uncommon.</li><li>Infection may involve only the nose and throat and present as a common cold.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Type</th><th>Disease</th><th>Age</th></tr></thead><tbody><tr><td><b>1 and 2</b></td><td><b>croup</b> (laryngotracheobronchitis): swelling of the larynx and upper trachea causing obstruction and a barking cough that is worse at night</td><td>6 to 18 months</td></tr><tr><td><b>3</b></td><td><ul class=\"cl\"><li>spreads deeper to the lower trachea and bronchi, causing bronchiolitis and pneumonia</li><li>The <b>most prevalent</b> type, usually acquired in the first year with antibody by age 2</li></ul></td><td>infants under 6 months</td></tr><tr><td><b>4</b></td><td>rarely serious even on first infection</td><td></td></tr></tbody></table></div><ul class=\"l1\"><li>The <b>most common</b> complication of parainfluenza is otitis media.</li></ul><h5>Immunity and diagnosis</h5><ul class=\"l1\"><li>Types 1, 2 and 3 are distinct serotypes with no significant cross-neutralization.<ul class=\"l2\"><li>Nearly all infants have maternal antibody yet still get infected, and reinfection of older children and adults occurs, usually as afebrile colds.</li><li>Secretory <b>IgA</b> is the <b>most important</b> protection but disappears within months.</li></ul></li><li>Serum antibody targets HN and F. The antibody response becomes less specific with repeated infections because <b>parainfluenza</b> and <b>mumps</b> share antigens, so serology cannot easily tell which paramyxovirus caused a given infection.</li><li><b>Diagnosis</b><ul class=\"l2\"><li><b>RT-PCR</b> of nasopharyngeal washes</li><li>Direct or indirect immunofluorescence on exfoliated cells</li><li>Paired sera showing a <b>fourfold rise</b> by neutralization, HI or ELISA</li></ul></li><li>Transmission is direct person-to-person contact or large droplets, common in schools and hospitals.<ul class=\"l2\"><li>Parainfluenza is strictly human, <b>not zoonotic</b>, unlike <b>Nipah</b> and <b>Hendra</b> in the same family.</li><li>On the ward it is a contact-precaution pathogen (2.09).</li></ul></li></ul><h5>The lower respiratory viruses of childhood compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Peak age</th><th>Season</th><th><b>Hallmark</b></th></tr></thead><tbody><tr><td><b>RSV</b></td><td>under 6 months</td><td>November to January</td><td>bronchiolitis, tropism for ciliated cells, <b>most severe</b> when maternal antibody falls at 2 to 4 months</td></tr><tr><td><b>Human metapneumovirus</b></td><td>6 to 12 months</td><td>February to April</td><td>RSV-like but less bronchiolitis, more pneumonia, receptor αvβ1 integrin</td></tr><tr><td><b>Parainfluenza 1 and 2</b></td><td>6 to 18 months</td><td></td><td>croup</td></tr><tr><td><b>Parainfluenza 3</b></td><td>under 6 months</td><td></td><td>bronchiolitis and pneumonia</td></tr><tr><td><b>Influenza</b></td><td>all ages</td><td></td><td>abrupt fever, myalgia, secondary bacterial pneumonia, Reye syndrome</td></tr><tr><td><b>Adenovirus 3, 7, 21</b></td><td>infants</td><td></td><td>pneumonia with 10% infant mortality</td></tr><tr><td><b>Measles</b></td><td>unvaccinated children</td><td></td><td>giant-cell pneumonia in the immunodeficient, bacterial pneumonia the most lethal complication</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 D.01 Human Parainfluenza Virus, Table 12</p>","SHIFT":"<h5>Antigenic shift versus antigenic drift</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Drift</th><th>Shift</th></tr></thead><tbody><tr><td><b>Kind of change</b></td><td>gradual, minor</td><td>abrupt, major</td></tr><tr><td><b>Mechanism</b></td><td><b>point mutations</b> in the antigenic sites of HA and NA, produced by the error-prone RNA polymerase and selected by antibody pressure as the virus passes from person to person</td><td><ul class=\"cl\"><li><b>genetic reassortment</b> of whole RNA segments when two different influenza A strains, typically a human and an avian or swine strain, co-infect a single cell</li><li>The trans also lists direct transmission and adaptation of an avian virus (receptor change from α2,3 to α2,6 sialic acid) and re-emergence of an old strain as ways a shifted virus can appear</li></ul></td></tr><tr><td><b>Proteins affected</b></td><td>mainly the antigenic regions of HA, with HA and NA changing independently</td><td>new HA or NA subtype</td></tr><tr><td><b>Result</b></td><td>existing antibody no longer neutralizes the virus, seasonal epidemics, yearly vaccine change</td><td>a subtype the population has never met, no immunity, <b>pandemics</b></td></tr><tr><td><b>Which types</b></td><td>A and B (C rarely)</td><td><b>influenza A only</b></td></tr><tr><td><b>Examples</b></td><td>every flu season</td><td>1918 H1N1 (avian, direct adaptation), 1957 H2N2 Asian flu, 1968 H3N2 Hong Kong flu, 2009 H1N1 pandemic, 1950 and 1977 Russian flu as re-emergence</td></tr></tbody></table></div><h5>Why only influenza A can shift</h5><ul class=\"l1\"><li>Influenza A infects many hosts (birds, <b>pigs</b>, horses, seals, humans) and has 18 <b>HA</b> and 11 <b>NA</b> subtypes.<ul class=\"l2\"><li>Pigs carry receptors for both avian and human strains, so they can be co-infected and act as the mixing vessel.</li></ul></li><li>Influenza B has only human strains and influenza C only human and swine strains.<ul class=\"l2\"><li>The three types are defined by antigenic differences in the internal nucleoprotein and matrix proteins, which show no cross-reactivity, so A cannot reassort with B or C.</li></ul></li><li>Only segmented viruses can reassort.<ul class=\"l2\"><li>Influenza has 8 segments.</li><li>Paramyxoviruses (<b>measles</b>, <b>mumps</b>, <b>parainfluenza</b>, <b>RSV</b>) have a single non-segmented genome, so they cannot reassort and their glycoproteins tolerate almost no change, which is why they stay antigenically stable with one serotype.</li></ul></li><li>Segmented RNA viruses are remembered as B-O-A-R: <b>Bunyaviridae</b> (3 segments, <b>hantavirus</b>), <b>Orthomyxoviridae</b> (8), <b>Arenaviridae</b> (2, <b>Lassa</b>), <b>Reoviridae</b> (10 to 12, <b>rotavirus</b>).<ul class=\"l2\"><li>All segmented viruses are RNA viruses.</li><li>Rotavirus and hantavirus reassort by the same principle.</li></ul></li></ul><h5>Nomenclature</h5><ul class=\"l1\"><li>Type, host of origin (omitted for human isolates), geographic origin, strain number, year, then the <b>HA</b> and <b>NA</b> subtype in parentheses.<ul class=\"l2\"><li>A/Hong Kong/03/68 (H3N2) is human, A/swine/Iowa/15/30 (H1N1) is from <b>pigs</b>.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 E Orthomyxoviridae, Antigenic Drift and Shift, Genetic Reassortment, Table 19, MCB 2.01 Table 9</p>","CRS":"<h5>Congenital rubella syndrome</h5><ul class=\"l1\"><li><b>Rubella</b> virus is the sole member of the genus Rubivirus, now in <b>Matonaviridae</b> (formerly <b>Togaviridae</b>).<ul class=\"l2\"><li>It is enveloped, <b>icosahedral</b>, positive-sense single-stranded RNA, has only one serotype, and unlike the true togaviruses is not transmitted by arthropods.</li><li>Because it is positive-sense its RNA works immediately as mRNA.</li></ul></li></ul><h5>Pathogenesis of the congenital syndrome</h5><ol class=\"l1\"><li>Maternal viremia during pregnancy infects the placenta and then the fetus.</li><li>A limited number of fetal cells are infected, and in those cells the growth rate is reduced.</li><li>Reduced growth leads to deranged and hypoplastic organ development and structural anomalies in the newborn.</li><li><b>Timing decides the damage:</b> infection in the first trimester, during organogenesis, causes the most harm, and birth defects are uncommon after the 20th week.</li></ol><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>The classic triad</th><th>Specific findings</th></tr></thead><tbody><tr><td><b>Congenital heart disease</b></td><td>patent ductus arteriosus, atrial and ventricular septal defects, peripheral pulmonary artery stenosis</td></tr><tr><td><b>Ocular defects</b></td><td>cataracts, microphthalmia, glaucoma, retinitis</td></tr><tr><td><b>Hearing loss</b></td><td>sensorineural deafness</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Also seen:</b><ul class=\"l2\"><li>Failure to thrive</li><li>Developmental delay</li><li><b>Microcephaly</b> (associated but not part of the triad)</li><li>Mental retardation</li><li>Meningoencephalitis</li><li>Progressive <b>rubella</b> panencephalitis</li><li>Miscarriage and stillbirth</li><li>Growth retardation</li><li>Radiolucent bone disease</li><li>Hepatosplenomegaly</li><li>Thrombocytopenia with purpuric rash</li><li>Hepatitis</li><li>Pneumonitis</li><li>Insulin-dependent diabetes</li><li>Thyroiditis</li></ul></li></ul><h5>Diagnosis and immunity</h5><ul class=\"l1\"><li>Diagnosis is the demonstration of <b>rubella-specific IgM in the infant</b>.<ul class=\"l2\"><li>Maternal <b>IgM</b> cannot cross the placenta, so infant IgM must have been made in utero.</li><li>Maternal <b>IgG</b> crosses freely and is lost over about 6 months, so infant IgG proves nothing.</li><li>Congenitally infected infants also have impaired rubella-specific cell-mediated immunity.</li></ul></li><li>Prevention is the live attenuated vaccine, a single dose giving more than 95% long-lasting immunity, given as MR, <b>MMR</b> or MMRV.<ul class=\"l2\"><li>The Philippine Pediatric Society gives it at 9 months because maternal antibody persists until the 6th month.</li></ul></li></ul><h5>Congenital infections compared (the TORCH group of 2.02)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Infection</th><th>Signature</th><th>Worst timing</th></tr></thead><tbody><tr><td><b>Rubella</b></td><td>cataract, heart defect, deafness</td><td>first trimester</td></tr><tr><td><b>CMV</b></td><td><ul class=\"cl\"><li>the <b>most common</b> intrauterine viral infection</li><li>Jaundice, petechiae, hepatosplenomegaly, chorioretinitis, microcephaly, periventricular calcification, hearing loss and mental retardation (cytomegalic inclusion disease)</li><li>One third of primary maternal infections transmit</li></ul></td><td>first trimester</td></tr><tr><td><b>Zika</b></td><td>microcephaly, other malformations, preterm birth, miscarriage</td><td>pregnancy, vertical spread</td></tr><tr><td><b>Parvovirus B19</b></td><td>fetal anemia and non-immune hydrops fetalis</td><td>maternal viremia</td></tr><tr><td><b>HSV</b></td><td><ul class=\"cl\"><li>neonatal herpes from the birth canal (skin-eye-mouth, encephalitis, disseminated with 80% mortality)</li><li>Primary infection before 20 weeks causes abortion</li></ul></td><td>delivery</td></tr><tr><td><b>Toxoplasma and syphilis</b></td><td>the T and O of TORCH, not viral</td><td></td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 B.02 Congenital Rubella Syndrome, Tables 4 and 5, MCB 2.02 CMV Congenital Infection</p>","ONETYPE":"<h5>One antigenic type gives lifelong immunity</h5><ul class=\"l1\"><li>Paramyxoviruses are monotypic and antigenically stable for two reasons given in 2.04.<ul class=\"l2\"><li>Their genome is non-segmented, which removes any possibility of <b>reassortment</b>, and nearly every amino acid of their HN, H, G and F glycoproteins has a structural or functional role, so substitutions that would let the virus escape antibody also cripple it.</li><li>They therefore do not undergo <b>antigenic drift</b> despite an error-prone polymerase.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Antigenic types</th><th>Immunity after one infection</th></tr></thead><tbody><tr><td><b>Mumps</b></td><td>1</td><td>permanent, even subclinical infection immunizes, antibody to HN correlates with immunity</td></tr><tr><td><b>Measles</b></td><td>1</td><td><b>lifelong</b>, neutralizing antibody to the H protein</td></tr><tr><td><b>Rubella</b></td><td>1</td><td><b>lifelong</b> IgG, IgM gone in 6 weeks</td></tr><tr><td><b>Yellow fever</b></td><td>1</td><td>17D vaccine protects at least 30 years</td></tr><tr><td><b>West Nile</b></td><td>1</td><td>presumably permanent</td></tr><tr><td><b>Hepatitis A</b></td><td>1 (3 genotypes)</td><td><b>lifelong</b></td></tr><tr><td><b>Poliovirus</b></td><td>3</td><td>type-specific only, no cross-protection</td></tr><tr><td><b>Parainfluenza</b></td><td>1, 2 and 3 distinct</td><td>reinfection common, secretory IgA short-lived</td></tr><tr><td><b>Dengue</b></td><td>4</td><td>serotype-specific, a second serotype causes antibody-dependent enhancement</td></tr><tr><td><b>Rhinovirus</b></td><td>more than 150</td><td>reinfection the rule, <b>no vaccine</b> possible</td></tr><tr><td><b>Influenza</b></td><td>A subtypes, plus drift</td><td>reinfection, yearly vaccine</td></tr><tr><td><b>HIV</b></td><td>quasispecies</td><td>no protective immunity, <b>no vaccine</b> yet</td></tr></tbody></table></div><h5>Mumps in more detail</h5><ul class=\"l1\"><li>Humans are <b>the only</b> host.<ul class=\"l2\"><li>The virus replicates in upper respiratory epithelium, spreads by viremia to salivary glands, testes, ovaries, pancreas, mammary glands and CNS.</li><li>Parotid involvement is not obligatory.</li></ul></li><li>Incubation 14 to 18 days.<ul class=\"l2\"><li>Virus is shed in saliva from 3 days before to 9 days after gland swelling, a third of infections are inapparent yet infectious, and the incubation period varies, which makes control difficult.</li></ul></li><li><b>Clinical:</b><ul class=\"l2\"><li>Painful swelling of one parotid or other salivary glands</li><li>CNS involvement in 10 to 30% (aseptic meningitis that resolves)</li><li>Unilateral orchitis after puberty with pain from swelling inside the tunica albuginea</li></ul></li><li>Antibody to the internal NP protein appears first (3 to 7 days) and disappears within 6 months, antibody to HN develops slowly over 4 weeks and persists for years.<ul class=\"l2\"><li>Maternal antibody makes <b>mumps</b> rare under 6 months.</li></ul></li><li>Diagnosis by <b>RT-PCR</b>, or paired sera with a fourfold rise (ELISA or HI).<ul class=\"l2\"><li>Prevention is the live attenuated vaccine in <b>MMR</b>, which produces a subclinical, non-communicable infection.</li></ul></li></ul><h5>Measles and rubella share the same principle</h5><ul class=\"l1\"><li><b>Measles</b><ul class=\"l2\"><li>One antigenic type, with <b>lifelong</b> immunity attributed to antibody against the H protein</li><li>The infection also suppresses cell-mediated immunity for months and predisposes to bacterial infection</li></ul></li><li><b>Rubella</b><ul class=\"l2\"><li>One serotype, <b>IgG</b> for life</li><li>The live vaccine matches natural infection</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 D Paramyxoviridae Genetic and Antigenic Stability, D.02 Mumps Immunity, D.03 Measles Immunity, B.01 Rubella Immunity</p>","DRIFT":"<h5>What antigenic drift does</h5><h5>The mechanism as the trans describes it</h5><ol class=\"l1\"><li>The influenza RNA polymerase is error-prone, so <b>point mutations</b> accumulate in the genes for <b>HA</b> and <b>NA</b>.</li><li>Antibodies in person A focus on a single antigenic region of HA.<ul class=\"l2\"><li>A mutant that replaces one critical amino acid in that region escapes those antibodies.</li></ul></li><li>The mutant survives, multiplies and is passed to person B, whose antibodies attack different regions, selecting a new escape mutant.<ul class=\"l2\"><li>The process repeats at each person.</li></ul></li><li>The result is that <b>the body's existing antibodies no longer recognize and neutralize the newer virus</b>, which is why drift causes seasonal epidemics and why the vaccine is reformulated every year.</li></ol><ul class=\"l1\"><li>Immune pressure in adults, who have met many strains, drives the virus toward higher receptor affinity.<ul class=\"l2\"><li>When such high-affinity mutants pass to immunologically naive children, receptor affinity falls again.</li></ul></li><li><b>What drift is not:</b> it does not produce a new HA or NA subtype, does not cause pandemics and does not need an animal host.<ul class=\"l2\"><li>Those belong to shift.</li></ul></li><li>Internal proteins (NP and M) do not undergo antigenic change, which is why they define the types A, B and C and why cytotoxic T cells that recognize them are cross-reactive across subtypes.</li></ul><h5>Immunity to influenza</h5><ul class=\"l1\"><li>HA-specific antibody is the <b>most important</b> protection because it blocks attachment, and <b>NA</b> antibody is also protective.<ul class=\"l2\"><li><b>IgA</b> and some <b>IgM</b> act at the mucosa.</li></ul></li><li>The three types are antigenically unrelated and give no cross-protection.<ul class=\"l2\"><li>A person with antibody to the original strain gets only mild disease from a drifted strain.</li><li>Original antigenic sin means later infections reinforce the antibody response to the first subtype ever met.</li></ul></li><li>Cell-mediated immunity clears established infection.<ul class=\"l2\"><li>Aging weakens macrophage TLR expression, NK numbers, dendritic-cell antigen capture, B-cell antibody diversity and CD8 granzyme and IFN-γ production, which is why the elderly do badly.</li></ul></li><li><b>Vaccines</b><ul class=\"l2\"><li>Inactivated parenteral</li><li>Intradermal quadrivalent</li><li>Live attenuated nasal</li><li>Given yearly from 6 months of age</li></ul></li></ul><h5>Other viruses that vary by point mutation</h5><ul class=\"l1\"><li><b>HIV</b> (error-prone <b>reverse transcriptase</b> plus <b>recombination</b>, producing <b>quasispecies</b>), enteroviruses including vaccine-derived <b>poliovirus</b> (about one error per genome copy), <b>SARS-CoV-2</b> variants (several hundred, from <b>point mutations</b> that stabilize spike binding), and rhinovirus with its 150 serotypes.<ul class=\"l2\"><li>Paramyxoviruses and <b>rubella</b> are the stable <b>exceptions</b>.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 E Antigenic Drift and Shift, Immunity, Effect of Aging, Table 19</p>","FLUDEATH":"<h5>Influenza kills the cells it infects</h5><ul class=\"l1\"><li>Influenza infection is lytic.<ul class=\"l2\"><li>It destroys the superficial mucosa of the respiratory tract but spares the basal layer, and complete repair takes about a month.</li></ul></li><li><b>Two mechanisms of cell death:</b> the virus shuts off host synthesis and lyses the cell, and cytotoxic CD8 T cells recognize viral peptides presented on MHC I and release granzymes and perforin that kill the infected cell.<ul class=\"l2\"><li>Activated T cells also secrete interferons, TNF and IL-2.</li></ul></li><li>The damaged epithelium loses ciliary clearance, phagocytes malfunction and alveolar exudate becomes a culture medium, which is why secondary bacterial pneumonia with <b>Staphylococcus aureus</b>, Streptococcus pneumoniae or Haemophilus influenzae follows, especially in the elderly and debilitated.</li><li><b>HA</b> has to be cleaved into HA1 and HA2 by host proteases for the virus to fuse, and those proteases exist only in the respiratory tract, so seasonal influenza stays there.<ul class=\"l2\"><li>The amino terminus of HA2 mediates fusion.</li></ul></li></ul><h5>Outcomes of viral infection for the host cell, across the course</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Outcome</th><th>Pattern</th><th>Examples</th></tr></thead><tbody><tr><td><b>Cell death</b></td><td>lytic infection with cytopathic effect</td><td>influenza, poliovirus and other enteroviruses, HSV lytic cycle, poxvirus, adenovirus, yellow fever hepatocytes, rabies neurons</td></tr><tr><td><b>Persistent chronic infection</b></td><td>low-level production without clearance</td><td>hepatitis B, hepatitis C</td></tr><tr><td><b>Latent infection</b></td><td>genome persists and reactivates later</td><td>HSV, VZV, EBV, CMV, JC and BK viruses</td></tr><tr><td><b>Transformation</b></td><td>unregulated growth and tumor</td><td>HPV, EBV, HTLV-1, HBV</td></tr><tr><td><b>Abortive infection</b></td><td>non-permissive cell, no progeny</td><td>hepatitis D without hepatitis B</td></tr><tr><td><b>Non-cytolytic persistence</b></td><td>provirus stays for the life of the cell</td><td>most retroviruses, with lentiviruses such as HIV as the cytocidal exception</td></tr></tbody></table></div><h5>Clinical consequences</h5><ul class=\"l1\"><li><b>Uncomplicated influenza:</b><ul class=\"l2\"><li>Abrupt chills</li><li>Headache</li><li>Dry cough</li><li>High fever for 3 to 5 days</li><li>Myalgia</li><li>Malaise</li><li>Anorexia</li></ul></li><li><b>Pneumonia</b><ul class=\"l2\"><li>Viral, bacterial or mixed</li><li>Usually in the elderly and those with <b>chronic</b> disease</li></ul></li><li><b>Reye syndrome:</b> acute encephalopathy with fatty liver in children and adolescents aged 2 to 16.</li><li>Influenza spreads by <b>airborne</b> droplets and contaminated hands and surfaces.<ul class=\"l2\"><li>In the hospital it is a droplet-precaution pathogen (2.09) and the environment is a minor reservoir because the virus survives only 1 to 2 days.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 E Orthomyxoviridae Pathogenesis, Clinical Findings, Immune Response, MCB 2.01 Table 22</p>","RUBIGG":"<h5>Maternal antibody in postnatal rubella</h5><ul class=\"l1\"><li>Immune mothers transfer <b>rubella</b> <b>IgG</b> across the placenta, and the infant is protected for <b>4 to 6 months</b>.<ul class=\"l2\"><li>The antibody is lost over a period of about 6 months.</li></ul></li><li>This is why the Pediatric Society of the Philippines recommends the rubella-containing vaccine at 9 months: maternal antibody persists until the 6th month and would otherwise neutralize a live vaccine.</li><li><b>Postnatal rubella immunity:</b> antibodies appear as the rash fades and titers rise for 1 to 3 weeks.<ul class=\"l2\"><li>The initial <b>IgM</b> does not persist beyond 6 weeks, whereas IgG persists for life.</li><li>Because there is only one antigenic type, one attack gives <b>lifelong</b> immunity, and IgG is the marker of that immunity.</li></ul></li><li><b>Serology pair:</b> IgM develops shortly after primary infection or vaccination and becomes detectable by day 4 after rash onset, peaking in 1 to 2 weeks.<ul class=\"l2\"><li>IgG indicates past infection or vaccination.</li><li>Specimens are nasopharyngeal or throat swab, urine, and serum.</li></ul></li></ul><h5>How long maternal antibody protects, virus by virus</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Duration of infant protection and the consequence</th></tr></thead><tbody><tr><td><b>Rubella</b></td><td>4 to 6 months, vaccine at 9 months</td></tr><tr><td><b>Measles</b></td><td>months, vaccine at 9 months (MCV1) with a second dose later</td></tr><tr><td><b>Mumps</b></td><td>about 6 months, so mumps is rare in infants under 6 months</td></tr><tr><td><b>Poliovirus</b></td><td>up to 6 months, via placenta and breast milk</td></tr><tr><td><b>Rotavirus</b></td><td>protects under 6 months from severe disease</td></tr><tr><td><b>RSV</b></td><td>falls by 2 to 4 months, which is exactly when severe bronchiolitis occurs</td></tr><tr><td><b>HSV</b></td><td>lost in the first 6 months, so the peak of primary herpes is 6 months to 2 years</td></tr><tr><td><b>Adenovirus</b></td><td>protects newborns against severe respiratory disease</td></tr><tr><td><b>Parainfluenza</b></td><td>present in virtually all infants but does not prevent infection</td></tr><tr><td><b>Enteroviruses</b></td><td>transplacental and breast milk antibody protect infants</td></tr><tr><td><b>HIV</b></td><td>maternal antibody crosses and interferes with serology, so infant diagnosis needs RNA or DNA PCR</td></tr></tbody></table></div><h5>Passive versus active immunity</h5><ul class=\"l1\"><li>Natural passive immunity is transplacental <b>IgG</b> and breast-milk <b>IgA</b>.<ul class=\"l2\"><li><b>Artificial passive immunity is immunoglobulin:</b><ul class=\"l3\"><li>Varicella-zoster immune globulin</li><li>Hepatitis B immune globulin</li><li><b>Rabies</b> immune globulin</li><li>Immune globulin for hepatitis A or parvovirus</li></ul></li><li>Active immunity comes from infection or vaccination and is what produces <b>lifelong</b> IgG.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 B.01 Post Natal Rubella Immunity and Laboratory Diagnosis, Table 3</p>","MERS":"<h5>Coronaviridae and their animal origins</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Genus</th><th>Receptor</th><th>Reservoir</th><th>Intermediate host</th><th>Year and disease</th></tr></thead><tbody><tr><td><b>HCoV-229E, NL63</b></td><td>Alphacoronavirus</td><td>aminopeptidase N (229E)</td><td></td><td></td><td>common cold</td></tr><tr><td><b>HCoV-OC43, HKU1</b></td><td>Betacoronavirus</td><td></td><td></td><td></td><td>common cold</td></tr><tr><td><b>SARS-CoV</b></td><td>Betacoronavirus</td><td><b>ACE2</b></td><td>bats</td><td>civet cats</td><td>2003, severe acute respiratory syndrome</td></tr><tr><td><b>MERS-CoV</b></td><td>Betacoronavirus</td><td><b>DPP4, also called CD26</b></td><td>bats</td><td><b>dromedary camels</b></td><td>2012, Middle East respiratory syndrome</td></tr><tr><td><b>SARS-CoV-2</b></td><td>Betacoronavirus</td><td>ACE2 with the TMPRSS2 co-receptor</td><td>bats</td><td>pangolins</td><td>2019, COVID-19</td></tr></tbody></table></div><h5>Structure and replication</h5><ul class=\"l1\"><li>Enveloped, <b>helical</b> nucleocapsid, positive-sense single-stranded non-segmented RNA.<ul class=\"l2\"><li>The four structural proteins are N (binds the RNA), S (the spike, critical for receptor binding and entry, the most potent entry determinant), E (interacts with M to form the envelope) and M (the central organizer of assembly that shapes the envelope).</li></ul></li><li>Because the genome is positive-sense it is already infectious and acts as mRNA the moment it reaches the <b>cytoplasm</b>.<ul class=\"l2\"><li>Replication is cytoplasmic.</li><li>The particle is internalized by absorptive endocytosis, or S fuses the envelope directly with the membrane.</li></ul></li></ul><h5>COVID-19 pathogenesis in brief</h5><ol class=\"l1\"><li>The S protein binds <b>ACE2</b> on alveolar cells.</li><li>Infected alveoli and activated alveolar macrophages release cytokines and chemokines (IL-1, 2, 4, 6, 7, 10, 12, 13, 17, IP-10, MCP-1, TNF-α, IFN-γ and others).</li><li>Lymphopenia and <b>cytokine storm</b> follow, with T-cell exhaustion, viral sepsis and inflammation-induced lung injury.</li><li>Severe cases show ARDS, respiratory failure, metabolic acidosis, coagulopathy with high D-dimer, septic shock and multiple organ failure.<ul class=\"l2\"><li>Fatal cases show neutrophilia with a falling lymphocyte count.</li></ul></li></ol><ul class=\"l1\"><li>Incubation 1 to 14 days, mostly 3 to 7.<ul class=\"l2\"><li>Fever, dry cough, myalgia, fatigue, dyspnea and anorexia, with some atypical presentations of diarrhea and nausea.</li></ul></li><li><b>Diagnosis</b><ul class=\"l2\"><li><b>RT-qPCR</b> targeting ORF1ab, N and E is the foundational test</li><li>Rapid antigen lateral-flow tests (nucleocapsid) are used for screening</li><li>Reverse transcription is needed because <b>PCR</b> amplifies DNA and the genome is RNA</li></ul></li></ul><h5>Zoonotic versus purely human viruses (the \"EXCEPT\" pattern)</h5><ul class=\"l1\"><li><b>Zoonotic:</b> SARS, MERS, <b>SARS-CoV-2</b> (bat origin), <b>Nipah</b> and <b>Hendra</b> (<b>Pteropus</b> bats), avian influenza, <b>rabies</b>, <b>hantavirus</b>, <b>Ebola</b>, <b>Lassa</b>, <b>Mpox</b>.<ul class=\"l2\"><li>About 75% of emerging infections are <b>zoonotic</b> (2.10).</li></ul></li><li><b>Human-only:</b><ul class=\"l2\"><li><b>Parainfluenza</b></li><li><b>Mumps</b></li><li><b>Measles</b></li><li><b>Rubella</b></li><li><b>Poliovirus</b></li><li><b>HIV</b> (now)</li><li>Smallpox</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 C Coronaviridae, Tables 6 to 9, 2028 Trans review question 4</p>","HENIPA":"<h5>Henipaviruses</h5><ul class=\"l1\"><li><b>Paramyxoviridae</b>, genus Henipavirus.<ul class=\"l2\"><li>Enveloped, negative-sense non-segmented RNA, so they carry their own polymerase.</li><li><b>Zoonotic</b>, infecting <b>pigs</b>, dogs, cats and horses as well as humans.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Species</th><th>Key facts</th></tr></thead><tbody><tr><td><b>Nipah</b></td><td><ul class=\"cl\"><li>first recognized in 1999 among pig farmers in Sungai Nipah, Malaysia, with 300 cases and more than 100 deaths</li><li>Bats infected pigs, and people in close contact with sick pigs fell ill</li><li>Outbreaks since then in Bangladesh, India, Malaysia, Singapore and the Philippines</li><li>The Philippine outbreak in Sultan Kudarat in 2014 had 17 cases and 9 deaths (CFR 53%), linked to slaughtering sick horses and eating undercooked horse meat, with human-to-human spread documented</li></ul></td></tr><tr><td><b>Hendra</b></td><td><ul class=\"cl\"><li>identified in 1994 in Hendra, Australia, in horses and people</li><li>Bats infect horses through bites, urine, droppings and saliva, and horses infect the humans who handle them</li><li>Only 7 human cases ever, 57% fatal</li><li>A vaccine exists for horses only</li></ul></td></tr><tr><td><b>Langya</b></td><td>identified in <b>August 2022 among febrile human cases in Eastern China</b></td></tr><tr><td><b>Mojiang, Cedar, Ghanaian</b></td><td>not known to cause human disease</td></tr></tbody></table></div><ul class=\"l1\"><li>The reservoir is the <b>Pteropus fruit bat (flying fox)</b>, found throughout Asia, the South Pacific and Australia, including the Philippines, where 13.6% of tested flying foxes were seropositive.</li></ul><h5>Transmission and clinical picture</h5><ul class=\"l1\"><li>Direct animal-to-human spillover from bats, <b>pigs</b> or horses, foodborne spread through fruit or raw date palm sap soiled by bats, and human-to-human spread through close contact with body fluids.</li><li>Incubation 4 to 14 days.<ul class=\"l2\"><li>Fever, headache, cough, sore throat and difficulty breathing for 3 to 14 days, then in some patients encephalitis with confusion, drowsiness and seizures, and coma within 24 to <b>48 hours</b>.</li><li>Case fatality is highest in the encephalitic form.</li></ul></li><li>There is <b>no human vaccine</b> and <b>no antiviral</b>, so <b>prevention is avoidance</b>: no contact with flying foxes, sick pigs or horses and their excretions, wash hands, avoid roosting areas, boil date palm juice and wash fruit, wear gloves and protective clothing when handling or slaughtering sick animals, keep pig feed and sheds protected from bats, and use standard plus contact and <b>droplet precautions</b> in hospital.</li></ul><h5>Zoonotic viruses to group together for the \"EXCEPT\" question</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Zoonotic</th><th>Animal source</th></tr></thead><tbody><tr><td><b>Nipah, Hendra</b></td><td>fruit bats, pigs, horses</td></tr><tr><td><b>MERS, SARS, SARS-CoV-2</b></td><td>bats through camels, civets, pangolins</td></tr><tr><td><b>Avian influenza H5N1, H7N9</b></td><td>poultry and wild birds</td></tr><tr><td><b>Rabies</b></td><td>dogs, bats, wild carnivores</td></tr><tr><td><b>Hantavirus, Lassa</b></td><td>rodents</td></tr><tr><td><b>Ebola, Marburg</b></td><td>fruit bats</td></tr><tr><td><b>Japanese encephalitis, West Nile</b></td><td>birds and pigs through mosquitoes</td></tr><tr><td><b>Mpox, cowpox</b></td><td>rodents and other animals</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Not zoonotic:</b><ul class=\"l2\"><li><b>Parainfluenza</b> (strictly person to person)</li><li><b>Mumps</b></li><li><b>Measles</b></li><li><b>Rubella</b></li><li><b>RSV</b></li><li><b>Poliovirus</b></li><li>Smallpox</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 D.04 Nipah, D.05 Hendra, MCB 2.10 IV Nipah Virus, Table 17</p>","2028-82":"<h5>Syncytium formation in paramyxoviruses</h5><h5>How a syncytium forms</h5><ol class=\"l1\"><li>An infected cell expresses the attachment glycoprotein (HN, H or G) and the fusion glycoprotein F0 on its surface.</li><li>If host proteases are present, F0 is cleaved to the active F1.</li><li>Active F1 fuses the membrane of the infected cell with the membranes of receptor-bearing neighbouring cells.</li><li>The result is a large multinucleated giant cell, the <b>syncytium</b>, which is a common response and <b>hallmark</b> of paramyxovirus infection.</li></ol><ul class=\"l1\"><li><b>Consequences of syncytium formation</b><ul class=\"l2\"><li>Direct cell-to-cell spread that hides the virus from antibody</li><li>The giant cells seen in <b>Koplik spots</b> and in <b>measles</b> giant-cell pneumonia</li><li>The characteristic cytopathic effect of <b>RSV</b>, measles and <b>mumps</b> in culture</li><li>Tissue damage</li></ul></li><li><b>What syncytia do not do:</b> they do not cause viral genetic mutation.<ul class=\"l2\"><li>Paramyxoviruses are antigenically stable because their genome is non-segmented and their glycoproteins tolerate almost no substitutions.</li></ul></li><li>The same F protein also lets the virion fuse at neutral pH with the cell surface, so paramyxoviruses bypass the endosome.<ul class=\"l2\"><li>If F0 is not cleaved there is no fusion, no penetration and no infection.</li></ul></li><li><b>Inclusion bodies:</b> acidophilic cytoplasmic inclusions containing nucleocapsids mark the sites of viral synthesis, because RNA viruses replicate in the <b>cytoplasm</b>.<ul class=\"l2\"><li>Measles also produces intranuclear inclusions.</li></ul></li></ul><h5>Viruses that produce syncytia or giant cells</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Where the giant cells are seen</th></tr></thead><tbody><tr><td><b>RSV</b></td><td>named for it, in culture and in the airway epithelium</td></tr><tr><td><b>Measles</b></td><td>Koplik spots, giant-cell pneumonia in the immunodeficient, multinucleated giant cells with intranuclear and intracytoplasmic inclusions in culture</td></tr><tr><td><b>Mumps</b></td><td>syncytia and hemadsorption in culture</td></tr><tr><td><b>Parainfluenza</b></td><td>syncytia in culture</td></tr><tr><td><b>HSV-1, HSV-2 and VZV</b></td><td>multinucleated giant cells on Tzanck or Giemsa smear of a vesicle base</td></tr><tr><td><b>CMV</b></td><td>cytomegalic cells with owl's-eye inclusions, sometimes multinucleated</td></tr><tr><td><b>HIV</b></td><td>CD4 T-cell syncytia driven by gp41</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 D Paramyxoviridae Viral Replication, Syncytium Formation and Inclusion Bodies, MCB 2.01 CPE</p>","2028-83":"<h5>Why measles produces a rash</h5><ol class=\"l1\"><li>The virus enters through the respiratory tract and multiplies locally, then in regional lymph nodes.</li><li>Primary viremia disseminates it to the reticuloendothelial system where it replicates further.</li><li>Secondary viremia seeds the epithelial surfaces, skin, respiratory tract and conjunctiva, where focal replication occurs.</li><li>The maculopapular rash appears on about day 14, <b>exactly when circulating antibody (IgM, then IgG) becomes detectable</b>.<ul class=\"l2\"><li>The rash is therefore immune-mediated: sensitized lymphocytes, antibody and complement react with viral antigen on the endothelial cells of dermal capillaries and form immune complexes.</li></ul></li></ol><ul class=\"l1\"><li>The proof of the mechanism is that patients with defective cell-mediated immunity may develop no rash at all and instead get giant-cell pneumonia.</li><li><b>Rubella works the same way:</b> antibody appears at the same time as the rash, which the trans says suggests an immunological basis.</li></ul><h5>Measles clinical picture</h5><ul class=\"l1\"><li>Prodrome of fever, sneezing, coughing, runny nose, red eyes with photophobia, and <b>Koplik spots</b>, which are small bluish-white ulcerations on the buccal mucosa opposite the lower molars, appear slightly before the rash and contain giant cells and viral antigen.<ul class=\"l2\"><li>They are <b>pathognomonic</b>.</li></ul></li><li>The rash starts on the head and spreads to the chest, trunk and limbs as pink discrete maculopapules that coalesce into blotches and turn brownish in 5 to 10 days.<ul class=\"l2\"><li>Lymphopenia is typical.</li><li>Patients are contagious during the prodrome and the first 2 to 5 days of rash.</li></ul></li><li><b>Complications:</b><ul class=\"l2\"><li>Otitis media is the <b>most common</b></li><li>Secondary bacterial pneumonia the most life-threatening</li><li>Giant-cell pneumonia in the immunodeficient</li><li>Acute encephalitis in 1 per 1,000</li><li>Acute disseminated encephalomyelitis (autoimmune to myelin basic protein)</li><li>SSPE years later</li></ul></li><li><b>Measles</b> causes months of immune suppression and yet gives <b>lifelong</b> immunity through neutralizing antibody to the H protein.<ul class=\"l2\"><li>Diagnosis by <b>RT-PCR</b> or a fourfold rise in ELISA or HI titer.</li><li>Prevention is the live <b>MMR</b> vaccine, and in hospital it needs <b>airborne</b> isolation (2.09).</li></ul></li></ul><h5>How other rashes arise</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Rash</th><th>Mechanism</th></tr></thead><tbody><tr><td><b>Measles and rubella</b></td><td>immune reaction to viral antigen in dermal endothelium, timed with antibody</td></tr><tr><td><b>Parvovirus B19</b></td><td>appears once antibody forms, so the child is no longer infectious</td></tr><tr><td><b>Dengue</b></td><td>cytokine, complement and coagulation response, petechiae from thrombocytopenia and plasma leakage</td></tr><tr><td><b>Varicella and smallpox</b></td><td>direct viral replication in the skin producing vesicles</td></tr><tr><td><b>Hand-foot-and-mouth disease</b></td><td>direct enterovirus replication in skin, vesicles heal without crusting</td></tr><tr><td><b>Roseola</b></td><td>rash appears as the fever breaks</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 D.03 Measles Pathogenesis and Clinical Findings, Table 13, 2.04 review question 4</p>","2028-85":"<h5>RSV pathogenesis in the airway</h5><ol class=\"l1\"><li><b>RSV</b> enters the upper respiratory tract and <b>mainly targets the ciliated cells of the large airways</b>, causing cell rounding and detachment from the apical side of the epithelium.</li><li>Infection spreads to the lower respiratory tract and bronchioles, where replication is more efficient.</li><li><b>Ciliated cells</b> slough off and the debris accumulates in the airway lumen.</li><li>Epithelial damage lets virus and cytokines reach airway smooth muscle, promoting inflammation and hyperreactivity that narrows already small airways.</li><li>Infection of basal cells drives goblet-cell proliferation and mucus production, and eosinophils and large numbers of neutrophils are recruited.</li><li>Neutrophils release extracellular traps (NETs) of DNA, histones and antimicrobial proteins that accumulate in the small airways.</li><li>Mucus, debris and NETs obstruct the narrow bronchial ducts, causing alveolar collapse, acute inflammation and the lung pathology of <b>bronchiolitis</b>.</li></ol><ul class=\"l1\"><li>Receptors are CX3CR1 and CR1.<ul class=\"l2\"><li>Giant cells and intracytoplasmic inclusions are typical of this paramyxovirus.</li><li>Viremia is rare and incubation 3 to 5 days.</li><li>Very young children carry high viral titers in secretions.</li></ul></li></ul><h5>Clinical spectrum and immunity</h5><ul class=\"l1\"><li>Inapparent infection, common cold, pneumonia in infants, and <b>bronchiolitis</b> in very young babies with wheezing, dyspnea, tachypnea, fatigue, fever and cough, which can be rapidly fatal.<ul class=\"l2\"><li>Infants may show only irritability, poor feeding, lethargy or apnea.</li></ul></li><li>Maternal neutralizing antibody protects against lower respiratory disease, and severe <b>RSV</b> strikes at 2 to 4 months as it falls.<ul class=\"l2\"><li>RSV does not engage a good memory response: IgG-producing memory B cells appear but IgA-producing ones do not, so reinfection is common.</li></ul></li><li><b>Diagnosis:</b> real-time <b>RT-PCR</b> is more sensitive than culture or antigen testing, antigen tests work in children but poorly in adults.<ul class=\"l2\"><li>Hospital precautions are contact plus droplet, and RSV survives only hours on surfaces so hands and air matter more than the environment (2.09).</li></ul></li></ul><h5>RSV versus human metapneumovirus</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>RSV</th><th>hMPV</th></tr></thead><tbody><tr><td><b>Peak age</b></td><td>young infant under 6 months</td><td>older infant 6 to 12 months</td></tr><tr><td><b>Season</b></td><td>November to January</td><td>February to April</td></tr><tr><td><b>Receptor</b></td><td>CX3CR1, CR1</td><td>αvβ1 integrin</td></tr><tr><td><b>Disease</b></td><td>bronchiolitis most, pneumonia, asthma exacerbation</td><td>pneumonia more, bronchiolitis less, croup, otitis media</td></tr><tr><td><b>Incidence</b></td><td>more common than hMPV</td><td>less common than RSV but more than parainfluenza</td></tr><tr><td><b>Risk groups</b></td><td>prematurity, young age, comorbidity, daycare</td><td>prematurity, comorbidity, elderly, immunocompromised</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.04 D.06 Human RSV, Tables 15 and 16, D.07 Metapneumovirus, Table 17</p>","2028-86":"<h5>The influenza glycoproteins and their jobs</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Protein</th><th>Location</th><th>Function</th></tr></thead><tbody><tr><td><b>Hemagglutinin (HA)</b></td><td>envelope spike</td><td><ul class=\"cl\"><li>binds sialic acid on the cell to attach the virus, agglutinates red cells (the basis of hemagglutination tests), and must be cleaved into HA1 and HA2 by host proteases for fusion</li><li>It is the major antigen against which neutralizing antibody is directed, and its variability drives new strains</li></ul></td></tr><tr><td><b>Neuraminidase (NA)</b></td><td>envelope spike</td><td><ul class=\"cl\"><li>a <b>sialidase that removes sialic acid from glycoconjugates</b></li><li>This <b>releases newly budded virions from the infected cell surface</b>, prevents virions from clumping to one another, and <b>helps the virus move through the mucin layer</b> of the respiratory tract to reach epithelial cells</li><li>It works at the end of the replication cycle and is the target of oseltamivir (Tamiflu) and peramivir</li></ul></td></tr><tr><td><b>M2</b></td><td>envelope</td><td>proton channel that acidifies the virion during uncoating</td></tr><tr><td><b>M1</b></td><td>beneath the envelope</td><td>matrix protein linking envelope and ribonucleoproteins</td></tr><tr><td><b>NP with PA, PB1, PB2</b></td><td>the eight vRNPs</td><td><ul class=\"cl\"><li>nucleoprotein and the three polymerase subunits</li><li>NP and M define types A, B and C</li></ul></td></tr></tbody></table></div><ul class=\"l1\"><li>All three listed <b>neuraminidase</b> functions are correct, so \"all of the above\" is the answer.</li><li><b>The pairing to remember:</b> <b>HA</b> gets the virus in at the start of the cycle, <b>NA</b> lets progeny out at the end.</li></ul><h5>Neuraminidase in other viruses</h5><ul class=\"l1\"><li>Among the paramyxoviruses only the HN protein of <b>parainfluenza</b> and <b>mumps</b> has <b>neuraminidase</b> activity, which presumably prevents self-aggregation of virions.<ul class=\"l2\"><li><b>Measles</b> (H protein) and <b>RSV</b> (G protein) lack it.</li></ul></li></ul><h5>HA and NA in the laboratory</h5><ul class=\"l1\"><li><b>Hemadsorption:</b> red cells stick to infected cells in culture 3 to 5 days after inoculation.<ul class=\"l2\"><li><b>Hemagglutination:</b> virus in culture fluid clumps red cells.</li><li>The hemagglutination inhibition (HI) test is the routine serodiagnostic test on paired sera, and rapid antigen tests detect nucleoprotein or surface glycoproteins in swabs.</li><li><b>RT-PCR</b> is the <b>most sensitive</b> and specific.</li></ul></li><li><b>Subtypes:</b> 18 <b>HA</b> (H1 to H18) and 11 <b>NA</b> (N1 to N11), found in many combinations in humans and animals.<ul class=\"l2\"><li>Only type A is subtyped this way.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.04 E Hemagglutinin and Neuraminidase, Laboratory Diagnosis, 2.04 review question 7</p>","ZIKA":"<h5>Zika virus</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Feature</th><th>Zika</th></tr></thead><tbody><tr><td><b>Family</b></td><td>Flaviviridae, genus Flavivirus, enveloped positive-sense RNA, 50 nm, related to dengue, yellow fever, JE and West Nile</td></tr><tr><td><b>Vectors</b></td><td>Aedes aegypti and Aedes albopictus, day-biting container breeders</td></tr><tr><td><b>Reservoir</b></td><td><ul class=\"cl\"><li>non-human primates and humans</li><li>Humans are not a <b>dead-end host</b>, they amplify the virus</li></ul></td></tr><tr><td><b>Other routes</b></td><td><b>mother to fetus, sexual contact</b>, blood transfusion, organ transplantation</td></tr><tr><td><b>Incubation</b></td><td>3 to 14 days, and most infections are asymptomatic</td></tr><tr><td><b>Illness</b></td><td>rash, fever, <b>non-purulent conjunctivitis</b>, muscle and joint pain, malaise and headache for 2 to 7 days</td></tr><tr><td><b>Complications</b></td><td><ul class=\"cl\"><li><b>congenital Zika syndrome with microcephaly</b>, other malformations, preterm birth and miscarriage</li><li>In adults and children, <b>Guillain-Barré syndrome</b>, neuropathy and transverse myelitis (flaccid paralysis in infants)</li></ul></td></tr><tr><td><b>Treatment and vaccine</b></td><td><ul class=\"cl\"><li>none</li><li>Symptomatic care, pregnancy planning, avoidance of bites and of travel to affected areas</li></ul></td></tr></tbody></table></div><ul class=\"l1\"><li><b>History:</b> identified in a rhesus monkey in the <b>Zika</b> forest of Uganda in 1947, first human cases in 1952, first large outbreak on Yap Island in 2007, the Brazilian outbreak of 2015 with the <b>microcephaly</b> link in October 2015 and the GBS link in July 2015.<ul class=\"l2\"><li>Found in 86 countries including the Philippines, and once included in DOH vector-borne surveillance.</li></ul></li></ul><h5>Arboviruses matched with their main manifestation (the Q94 pattern)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Family</th><th>Main manifestation</th><th>Also</th></tr></thead><tbody><tr><td><b>Dengue</b></td><td>Flaviviridae</td><td>breakbone fever, then hemorrhagic fever and shock through antibody-dependent enhancement</td><td>retro-orbital headache, saddleback fever, measles-like rash</td></tr><tr><td><b>Chikungunya</b></td><td>Togaviridae</td><td>prolonged severe polyarthralgia from synovial tropism</td><td>rash in half, rarely fatal</td></tr><tr><td><b>Zika</b></td><td>Flaviviridae</td><td>microcephaly in the fetus, Guillain-Barré in adults</td><td>conjunctivitis, rash</td></tr><tr><td><b>Japanese encephalitis</b></td><td>Flaviviridae</td><td>encephalitis with permanent neurologic sequelae</td><td>pigs amplify, rice fields</td></tr><tr><td><b>Yellow fever</b></td><td>Flaviviridae</td><td>hemorrhagic fever with jaundice, Councilman bodies</td><td>urban and jungle cycles</td></tr><tr><td><b>West Nile and St. Louis encephalitis</b></td><td>Flaviviridae</td><td>febrile illness or neuroinvasive disease</td><td>Culex, birds, humans dead-end</td></tr><tr><td><b>Eastern equine encephalitis</b></td><td>Togaviridae</td><td>encephalitis with 30% mortality</td><td>horses and humans dead-end</td></tr></tbody></table></div><ul class=\"l1\"><li>The three arbovirus syndromes are undifferentiated fever, encephalitis and hemorrhagic fever.<ul class=\"l2\"><li>Which one develops depends on where the virus multiplies most.</li></ul></li></ul><h5>The other viruses that endanger a pregnancy</h5><ul class=\"l1\"><li><b>Rubella</b> gives the triad of cataract, heart defect and deafness in the first trimester.<ul class=\"l2\"><li><b>CMV</b> is the <b>most common</b> intrauterine viral infection with hearing loss and periventricular calcification.</li><li>Parvovirus B19 causes <b>hydrops fetalis</b>.</li><li>HSV is acquired in the birth canal.</li><li><b>HIV</b> and <b>hepatitis B</b> are transmitted perinatally and by breastfeeding.</li><li><b>Zika</b> is <b>the only</b> arbovirus on this list.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.05 A.4 Zika Virus, Table 2 and 29, MCB 2.10 III.C Zika, Table 16</p>","HANTA":"<h5>Hantavirus: rodent-borne, not arthropod-borne</h5><ul class=\"l1\"><li>The lecture opens with the distinction.<ul class=\"l2\"><li>An arbovirus is transmitted by blood-feeding arthropods from one vertebrate to another.</li><li><b>A </b>robovirus is rodent-borne<b>:</b> the rodent is the host, no arthropod is involved, and transmission is by contact with rodent body fluids or excretions.</li></ul></li><li><b>Bunyaviridae</b>, genus <b>Hantavirus</b>.<ul class=\"l2\"><li>Spherical, enveloped, negative-sense RNA in <b>3 segments</b>, partly ambisense, with its own polymerase.</li><li>Named after the Hantan River in Korea, where an outbreak among UN troops in the Korean War was traced.</li></ul></li><li>Rodents carry it for life and pass it horizontally among themselves.<ul class=\"l2\"><li>Humans are infected by <b>inhaling aerosols of rodent urine, feces or saliva</b>.</li><li>There is no vector and no human-to-human spread.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Hemorrhagic fever with renal syndrome (HFRS)</th><th>Hantavirus pulmonary syndrome (HPS)</th></tr></thead><tbody><tr><td><b>Virus</b></td><td>Hantaan, Dobrava, Seoul</td><td><b>Sin Nombre virus</b>, a novel hantavirus</td></tr><tr><td><b>Reservoir</b></td><td><ul class=\"cl\"><li>urban rats</li><li>Trading ships probably spread the viruses worldwide</li></ul></td><td><b>the deer mouse, Peromyscus maniculatus</b></td></tr><tr><td><b>Organ</b></td><td><ul class=\"cl\"><li>kidney: acute interstitial nephritis, acute renal insufficiency and failure, sometimes generalized hemorrhage and shock</li><li>More than 2,000 cases among UN troops in Korea</li></ul></td><td>lung: fever, headache and myalgia followed by rapidly progressive pulmonary edema and respiratory failure, with <b>no hemorrhage</b></td></tr><tr><td><b>Mortality</b></td><td>variable</td><td>30% or more</td></tr><tr><td><b>Laboratory</b></td><td>RT-PCR, immunohistochemistry on fixed tissue, ELISA for IgM and IgG</td><td>same</td></tr><tr><td><b>Treatment</b></td><td>supportive, rodent control, avoid rodent droppings</td><td>supportive, oxygen, ribavirin</td></tr></tbody></table></div><h5>The rodent-borne and bat-borne hemorrhagic fever viruses compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Family and genome</th><th>Reservoir</th><th>Spread to humans</th><th>Disease</th></tr></thead><tbody><tr><td><b>Hantaan, Sin Nombre</b></td><td>Bunyaviridae, 3 negative segments</td><td>rats, deer mouse</td><td>aerosolized excreta</td><td>HFRS, HPS</td></tr><tr><td><b>Lassa</b></td><td>Arenaviridae, 2 ambisense segments</td><td>Mastomys rat</td><td>rodent excreta, West Africa</td><td>hemorrhagic fever</td></tr><tr><td><b>Ebola, Marburg</b></td><td>Filoviridae, non-segmented negative RNA</td><td>fruit bats suspected</td><td>contact with blood and body fluids</td><td>hemorrhagic fever with 25 to 90% mortality</td></tr><tr><td><b>Dengue, yellow fever</b></td><td>Flaviviridae, positive RNA</td><td>humans and monkeys</td><td>Aedes mosquito</td><td>hemorrhagic fever</td></tr></tbody></table></div><ul class=\"l1\"><li>Both hantaviruses and arenaviruses are segmented and ambisense, and both belong to the negative-strand group that must bring its own polymerase (Always Bring Polymerase Or Fail Replication).</li></ul><p class=\"rsrc\">Source: MCB 2.05 I Arbovirus vs Robovirus, III.B Bunyavirus, Tables 39 to 41, III.C Arenaviridae</p>","JE":"<h5>Japanese encephalitis and its ecology</h5><ul class=\"l1\"><li><b>Flaviviridae</b>, genus Flavivirus, related to <b>dengue</b>, <b>yellow fever</b> and <b>West Nile</b>.<ul class=\"l2\"><li>First recorded in Japan in 1871, isolated in Tokyo in 1935, and <b>Culex tritaeniorhynchus</b> identified as the vector in 1938.</li><li>One of the <b>most important</b> causes of arthropod-borne viral encephalitis globally, the main cause of viral encephalitis in Asia, and the common cause of arboviral encephalitis in the Philippines, where it is found year-round in all regions.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Element</th><th>Japanese encephalitis</th></tr></thead><tbody><tr><td><b>Vector</b></td><td><ul class=\"cl\"><li><b>Culex tritaeniorhynchus and Culex vishnui</b>, brownish-gray mosquitoes that breed in <b>rice fields, marshes and stagnant water</b>, bite in the evening and at night, and bite outdoors</li><li>The same mosquitoes carry West Nile and St. Louis encephalitis</li></ul></td></tr><tr><td><b>Enzootic cycle</b></td><td>water birds (egrets and herons) and mosquitoes maintain the virus in nature</td></tr><tr><td><b>Amplifying host</b></td><td><b>pigs</b>, which develop high and prolonged viremia so that feeding mosquitoes pick up enough virus</td></tr><tr><td><b>Humans</b></td><td>incidental targets and <b>dead-end hosts</b>, because human viremia is too low to infect mosquitoes</td></tr><tr><td><b>Population at risk</b></td><td>rural farmers in rice-growing and flood-irrigated areas, especially near piggeries, in the evening</td></tr></tbody></table></div><h5>Clinical course and pathology</h5><ul class=\"l1\"><li>Most infections are asymptomatic or mild.<ul class=\"l2\"><li>Symptomatic disease ranges from nonspecific fever to aseptic meningitis, seizures, encephalitis and poliomyelitis-like flaccid paralysis.</li><li>Death can occur, especially in children, within 3 to 5 days of CNS symptoms, and more than half of severe cases die or are left with <b>chronic</b> seizures, motor dysfunction, mental retardation or psychiatric disorders.</li></ul></li><li>The virus crosses the blood-brain barrier, infects neurons and causes neuronal degeneration, necrosis, microglial nodules, perivascular infiltrates and focal hemorrhage, most in the gray matter of the cortex, midbrain and brainstem.<ul class=\"l2\"><li>Both direct cytopathic effect and the inflammatory response damage neurons, and the brain cannot regenerate, so the sequelae are permanent.</li></ul></li><li>Philippine data (2.10): antibodies in a horse in 1943, first confirmed case 1956, virus isolated from Culex in Ilocos Sur in 1977, first outbreak in Nueva Ecija in 1982, AES surveillance since 2008, and 131 cases in 2025, up 198%, mostly in Regions II, III and VI.</li><li>Treatment is supportive with <b>no antiviral</b>.<ul class=\"l2\"><li>An effective vaccine exists and is locally available for at-risk populations.</li></ul></li></ul><h5>Vector ecology in the Philippines (2.10)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Vector</th><th>Biting time and place</th><th>Breeding site</th></tr></thead><tbody><tr><td><b>Malaria</b></td><td>Anopheles flavirostris, A. litoralis, A. balabacensis (Palawan only)</td><td>night, indoors</td><td>rain puddles, water tanks, irrigation ditches</td></tr><tr><td><b>Dengue, chikungunya, Zika</b></td><td>Aedes aegypti and A. albopictus, the tiger mosquito</td><td>day, indoors and outdoors</td><td>clear water in containers</td></tr><tr><td><b>Japanese encephalitis</b></td><td>Culex tritaeniorhynchus and C. vishnui</td><td>night, outdoors</td><td>rice fields</td></tr></tbody></table></div><h5>The other flavivirus encephalitides</h5><ul class=\"l1\"><li><b>West Nile</b> fever is the <b>leading cause</b> of arboviral encephalitis in the United States, with birds as reservoir, Culex vectors, humans as <b>dead-end hosts</b>, 80% asymptomatic, less than 1% neuroinvasive, one antigenic type and <b>no human vaccine</b>.<ul class=\"l2\"><li>St. Louis encephalitis is the <b>most important</b> epidemic encephalitis of North America, also Culex and birds.</li><li>Eastern equine encephalitis is a togavirus with 30% mortality and horses as <b>dead-end hosts</b>.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.05 A.3 Japanese Encephalitis, Table 28, MCB 2.10 III.C Vectors, Japanese Encephalitis</p>","AEDES":"<h5>Why vector control is the main measure against dengue</h5><ul class=\"l1\"><li><b>Dengue</b>, <b>chikungunya</b>, <b>Zika</b> and urban <b>yellow fever</b> share the same vector: <b>Aedes aegypti and Aedes albopictus</b>, the black-and-white tiger mosquito that bites by day, breeds in clean stagnant water in indoor and outdoor containers, and lives close to people.</li><li>None of these four diseases has an antiviral.<ul class=\"l2\"><li>Yellow fever has the <b>17D</b> vaccine, <b>Japanese encephalitis</b> has a vaccine, but there is <b>no FDA-approved dengue vaccine in the Philippines</b>.</li><li><b>Dengvaxia</b>'s registration was revoked because seronegative recipients had a higher risk of severe disease through <b>antibody-dependent enhancement</b>, and <b>Qdenga</b> is still under FDA review.</li><li>With <b>no vaccine</b> and no drug, the public-health answer is to attack the mosquito.</li></ul></li></ul><h5>The DOH strategies from the trans</h5><ul class=\"l1\"><li><b>4S strategy of the DOH</b><ul class=\"l2\"><li><b>Search and destroy</b> breeding sites</li><li><b>Secure self-protection</b> with long sleeves, repellent and window screens</li><li><b>Seek early consultation</b></li><li><b>Support fogging or spraying</b>, only during outbreaks in hotspot areas</li></ul></li><li><b>4T for containers:</b><ul class=\"l2\"><li>Taob (turn over)</li><li>Taktak (tap out)</li><li>Tuyo (dry)</li><li>Takip (cover)</li></ul></li><li>General arbovirus prevention (2.05 Table 10): vector control, vector avoidance, protective clothing, insect repellents, window screens, and vaccination where available.</li></ul><h5>Dengue burden and management</h5><ul class=\"l1\"><li><b>Dengue</b> is the <b>most important</b> human arboviral disease, with more than 40% of the world at risk, endemic in more than 100 countries and 100 to 400 million infections a year.<ul class=\"l2\"><li>In the Philippines 2025 recorded about 414,000 cases (down 30% from 2024) with 1,162 deaths (CFR 0.4%), highest in Region III, CALABARZON and NCR, with serotypes 1, 2 and 3 circulating.</li><li>Cases were 56% with warning signs, 43% without, and 1% severe.</li></ul></li><li><b>Drivers of spread:</b><ul class=\"l2\"><li>Climate change</li><li>Transport</li><li>Urbanization</li><li>The lack of antivirals and vaccines</li></ul></li><li>Treatment is paracetamol and fluids.<ul class=\"l2\"><li>Ibuprofen, mefenamic acid and aspirin are avoided because they increase bleeding risk.</li><li>Warning signs mean admission.</li></ul></li></ul><h5>Vaccines for the arboviruses compared</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Vaccine status</th></tr></thead><tbody><tr><td><b>Dengue</b></td><td><ul class=\"cl\"><li>Dengvaxia (CYD-TDV, 3 doses 6 months apart, only for seropositive ages 9 to 45) revoked in PH</li><li>Qdenga (TAK-003, 2 doses 3 months apart, from age 4 to 6, seronegatives allowed) under review</li></ul></td></tr><tr><td><b>Yellow fever</b></td><td>live 17D, one dose, only at the Bureau of Quarantine for travelers</td></tr><tr><td><b>Japanese encephalitis</b></td><td>inactivated vaccine, locally available</td></tr><tr><td><b>Chikungunya, Zika, West Nile</b></td><td>none</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.05 A.2 Dengue Treatment and Prevention, Table 27, MCB 2.10 III.C Dengue, Table 12</p>","FILO":"<h5>Filoviridae: Ebola and Marburg</h5><ul class=\"l1\"><li>Filum means thread.<ul class=\"l2\"><li>The virions are pleomorphic, long filamentous or oddly shaped particles with a <b>negative-sense single-stranded RNA</b> genome of seven sequentially arranged genes: NP, VP35, VP40, GP, VP30, VP24 and L.</li></ul></li><li>Two genera.<ul class=\"l2\"><li><b>Marburg</b> virus, and <b>Ebola</b> virus with the species Zaire, Sudan, Bundibugyo (the current expanding outbreak in the Democratic Republic of Congo), Ivory Coast and <b>Reston</b>.</li><li><b>Reston</b> virus was found in 1989 in cynomolgus monkeys imported to Virginia from the Philippines and later in Philippine <b>pigs</b>.</li><li>It has low pathogenicity for humans and proved that Ebola can live in animals other than primates.</li></ul></li><li>Natural hosts and vectors are unknown but suspected to be <b>fruit bats</b>.<ul class=\"l2\"><li>Humans and non-human primates are highly susceptible, and filoviruses carry the highest mortality of all the viral hemorrhagic fevers, 25 to 90%.</li></ul></li></ul><h5>Transmission and pathogenesis</h5><ul class=\"l1\"><li>Spread is by <b>direct contact with blood or body fluids</b>, including traditional funeral practices, which is why safe burial protocols matter and why <b>Ebola</b> spreads more slowly than an aerosol virus such as COVID-19.<ul class=\"l2\"><li>There is no vector.</li></ul></li><li>Tropism for <b>macrophages, dendritic cells, interstitial fibroblasts and endothelial cells</b>, later spreading to liver, spleen, lungs and kidneys.</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Marburg</th><th>Ebola</th></tr></thead><tbody><tr><td><b>Incubation</b></td><td>3 to 9 days</td><td>2 to 21 days</td></tr><tr><td><b>Course</b></td><td>fever, headache, sore throat and muscle pain, then abdominal pain, vomiting, diarrhea and rash, then internal and external bleeding, shock and death</td><td>the same</td></tr></tbody></table></div><h5>Diagnosis and control</h5><ul class=\"l1\"><li>Antigen or antibody by ELISA and <b>RT-PCR</b>.<ul class=\"l2\"><li>Specimens contain virulent virus and are handled only under maximum containment, biosafety level 4.</li><li>Most clinical laboratories are BSL-2, TB laboratories are BSL-3, and <b>BSL-4</b> is reserved for exotic agents with aerosol laboratory risk and <b>no vaccine</b> or treatment.</li></ul></li><li>Because the reservoir is unknown, no reservoir control is possible.<ul class=\"l2\"><li>Isolation in hospital is the <b>most effective</b> outbreak control.</li><li>There is no specific antiviral and, in these lecture notes, no approved vaccine.</li><li>Treatment supports renal function, electrolytes and the management of hemorrhage and shock.</li></ul></li></ul><h5>Viral hemorrhagic fevers side by side</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Family</th><th>Reservoir and spread</th><th>Distinguishing feature</th></tr></thead><tbody><tr><td><b>Ebola, Marburg</b></td><td>Filoviridae</td><td>fruit bats, contact with fluids</td><td>highest mortality, filamentous, BSL-4</td></tr><tr><td><b>Lassa</b></td><td>Arenaviridae</td><td>Mastomys rat excreta, West Africa</td><td>2 ambisense segments</td></tr><tr><td><b>Hantaan (HFRS)</b></td><td>Bunyaviridae</td><td>rat excreta aerosol</td><td>renal syndrome</td></tr><tr><td><b>Dengue</b></td><td>Flaviviridae</td><td>Aedes, humans amplify</td><td>antibody-dependent enhancement, plasma leakage</td></tr><tr><td><b>Yellow fever</b></td><td>Flaviviridae</td><td>Aedes, monkeys and humans</td><td>jaundice, Councilman bodies, 17D vaccine</td></tr><tr><td><b>Crimean-Congo, Rift Valley</b></td><td>Bunyaviridae</td><td>ticks, mosquitoes</td><td>listed among the arbovirus families</td></tr></tbody></table></div><p class=\"rsrc\">Source: MCB 2.05 III.A Filovirus, Tables 37 and 38</p>","DEADEND":"<h5>Arbovirus epidemiology</h5><ul class=\"l1\"><li>Arbovirus is an <b>ecological group, not a viral family</b>, defined by transmission through blood-feeding arthropods.<ul class=\"l2\"><li>The families involved are the enveloped positive-sense <b>Togaviridae</b> and <b>Flaviviridae</b> and the enveloped negative-sense <b>Bunyaviridae</b>, <b>Filoviridae</b> and <b>Arenaviridae</b>.</li></ul></li></ul><h5>The transmission cycle as the lecture draws it</h5><ol class=\"l1\"><li>The virus replicates in a reservoir vertebrate that shows no disease (birds, <b>pigs</b>, monkeys, rodents, bats, horses).</li><li>A mosquito, tick or sandfly takes a blood meal and acquires the virus.</li><li><b>The virus replicates in the tissues of the arthropod without causing it any disease or damage.</b><ul class=\"l2\"><li>This step is required before onward transmission, and it is what perpetuates the cycle.</li></ul></li><li>The next bite transmits the virus to a new vertebrate.</li></ol><ul class=\"l1\"><li>Some arboviruses are also maintained by <b>transovarial transmission</b>, in which the virus passes into the eggs so that the next generation of mosquitoes hatches already infected.</li></ul><h5>Dead-end hosts</h5><ul class=\"l1\"><li>For many arboviruses humans play almost no role in transmission: the viremia is too low to infect a feeding mosquito.<ul class=\"l2\"><li>These are dead-end infections.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Humans are <b>dead-end hosts</b></th><th>Humans amplify the virus (the <b>exceptions</b>)</th></tr></thead><tbody><tr><td>Japanese encephalitis, West Nile, St. Louis encephalitis, eastern and western equine encephalitis (horses too)</td><td><b>dengue, urban yellow fever, Zika, chikungunya</b>, which cycle from human to Aedes to human</td></tr></tbody></table></div><ul class=\"l1\"><li><b>Reservoir hosts</b><ul class=\"l2\"><li>Birds are the major hosts for the mosquito-borne encephalitides</li><li><b>Pigs</b> are the <b>amplifying host</b> for <b>Japanese encephalitis</b></li><li>Monkeys maintain the jungle cycles of <b>yellow fever</b> and <b>dengue</b></li><li>Rodents and bats maintain others</li></ul></li><li><b>Vectors:</b> mosquitoes are prominent in the Philippines, with ticks and sandflies elsewhere.<ul class=\"l2\"><li>Distribution depends on vector species, reservoir hosts, climate, rainfall and human activity, so arboviruses have distinct geographies, unlike influenza.</li></ul></li></ul><h5>From bite to disease</h5><ol class=\"l1\"><li>Mosquito bite and local replication.</li><li>Replication in regional lymph nodes.</li><li>Viremia.</li><li>Spread to the target organ determined by tropism.</li><li>Clinical disease as one of three syndromes: undifferentiated fever, encephalitis (virus crosses the blood-brain barrier, infects neurons, causes degeneration and inflammation) or hemorrhagic fever.<ul class=\"l2\"><li><b>Dengue</b> can produce more than one.</li></ul></li></ol><ul class=\"l1\"><li>Diagnosis is <b>PCR</b>, serology for antibody or antigen, and virus isolation.<ul class=\"l2\"><li>Treatment is supportive with no specific antiviral.</li><li>Prevention is vector control, vector avoidance, protective clothing, repellents, screens and vaccination where available (JE, <b>yellow fever</b>).</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.05 II Arthropod-borne Viruses, Transmission Cycle, Tables 6 to 10</p>","YF":"<h5>Yellow fever</h5><ul class=\"l1\"><li>The prototype flavivirus and the first flavivirus discovered, named for the <b>jaundice</b> it causes.<ul class=\"l2\"><li>Enveloped, positive-sense RNA, 50 nm.</li><li>It occurs only in tropical <b>Africa and South America</b>, a distribution created by the transatlantic slave trade.</li><li>It is absent from East and Southeast Asia despite <b>Aedes aegypti</b>, for reasons that may include quarantine and vaccination, biological incompatibility, partial cross-immunity from endemic <b>dengue</b>, or luck.</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Cycle</th><th>Chain</th></tr></thead><tbody><tr><td><b>Jungle (sylvatic)</b></td><td>monkey to Haemagogus or Aedes mosquito to monkey, with humans infected only incidentally when they enter the forest</td></tr><tr><td><b>Urban</b></td><td>human to Aedes aegypti to human</td></tr><tr><td><b>Intermediate (savannah)</b></td><td>monkey or human to mosquito to monkey or human</td></tr></tbody></table></div><ul class=\"l1\"><li>Reservoirs are therefore <b>humans and monkeys</b>, and humans are not <b>dead-end hosts</b> in the urban cycle.</li></ul><h5>Clinical course</h5><ul class=\"l1\"><li>Two thirds are asymptomatic.<ul class=\"l2\"><li>Of the symptomatic third, 80 to 85% recover and 15 to 20% die if untreated.</li></ul></li><li>The disease is <b>biphasic</b>.<ul class=\"l2\"><li>The viremic phase brings abrupt fever, headache, nausea, myalgia and vomiting, then a remission of 1 to 2 days.</li><li>The intoxication phase begins 3 to 6 days after onset with return of fever, petechial hemorrhages, hematemesis and <b>jaundice</b>, and in some renal failure, cardiovascular shock and multi-organ failure.</li><li>Some patients go straight to the intoxication phase.</li></ul></li><li>Non-icteric disease mimics other arboviruses, malaria and tick-borne relapsing fever.<ul class=\"l2\"><li>Icteric disease mimics viral hepatitis, leptospirosis and poisoning.</li></ul></li></ul><h5>Pathogenesis, step by step</h5><ol class=\"l1\"><li>The virus infects inflammatory and endothelial cells, which trigger an innate response and pro-inflammatory cytokines that cause fever.</li><li>Infected immune cells carry it to lymph nodes where it amplifies, then into the circulation.</li><li>It targets the liver, first Kupffer cells then hepatocytes, which die by necrosis or apoptosis and cause <b>jaundice</b>.</li><li>The <b>cytokine storm</b> damages endothelium and blood leaks, and the failing liver stops making clotting factors, so hemorrhage follows.</li></ol><ul class=\"l1\"><li>Histology shows <b>midzonal necrosis with Councilman bodies</b>, small hepatocytes with a small nucleus and dense eosinophilic <b>cytoplasm</b>, which are <b>pathognomonic</b>.</li><li><b>Diagnosis:</b><ul class=\"l2\"><li>Rapid <b>RT-PCR</b> early</li><li><b>IgM</b> capture enzyme immunoassay once antibody appears</li><li>Liver enzymes</li><li>Liver histology</li></ul></li></ul><h5>Prevention</h5><ul class=\"l1\"><li>The <b>live attenuated 17D vaccine</b> is the <b>most effective</b> vaccine in the course: one dose, 95% seroconversion, protection for at least 30 years.<ul class=\"l2\"><li>Contraindicated in infants under 9 months, pregnancy, egg allergy and the immunocompromised.</li><li>In the Philippines it is given only at the Bureau of Quarantine to travelers to endemic countries.</li><li>Mosquito control and barrier methods complete the picture.</li><li>Prevention dominates because the animal reservoir cannot be treated and eradication is not feasible.</li></ul></li></ul><h5>Yellow fever and dengue compared</h5><ul class=\"l1\"><li>Same vector and same two-cycle ecology, but <b>dengue</b> has four serotypes with <b>antibody-dependent enhancement</b> causing plasma leakage and shock, while <b>yellow fever</b> has one serotype, hepatotropism with <b>jaundice</b>, and a durable vaccine.</li></ul><p class=\"rsrc\">Source: MCB 2.05 A.1 Yellow Fever, Tables 13 to 19</p>","2028-60":"<h5>Dengue diagnostics by day of illness</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Test</th><th>What it detects</th><th>Best time</th></tr></thead><tbody><tr><td><b>NS1 antigen</b></td><td>non-structural protein 1, a viral antigen released during replication</td><td><ul class=\"cl\"><li><b>early, in the first days of fever</b>, before antibody appears</li><li>In the vignette a 4-day fever is exactly this window</li></ul></td></tr><tr><td><b>RT-PCR</b></td><td>viral RNA</td><td>early</td></tr><tr><td><b>IgM</b></td><td>the patient's antibody</td><td>later in the illness, from about day 5 onward</td></tr><tr><td><b>IgG</b></td><td>evidence of previous or recent infection</td><td><ul class=\"cl\"><li>interpretation depends on timing</li><li>Early high IgG suggests a secondary infection</li></ul></td></tr></tbody></table></div><ul class=\"l1\"><li><b>How the rapid tests work:</b> in the <b>NS1</b> test a capture antibody on the strip binds the NS1 antigen in the sample and produces a line.<ul class=\"l2\"><li>The <b>IgM</b> and <b>IgG</b> test is the reverse, with viral antigen on the strip catching the patient's antibodies.</li></ul></li></ul><h5>Recognizing dengue</h5><ul class=\"l1\"><li><b>Uncomplicated dengue:</b> sudden biphasic saddleback fever, retro-orbital headache, conjunctivitis, measles-like rash, petechiae, breakbone myalgia and arthralgia, chills, nausea and vomiting, with no permanent sequelae.<ul class=\"l2\"><li>About 95% of infections are asymptomatic or mild.</li></ul></li><li><b>Warning signs that call for admission:</b> abdominal pain, persistent vomiting, mucosal bleeding, lethargy, hepatomegaly, and a rising hematocrit with falling platelets.<ul class=\"l2\"><li><b>The tourniquet test shows capillary fragility:</b><ul class=\"l3\"><li>Fewer than 10 petechiae is negative</li><li>10 to 19 means retest</li><li>20 or more is positive</li></ul></li></ul></li><li>Severe <b>dengue</b> (about 5%): plasma leakage from loss of endothelial integrity, thrombocytopenia below 100,000, hemorrhage (gums, GI tract, hematuria, purpura), liver and kidney damage, and shock.<ul class=\"l2\"><li>Mortality is 2 to 5% treated and up to 50% untreated.</li><li>It occurs 2 to 3 days after the fever resolves.</li></ul></li></ul><h5>Why the second infection is the dangerous one</h5><ol class=\"l1\"><li>After a first infection, antibodies to that serotype remain.</li><li>A later infection with a different serotype is bound by these antibodies, but they do not neutralize it.</li><li>The antibody-coated virus is taken up more efficiently by monocytes and macrophages, where it multiplies.</li><li>More infected cells release more cytokines, vascular permeability rises, and <b>dengue</b> hemorrhagic fever or dengue shock syndrome follows.<ul class=\"l2\"><li>Ninety percent of severe dengue is a second infection with a different serotype, which is also why <b>Dengvaxia</b> was dangerous in seronegatives.</li></ul></li></ol><ul class=\"l1\"><li>Treatment is paracetamol, fluids and early consultation.<ul class=\"l2\"><li>Aspirin, ibuprofen and mefenamic acid are avoided because of bleeding.</li></ul></li></ul><h5>Comparing the febrile arboviral illnesses</h5><ul class=\"l1\"><li><b>Chikungunya</b> gives prolonged severe joint pain, <b>Zika</b> gives rash and conjunctivitis with mild symptoms, <b>yellow fever</b> gives <b>jaundice</b> and hemorrhage, and <b>Japanese encephalitis</b> gives encephalitis.<ul class=\"l2\"><li><b>Dengue</b> is the one with thrombocytopenia, plasma leakage and <b>NS1</b> testing.</li></ul></li></ul><p class=\"rsrc\">Source: MCB 2.05 A.2 Dengue Laboratory Testing, Severe Dengue, Tables 21 to 26</p>","2028-65":"<h5>Chikungunya and its joint tropism</h5><ul class=\"l1\"><li><b>Togaviridae</b>, genus Alphavirus (mosquito-borne).<ul class=\"l2\"><li>Spherical, 70 nm, enveloped, positive-sense RNA, replicates in the <b>cytoplasm</b> and buds through host membranes.</li><li>The name means \"to become contorted\", from the severe joint pain.</li><li>First reported in Tanzania in 1952, large outbreaks in the Indian Ocean and India in 2005 to 2007, the Americas in 2013, now more than 60 countries.</li><li>In the Philippines 2025 had 835 cases, down 79% from 2024.</li></ul></li><li>Vectors are <b>Aedes aegypti</b> and <b>Aedes albopictus</b>.<ul class=\"l2\"><li>A single amino acid change in the E1 glycoprotein (alanine to valine at position 226) improved fitness in A. albopictus, which has a wider geographic range and helped the virus spread.</li><li>Reservoirs are humans in the urban cycle and non-human primates, rodents, birds and small animals in the sylvatic cycle.</li><li>Humans are not <b>dead-end hosts</b>.</li></ul></li></ul><h5>Pathogenesis, step by step</h5><ol class=\"l1\"><li>The virus infects endothelial cells, macrophages and local tissue at the bite site.</li><li>It travels in macrophages to secondary lymphoid organs and replicates there.</li><li>A pro-inflammatory innate response produces cytokines that activate the adaptive immune system.</li><li>The virus enters the circulation and disseminates.</li><li>Infected monocytes and macrophages carry it to the <b>synovial tissue of the joints</b>, where it replicates and provokes inflammation, giving the severe polyarthralgia.</li><li>The adaptive immune response clears the infe
