hotericin B is used for severe systemic infection such as this."}],"k":"D","w":[],"i":["The key is printed with an asterisk (D*) in the 2026 PDF."],"o":"","f":"DIMORPH"},"2026-17":{"id":"2026-17","y":2026,"n":"17","p":3,"t":"T08","s":"Case is about diabetic patient in ICU with sepsis, white colonies on SDA and exhibits germ tube formation.","c":[{"l":"A","x":"C.albicans","r":"C. albicans is identified by germ tube formation, true hyphae that appear after incubation in serum."},{"l":"B","x":"C. glabrata","r":"Produces only yeast cells, no pseudohyphae, and is azole resistant."},{"l":"C","x":"C. auris","r":"The multidrug-resistant Candida species, handled with contact precautions."},{"l":"D","x":"C. parapsilosis","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"A","w":[],"i":[],"o":"","f":"CANDIDA"},"2026-18":{"id":"2026-18","y":2026,"n":"18","p":3,"t":"T08","s":"A 35 year old/M, diabetic, in the ICU was being treated for pneumonia. Catheter line insertion was done for the administration of systemic antibiotics. Which of the following factor/s predisposes him to candidemia?","c":[{"l":"A","x":"Systemic antibiotic","r":"Antibacterial drugs disturb normal flora and allow Candida overgrowth."},{"l":"B","x":"Intravascular catheter","r":"Indwelling catheters carry Candida biofilm and are a source of candidemia."},{"l":"C","x":"Diabetes Mellitus","r":"Diabetes is a listed risk factor for candidiasis."},{"l":"D","x":"AOTA","r":"Candida is an opportunist. Antibiotics, catheters, and diabetes all predispose."}],"k":"D","w":[],"i":[],"o":"","f":"BIOFILM"},"2026-19":{"id":"2026-19","y":2026,"n":"19","p":3,"t":"T08","s":"A 40 year old man was diagnosed to have meningitis and was found to have encapsulated yeasts on india ink stain of his CSF. What is the most likely causative agent?","c":[{"l":"A","x":"Candida albicans","r":"Not encapsulated. Shows budding yeast with pseudohyphae."},{"l":"B","x":"Histoplasma capsulatum","r":"Histoplasma capsulatum is a thermally dimorphic systemic fungus. The mold form shows large tuberculate macroconidia of 8 to 16 micrometers with small microconidia, and the 37°C form is a small oval yeast that grows inside macrophages and reticuloendothelial cells."},{"l":"C","x":"Cryptococcus neoformans","r":"Cryptococcus neoformans is an encapsulated yeast with a large polysaccharide capsule that shows as a clear halo on India ink. It causes chronic meningitis, mainly in immunocompromised hosts."},{"l":"D","x":"Aspergillus fumigatus","r":"A mold with septate hyphae branching at acute angles."}],"k":"C","w":[],"i":[],"o":"","f":"CRYPTO"},"2026-20":{"id":"2026-20","y":2026,"n":"20","p":4,"t":"T08","s":"A 30/F was prescribed high dose steroids for her Systemic Lupus Erythematosus. She developed dyspnea, desaturations with CXR that showed bilateral ground-glass infiltrates. Initial microscopy of induced sputum showed extracellular trophozoites and cysts with multiple nuclei. What is the most probable infectious agent?","c":[{"l":"A","x":"Candida albicans","r":"A yeast with pseudohyphae. No trophozoites or cysts."},{"l":"B","x":"Coronavirus","r":"A virus cannot be seen on light microscopy."},{"l":"C","x":"Mucorales sp.","r":"Mucor and Rhizopus, the agents of mucormycosis, show broad, ribbon-like, non-septate hyphae branching at right angles, and they invade blood vessels."},{"l":"D","x":"Pneumocystis jirovecii","r":"Pneumocystis jirovecii was once thought to be a protozoan and is now classified as a fungus. It is an extracellular pathogen with thin-walled trophozoites and thick-walled cysts holding four to eight nuclei, and it causes pneumonia with bilateral ground-glass opacities in immunocompromised patients, especially those with AIDS."}],"k":"D","w":[],"i":[],"o":"","f":"PJP"},"2026-23":{"id":"2026-23","y":2026,"n":"23","p":4,"t":"T10","s":"What is the reason for the re-emergence of pertussis?","c":[{"l":"A","x":"Waning immunity","r":"Pertussis resurgence reflects waning immunity after acellular vaccine, together with better diagnostics, evolving strains, and differences in coverage."},{"l":"B","x":"—","r":"Not recalled in the source."},{"l":"C","x":"—","r":"Not recalled in the source."},{"l":"D","x":"—","r":"Not recalled in the source."}],"k":"A","w":[],"i":[],"o":"","f":"PERT"},"2026-24":{"id":"2026-24","y":2026,"n":"24","p":4,"t":"T10","s":"Which of the following polio vaccine virus types demonstrates person-to-person transmission in the community and may cause outbreaks?","c":[{"l":"A","x":"Circulating Vaccine","r":"Circulating vaccine-derived poliovirus is a Sabin-derived virus that has mutated, regained neurovirulence, and shown person-to-person transmission in the community. Type 2 causes 86 percent of it, which is why type 2 was removed when trivalent OPV was switched to bivalent."},{"l":"B","x":"Sabin","r":"The live attenuated OPV strain, normally shed after vaccination."},{"l":"C","x":"Wild type","r":"Naturally occurring poliovirus. Type 2 was eradicated in 1999 and type 3 has not been seen since 2012."},{"l":"D","x":"Vaccine-derived","r":"Sabin-like viruses that have mutated and can cause paralysis. They become circulating only once community transmission is shown."}],"k":"A","w":[],"i":[],"o":"","f":"CVDPV"},"2026-26":{"id":"2026-26","y":2026,"n":"26","p":5,"t":"T05","s":"WHO declared Zika virus as a public health emergency due to its associated with:","c":[{"l":"A","x":"Acute Flaccid Paralysis","r":"The hallmark of poliomyelitis."},{"l":"B","x":"Microcephaly","r":"Zika is an Aedes-borne flavivirus causing rash, fever, arthralgia, and nonpurulent conjunctivitis. Its most serious complication is congenital Zika syndrome, where infection of fetal neural progenitor cells causes microcephaly and other malformations. In adults it is associated with Guillain-Barre syndrome."},{"l":"C","x":"Transverse myelitis","r":"Myelitis is a reported adult association but was not the reason for the declaration."},{"l":"D","x":"Flu-like symptoms","r":"Zika illness is mild and nonspecific, which is not what prompted the emergency."}],"k":"B","w":[],"i":[],"o":"","f":"ZIKA"},"2026-27":{"id":"2026-27","y":2026,"n":"27","p":5,"t":"T10","s":"What Poliovirus subtype is the main cause of the Circulating Vaccine-derived Poliovirus?","c":[{"l":"A","x":"Type 1","r":"Causes 13 percent of cVDPV."},{"l":"B","x":"Type 2","r":"Circulating vaccine-derived poliovirus is a Sabin-derived virus that has mutated, regained neurovirulence, and shown person-to-person transmission in the community. Type 2 causes 86 percent of it, which is why type 2 was removed when trivalent OPV was switched to bivalent."},{"l":"C","x":"Type 3","r":"Causes 1 percent of cVDPV."}],"k":"B","w":[],"i":[],"o":"","f":"CVDPV"},"2026-29":{"id":"2026-29","y":2026,"n":"29","p":5,"t":"T05","s":"Mosquito vector control is important in the control of which of the following re-emerging diseases?","c":[{"l":"A","x":"Chikungunya","r":"Spread by bites of infected female Aedes mosquitoes, so vector control is the key measure."},{"l":"B","x":"Nipah","r":"Reservoir is the Pteropus fruit bat. Not vector-borne."},{"l":"C","x":"Ebola","r":"Spread by contact with body fluids, with fruit bats as natural hosts."},{"l":"D","x":"Pandemic influenza","r":"Reservoirs are wild birds, waterfowl, and poultry. Spread is respiratory."}],"k":"A","w":[],"i":[],"o":"","f":"AEDES"},"2026-30":{"id":"2026-30","y":2026,"n":"30","p":5,"t":"T04","s":"What is the intermediate host of MERS-COV?","c":[{"l":"A","x":"Bats","r":"Natural reservoir of the coronaviruses and of Nipah."},{"l":"B","x":"Camel","r":"Dromedary camels are the intermediate host of MERS-CoV."},{"l":"C","x":"Civet cat","r":"Intermediate host of SARS-CoV."},{"l":"D","x":"Monkey","r":"Primary host in the jungle cycle of yellow fever."}],"k":"B","w":[],"i":[],"o":"","f":"MERS"},"2026-31":{"id":"2026-31","y":2026,"n":"31","p":5,"t":"T05","s":"What is the main vector of Japanese encephalitis virus?","c":[{"l":"A","x":"Aedes","r":"Vector of dengue, yellow fever, Zika, and chikungunya."},{"l":"B","x":"Anopheles","r":"Per the 2026 rationale, the malaria vector."},{"l":"C","x":"Culex","r":"Japanese encephalitis is a flavivirus transmitted by Culex mosquitoes that breed in rice fields. Birds are reservoirs, pigs are the amplifying host, and humans are dead-end hosts who develop acute viral encephalitis."},{"l":"D","x":"All of the above","r":"Only Culex is the vector."}],"k":"C","w":[],"i":[],"o":"","f":"JE"},"2026-32":{"id":"2026-32","y":2026,"n":"32","p":5,"t":"T10","s":"The tropism of H5N1 to receptors in the lower respiratory tract and not the upper respiratory tract causes:","c":[{"l":"A","x":"Less severity of illness","r":"The opposite. Lower-tract infection gives severe pneumonia."},{"l":"B","x":"Higher mortality","r":"Avian influenza A such as H5N1 primarily infects birds and only occasionally reaches humans through contact with poultry. H5N1 binds receptors in the lower respiratory tract, which explains severe pneumonia, a case fatality near 59 percent, and limited person-to-person spread."},{"l":"C","x":"More person to person transmissibility","r":"Lower-tract tropism limits shedding from the upper airway, so spread between people is limited."}],"k":"B","w":[],"i":[],"o":"","f":"AVIAN"},"2026-33":{"id":"2026-33","y":2026,"n":"33","p":6,"t":"T09","s":"Match the following clinical situations with the appropriate expanded precaution. A diapered patient with acute diarrhea that is likely contagious.","c":[{"l":"A","x":"Contact precaution","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."},{"l":"B","x":"Droplet precaution","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"C","x":"Airborne precaution","r":"Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."}],"k":"A","w":[],"i":[],"o":"","f":"CONTACT"},"2026-34":{"id":"2026-34","y":2026,"n":"34","p":6,"t":"T09","s":"Patient manifests maculopapular rash, coryza, fever, and has been diagnosed with rubeola.","c":[{"l":"A","x":"Contact precaution","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."},{"l":"B","x":"Droplet precaution","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"C","x":"Airborne precaution","r":"Measles is an airborne disease. Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."}],"k":"C","w":[],"i":[],"o":"","f":"AIRBORNE"},"2026-35":{"id":"2026-35","y":2026,"n":"35","p":6,"t":"T09","s":"Pertussis","c":[{"l":"A","x":"Contact precaution","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."},{"l":"B","x":"Droplet precaution","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"C","x":"Airborne precaution","r":"Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."}],"k":"B","w":[],"i":[],"o":"","f":"DROPLET"},"2026-36":{"id":"2026-36","y":2026,"n":"36","p":6,"t":"T09","s":"Abscess or open draining wound caused by Staphylococcus aureus.","c":[{"l":"A","x":"Contact","r":"S. aureus and MRSA from a draining wound spread by hands and fomites. Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."},{"l":"B","x":"Droplet","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"C","x":"Airborne","r":"Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."}],"k":"A","w":[],"i":[],"o":"","f":"CONTACT"},"2026-37":{"id":"2026-37","y":2026,"n":"37","p":6,"t":"T09","s":"Patient with cough and pulmonary infiltrates due to Mycobacterium tuberculosis","c":[{"l":"A","x":"Contact precaution","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."},{"l":"B","x":"Droplet precaution","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"C","x":"Airborne precaution","r":"Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."}],"k":"C","w":[],"i":[],"o":"","f":"AIRBORNE"},"2026-38":{"id":"2026-38","y":2026,"n":"38","p":6,"t":"T09","s":"A 32/F prostitute consults for yearly medical check-up. Her hepatitis profiling was positive for HBsAg. Which of the following precautions is NOT applicable to her infection?","c":[{"l":"A","x":"Hand hygiene before and after contact","r":"Part of standard precautions for every patient."},{"l":"B","x":"Use appropriate type of gown","r":"PPE chosen by anticipated exposure to blood and body fluids is a standard precaution."},{"l":"C","x":"Use of N95 mask","r":"Hepatitis B is blood-borne, so standard precautions apply. An N95 respirator is for airborne pathogens."},{"l":"D","x":"Use appropriate type of gloves","r":"Gloves for handling potentially infectious material are standard for HBV."}],"k":"C","w":[],"i":["The printed 2026 rationale says N95 is used for droplet precautions. MCB 2.09 reserves the N95 for airborne precautions and a surgical mask for droplet."],"o":"","f":"STD"},"2026-40":{"id":"2026-40","y":2026,"n":"40","p":6,"t":"T09","s":"A 30 y/o female was admitted because of meningococcemia. Which of the following precautions is LEAST protective for the healthcare worker attending to the patient?","c":[{"l":"A","x":"Using of surgical mask","r":"A surgical mask is the required barrier for droplet precautions."},{"l":"B","x":"Placing the patient in the room together with those having the same condition","r":"Cohorting is accepted practice."},{"l":"C","x":"Proper hand hygiene in between patient contact","r":"Always required."},{"l":"D","x":"Use alcohol rub when hands are visibly soiled","r":"Visibly soiled hands need soap and water, so alcohol rub here is the least protective choice."}],"k":"D","w":[],"i":[],"o":"","f":"DROPLET"},"2026-41":{"id":"2026-41","y":2026,"n":"41","p":7,"t":"T09","s":"A 20 y/o in-patient male was on meropenem for 2 weeks and was diagnosed to have C. difficile. Which of the following precautions is NOT applicable to his infection?","c":[{"l":"A","x":"apply handwashing before and after patient contact","r":"Essential. Soap and water is needed because alcohol is not sporicidal."},{"l":"B","x":"apply respiratory hygiene","r":"C. difficile is not spread by the respiratory route, so respiratory hygiene is not part of its contact precautions."},{"l":"C","x":"disinfect patient’s linens and gowns","r":"Environmental cleaning with sporicidal agents is part of control."},{"l":"D","x":"wear gloves and gowns when entering patient’s room","r":"Gown and gloves on entry define contact precautions."}],"k":"B","w":[],"i":[],"o":"","f":"CONTACT"},"2026-43":{"id":"2026-43","y":2026,"n":"43","p":7,"t":"T06","s":"What is the cause of high genetic diversity of HIV viruses?","c":[{"l":"A","x":"The viral envelope has many spikes which undergo sequential reassortment.","r":"Spikes do not reassort."},{"l":"B","x":"Recombination between two RNA strands during replication and the highly error prone action of the reverse transcriptase.","r":"HIV has a diploid genome of two RNA strands, which allows recombination between them, and it replicates with a highly error-prone reverse transcriptase. Together these create quasispecies and continual new antigenic variants."},{"l":"C","x":"The segmented genome allows for reassortment producing antigenic drift and many subtypes.","r":"HIV is diploid, not segmented."},{"l":"D","x":"The virus originated from non-human primates causing gene recombination with humans.","r":"Origin does not explain diversity."}],"k":"B","w":[],"i":[],"o":"","f":"HIVDIV"},"2026-44":{"id":"2026-44","y":2026,"n":"44","p":7,"t":"T06","s":"What disease is highly associated with HTLV-1?","c":[{"l":"A","x":"Progressive Multifocal Leukoencephalopathy","r":"Progressive multifocal leukoencephalopathy is caused by reactivation of JC virus, a polyomavirus, in immunosuppressed patients. It is a demyelinating disease with visual deficits, mental impairment, weakness, ataxia, and seizures."},{"l":"B","x":"Creutzfeldt Jakob Disease","r":"Creutzfeldt-Jakob disease is the most commonly met human prion disease, a transmissible spongiform encephalopathy with progressive dementia, ataxia, and myoclonus."},{"l":"C","x":"Kuru","r":"Kuru is a prion disease, a transmissible spongiform encephalopathy spread by ritual cannibalism in the Eastern Highlands of Papua New Guinea."},{"l":"D","x":"Adult T cell leukemia-lymphoma","r":"HTLV-1 is a deltaretrovirus and the causative agent of adult T-cell leukemia-lymphoma, and of HTLV-1 associated myelopathy or tropical spastic paraparesis. It has marked affinity for mature T cells and acts as a transregulating virus without carrying an oncogene."}],"k":"D","w":[],"i":[],"o":"","f":"HTLV"},"2026-45":{"id":"2026-45","y":2026,"n":"45","p":8,"t":"T06","s":"Which of the following characteristics is true of retroviruses?","c":[{"l":"A","x":"RNA dependent DNA polymerase converts RNA genome to DNA","r":"Reverse transcriptase is the RNA-dependent DNA polymerase carried inside retroviral virions. It makes a DNA copy of the viral RNA, and that DNA copy then integrates into the host genome as a provirus."},{"l":"B","x":"Proviruses remain permanently associated with host cell and are expressed","r":"Proviruses do stay permanently integrated, but they are frequently not expressed."},{"l":"C","x":"Naked virion","r":"Retroviruses are enveloped and bud from the plasma membrane."},{"l":"D","x":"Genome is single stranded DNA","r":"The genome is linear positive-sense single-stranded RNA, diploid."}],"k":"A","w":[],"i":[],"o":"","f":"RETRO"},"2026-46":{"id":"2026-46","y":2026,"n":"46","p":8,"t":"T06","s":"Subacute sclerosing panencephalitis is associated with what virus?","c":[{"l":"A","x":"Rubella","r":"Rubella causes German measles, a mild rash illness, and congenital rubella syndrome when the mother is infected early in pregnancy."},{"l":"B","x":"Polyoma","r":"Polyomaviruses include JC virus, the cause of progressive multifocal leukoencephalopathy, BK virus, and Merkel cell virus."},{"l":"C","x":"Mumps","r":"Mumps is a paramyxovirus causing parotitis, with orchitis, oophoritis, mastitis, and aseptic meningitis as complications. It is not a slow virus disease."},{"l":"D","x":"Measles","r":"Subacute sclerosing panencephalitis is a rare late complication of measles (rubeola) infection. It presents with personality change and poor school performance, then progressive intellectual decline, myoclonus, seizures, and finally an unresponsive spastic state."}],"k":"D","w":[],"i":[],"o":"","f":"SSPE"},"2026-47":{"id":"2026-47","y":2026,"n":"47","p":8,"t":"T06","s":"Which viral infection is associated with Progressive multifocal leukoencephalopathy?","c":[{"l":"A","x":"Polyoma","r":"Progressive multifocal leukoencephalopathy is caused by reactivation of JC virus, a polyomavirus, in immunosuppressed patients. It is a demyelinating disease with visual deficits, mental impairment, weakness, ataxia, and seizures. JC virus infects oligodendrocytes."},{"l":"B","x":"Measles","r":"Measles is the virus of SSPE."},{"l":"C","x":"Mumps","r":"Mumps is a paramyxovirus causing parotitis, with orchitis, oophoritis, mastitis, and aseptic meningitis as complications. It is not a slow virus disease."},{"l":"D","x":"Rubella","r":"Rubella causes German measles, a mild rash illness, and congenital rubella syndrome when the mother is infected early in pregnancy."}],"k":"A","w":[],"i":[],"o":"","f":"PML"},"2026-48":{"id":"2026-48","y":2026,"n":"48","p":8,"t":"T06","s":"Prion proteins in alpha helix conformation are natural components of brains of all living animals.","c":[{"l":"A","x":"True","r":"Normal prion protein (PrPC) has an alpha-helical shape and is a natural component of the body. Disease follows when it is refolded into the beta-pleated sheet form (PrPSc), which is lethal to brain cells and leaves holes in the brain."},{"l":"B","x":"False","r":"False would deny that the normal alpha-helical form is a natural component."}],"k":"A","w":[],"i":[],"o":"","f":"PRIONSHAPE"},"2026-49":{"id":"2026-49","y":2026,"n":"49","p":8,"t":"T06","s":"Which of the following is the causative agent of Creutzfeldt-Jakob disease?","c":[{"l":"A","x":"Slow virus","r":"Conventional slow virus diseases are SSPE and PML."},{"l":"B","x":"Prions","r":"Prions are proteinaceous infectious particles that lack nucleic acid. Misfolded PrPSc forces normal PrPC to change shape and accumulate in the brain, causing transmissible spongiform encephalopathies such as Creutzfeldt-Jakob disease, which presents with progressive dementia, ataxia, and myoclonus. The host shows no inflammatory and no immune response."},{"l":"C","x":"Polyoma Virus","r":"Polyomaviruses include JC virus, the cause of progressive multifocal leukoencephalopathy, BK virus, and Merkel cell virus."},{"l":"D","x":"Lassa Virus","r":"An arenavirus causing Lassa fever."}],"k":"B","w":[],"i":[],"o":"","f":"CJD"},"2026-50":{"id":"2026-50","y":2026,"n":"50","p":9,"t":"T06","s":"What is the shape of a prion that is lethal to the brain?","c":[{"l":"A","x":"Alpha-pleated sheet","r":"The alpha form is normal PrP and harmless."},{"l":"B","x":"Beta-pleated sheet","r":"Normal prion protein (PrPC) has an alpha-helical shape and is a natural component of the body. Disease follows when it is refolded into the beta-pleated sheet form (PrPSc), which is lethal to brain cells and leaves holes in the brain."}],"k":"B","w":[],"i":[],"o":"","f":"PRIONSHAPE"},"2026-51":{"id":"2026-51","y":2026,"n":"51","p":9,"t":"T06","s":"All of the following diseases are associated with Epstein-Barr virus infection, EXCEPT:","c":[{"l":"A","x":"B-cell lymphoma","r":"EBV is associated with Burkitt lymphoma, nasopharyngeal carcinoma, Hodgkin disease, and B-cell lymphoma."},{"l":"B","x":"Burkitt’s Lymphoma","r":"EBV is associated with Burkitt lymphoma, nasopharyngeal carcinoma, Hodgkin disease, and B-cell lymphoma."},{"l":"C","x":"Nasopharyngeal carcinoma","r":"EBV is associated with Burkitt lymphoma, nasopharyngeal carcinoma, Hodgkin disease, and B-cell lymphoma."},{"l":"D","x":"Merkel cell carcinoma","r":"Merkel cell polyomavirus DNA is found in most cases of Merkel cell carcinoma, a rare and aggressive skin cancer."}],"k":"D","w":[],"i":[],"o":"","f":"EBV"},"2026-82":{"id":"2026-82","y":2026,"n":"82","p":15,"t":"T06","s":"Which family does JC virus belong to?","c":[{"l":"A","x":"Retrovirus","r":"Retroviridae hold HIV (lentivirus) and HTLV (deltaretrovirus)."},{"l":"B","x":"Rhinovirus","r":"Common cold picornaviruses."},{"l":"C","x":"Papillomavirus","r":"Papillomaviridae hold HPV."},{"l":"D","x":"Polyomavirus","r":"JC and BK viruses belong to Polyomaviridae. JC virus is a polyomavirus that stays latent after childhood infection. Reactivation in immunocompromised patients such as those with AIDS causes progressive multifocal leukoencephalopathy (PML), a fatal demyelinating disease of the CNS."}],"k":"D","w":[],"i":[],"o":"","f":"PML"},"2026-96":{"id":"2026-96","y":2026,"n":"96","p":17,"t":"T06","s":"Which family does JC virus belong to?","c":[{"l":"A","x":"Retrovirus","r":"Holds HIV and HTLV."},{"l":"B","x":"Rhinovirus","r":"Common cold viruses."},{"l":"C","x":"Papillomavirus","r":"Papillomaviridae hold HPV, which infects surface epithelium and causes warts and cervical cancer."},{"l":"D","x":"Polyomavirus","r":"JC virus is a polyomavirus that stays latent after childhood infection. Reactivation in immunocompromised patients such as those with AIDS causes progressive multifocal leukoencephalopathy (PML), a fatal demyelinating disease of the CNS."}],"k":"D","w":[],"i":["A same-paper repeat of Q82, flagged as such in the 2026 PDF."],"o":"","f":"PML"},"2026-93":{"id":"2026-93","y":2026,"n":"93","p":17,"t":"T06","s":"Which of the following belongs to Group VI (RNA) Virus?","c":[{"l":"A","x":"HIV","r":"Baltimore group VI: positive-sense single-stranded RNA that replicates through reverse transcriptase, as HIV and HTLV do."},{"l":"B","x":"Picornaviridae","r":"Group IV, positive-sense ssRNA."},{"l":"C","x":"Paramyxoviridae","r":"Group V, negative-sense ssRNA."},{"l":"D","x":"Dengue Fever","r":"Group IV, a flavivirus."}],"k":"A","w":[],"i":[],"o":"","f":"RETRO"},"2026-94":{"id":"2026-94","y":2026,"n":"94","p":17,"t":"T01","s":"What is the process by which enveloped viruses are released from host cells after completing viral multiplication inside host cells?","c":[{"l":"A","x":"Cell Membrane Rupture","r":"Rupture is lysis by another name."},{"l":"B","x":"Cell Lysis","r":"Most naked viruses leave by lysis, which kills the host cell."},{"l":"C","x":"Budding","r":"Enveloped viruses are released by budding, taking part of the host cell membrane as their envelope."},{"l":"D","x":"Binary Fission","r":"Asexual reproduction of bacteria, not a viral process."}],"k":"C","w":[],"i":[],"o":"","f":"BUDDING"},"2026-95":{"id":"2026-95","y":2026,"n":"95","p":17,"t":"T02","s":"Erythroid progenitor cells are highly tropic for","c":[{"l":"A","x":"Hepatitis B","r":"Infects differentiated hepatocytes."},{"l":"B","x":"Human Herpes 6","r":"Infects peripheral blood lymphocytes."},{"l":"C","x":"Parvovirus B19","r":"B19 targets erythroid progenitors through the P antigen and halts red cell production."},{"l":"D","x":"HPV 16","r":"Infects surface epithelium and drives its proliferation."}],"k":"C","w":[],"i":[],"o":"","f":"B19ERY"},"2026-97":{"id":"2026-97","y":2026,"n":"97","p":17,"t":"T03","s":"Which of the following enteroviruses is the major cause of epidemic viral gastroenteritis in adults?","c":[{"l":"A","x":"Hepatitis A virus","r":"Gives asymptomatic infection to benign jaundice."},{"l":"B","x":"Norwalk virus","r":"Norwalk virus (norovirus, Caliciviridae) is the major cause of epidemic viral gastroenteritis in adults, with outbreaks on cruise ships and in schools and camps. Illness has rapid onset and recovery, RT-PCR is the gold standard test, there is no vaccine, and prevention is rigorous handwashing."},{"l":"C","x":"Poliovirus","r":"Causes paralysis through motor neuron destruction."},{"l":"D","x":"Rotavirus","r":"Rotavirus (Reoviridae) is a naked virus with a segmented double-stranded RNA genome. It is the leading cause of gastroenteritis in children under 5, with watery diarrhea, vomiting, fever, and dehydration, and is often mild in adults."}],"k":"B","w":[],"i":["The stem calls the choices enteroviruses. Norwalk virus is a calicivirus and rotavirus a reovirus."],"o":"","f":"NORO"},"2026-98":{"id":"2026-98","y":2026,"n":"98","p":18,"t":"T03","s":"Picornaviruses replicate in the cytoplasm of the host cell.","c":[{"l":"A","x":"True","r":"RNA viruses replicate in the cytoplasm, with orthomyxoviruses and retroviruses as the exceptions. Picornavirus replication occurs entirely in the cytoplasm."},{"l":"B","x":"False","r":"False would place replication in the nucleus, as for DNA viruses."}],"k":"A","w":[],"i":[],"o":"","f":"PICOCYTO"},"2026-99":{"id":"2026-99","y":2026,"n":"99","p":18,"t":"T04","s":"Which of the following respiratory viruses are the major cause of acute croup or laryngotracheitis in infants and young children?","c":[{"l":"A","x":"Parainfluenza 1","r":"Parainfluenza types 1 and 2 involve the larynx and upper trachea, causing croup in children 6 to 18 months old."},{"l":"B","x":"Influenza A","r":"Causes influenza with destruction of superficial respiratory mucosa."},{"l":"C","x":"Respiratory Syncytial Virus (RSV)","r":"Targets ciliated airway cells and causes bronchiolitis and pneumonia in infants."},{"l":"D","x":"Adenovirus","r":"Causes pharyngoconjunctival fever and other respiratory, eye, and gut disease."}],"k":"A","w":[],"i":[],"o":"","f":"PIV"}},"FAM":[{"id":"PML","title":"PML is caused by JC virus, a polyomavirus","cat":"D","t":"T06","rule":"Progressive multifocal leukoencephalopathy = reactivated JC virus (Polyomaviridae) demyelinating the CNS of an immunosuppressed patient. BK gives hemorrhagic cystitis and Merkel cell virus gives Merkel cell carcinoma.","pat":"Asked in every year. Early papers offer 'Polyoma' against measles, mumps, and rubella. Later papers split the polyomaviruses and make you pick JC over BK and Merkel cell virus. 2026 also inverts it twice by asking the family of JC virus.","qs":["2025-17","2025-35","2026-47","2026-82","2026-96","2027-75","2028-16"],"flag":"","dy":"","years":[2025,2026,2027,2028],"n":7},{"id":"NORO","title":"Norwalk virus: epidemic viral gastroenteritis in adults","cat":"D","t":"T03","rule":"Epidemic gastroenteritis in adults, travelers, or a cruise ship = Norwalk virus (norovirus, Caliciviridae). Rotavirus is the infant diarrhea virus. RT-PCR is the gold standard test.","pat":"Four years running. The distractor set is fixed: rotavirus, poliovirus, coxsackievirus. 2028 moves one step on and asks for the diagnostic test in a cruise ship outbreak.","qs":["2025-49","2026-97","2027-37","2027-110","2028-26"],"flag":"","dy":"","years":[2025,2026,2027,2028],"n":5},{"id":"PIV","title":"Parainfluenza and croup","cat":"C","t":"T04","rule":"Parainfluenza types 1 and 2 cause croup. In the immunocompetent host replication stays limited to the upper respiratory epithelium.","pat":"2027 and 2028 reuse review item 1 of the MCB 2.04 lecture nearly word for word.","qs":["2025-70","2026-99","2027-83","2028-80"],"flag":"Cross-year discrepancy: 2027 Q83 keys 'croup spreads to the lower respiratory tract' while 2028 Q80 keys 'replication limited to the upper respiratory tract'. The lecture's own answer key supports the 2028 version.","dy":"","years":[2025,2026,2027,2028],"n":4},{"id":"RETRO","title":"Retroviral enzymes: reverse transcriptase, then integrase","cat":"C","t":"T06","rule":"Reverse transcriptase (encoded by pol) copies viral RNA to DNA. Integrase inserts that DNA into the host genome as a provirus. This defines Baltimore group VI, and the drug classes mirror the steps.","pat":"Same pathway, different step each time: the enzyme, the Baltimore group, the role of integrase, the gene, and the drug mechanism.","qs":["2026-45","2026-93","2027-72","2028-6","2028-30","2028-34"],"flag":"","dy":"","years":[2026,2027,2028],"n":6},{"id":"PRIONSHAPE","title":"Prion conformation: alpha-helix is normal, beta-sheet kills","cat":"D","t":"T06","rule":"Normal PrPC is alpha-helical and a natural body component. Disease comes from conversion to beta-pleated PrPSc, which forces more normal protein to misfold and accumulate.","pat":"2025 and 2026 pair a True/False item on the alpha form with a two-choice item on the lethal shape. Choice order flips between those years. 2027 asks the mechanism in words instead.","qs":["2025-36","2025-38","2026-48","2026-50","2027-66"],"flag":"","dy":"","years":[2025,2026,2027],"n":5},{"id":"DROPLET","title":"Droplet precautions: meningococcus and pertussis","cat":"I","t":"T09","rule":"N. meningitidis and B. pertussis travel in large droplets, so droplet precautions with a surgical mask are the minimum. No N95 and no negative pressure.","pat":"2026 and 2027 name the organism and ask the precaution. 2028 names the precaution and asks the organism, with C. difficile, MRSA, TB, and varicella as distractors.","qs":["2026-35","2026-40","2027-42","2027-115","2028-73"],"flag":"","dy":"","years":[2026,2027,2028],"n":5},{"id":"DIMORPH","title":"Systemic dimorphic fungi: signature morphology","cat":"C","t":"T08","rule":"Histoplasma = tiny yeast inside macrophages, tuberculate macroconidia in mold form. Blastomyces = single broad-based bud. Paracoccidioides = ship's wheel. Coccidioides = arthroconidia in mold form, spherules in tissue.","pat":"Each year tests a different organism from the same table, and the other organisms' descriptions serve as the distractors.","qs":["2026-14","2026-16","2027-32","2028-48","2028-51"],"flag":"","dy":"","years":[2026,2027,2028],"n":5},{"id":"CANDIDA","title":"Candida albicans: budding yeast, pseudohyphae, germ tube","cat":"C","t":"T08","rule":"White mucosal patches or creamy discharge with budding yeast and pseudohyphae = Candida albicans. The germ tube test identifies C. albicans.","pat":"The site changes (ICU blood, vagina, mouth) but the microscopy clue does not. C. glabrata and C. auris recur as distractors and C. glabrata became the keyed fluconazole-resistant species in 2028 Q53.","qs":["2026-17","2027-29","2027-59","2027-92","2028-49"],"flag":"","dy":"","years":[2026,2027,2028],"n":5},{"id":"ZIKA","title":"Zika: congenital microcephaly","cat":"C","t":"T05","rule":"Zika is the Aedes-borne flavivirus to fear in pregnancy. Its most serious complication is congenital Zika syndrome with microcephaly. Guillain-Barre syndrome is the adult association.","pat":"Guillain-Barre syndrome and other neurologic options are placed beside microcephaly to tempt you. Microcephaly is keyed every time.","qs":["2026-26","2027-12","2028-63","2028-94"],"flag":"","dy":"","years":[2026,2027,2028],"n":4},{"id":"HANTA","title":"Hantavirus pulmonary syndrome: Sin Nombre virus and the deer mouse","cat":"C","t":"T05","rule":"Sin Nombre hantavirus causes HPS. Reservoir is the deer mouse, transmission is inhaled rodent excreta, there is no vector and no human-to-human spread. Hantaan and Dobrava cause HFRS instead.","pat":"2025 asks which virus causes the syndrome. 2027 asks the true epidemiologic statement. 2028 asks only for the reservoir.","qs":["2025-52","2027-64","2027-114","2028-67"],"flag":"","dy":"","years":[2025,2027,2028],"n":4},{"id":"KOH","title":"KOH preparation for dermatophytes","cat":"C","t":"T07","rule":"A 10 to 20 percent KOH mount is the rapid first test. It shows septate branching hyphae. Calcofluor white adds fluorescence.","pat":"","qs":["2026-5","2026-9","2027-81","2028-43"],"flag":"","dy":"","years":[2026,2027,2028],"n":4},{"id":"PJP","title":"Pneumocystis jirovecii vignette","cat":"D","t":"T08","rule":"Immunocompromised patient + bilateral ground-glass opacities + cysts and trophozoites in sputum = Pneumocystis jirovecii.","pat":"The host changes each year (steroids for SLE, AIDS, unspecified) while the microscopy stays the same.","qs":["2026-20","2027-22","2028-55"],"flag":"","dy":"","years":[2026,2027,2028],"n":3},{"id":"SSPE","title":"SSPE is a late complication of measles","cat":"D","t":"T06","rule":"Subacute sclerosing panencephalitis = measles virus. Do not swap it with PML, which belongs to JC virus.","pat":"Identical four choices every year (measles, mumps, rubella, polyoma) in a different order. It returned in 2028 only as a distractor in Q29.","qs":["2025-34","2026-46","2027-40"],"flag":"","dy":"","years":[2025,2026,2027],"n":3},{"id":"CJD","title":"Creutzfeldt-Jakob disease is a prion disease","cat":"D","t":"T06","rule":"CJD = prions. Dementia, ataxia, myoclonus, and no inflammation. 'Slow virus' is the trap because the conventional slow virus diseases are SSPE and PML.","pat":"2025 and 2026 ask directly with the same distractors. 2028 turns it into a vignette.","qs":["2025-37","2026-49","2028-32"],"flag":"","dy":"","years":[2025,2026,2028],"n":3},{"id":"HIVDIV","title":"HIV diversity: diploid recombination plus error-prone RT","cat":"D","t":"T06","rule":"HIV varies because its two RNA strands recombine and its reverse transcriptase is error prone. The same mutation rate is how it escapes antibodies.","pat":"2025 and 2026 are the same item with reordered choices. 2027 asks the consequence, immune evasion.","qs":["2025-30","2026-43","2027-71"],"flag":"","dy":"","years":[2025,2026,2027],"n":3},{"id":"AVIAN","title":"Avian influenza is a severe lower respiratory disease","cat":"C","t":"T10","rule":"H5N1 binds lower respiratory tract receptors. That means severe pneumonia, high mortality, and limited person-to-person spread.","pat":"","qs":["2026-32","2027-20","2028-91"],"flag":"","dy":"","years":[2026,2027,2028],"n":3},{"id":"ROTADS","title":"Rotavirus: naked, segmented double-stranded RNA","cat":"C","t":"T03","rule":"The dsRNA virus is rotavirus (Reoviridae, Baltimore group III).","pat":"","qs":["2025-7","2027-108","2028-7"],"flag":"","dy":"","years":[2025,2027,2028],"n":3},{"id":"JE","title":"Japanese encephalitis ecology","cat":"C","t":"T05","rule":"Culex vector, rice fields, pigs as amplifying host, humans as dead-end hosts.","pat":"","qs":["2026-31","2027-109","2028-64"],"flag":"","dy":"","years":[2026,2027,2028],"n":3},{"id":"AEDES","title":"Aedes-borne viruses are controlled by vector control","cat":"C","t":"T05","rule":"Dengue, chikungunya, Zika, and yellow fever share the Aedes mosquito, so vector control is the main public health measure.","pat":"","qs":["2025-50","2026-29","2028-59"],"flag":"","dy":"","years":[2025,2026,2028],"n":3},{"id":"POX","title":"Poxvirus is the DNA virus that replicates in the cytoplasm","cat":"D","t":"T02","rule":"All DNA viruses replicate in the nucleus except Poxviridae, which carry their own enzymes and complete the whole cycle in the cytoplasm. Pox is also the DNA virus with complex rather than icosahedral symmetry.","pat":"2025 phrases it as which family does NOT replicate in the nucleus. 2027 asked it in every exam set, once adding 'not icosahedral' as a second clue. The distractors are always adenovirus, herpesvirus, and papillomavirus.","qs":["2025-1","2027-3","2027-24","2027-50","2027-84"],"flag":"","dy":"","years":[2025,2027],"n":5},{"id":"SHIFT","title":"Antigenic shift = reassortment of segmented influenza A","cat":"I","t":"T04","rule":"Influenza A has 8 RNA segments. Two strains in one cell reassort segments, giving a new HA or NA subtype (shift) and pandemics. Non-segmented viruses such as parainfluenza cannot do this.","pat":"2027 gives the mechanism and asks for the virus. 2028 gives the phenomenon and asks for the mechanism, three times. Point mutation (drift) is always the main distractor. 2027 also carried two stem-only recalls on the consequence of shift (Q91, Q93) and a fragment inside Q49.","qs":["2027-7","2027-35","2028-1","2028-87","2028-97"],"flag":"","dy":"","years":[2027,2028],"n":5},{"id":"SPORO","title":"Sporothrix: the thermally dimorphic subcutaneous mycosis","cat":"I","t":"T07","rule":"Sporotrichosis is the only subcutaneous mycosis caused by a thermally dimorphic fungus. Gardening injury, nodules along lymphatics, cigar-shaped yeast at 37°C, flower-like conidia at 25°C.","pat":"2026 asks which mycosis is caused by a dimorphic fungus. 2028 asks which fungus is dimorphic. Chromoblastomycosis and mycetoma are the standing distractors.","qs":["2026-2","2026-12","2028-37","2028-40"],"flag":"","dy":"","years":[2026,2028],"n":4},{"id":"MCANIS","title":"Tinea capitis: M. canis fluoresces, T. tonsurans does not","cat":"I","t":"T07","rule":"Ectothrix Microsporum canis (from cats and dogs) fluoresces under Wood's lamp. Endothrix Trichophyton tonsurans does not.","pat":"2026 asks which does NOT fluoresce. 2027 gives a fluorescent cat-associated case and asks the agent. 2028 Q43 used Wood's lamp as a distractor.","qs":["2026-6","2027-14","2027-77","2027-52"],"flag":"","dy":"","years":[2026,2027],"n":4},{"id":"POLIO","title":"Poliovirus destroys anterior horn motor neurons","cat":"C","t":"T03","rule":"Poliovirus binds PVR (CD155), reaches anterior horn cells, and destroys lower motor neurons. The result is asymmetric flaccid paralysis.","pat":"2027 asks for the agent and the consequence. 2028 embeds the same pathology in the stem and asks for the receptor.","qs":["2027-26","2027-28","2027-103","2028-19"],"flag":"","dy":"","years":[2027,2028],"n":4},{"id":"CONTACT","title":"Contact precautions: C. difficile, draining wounds, diapered diarrhea","cat":"C","t":"T09","rule":"Contact precautions = gown and gloves for organisms carried on hands and surfaces. For C. difficile add soap and water because alcohol is not sporicidal.","pat":"","qs":["2026-33","2026-36","2026-41","2028-75"],"flag":"","dy":"","years":[2026,2028],"n":4},{"id":"FILO","title":"Filoviruses: contact spread, macrophage tropism, RT-PCR","cat":"C","t":"T05","rule":"Ebola and Marburg spread by contact with body fluids, target macrophages and dendritic cells, and are diagnosed by RT-PCR.","pat":"","qs":["2027-16","2027-62","2027-113","2028-66"],"flag":"","dy":"","years":[2027,2028],"n":4},{"id":"CRS","title":"Congenital rubella syndrome","cat":"C","t":"T04","rule":"First-trimester infection carries the highest risk. Triad of cataract, heart defect, and deafness. Infant IgM is diagnostic because maternal IgM cannot cross the placenta.","pat":"","qs":["2025-65","2025-66","2027-53","2027-99"],"flag":"","dy":"","years":[2025,2027],"n":4},{"id":"HBVCHR","title":"Chronic hepatitis B: HBsAg beyond 6 months","cat":"D","t":"T02","rule":"HBsAg persisting beyond 6 months without anti-HBs = chronic infection. Anti-HBs alone = vaccinated.","pat":"All versions use the same four serology combinations. 2025 Q25 tested the neighbouring fact, that isolated anti-HBs means vaccination.","qs":["2027-25","2027-85","2028-18"],"flag":"","dy":"","years":[2027,2028],"n":3},{"id":"ONETYPE","title":"One antigenic type gives lifelong immunity","cat":"D","t":"T04","rule":"Mumps, measles, and rubella each have a single antigenic type, so one infection gives lasting immunity.","pat":"Taken from review items 2 and 15 of MCB 2.04.","qs":["2027-87","2027-97","2028-81"],"flag":"","dy":"","years":[2027,2028],"n":3},{"id":"HSVROUTE","title":"HSV transmission and genital HSV-2","cat":"I","t":"T02","rule":"HSV spreads by saliva, lesions, sex, and birth. Never the fecal-oral route. HSV-2 = painful genital vesicles with inguinal nodes.","pat":"","qs":["2027-73","2028-10","2028-12"],"flag":"","dy":"","years":[2027,2028],"n":3},{"id":"HBVHCC","title":"Hepatitis B and hepatocellular carcinoma","cat":"C","t":"T06","rule":"Hepatitis B is the tumor-causing hepatitis virus in these papers. The mechanism is persistent infection with necrosis, inflammation, and regeneration leading to cirrhosis and HCC.","pat":"2027 asks which virus. 2028 asks the mechanism and offers 'integration of viral oncogenes' as the trap.","qs":["2027-5","2027-70","2028-33"],"flag":"","dy":"","years":[2027,2028],"n":3},{"id":"CVDPV","title":"Circulating vaccine-derived poliovirus type 2","cat":"C","t":"T10","rule":"cVDPV is mutated Sabin virus spreading person to person. Type 2 causes 86 percent of it, and it caused the 2019 to 2021 Philippine outbreak.","pat":"","qs":["2026-24","2026-27","2028-93"],"flag":"","dy":"","years":[2026,2028],"n":3},{"id":"AIRBORNE","title":"Airborne precautions: measles and tuberculosis","cat":"C","t":"T09","rule":"Measles, TB, and varicella travel in droplet nuclei. They need a negative-pressure room and an N95.","pat":"","qs":["2026-34","2026-37","2027-45"],"flag":"","dy":"","years":[2026,2027],"n":3},{"id":"COXA","title":"Coxsackie A: hand-foot-and-mouth disease and herpangina","cat":"C","t":"T03","rule":"Vesicles on palms, soles, and mouth = HFMD. Vesicles in the posterior oropharynx = herpangina. Both are coxsackie A, a picornavirus.","pat":"","qs":["2027-31","2027-58","2028-22"],"flag":"","dy":"","years":[2027,2028],"n":3},{"id":"RABREC","title":"Rabies attachment: G glycoprotein and the nicotinic acetylcholine receptor","cat":"C","t":"T06","rule":"The G glycoprotein spike binds the nicotinic acetylcholine receptor at the neuromuscular junction. That explains CNS tropism and why G is the antibody target.","pat":"","qs":["2025-8","2025-29","2028-35"],"flag":"","dy":"","years":[2025,2028],"n":3},{"id":"CRYPTO","title":"Cryptococcus neoformans: the capsule","cat":"C","t":"T08","rule":"The polysaccharide capsule shows on India ink and is the antiphagocytic virulence factor. Disease is chronic meningitis.","pat":"","qs":["2026-19","2028-54","2028-56"],"flag":"","dy":"","years":[2026,2028],"n":3},{"id":"DERMID","title":"Dermatophyte identification by culture morphology","cat":"C","t":"T07","rule":"E. floccosum = club-shaped macroconidia, no microconidia. T. schoenleinii = no conidia, favic chandeliers. T. rubrum = red reverse. M. canis = yellow reverse.","pat":"","qs":["2026-1","2026-11","2028-42"],"flag":"","dy":"","years":[2026,2028],"n":3},{"id":"B19SLAP","title":"Parvovirus B19: slapped-cheek vignette","cat":"D","t":"T02","rule":"Slapped-cheek malar rash in a child = parvovirus B19, erythema infectiosum.","pat":"The 7-year-old is word for word the same in both years. Only the choice order moved.","qs":["2027-11","2028-13"],"flag":"","dy":"","years":[2027,2028],"n":2},{"id":"ADPOOL","title":"Adenovirus: swimming pool conjunctivitis","cat":"D","t":"T02","rule":"Fever, sore throat, and conjunctivitis after swimming = adenovirus pharyngoconjunctival fever.","pat":"Same 23-year-old in both years. 2028 added a fourth choice.","qs":["2027-13","2028-15"],"flag":"","dy":"","years":[2027,2028],"n":2},{"id":"ADROUTE","title":"Adenovirus routes EXCEPT blood transfusion","cat":"D","t":"T02","rule":"Adenovirus spreads by contact, fecal-oral route, droplets, and fomites. Not by transfusion.","pat":"","qs":["2027-69","2028-14"],"flag":"","dy":"","years":[2027,2028],"n":2},{"id":"HSV1KID","title":"HSV-1 gingivostomatitis in a 5-year-old","cat":"D","t":"T02","rule":"Vesiculoulcerative lesions of the mouth after fever in a young child = primary HSV-1.","pat":"Identical stem. The fourth choice is HPV in both years.","qs":["2027-74","2028-17"],"flag":"","dy":"","years":[2027,2028],"n":2},{"id":"DRIFT","title":"Consequence of antigenic drift","cat":"D","t":"T04","rule":"Drift = point mutations in HA and NA epitopes, so existing antibodies no longer neutralize. New subtypes and pandemics belong to shift.","pat":"Review item 9 of MCB 2.04.","qs":["2027-94","2028-88"],"flag":"","dy":"","years":[2027,2028],"n":2},{"id":"FLUDEATH","title":"Influenza kills its host cell","cat":"D","t":"T04","rule":"Outcome of influenza infection for the host cell = cell death.","pat":"Review item 10 of MCB 2.04. Same four outcomes in both years.","qs":["2027-95","2028-89"],"flag":"","dy":"","years":[2027,2028],"n":2},{"id":"PERT","title":"Pertussis re-emergence = waning immunity","cat":"D","t":"T10","rule":"Pertussis came back mainly because immunity wanes after acellular vaccine.","pat":"","qs":["2026-23","2028-92"],"flag":"","dy":"","years":[2026,2028],"n":2},{"id":"HTLV","title":"HTLV-1 causes adult T-cell leukemia-lymphoma","cat":"D","t":"T06","rule":"HTLV-1 = adult T-cell leukemia-lymphoma and tropical spastic paraparesis.","pat":"Exact repeat with the same distractors: PML, CJD, kuru.","qs":["2025-32","2026-44"],"flag":"","dy":"","years":[2025,2026],"n":2},{"id":"EBV","title":"EBV associations EXCEPT Merkel cell carcinoma","cat":"D","t":"T06","rule":"EBV = Burkitt lymphoma, nasopharyngeal carcinoma, Hodgkin disease, B-cell lymphoma. Merkel cell carcinoma belongs to a polyomavirus.","pat":"Exact repeat. Merkel cell virus then reappears as a distractor in the 2027 and 2028 PML items.","qs":["2025-39","2026-51"],"flag":"","dy":"","years":[2025,2026],"n":2},{"id":"SMALLPOX","title":"Smallpox vaccine is live vaccinia","cat":"D","t":"T02","rule":"The smallpox vaccine contains live vaccinia virus, not variola.","pat":"2028 Q90 builds on it: smallpox vaccine cross-protects against mpox.","qs":["2025-24","2027-49"],"flag":"","dy":"","years":[2025,2027],"n":2},{"id":"RUBIGG","title":"Maternal rubella IgG protects the infant for 4 to 6 months","cat":"D","t":"T04","rule":"Transplacental maternal IgG gives natural passive immunity lasting 4 to 6 months.","pat":"","qs":["2025-63","2028-79"],"flag":"","dy":"","years":[2025,2028],"n":2},{"id":"EV70","title":"Enterovirus 70: acute hemorrhagic conjunctivitis","cat":"D","t":"T03","rule":"Sudden painful subconjunctival hemorrhage = enterovirus 70 (or coxsackie A24).","pat":"","qs":["2025-42","2028-21"],"flag":"","dy":"","years":[2025,2028],"n":2},{"id":"B19ERY","title":"Parvovirus B19 targets erythroid progenitors","cat":"I","t":"T02","rule":"B19 binds the P antigen on erythroid progenitors and stops red cell production.","pat":"2025 asks the cell for the virus. 2026 asks {"name":"One-step viral growth curve phases","t":"T01","years":[2025,2027],"status":"1 family · 2 appearances · 1 bank question","go":"fam"},{"name":"HPV 16 and 18: high-risk types","t":"T02","years":[2025,2027],"status":"1 family · 2 appearances · 1 bank question","go":"fam"},{"name":"Picornavirus capsid: VP1 to VP4 and the canyon","t":"T03","years":[2025,2028],"status":"1 family · 2 appearances · 1 bank question","go":"fam"},{"name":"Tinea pedis agent: T. rubrum or T. mentagrophytes","t":"T07","years":[2026,2028],"status":"1 family · 2 appearances · 1 bank question · flagged discrepancy","go":"fam"},{"name":"Standard precautions: what is and is not included","t":"T09","years":[2026,2028],"status":"1 family · 2 appearances · 1 bank question","go":"fam"},{"name":"Candida biofilm on catheters","t":"T08","years":[2026,2028],"status":"1 family · 2 appearances · 1 bank question","go":"fam"},{"name":"Aspergillus: fungus ball and acute-angle septate hyphae","t":"T08","years":[2027,2028],"status":"1 family · 2 appearances · 2 bank questions","go":"fam"},{"name":"Chromoblastomycosis: cauliflower lesion, sclerotic bodies","t":"T07","years":[2027,2028],"status":"1 family · 2 appearances · 2 bank questions","go":"fam"},{"name":"Yellow fever: two cycles and the 17D vaccine","t":"T05","years":[2027,2028],"status":"1 family · 2 appearances · 2 bank questions","go":"fam"},{"name":"SARS-CoV-2 variant categories","t":"T10","years":[2027,2028],"status":"1 family · 2 appearances · 2 bank questions · flagged discrepancy","go":"fam"},{"name":"MERS-CoV and the camel","t":"T04","years":[2025,2026],"status":"1 family · 2 appearances · 0 bank questions","go":"fam"},{"name":"Henipaviruses: bat-borne zoonoses","t":"T04","years":[2026,2028],"status":"1 family · 3 appearances · 3 bank questions · distractor in 2026","go":"fam"},{"name":"Emergence factors: all of the above","t":"T10","years":[2027,2028],"status":"keyed twice in 2027 only · its options return as distractors in 2028 Q92 · 2 bank questions","go":"bank"},{"name":"Fluconazole-resistant Candida glabrata","t":"T08","years":[2026,2028],"status":"recurring distractor in 2026 Q17 · keyed once in 2028 Q53 · 1 bank question","go":"bank"},{"name":"Amphotericin B for severe systemic mycosis","t":"T08","years":[2026,2028],"status":"keyed in 2026 Q16 (in the dimorphic fungi family) · recurring distractor in 2028 Q44 and Q50","go":"bank"},{"name":"Oncogenic virus lists and mechanisms","t":"T06","years":[2026,2028],"status":"different fact each year (2026 Q52 variola not oncogenic, 2028 Q9 and Q28 mechanisms) · no family yet · 2 bank questions","go":"bank"},{"name":"Respiratory syncytial virus","t":"T04","years":[2026,2028],"status":"different fact each year (2026 Q100 hMPV resembles RSV, 2028 Q82 and Q85) · no family yet · 2 bank questions","go":"bank"},{"name":"Dengue diagnosis and severity","t":"T05","years":[2025,2028],"status":"different fact each year (2025 Q51 second serotype, 2028 Q60 NS1) · vector control is covered by a family · 1 bank question","go":"bank"},{"name":"Hepatitis D needs hepatitis B as helper","t":"T01","years":[2025,2027],"status":"keyed only in 2025 Q4 · recurring distractor in 2027 Q5 and Q70","go":"bank"},{"name":"Rotavirus VP4 and VP7","t":"T03","years":[2025,2028],"status":"keyed in 2025 Q47 · appears as a distractor rationale in 2028 Q24 and Q25 · no family yet","go":"bank"},{"name":"Vaccine types and vaccinology (HPV subunit, toxoid, contraindications)","t":"UNC","years":[2025,2026],"status":"not covered here · outside the ten MCB LEC files and outside the 2027 and 2028 bank","go":""},{"name":"COVID-19 rapid antibody test reading","t":"UNC","years":[2025],"status":"single year · laboratory material outside the MCB LEC files · not covered here","go":""},{"name":"Bacteriology and immunology items (LE1 and LE2 topics)","t":"UNC","years":[2026],"status":"single year (2026 Q61 to Q92) · outside the MCB LEC files · not covered here","go":""},{"name":"Hepatitis E outbreaks","t":"UNC","years":[2027],"status":"single year · 1 bank question filed as Uncategorized (2027 Q63)","go":"bank"}],"T":{"T01":"MCB 2.01 Introduction to Virology","T02":"MCB 2.02 DNA Viruses","T03":"MCB 2.03 RNA Viruses 1","T04":"MCB 2.04 RNA Viruses 2","T05":"MCB 2.05 RNA Viruses 3","T06":"MCB 2.06 RNA Viruses 4","T07":"MCB 2.07 Mycology 1","T08":"MCB 2.08 Mycology 2","T09":"MCB 2.09 Patient Safety","T10":"MCB 2.10 Emerging and Re-emerging Infections","UNC":"Uncategorized"},"STATS":[["4","exam years analyzed (2025 to 2028)"],["4","exam PDFs scanned, plus 10 lecture files"],["264","questions built with per-choice rationales"],["185","questions in the 2027 + 2028 bank"],["68","repeat families"],["205","repeated question instances"],["11","topics represented"],["83","radar concepts"],["106","lecture reviews pulled from the 10 MCB trans"]],"NOTE":"<ul>\n<li><b>Target.</b> This site is built around what the examiners keep asking. Families group the same concept across years, keep every year's version separate, and explain every choice.</li>\n<li><b>Bank.</b> The All Questions tab holds every recalled question of 2028 (100 of 100) and 2027 (83 numbered slots with content). The 2027 PDF is a draft recall with 32 blank placeholder rows that carry no question text: 1, 6, 10, 15, 17, 18, 19, 23, the second 25, 27, 30, 36, 39, 41, 46, 47, 56, 57, 60, 61, 67, 80, 88, 89, 90, 96, 100, 105, 106, the Set A 108, 111, 112. They are omitted. Stem-only and choice-only recalls are kept and marked.</li>\n<li><b>2025 and 2026.</b> These years were scanned in full for repeats. Only their questions that belong to a family are built out (34 from 2025, 48 from 2026). Their other questions are not shown, as requested.</li>\n<li><b>Topics.</b> One bucket per MCB LEC file in the project (2.01 to 2.10). 2028 items follow the coverage table printed on that paper. Anything not taught in those ten files is filed as Uncategorized: 2027 Q63 (hepatitis E). Out-of-source subjects seen in other years are listed at the bottom of the Repeat Radar: vaccinology and LE1/LE2 bacteriology and immunology (2026 Q53 to Q92), COVID-19 rapid antibody testing (2025 Q55, Q56, Q67).</li>\n<li><b>Sources.</b> Rationales draw first on the rationale printed with the question, then on other exam years, then on the MCB lecture text. Where those could not support a statement the line says so. Printed keys are never changed. Conflicts are flagged in amber.</li>\n<li><b>Keys.</b> Every key was recovered twice, by reading and by page geometry, and the two agreed on all items. Items with no printed key show a dash.</li>\n<li><b>Lecture Review column.</b> Every repeat family and every 2028 question now carries a review pulled from the MCB 2.01 to 2.10 trans: the concept being tested, the mechanism, and side-by-side comparisons with the neighbouring concepts in the same lecture. In a family table it is the rightmost column; in the All Questions tab it sits under the rationales. 2028 questions that belong to a family show that family's review. Each review ends with the trans section it was drawn from. Use the \"Lecture Review\" button in the toolbar to hide or show the column.</li></ul>","YEARS":[2028,2027,2026,2025],"BANKYEARS":[2028,2027],"REV":{"BUDDING":"<h5>Release step of APUSAR</h5><ul><li>Six steps: <b>A</b>ttachment → <b>P</b>enetration → <b>U</b>ncoating → <b>S</b>ynthesis → <b>A</b>ssembly → <b>R</b>elease</li><li>Release is the last step, and the method is fixed by whether the virus has an envelope<ul><li><b>Enveloped</b> → <b>budding</b> through the host membrane; the envelope is picked up at this moment (phospholipid bilayer from the plasma membrane, EXCEPT herpes = nuclear membrane)</li><li><b>Naked</b> → <b>lysis</b> of the host cell, which may end in apoptosis and cell death</li></ul></li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Step</th><th>What happens</th><th>Naked vs enveloped</th></tr></thead><tbody><tr><td>Attachment</td><td>spikes/capsid proteins bind specific receptors = tissue tropism (HIV gp120-CD4, SARS-CoV-2 S-ACE2, flu HA-sialic acid)</td><td>same</td></tr><tr><td>Penetration</td><td>direct fusion, or viropexis (receptor-mediated endocytosis)</td><td>naked = viropexis only; enveloped = fusion or viropexis</td></tr><tr><td>Uncoating</td><td>capsid degraded by viral/host enzymes; START of the eclipse phase</td><td>same</td></tr><tr><td>Synthesis</td><td>genome replication + protein synthesis; basis of Baltimore groups; early proteins = enzymes, late = structural</td><td>DNA in nucleus (except pox); RNA in cytoplasm (except orthomyxo, retro)</td></tr><tr><td>Assembly</td><td>genome enclosed in capsid</td><td>same</td></tr><tr><td>Release</td><td>budding vs lysis</td><td>enveloped = budding; naked = lysis</td></tr></tbody></table></div><ul><li>Naked viruses: Parvo, Papilloma, Polyoma, Adeno (DNA) and Picorna, Reo, Calici, Hepe (RNA). Everything else is enveloped.</li><li>Why it matters clinically: naked = resistant to ether/alcohol/dry heat, survives gastric acid, fecal-oral spread; enveloped = labile, direct contact/droplet/sexual/parenteral spread</li></ul><p class=\"rsrc\">Source: MCB 2.01 Viral Replication Cycle, Table 5, 17, 21</p>","GROWTH":"<h5>One-step viral growth curve (2.01)</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Phase</th><th>Name</th><th>What is happening</th></tr></thead><tbody><tr><td>0</td><td>Entry</td><td>virus enters cell</td></tr><tr><td>1</td><td>Decline</td><td>virus count falls but virus keeps functioning</td></tr><tr><td>2</td><td><b>Eclipse</b></td><td><b>no virus detectable inside the cell</b>; genome and protein synthesis is going on; begins at UNCOATING</td></tr><tr><td>3</td><td>Exponential / rise</td><td>progeny virions increase exponentially (8-72 h)</td></tr><tr><td>4</td><td>Latent (plateau)</td><td>no further increase in yield; 100-10,000 virions per cell, intracellular or extracellular</td></tr><tr><td>5</td><td>Cytopathic effect</td><td>derangement of cell function → changes in size/shape (elongation, ballooning), lysis, death</td></tr></tbody></table></div><ul><li>Trap: <b>eclipse</b> = cannot recover infectious particles from the specimen (they are dismantled); <b>latent</b> here = plateau, not the same as latent INFECTION (VZV in ganglia)</li><li>The eclipse period starts with uncoating; the lecturer compares the curve to the bacterial growth curve</li></ul><h5>Cytopathic effects to recognise</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>CPE</th></tr></thead><tbody><tr><td>Paramyxovirus (RSV, measles, mumps)</td><td>syncytium + faint basophilic cytoplasmic inclusions</td></tr><tr><td>Poxvirus</td><td>pink eosinophilic cytoplasmic inclusions, cell swelling</td></tr><tr><td>Herpesvirus</td><td>cytoplasmic stranding, nuclear inclusions, ballooning</td></tr><tr><td>Adenovirus</td><td>cell enlargement, rounding, grape-like clusters</td></tr><tr><td>Enterovirus 71</td><td>ballooning</td></tr></tbody></table></div><ul><li>Patterns of infection: abortive (non-permissive cell, e.g. HDV without HBV), lytic (progeny + CPE + shut-off of host synthesis), persistent (transformation, chronic like HBV/HCV, latent like VZV)</li></ul><p class=\"rsrc\">Source: MCB 2.01 Viral Growth Curve, Table 12, 22</p>","2028-2":"<h5>What a virus is (2.01 general characteristics)</h5><ul><li><b>Acellular</b>: no organelles, no metabolic machinery → not considered living</li><li><b>Submicroscopic</b>: 20-300 nm; passes bacterial filters; needs electron microscope (not Gram stain, not light microscope)</li><li>Contains <b>either DNA or RNA</b>, never both, inside a protein capsid; some add a host-derived lipid envelope</li><li>No genes for protein synthesis machinery, energy production, or membrane synthesis → <b>obligate intracellular parasite</b> (same idea as Rickettsia, Mycoplasma, Chlamydia)</li><li>Resistant to antibiotics; inhibited by interferon and antivirals</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Prokaryote (bacteria)</th><th>Eukaryote (fungi, human)</th><th>Virion</th></tr></thead><tbody><tr><td>Size</td><td>1-10 μm</td><td>10-100 μm</td><td>20-300 nm</td></tr><tr><td>Cellular?</td><td>yes</td><td>yes</td><td>no</td></tr><tr><td>Genome</td><td>DNA + RNA</td><td>DNA + RNA</td><td>DNA or RNA</td></tr></tbody></table></div><h5>Virion vocabulary</h5><ul><li>Naked virion = capsid + genome; enveloped virion = capsid + genome + envelope with spikes</li><li>Nucleocapsid = capsid + nucleic acid together</li></ul><p class=\"rsrc\">Source: MCB 2.01 I, III</p>","2028-3":"<h5>Layers of a virion, inside → out</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Layer</th><th>What it is</th><th>Function</th></tr></thead><tbody><tr><td>Genome</td><td>DNA or RNA</td><td>blueprint</td></tr><tr><td><b>Capsid</b></td><td>protein coat built from capsomeres</td><td>protects genome from nucleases; gives symmetry</td></tr><tr><td>Nucleocapsid</td><td>capsid + genome as one unit</td><td>the combined structure, not the protein alone</td></tr><tr><td>Tegument</td><td>amorphous protein layer between capsid and envelope</td><td><b>herpesviruses only</b>; carries enzymes/transcription factors</td></tr><tr><td>Matrix (M)</td><td>protein between envelope and nucleocapsid</td><td>links the two; may have enzymatic/biologic roles</td></tr><tr><td>Envelope</td><td>phospholipid bilayer from host membrane (nuclear membrane for herpes)</td><td>carries glycoprotein spikes/peplomers for attachment and immunity</td></tr></tbody></table></div><h5>Capsid symmetry</h5><ul><li><b>Icosahedral</b> (20 faces): mostly DNA viruses and (+) RNA viruses; can be naked or enveloped</li><li><b>Helical</b>: enveloped (-) RNA viruses (all human helical viruses are enveloped)</li><li><b>Complex</b>: poxvirus (brick/dumbbell with lateral bodies), rabies (bullet)</li><li>Simplest viruses encode ~4 proteins; complex ones 100-200</li></ul><p class=\"rsrc\">Source: MCB 2.01 III.D Capsid, Table 7</p>","2028-4":"<h5>Where and how viruses replicate</h5><ul><li>Viruses are <b>obligate intracellular parasites</b>: outside a living cell they cannot self-replicate<ul><li>lack genes for protein synthesis machinery, energy production, membrane synthesis</li><li>all viral protein synthesis depends entirely on host ribosomes</li></ul></li><li>Cannot grow on nutrient agar, in broth, or in cell-free media; cultivation needs living cells:</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Culture system</th><th>Examples</th><th>Use</th></tr></thead><tbody><tr><td>Primary culture (rhesus monkey kidney)</td><td>polio, entero, rhino, pox</td><td>vaccine production; expensive</td></tr><tr><td>Semicontinuous (CV-1, African green monkey kidney)</td><td>RSV, measles, HSV, VZV</td><td>vaccine production</td></tr><tr><td>Continuous (HeLa, Vero, Hep2, MDCK, A549)</td><td>adeno, HSV, flu, measles, mumps, polio, RSV</td><td>serologic antigens, neutralising Ab assays</td></tr><tr><td>Embryonated chick egg</td><td>pocks on CAM (HSV, pox), haemagglutination (flu), inclusion bodies</td><td>isolation</td></tr></tbody></table></div><ul><li>Detection in infected cells: haemadsorption (RBC stick to infected cells), PCR, cytopathic effect, chick embryo</li><li>Temperature and pH modulate speed but never substitute for a host cell</li></ul><p class=\"rsrc\">Source: MCB 2.01 I, VIII, IX</p>","2028-5":"<h5>Enveloped vs naked RNA viruses</h5><ul><li>Majority of human viruses are enveloped; the <b>naked RNA</b> families are only four: <b>Picorna, Reo, Calici, Hepe</b> (naked DNA: Parvo, Papilloma, Polyoma, Adeno)</li><li>Influenza (Orthomyxoviridae) is <b>enveloped, helical</b>; HA and NA spikes sit in that envelope</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Naked RNA</th><th>Enveloped RNA</th></tr></thead><tbody><tr><td>Picornaviridae (polio, entero, rhino, echo, HAV)</td><td>Orthomyxoviridae (influenza)</td></tr><tr><td>Reoviridae (rotavirus)</td><td>Paramyxoviridae, Rhabdoviridae, Filoviridae</td></tr><tr><td>Caliciviridae (Norwalk)</td><td>Flaviviridae, Togaviridae, Coronaviridae</td></tr><tr><td>Hepeviridae (HEV)</td><td>Retroviridae, Bunyaviridae, Arenaviridae</td></tr></tbody></table></div><ul><li>Consequences of the envelope: sensitive to ether, alcohol, detergent, dry heat; cannot survive gastric acid; spread by direct contact/droplet/sex/parenteral (not fecal-oral)</li><li>All enveloped viruses take their envelope from the host membrane during budding, EXCEPT herpes (nuclear membrane)</li></ul><p class=\"rsrc\">Source: MCB 2.01 Table 5, 6, 16, 18</p>","2028-8":"<h5>Capsid symmetry of DNA viruses</h5><ul><li>Nearly all DNA viruses are <b>icosahedral</b> (cubic, 20 triangular faces)<ul><li>Naked icosahedral: Adeno, Papilloma, Polyoma, Parvo</li><li>Enveloped icosahedral: Herpes, Hepadna (HBV)</li></ul></li><li>The one exception: <b>Poxviridae = enveloped, complex</b> (brick-shaped, dumbbell core with lateral bodies)</li><li>Helical symmetry is the pattern of enveloped (-)RNA viruses, not DNA viruses</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>DNA family</th><th>Genome</th><th>Envelope</th><th>Symmetry</th><th>Baltimore</th></tr></thead><tbody><tr><td>Parvo</td><td>ssDNA linear</td><td>naked</td><td>icosahedral</td><td>II</td></tr><tr><td>Papilloma / Polyoma</td><td>dsDNA circular</td><td>naked</td><td>icosahedral</td><td>I</td></tr><tr><td>Adeno</td><td>dsDNA linear</td><td>naked</td><td>icosahedral</td><td>I</td></tr><tr><td>Herpes</td><td>dsDNA linear</td><td>enveloped (nuclear membrane)</td><td>icosahedral</td><td>I</td></tr><tr><td>Hepadna</td><td>partly ds circular (gapped)</td><td>enveloped</td><td>icosahedral</td><td>VII</td></tr><tr><td>Pox</td><td>dsDNA linear</td><td>enveloped</td><td><b>complex</b></td><td>I</td></tr></tbody></table></div><ul><li>Other DNA rules: all dsDNA except Parvo; all replicate in the nucleus except Pox; no (-) strand DNA viruses exist</li></ul><p class=\"rsrc\">Source: MCB 2.01 III.D, Table 15, 19</p>","2028-9":"<h5>How oncogenic viruses cause cancer (2.01 + 2.06)</h5><ul><li>Persistent infection pattern: <b>viral transformation</b> = viral infection or gene product induces unregulated growth → tumor</li><li>Direct-acting: viral genome <b>integrates</b> and disrupts/activates cellular genes, or viral oncoproteins bind tumor suppressors</li><li>Indirect-acting: chronic inflammation, necrosis and regeneration (HBV, HCV) or immunosuppression (HIV)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Virus</th><th>Oncoprotein / mechanism</th><th>Target</th></tr></thead><tbody><tr><td>HPV 16/18</td><td>E6 degrades p53; E7 binds pRb → releases E2F</td><td>cervical, anal, oropharyngeal ca</td></tr><tr><td>SV40 / polyoma</td><td>Large T antigen binds p53 + pRb; small t targets PP2A</td><td>model tumor virus</td></tr><tr><td>Adenovirus</td><td>E1A binds pRb; E1B-55k binds p53</td><td>animal tumors</td></tr><tr><td>EBV</td><td>LMP1 = constitutively active growth receptor (NF-κB); EBNA1</td><td>Burkitt, NPC, Hodgkin, PTLD</td></tr><tr><td>HBV</td><td>persistent infection → necrosis/inflammation/regeneration → cirrhosis; X protein transactivator</td><td>HCC</td></tr><tr><td>HTLV-1</td><td>Tax transregulator; no oncogene</td><td>ATL</td></tr><tr><td>Retroviruses (acute)</td><td>carry host-derived oncogene (v-onc)</td><td>sarcomas, leukemias</td></tr></tbody></table></div><ul><li>Proto-oncogene activated by viral promoter insertion; tumor suppressor needs BOTH alleles lost (Rb → retinoblastoma; p53 mutated in 50% of cancers)</li><li>Viruses are usually cofactors: necessary but not sufficient; long latency; ~15-20% of human tumors are viral</li></ul><p class=\"rsrc\">Source: MCB 2.01 VII.C; MCB 2.06 IV Human Cancer Viruses</p>","POX":"<h5>Poxviridae: the DNA exception</h5><ul><li>Rule: DNA viruses replicate in the <b>nucleus</b> (need host DNA-dependent RNA polymerase) EXCEPT <b>Poxviridae</b> → entire cycle in the <b>cytoplasm</b><ul><li>Virion carries its own enzymes: viral DNA-dependent RNA polymerase, DNA polymerase, thymidine kinase</li><li>Cycle: attach → fuse → cores released into cytoplasm → uncoating → early/late mRNA → structural proteins → envelope acquired on budding → rapid shut-off of host macromolecular synthesis → cell death</li></ul></li><li>Also the DNA exception for symmetry: <b>complex</b> (brick/oval, ridged surface, core + lateral bodies), largest DNA virus, very resistant to inactivation</li><li>Immune evasion: viral homologues of TNF receptor, IFN-γ receptor, IL-1 receptor, complement-binding proteins</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Parallel rule</th><th>Exceptions</th></tr></thead><tbody><tr><td>DNA viruses replicate in nucleus</td><td>Pox (cytoplasm)</td></tr><tr><td>RNA viruses replicate in cytoplasm</td><td>Orthomyxo (influenza), Retro (HIV, HTLV, HBV)</td></tr><tr><td>DNA viruses are dsDNA</td><td>Parvo (ssDNA)</td></tr><tr><td>DNA viruses are icosahedral</td><td>Pox (complex)</td></tr></tbody></table></div><h5>Members</h5><ul><li>Variola (smallpox: eradicated 1980; first viral disease eradicated; inhalation spread; lesions all in same stage vs chickenpox in crops), vaccinia (vaccine), cowpox (rodent reservoir; milkers), monkeypox/Mpox, molluscum contagiosum (umbilicated waxy papules; imiquimod)</li><li>Diagnosis: PCR from skin lesion; CPE = pink eosinophilic cytoplasmic inclusions (Guarnieri) with cell swelling; pocks on CAM</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.B Poxviridae; MCB 2.01 Synthesis</p>","HBVCHR":"<h5>HBV serology, the table the lecturer flagged for the exam</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Marker</th><th>Meaning</th></tr></thead><tbody><tr><td>HBsAg</td><td>first marker; <b>active infection</b>; persistence <b>&gt;6 months = chronic</b></td></tr><tr><td>Anti-HBs</td><td>seroconversion = cleared/immune; ALONE = <b>vaccinated</b>; &gt;10 mIU/mL = immune</td></tr><tr><td>HBcAg</td><td>in nucleocapsid, not measured</td></tr><tr><td>Anti-HBc IgM</td><td>recent infection (&lt;6 mo); the only positive in the <b>window period</b> (with anti-HBe)</td></tr><tr><td>Anti-HBc IgG/total</td><td>exposure ever (resolved OR chronic); never from vaccine</td></tr><tr><td>HBeAg</td><td>active replication, <b>high infectivity</b></td></tr><tr><td>Anti-HBe</td><td>transition to inactive carrier; natural infection only</td></tr><tr><td>HBV DNA</td><td>high load = higher risk of cirrhosis/HCC</td></tr></tbody></table></div><h5>Patterns</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Scenario</th><th>HBsAg</th><th>anti-HBs</th><th>anti-HBc</th><th>HBeAg</th><th>anti-HBe</th></tr></thead><tbody><tr><td>Incubation</td><td>+</td><td>-</td><td>-</td><td>±</td><td>-</td></tr><tr><td>Acute, high infectivity</td><td>+</td><td>-</td><td>IgM +</td><td>+</td><td>-</td></tr><tr><td>Window</td><td>-</td><td>-</td><td>+</td><td>-</td><td>+</td></tr><tr><td>Chronic replicating</td><td>+</td><td>-</td><td>+</td><td>+</td><td>-</td></tr><tr><td>Chronic non-replicating (inactive carrier)</td><td>+</td><td>-</td><td>+</td><td>-</td><td>+</td></tr><tr><td>Recovered</td><td>-</td><td>+</td><td>+</td><td>-</td><td>+</td></tr><tr><td>Vaccinated</td><td>-</td><td>+</td><td>-</td><td>-</td><td>-</td></tr><tr><td>Susceptible</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr></tbody></table></div><ul><li>Chronicity risk highest when infected as infant (up to 90%) vs ~5% adults (95% of adults clear within 6 months, no specific treatment)</li><li>Cirrhosis risk highest when HBeAg is not cleared; HCC appears years later</li><li>First-line for chronic: pegylated IFN-α, entecavir, tenofovir; prevention = recombinant vaccine (most effective measure), screen all pregnant women, post-exposure prophylaxis of infants</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.C HBV Serology, Table 20</p>","HSVROUTE":"<h5>HSV-1 vs HSV-2</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>HSV-1</th><th>HSV-2</th></tr></thead><tbody><tr><td>Primary site</td><td>oropharynx</td><td>genital tract</td></tr><tr><td>Transmission</td><td>saliva, kissing, contaminated fingers</td><td>sexual intercourse, passage through infected birth canal</td></tr><tr><td>Latency</td><td>trigeminal ganglia</td><td>sacral ganglia</td></tr><tr><td>Classic disease</td><td>gingivostomatitis (age 1-5), fever sores, keratoconjunctivitis (dendritic ulcer), herpetic whitlow, encephalitis (most common sporadic fatal encephalitis in US)</td><td>genital herpes (painful vesicoulcerative lesions of penis / cervix, vulva, vagina, perineum + fever, dysuria, inguinal lymphadenopathy), neonatal herpes (majority HSV-2)</td></tr></tbody></table></div><ul><li>Both are enveloped dsDNA (envelope from <b>nuclear membrane</b>), spread by <b>contact with mucosa/lesions</b>; NOT fecal-oral (that is the naked enteric viruses) and NOT vector-borne</li><li>Cross-over now common: HSV-1 genital and HSV-2 oral, indistinguishable without lab</li><li>Reactivation triggers: axonal injury, fever, stress, UV light; virus travels back down axon to skin</li><li>Genital ulcers increase HIV acquisition</li><li>Neonatal: most common route = passage through birth canal with lesions → C-section; disseminated form ~80% mortality; primary infection &lt;20 wk → abortion</li><li>Diagnosis: PCR = gold standard (test of choice for CSF); Tzanck/Giemsa = multinucleated giant cells (HSV-1, HSV-2, VZV all look the same); culture for mucocutaneous</li><li>Treatment: acyclovir, valacyclovir, vidarabine (DNA synthesis inhibitors); reduce transmission with suppressive therapy + condoms</li></ul><p class=\"rsrc\">Source: MCB 2.02 II.A.1 HSV, Table 11</p>","B19SLAP":"<h5>Parvovirus B19 clinical timeline</h5><ul><li>Smallest DNA virus; <b>ssDNA, naked, icosahedral</b> (Baltimore II, the only ssDNA family); extremely stable (pH 3-9, 56°C 60 min)</li><li>Portal = respiratory tract; also transfusion and vertical</li><li>Erythema infectiosum = <b>Fifth disease</b>, children 5-18, one of six classic exanthems</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Phase</th><th>Days</th><th>Findings</th><th>Infectious?</th></tr></thead><tbody><tr><td>Incubation + viremia</td><td>1-14 (viremia 7-10)</td><td>shed in nasal washes; mild fever, malaise, coryza, myalgia</td><td>YES</td></tr><tr><td>Prodrome</td><td></td><td>non-specific</td><td>YES</td></tr><tr><td>Rash phase 1</td><td>after antibodies appear</td><td><b>slapped cheek</b> malar erythema</td><td>no</td></tr><tr><td>Rash phase 2</td><td></td><td>fine lacy maculopapular rash trunk/limbs, fades 2-4 days</td><td>no</td></tr></tbody></table></div><ul><li>Adults (esp. women): symmetrical small-joint arthritis of hands, weeks-months</li></ul><h5>Severe forms by host</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Host</th><th>Illness</th></tr></thead><tbody><tr><td>Immunocompromised</td><td>pure red cell aplasia, chronic anemia, infectious for months-years</td></tr><tr><td>Pregnancy</td><td>fetal anemia → non-immune hydrops fetalis / fetal loss</td></tr><tr><td>Sickle cell, thalassemia</td><td>transient aplastic crisis (can be fatal)</td></tr></tbody></table></div><ul><li>Diagnosis: PCR for DNA; IgM at 7-10 d, IgG at 15+ d; immunodeficient may be antibody-negative</li><li>Treatment supportive; IVIG for persistent infection; no vaccine, no antiviral</li></ul><h5>Exanthem look-alikes</h5><ul><li>Measles: prodrome cough/coryza/conjunctivitis + Koplik spots, rash head → down, brownish</li><li>Rubella: mild, rash face → trunk, gone in 3 d, posterior auricular nodes</li><li>Roseola (HHV-6): high fever 3-5 d THEN rash on trunk when fever breaks</li><li>Varicella: crops of vesicles in all stages</li></ul><p class=\"rsrc\">Source: MCB 2.02 I.A Parvoviridae, Table 2</p>","ADPOOL":"<h5>Adenovirus eye disease</h5><div class=\"rtw\"><table class=\"rt\"><thead><tr><th></th><th>Pharyngoconjunctival fever</th><th>Epidemic keratoconjunctivitis</th></tr></th
