une escape, diagnostics or treatment, with significant community transmission or clusters</td></tr><tr><td><b>Variant of concern (VOC)</b></td><td>a VOI shown to have <b>increased transmissibility</b>, increased virulence/severity, or <b>decreased effectiveness of public-health measures, diagnostics, vaccines or treatments</b></td></tr></tbody></table></div><ul><li>Hundreds of variants arise from <b>point mutations</b> (error-prone RNA replication) that stabilise spike and improve ACE2 binding — the same genetic/biologic driver of emergence listed with influenza mutation and HIV</li><li>Recognised examples in these years: Alpha, Beta, Gamma, Delta, Omicron</li><li>SARS-CoV-2 basics (2.04): Betacoronavirus, enveloped helical (+)ssRNA, S protein → ACE2 (+TMPRSS2), bats reservoir, pangolin intermediate; severe disease = cytokine storm, lymphopenia, neutrophilia, D-dimer; RT-qPCR (ORF1ab/N/E) and rapid antigen tests</li><li>Emerging disease = newly appeared OR rapidly rising incidence/geographic range; re-emerging = previously controlled, rising again; ~75% of recent emerging infections are zoonotic</li></ul><p class=\"rsrc\">Source: MCB 2.10 abbreviations and I.C Genetic/Biologic factors; MCB 2.04 C Coronaviridae</p>","2028-90":"<h5>Mpox and the 2022 global outbreak</h5><ul><li>Orthopoxvirus (Poxviridae): enveloped dsDNA, cytoplasmic replication; same genus as variola, vaccinia, cowpox</li><li>History: isolated from monkeys Copenhagen 1958; first human case DRC 1970; endemic West/Central Africa; 2003 US outbreak; <b>May 2022 first reports in Europe; PHEIC July 23 2022</b>; 91,123 cases by Sept 2023</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Clade</th><th>Notes</th></tr></thead><tbody><tr><td>I (Congo Basin)</td><td>more severe; Ia, Ib (Ib beyond Africa since Aug 2024)</td></tr><tr><td>II (West African)</td><td>milder, lower CFR; <b>IIb caused the 2022 outbreak</b></td></tr></tbody></table></div><ul><li>2022 pattern: <b>mainly sexually transmitted (88%)</b>, MSM 87%; rash 91%, genital rash 52%, fever 49%, lymphadenopathy 26%; CFR 0.3%; PH 287 cases, 6 deaths, mostly males 20-59, 95% no travel = community transmission, 24% PLHIV</li><li>Transmission: direct contact with rash/fluids, respiratory secretions (close), fomites, transplacental; <b>not highly transmissible by droplet/airborne</b></li><li>Reasons for emergence: deforestation, hunting, movement, <b>waning smallpox-vaccine immunity</b> (vaccination stopped 1980-82; smallpox vaccine ~85% protective; unvaccinated = 80-96% of cases), genetic evolution toward human-to-human spread</li><li>Distinguishing feature from smallpox/chickenpox: <b>prominent cervical/submandibular lymphadenopathy</b> (2.02)</li><li>Diagnosis: lesion scrapings to DOH for <b>PCR/antigen in acute stage</b>; IgM days 4-56 in recovery</li><li>Treatment supportive; severe cases: tecovirimat, cidofovir, brincidofovir, vaccinia immune globulin; risk groups: immunocompromised, &lt;8 y, pregnant, atopic dermatitis</li><li>Prevention: avoid contact with infected animals/people/fomites/anonymous sex; PPE (gown, gloves, mask, eye protection); vaccine only in outbreaks, not locally registered</li></ul><p class=\"rsrc\">Source: MCB 2.10 V Mpox Virus, Table 18; MCB 2.02 Mpox</p>","2028-98":"<h5>Isolation for Mpox</h5><ul><li><b>Isolation is discontinued only after ALL lesions have crusted</b> (scabs fallen, new skin formed) — the patient is infectious from rash onset through the vesicular/pustular stages via direct contact with lesion material</li><li>Lesion progression (poxvirus): macules → papules → vesicles → pustules → crusts; all lesions in the same stage (vs chickenpox crops)</li><li>Infection control: single room, disposable gown, gloves, facemask, eye protection; contact + droplet precautions; hand washing; specimens from lesions for PCR</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Disease</th><th>Infectious period / precaution end-point</th></tr></thead><tbody><tr><td>Mpox</td><td>until all lesions crusted</td></tr><tr><td>Varicella</td><td>shortly before rash until lesions crusted; airborne + contact</td></tr><tr><td>Smallpox</td><td>first week of rash most infectious; airborne</td></tr><tr><td>Measles</td><td>prodrome to 2-5 d after rash; airborne</td></tr><tr><td>Mumps</td><td>3 d before to 9 d after swelling; droplet 5 d after parotitis onset</td></tr><tr><td>Pertussis</td><td>droplet until 5 d of macrolide</td></tr><tr><td>Meningococcus / group A strep</td><td>droplet until 24 h of therapy</td></tr><tr><td>Rotavirus / norovirus</td><td>while shedding (up to 1 month norovirus); contact</td></tr><tr><td>Polio</td><td>stool shedding weeks</td></tr></tbody></table></div><ul><li>Complications in ~1 of 5 (secondary bacterial infection, encephalitis, sepsis, hemorrhagic/confluent lesions) → hospitalisation criteria</li></ul><p class=\"rsrc\">Source: MCB 2.10 V.F Mpox Prevention; MCB 2.02 Poxviridae</p>","2028-99":"<h5>Epidemiology of emerging and re-emerging diseases</h5><ul><li>Emerging = new to a population OR rapidly increasing in incidence/geographic range (SARS 2003, H1N1 2009, MERS 2012, H7N9 2013, COVID-19 2019); re-emerging = previously controlled, rising again (pertussis, measles, diphtheria, polio cVDPV, TB, malaria, yellow fever, rabies, cryptosporidiosis, schistosomiasis)</li><li><b>~75% of emerging infections of the last three decades are zoonotic</b> (animal origin crossing the species barrier) because of increased human-animal contact: bushmeat, exotic pets (tortoises → Salmonella), wet markets, farming near bats (Nipah), poultry (H5N1)</li></ul><div class=\"rtw\"><table class=\"rt\"><thead><tr><th>Contributing factor group</th><th>Examples</th></tr></thead><tbody><tr><td>Human behaviour</td><td>travel and commerce, technology/industry, breakdown of public health, poverty, war/famine, lack of political will, intent to harm</td></tr><tr><td>Physical/environmental</td><td>land use, urbanisation, environmental degradation</td></tr><tr><td>Ecologic</td><td>ecosystem succession, climate change, dam building (schistosomiasis)</td></tr><tr><td>Genetic/biologic</td><td>microbial adaptation (pertussis strains, flu/corona mutation, drug resistance), host susceptibility (CCR5 alleles protect vs HIV; HbS vs malaria; Duffy-negative vs P. vivax; blood group O → severe cholera; HLA alleles)</td></tr></tbody></table></div><ul><li>Re-emergence of VPDs is multifactorial (system failure, refusal, waning immunity, pathogen escape), not one cause</li><li>Herd immunity threshold rises with R0 (measles 92-94%, pertussis 92-94%, polio 50-95%, influenza 30-77%)</li><li>Vaccines: smallpox eradicated 1980; polio, diphtheria 100% down in US</li></ul><p class=\"rsrc\">Source: MCB 2.10 I Introduction A-C, Table 1-3; II.A</p>"}};
const {Q,FAM,BANK,RADAR,T,STATS,NOTE,YEARS,REV}=DATA;
const CAT={D:"Direct & Near Repeats",C:"Same Concept, New Framing",I:"Inverted & Choice Variants"};
const TABS=[["all","All Repeat Families"],["D",CAT.D],["C",CAT.C],["I",CAT.I],["bank","All Questions"],["radar","Repeat Radar"]];
const FBY={};FAM.forEach(f=>FBY[f.id]=f);
const usedT=Object.keys(T).filter(t=>Object.values(Q).some(q=>q.t===t));
const S={tab:"all",years:new Set(YEARS),topics:new Set(usedT),open:new Set()};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tbadge(t){return `<span class="bd ${t==="UNC"?"unc":"top"}">${esc(T[t])}</span>`}
function hasKey(q){return q.k&&q.k!=="X"}
function isK(q,c){return hasKey(q)&&c.l.toUpperCase()===q.k.toUpperCase()}
function choicesHTML(q){
 if(!q.c.length)return `<p class="inf">No choices were recalled for this item in the source PDF.</p>`;
 return `<ol class="cho">`+q.c.map(c=>`<li class="${isK(q,c)?"k":""}">${esc(c.l)}. ${esc(c.x)}${isK(q,c)?" ✓":""}</li>`).join("")+`</ol>`}
function ratHTML(q){
 if(!q.c.length)return "";
 return q.c.map(c=>{const k=isK(q,c);const none=/fuller study rationale\.$/.test(c.r);
  const st=!hasKey(q)?`<span class="no">No printed key.</span>`:(k?`<span class="ok">Correct ✓</span>`:`<span class="no">Incorrect.</span>`);
  return `<p class="rl ${k?"k":""} ${none?"none":""}"><span class="lab">${esc(c.l)}. ${esc(c.x)}</span> — ${st} <span class="tx">${esc(c.r)}</span></p>`}).join("")}
function notesHTML(q){return q.w.map(w=>`<div class="warn">${esc(w)}</div>`).join("")+q.i.map(w=>`<div class="inf">${esc(w)}</div>`).join("")}
function keyHTML(q){return hasKey(q)?`<span class="key">${esc(q.k)} ✓</span>`:`<span class="rl none"><span class="tx">—</span></span>`}
function famBody(f){
 let h=`<div class="rule"><i>Master Rule</i>${esc(f.rule)}</div>`;
 if(f.pat)h+=`<div class="pat"><i>Examiner Pattern</i>${esc(f.pat)}</div>`;
 if(f.flag)h+=`<div class="warn">${esc(f.flag)}</div>`;
 h+=`<div class="tw"><table class="ft hasrev"><thead><tr><th>Source</th><th>Question and Complete Choices</th><th>Key</th><th>Choice-by-Choice Rationale</th><th class="revh">Lecture Review (from the trans)</th></tr></thead><tbody>`;
 f.qs.forEach((id,ix)=>{const q=Q[id];
  h+=`<tr><td class="src">${q.y} Q${esc(q.n)}<small>PDF page ${q.p}</small></td><td><p class="stem">${esc(q.s)}</p>${choicesHTML(q)}</td><td>${keyHTML(q)}</td><td>${ratHTML(q)}${notesHTML(q)}</td>${ix===0?`<td class="revc" rowspan="${f.qs.length}"><div class="rev">${REV[f.id]||"<p class=\"inf\">No review available.</p>"}</div></td>`:""}</tr>`});
 return h+`</tbody></table></div>`}
function revBlock(q){
 let rv=null,lab="";
 if(REV[q.id]){rv=REV[q.id];lab="Lecture review for this question"}
 else if(q.f&&REV[q.f]){rv=REV[q.f];lab=`Lecture review for its repeat family: ${esc(FBY[q.f].title)}`}
 if(!rv)return "";
 return `<div class="revwrap"><div class="revlab">${lab}</div><div class="rev">${rv}</div></div>`}
function bankBody(q){
 let h=notesHTML(q);
 h+=`<div class="qwrap"><div><p class="stem"><b>${esc(q.s)}</b></p>${choicesHTML(q)}<p class="reflink">Printed key: ${hasKey(q)?esc(q.k):"none"} · PDF page ${q.p}</p></div><div>${ratHTML(q)}</div></div>`;
 if(q.f){const f=FBY[q.f];h+=`<div class="inf">Part of repeat family: <b>${esc(f.title)}</b> (${f.n} appearances, ${f.years.join(", ")}).</div>`}
 h+=revBlock(q);
 return h}
function famVisible(f){return (S.tab==="all"||f.cat===S.tab)&&f.years.some(y=>S.years.has(y))&&S.topics.has(f.t)}
function qVisible(q){return S.years.has(q.y)&&S.topics.has(q.t)}
function cardHTML(key,head,body){const o=S.open.has(key);
 return `<div class="card ${o?"open":""}" data-k="${key}"><button type="button" class="ch" aria-expanded="${o}"><span class="car">▶</span><span class="ttl">${head}</span></button><div class="body">${o?body():""}</div></div>`}
function render(){
 const m=$("main");let h="",n=0,label="";
 if(S.tab==="radar"){
  h=`<p class="subt" style="margin:4px 0 10px">Every concept seen in more than one paper, with its coverage in this build. Rows with a lighter edge are two-year concepts. Click a row with coverage to filter to its topic.</p><div class="tw"><table class="rad"><thead><tr><th>Years</th><th>Concept</th><th>Source lecture</th><th>Count</th><th>Coverage in this build</th></tr></thead><tbody>`;
  RADAR.forEach((r,i)=>{const two=r.years.length===2;
   h+=`<tr class="${r.go?"go":"inert"} ${two?"two":""}" data-i="${i}"><td>${r.years.join(", ")}</td><td>${esc(r.name)}</td><td>${esc(T[r.t])}</td><td><span class="ny">${r.years.length}</span></td><td>${esc(r.status)}</td></tr>`});
  h+=`</tbody></table></div>`;n=RADAR.length;label="concepts";
 }else if(S.tab==="bank"){
  DATA.BANKYEARS.forEach(y=>{const qs=BANK.map(id=>Q[id]).filter(q=>q.y===y&&qVisible(q));
   if(!S.years.has(y))return;
   h+=`<div class="yh">${y}<span>${qs.length} question${qs.length!==1?"s":""} shown</span></div>`;
   qs.forEach(q=>{n++;h+=cardHTML("q:"+q.id,`<b>${q.y} Q${esc(q.n)} <span class="q">${esc(q.s.length>150?q.s.slice(0,150)+"…":q.s)}</span></b><span class="meta">${tbadge(q.t)}${q.f?`<span class="bd cat">repeat family</span>`:""}${q.w.length?`<span class="bd flag">flagged</span>`:""}</span>`,()=>bankBody(q))})});
  if(!n)h+=`<div class="empty">No bank questions match the current filters. The bank holds 2028 and 2027 only.</div>`;label="questions";
 }else{
  FAM.filter(famVisible).forEach(f=>{n++;
   h+=cardHTML("f:"+f.id,`<b>${esc(f.title)}</b><span class="meta"><span class="bd cnt">${f.n}×</span>${f.years.map(y=>`<span class="bd yr">${y}</span>`).join("")}${f.dy?`<span class="bd">${esc(f.dy)}</span>`:""}<span class="bd cat">${esc(CAT[f.cat])}</span>${tbadge(f.t)}${f.flag?`<span class="bd flag">discrepancy</span>`:""}</span>`,()=>famBody(f))});
  if(!n)h=`<div class="empty">No families match the current filters.</div>`;label="families";
 }
 m.innerHTML=h;$("count").textContent=n+" "+label+" shown";syncTog();
}
function bodyFor(key){return key[0]==="f"?famBody(FBY[key.slice(2)]):bankBody(Q[key.slice(2)])}
function setOpen(card,o){const k=card.dataset.k;card.classList.toggle("open",o);card.querySelector(".ch").setAttribute("aria-expanded",o);
 const b=card.querySelector(".body");if(o){S.open.add(k);if(!b.innerHTML)b.innerHTML=bodyFor(k)}else S.open.delete(k)}
function syncTog(){const cs=[...document.querySelectorAll("#main .card")];const t=$("tog");
 t.disabled=!cs.length;t.style.opacity=cs.length?1:.5;
 t.textContent=cs.length&&cs.every(c=>c.classList.contains("open"))?"Collapse All":"Expand All"}
$("main").addEventListener("click",e=>{
 const ch=e.target.closest(".ch");if(ch){const c=ch.parentNode;setOpen(c,!c.classList.contains("open"));syncTog();return}
 const tr=e.target.closest("tr.go");if(tr){const r=RADAR[+tr.dataset.i];
  S.topics=new Set([r.t]);S.years=new Set(YEARS);S.tab=r.go==="fam"?"all":"bank";buildFilters();buildTabs();render();window.scrollTo({top:$("main").offsetTop-120})}});
$("revtog").addEventListener("click",()=>{document.body.classList.toggle("norev");$("revtog").textContent=document.body.classList.contains("norev")?"Show Lecture Review":"Hide Lecture Review"});
$("tog").addEventListener("click",()=>{const cs=[...document.querySelectorAll("#main .card")];
 const open=!cs.every(c=>c.classList.contains("open"));cs.forEach(c=>setOpen(c,open));syncTog()});
function buildTabs(){
 const cnt={all:FAM.length,D:0,C:0,I:0,bank:BANK.length,radar:RADAR.length};FAM.forEach(f=>cnt[f.cat]++);
 $("tabs").innerHTML=TABS.map(([k,l])=>`<button type="button" class="tab" role="tab" data-t="${k}" aria-selected="${S.tab===k}">${esc(l)} <small>${cnt[k]}</small></button>`).join("")}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;S.tab=b.dataset.t;buildTabs();render()});
function buildMS(pop,btn,items,set,allLabel,noun){
 const all=items.every(([v])=>set.has(v));
 pop.innerHTML=`<label class="all"><input type="checkbox" data-v="__all" ${all?"checked":""}>${allLabel}</label>`+items.map(([v,l])=>`<label><input type="checkbox" data-v="${v}" ${set.has(v)?"checked":""}>${esc(l)}</label>`).join("");
 btn.textContent=all?allLabel:(set.size+" "+noun+(set.size!==1?"s":""))}
function buildFilters(){
 buildMS($("popY"),$("btnY"),YEARS.map(y=>[y,String(y)]),S.years,"All Years","year");
 buildMS($("popT"),$("btnT"),usedT.map(t=>[t,T[t]]),S.topics,"All Topics","topic")}
function wireMS(ms,pop,getSet,setSet,values,parse){
 ms.querySelector("button").addEventListener("click",e=>{e.stopPropagation();const o=ms.classList.contains("open");document.querySelectorAll(".ms").forEach(x=>x.classList.remove("open"));if(!o)ms.classList.add("open")});
 pop.addEventListener("click",e=>e.stopPropagation());
 pop.addEventListener("change",e=>{const v=e.target.dataset.v;let s=getSet();
  if(v==="__all"){s=new Set(values())}else{const pv=parse(v);if(e.target.checked)s.add(pv);else s.delete(pv)}
  setSet(s);buildFilters();render()})}
wireMS($("msY"),$("popY"),()=>S.years,s=>S.years=s,()=>YEARS,v=>+v);
wireMS($("msT"),$("popT"),()=>S.topics,s=>S.topics=s,()=>usedT,v=>v);
document.addEventListener("click",()=>document.querySelectorAll(".ms").forEach(x=>x.classList.remove("open")));
$("stats").innerHTML=STATS.map(([b,s])=>`<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
$("notebody").innerHTML=NOTE;
buildTabs();buildFilters();render();
</script>
</body></html>
