ion of the virus is through inhalation of urine of deer.","r":"The route is inhalation of aerosolized excreta of rodents, specifically deer mice, not deer."},{"l":"C","x":"The deer mice is the primary reservoir of Sin Nombre virus.","r":"Sin Nombre virus is the hantavirus that causes hantavirus pulmonary syndrome: fever, headache, and myalgia followed by rapidly progressive pulmonary edema, with mortality of 30 percent or more and no hemorrhage. Its primary reservoir is the deer mouse, Peromyscus maniculatus, and humans are infected by aerosols of rodent urine, feces, or saliva."},{"l":"D","x":"The Hantaan and Dobrava virus causes its most severe form in Asia.","r":"Hemorrhagic fever with renal syndrome is caused by hantaviruses such as Hantaan and Dobrava in Asia and Europe. It is an acute interstitial nephritis that can progress to renal failure, hemorrhage, and shock, spread by urban rats with no arthropod vector. These viruses do not cause the pulmonary syndrome."}],"k":"C","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q114."],"o":"","f":"HANTA"},"2027-65":{"id":"2027-65","y":2027,"n":"65","p":10,"t":"T05","s":"(SET A) Which of the following diseases lacks a known vector?","c":[{"l":"A","x":"Hemorrhagic fever with renal syndrome","r":"Hemorrhagic fever with renal syndrome is caused by hantaviruses such as Hantaan and Dobrava in Asia and Europe. It is an acute interstitial nephritis that can progress to renal failure, hemorrhage, and shock, spread by urban rats with no arthropod vector."},{"l":"B","x":"Japanese encephalitis","r":"Japanese encephalitis is a flavivirus transmitted by Culex mosquitoes that breed in rice fields. Birds are reservoirs, pigs are the amplifying host, and humans are dead-end hosts who develop acute viral encephalitis."},{"l":"C","x":"St. Louis Encephalitis","r":"St. Louis encephalitis is a flavivirus transmitted by Culex mosquitoes, with birds as reservoir and humans as dead-end hosts."},{"l":"D","x":"West Nile Fever","r":"West Nile virus is a flavivirus transmitted by Culex mosquitoes, with birds as reservoir and humans as dead-end hosts."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-66":{"id":"2027-66","y":2027,"n":"66","p":10,"t":"T06","s":"[SET A] Prions cause neurodegenerative diseases by:","c":[{"l":"A","x":"Changing conformations of normal prion proteins","r":"Abnormal PrPSc contacts normal PrPC and forces it to change shape. The misfolded protein forms oligomers and accumulates in the brain, producing the neurodegeneration of spongiform encephalopathy."},{"l":"B","x":"Eliciting strong lymphocytic response","r":"The host shows no inflammatory response and no immune response to prions, with no interferon production."},{"l":"C","x":"Producing neurotoxin","r":"Prions are misfolded host protein, not toxin producers."},{"l":"D","x":"Replicating and producing viral oncogenes","r":"Prions have no nucleic acid, so they carry no genes. Oncogenes are a feature of transforming retroviruses."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"PRIONSHAPE"},"2027-68":{"id":"2027-68","y":2027,"n":"68","p":10,"t":"T06","s":"[SET A] What distinguishes prions from viruses?","c":[{"l":"A","x":"Prions contain nucleics acids (RNA or DNA).","r":"Prions are the only known transmissible pathogens without nucleic acid."},{"l":"B","x":"Prions are solely composed of proteins.","r":"A prion is a proteinaceous infectious particle that lacks nucleic acid, made of folded protein that self-propagates."},{"l":"C","x":"Prions elicit T-cell and B-cell responses.","r":"Prions have no impact on B-cell and T-cell production and provoke no immune response."},{"l":"D","x":"Prions cause disease only to humans","r":"Prions also cause scrapie in sheep and mad cow disease in cattle."}],"k":"B","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-69":{"id":"2027-69","y":2027,"n":"69","p":10,"t":"T02","s":"(SET B) The following are routes of infection for Adenovirus, EXCEPT","c":[{"l":"A","x":"Via blood transfusion","r":"Blood transfusion is not an adenovirus route. Adenoviruses spread by direct contact, the fecal-oral route, respiratory droplets, contaminated fomites, hand-to-eye transfer, and swimming pools."},{"l":"B","x":"Fomites","r":"Contaminated fomites are a listed route, helped by the stability of this naked virus."},{"l":"C","x":"Direct contact","r":"Direct contact is a listed route, and hand-to-eye transfer is important for eye infections."},{"l":"D","x":"Feco-oral","r":"The fecal-oral route applies, especially for enteric types causing gastroenteritis."},{"l":"E","x":"Respiratory droplets","r":"Respiratory droplets are the usual route for respiratory disease."}],"k":"A","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"ADROUTE"},"2027-70":{"id":"2027-70","y":2027,"n":"70","p":10,"t":"T06","s":"What type of hepatitis develops tumors?","c":[{"l":"A","x":"Hepatitis A","r":"Hepatitis A is acute and self-limited with no chronic carrier state, so it does not lead to tumors."},{"l":"B","x":"Hepatitis B","r":"Hepatitis B causes chronic infection, especially when acquired in infancy, and is a major factor in cirrhosis and hepatocellular carcinoma, which appears many years after primary infection."},{"l":"C","x":"Hepatitis D","r":"Hepatitis D is a defective satellite virus needing hepatitis B as helper. It is not the keyed tumor virus."},{"l":"D","x":"Hepatitis E","r":"Hepatitis E belongs to Hepeviridae. Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"B","w":[],"i":[],"o":"","f":"HBVHCC"},"2027-71":{"id":"2027-71","y":2027,"n":"71","p":10,"t":"T06","s":"(SET A) Which mechanism is used by HIV to evade immune response?","c":[{"l":"A","x":"Inhibition of antigen processing","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"B","x":"Infection of sites inaccessible to immune response","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"C","x":"Modulation of MHC Class 1","r":"Blocking MHC class I transport is the evasion strategy the lectures describe for adenovirus, through its E3 gp19 protein."},{"l":"D","x":"Mutation of viral antigen to escape antibodies","r":"High mutation rate is the hallmark of lentiviruses. Rapid replication with an error-prone reverse transcriptase makes env glycoprotein variants continually, so new antigenic variants escape neutralizing antibody."}],"k":"D","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"HIVDIV"},"2027-72":{"id":"2027-72","y":2027,"n":"72","p":10,"t":"T06","s":"What is the role of integrase enzyme in retroviral replication?","c":[{"l":"A","x":"Transports viral DNA into host cell’s nucleus","r":"After reverse transcription, integrase carries the double-stranded DNA copy into the nucleus and inserts it into the host genome, where it becomes a provirus."}],"k":"A","w":[],"i":["Only the keyed choice was recalled for this item."],"o":"","f":"RETRO"},"2027-73":{"id":"2027-73","y":2027,"n":"73","p":11,"t":"T02","s":"What is the mode of transmission Herpes simplex virus 2? (set b)","c":[{"l":"A","x":"Sexual contact","r":"HSV-2 classically presents as herpes genitalis, which is sexually transmitted. This is true but incomplete."},{"l":"B","x":"Vertical transmission","r":"HSV-2 can pass from mother to newborn, and neonates with severe infection need treatment. This is true but incomplete."},{"l":"C","x":"Feco oral","r":"Not a herpesvirus route. It belongs to enteric viruses."},{"l":"D","x":"Both and A and B","r":"HSV-2 spreads through sexual contact and from mother to child."}],"k":"D","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","No rationale was printed for this item."],"o":"","f":"HSVROUTE"},"2027-74":{"id":"2027-74","y":2027,"n":"74","p":11,"t":"T02","s":"5 y/o patient was brought to the clinic because of multiple vesico-ulcerative lesions at the angle of the mouth and buccal mucosa, which occurred after a bout of fever. Which is the most probable cause? (SET B)","c":[{"l":"A","x":"Varicella Virus","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption."},{"l":"B","x":"HHV6","r":"HHV-6 causes roseola infantum (exanthem subitum or sixth disease) in infants, with high fever followed by an erythematous macular rash. It infects peripheral blood lymphocytes using CD46 as its receptor."},{"l":"C","x":"HSV1","r":"Primary symptomatic HSV-1 infection is gingivostomatitis, seen most often in children 1 to 5 years old. It involves the buccal and gingival mucosa with fever, sore throat, and vesicular and ulcerative lesions, and virus is shed in saliva."},{"l":"D","x":"Human Papillomavirus","r":"HPV infects surface epithelium and causes warts, not a febrile vesiculoulcerative stomatitis."}],"k":"C","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"HSV1KID"},"2027-75":{"id":"2027-75","y":2027,"n":"75","p":11,"t":"T06","s":"SET C What virus is associated with Progressive Multifocal Leukoencephalopathy?","c":[{"l":"A","x":"BK Virus","r":"BK virus (human polyomavirus 1) reactivates in the urinary tract of immunocompromised patients, causing hemorrhagic cystitis in bone marrow transplant recipients and polyomavirus-associated nephropathy in renal transplant patients."},{"l":"B","x":"JC Virus","r":"JC virus is a polyomavirus that stays latent after childhood infection. Reactivation in immunocompromised patients such as those with AIDS causes progressive multifocal leukoencephalopathy (PML), a fatal demyelinating disease of the CNS."},{"l":"C","x":"Merkel Cell Virus","r":"Merkel cell polyomavirus DNA is found in most cases of Merkel cell carcinoma, a rare and aggressive skin cancer."},{"l":"D","x":"Herpes Virus","r":"Herpesviruses establish latency in ganglia or lymphoid cells. HSV can cause encephalitis, but not PML."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"PML"},"2027-76":{"id":"2027-76","y":2027,"n":"76","p":11,"t":"T02","s":"50 y/o patient with diabetes and hypertension with NO history of chickenpox was exposed to her niece who has chickenpox currently. What can be given to prevent progression? (SET B)","c":[{"l":"A","x":"Shingles vaccine","r":"The zoster vaccine is a much more potent version of the varicella vaccine, given to people over 60 or with chronic conditions to reduce shingles. It targets those who already had chickenpox."},{"l":"B","x":"Varicella zoster immunoglobulin","r":"Varicella-zoster immunoglobulin prevents illness in exposed patients at high risk of severe disease. It has no therapeutic value once varicella has started."},{"l":"C","x":"Live attenuated vaccine","r":"The live attenuated varicella vaccine is about 95 percent effective at preventing severe disease, but per the 2027 rationale it is not advised after exposure in adults with underlying conditions."},{"l":"D","x":"Entecavir","r":"Entecavir inhibits hepatitis B virus polymerase. It has no activity against varicella."}],"k":"B","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q79."],"o":""},"2027-77":{"id":"2027-77","y":2027,"n":"77","p":11,"t":"T07","s":"[SET A] A 15 year old girl came to the dermatological clinic complaining of a scaly scalp and hair that fluoresces under wood’s lamp. Microscopic finding showed the fluorescence outside the hair shaft. Her mother takes care of two Siamese cats and two spitz dogs in the household. What is the possible etiologic agent?","c":[{"l":"A","x":"Microsporum canis","r":"Microsporum canis is a zoophilic dermatophyte acquired from cats and dogs. It infects skin and hair, causing ectothrix tinea capitis whose hairs fluoresce green under Wood's lamp, and its colony is white and cottony with a deep yellow reverse."},{"l":"B","x":"Epidermophyton floccosum","r":"Epidermophyton floccosum is the only pathogenic species in its genus. It infects skin and nails but not hair, and produces club-shaped smooth-walled macroconidia in small clusters with no microconidia."},{"l":"C","x":"Trichophyton tonsurans","r":"Trichophyton tonsurans gives endothrix infection with spores inside the hair shaft, and its hairs do not fluoresce."},{"l":"D","x":"Trichophyton mentagrophytes","r":"Trichophyton mentagrophytes infects skin, hair, and nails, with grape-like clusters of microconidia. It is not the cat-associated fluorescent ectothrix agent."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"MCANIS"},"2027-78":{"id":"2027-78","y":2027,"n":"78","p":11,"t":"T07","s":"(SET A) 24 y/o male athlete consulted for a lesion which appeared annular with borders containing vesicles. Skin scrapings show typical hyphae under KOH preparation. Culture of sabouroud’s agar show typical hyphae and macroconidia. What is your diagnosis?","c":[{"l":"A","x":"Tinea nigra","r":"Tinea nigra is a superficial asymptomatic infection by Hortaea (Exophiala) werneckii that gives a dark macule, usually on the palm."},{"l":"B","x":"Tinea versicolor","r":"Malassezia furfur is a lipophilic yeast that causes pityriasis (tinea) versicolor, a chronic superficial mycosis. KOH shows short unbranched hyphae with round yeast, the spaghetti and meatball pattern, and lesions fluoresce under Wood's lamp."},{"l":"C","x":"Chromomycosis","r":"Chromoblastomycosis is a chronic subcutaneous infection by pigmented (dematiaceous) fungi that produces slowly progressive verrucous, cauliflower-like lesions, usually on the leg. The diagnostic tissue finding is the brown muriform or sclerotic body, also called the copper penny body."},{"l":"D","x":"Tinea corporis","r":"Tinea corporis is ringworm of glabrous skin: an annular patch with an erythematous advancing border, peripheral scaling, and central clearing. KOH shows branching septate hyphae."}],"k":"X","w":["No key was printed for this item in the 2027 PDF (the key cell shows X). The annular lesion with an active border and hyphae on KOH matches the MCB 2.07 description of tinea corporis, choice D."],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-79":{"id":"2027-79","y":2027,"n":"79","p":11,"t":"T02","s":"(SET C) A 50 y/o patient with diabetes and hypertension with NO history of chickenpox was exposed to her niece who has chickenpox currently. What can be given to prevent progression?","c":[{"l":"A","x":"Shingles vaccine","r":"Given to those who already had chickenpox, to prevent shingles."},{"l":"B","x":"Varicella zoster immunoglobulin","r":"Varicella-zoster immunoglobulin prevents illness in exposed patients at high risk of severe disease. It has no therapeutic value once varicella has started."},{"l":"C","x":"Live attenuated vaccine","r":"Per the 2027 rationale it can be used after exposure but is not recommended in immunocompromised patients or adults with underlying conditions."},{"l":"D","x":"Entecavir","r":"An antiviral for hepatitis B that inhibits HBV polymerase."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-81":{"id":"2027-81","y":2027,"n":"81","p":12,"t":"T07","s":"What is the solution used to demonstrate dermatophytes in nail infection? [SET A]","c":[{"l":"A","x":"10% KOH","r":"Per the 2027 rationale, 10 percent KOH is used for skin and hair specimens to show hyphae."},{"l":"B","x":"NaOH","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"C","x":"20% KOH","r":"Per the 2027 rationale, 20 percent KOH is used for nail specimens. The lecture states that a 10 to 20 percent KOH preparation dissolves host tissue and highlights fungal elements."},{"l":"D","x":"H2O2","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"C","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"KOH"},"2027-82":{"id":"2027-82","y":2027,"n":"82","p":12,"t":"T07","s":"Fungal infections are usually chronic because of which of the following: (SET A)","c":[{"l":"A","x":"Long generation time","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"B","x":"It takes 4-6 weeks before you can see the culture","r":"Slow growth in culture is a laboratory observation, not a reason the infection is chronic."},{"l":"C","x":"Infected hosts do not produce immunity","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"D","x":"Only a and b is correct","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"X","w":["No key was printed for this item in the 2027 PDF (the key cell shows X), and the project lectures do not resolve it."],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-83":{"id":"2027-83","y":2027,"n":"83","p":12,"t":"T04","s":"Which of the following best characterizes the disease caused by the Parainfluenza virus? [SET B]","c":[{"l":"A","x":"Larynchotracheobronchitis will progress to systemic viral infection","r":"Viremia is uncommon if it occurs at all, so systemic progression is not expected."},{"l":"B","x":"Croup involvement in an immunocompetent host will spread to the lower respiratory tract","r":"This is the printed 2027 key. The lecture states the opposite: replication in the immunocompetent host is limited to respiratory epithelia of the upper tract."},{"l":"C","x":"Viral replication in an immunocompetent host will spread to upper respiratory epithelia","r":"Parainfluenza virus replication in the immunocompetent host appears limited to respiratory epithelia, and viremia is uncommon. Infection may involve only the nose and throat as a common cold, or with types 1 and 2 extend to the larynx and upper trachea as croup."},{"l":"D","x":"Infection causes cervical lymphadenopathies, leading to airway obstruction","r":"Obstruction in croup comes from swelling of the larynx and related structures, not from lymph nodes."}],"k":"B","w":["Cross-year discrepancy: 2027 keys B while 2028 Q80 keys the 'limited to upper respiratory tract' choice for the same question.","Source-key warning: this is review item 1 of MCB 2.04, whose lecture key is the choice stating that replication is limited to the upper respiratory epithelia (choice C here). The printed 2027 key is shown unchanged."],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","No rationale was printed for this item."],"o":"","f":"PIV"},"2027-84":{"id":"2027-84","y":2027,"n":"84","p":12,"t":"T02","s":"Which of the following DNA viruses has a multiplication cycle occuring in the cytoplasm? [SET C]","c":[{"l":"A","x":"Adenovirus","r":"Adenoviridae are naked icosahedral viruses with linear dsDNA. Uncoating begins in the cytoplasm but replication is completed in the nucleus of epithelial cells."},{"l":"B","x":"Herpesvirus","r":"Replicates in the nucleus and buds from the nuclear membrane."},{"l":"C","x":"Poxvirus","r":"Poxviridae are large brick-shaped dsDNA viruses with complex symmetry. Their entire multiplication cycle takes place in the cytoplasm because the virion supplies its own enzymes, including a DNA-dependent RNA polymerase. They are the exception to the rule that DNA viruses replicate in the nucleus."},{"l":"D","x":"Papillomavirus","r":"Papillomaviridae are naked icosahedral viruses with circular dsDNA that replicate in the nucleus. They infect surface epithelium, causing warts and, with high-risk types 16 and 18, cancer, but they do not show latency with reactivation."}],"k":"C","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"POX"},"2027-85":{"id":"2027-85","y":2027,"n":"85","p":12,"t":"T02","s":"[SET C] Which of the following would indicate that a Hepatitis infection is becoming chronic?","c":[{"l":"A","x":"(+) HbSag beyond 6 months with (-) Hbeg","r":"HBsAg persisting beyond 6 months indicates chronic infection. HBeAg marks active replication and high infectivity, so a negative HBeAg suggests lower replication."},{"l":"B","x":"(-) HbSag beyond 3 months (-) Hbeg","r":"Without HBsAg there is no active infection."},{"l":"C","x":"(-) HbSag beyond 6 months (+) Hbeg","r":"Chronic infection requires persistent HBsAg, so a negative HBsAg excludes it."},{"l":"D","x":"(+) HbSag during the first month (-) Hbeg","r":"HBsAg in the first month is the expected first marker of acute infection."}],"k":"A","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","This recall pairs HBsAg with HBeAg. The Set A version (Q25) and MCB 2.02 pair it with absent anti-HBs."],"o":"","f":"HBVCHR"},"2027-86":{"id":"2027-86","y":2027,"n":"86","p":12,"t":"T08","s":"[SET A] A 40 year old man presents with dyspnea, hemoptysis, and chest pain. CT scan revealed a mobile fungal ball within a cavitary lesion in the lungs. What is the most probable etiologic agent?","c":[{"l":"A","x":"Candida albicans","r":"Candida is a yeast with pseudohyphae causing mucosal disease and catheter-related candidemia. It does not form a fungus ball in lung cavities."},{"l":"B","x":"Aspergillus fumigatus","r":"Aspergillus can form an aspergilloma, a fungus ball that colonizes a pre-existing lung cavity. Its hyphae are septate and branch at acute angles."},{"l":"C","x":"Rhizope species","r":"Mucor and Rhizopus, the agents of mucormycosis, show broad, ribbon-like, non-septate hyphae branching at right angles, and they invade blood vessels."},{"l":"D","x":"Mucor species","r":"Mucor and Rhizopus, the agents of mucormycosis, show broad, ribbon-like, non-septate hyphae branching at right angles, and they invade blood vessels."}],"k":"B","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"ASPERG"},"2027-87":{"id":"2027-87","y":2027,"n":"87","p":12,"t":"T04","s":"[SET C] How does one get immunity from a mumps infection?","c":[{"l":"A","x":"Waning immunity from multiple antigens","r":"Mumps has a single antigenic type and immunity after infection is permanent, not waning."},{"l":"B","x":"No immunity for mumps infection","r":"Even subclinical mumps infection produces lifelong immunity."},{"l":"C","x":"Long lasting immunity from one antigenic type","r":"Mumps virus has only one antigenic type and is genetically stable, so a single infection gives permanent immunity. Even subclinical infection generates lifelong immunity."},{"l":"D","x":"Hemagglutinin-Neuraminidase Antigen complex immunity","r":"Serum antibodies do target HN and F glycoproteins, but the reason immunity lasts is the single antigenic type."}],"k":"C","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","This is review item 2 of MCB 2.04."],"o":"","f":"ONETYPE"},"2027-91":{"id":"2027-91","y":2027,"n":"91","p":13,"t":"T04","s":"[SET B] What is the consequence of antigenic shift in Influenza Virus?","c":[],"k":"X","w":["Incomplete in source: only this stem was recalled, with no choices and no key. Per MCB 2.04, shift produces a new subtype through reassortment, which can cause a pandemic."],"i":[],"o":""},"2027-92":{"id":"2027-92","y":2027,"n":"92","p":13,"t":"T08","s":"[SET A] What is the probable etiologic agent that causes white and cheesy vaginal discharge and shows gram-positive budding hyphae or yeast","c":[{"l":"A","x":"Trichomonas vaginalis","r":"Per the 2027 rationale the discharge may be thick, thin, or frothy and yellow-green."},{"l":"B","x":"Neisseria gonorrhea","r":"Per the 2027 rationale the discharge is thin, purulent, and mildly odorous."},{"l":"C","x":"Candida albicans","r":"Candida albicans is a yeast that forms budding cells, pseudohyphae, and true hyphae. Vulvovaginal candidiasis gives irritation, pruritus, and a creamy white discharge, with diabetes, pregnancy, and antibacterial drugs as risk factors. C. albicans is identified by germ tube production."},{"l":"D","x":"Gardnerella vaginalis","r":"Per the 2027 rationale the discharge is thin, white or gray, with a fishy odor."}],"k":"C","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"CANDIDA"},"2027-93":{"id":"2027-93","y":2027,"n":"93","p":13,"t":"T04","s":"(Set C) What is the consequence of antigenic shift?","c":[],"k":"X","w":["Incomplete in source: only this stem was recalled, with no choices and no key."],"i":[],"o":""},"2027-94":{"id":"2027-94","y":2027,"n":"94","p":13,"t":"T04","s":"(Set C) What is the consequence of antigenic drift in influenza?","c":[{"l":"A","x":"body recognizes easily — hemagglutinin-neuraminidase that prevent infection","r":"The reverse is true. Drift variants escape recognition by existing antibody."},{"l":"B","x":"body’s immune system does not recognize due to point mutations","r":"Antigenic drift is a gradual change caused by point mutations in the HA and NA genes. The small amino acid changes alter key epitopes so existing antibodies fail to neutralize the newer virus, which drives seasonal epidemics rather than pandemics."},{"l":"C","x":"new subtype","r":"A new subtype is the result of antigenic shift."},{"l":"D","x":"major changes in viral antigens","r":"Major abrupt change is shift. Drift is a minor, gradual change."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","The recaller notes that the real choices were long and only keywords were remembered. The PDF prints a question mark in the rationale cell. The full wording is review item 9 of MCB 2.04."],"o":"","f":"DRIFT"},"2027-95":{"id":"2027-95","y":2027,"n":"95","p":13,"t":"T04","s":"(SET C) What is the outcome of the influenza virus infection to its host cell?","c":[{"l":"A","x":"Persistent infection","r":"Persistent infection leaves the cell alive with low virus output, as in chronic hepatitis B."},{"l":"B","x":"Cellular transformation","r":"Transformation is caused by oncogenic viruses."},{"l":"C","x":"Cell death","r":"Influenza destroys the superficial respiratory mucosa. Activated cytotoxic CD8 T cells target infected cells and release granzymes and perforin to induce their death, so the outcome for the host cell is cell death."},{"l":"D","x":"Latent infection","r":"Latency is dormancy of viral genome in the cell, as with herpesviruses."}],"k":"C","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","This is review item 10 of MCB 2.04."],"o":"","f":"FLUDEATH"},"2027-97":{"id":"2027-97","y":2027,"n":"97","p":14,"t":"T04","s":"(SET B) Which of the following has similar characteristics for both rubella and measles virus?","c":[{"l":"A","x":"Presence of hemagglutinin-neuraminidase spikes","r":"Per the 2027 rationale neither virus has combined HN spikes, which belong to parainfluenza and mumps viruses."},{"l":"B","x":"One antigenic type","r":"Rubella has only one serotype and measles only one antigenic type, so one attack of either confers lifelong immunity."},{"l":"C","x":"Has segmented genomes","r":"Both have non-segmented genomes."},{"l":"D","x":"Both are double-stranded RNA viruses","r":"Both are single-stranded RNA viruses. Rubella is positive-sense and measles is negative-sense."}],"k":"B","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","This is review item 15 of MCB 2.04."],"o":"","f":"ONETYPE"},"2027-98":{"id":"2027-98","y":2027,"n":"98","p":14,"t":"T10","s":"(SET A) Which of the following factors contributes to the emergence and re-emergence of infectious diseases?","c":[{"l":"A","x":"Population growth and urbanization","r":"Population growth is a human behavior factor and urbanization a physical and environmental one."},{"l":"B","x":"Increased international travel and trade","r":"A human behavior factor that gives microbes rapid access to new populations."},{"l":"C","x":"Deforestation and habitat destruction","r":"Physical and environmental factors that expose humans to animal reservoirs."},{"l":"D","x":"All of the above","r":"The lecture groups contributing factors as human behavior (international travel and commerce, population growth), physical and environmental factors (urban development, deforestation, environmental degradation), and genetic or biologic factors such as microbial adaptation."}],"k":"D","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-99":{"id":"2027-99","y":2027,"n":"99","p":14,"t":"T04","s":"QUESTION","c":[{"l":"A","x":"Presence of rubella specific IGG","r":"Rubella IgG persists for life and is the only indicator of long-term immunity."},{"l":"B","x":"Presence of infant rubella specific IGM at 4 months of age","r":"Infant IgM indicates the infant's own response to infection, the marker of congenital rubella."},{"l":"C","x":"Presence of maternal rubella specific IGM","r":"IgM marks recent infection and does not persist beyond 6 weeks."},{"l":"D","x":"Presence of maternal rubella specific IGA in nasopharyngeal secretions","r":"Secretory IgA is a mucosal response and not the marker of lifelong immunity."}],"k":"X","w":["Incomplete in source: the stem was not recalled and no key was printed. The identical choice set is review item 14 of MCB 2.04: 'In post natal rubella, which of the following is an indication of the development of lifelong immunity', with lecture key A."],"i":[],"o":"","f":"CRS"},"2027-101":{"id":"2027-101","y":2027,"n":"101","p":14,"t":"T06","s":"(Set B) Negri bodies are associated with which.aspect of rabies diagnosis","c":[{"l":"A","x":"Detection or rabies viral rna","r":"Viral RNA is detected by RT-PCR."},{"l":"B","x":"Histopathologic finding in infected neurons","r":"Negri bodies are eosinophilic cytoplasmic inclusions in brain neurons, made of rabies virus proteins and viral RNA, seen in Purkinje cells of the cerebellum and pyramidal neurons of the hippocampus. They are pathognomonic but present in only about 80 percent of cases, so their absence does not rule out rabies."},{"l":"C","x":"Isolation of viral rna from saliva of infected human or rabid animal","r":"Saliva testing looks for virus or nucleic acid, not inclusion bodies."},{"l":"D","x":"Measurement of antigen or antibody levels in serum","r":"Serology and antigen tests use immunofluorescence. Negri bodies are a tissue finding."}],"k":"B","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"NEGRI"},"2027-102":{"id":"2027-102","y":2027,"n":"102","p":14,"t":"T10","s":"(SET A) Which category of COVID-19 variants includes potential changes in the virus that could affect its spread, predicted genetic transmissibility, and other characteristics? [non-verbatim]","c":[{"l":"A","x":"Variant of monitoring","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"B","x":"Variant of interest","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"C","x":"Variant of concern","r":"Per the 2028 exam rationale, a variant of concern is a variant of interest that has shown detrimental change in severity, epidemiology, or vaccine effectiveness."}],"k":"X","w":["No key and no rationale were printed for this item. MCB 2.10 lists VOC, VOI, and VUM only as abbreviations, so the project materials do not resolve it."],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"VOC"},"2027-103":{"id":"2027-103","y":2027,"n":"103","p":14,"t":"T03","s":"(SET C) What is the pathophysiologic consequence of poliovirus infection on motor neurons?","c":[{"l":"A","x":"Increased neurotransmitters leading to hyperactivity","r":"Poliovirus causes loss of motor neuron function, not overactivity."},{"l":"B","x":"Increased destruction of motor neurons causing flaccid paralysis","r":"Poliovirus is a naked picornavirus spread by the fecal-oral route. It multiplies in the tonsils and Peyer's patches, and in a minority of cases reaches anterior horn cells and motor neurons of the spinal cord and brainstem. Their destruction gives asymmetric acute flaccid paralysis, and muscle atrophy can progress decades later as post-poliomyelitis syndrome."},{"l":"C","x":"Formation of antibodies causing motor contraction","r":"Antibodies, including gut IgA, are protective. Paralysis is not antibody-mediated."},{"l":"D","x":"Inflammation of sensory neurons causing pain and numbness","r":"Poliovirus targets motor neurons. Sensation is spared."}],"k":"B","w":["Source-rationale mismatch: the rationale printed beside this item in the 2027 PDF describes paralytic (dumb) rabies, not poliovirus. The printed key B agrees with MCB 2.03."],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"POLIO"},"2027-104":{"id":"2027-104","y":2027,"n":"104","p":15,"t":"T03","s":"(SET C) Researchers in a developing country are exploring vaccination options for poliomyelitis. As part of the study, 2 patients were vaccinated. One was given an intramuscular inactivated vaccine and the other was given a live attenuated oral vaccine. One month later, which of the following poliovirus antibodies would largely differ among them:","c":[{"l":"A","x":"Cerebrospinal IgG","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"B","x":"Duodenal luminal IgA","r":"Injected killed vaccine (Salk) induces humoral antibody but no local intestinal immunity. Oral live vaccine (Sabin) multiplies in the gut and produces IgG, IgM, and secretory IgA, so gut IgA is what differs."},{"l":"C","x":"Serum IgM","r":"Both vaccines raise serum antibody."},{"l":"D","x":"Serum IgG","r":"Both vaccines induce serum IgG, which is what protects against paralysis."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-107":{"id":"2027-107","y":2027,"n":"107","p":15,"t":"T09","s":"[Set A] Which of the following is prone to surgical site infection?","c":[{"l":"A","x":"Laparoscopy patient","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"B","x":"Patient with diabetes undergoing eye surgery","r":"Diabetes is listed among host risk factors for healthcare-associated infection, with immunosuppression, malnutrition, obesity, and severe underlying illness."},{"l":"C","x":"Surgery with antibiotic prophylaxis","r":"Prophylaxis lowers infection risk."},{"l":"D","x":"Outpatient circumcision procedure","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"B","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-108":{"id":"2027-108","y":2027,"n":"108","p":15,"t":"T03","s":"[Set C] A 3-year-old girl was brought to the ER due to abrupt vomiting and frequent, large volume, watery diarrhea. She has no past medical conditions but has not received the recommended vaccinations yet. Temperature is 37.8 °C. Physical examination showed mild dehydration. Bowel sounds are increased. Abdomen is soft and mildly tender upon palpation. PCR of her stool sample revealed a virus with segmented, double-stranded RNA genome. Which of the following could be the etiologic agent?","c":[{"l":"A","x":"Hepatitis A","r":"A picornavirus with single-stranded positive-sense RNA. It gives nausea, vomiting, and anorexia before jaundice."},{"l":"B","x":"Rotavirus","r":"Rotavirus (Reoviridae) is a naked virus with a segmented double-stranded RNA genome. It is the leading cause of gastroenteritis in children under 5, with watery diarrhea, vomiting, fever, and dehydration, and is often mild in adults."},{"l":"C","x":"Norwalk Virus","r":"A calicivirus with non-segmented single-stranded positive-sense RNA. Norwalk virus (norovirus, Caliciviridae) is the major cause of epidemic viral gastroenteritis in adults, with outbreaks on cruise ships and in schools and camps. Illness has rapid onset and recovery, RT-PCR is the gold standard test, there is no vaccine, and prevention is rigorous handwashing."},{"l":"D","x":"Hepatitis E","r":"Hepeviridae, single-stranded positive-sense RNA. Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","The 2027 PDF numbers two rows as 108. The Set A row is a blank placeholder. This is the Set C row."],"o":"","f":"ROTADS"},"2027-109":{"id":"2027-109","y":2027,"n":"109","p":15,"t":"T05","s":"[SET B] What is the amplifying host of the Japanese Encephalitis virus?","c":[{"l":"A","x":"Cattle","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"B","x":"Horses","r":"Horses are dead-end hosts of the equine encephalitis viruses."},{"l":"C","x":"Pigs","r":"Pigs are the amplifying host of Japanese encephalitis. They develop high and prolonged viremia that lets mosquitoes pick up the virus."},{"l":"D","x":"Pigeons","r":"Birds are reservoirs of Japanese encephalitis, but the amplifying host named in the lecture is the pig."}],"k":"X","w":["No key was printed for this item in the 2027 PDF. MCB 2.05 (table and review item 3) names the pig as the amplifying host, choice C."],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"JE"},"2027-110":{"id":"2027-110","y":2027,"n":"110","p":16,"t":"T03","s":"[SET C] Which of the following is the causative agent that causes epidemic viral gastroenteritis in adults:","c":[{"l":"A","x":"Parechovirus","r":"Parechoviruses, formerly echoviruses 22 and 23, infect young children. Per the exam rationales they cause gastrointestinal and respiratory illness, meningitis, febrile rash illness, and a sepsis-like picture in neonates."},{"l":"B","x":"Poliovirus","r":"Causes poliomyelitis, the most serious enterovirus disease."},{"l":"C","x":"Norwalk virus","r":"Norwalk virus (norovirus, Caliciviridae) is the major cause of epidemic viral gastroenteritis in adults, with outbreaks on cruise ships and in schools and camps. Illness has rapid onset and recovery, RT-PCR is the gold standard test, there is no vaccine, and prevention is rigorous handwashing."},{"l":"D","x":"Coxsackie virus","r":"Coxsackieviruses are enteroviruses. Group A causes herpangina, hand-foot-and-mouth disease, and acute hemorrhagic conjunctivitis. Group B causes pleurodynia, myocarditis, and pericarditis."}],"k":"C","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","The key is printed as 'C.' in the PDF. A blank 'SET X' placeholder shares this cell."],"o":"","f":"NORO"},"2027-113":{"id":"2027-113","y":2027,"n":"113","p":16,"t":"T05","s":"What is the primary mode of transmission of Filoviridae? (Set B)","c":[{"l":"A","x":"Airborne","r":"The airborne route belongs to tuberculosis, measles, and varicella."},{"l":"B","x":"Contact with body fluids","r":"Filoviruses (Ebola and Marburg) are transmitted by direct contact with blood or body fluids. Fruit bats are the natural hosts, and the viruses cause hemorrhagic fever with high mortality."},{"l":"C","x":"Feco-oral route","r":"The route of enteric viruses such as polio and rotavirus."},{"l":"D","x":"Vector borne","r":"No arthropod vector is involved in filovirus transmission."}],"k":"B","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"FILO"},"2027-114":{"id":"2027-114","y":2027,"n":"114","p":16,"t":"T05","s":"Which is TRUE regarding the epidemiology of the Hantavirus Pulmonary Syndrome? [SET B]","c":[{"l":"A","x":"The primary reservoir of Sin Nombre virus is deer mice.","r":"Sin Nombre virus is the hantavirus that causes hantavirus pulmonary syndrome: fever, headache, and myalgia followed by rapidly progressive pulmonary edema, with mortality of 30 percent or more and no hemorrhage. Its primary reservoir is the deer mouse, Peromyscus maniculatus, and humans are infected by aerosols of rodent urine, feces, or saliva."},{"l":"B","x":"The mode of transmission of the virus is inhalation of urine of deer.","r":"Wrong animal. Infection comes from inhaled excreta of rodents such as deer mice."},{"l":"C","x":"The Hantaan and Dobrava virus is the most severe form.","r":"Hemorrhagic fever with renal syndrome is caused by hantaviruses such as Hantaan and Dobrava in Asia and Europe. It is an acute interstitial nephritis that can progress to renal failure, hemorrhage, and shock, spread by urban rats with no arthropod vector. The 2027 rationale adds that the pulmonary syndrome is the more lethal of the two."}],"k":"A","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","Only three choices were recalled."],"o":"","f":"HANTA"},"2027-115":{"id":"2027-115","y":2027,"n":"115","p":17,"t":"T09","s":"When taking care of a patient with a suspected case of N. Meningitidis,what is the minimum appropriate infection control precaution? (SET A)","c":[{"l":"A","x":"Standard Precaution ONLY","r":"Standard precautions apply to every patient at every encounter regardless of diagnosis. Their elements are hand hygiene, PPE as indicated, respiratory hygiene and cough etiquette, safe injection practices, and proper handling of equipment and textiles. Not sufficient alone for meningococcus."},{"l":"B","x":"Airborne Precaution","r":"Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."},{"l":"C","x":"Droplet Precaution","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"D","x":"Contact Precaution","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."}],"k":"C","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"DROPLET"},"2025-1":{"id":"2025-1","y":2025,"n":"1","p":1,"t":"T02","s":"Which of the following family of DNA viruses does NOT replicate in the nucleus?","c":[{"l":"a","x":"Poxviridae","r":"Poxviridae are large brick-shaped dsDNA viruses with complex symmetry. Their entire multiplication cycle takes place in the cytoplasm because the virion supplies its own enzymes, including a DNA-dependent RNA polymerase. They are the exception to the rule that DNA viruses replicate in the nucleus."},{"l":"b","x":"Papillomaviridae","r":"Papillomaviridae are naked icosahedral viruses with circular dsDNA that replicate in the nucleus. They infect surface epithelium, causing warts and, with high-risk types 16 and 18, cancer, but they do not show latency with reactivation."},{"l":"c","x":"Adenoviridae","r":"Adenoviridae are naked icosahedral viruses with linear dsDNA. Uncoating begins in the cytoplasm but replication is completed in the nucleus of epithelial cells."},{"l":"d","x":"Herpesviridae","r":"Herpesviridae replicate in the nucleus and bud from the nuclear membrane."}],"k":"A","w":[],"i":[],"o":"","f":"POX"},"2025-3":{"id":"2025-3","y":2025,"n":"3","p":1,"t":"T01","s":"Which of the following correctly lists the chronological steps in the replication of ENVELOPED virus","c":[{"l":"a","x":"Attachment, uncoating, penetration, synthesis, maturation, budding","r":"Wrong order. Penetration must come before uncoating."},{"l":"b","x":"Attachment, penetration, uncoating, synthesis, assembly, lysis","r":"The order is right but lysis is the release route of naked viruses."},{"l":"c","x":"Attachment, penetration, uncoating, synthesis, maturation, budding","r":"The cycle is APUSAR: attachment, penetration, uncoating, synthesis, assembly, release. Enveloped viruses are released by budding, which is how they take their envelope from host membrane."},{"l":"d","x":"Attachment, uncoating, penetration, synthesis, assembly lysis","r":"Wrong order, and lysis is for naked viruses."}],"k":"C","w":[],"i":[],"o":"","f":"BUDDING"},"2025-7":{"id":"2025-7","y":2025,"n":"7","p":1,"t":"T03","s":"Which of the following RNA viruses is naked, icosahedral with positive & negative sense double strand genome?","c":[{"l":"a","x":"Influenza","r":"Enveloped and helical, with segmented single-stranded negative-sense RNA."},{"l":"b","x":"Dengue","r":"A flavivirus, enveloped and icosahedral, with single-stranded positive-sense RNA."},{"l":"c","x":"Rotavirus","r":"Rotavirus (Reoviridae) is a naked virus with a segmented double-stranded RNA genome. It is the leading cause of gastroenteritis in children under 5, with watery diarrhea, vomiting, fever, and dehydration, and is often mild in adults."},{"l":"d","x":"SARS-CoV-2","r":"A coronavirus, enveloped and helical, with single-stranded positive-sense RNA."}],"k":"C","w":[],"i":[],"o":"","f":"ROTADS"},"2025-8":{"id":"2025-8","y":2025,"n":"8","p":1,"t":"T06","s":"Considering the host cell receptor of Rhabdovirus, which of the following is the site of infection?","c":[{"l":"a","x":"Gastrointestinal system","r":"The gut is the entry site of enteroviruses, not of rabies."},{"l":"b","x":"Upper respiratory system","r":"Not a rabies target."},{"l":"c","x":"Central nervous system","r":"Rabies virus binds nicotinic acetylcholine receptors on the postsynaptic membrane of muscle at the neuromuscular junction, then travels along nerves to the CNS. The G glycoprotein spike mediates this attachment. Disease is an almost always fatal CNS infection."},{"l":"d","x":"Lower respiratory system","r":"Not a rabies target."}],"k":"C","w":[],"i":[],"o":"","f":"RABREC"},"2025-12":{"id":"2025-12","y":2025,"n":"12","p":2,"t":"T01","s":"Which process in the viral replication cycle corresponds to the exponential growth in the One-Step Virus Growth Curve?","c":[{"l":"a","x":"Viral release and cell lysis","r":"Lysis and cell death belong to the final phase, the cytopathic effect."},{"l":"b","x":"Viral assembly and maturation","r":"In the exponential or rise period progeny virus increases exponentially for 8 to 72 hours as assembled, mature virions accumulate."},{"l":"c","x":"Viral adsorption and entry","r":"This is phase 0, entry, followed by the decline phase."},{"l":"d","x":"Viral uncoating and genome replication","r":"Uncoating starts the eclipse period, when no virus is detectable while components are synthesized."}],"k":"B","w":[],"i":[],"o":"","f":"GROWTH"},"2025-13":{"id":"2025-13","y":2025,"n":"13","p":2,"t":"T02","s":"Which type of cells are highly tropic for parvovirus B19?","c":[{"l":"a","x":"Glial cells","r":"Oligodendrocytes are the target of JC virus in PML."},{"l":"b","x":"CD4 lymphocytes","r":"CD4 T cells are the target of HIV."},{"l":"c","x":"Renal tubule cells","r":"The urinary tract is the site of BK virus reactivation."},{"l":"d","x":"Erythroid cells","r":"Immature erythroid lineage cells are the principal target of B19, which binds the blood group P antigen. Replication kills the cell and interrupts red cell production."}],"k":"D","w":[],"i":[],"o":"","f":"B19ERY"},"2025-17":{"id":"2025-17","y":2025,"n":"17","p":3,"t":"T06","s":"Which of the following diseases is associated with JC virus infection in an HIV patient?","c":[{"l":"a","x":"Progressive multifocal leukoencepalopathy","r":"Progressive multifocal leukoencephalopathy is caused by reactivation of JC virus, a polyomavirus, in immunosuppressed patients. It is a demyelinating disease with visual deficits, mental impairment, weakness, ataxia, and seizures. About 5 percent of AIDS patients develop it."},{"l":"b","x":"Creutzfeld-Jacob Disease","r":"Creutzfeldt-Jakob disease is the most commonly met human prion disease, a transmissible spongiform encephalopathy with progressive dementia, ataxia, and myoclonus."},{"l":"c","x":"Hemorrhagic cystitis","r":"BK virus (human polyomavirus 1) reactivates in the urinary tract of immunocompromised patients, causing hemorrhagic cystitis in bone marrow transplant recipients and polyomavirus-associated nephropathy in renal transplant patients."},{"l":"d","x":"Epidermoplasia verruciformis","r":"Epidermodysplasia verruciformis is an HPV-associated skin condition, mostly benign with some progression to malignancy."}],"k":"A","w":[],"i":[],"o":"","f":"PML"},"2025-19":{"id":"2025-19","y":2025,"n":"19","p":3,"t":"T02","s":"Which of the following HPV types is highly associated with cervical cancer?","c":[{"l":"a","x":"36 and 47","r":"Per the 2025 table these fall with the epidermodysplasia verruciformis types."},{"l":"b","x":"16 and 18","r":"Types 16 and 18 are the high-risk HPV types, with high correlation with genital carcinomas, especially cervical cancer."},{"l":"c","x":"72 and 81","r":"Per the 2025 table these are low-risk anogenital types."},{"l":"d","x":"2 and 4","r":"Types 2 and 4 cause common skin warts and are benign."}],"k":"B","w":[],"i":[],"o":"","f":"HPV"},"2025-24":{"id":"2025-24","y":2025,"n":"24","p":4,"t":"T02","s":"What type of vaccine is smallpox vaccine?","c":[{"l":"a","x":"Live attenuated variola virus","r":"The vaccine does not contain variola."},{"l":"b","x":"Live vaccinia virus","r":"Vaccinia virus, a live related orthopoxvirus, is the agent used for smallpox vaccination."},{"l":"c","x":"Viral vector","r":"A vector vaccine uses a carrier virus to deliver another pathogen's gene."},{"l":"d","x":"Non-infectious subunit","r":"Subunit vaccines carry only viral proteins, as the HPV virus-like particle vaccine does."}],"k":"B","w":[],"i":[],"o":"","f":"SMALLPOX"},"2025-27":{"id":"2025-27","y":2025,"n":"27","p":4,"t":"T06","s":"Which of the following statements is TRUE of rabies?","c":[{"l":"a","x":"There are no tests to diagnose rabies infections in humans before symptoms develop","r":"Keyed true. Rabies virus has not been isolated from blood, and diagnostic tests depend on tissue or on established disease."},{"l":"b","x":"Live-attenuated rabies vaccine is available for use in humans","r":"Human rabies vaccines (PVRV, PCECV) are inactivated virus vaccines."},{"l":"c","x":"Post-exposure prophylaxis consists of administration of rabies antibodies ONLY.","r":"Post-exposure prophylaxis combines passive antibody with active vaccination."},{"l":"d","x":"Identification of Negri bodies in postmortem examination of human brain to diagnose rabies is a routine procedure","r":"Negri bodies are eosinophilic cytoplasmic inclusions in brain neurons, made of rabies virus proteins and viral RNA, seen in Purkinje cells of the cerebellum and pyramidal neurons of the hippocampus. They are pathognomonic but present in only about 80 percent of cases, so their absence does not rule out rabies. Per the 2025 rationale, looking for them is not a routine procedure."}],"k":"A","w":[],"i":[],"o":"","f":"NEGRI"},"2025-29":{"id":"2025-29","y":2025,"n":"29","p":4,"t":"T06","s":"Which of the following is the host cell receptor of rabies virus?","c":[{"l":"a","x":"nicotinic acetylcholine","r":"Rabies virus binds nicotinic acetylcholine receptors on the postsynaptic membrane of muscle at the neuromuscular junction, then travels along nerves to the CNS. The G glycoprotein spike mediates this attachment."},{"l":"b","x":"Gp 120","r":"gp120 is the HIV envelope spike that binds CD4. It is a viral protein, not a host receptor."},{"l":"c","x":"Integrin α6","r":"Per the 2025 rationale this is the receptor recalled for HPV."},{"l":"d","x":"Blood group P antigen","r":"The P antigen on erythroid cells is the receptor for parvovirus B19."}],"k":"A","w":[],"i":[],"o":"","f":"RABREC"},"2025-30":{"id":"2025-30","y":2025,"n":"30","p":4,"t":"T06","s":"What is the cause of the high genetic diversity of HIV viruses?","c":[{"l":"a","x":"The segmented genome allows for re-assortment producing antigenic drift and many subtypes","r":"HIV is diploid, not segmented. Reassortment belongs to influenza and produces shift, not drift."},{"l":"b","x":"The virus originated from non-human primates causing gene recombination with humans","r":"Primate origin does not generate diversity and the virus does not recombine with human genes."},{"l":"c","x":"The viral envelope has many spikes which undergo sequential re-assortment","r":"Spikes do not reassort. Envelope variability results from mutation of the env gene."},{"l":"d","x":"Recombination between two RNA strands during replication and the highly error prone action of the reverse transcriptase","r":"HIV has a diploid genome of two RNA strands, which allows recombination between them, and it replicates with a highly error-prone reverse transcriptase. Together these create quasispecies and continual new antigenic variants."}],"k":"D","w":[],"i":[],"o":"","f":"HIVDIV"},"2025-32":{"id":"2025-32","y":2025,"n":"32","p":5,"t":"T06","s":"What disease is highly associated with HTLV-1?","c":[{"l":"a","x":"Progressive multifocal leukoencephalopathy","r":"Progressive multifocal leukoencephalopathy is caused by reactivation of JC virus, a polyomavirus, in immunosuppressed patients. It is a demyelinating disease with visual deficits, mental impairment, weakness, ataxia, and seizures."},{"l":"b","x":"Creutzfeldt-Jakob disease","r":"Creutzfeldt-Jakob disease is the most commonly met human prion disease, a transmissible spongiform encephalopathy with progressive dementia, ataxia, and myoclonus."},{"l":"c","x":"Kuru","r":"Kuru is a prion disease, a transmissible spongiform encephalopathy spread by ritual cannibalism in the Eastern Highlands of Papua New Guinea."},{"l":"d","x":"Adult T-cell leukemia-lymphoma","r":"HTLV-1 is a deltaretrovirus and the causative agent of adult T-cell leukemia-lymphoma, and of HTLV-1 associated myelopathy or tropical spastic paraparesis. It has marked affinity for mature T cells and acts as a transregulating virus without carrying an oncogene."}],"k":"D","w":[],"i":[],"o":"","f":"HTLV"},"2025-34":{"id":"2025-34","y":2025,"n":"34","p":5,"t":"T06","s":"What is the virus that is associated with Subacute Sclerosing Panencephalitis?","c":[{"l":"a","x":"Measles","r":"Subacute sclerosing panencephalitis is a rare late complication of measles (rubeola) infection. It presents with personality change and poor school performance, then progressive intellectual decline, myoclonus, seizures, and finally an unresponsive spastic state."},{"l":"b","x":"Polyoma","r":"Polyomaviruses include JC virus, the cause of progressive multifocal leukoencephalopathy, BK virus, and Merkel cell virus."},{"l":"c","x":"Rubella","r":"Rubella causes German measles, a mild rash illness, and congenital rubella syndrome when the mother is infected early in pregnancy."},{"l":"d","x":"Mumps","r":"Mumps is a paramyxovirus causing parotitis, with orchitis, oophoritis, mastitis, and aseptic meningitis as complications. It is not a slow virus disease."}],"k":"A","w":[],"i":[],"o":"","f":"SSPE"},"2025-35":{"id":"2025-35","y":2025,"n":"35","p":5,"t":"T06","s":"Which viral infection is associated with Progressive Multifocal Leukoencephalopathy?","c":[{"l":"a","x":"Polyoma","r":"Progressive multifocal leukoencephalopathy is caused by reactivation of JC virus, a polyomavirus, in immunosuppressed patients. It is a demyelinating disease with visual deficits, mental impairment, weakness, ataxia, and seizures."},{"l":"b","x":"Measles","r":"Measles is the virus behind SSPE, the other conventional slow virus disease."},{"l":"c","x":"Mumps","r":"Mumps is a paramyxovirus causing parotitis, with orchitis, oophoritis, mastitis, and aseptic meningitis as complications. It is not a slow virus disease."},{"l":"d","x":"Rubella","r":"Rubella causes German measles, a mild rash illness, and congenital rubella syndrome when the mother is infected early in pregnancy."}],"k":"A","w":[],"i":[],"o":"","f":"PML"},"2025-36":{"id":"2025-36","y":2025,"n":"36","p":5,"t":"T06","s":"Prion proteins in alpha helix conformation are natural components of brains of all living animals.","c":[{"l":"a","x":"True","r":"Normal prion protein (PrPC) has an alpha-helical shape and is a natural component of the body. Disease follows when it is refolded into the beta-pleated sheet form (PrPSc), which is lethal to brain cells and leaves holes in the brain."},{"l":"b","x":"False","r":"False would deny that the normal alpha-helical protein is a natural body component."}],"k":"A","w":[],"i":["The printed 2025 rationale says 'alpha-pleated' for the normal form. The 2026 paper and MCB 2.06 describe it as alpha-helical PrPC."],"o":"","f":"PRIONSHAPE"},"2025-37":{"id":"2025-37","y":2025,"n":"37","p":5,"t":"T06","s":"Which of the following viruses is the causative agent of Cruetzfeldt-Jakob disease?","c":[{"l":"a","x":"Polyoma virus","r":"Polyomaviruses include JC virus, the cause of progressive multifocal leukoencephalopathy, BK virus, and Merkel cell virus."},{"l":"b","x":"Slow virus","r":"Conventional slow virus diseases are SSPE from measles and PML from JC virus. CJD belongs to the unconventional agents."},{"l":"c","x":"Prions","r":"Prions are proteinaceous infectious particles that lack nucleic acid. Misfolded PrPSc forces normal PrPC to change shape and accumulate in the brain, causing transmissible spongiform encephalopathies such as Creutzfeldt-Jakob disease, which presents with progressive dementia, ataxia, and myoclonus. The host shows no inflammatory and no immune response."},{"l":"d","x":"Lassa virus","r":"Lassa virus is an arenavirus with an ambisense segmented RNA genome that causes Lassa fever."}],"k":"C","w":[],"i":[],"o":"","f":"CJD"},"2025-38":{"id":"2025-38","y":2025,"n":"38","p":5,"t":"T06","s":"What is the shape of a prion that is lethal to the brain?","c":[{"l":"a","x":"Beta-pleated sheet","r":"Normal prion protein (PrPC) has an alpha-helical shape and is a natural component of the body. Disease follows when it is refolded into the beta-pleated sheet form (PrPSc), which is lethal to brain cells and leaves holes in the brain."},{"l":"b","x":"Alpha-pleated sheet","r":"The alpha form is the normal prion protein, which does not cause disease."}],"k":"A","w":[],"i":[],"o":"","f":"PRIONSHAPE"},"2025-39":{"id":"2025-39","y":2025,"n":"39","p":5,"t":"T06","s":"All of the following diseases are associated with Epstein Barr virus infection, EXCEPT:","c":[{"l":"a","x":"Nasopharyngeal carcinoma","r":"EBV DNA is regularly found in nasopharyngeal carcinoma cells."},{"l":"b","x":"B-cell lymphoma","r":"EBV establishes latency in B cells and immortalizes them. EBV is associated with Burkitt lymphoma, nasopharyngeal carcinoma, Hodgkin disease, and B-cell lymphoma."},{"l":"c","x":"Merkel cell carcinoma","r":"Merkel cell polyomavirus DNA is found in most cases of Merkel cell carcinoma, a rare and aggressive skin cancer. It is a polyomavirus disease, not an EBV one."},{"l":"d","x":"Burkitt’s lymphoma","r":"EBV may act early in Burkitt lymphoma by immortalizing B cells."}],"k":"C","w":[],"i":[],"o":"","f":"EBV"},"2025-40":{"id":"2025-40","y":2025,"n":"40","p":6,"t":"T03","s":"Which of the following proteins are MAJOR antibody-binding sites of picornaviruses?","c":[{"l":"a","x":"VP1, VP2, VPG","r":"VPg is the genome-linked protein, not a surface antigen."},{"l":"b","x":"VP2 & VP4","r":"VP4 is an internal protein."},{"l":"c","x":"VP3, VP4, VPG","r":"VP4 is internal and VPg is attached to the genome."},{"l":"d","x":"VP1 & VP3","r":"Surface capsid proteins VP1 and VP3 are the major antibody-binding sites. The receptor site itself sits in the canyon where antibodies cannot reach."}],"k":"D","w":[],"i":[],"o":"","f":"PICOVP"},"2025-41":{"id":"2025-41","y":2025,"n":"41","p":6,"t":"T03","s":"Replication of picornaviruses occur in the nucleus","c":[{"l":"a","x":"True","r":"Nuclear replication is the rule for DNA viruses other than poxviruses."},{"l":"b","x":"False","r":"RNA viruses replicate in the cytoplasm, with orthomyxoviruses and retroviruses as the exceptions. Picornavirus replication occurs entirely in the cytoplasm."}],"k":"B","w":[],"i":[],"o":"","f":"PICOCYTO"},"2025-42":{"id":"2025-42","y":2025,"n":"42","p":6,"t":"T03","s":"Which of the following human enterovirus is the etiologic agent of acute hemorrhagic conjunctivitis?","c":[{"l":"a","x":"Enterovirus type 70","r":"Enterovirus 70 is the classic cause of acute hemorrhagic conjunctivitis, with sudden painful red eye and subconjunctival hemorrhage that resolves in about 10 days. It caused pandemics in 1969 to 1971, and coxsackievirus A24 variant causes the same picture."},{"l":"b","x":"Poliovirus types 1-3","r":"Cause poliomyelitis."},{"l":"c","x":"Echovirus types 1,6,9","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"d","x":"Parechovirus types 1,3","r":"Parechoviruses, formerly echoviruses 22 and 23, infect young children. Per the exam rationales they cause gastrointestinal and respiratory illness, meningitis, febrile rash illness, and a sepsis-like picture in neonates."}],"k":"A","w":[],"i":[],"o":"","f":"EV70"},"2025-48":{"id":"2025-48","y":2025,"n":"48","p":6,"t":"T03","s":"Which of the following is a preventive measure against rotavirus?","c":[{"l":"a","x":"Needle-prick precautions","r":"For blood-borne agents such as hepatitis B."},{"l":"b","x":"Social distancing","r":"For respiratory droplet spread."},{"l":"c","x":"Live attenuated vaccine","r":"Vaccination is the best control strategy worldwide. RotaTeq is an oral live attenuated pentavalent human-bovine reassortant and Rotarix an oral live attenuated monovalent human vaccine."},{"l":"d","x":"Wearing of masks","r":"For respiratory transmission, not the fecal-oral route."}],"k":"C","w":[],"i":[],"o":"","f":"ROTAPREV"},"2025-49":{"id":"2025-49","y":2025,"n":"49","p":6,"t":"T03","s":"What is the major cause of epidemic viral gastroenteritis in adults, particularly travelers?","c":[{"l":"a","x":"Polio virus","r":"Causes poliomyelitis."},{"l":"b","x":"Rotavirus","r":"Rotavirus (Reoviridae) is a naked virus with a segmented double-stranded RNA genome. It is the leading cause of gastroenteritis in children under 5, with watery diarrhea, vomiting, fever, and dehydration, and is often mild in adults."},{"l":"c","x":"Norwalk virus","r":"Norwalk virus (norovirus, Caliciviridae) is the major cause of epidemic viral gastroenteritis in adults, with outbreaks on cruise ships and in schools and camps. Illness has rapid onset and recovery, RT-PCR is the gold standard test, there is no vaccine, and prevention is rigorous handwashing."},{"l":"d","x":"Coxsackievirus","r":"Coxsackieviruses are enteroviruses. Group A causes herpangina, hand-foot-and-mouth disease, and acute hemorrhagic conjunctivitis. Group B causes pleurodynia, myocarditis, and pericarditis."}],"k":"C","w":[],"i":[],"o":"","f":"NORO"},"2025-50":{"id":"2025-50","y":2025,"n":"50","p":7,"t":"T05","s":"Dengue virus is transmitted to humans through the bites of which infected insect vector?","c":[{"l":"a","x":"Anopheles","r":"Per the 2025 rationale, the malaria vector."},{"l":"b","x":"Aedes","r":"Aedes aegypti and other Aedes species carry dengue, as well as yellow fever, Zika, and chikungunya."},{"l":"c","x":"Phlebotomus","r":"Per the 2025 rationale, the sandfly vector of leishmaniasis."},{"l":"d","x":"Culex","r":"Culex carries Japanese encephalitis, West Nile, and St. Louis encephalitis."}],"k":"B","w":[],"i":[],"o":"","f":"AEDES"},"2025-52":{"id":"2025-52","y":2025,"n":"52","p":7,"t":"T05","s":"Which of the following rodent-borne viruses cause a pulmonary syndrome characterized by fever, headache, myalgia followed by rapidly progressive pulmonary edema?","c":[{"l":"a","x":"Lassa Virus","r":"An arenavirus causing Lassa fever."},{"l":"b","x":"Hantavirus","r":"Sin Nombre virus is the hantavirus that causes hantavirus pulmonary syndrome: fever, headache, and myalgia followed by rapidly progressive pulmonary edema, with mortality of 30 percent or more and no hemorrhage. Its primary reservoir is the deer mouse, Peromyscus maniculatus, and humans are infected by aerosols of rodent urine, feces, or saliva."},{"l":"c","x":"Marburg Virus","r":"A filovirus causing hemorrhagic fever, spread by contact with body fluids."},{"l":"d","x":"Ebola Virus","r":"A filovirus causing hemorrhagic fever, spread by contact with body fluids."}],"k":"B","w":[],"i":[],"o":"","f":"HANTA"},"2025-53":{"id":"2025-53","y":2025,"n":"53","p":7,"t":"T05","s":"In arboviral transmission that cause encephalitis humans are considered dead-end hosts","c":[{"l":"a","x":"True","r":"For the encephalitis arboviruses (Japanese, West Nile, St. Louis, equine) humans do not develop enough viremia to infect another mosquito, so they are dead-end hosts."},{"l":"b","x":"False","r":"False would apply only to dengue, urban yellow fever, Zika, and chikungunya, where humans sustain the cycle."}],"k":"A","w":[],"i":[],"o":"","f":"DEADEND"},"2025-59":{"id":"2025-59","y":2025,"n":"59","p":8,"t":"T04","s":"Which of the following patients is more likely to have MERS-CoV-2?","c":[{"l":"a","x":"A 41 y/o man from UAE developed severe ARS, he tends camels and sometimes drinks camel’s milk.","r":"MERS-CoV occurs in the Middle East. Bats are the natural reservoir and dromedary camels the intermediate host, with infection through camel contact or camel milk."},{"l":"b","x":"A 50 y/o woman from China who had severe flu-like symptoms, she has close contact with bats and other exotic animals.","r":"Fits SARS-CoV-2, which arose in China with bats as natural reservoir."},{"l":"c","x":"A 32 y/o female from Hongkong who had a cough, difficulty breathing and swine flu.","r":"Swine influenza A H1N1 is acquired by aerosol from infected pigs."}],"k":"A","w":[],"i":[],"o":"","f":"MERS"},"2025-63":{"id":"2025-63","y":2025,"n":"63","p":8,"t":"T04","s":"Which of the following statements is TRUE regarding immunity of an infant born to a mother with previous rubella infection?","c":[{"l":"a","x":"All infants have maternal antibodies to the virus, yet those do not prevent infection or disease","r":"Maternal IgG is protective."},{"l":"b","x":"Previous infection of mother does not confer immunity to offsprings","r":"It does, passively."},{"l":"c","x":"There is passive immunity that protects babies up to 6 months","r":"An immune mother transfers IgG to her offspring, giving natural passive protection for 4 to 6 months."}],"k":"C","w":[],"i":[],"o":"","f":"RUBIGG"},"2025-65":{"id":"2025-65","y":2025,"n":"65","p":8,"t":"T04","s":"An infant is most at risk of acquiring congenital rubella syndrome if a mother is infected at what age of gestation?","c":[{"l":"a","x":"3rd trimester","r":"Defects are uncommon after 20 weeks."},{"l":"b","x":"1st trimester","r":"Congenital rubella syndrome follows maternal viremia with infection of the placenta and fetus. The earlier the infection the greater the damage, with about 85 percent birth defects after first-trimester infection."},{"l":"c","x":"2nd trimester","r":"About 16 percent risk, far below the first trimester."}],"k":"B","w":[],"i":[],"o":"","f":"CRS"},"2025-66":{"id":"2025-66","y":2025,"n":"66","p":8,"t":"T04","s":"The triad of cataract, congenital heart defects such as patent ductus arteriosus and branch pulmonary artery stenosis, and hearing impairment can be caused by which of the following viruses?","c":[{"l":"a","x":"Mumps","r":"Mumps is a paramyxovirus causing parotitis, with orchitis, oophoritis, mastitis, and aseptic meningitis as complications. It is not a slow virus disease."},{"l":"b","x":"Rubella","r":"The classic congenital rubella triad is cataracts, congenital heart defects, and deafness. Congenital rubella syndrome follows maternal viremia with infection of the placenta and fetus. The earlier the infection the greater the damage, with about 85 percent birth defects after first-trimester infection."},{"l":"c","x":"Measles","r":"Measles gives Koplik spots and a descending maculopapular rash, with otitis media and pneumonia as complications."},{"l":"d","x":"Varicella","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption."}],"k":"B","w":[],"i":[],"o":"","f":"CRS"},"2025-70":{"id":"2025-70","y":2025,"n":"70","p":9,"t":"T04","s":"Which of the following parainfluenza virus infections has the propensity to cause epidemics?","c":[{"l":"a","x":"Type III only","r":"Per the 2025 rationale type 3 is endemic and causes bronchitis and pneumonia."},{"l":"b","x":"All of the choices are correct","r":"Only one type is keyed as epidemic."},{"l":"c","x":"Type I only","r":"Per the 2025 rationale type 1 is epidemic and, with type 2, causes laryngotracheitis and croup."},{"l":"d","x":"Type IV only","r":"Type 4 does not usually cause serious disease."}],"k":"C","w":[],"i":[],"o":"","f":"PIV"},"2026-1":{"id":"2026-1","y":2026,"n":"1","p":1,"t":"T07","s":"Which fungi DOES NOT produce microconidia and has beaver tail shape macroconidia?","c":[{"l":"A","x":"Epidermophyton floccosum","r":"Epidermophyton floccosum is the only pathogenic species in its genus. It infects skin and nails but not hair, and produces club-shaped smooth-walled macroconidia in small clusters with no microconidia. The narrow base and broad club-shaped apex of the macroconidium is likened to a beaver tail."},{"l":"B","x":"Trichophyton mentagrophytes","r":"Produces numerous subspherical to pyriform microconidia, with slender clavate smooth-walled macroconidia."},{"l":"C","x":"Trichophyton tonsurans","r":"Produces numerous elongated microconidia attached to supporting hyphae."},{"l":"D","x":"Microsporum canis","r":"Produces a few pyriform to clavate microconidia alongside its large rough-walled macroconidia."}],"k":"A","w":[],"i":[],"o":"","f":"DERMID"},"2026-2":{"id":"2026-2","y":2026,"n":"2","p":1,"t":"T07","s":"Which of the following subcutaneous mycoses is caused by thermally dimorphic fungi?","c":[{"l":"A","x":"Chromoblastomycosis","r":"Chromoblastomycosis is caused by dematiaceous (darkly pigmented) fungi, which are molds and not thermally dimorphic. Its hallmark is the sclerotic body."},{"l":"B","x":"Phaeohyphomycosis","r":"Phaeohyphomycosis is caused by dematiaceous fungi with high melanin content."},{"l":"C","x":"Mycetoma","r":"Eumycetoma is caused by true fungi, including dematiaceous and saprophytic species, and shows swelling, sinuses, and granules."},{"l":"D","x":"Sporotrichosis","r":"Sporothrix schenckii is the thermally dimorphic fungus of sporotrichosis, a subcutaneous mycosis acquired by traumatic implantation from soil or plants. It grows as a mold with delicate hyphae and flower-like conidia at 25°C and converts to small cigar-shaped yeast at 37°C. It is the only subcutaneous mycosis caused by a thermally dimorphic fungus."}],"k":"D","w":[],"i":[],"o":"","f":"SPORO"},"2026-5":{"id":"2026-5","y":2026,"n":"5","p":1,"t":"T07","s":"Which of these structures is the predominant morphology of dermatophytes in clinical specimens?","c":[{"l":"A","x":"Yeast with pseudohyphae","r":"This describes Candida."},{"l":"B","x":"Yeast with capsule","r":"This describes Cryptococcus."},{"l":"C","x":"Septate hyphae","r":"In skin, dermatophytes appear on KOH as hyaline, septate, branching hyphae or chains of arthroconidia."},{"l":"D","x":"Sulfur granules","r":"Granules belong to mycetoma, not dermatophytosis."}],"k":"C","w":[],"i":[],"o":"","f":"KOH"},"2026-6":{"id":"2026-6","y":2026,"n":"6","p":1,"t":"T07","s":"Which of the following does NOT fluoresce under Wood’s lamp? *cannot recall complete choices*","c":[{"l":"A","x":"Ringworm in children - Microsporum canis","r":"M. canis hairs fluoresce bright greenish-yellow."},{"l":"B","x":"Endothrix - Trichophyton tonsurans","r":"In endothrix infection the spores lie inside the hair shaft, and these hairs do not fluoresce under Wood's lamp."},{"l":"C","x":"Ectothrix - Gray patch tinea capitis","r":"Gray-patch tinea capitis is ectothrix Microsporum infection, with spores outside the shaft, and it fluoresces."},{"l":"D","x":"Anthropophilic () - Microsporum gypseum","r":"Per the 2026 rationale M. gypseum gives yellow-green fluorescence. The lecture classes it as geophilic."}],"k":"B","w":[],"i":[],"o":"","f":"MCANIS"},"2026-9":{"id":"2026-9","y":2026,"n":"9","p":2,"t":"T07","s":"What substance can be added to KOH that will bind with chitin and cellulose and fluoresce with ultraviolet light?","c":[{"l":"A","x":"Lactophenol Cotton Blue","r":"A wet-mount stain for asexual spores and fungal structures from culture."},{"l":"B","x":"India Ink","r":"A wet mount that outlines the capsule of Cryptococcus as a halo."},{"l":"C","x":"DMSO","r":"Per the 2026 rationale, an additive for wet mounts."},{"l":"D","x":"Calcofluor white","r":"Calcofluor white binds chitin and cellulose in the fungal wall and fluoresces under UV light, improving the sensitivity of the KOH preparation."}],"k":"D","w":[],"i":[],"o":"","f":"KOH"},"2026-10":{"id":"2026-10","y":2026,"n":"10","p":2,"t":"T07","s":"Which of these dermatophytes is the main cause of tinea pedis, has spiral hyphae, spherical chlamydospores, positive urease test?","c":[{"l":"A","x":"Trichophyton tonsurans","r":"A common cause of tinea capitis, with broad irregular much-branched hyphae."},{"l":"B","x":"Trichophyton mentagrophytes","r":"Per the 2026 rationale, T. mentagrophytes var. interdigitale is a common cause of tinea pedis, especially the vesicular type, and shows occasional spiral hyphae and spherical chlamydospores."},{"l":"C","x":"Epidermophyton floccosum","r":"Epidermophyton floccosum is the only pathogenic species in its genus. It infects skin and nails but not hair, and produces club-shaped smooth-walled macroconidia in small clusters with no microconidia."},{"l":"D","x":"Microsporum gypseum","r":"Produces numerous thin, rough-walled ellipsoid macroconidia and infects skin and hair."}],"k":"B","w":[],"i":[],"o":"","f":"TPEDIS"},"2026-11":{"id":"2026-11","y":2026,"n":"11","p":2,"t":"T07","s":"Which among the following lacks both macroconidia and microconidia, displaying distinctive antler-like hyphae, commonly referred to as \"favic chandeliers\"?","c":[{"l":"A","x":"S. schenckii","r":"Sporothrix schenckii is the thermally dimorphic fungus of sporotrichosis, a subcutaneous mycosis acquired by traumatic implantation from soil or plants. It grows as a mold with delicate hyphae and flower-like conidia at 25°C and converts to small cigar-shaped yeast at 37°C."},{"l":"B","x":"T. verrucosum","r":"Per the 2026 rationale it forms chains of chlamydospores, like a chain of pearls, and some club-shaped hyphal tips give an antler effect."},{"l":"C","x":"T. schoenleinii","r":"The agent of favus. It forms neither macroconidia nor microconidia and shows antler or nail-head hyphae called favic chandeliers."},{"l":"D","x":"M. gypseum","r":"Forms abundant ellipsoid rough-walled macroconidia."}],"k":"C","w":[],"i":[],"o":"","f":"DERMID"},"2026-12":{"id":"2026-12","y":2026,"n":"12","p":3,"t":"T07","s":"Which of the following is considered as subcutaneous mycosis?","c":[{"l":"A","x":"Aspergillosis","r":"An opportunistic mycosis."},{"l":"B","x":"Black piedra","r":"A superficial mycosis of the hair shaft caused by Piedraia hortae."},{"l":"C","x":"Candidiasis","r":"An opportunistic mycosis."},{"l":"D","x":"Sporotrichosis","r":"Sporothrix schenckii is the thermally dimorphic fungus of sporotrichosis, a subcutaneous mycosis acquired by traumatic implantation from soil or plants. It grows as a mold with delicate hyphae and flower-like conidia at 25°C and converts to small cigar-shaped yeast at 37°C."}],"k":"D","w":[],"i":[],"o":"","f":"SPORO"},"2026-14":{"id":"2026-14","y":2026,"n":"14","p":3,"t":"T08","s":"What is the mold form of Coccidioides?","c":[{"l":"A","x":"Arthroconidia separated by disjunctor cells","r":"Coccidioides immitis grows as a mold with chains of arthroconidia separated by disjunctor cells at 25 to 30°C. In tissue at 37°C it forms large thick-walled spherules up to about 80 micrometers filled with endospores."},{"l":"B","x":"Presence of pyriform","r":"Oval to pyriform conidia on delicate septate hyphae describe the mold form of Blastomyces dermatitidis."},{"l":"C","x":"Multiple budding yeast","r":"Paracoccidioides brasiliensis at 36 to 37°C forms large yeast up to 30 micrometers with multiple buds attached by narrow connections, resembling the spokes of a ship's wheel."},{"l":"D","x":"Within macrophages","r":"Histoplasma capsulatum is a thermally dimorphic systemic fungus. The mold form shows large tuberculate macroconidia of 8 to 16 micrometers with small microconidia, and the 37°C form is a small oval yeast that grows inside macrophages and reticuloendothelial cells."}],"k":"A","w":[],"i":[],"o":"","f":"DIMORPH"},"2026-16":{"id":"2026-16","y":2026,"n":"16","p":3,"t":"T08","s":"39/M, is HIV positive with pneumonia and multiple lymphadenopathies. Fungal culture shows broad-based budding yeast cells. What is the primary antifungal suggested for his case?","c":[{"l":"A","x":"Nystatin","r":"A topical polyene for superficial candidiasis."},{"l":"B","x":"Ketoconazole","r":"An azole. Per the 2026 rationale itraconazole for 6 months suits confined lesions."},{"l":"C","x":"Griseofulvin","r":"An oral agent for dermatophytosis only."},{"l":"D","x":"Amphotericin B","r":"Blastomyces dermatitidis at 37°C is a large, thick-walled, multinucleated spherical yeast of 8 to 15 micrometers that produces a single bud on a broad base. Amp
