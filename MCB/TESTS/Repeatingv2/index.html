ssion is conventionally community-acquired."},{"l":"c","x":"Occurring only in intensive care","r":"ICU stay raises risk but HAIs occur in any care setting."},{"l":"d","x":"Within 7 days after discharge","r":"The window taught is within 10 days after discharge, with surgical site infection counted up to 30 days after the operation."}],"k":"A","w":[],"i":[],"o":""},"2028-73":{"id":"2028-73","y":2028,"n":"73","p":18,"t":"T09","s":"Which pathogen requires droplet precautions?","c":[{"l":"a","x":"C. difficile","r":"C. difficile requires contact precautions, with soap-and-water hand hygiene and sporicidal disinfection because alcohol does not kill spores."},{"l":"b","x":"Pertussis","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"c","x":"MRSA","r":"MRSA requires contact precautions since it spreads on hands and fomites."},{"l":"d","x":"Tuberculosis","r":"Pulmonary tuberculosis requires airborne precautions. Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."},{"l":"e","x":"Varicella","r":"Varicella requires airborne precautions, and contact precautions for vesicle fluid."}],"k":"B","w":[],"i":[],"o":"","f":"DROPLET"},"2028-74":{"id":"2028-74","y":2028,"n":"74","p":18,"t":"T09","s":"Which factor most significantly increases the risk for catheter-associated UTI?","c":[{"l":"a","x":"Duration of catheterization","r":"The lecture states that CAUTI risk rises with each catheter-day, so the longer an indwelling urinary catheter stays, the greater the chance of colonization and infection."},{"l":"b","x":"Frequency of catheter irrigation","r":"Per the 2028 rationale, irrigation has little effect on risk and may introduce pathogens if not done aseptically."},{"l":"c","x":"Gender","r":"Per the 2028 rationale, females have a somewhat higher baseline UTI risk, but this matters less than duration."},{"l":"d","x":"Age","r":"Extremes of age raise HAI risk in general, but duration remains the primary factor for CAUTI."},{"l":"e","x":"Type of catheter material","r":"Per the 2028 rationale, some materials such as silicone lower risk slightly, far less than shortening catheter time."}],"k":"A","w":[],"i":[],"o":""},"2028-75":{"id":"2028-75","y":2028,"n":"75","p":18,"t":"T09","s":"What isolation precautions should be used for patients with C. difficile associated disease?","c":[{"l":"a","x":"Airborne precautions","r":"Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."},{"l":"b","x":"Contact precautions","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris. For C. difficile add soap-and-water handwashing and a sporicidal disinfectant."},{"l":"c","x":"Droplet precautions","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"d","x":"No safety precautions","r":"Isolation is needed because spores survive for long periods on surfaces and resist alcohol rubs and routine disinfectants."},{"l":"e","x":"Protective isolation","r":"Protective isolation shields immunocompromised patients from acquiring infection. It does not contain a patient who is the source."}],"k":"B","w":[],"i":[],"o":"","f":"CONTACT"},"2028-76":{"id":"2028-76","y":2028,"n":"76","p":19,"t":"T09","s":"A 65-year-old patient developed a urinary tract infection 3 days after urinary catheterization. Which of the following is the most likely etiologic agent?","c":[{"l":"a","x":"Candida albicans","r":"Candida is on the CAUTI list but is not the most common agent. It also overgrows after broad-spectrum antibiotics."},{"l":"b","x":"Escherichia coli","r":"E. coli is the most common cause of catheter-associated UTI. As resident gut flora it becomes pathogenic when it moves from gut to urinary tract."},{"l":"c","x":"Enterococcus faecalis","r":"Enterococcus is listed for both CAUTI and surgical site infection but is not the most common CAUTI agent."},{"l":"d","x":"Pseudomonas aeruginosa","r":"Pseudomonas can cause CAUTI but is best known as the most common cause of ventilator-associated pneumonia."},{"l":"e","x":"Staphylococcus epidermidis","r":"S. epidermidis is coagulase-negative resident skin flora that forms biofilm on prosthetic valves, shunts, and lines, and causes surgical site and line infections."}],"k":"B","w":[],"i":[],"o":""},"2028-77":{"id":"2028-77","y":2028,"n":"77","p":19,"t":"T09","s":"What is the significance of MRSA in healthcare settings?","c":[{"l":"a","x":"Contagious by airborne transmission","r":"MRSA spreads by direct skin contact or indirectly on fomites and hands, so it needs contact precautions, not airborne ones."},{"l":"b","x":"Resistant to multiple antibiotics","r":"Methicillin-resistant Staphylococcus aureus resists many antibiotics. It is one of the most common transient-flora HAI pathogens and the second most common cause of VAP."},{"l":"c","x":"Cannot be detected through laboratory assessments","r":"Like any S. aureus it is detected by routine culture."},{"l":"d","x":"Cause more severe symptoms than MSSA","r":"MRSA is not necessarily more severe than methicillin-susceptible S. aureus. The difference lies in drug resistance."},{"l":"e","x":"Only targets immunocompromised patients","r":"Immunocompromised patients are at higher risk, but MRSA can infect anyone."}],"k":"B","w":[],"i":[],"o":""},"2028-78":{"id":"2028-78","y":2028,"n":"78","p":19,"t":"T09","s":"A surgeon is preparing for a coronary artery bypass graft. He performed a 3-minute scrub up to the elbows with chlorhexidine and put on a sterile gown and gloves. This process is indicated in:","c":[{"l":"a","x":"Contact Precaution","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."},{"l":"b","x":"Droplet Precaution","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"c","x":"Medical Asepsis","r":"Medical asepsis reduces and prevents the spread of microorganisms during general patient care. It does not aim to eliminate all microbes."},{"l":"d","x":"Procedure Isolation","r":"Per the 2028 rationale this is not standard CDC terminology."},{"l":"e","x":"Surgical Asepsis","r":"Surgical asepsis aims for absence of all microorganisms before an invasive procedure by creating a sterile field. Chlorhexidine and alcohol surgical scrubs target resident flora in the deeper skin, which routine handwashing does not remove."}],"k":"E","w":[],"i":[],"o":""},"2028-79":{"id":"2028-79","y":2028,"n":"79","p":19,"t":"T04","s":"In post-natal rubella, how long does rubella virus specific maternal IgG antibodies persist in the child?","c":[{"l":"a","x":"One to two months","r":"Too short. Rubella IgM, not maternal IgG, is the short-lived antibody and does not persist beyond 6 weeks."},{"l":"b","x":"Four to six months","r":"Natural passive immunity: an immune mother transfers IgG across the placenta, protecting the infant for 4 to 6 months."},{"l":"c","x":"One year","r":"Longer than the 4 to 6 months of passive protection taught."},{"l":"d","x":"Lifelong","r":"Lifelong immunity comes from the person's own IgG after natural infection, because rubella has one antigenic type. Passively acquired maternal IgG wanes."}],"k":"B","w":[],"i":[],"o":"","f":"RUBIGG"},"2028-80":{"id":"2028-80","y":2028,"n":"80","p":20,"t":"T04","s":"Which of the following characterizes the disease caused by Parainfluenza virus type 1 and 2?","c":[{"l":"a","x":"Croup in the immunocompetent host spreads to the lower respiratory tract","r":"Per the 2028 rationale, croup stays localized and does not spread to the lower respiratory tract in an immunocompetent host."},{"l":"b","x":"Infection produces cervical lymphadenopathy leading to airway obstruction","r":"The obstruction of croup comes from swelling of the larynx and related structures, which gives the barking cough, not from lymph nodes."},{"l":"c","x":"Laryngotracheobronchitis will progress to systemic viral infection","r":"Viremia is uncommon if it occurs at all, so systemic spread is not expected."},{"l":"d","x":"Virus replication in immunocompetent host is limited to upper respiratory tract","r":"Parainfluenza virus replication in the immunocompetent host appears limited to respiratory epithelia, and viremia is uncommon. Infection may involve only the nose and throat as a common cold, or with types 1 and 2 extend to the larynx and upper trachea as croup."}],"k":"D","w":[],"i":["The same question is review item 1 of MCB 2.04, where the lecture key is the choice stating that replication is limited to the upper respiratory epithelia."],"o":"","f":"PIV"},"2028-81":{"id":"2028-81","y":2028,"n":"81","p":20,"t":"T04","s":"How does one acquire immunity from a mumps infection?","c":[{"l":"a","x":"Waning immunity from natural infection","r":"Waning immunity applies to viruses with many antigenic types or variants. Mumps immunity after natural infection is permanent."},{"l":"b","x":"Via booster vaccine for MMR","r":"MMR is a live attenuated vaccine given as part of routine immunization. The question asks how natural infection gives immunity, and the HN antigens do not arise from a booster."},{"l":"c","x":"Long lasting immunity from one serotype","r":"Mumps virus has only one antigenic type and is genetically stable, so a single infection gives permanent immunity. Even subclinical infection generates lifelong immunity."},{"l":"d","x":"Bodily immune system identifies segmented genome with subclinical infection","r":"Paramyxoviruses have a non-segmented negative-sense RNA genome. Subclinical infection does immunize, but not by recognition of a segmented genome."}],"k":"C","w":[],"i":[],"o":"","f":"ONETYPE"},"2028-82":{"id":"2028-82","y":2028,"n":"82","p":20,"t":"T04","s":"The following are effects of syncytium formation in the pathogenesis of disease among paramyxoviruses, EXCEPT","c":[{"l":"a","x":"Promotes virus dissemination within the host by allowing the virus to move directly from one cell to another","r":"Activated fusion (F) protein fuses adjacent cell membranes into multinucleated giant cells, letting virus pass from cell to cell."},{"l":"b","x":"Protects the virus from exposure to extracellular neutralizing antibodies circulating in the blood stream","r":"Because spread happens inside fused cells, the virus avoids neutralizing antibodies."},{"l":"c","x":"Syncytial giant cells promote viral genetic mutation","r":"This is the exception. Syncytium formation changes cell structure, not viral genetics. Paramyxoviruses are mostly monotypic and do not undergo drift or reassortment."},{"l":"d","x":"Syncytia die within a few days which promotes necrosis and tissue damage in the lungs","r":"Fused cells die, adding to necrosis and airway obstruction, as in RSV bronchiolitis."}],"k":"C","w":[],"i":["The source PDF prints this key with an asterisk (C*). No explanation of the asterisk is given in the document."],"o":""},"2028-83":{"id":"2028-83","y":2028,"n":"83","p":20,"t":"T04","s":"What causes the maculopapular rashes?","c":[{"l":"a","x":"The virus affects the epithelial layers causing minute hemorrhages.","r":"The rash is not caused by direct viral damage with hemorrhage."},{"l":"b","x":"The fusion proteins induce the formation of syncytial bodies.","r":"F protein does create multinucleated giant cells, the cytopathic hallmark of measles, but syncytia are not what produces the skin rash."},{"l":"c","x":"The interaction of inflammatory cells and viral antigens with endothelial cells.","r":"The measles rash is immune-mediated. Virus infects dermal capillary endothelial cells, and sensitized lymphocytes, antibody, and complement interact with viral antigen there. It appears about day 14, just as circulating antibody becomes detectable."},{"l":"d","x":"Measles virus replicates in the macrophages and disseminates on the skin","r":"Measles does replicate in the reticuloendothelial system during viremia, but that spread is not the mechanism of the rash."}],"k":"C","w":[],"i":[],"o":""},"2028-84":{"id":"2028-84","y":2028,"n":"84","p":20,"t":"T04","s":"All of the following viruses are examples of zoonotic infections EXCEPT:","c":[{"l":"a","x":"Hendra virus","r":"Hendra is a henipavirus whose natural reservoir is flying foxes. It spills over to horses, which then infect humans through close contact."},{"l":"b","x":"MERS-CoV","r":"MERS-CoV reaches humans from dromedary camels, with bats as the natural reservoir."},{"l":"c","x":"Nipah","r":"Nipah is carried by Pteropus fruit bats. Humans are infected through bats, infected pigs, or food such as raw date palm sap contaminated by bat secretions."},{"l":"d","x":"Parainfluenza","r":"Human parainfluenza virus spreads strictly person to person by direct contact or large respiratory droplets and has no animal reservoir."}],"k":"D","w":[],"i":[],"o":"","f":"HENIPA"},"2028-85":{"id":"2028-85","y":2028,"n":"85","p":21,"t":"T04","s":"Respiratory Syncytial Virus has tropism for what type of cell:","c":[{"l":"a","x":"Alveolar cells of the lungs","r":"RSV infection can spread to the lower respiratory tract, but alveolar cells are not its main target."},{"l":"b","x":"Ciliated cells of the airway","r":"RSV enters the upper respiratory tract and mainly targets ciliated cells of the large airways, causing cell rounding, detachment, and sloughing."},{"l":"c","x":"Epithelium of the larynx","r":"Laryngeal involvement with croup is the pattern of parainfluenza types 1 and 2."},{"l":"d","x":"Mucous secreting cells of the lungs","r":"Excess mucus is a consequence of RSV infection rather than its target cell."}],"k":"B","w":[],"i":[],"o":""},"2028-86":{"id":"2028-86","y":2028,"n":"86","p":21,"t":"T04","s":"What is the function of the neuraminidase enzyme of influenza virus?","c":[{"l":"a","x":"Facilitate release of virus particles from infected cell surface","r":"NA helps release budding virions from the infected cell surface and prevents self-aggregation of virions."},{"l":"b","x":"Helps the virus negotiate through mucin layer of the respiratory tract","r":"NA may help the virus pass through the mucin layer to reach target epithelial cells."},{"l":"c","x":"Breaks down the sialic acid from glycoconjugates","r":"NA is a sialidase enzyme that removes sialic acid from glycoconjugates."},{"l":"d","x":"All of the above","r":"All three statements describe neuraminidase."}],"k":"D","w":[],"i":[],"o":""},"2028-87":{"id":"2028-87","y":2028,"n":"87","p":21,"t":"T04","s":"How does genetic alteration in antigenic shift occur?","c":[{"l":"a","x":"Accumulation of point mutation in the gene resulting in changes in the nucleotide sequence","r":"Antigenic drift is a gradual change caused by point mutations in the HA and NA genes. The small amino acid changes alter key epitopes so existing antibodies fail to neutralize the newer virus, which drives seasonal epidemics rather than pandemics."},{"l":"b","x":"Combination of viral genes in an infected cell with Influenza A and Influenza C virus","r":"Reassortment happens only between influenza A strains. Influenza A and C are separate types with no cross-reactive internal proteins and cannot reassort together."},{"l":"c","x":"Influenza virus is passed on from one person to another and exposed to differing antibody attacks at each step","r":"This describes how drift variants are selected as the virus meets different antibody pressures from host to host."},{"l":"d","x":"Segment reassortment between human influenza A virus strains and avian influenza A strains resulting in a new subtype","r":"Antigenic shift is an abrupt change caused by genetic reassortment, where two influenza A strains such as a human and an avian or swine strain co-infect one cell and exchange genome segments. The new HA and NA subtype meets almost no existing immunity, which is why shift produces pandemics."}],"k":"D","w":[],"i":[],"o":"","f":"SHIFT"},"2028-88":{"id":"2028-88","y":2028,"n":"88","p":21,"t":"T04","s":"What is the consequence of antigenic drift in influenza virus?","c":[{"l":"a","x":"The body’s immune system can recognize the new Hemagglutinin-Neuraminidase antigen preventing severe illness","r":"The reverse is true. Drift variants escape recognition."},{"l":"b","x":"The body’s existing antibodies do not recognize and neutralize new flu virus because of point mutations in key viral epitopes","r":"Antigenic drift is a gradual change caused by point mutations in the HA and NA genes. The small amino acid changes alter key epitopes so existing antibodies fail to neutralize the newer virus, which drives seasonal epidemics rather than pandemics."},{"l":"c","x":"Major mutations resulting in changes in Hemagglutinin-Neuraminidase subtype","r":"A change of HA or NA subtype is antigenic shift, an abrupt change."},{"l":"d","x":"Produce new influenza subtype infecting animals resulting in pandemics","r":"New subtypes and pandemics are the outcome of shift through reassortment between human and avian or swine strains."}],"k":"B","w":[],"i":[],"o":"","f":"DRIFT"},"2028-89":{"id":"2028-89","y":2028,"n":"89","p":22,"t":"T04","s":"What is the effect of Influenza virus in cells?","c":[{"l":"a","x":"Cell transformation","r":"Transformation is unregulated growth induced by oncogenic viruses."},{"l":"b","x":"Cell death","r":"Influenza destroys the superficial respiratory mucosa. Activated cytotoxic CD8 T cells target infected cells and release granzymes and perforin to induce their death, so the outcome for the host cell is cell death."},{"l":"c","x":"Latent infection","r":"Latent infection means viral genetic material stays dormant in the host cell, as herpesviruses do in ganglia."},{"l":"d","x":"Persistent infection","r":"Persistent infection produces few virions with little cytopathic effect while the cell survives, as in chronic hepatitis B or C."}],"k":"B","w":[],"i":[],"o":"","f":"FLUDEATH"},"2028-90":{"id":"2028-90","y":2028,"n":"90","p":22,"t":"T10","s":"Which is TRUE of the 2022 global Mpox outbreak?","c":[{"l":"A","x":"Majority were acquired through the respiratory route.","r":"Transmission in 2022 was mainly by skin and mucosal contact during sexual activity. Mpox is not highly transmissible and needs close contact."},{"l":"B","x":"Predominantly caused by the more transmissible and more deadly clade I.","r":"The 2022 outbreak was caused by clade IIb of the West African clade. Clade I, the Congo Basin clade, is the more severe one."},{"l":"C","x":"The most common symptom is a genital rash thereby making it easy to detect.","r":"Any rash, at about 91 percent, was the most common symptom. Genital rash occurred in only about half of cases."},{"l":"D","x":"The smallpox vaccine provides cross-protection.","r":"Smallpox vaccine is about 85 percent protective against monkeypox, and waning of that immunity is one reason mpox emerged."}],"k":"D","w":[],"i":[],"o":""},"2028-91":{"id":"2028-91","y":2028,"n":"91","p":22,"t":"T10","s":"Which of the following is a feature of Avian Influenza?","c":[{"l":"a","x":"Causes severe pneumonia in humans","r":"Avian influenza A such as H5N1 primarily infects birds and only occasionally reaches humans through contact with poultry. H5N1 binds receptors in the lower respiratory tract, which explains severe pneumonia, a case fatality near 59 percent, and limited person-to-person spread."},{"l":"b","x":"Highly infectious","r":"Person-to-person transmissibility is limited. Human cases follow direct or indirect contact with poultry."},{"l":"c","x":"Primarily infects the CNS","r":"The disease is pulmonary, not neurologic."},{"l":"d","x":"All of the above","r":"Only the first statement is true."}],"k":"A","w":[],"i":[],"o":"","f":"AVIAN"},"2028-92":{"id":"2028-92","y":2028,"n":"92","p":22,"t":"T10","s":"Which of the following factors contribute to the emergence and reemergence of pertussis?","c":[{"l":"A","x":"Deforestation and habitat destruction","r":"A physical and environmental factor. The 2028 rationale ties it to monkeypox emergence."},{"l":"B","x":"Inadequate vector control","r":"Relevant to vector-borne diseases such as dengue. Pertussis spreads by respiratory droplets."},{"l":"C","x":"Robust national immunization program","r":"Vaccine introduction through the national program caused a dramatic decline in pertussis, the opposite of resurgence."},{"l":"D","x":"Waning immunity","r":"Pertussis resurgence reflects several factors, chief among them waning immunity after acellular pertussis vaccine replaced whole-cell vaccine, along with better diagnostics and microbial adaptation."}],"k":"D","w":[],"i":[],"o":"","f":"PERT"},"2028-93":{"id":"2028-93","y":2028,"n":"93","p":22,"t":"T10","s":"Which predominant poliovirus type caused the 2019-2021 outbreak in the Philippines?","c":[{"l":"A","x":"Sabin-like poliovirus","r":"Sabin and Sabin-like viruses are the live attenuated OPV strains shed after vaccination. They can diverge genetically and regain neurovirulence, becoming VDPV."},{"l":"B","x":"Vaccine poliovirus type 2","r":"The outbreak declared on September 19, 2019 followed a confirmed cVDPV2 case with acute flaccid paralysis, and 2019 to 2021 cases were mostly cVDPV2. Type 2 causes 86 percent of cVDPV."},{"l":"C","x":"Vaccine poliovirus type 3","r":"Type 3 causes only about 1 percent of cVDPV."},{"l":"D","x":"Wild poliovirus type 1","r":"The Philippine outbreak was vaccine-derived. VDPV1 was found in environmental samples, but no wild virus was involved."}],"k":"B","w":[],"i":[],"o":"","f":"CVDPV"},"2028-94":{"id":"2028-94","y":2028,"n":"94","p":23,"t":"T05","s":"Which of the following vector-borne virus is associated correctly with its main disease manifestation?","c":[{"l":"A","x":"Chikungunya: Hemorrhagic Fever","r":"Chikungunya is an Aedes-borne togavirus (alphavirus). Infected monocytes and macrophages carry it to the synovial tissue of joints, giving the severe and often prolonged or recurrent polyarthralgia that distinguishes it. Severe polyarthralgia, not hemorrhagic fever, is its hallmark."},{"l":"B","x":"Japanese Encephalitis: Arthralgia","r":"Japanese encephalitis is a flavivirus transmitted by Culex mosquitoes that breed in rice fields. Birds are reservoirs, pigs are the amplifying host, and humans are dead-end hosts who develop acute viral encephalitis."},{"l":"C","x":"Yellow Fever: Breakbone fever","r":"Yellow fever causes hemorrhagic fever with jaundice. Breakbone fever is the name for dengue."},{"l":"D","x":"Zika: Congenital Microcephaly","r":"Zika is an Aedes-borne flavivirus causing rash, fever, arthralgia, and nonpurulent conjunctivitis. Its most serious complication is congenital Zika syndrome, where infection of fetal neural progenitor cells causes microcephaly and other malformations. In adults it is associated with Guillain-Barre syndrome."}],"k":"D","w":[],"i":[],"o":"","f":"ZIKA"},"2028-95":{"id":"2028-95","y":2028,"n":"95","p":23,"t":"T04","s":"Which of the following is an effective preventive measure against Henipah Virus?","c":[{"l":"a","x":"Antiviral Post-Exposure Prophylaxis","r":"No established antiviral prophylaxis exists for henipaviruses."},{"l":"b","x":"Avoid contact of infected animals","r":"Prevention rests on avoiding contact with bats, sick horses and pigs, and their excretions, since Pteropus fruit bats are the main reservoir."},{"l":"c","x":"Use of insecticide repellent DEET","r":"Henipaviruses are not vector-borne, so repellents do nothing."},{"l":"d","x":"Human Vaccination","r":"No licensed human vaccine is available."}],"k":"B","w":[],"i":[],"o":"","f":"HENIPA"},"2028-96":{"id":"2028-96","y":2028,"n":"96","p":23,"t":"T10","s":"A SARS-COV 2 variant is considered as a variant of concern (VOC) if it is which of the following","c":[{"l":"a","x":"Decrease immune response","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"b","x":"Enhance susceptibility to antivirals","r":"Greater susceptibility would be favorable. A VOC is defined by harm, such as a significant decrease in effectiveness of available vaccines."},{"l":"c","x":"Increase transmissibility","r":"Per the 2028 rationale, a VOC is a variant of interest that also shows detrimental change in disease severity, an epidemiologic impact large enough to strain health systems, or significantly reduced vaccine effectiveness. Increased transmissibility is the keyed epidemiologic change."},{"l":"d","x":"Minimal clinical disease","r":"A VOC shows a detrimental change in clinical severity, not minimal disease."}],"k":"C","w":[],"i":["Project-source note: MCB 2.10 lists VOC, VOI, and VUM only as abbreviations, so the definitions here rest on the 2028 exam rationale."],"o":"","f":"VOC"},"2028-97":{"id":"2028-97","y":2028,"n":"97","p":23,"t":"T04","s":"Why is influenza Type A more likely to cause pandemics?","c":[{"l":"a","x":"Can undergo point mutations (antigenic drift) similar to Influenza B","r":"Drift occurs in both A and B and gives seasonal epidemics, so it does not explain pandemics."},{"l":"b","x":"Highly variable hemagglutinin and neuraminidase","r":"Influenza A has many HA and NA subtypes in animal reservoirs and a segmented genome that reassorts, so entirely new subtypes can emerge by antigenic shift into a population with little immunity."},{"l":"c","x":"Limited host range","r":"The opposite is true. Influenza A infects birds, pigs, and humans, and that wide host range enables reassortment."},{"l":"d","x":"Slow evolution through gradual mutations","r":"Gradual mutation describes drift. Pandemics follow the abrupt change of shift."}],"k":"B","w":[],"i":[],"o":"","f":"SHIFT"},"2028-98":{"id":"2028-98","y":2028,"n":"98","p":24,"t":"T10","s":"An MPOX patient was referred to the surveillance unit for monitoring. Which of the following conditions will make the patient viable for discharge?","c":[{"l":"a","x":"After lysis of fever","r":"Fever resolution does not end infectiousness, because lesion material still carries viable virus."},{"l":"b","x":"After 14th day of isolation","r":"No fixed day count applies. The end point is the state of the lesions."},{"l":"c","x":"After resolution of respiratory symptoms","r":"Respiratory symptoms are not the marker of infectivity."},{"l":"d","x":"After crusting of lesions","r":"Isolation can be discontinued only after all lesions have crusted. The cited Harrison's passage adds that scabs contain viable virus, so the infectious period ends once scabs separate and intact skin forms."}],"k":"D","w":[],"i":[],"o":""},"2028-99":{"id":"2028-99","y":2028,"n":"99","p":24,"t":"T10","s":"Which of the following statements about the epidemiology of emerging and re-emerging diseases is TRUE?","c":[{"l":"a","x":"Genetics play a role in susceptibility","r":"Genetic factors can raise susceptibility, as with certain HLA alleles, or protect, as with lack of the Duffy antigen. The lecture teaches this, but it is not the keyed statement."},{"l":"b","x":"Affected a given area in the past declined or were controlled but are again being reported in increasing numbers","r":"This defines re-emerging diseases only. Emerging diseases are those that appear in a population for the first time."},{"l":"c","x":"Most are zoonotic in origin","r":"About 75 percent of emerging infectious diseases affecting people originated in animals and crossed the species barrier."},{"l":"d","x":"All have pandemic potential","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"C","w":[],"i":[],"o":""},"2028-100":{"id":"2028-100","y":2028,"n":"100","p":24,"t":"T10","s":"Which Henipavirus was discovered in 2022 among febrile human cases in Eastern China?","c":[{"l":"a","x":"Cedar","r":"Cedar virus is a henipavirus species, but not the one found in 2022."},{"l":"b","x":"Langya","r":"Langya henipavirus was identified in August 2022 among febrile human cases in eastern China."},{"l":"c","x":"Mojiang","r":"Mojiang virus is closely related to Langya but was not the 2022 discovery."},{"l":"d","x":"Nipah","r":"Nipah was first recognized in 1999 in Malaysia in pigs and people, with later outbreaks in Bangladesh and India."}],"k":"B","w":[],"i":[],"o":"","f":"HENIPA"},"2027-2":{"id":"2027-2","y":2027,"n":"2","p":1,"t":"T02","s":"A persistent, latent infection with intermittent reactivation, which of the group of drugs does this belong to? [set a]","c":[{"l":"A","x":"Orthomyxoviridae","r":"Orthomyxoviridae (influenza) cause acute infection that ends in host cell death. They have no latent phase."},{"l":"B","x":"Papovaviridae","r":"Papovaviridae is the older grouping of papilloma and polyoma viruses. Per the 2027 rationale they cause persistent infection without a classic latent phase with reactivation dynamics."},{"l":"C","x":"Papillomaviridae","r":"Papillomaviridae are naked icosahedral viruses with circular dsDNA that replicate in the nucleus. They infect surface epithelium, causing warts and, with high-risk types 16 and 18, cancer, but they do not show latency with reactivation."},{"l":"D","x":"Herpesviridae","r":"Herpesviridae are enveloped icosahedral dsDNA viruses defined by lifelong latent infection with periodic reactivation, most often in the elderly and immunosuppressed. HSV lies latent in sensory ganglia, and some members cause cancer."}],"k":"D","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","The stem is reproduced as recalled, including the phrase 'group of drugs'. The choices show that a virus family is meant. Asked again in this paper as Q44."],"o":""},"2027-3":{"id":"2027-3","y":2027,"n":"3","p":1,"t":"T02","s":"DNA Virus that multiplies in the cytoplasm?","c":[{"l":"A","x":"Poxvirus","r":"Poxviridae are large brick-shaped dsDNA viruses with complex symmetry. Their entire multiplication cycle takes place in the cytoplasm because the virion supplies its own enzymes, including a DNA-dependent RNA polymerase. They are the exception to the rule that DNA viruses replicate in the nucleus."},{"l":"B","x":"Herpesvirus","r":"Herpesviruses replicate in the nucleus and bud from the nuclear membrane, which is why their envelope comes from nuclear rather than plasma membrane."},{"l":"C","x":"Papillomavirus","r":"Papillomaviridae are naked icosahedral viruses with circular dsDNA that replicate in the nucleus. They infect surface epithelium, causing warts and, with high-risk types 16 and 18, cancer, but they do not show latency with reactivation."}],"k":"A","w":[],"i":["Only three choices were recalled. Asked again in this paper as Q24, Q50, and Q84."],"o":"","f":"POX"},"2027-4":{"id":"2027-4","y":2027,"n":"4","p":1,"t":"T06","s":"Negri bodies in rabies are found in association with: [set c]","c":[{"l":"A","x":"Isolation from qviral RNA","r":"Detection of viral RNA is done by reverse transcription PCR on brain tissue or other specimens. It is a nucleic acid test, not a histologic finding."},{"l":"B","x":"Histopathological identification in neuronal cells","r":"Negri bodies are eosinophilic cytoplasmic inclusions in brain neurons, made of rabies virus proteins and viral RNA, seen in Purkinje cells of the cerebellum and pyramidal neurons of the hippocampus. They are pathognomonic but present in only about 80 percent of cases, so their absence does not rule out rabies."},{"l":"C","x":"Measurement of antigen or antibody levels in saliva from either humans or animals","r":"Antigen detection uses immunofluorescence or immunoperoxidase staining with antirabies monoclonal antibodies. It does not involve Negri bodies."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q101."],"o":"","f":"NEGRI"},"2027-5":{"id":"2027-5","y":2027,"n":"5","p":1,"t":"T06","s":"What hepatitis infection causes tumors? [set c]","c":[{"l":"A","x":"Hepatitis A","r":"Hepatitis A is a picornavirus spread by the fecal-oral route. It causes acute self-limited hepatitis with no chronic carrier state, so it does not lead to tumors."},{"l":"B","x":"Hepatitis B","r":"Hepatitis B causes chronic infection, especially when acquired in infancy, and is a major factor in cirrhosis and hepatocellular carcinoma, which appears many years after primary infection."},{"l":"C","x":"Hepatitis D","r":"Hepatitis D is a defective satellite RNA virus that replicates only with hepatitis B as helper. Coinfection raises the risk of fulminant hepatitis. It is not the keyed tumor virus here."},{"l":"D","x":"Hepatitis E","r":"Hepatitis E belongs to Hepeviridae, a naked positive-sense RNA family. Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q70. The lecture adds that hepatitis C is also a cause of hepatocellular carcinoma."],"o":"","f":"HBVHCC"},"2027-7":{"id":"2027-7","y":2027,"n":"7","p":2,"t":"T04","s":"Genetic reassortment is observed in the following virus: [set a]","c":[{"l":"A","x":"Influenza A","r":"Influenza A (Orthomyxoviridae) has a segmented negative-sense RNA genome of 8 segments. Co-infection of one cell by two strains allows genetic reassortment, the basis of antigenic shift and pandemics. The segmented families are remembered as BOAR: Bunya, Orthomyxo, Arena, Reo."},{"l":"B","x":"Parainfluenza Type 1","r":"Parainfluenza virus is a paramyxovirus with a non-segmented negative-sense RNA genome, so it cannot reassort. Types 1 and 2 cause croup."},{"l":"C","x":"Hepatitis B","r":"Hepatitis B (Hepadnaviridae) has a single partly double-stranded circular DNA genome, which is not segmented."},{"l":"D","x":"HPV","r":"HPV (Papillomaviridae) has a single circular dsDNA genome, which is not segmented."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q35."],"o":"","f":"SHIFT"},"2027-8":{"id":"2027-8","y":2027,"n":"8","p":2,"t":"T02","s":"Regular monitoring for patients with asymptomatic HPV 16 and 18 (Set A):","c":[{"l":"A","x":"Complete surgical removal of cervical tissue","r":"Excision is not indicated for an asymptomatic carrier without a lesion."},{"l":"B","x":"Regular pap smear and HPV testing","r":"HPV 16 and 18 are the high-risk types for cervical cancer. The Pap smear screens for HPV-associated dysplasia and cancer and must be done regularly whatever the vaccination status, with HPV typing confirmed by PCR."},{"l":"C","x":"Complete abstinence","r":"Genital HPV is sexually transmitted, but abstinence does not monitor an infection already present."},{"l":"D","x":"None of the above","r":"Incorrect because regular screening is the recommended approach."}],"k":"B","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","No rationale was printed for this item in the 2027 PDF. The rationales come from MCB 2.02."],"o":"","f":"HPV"},"2027-9":{"id":"2027-9","y":2027,"n":"9","p":2,"t":"T05","s":"A live attenuated vaccine is available for travelers to endemic countries for which disease? [Set C]","c":[{"l":"A","x":"Zika","r":"No vaccine is available. Prevention is mosquito control and avoiding exposure in pregnancy."},{"l":"B","x":"Yellow fever","r":"The live attenuated 17D vaccine is the most effective prevention for yellow fever. One dose gives about 95 percent seroconversion and protection for at least 30 years, and it is advised for travelers to and residents of endemic areas."},{"l":"C","x":"Chikungunya","r":"No vaccine per the 2027 rationale. Management is anti-inflammatory drugs for joint pain and vector control."},{"l":"D","x":"Ebola virus","r":"Per the 2027 rationale the rVSV-ZEBOV vaccine works against the Zaire strain, but it is not a traveler's live attenuated vaccine."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"YF"},"2027-11":{"id":"2027-11","y":2027,"n":"11","p":2,"t":"T02","s":"A 7-year-old patient was brought to the emergency department because of fever, malaise, and nasal congestion which was followed by a malar rash resembling a slapped-cheek appearance. Which of the following viruses is the cause of the above? (set A)","c":[{"l":"A","x":"Parvovirus B19","r":"Parvovirus B19 is a small naked single-stranded DNA virus. Its most common manifestation is erythema infectiosum (fifth disease), a biphasic rash that begins with intense malar erythema called slapped cheek, followed by a lacy maculopapular rash on the trunk and limbs."},{"l":"B","x":"Herpes Simplex Virus 1","r":"Primary symptomatic HSV-1 infection is gingivostomatitis, seen most often in children 1 to 5 years old. It involves the buccal and gingival mucosa with fever, sore throat, and vesicular and ulcerative lesions, and virus is shed in saliva."},{"l":"C","x":"Rubeola","r":"Rubeola (measles) gives fever, cough, coryza, conjunctivitis, and Koplik spots, then a maculopapular rash spreading from the head downward."},{"l":"D","x":"Varicella virus","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"B19SLAP"},"2027-12":{"id":"2027-12","y":2027,"n":"12","p":2,"t":"T05","s":"What is the most serious complication of Zika virus? (set C)","c":[{"l":"A","x":"Hemorrhagic fever","r":"Hemorrhagic fever is the severe form of dengue and yellow fever, not of Zika."},{"l":"B","x":"Meningoencephalitis","r":"Acute encephalitis is the disease of Japanese, West Nile, and St. Louis encephalitis viruses."},{"l":"C","x":"Congenital microcephaly","r":"Zika is an Aedes-borne flavivirus causing rash, fever, arthralgia, and nonpurulent conjunctivitis. Its most serious complication is congenital Zika syndrome, where infection of fetal neural progenitor cells causes microcephaly and other malformations. In adults it is associated with Guillain-Barre syndrome."},{"l":"D","x":"Guillain-Barre syndrome","r":"Guillain-Barre syndrome is a recognized neurologic association of Zika in adults, along with neuropathy and myelitis, but the lecture names congenital Zika syndrome as the most serious complication."}],"k":"C","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"ZIKA"},"2027-13":{"id":"2027-13","y":2027,"n":"13","p":2,"t":"T02","s":"A 23 year old woman came in for consultation because of fever, nasal discharge, sore throat, cough, and conjunctivitis occurring after attending a swimming party","c":[{"l":"A","x":"Adenovirus","r":"Adenovirus types 3 and 7 cause pharyngoconjunctival fever, also called swimming pool conjunctivitis. It occurs in outbreaks among people sharing swimming facilities and combines mild conjunctivitis with fever, sore throat, and respiratory symptoms."},{"l":"B","x":"EBV","r":"EBV (HHV-4) spreads through saliva, causes infectious mononucleosis, and is linked to Burkitt lymphoma and nasopharyngeal carcinoma."},{"l":"C","x":"Parvovirus","r":"Parvovirus B19 is a small naked single-stranded DNA virus. Its most common manifestation is erythema infectiosum (fifth disease), a biphasic rash that begins with intense malar erythema called slapped cheek, followed by a lacy maculopapular rash on the trunk and limbs."}],"k":"A","w":[],"i":["Only three choices were recalled."],"o":"","f":"ADPOOL"},"2027-14":{"id":"2027-14","y":2027,"n":"14","p":3,"t":"T07","s":"A 15-year-old girl came to the dermatology clinic complaining of scaly patches on the scalp and hair fluoresces under Wood’s Lamp. Examination showed spores outside the hair shaft. Her mother takes care of several Siamese Cats and two Spitz dogs. Which is the most likely etiologic agent? (Set B)","c":[{"l":"A","x":"Microsporum canis","r":"Microsporum canis is a zoophilic dermatophyte acquired from cats and dogs. It infects skin and hair, causing ectothrix tinea capitis whose hairs fluoresce green under Wood's lamp, and its colony is white and cottony with a deep yellow reverse."},{"l":"B","x":"Epidermophyton floccosum","r":"Epidermophyton floccosum is the only pathogenic species in its genus. It infects skin and nails but not hair, and produces club-shaped smooth-walled macroconidia in small clusters with no microconidia. Since it never infects hair, it cannot cause tinea capitis."},{"l":"C","x":"Trichophyton rubrum","r":"Trichophyton rubrum infects skin, hair, and nails. Its colony has a white cottony surface with a deep red nondiffusible pigment on the reverse side."},{"l":"D","x":"Trichophyton tonsurans","r":"Trichophyton tonsurans is an anthropophilic cause of tinea capitis that gives endothrix infection, with spores inside the hair shaft. Its hairs do not fluoresce under Wood's lamp."}],"k":"A","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q77, and probably as the stemless Q52."],"o":"","f":"MCANIS"},"2027-16":{"id":"2027-16","y":2027,"n":"16","p":3,"t":"T05","s":"What is the primary mode of transmission of Filoviruses? (Set C)","c":[{"l":"A","x":"Airborne","r":"Airborne spread by droplet nuclei is the route of tuberculosis, measles, and varicella, not filoviruses."},{"l":"B","x":"Contact of bodily fluids","r":"Filoviruses (Ebola and Marburg) are transmitted by direct contact with blood or body fluids. Fruit bats are the natural hosts, and the viruses cause hemorrhagic fever with high mortality."},{"l":"C","x":"Fecal-oral","r":"The fecal-oral route belongs to enteric viruses such as poliovirus, hepatitis A, rotavirus, and norovirus."},{"l":"D","x":"Vector-borne","r":"Filoviruses are grouped with the non-arthropod viruses in the lecture. No arthropod vector takes part."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","No rationale was printed for this item. Asked again in this paper as Q113."],"o":"","f":"FILO"},"2027-20":{"id":"2027-20","y":2027,"n":"20","p":3,"t":"T10","s":"What is the most common clinical manifestation of avian influenza in humans?","c":[{"l":"A","x":"dermatologic","r":"Skin disease is not a feature of avian influenza."},{"l":"B","x":"hemorrhagic","r":"Hemorrhagic illness belongs to filoviruses, dengue, and yellow fever."},{"l":"C","x":"Neurologic","r":"Avian influenza primarily affects the pulmonary system, not the CNS."},{"l":"D","x":"respiratory","r":"Avian influenza A such as H5N1 primarily infects birds and only occasionally reaches humans through contact with poultry. H5N1 binds receptors in the lower respiratory tract, which explains severe pneumonia, a case fatality near 59 percent, and limited person-to-person spread. Patients present with cough, fever, sore throat, difficulty of breathing, and pneumonia."}],"k":"D","w":[],"i":[],"o":"","f":"AVIAN"},"2027-21":{"id":"2027-21","y":2027,"n":"21","p":3,"t":"T10","s":"Which of the following factors contribute to the increasing emergence and re-emergence of infectious diseases [set C]","c":[{"l":"A","x":"Population growth and urbanization","r":"Population growth is a human behavior factor and urbanization a physical and environmental factor. Both give microbes access to new populations."},{"l":"B","x":"Increased trade and travel","r":"International travel and commerce are human behavior factors that move microbes quickly to new geographic areas."},{"l":"C","x":"Deforestation and habitat destruction","r":"These are physical and environmental factors that bring humans into contact with animal reservoirs."},{"l":"D","x":"All of the above","r":"The lecture groups contributing factors as human behavior (international travel and commerce, population growth), physical and environmental factors (urban development, deforestation, environmental degradation), and genetic or biologic factors such as microbial adaptation."}],"k":"D","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q98."],"o":""},"2027-22":{"id":"2027-22","y":2027,"n":"22","p":3,"t":"T08","s":"Male AIDS patient presented with difficulty breathing for weeks. Physical exam showed clear breath sounds but chest x-ray presented with bilateral ground glass opacities. Microscopy of sputum showed cysts and trophozoites. Which of the following fungi is the most likely etiologic agent.[Set B]","c":[{"l":"A","x":"C. Neoformans","r":"Cryptococcus neoformans is an encapsulated yeast with a large polysaccharide capsule that shows as a clear halo on India ink. It causes chronic meningitis, mainly in immunocompromised hosts."},{"l":"B","x":"A. Fumigatus","r":"Aspergillus fumigatus is a mold with septate hyphae branching at acute angles. It causes allergic disease, a fungus ball in existing cavities, or invasive disease."},{"l":"C","x":"Rhizopus Oryzae","r":"Rhizopus oryzae causes mucormycosis, with broad non-septate hyphae that invade vessels and produce black necrotic tissue, classically in diabetics."},{"l":"D","x":"P. Jirovecii","r":"Pneumocystis jirovecii was once thought to be a protozoan and is now classified as a fungus. It is an extracellular pathogen with thin-walled trophozoites and thick-walled cysts holding four to eight nuclei, and it causes pneumonia with bilateral ground-glass opacities in immunocompromised patients, especially those with AIDS."}],"k":"D","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"PJP"},"2027-24":{"id":"2027-24","y":2027,"n":"24","p":4,"t":"T02","s":"Dna virus that has cellular multiplication in the cytoplasm. (SET A)","c":[{"l":"A","x":"Adenovirus","r":"Adenoviridae are naked icosahedral viruses with linear dsDNA. Uncoating begins in the cytoplasm but replication is completed in the nucleus of epithelial cells."},{"l":"B","x":"Herpesvirus","r":"Herpesviruses replicate in the nucleus and bud from the nuclear membrane."},{"l":"C","x":"Poxvirus","r":"Poxviridae are large brick-shaped dsDNA viruses with complex symmetry. Their entire multiplication cycle takes place in the cytoplasm because the virion supplies its own enzymes, including a DNA-dependent RNA polymerase. They are the exception to the rule that DNA viruses replicate in the nucleus."},{"l":"D","x":"Papillomavirus","r":"Papillomaviridae are naked icosahedral viruses with circular dsDNA that replicate in the nucleus. They infect surface epithelium, causing warts and, with high-risk types 16 and 18, cancer, but they do not show latency with reactivation."}],"k":"C","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","No rationale was printed for this item."],"o":"","f":"POX"},"2027-25":{"id":"2027-25","y":2027,"n":"25","p":4,"t":"T02","s":"Which of the following indicates that the Hepatitis infection is becoming chronic (SET A)","c":[{"l":"A","x":"(+) HBsAg beyond 6 months and (-) AntiHB","r":"Continued presence of HBsAg beyond 6 months with absence of anti-HBs indicates that the infection has become chronic."},{"l":"B","x":"(-) HBsAg beyond 3 months and (-) AntiHB","r":"All markers negative means no infection and susceptibility to hepatitis B."},{"l":"C","x":"(-) HBsAg beyond 6 months and (+) AntiHB","r":"HBsAg cleared with anti-HBs present means recovery, past cleared infection, or vaccination, and indicates immunity."},{"l":"D","x":"(+) HBsAg within first month and (-) AntiHB","r":"HBsAg is the first marker of infection and anti-HBs does not appear until convalescence, so this is acute infection."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","The 2027 PDF numbers two consecutive rows as 25. This is the first one. The second is a blank placeholder. Asked again in this paper as Q85."],"o":"","f":"HBVCHR"},"2027-26":{"id":"2027-26","y":2027,"n":"26","p":4,"t":"T03","s":"A 30-year-old male suffered the effects of a previous childhood illness when he was 4 years old characterized by high grade fever, headache for a few days followed by flaccid paralysis and muscle atrophy of the left lower extremities. Which is the most likely causative agent of this disease? [SET A]","c":[{"l":"A","x":"Poliovirus","r":"Poliovirus is a naked picornavirus spread by the fecal-oral route. It multiplies in the tonsils and Peyer's patches, and in a minority of cases reaches anterior horn cells and motor neurons of the spinal cord and brainstem. Their destruction gives asymmetric acute flaccid paralysis, and muscle atrophy can progress decades later as post-poliomyelitis syndrome."},{"l":"B","x":"Parechovirus","r":"Parechoviruses, formerly echoviruses 22 and 23, infect young children. Per the exam rationales they cause gastrointestinal and respiratory illness, meningitis, febrile rash illness, and a sepsis-like picture in neonates."},{"l":"C","x":"Clostridium botulinum","r":"Clostridium botulinum is a gram-positive bacterium whose toxin causes botulism. It is not a childhood febrile viral illness with residual asymmetric limb atrophy."},{"l":"D","x":"Coxsackievirus","r":"Coxsackieviruses are enteroviruses. Group A causes herpangina, hand-foot-and-mouth disease, and acute hemorrhagic conjunctivitis. Group B causes pleurodynia, myocarditis, and pericarditis."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"POLIO"},"2027-28":{"id":"2027-28","y":2027,"n":"28","p":4,"t":"T03","s":"Which of the following best describes the pathophysiologic consequence of poliovirus in motor neurons? [SET A]","c":[{"l":"A","x":"Increases neurotransmitters resulting in hyperactivity","r":"Poliovirus does not cause neuronal overactivity. The deficit is loss of lower motor neurons."},{"l":"B","x":"CHOICE","r":"This choice was not recalled in the source."},{"l":"C","x":"Destruction of motor neurons that lead to flaccid paralysis","r":"Poliovirus is a naked picornavirus spread by the fecal-oral route. It multiplies in the tonsils and Peyer's patches, and in a minority of cases reaches anterior horn cells and motor neurons of the spinal cord and brainstem. Their destruction gives asymmetric acute flaccid paralysis, and muscle atrophy can progress decades later as post-poliomyelitis syndrome."},{"l":"D","x":"CHOICE","r":"This choice was not recalled in the source."}],"k":"C","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","Choices B and D are unrecalled placeholders in the 2027 PDF. The complete Set C version is Q103."],"o":"","f":"POLIO"},"2027-29":{"id":"2027-29","y":2027,"n":"29","p":4,"t":"T08","s":"What is the probable etiologic agent if the vaginal discharge is creamy and white in appearance and multiple gram positive budding yeast? Set B","c":[{"l":"A","x":"Trichomonas Vaginalis","r":"Per the 2027 rationale, Trichomonas vaginalis gives a frothy yellow-green discharge. It is a protozoan, not a yeast."},{"l":"B","x":"Neisseria Gonorrhoeae","r":"Per the 2027 rationale, Neisseria gonorrhoeae is a gram-negative bacterium that gives a purulent discharge."},{"l":"C","x":"Candida Albicans","r":"Candida albicans is a yeast that forms budding cells, pseudohyphae, and true hyphae. Vulvovaginal candidiasis gives irritation, pruritus, and a creamy white discharge, with diabetes, pregnancy, and antibacterial drugs as risk factors. C. albicans is identified by germ tube production."},{"l":"D","x":"Gardnerella Vaginalis","r":"Per the 2027 rationale, Gardnerella vaginalis is associated with bacterial vaginosis, a thin gray discharge with a fishy odor and no yeast forms."}],"k":"C","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q92. The non-Candida choices are outside the MCB LEC set, so their rationales rest on the 2027 exam rationale."],"o":"","f":"CANDIDA"},"2027-31":{"id":"2027-31","y":2027,"n":"31","p":5,"t":"T03","s":"A 9-year-old male develops a rash with vesicles on his palms and soles, along with oral ulcers. He has no significant past medical history. What is the most likely diagnosis? Set A","c":[{"l":"A","x":"Hand-foot-and-mouth disease","r":"Hand-foot-and-mouth disease is caused mainly by coxsackie A virus, with enterovirus 71 linked to severe outbreaks. Children in schools and daycares develop oral ulcers with a vesicular rash on the palms and soles."},{"l":"B","x":"Herpes simplex virus","r":"HSV-1 causes clustered vesicles around the mouth, lips, and buccal mucosa. It does not typically involve the palms and soles."},{"l":"C","x":"Measles","r":"Measles gives a maculopapular, not vesicular, rash that starts on the head and spreads downward, with Koplik spots in the mouth."},{"l":"D","x":"Chickenpox","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption. The rash is generalized rather than limited to palms, soles, and mouth."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q58."],"o":"","f":"COXA"},"2027-32":{"id":"2027-32","y":2027,"n":"32","p":5,"t":"T08","s":"What is the only systemic fungi that is inside a histiocyte with 1-2 um in diameter? Set B","c":[{"l":"A","x":"Cryptococcus neoformans","r":"Cryptococcus neoformans is an encapsulated yeast with a large polysaccharide capsule that shows as a clear halo on India ink. It causes chronic meningitis, mainly in immunocompromised hosts. In tissue it is a budding yeast of about 5 to 10 micrometers without hyphae."},{"l":"B","x":"Mucor mucedo","r":"Mucor and Rhizopus, the agents of mucormycosis, show broad, ribbon-like, non-septate hyphae branching at right angles, and they invade blood vessels."},{"l":"C","x":"Coccidioides immitis","r":"Coccidioides immitis grows as a mold with chains of arthroconidia separated by disjunctor cells at 25 to 30°C. In tissue at 37°C it forms large thick-walled spherules up to about 80 micrometers filled with endospores."},{"l":"D","x":"Histoplasma capsulatum","r":"Histoplasma capsulatum is a thermally dimorphic systemic fungus. The mold form shows large tuberculate macroconidia of 8 to 16 micrometers with small microconidia, and the 37°C form is a small oval yeast that grows inside macrophages and reticuloendothelial cells."}],"k":"D","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","The stem gives the yeast size as 1 to 2 micrometers. MCB 2.08 gives 2 to 4 micrometers for the intracellular yeast."],"o":"","f":"DIMORPH"},"2027-33":{"id":"2027-33","y":2027,"n":"33","p":5,"t":"T01","s":"Which of the following structure is a carbohydrate protein complex project to the surface of the enveloped virus and involved in the specific binding receptor of the host cell membrane Set A","c":[{"l":"A","x":"capsid","r":"The capsid is the protein coat enclosing the genome, with icosahedral, helical, or complex symmetry."},{"l":"B","x":"capsomere","r":"Capsomeres are the finite number of protein subunits that make up the capsid."},{"l":"C","x":"Spike","r":"Spikes are glycoproteins protruding from the viral surface or envelope, such as gp120 of HIV or influenza hemagglutinin. They bind specific host cell receptors to allow entry, and they determine tropism."},{"l":"D","x":"Nucleic acid","r":"The nucleic acid is the genome, either DNA or RNA, carried inside the capsid."}],"k":"C","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-34":{"id":"2027-34","y":2027,"n":"34","p":5,"t":"T03","s":"Which of the following is an effective preventive measure against Rotavirus? Set A","c":[{"l":"A","x":"Needle-prick precaution","r":"Needlestick precautions prevent blood-borne infections such as hepatitis B. Rotavirus is not blood-borne."},{"l":"B","x":"Social distancing","r":"Distancing reduces respiratory droplet spread. Rotavirus spreads by the fecal-oral route."},{"l":"C","x":"Wearing of face masks","r":"Masks interrupt respiratory transmission, not fecal-oral spread."},{"l":"D","x":"Hand hygiene","r":"Rotavirus spreads by the fecal-oral route and nosocomial spread is common, so handwashing with soap, safe water, and sanitation prevent it. In the hospital it needs contact precautions with soap and water."}],"k":"D","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","The live attenuated oral vaccine, which the lecture calls the best control strategy worldwide, is not among these choices. The 2025 version of this question offered it and keyed it."],"o":"","f":"ROTAPREV"},"2027-35":{"id":"2027-35","y":2027,"n":"35","p":5,"t":"T04","s":"Genetic Reassortment is observed in segmented viruses like: [SET C]","c":[{"l":"A","x":"INFLUENZA A","r":"Influenza A (Orthomyxoviridae) has a segmented negative-sense RNA genome of 8 segments. Co-infection of one cell by two strains allows genetic reassortment, the basis of antigenic shift and pandemics. The segmented families are remembered as BOAR: Bunya, Orthomyxo, Arena, Reo."},{"l":"B","x":"PARAINFLUENZA TYPE 1","r":"Parainfluenza virus is a paramyxovirus with a non-segmented negative-sense RNA genome, so it cannot reassort. Types 1 and 2 cause croup."},{"l":"C","x":"HEPATITIS B","r":"Hepadnaviridae carry a single circular, partly double-stranded DNA genome, which is not segmented."},{"l":"D","x":"HPV 6","r":"Papillomaviridae carry a single circular dsDNA genome. HPV 6 causes anogenital warts."}],"k":"A","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"SHIFT"},"2027-37":{"id":"2027-37","y":2027,"n":"37","p":6,"t":"T03","s":"What is the major cause of epidemic viral gastroenteritis in adults, particularly travelers? (set C)","c":[{"l":"A","x":"Rotavirus","r":"Rotavirus (Reoviridae) is a naked virus with a segmented double-stranded RNA genome. It is the leading cause of gastroenteritis in children under 5, with watery diarrhea, vomiting, fever, and dehydration, and is often mild in adults."},{"l":"B","x":"Norwalk virus","r":"Norwalk virus (norovirus, Caliciviridae) is the major cause of epidemic viral gastroenteritis in adults, with outbreaks on cruise ships and in schools and camps. Illness has rapid onset and recovery, RT-PCR is the gold standard test, there is no vaccine, and prevention is rigorous handwashing."},{"l":"C","x":"Polio virus","r":"Poliovirus causes poliomyelitis, not epidemic gastroenteritis, even though it enters through the gut."},{"l":"D","x":"Coxsackievirus","r":"Coxsackieviruses are enteroviruses. Group A causes herpangina, hand-foot-and-mouth disease, and acute hemorrhagic conjunctivitis. Group B causes pleurodynia, myocarditis, and pericarditis."}],"k":"B","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q110."],"o":"","f":"NORO"},"2027-38":{"id":"2027-38","y":2027,"n":"38","p":6,"t":"T09","s":"Which of the following is part of the Transient flora (vs Habitual flora) of the skin? [Set B]","c":[{"l":"A","x":"Escherichia coli","r":"Transient flora are contaminating, non-colonizing organisms picked up from patients, equipment, or the environment. They sit loosely on superficial skin and are removed by handwashing or alcohol rub. E. coli and other gram-negatives, MRSA, VRE, and C. difficile belong here."},{"l":"B","x":"Coagulase negative staphylococcus","r":"Coagulase-negative staphylococci, chiefly S. epidermidis, are resident flora living in deeper skin structures that routine handwashing does not remove."},{"l":"C","x":"Diphtheroid","r":"Diphtheroids (corynebacteria) are resident skin flora."},{"l":"D","x":"Propionibacterium","r":"Cutibacterium (Propionibacterium) acnes is resident flora of hair follicles and sebaceous glands."}],"k":"A","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-40":{"id":"2027-40","y":2027,"n":"40","p":6,"t":"T06","s":"Which virus is associated with subacute sclerosing panencephalitis [Set A]","c":[{"l":"A","x":"Measles","r":"Subacute sclerosing panencephalitis is a rare late complication of measles (rubeola) infection. It presents with personality change and poor school performance, then progressive intellectual decline, myoclonus, seizures, and finally an unresponsive spastic state."},{"l":"B","x":"Mumps","r":"Mumps causes parotitis, with orchitis, mastitis, and CNS involvement such as aseptic meningitis as complications."},{"l":"C","x":"Rubella","r":"Postnatal rubella is a mild illness with malaise, low-grade fever, and a morbilliform rash. Its serious form is congenital rubella syndrome."},{"l":"D","x":"Polyomaviruses","r":"Polyomaviruses include JC virus, the cause of PML, BK virus, and Merkel cell virus."}],"k":"A","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"SSPE"},"2027-42":{"id":"2027-42","y":2027,"n":"42","p":6,"t":"T09","s":"When caring for a patient with a suspected case of Neisseria meningitidis, what is the minimum appropriate infection control precaution? [Set B]","c":[{"l":"A","x":"Standard precaution only","r":"Standard precautions apply to every patient at every encounter regardless of diagnosis. Their elements are hand hygiene, PPE as indicated, respiratory hygiene and cough etiquette, safe injection practices, and proper handling of equipment and textiles. They are the base layer but are not sufficient for meningococcus."},{"l":"B","x":"Droplet precaution","r":"Droplet precautions are for organisms carried in large respiratory droplets over 5 micrometers that travel only 1 to 2 meters. A surgical mask on room entry and hand hygiene suffice, with no negative pressure and no respirator. Indications include influenza, Bordetella pertussis, Neisseria meningitidis, invasive H. influenzae type b, group A streptococcus, Mycoplasma pneumoniae, adenovirus, and rhinovirus."},{"l":"C","x":"Airborne precaution","r":"Airborne precautions are for organisms carried in droplet nuclei of 5 micrometers or less that stay suspended and travel on air currents. They need a negative-pressure isolation room and a fit-tested N95 respirator. Indications are Mycobacterium tuberculosis, measles, varicella, disseminated zoster, and smallpox."},{"l":"D","x":"Contact precaution","r":"Contact precautions are for organisms spread by direct or indirect contact with the patient or the environment. They use a single room or cohorting with gown and gloves on entry. Indications include MRSA, C. difficile, norovirus, rotavirus, RSV, resistant Enterobacterales, Acinetobacter, and Candida auris."}],"k":"B","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","Asked again in this paper as Q115 with the choices reordered."],"o":"","f":"DROPLET"},"2027-43":{"id":"2027-43","y":2027,"n":"43","p":6,"t":"T04","s":"What type of vaccine is MMR?","c":[{"l":"A","x":"Killed virus","r":"A killed vaccine contains inactivated virus, as in injected polio vaccine (Salk) and the rabies vaccines."},{"l":"B","x":"Toxoid","r":"A toxoid is an inactivated toxin, as used for tetanus and diphtheria."},{"l":"C","x":"Immunoglobulin","r":"Immunoglobulin is passive immunization with preformed antibody, such as varicella-zoster immunoglobulin or HBIg."},{"l":"D","x":"Attenuated live virus","r":"MMR contains live attenuated strains of measles, mumps, and rubella. Each replicates to give a mild, noncommunicable infection that builds strong immune memory."}],"k":"D","w":[],"i":["This is review item 3 of MCB 2.04."],"o":""},"2027-44":{"id":"2027-44","y":2027,"n":"44","p":7,"t":"T02","s":"Latent, persistent, and remittent reactivation is a characteristic of this group of viruses?","c":[{"l":"A","x":"Orthomyxovirus","r":"Influenza causes acute infection with host cell death and no latency."},{"l":"B","x":"Paramyxovirus","r":"Paramyxoviruses such as measles, mumps, RSV, and parainfluenza cause acute infections marked by syncytium formation."},{"l":"C","x":"Papovavirus","r":"Papilloma and polyoma viruses persist, but the lecture's defining latent-and-reactivating family is the herpesviruses."},{"l":"D","x":"Herpesvirus","r":"Herpesviridae are enveloped icosahedral dsDNA viruses defined by lifelong latent infection with periodic reactivation, most often in the elderly and immunosuppressed. HSV lies latent in sensory ganglia, and some members cause cancer."}],"k":"D","w":[],"i":["No rationale was printed for this item."],"o":""},"2027-45":{"id":"2027-45","y":2027,"n":"45","p":7,"t":"T09","s":"Assuming the patient has Measles. What precaution should you prioritize? [SET C]","c":[{"l":"A","x":"Wearing N95 Mask","r":"Measles spreads in droplet nuclei and needs airborne precautions, meaning a negative-pressure room and a fit-tested N95 respirator."},{"l":"B","x":"Wearing Gloves","r":"Gloves are worn for contact with skin, mucous membranes, blood, and body fluids, and are central to contact precautions for MRSA or C. difficile."},{"l":"C","x":"Wearing Gown","r":"Gowns are worn when exposure to body fluids or secretions is likely, and on entry for contact precautions."},{"l":"D","x":"Hand Hygiene","r":"Hand hygiene is the most important part of standard precautions for every patient, but alone it does not stop an airborne pathogen."}],"k":"A","w":[],"i":["This item is labelled Set C in the 2027 recall, which was assembled from several exam sets.","The printed 2027 rationale lists meningitis among N95 indications. MCB 2.09 places N. meningitidis under droplet precautions with a surgical mask."],"o":"","f":"AIRBORNE"},"2027-48":{"id":"2027-48","y":2027,"n":"48","p":7,"t":"T01","s":"(SET B)Marks the derangement of cell function leading to cell lysis and cell death","c":[{"l":"A","x":"Eclipse Period","r":"Phase 2 of the viral growth curve. No virus is detectable inside the cell while viral components are being synthesized."},{"l":"B","x":"Exponential Period","r":"Phase 3, the rise period. Progeny virus increases exponentially for 8 to 72 hours."},{"l":"C","x":"Latent Period","r":"Phase 4. No further increase in virus yield occurs, a plateau of 100 to 10,000 virions per cell."},{"l":"D","x":"Cytoplasmic Effect","r":"Phase 5. It marks derangement of cell function with changes in cell size and shape, leading to lysis and death of the host cell, the cytopathic effect."}],"k":"D","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"GROWTH"},"2027-49":{"id":"2027-49","y":2027,"n":"49","p":7,"t":"T02","s":"What type of vaccine is the smallpox vaccine","c":[{"l":"A","x":"Live attenuated, variola vaccine","r":"The vaccine does not contain variola, the agent of smallpox."},{"l":"B","x":"Killed","r":"The vaccine virus is live, not inactivated."},{"l":"C","x":"Non-infectious subunit","r":"A subunit vaccine carries only viral proteins, as the HPV vaccine does with its virus-like particles."},{"l":"D","x":"Vaccinia","r":"Vaccinia virus, a related live orthopoxvirus, is the agent used for smallpox vaccination. It is protective if given within 3 days of exposure."}],"k":"D","w":["Extraction note: a fragment of a different Set B question is printed inside this cell of the 2027 PDF: 'Which genomic reassortment is observed in segmented viruses (?) A. Parainfluenza 1 B. Influenza type a C. HHV6'. It has no key of its own and duplicates Q7 and Q35."],"i":[],"o":"","f":"SMALLPOX"},"2027-50":{"id":"2027-50","y":2027,"n":"50","p":7,"t":"T02","s":"Which DNA Virus is not icosahedral in shape and replicates in the cytoplasm","c":[{"l":"A","x":"Poxviridae","r":"Poxviridae are large brick-shaped dsDNA viruses with complex symmetry. Their entire multiplication cycle takes place in the cytoplasm because the virion supplies its own enzymes, including a DNA-dependent RNA polymerase. They are the exception to the rule that DNA viruses replicate in the nucleus."},{"l":"B","x":"Adenoviridae","r":"Adenoviridae are naked icosahedral viruses with linear dsDNA. Uncoating begins in the cytoplasm but replication is completed in the nucleus of epithelial cells."},{"l":"C","x":"Parvoviridae","r":"Parvoviridae are the smallest DNA viruses, naked and icosahedral with linear single-stranded DNA. They replicate in the nucleus and need a host cell in S phase."},{"l":"D","x":"Hepadnaviridae","r":"Hepadnaviridae (hepatitis B) are enveloped icosahedral viruses with circular partly double-stranded DNA. They replicate via the nucleus and are the DNA family that uses reverse transcriptase."}],"k":"A","w":[],"i":[],"o":"","f":"POX"},"2027-51":{"id":"2027-51","y":2027,"n":"51","p":7,"t":"T07","s":"SET B. Which fungal infection presents as raised, cauliflower-like lesion, with sclerotic bodies in a tissue specimen?","c":[{"l":"A","x":"Sporotrichosis","r":"Sporotrichosis gives a nodule that ulcerates and spreads along lymphatics in the lymphocutaneous type, or a single lesion in the fixed type. Tissue shows cigar-shaped yeast and asteroid bodies."},{"l":"B","x":"Chromomycosis","r":"Chromoblastomycosis is a chronic subcutaneous infection by pigmented (dematiaceous) fungi that produces slowly progressive verrucous, cauliflower-like lesions, usually on the leg. The diagnostic tissue finding is the brown muriform or sclerotic body, also called the copper penny body."},{"l":"C","x":"Candidiasis","r":"Candida shows budding cells, pseudohyphae, and true hyphae, and grows as soft cream-colored colonies."},{"l":"D","x":"Actinomycetoma","r":"Actinomycetoma is the form of mycetoma caused by filamentous gram-positive bacteria, with draining sinuses and granules."}],"k":"B","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"CHROMO"},"2027-52":{"id":"2027-52","y":2027,"n":"52","p":8,"t":"T07","s":"SET C","c":[{"l":"A","x":"M. canis","r":"Microsporum canis is a zoophilic dermatophyte acquired from cats and dogs. It infects skin and hair, causing ectothrix tinea capitis whose hairs fluoresce green under Wood's lamp, and its colony is white and cottony with a deep yellow reverse."},{"l":"B","x":"T. tonsurans","r":"Trichophyton tonsurans causes endothrix tinea capitis whose hairs do not fluoresce under Wood's lamp."},{"l":"C","x":"T. mentagrophytes","r":"Trichophyton mentagrophytes infects skin, hair, and nails and shows grape-like clusters of spherical microconidia."},{"l":"D","x":"E. floccosum","r":"Epidermophyton floccosum is the only pathogenic species in its genus. It infects skin and nails but not hair, and produces club-shaped smooth-walled macroconidia in small clusters with no microconidia."}],"k":"A","w":["Incomplete in source: only the set label, the choices, and key A were recalled. The stem is missing. The choices and key match the tinea capitis vignette of Q14 and Q77."],"i":[],"o":"","f":"MCANIS"},"2027-53":{"id":"2027-53","y":2027,"n":"53","p":8,"t":"T04","s":"SET A Which of the following is diagnostic of congenital rubella?","c":[{"l":"A","x":"Presence of serum IgM in mother","r":"Maternal IgM shows recent infection of the mother, not of the fetus."},{"l":"B","x":"Presence of serum IgM in fetus","r":"Maternal IgM cannot cross the placenta, so rubella-specific IgM in the infant must have been made by the infant in utero. That is diagnostic of congenital rubella."},{"l":"C","x":"Presence of serum IgG in mother on the 1st trimester of pregnancy","r":"Maternal IgG reflects past infection or vaccination of the mother."},{"l":"D","x":"Presence of serum IgG in fetus on the 3rd trimester of pregnancy","r":"IgG crosses the placenta, so fetal IgG may simply be maternal antibody."}],"k":"B","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","This is review item 13 of MCB 2.04."],"o":"","f":"CRS"},"2027-54":{"id":"2027-54","y":2027,"n":"54","p":8,"t":"T03","s":"[SET A] Where does Poliovirus multiplies","c":[{"l":"A","x":"Stomach","r":"Poliovirus is acid stable and survives the stomach, but it does not replicate there."},{"l":"B","x":"Appendix","r":"Not a named site of poliovirus replication."},{"l":"C","x":"Liver","r":"The liver is the replication site of hepatitis A virus, the hepatovirus among picornaviruses."},{"l":"D","x":"Tonsil and small intestine","r":"Initial replication occurs in the pharynx (tonsils) and the distal small bowel, especially Peyer's patches, before spread to lymph nodes and blood."}],"k":"D","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":""},"2027-55":{"id":"2027-55","y":2027,"n":"55","p":8,"t":"T03","s":"B What is the pathophysiology of poliovirus?","c":[],"k":"X","w":["Incomplete in source: only this stem was recalled, with no choices and no key. See Q28 and Q103 for the complete versions."],"i":[],"o":""},"2027-58":{"id":"2027-58","y":2027,"n":"58","p":8,"t":"T03","s":"A 9yo male developed a vesicular rash in his palms and sole of his foot, together with ulcers in the mouth. He has no significant past medical history. What was the disease?","c":[{"l":"A","x":"Hand-foot-mouth Disease","r":"Hand-foot-and-mouth disease is caused mainly by coxsackie A virus, with enterovirus 71 linked to severe outbreaks. Children in schools and daycares develop oral ulcers with a vesicular rash on the palms and soles."},{"l":"B","x":"Herpes Simplex","r":"HSV usually causes clustered vesicles near the mouth or genitals."},{"l":"C","x":"Measles","r":"Measles presents with a maculopapular rash and respiratory symptoms."}],"k":"A","w":[],"i":["Only three choices were recalled."],"o":"","f":"COXA"},"2027-59":{"id":"2027-59","y":2027,"n":"59","p":9,"t":"T08","s":"[SET A] A pregnant woman complaining of itchiness, burning sensation in her vagina with thin, white, chalky discharge. Gran staim showed yeast with paeudohyphae. What test will help you in your diagnosis?","c":[{"l":"A","x":"Gram stain showing encapsulated yeast cells","r":"Encapsulated yeast describes Cryptococcus, shown by India ink."},{"l":"B","x":"culture in Sabaurads agar showing white mycelia with aerial conidia","r":"Aerial mycelia with conidia describe a mold. Candida grows as soft cream-colored yeast colonies."},{"l":"C","x":"Request for germ tube test of the culture","r":"Candida albicans is identified by production of germ tubes, true hyphae that are thinner and more uniform than pseudohyphae, after incubation in serum at 37°C for 60 to 90 minutes."},{"l":"D","x":"Gram stain using Giemsa and shoe dichotomous septate hyphae","r":"Dichotomously branching septate hyphae describe Aspergillus."}],"k":"X","w":["No key was printed for this item in the 2027 PDF (the key cell shows X). The content of MCB 2.08 supports choice C, the germ tube test."],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets."],"o":"","f":"CANDIDA"},"2027-62":{"id":"2027-62","y":2027,"n":"62","p":9,"t":"T05","s":"Which cells are the target of ebola and marburg virus (SET A)","c":[{"l":"A","x":"B cell","r":"B cells are the latency site of Epstein-Barr virus, not a filovirus target."},{"l":"B","x":"Macrophage and dendritic cell","r":"Filoviruses have tropism for cells of the macrophage system, dendritic cells, and interstitial cells."},{"l":"C","x":"Cd4 and cd8 t cell","r":"CD4 T cells are the target of HIV, which binds CD4 with a CCR5 or CXCR4 coreceptor."},{"l":"D","x":"Neutrophil and basophil","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"B","w":[],"i":["This item is labelled Set A in the 2027 recall, which was assembled from several exam sets.","No rationale was printed for this item."],"o":"","f":"FILO"},"2027-63":{"id":"2027-63","y":2027,"n":"63","p":9,"t":"UNC","s":"An outbreak of hepatitis in a third world country was characterized by incidence of fulminant hepatitis, with a high mortality rate of 20%. What is the virus being characterized? (set B)","c":[{"l":"A","x":"Hepatitis A","r":"Hepatitis A is a fecal-oral picornavirus causing acute self-limited hepatitis. Fulminant cases are rare and there is no chronic carrier state."},{"l":"B","x":"Hepatitis B","r":"Hepatitis B is parenterally and sexually transmitted. Fulminant necrosis occurs in only 1 to 2 percent of jaundiced patients and is more common with hepatitis D coinfection."},{"l":"C","x":"Hepatitis C","r":"Hepatitis C is an RNA tumor virus that causes chronic infection and hepatocellular carcinoma rather than acute outbreaks."},{"l":"D","x":"Hepatitis E","r":"Per the 2027 rationale, hepatitis E is a leading cause of waterborne outbreaks in developing countries and is strongly associated with fulminant hepatitis, especially in pregnant women. The MCB lectures list Hepeviridae only as a naked positive-sense RNA family."}],"k":"D","w":[],"i":["This item is labelled Set B in the 2027 recall, which was assembled from several exam sets.","Filed as Uncategorized because hepatitis E is not taught in any of the ten MCB LEC files."],"o":""},"2027-64":{"id":"2027-64","y":2027,"n":"64","p":10,"t":"T05","s":"[SET A] Which is TRUE regarding the epidemiology of the Hantavirus Pulmonary Syndrome?","c":[{"l":"A","x":"The transmission is from human to human.","r":"Transmission is from rodent to human. Rodents carry lifelong infection and spread it horizontally among themselves."},{"l":"B","x":"The mode of transmiss
