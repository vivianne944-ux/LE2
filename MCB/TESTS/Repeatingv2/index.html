<script>
const DATA={"Q":{"2028-1":{"id":"2028-1","y":2028,"n":"1","p":1,"t":"T01","s":"Antigenic shift of influenza viruses is a major cause of pandemics. This occurs because:","c":[{"l":"A","x":"Of reassortment of RNA segments between different influenza viruses co-infecting a single cell.","r":"Antigenic shift is an abrupt change caused by genetic reassortment, where two influenza A strains such as a human and an avian or swine strain co-infect one cell and exchange genome segments. The new HA and NA subtype meets almost no existing immunity, which is why shift produces pandemics."},{"l":"B","x":"Of point mutations in the hemagglutinin gene in different influenza viruses","r":"Antigenic drift is a gradual change caused by point mutations in the HA and NA genes. The small amino acid changes alter key epitopes so existing antibodies fail to neutralize the newer virus, which drives seasonal epidemics rather than pandemics. This is the mechanism of drift, not shift."},{"l":"C","x":"The virus learns to evade immune system","r":"This is a general statement about immune evasion, which viruses achieve by changing surface antigens, hiding in a latent state, or suppressing immune responses. It names no mechanism, so it does not explain why shift happens."},{"l":"D","x":"The virus integrates into host genome and reactivates later","r":"This describes latency, a persistent pattern where viral genetic material stays in the host cell and is activated later, as with varicella-zoster dormant in nerve ganglia. Influenza does not establish latency."}],"k":"A","w":[],"i":[],"o":"","f":"SHIFT"},"2028-2":{"id":"2028-2","y":2028,"n":"2","p":1,"t":"T01","s":"Which best describes the structure of a virus?","c":[{"l":"a","x":"A prokaryotic cell with a cell wall and cytoplasm","r":"This describes bacteria, which are prokaryotic cells measuring about 1 to 10 micrometers. Viruses are not cells at all."},{"l":"b","x":"A cellular organism with DNA and RNA","r":"Viruses are acellular and carry either DNA or RNA as their genome, never the full cellular complement of both."},{"l":"c","x":"A parasitic single-celled organism with a cell wall and mitochondria","r":"Viruses have no organelles and no metabolic machinery. They lack genes for protein synthesis and energy production, which is why they are obligate intracellular parasites."},{"l":"d","x":"A noncellular organism with nucleic acid and protein coat","r":"A virion is an acellular particle made of a nucleic acid genome inside a protein capsid, with some viruses adding a host-derived lipid envelope."}],"k":"D","w":[],"i":[],"o":""},"2028-3":{"id":"2028-3","y":2028,"n":"3","p":1,"t":"T01","s":"What is the protein that surrounds a viral nucleic acid?","c":[{"l":"a","x":"Envelope","r":"The envelope is a phospholipid bilayer taken from the host cell membrane during budding, carrying viral glycoprotein spikes. It is lipid, not the protein coat around the genome."},{"l":"b","x":"Capsid","r":"The capsid is the protein coat that covers and protects the genome. It is built from capsomere subunits and shows icosahedral, helical, or complex symmetry."},{"l":"c","x":"Tegument","r":"The tegument is the protein layer lying between the capsid and the envelope in herpesviruses."},{"l":"d","x":"Nucleocaspid","r":"The nucleocapsid is the capsid together with the nucleic acid it encloses, so it is the combined structure rather than the protein alone."},{"l":"e","x":"Matrix","r":"Matrix protein sits between the envelope and the nucleocapsid and links the two. It may also have enzymatic or biologic functions related to infection."}],"k":"B","w":[],"i":[],"o":""},"2028-4":{"id":"2028-4","y":2028,"n":"4","p":2,"t":"T01","s":"Which condition can viral replication occur?","c":[{"l":"a","x":"At body temperature","r":"Temperature influences how fast a virus replicates, but temperature alone cannot support replication without a host cell."},{"l":"b","x":"In nutrient agar","r":"Nutrient agar supports bacterial growth. Viruses cannot grow on artificial media because they lack their own protein-synthesis and energy machinery."},{"l":"c","x":"Presence of antibiotics","r":"Antibiotics act on bacteria. Viruses are resistant to antibiotics and are instead inhibited by interferon and antiviral agents."},{"l":"d","x":"Presence of oxygen","r":"Viruses carry out no metabolism, so oxygen availability is irrelevant to their replication."},{"l":"e","x":"Inside the cell","r":"Viruses are obligate intracellular parasites that multiply only in living cells, using the host cell's energy, synthetic machinery, and precursors."}],"k":"E","w":[],"i":[],"o":""},"2028-5":{"id":"2028-5","y":2028,"n":"5","p":2,"t":"T01","s":"Which one of these RNA virus has one envelope","c":[{"l":"a","x":"Influenza","r":"Influenza is an enveloped, helical, segmented negative-sense RNA virus of Orthomyxoviridae, with HA and NA spikes on its envelope."},{"l":"b","x":"Papillovirus","r":"Papillomavirus is a naked icosahedral DNA virus with circular double-stranded DNA, so it is neither RNA nor enveloped."},{"l":"C","x":"Rotavirus","r":"Rotavirus is a naked icosahedral double-stranded RNA virus of Reoviridae, one of the four naked RNA families."},{"l":"d","x":"Poliovirus","r":"Poliovirus is a naked icosahedral positive-sense RNA virus of Picornaviridae. Being naked makes it resistant to ether and environmental factors."},{"l":"e","x":"Adenovirus","r":"Adenovirus is a naked icosahedral virus with linear double-stranded DNA."}],"k":"A","w":[],"i":["Memory aid from the lecture: the naked RNA families are Picornaviridae, Reoviridae, Caliciviridae, and Hepeviridae. The naked DNA families are Parvoviridae, Papillomaviridae, Polyomaviridae, and Adenoviridae."],"o":""},"2028-6":{"id":"2028-6","y":2028,"n":"6","p":2,"t":"T01","s":"Which enzyme is the most essential for the replication of retroviruses?","c":[{"l":"a","x":"DNA Polymerase","r":"DNA polymerase copies DNA from a DNA template. It is a host-cell replication enzyme and not the step that defines retroviruses."},{"l":"b","x":"Helicase","r":"Helicase unzips the DNA double helix during replication."},{"l":"c","x":"Ligase","r":"Ligase joins DNA fragments together."},{"l":"d","x":"Reverse Transcriptase","r":"Reverse transcriptase is the RNA-dependent DNA polymerase carried inside retroviral virions. It makes a DNA copy of the viral RNA, and that DNA copy then integrates into the host genome as a provirus. HIV and HTLV (Baltimore group VI) depend on it."},{"l":"e","x":"RNA Polymerase","r":"RNA polymerase copies a DNA sequence into RNA during transcription. Negative-sense RNA viruses such as influenza carry an RNA-dependent RNA polymerase for the same reason."}],"k":"D","w":[],"i":[],"o":"","f":"RETRO"},"2028-7":{"id":"2028-7","y":2028,"n":"7","p":2,"t":"T01","s":"Which of these viruses has double-stranded RNA as its genetic material?","c":[{"l":"a","x":"Influenza","r":"Influenza (Orthomyxoviridae) has a segmented, single-stranded negative-sense RNA genome, Baltimore group V."},{"l":"b","x":"Hepatitis B","r":"Hepatitis B (Hepadnaviridae) has partly double-stranded circular DNA and replicates through reverse transcriptase, Baltimore group VII."},{"l":"c","x":"Rhinovirus","r":"Rhinovirus is a picornavirus with single-stranded positive-sense RNA, Baltimore group IV."},{"l":"d","x":"Rotavirus","r":"Rotavirus (Reoviridae) has a segmented double-stranded RNA genome, Baltimore group III. Reoviridae is the dsRNA exception among RNA viruses."}],"k":"D","w":[],"i":["The printed 2028 rationale labels Hepatitis B as Baltimore group V. The project lecture (MCB 2.01) places Hepadnaviridae in group VII, dsDNA with reverse transcriptase."],"o":"","f":"ROTADS"},"2028-8":{"id":"2028-8","y":2028,"n":"8","p":3,"t":"T01","s":"What is the capsid chemistry of most DNA viruses?","c":[{"l":"a","x":"Asymmetrical","r":"Not one of the three capsid symmetries taught, which are icosahedral, helical, and complex."},{"l":"b","x":"Complex","r":"Complex capsids lack the usual symmetry. The DNA example is poxvirus, which is brick-shaped with a dumbbell core flanked by lateral bodies. It is the exception among DNA viruses."},{"l":"c","x":"Helical","r":"Helical capsids are spiral or cylindrical and are typical of enveloped negative-sense RNA viruses."},{"l":"d","x":"Icosahedral","r":"Icosahedral (cubic) capsids are polyhedral with 20 flat sides and are found in most DNA viruses and positive-sense RNA viruses. Hepadna, herpes, adeno, papilloma, polyoma, and parvo are all icosahedral."},{"l":"e","x":"Spherical","r":"Spherical describes overall virion shape, as in retroviruses or HBV, not a capsid symmetry class."}],"k":"D","w":[],"i":[],"o":""},"2028-9":{"id":"2028-9","y":2028,"n":"9","p":3,"t":"T01","s":"By which mechanism the oncogenic viruses cause cancer","c":[{"l":"a","x":"Destroy normal cells","r":"Cell destruction is the outcome of lytic infection, which produces cytopathic effect and cell death rather than transformation."},{"l":"b","x":"Deplete cellular nutrients","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"c","x":"Integrate into and disrupt cellular genes","r":"Oncogenic viruses integrate their nucleic acid into the host genome and dysregulate growth control, either by activating proto-oncogenes into oncogenes or by inactivating tumor suppressor genes such as p53 and Rb."},{"l":"d","x":"Produce inflammatory toxin","r":"Viruses do not transform cells through toxins. Transformation depends on viral genes or gene products that induce unregulated cell growth."},{"l":"e","x":"Triggering Massive immune response","r":"A strong immune response damages infected tissue, as in hepatitis B hepatocyte injury, but it is not the mechanism by which a virus transforms a cell."}],"k":"C","w":[],"i":[],"o":""},"2028-10":{"id":"2028-10","y":2028,"n":"10","p":3,"t":"T02","s":"Which of the following is not a mode of transmission of the Herpes Simplex 1 virus?","c":[{"l":"a","x":"Contact with saliva","r":"HSV-1 is spread mainly through infected saliva, for example by kissing or by fingers contaminated with saliva."},{"l":"b","x":"Contact with mucosal lesions","r":"Direct contact with mucosal lesions transmits HSV-1. The virus enters through small breaks in skin or mucous membranes."},{"l":"c","x":"Feco-oral","r":"The fecal-oral route belongs to enteric viruses such as poliovirus, rotavirus, and hepatitis A. It is not a route for HSV-1."},{"l":"d","x":"Sexual","r":"HSV-1 is increasingly transmitted sexually through oral-genital contact, causing genital herpes that cannot be told apart from HSV-2 without laboratory testing."}],"k":"C","w":[],"i":[],"o":"","f":"HSVROUTE"},"2028-11":{"id":"2028-11","y":2028,"n":"11","p":3,"t":"T02","s":"Which of the following body fluids can transmit Hepatitis B virus?","c":[{"l":"a","x":"Blood","r":"Blood is a major vehicle for HBV through transfusion, needles, tattooing, and needlestick injuries."},{"l":"b","x":"Perspiration","r":"The 2028 rationale notes HBV can be present in all body fluids, but only blood and semen are highly implicated in transmission. Sweat is not a recognized vehicle."},{"l":"c","x":"Semen","r":"Semen transmits HBV, which is why sexual transmission occurs and highly promiscuous persons are a high-risk group."},{"l":"d","x":"Both A & C","r":"HBV spreads through blood and sexual contact, so both blood and semen are correct."}],"k":"D","w":[],"i":[],"o":""},"2028-12":{"id":"2028-12","y":2028,"n":"12","p":3,"t":"T02","s":"A 25 y/o commercial sex worker consulted because of painful vesicoulcerative lesions over the vulva, vagina, and cervix accompanied by inguinal lymphadenopathy. Which of the following herpesvirus is the most probable cause?","c":[{"l":"a","x":"HSV 2","r":"HSV-2 typically causes herpes genitalis, a sexually transmitted infection with painful vesiculoulcerative lesions of the penis or of the cervix, vulva, vagina, and perineum. It may come with fever, malaise, dysuria, and inguinal lymphadenopathy, and it becomes latent in the sacral ganglia."},{"l":"b","x":"HHV 6","r":"HHV-6 causes roseola infantum (exanthem subitum or sixth disease) in infants, with high fever followed by an erythematous macular rash. It infects peripheral blood lymphocytes using CD46 as its receptor."},{"l":"c","x":"HHV 7","r":"HHV-7 is closely related to HHV-6 and is linked to a roseola-like illness in children."},{"l":"d","x":"Varicella virus","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption."}],"k":"A","w":[],"i":[],"o":"","f":"HSVROUTE"},"2028-13":{"id":"2028-13","y":2028,"n":"13","p":4,"t":"T02","s":"A 7-year-old patient was brought to the emergency department because of fever, malaise, and nasal congestion which was followed by a malar rash resembling a slapped-cheek appearance. Which of the following viruses is the cause of the above?","c":[{"l":"a","x":"HSV1","r":"HSV-1 primary infection in children presents as gingivostomatitis with vesicular and ulcerative lesions of the buccal and gingival mucosa, and recurs as fever sores at the lip border."},{"l":"b","x":"Rubeolla","r":"Rubeola (measles) gives a prodrome of fever, cough, coryza, conjunctivitis, and Koplik spots, then a maculopapular rash that starts on the head and spreads downward."},{"l":"c","x":"Parvovirus B19","r":"Parvovirus B19 is a small naked single-stranded DNA virus. Its most common manifestation is erythema infectiosum (fifth disease), a biphasic rash that begins with intense malar erythema called slapped cheek, followed by a lacy maculopapular rash on the trunk and limbs."},{"l":"d","x":"Varicella","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption."}],"k":"C","w":[],"i":[],"o":"","f":"B19SLAP"},"2028-14":{"id":"2028-14","y":2028,"n":"14","p":4,"t":"T02","s":"Which of the following modes of infection of adenovirus is false?","c":[{"l":"A","x":"Blood transfusion","r":"Blood transfusion is not a recognized route for adenovirus. Adenoviruses spread by direct contact, the fecal-oral route, respiratory droplets, contaminated fomites, hand-to-eye transfer, and swimming pools. Blood-product spread is instead a feature of parvovirus B19."},{"l":"B","x":"Direct contact","r":"Direct contact with infected secretions of the eye, nose, or mouth is a listed adenovirus route."},{"l":"C","x":"Feco-oral","r":"Enteric adenovirus types 40 and 41 cause gastroenteritis and spread through stool."},{"l":"D","x":"Handling of fomites","r":"As a naked virus, adenovirus survives on surfaces, so contaminated objects carry infection. Hand-to-eye transfer matters most for eye infections."},{"l":"E","x":"Respiratory droplet","r":"Respiratory droplets from coughing and sneezing are the common route for adenoviral respiratory disease."}],"k":"A","w":[],"i":[],"o":"","f":"ADROUTE"},"2028-15":{"id":"2028-15","y":2028,"n":"15","p":4,"t":"T02","s":"A 23 y/o female came in for consultation because of fever, nasal congestion, cough, sore throat, and conjunctivitis which occurred after going to a swimming party. Which of the following viruses is most likely the cause of this condition?","c":[{"l":"a","x":"Adenovirus","r":"Adenovirus types 3 and 7 cause pharyngoconjunctival fever, also called swimming pool conjunctivitis. It occurs in outbreaks among people sharing swimming facilities and combines mild conjunctivitis with fever, sore throat, and respiratory symptoms."},{"l":"b","x":"Epstein-Barr Virus","r":"EBV (HHV-4) spreads through saliva and causes infectious mononucleosis. It is associated with Burkitt lymphoma and nasopharyngeal carcinoma."},{"l":"c","x":"Papillomavirus","r":"HPV infects only the surface epithelium of skin and mucous membranes, causing warts and, with types 16 and 18, cervical cancer."},{"l":"D","x":"Parvovirus","r":"Parvovirus B19 is a small naked single-stranded DNA virus. Its most common manifestation is erythema infectiosum (fifth disease), a biphasic rash that begins with intense malar erythema called slapped cheek, followed by a lacy maculopapular rash on the trunk and limbs."}],"k":"A","w":[],"i":[],"o":"","f":"ADPOOL"},"2028-16":{"id":"2028-16","y":2028,"n":"16","p":4,"t":"T02","s":"Which of the following viruses is associated with Progressive Multifocal Leukoencelopathy?","c":[{"l":"a","x":"BK virus","r":"BK virus (human polyomavirus 1) reactivates in the urinary tract of immunocompromised patients, causing hemorrhagic cystitis in bone marrow transplant recipients and polyomavirus-associated nephropathy in renal transplant patients."},{"l":"b","x":"JC virus","r":"JC virus is a polyomavirus that stays latent after childhood infection. Reactivation in immunocompromised patients such as those with AIDS causes progressive multifocal leukoencephalopathy (PML), a fatal demyelinating disease of the CNS."},{"l":"c","x":"Merkel Cell virus","r":"Merkel cell polyomavirus DNA is found in most cases of Merkel cell carcinoma, a rare and aggressive skin cancer."},{"l":"d","x":"Varicella virus","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption."}],"k":"B","w":[],"i":[],"o":"","f":"PML"},"2028-17":{"id":"2028-17","y":2028,"n":"17","p":4,"t":"T02","s":"5 y/o patient was brought to the clinic because of multiple vesico-ulcerative lesions at the angle of the mouth and buccal mucosa, which occurred after a bout of fever. Which is the most probable cause?","c":[{"l":"a","x":"Varicella Virus","r":"Varicella-zoster virus causes varicella (chickenpox) on primary contact and herpes zoster (shingles) when latent virus in sensory ganglia reactivates in a partially immune host. The rash is a disseminated or dermatomal vesicular eruption. Its lesions are generalized rather than confined to the mouth."},{"l":"b","x":"HHV6","r":"HHV-6 causes roseola infantum (exanthem subitum or sixth disease) in infants, with high fever followed by an erythematous macular rash. It infects peripheral blood lymphocytes using CD46 as its receptor."},{"l":"c","x":"HSV1","r":"Primary symptomatic HSV-1 infection is gingivostomatitis, seen most often in children 1 to 5 years old. It involves the buccal and gingival mucosa with fever, sore throat, and vesicular and ulcerative lesions, and virus is shed in saliva."},{"l":"d","x":"HPV","r":"HPV shows strict tropism for surface epithelium of skin and mucous membranes. Types 1 and 2 cause common skin warts, types 6 and 11 anogenital warts, and types 16 and 18 cervical cancer. It does not cause febrile vesicular stomatitis."}],"k":"C","w":[],"i":[],"o":"","f":"HSV1KID"},"2028-18":{"id":"2028-18","y":2028,"n":"18","p":5,"t":"T02","s":"Which of the following would indicate a Hepatitis infection is becoming chronic?","c":[{"l":"a","x":"(+) HBsAg beyond 6 mos, (-) Anti-HBs","r":"Persistence of HBsAg beyond 6 months together with absence of anti-HBs indicates the infection has become chronic. HBsAg always implies active infection, and anti-HBs would have signalled clearance and immunity."},{"l":"b","x":"(+) HBsAg after first month, (-) Anti-HBs","r":"HBsAg at one month fits acute infection. HBsAg is the first serum marker to appear, and anti-HBs does not appear until convalescence."},{"l":"c","x":"(-) HBsAg beyond 3 mos, (-) Anti-HBs","r":"With all markers negative the person is not infected and is susceptible to hepatitis B."},{"l":"d","x":"(-) HBsAg beyond 6 mos, (+) Anti-HBs","r":"Negative HBsAg with positive anti-HBs means recovery from illness, a previously cleared infection, or vaccination. Anti-HBs indicates immunity."}],"k":"A","w":[],"i":[],"o":"","f":"HBVCHR"},"2028-19":{"id":"2028-19","y":2028,"n":"19","p":5,"t":"T03","s":"A small icosahedral naked virus destroys anterior horn cells and causes irreversible asymmetric paralysis. Which receptor is needed for attachment?","c":[{"l":"a","x":"CAF","r":"The 2028 rationale links this choice to Coxsackie A virus and adenovirus. The lecture names CAR, the coxsackievirus and adenovirus receptor, as the receptor used by coxsackievirus B."},{"l":"b","x":"ICAM-1","r":"ICAM-1 is the receptor for the major group of rhinoviruses."},{"l":"c","x":"LDLR","r":"The low-density lipoprotein receptor family is used by the minor group of rhinoviruses. The 2028 rationale also lists enterovirus 71."},{"l":"d","x":"PVR","r":"Poliovirus attaches to the poliovirus receptor (PVR), also called CD155. After secondary viremia it reaches anterior horn cells and lower motor neurons, and their destruction causes asymmetric flaccid paralysis."}],"k":"D","w":[],"i":[],"o":"","f":"POLIO"},"2028-20":{"id":"2028-20","y":2028,"n":"20","p":5,"t":"T03","s":"The virus that causes asymmetric flaccid paralysis is endemic to:","c":[{"l":"a","x":"Afghanistan","r":"Afghanistan is one of the three countries the lecture lists as still polio endemic, together with Pakistan and Nigeria."},{"l":"b","x":"Iran","r":"Per the 2028 rationale, Iran was declared polio-free in 2001."},{"l":"c","x":"Mongolia","r":"Per the 2028 rationale, Mongolia was declared polio-free in 2014."},{"l":"d","x":"Philippines","r":"The Philippines was declared polio-free in 2000. Polio re-emerged in 2019 as a vaccine-derived type 2 outbreak that was declared over in June 2021, so the country is not endemic."}],"k":"A","w":[],"i":[],"o":""},"2028-21":{"id":"2028-21","y":2028,"n":"21","p":5,"t":"T03","s":"A patient has sudden painful subconjunctival hemorrhage. Which virus is associated with this symptom?","c":[{"l":"a","x":"EV69","r":"Per the 2028 rationale, enterovirus 69 is not a common cause of illness."},{"l":"b","x":"EV70","r":"Enterovirus 70 is the classic cause of acute hemorrhagic conjunctivitis, with sudden painful red eye and subconjunctival hemorrhage that resolves in about 10 days. It caused pandemics in 1969 to 1971, and coxsackievirus A24 variant causes the same picture."},{"l":"c","x":"EV71","r":"Enterovirus 71 is a major cause of CNS disease such as meningitis, encephalitis, and polio-like paralysis, and is associated with severe or fatal hand-foot-and-mouth disease outbreaks."},{"l":"d","x":"EV72","r":"Per the 2028 rationale this designation is associated with hepatitis A, the picornavirus (Hepatovirus) that replicates in the liver."}],"k":"B","w":[],"i":[],"o":"","f":"EV70"},"2028-22":{"id":"2028-22","y":2028,"n":"22","p":5,"t":"T03","s":"A patient with ulcerations and vesicles in the posterior oropharynx. What family of viruses does it belong to?","c":[{"l":"a","x":"Flaviviridae","r":"Flaviviridae are enveloped positive-sense RNA arboviruses such as dengue, yellow fever, Zika, and Japanese encephalitis. They cause febrile, hemorrhagic, or encephalitic illness, not oral vesicles."},{"l":"b","x":"Herpeviridae","r":"HSV-1 gingivostomatitis affects the lips, gingiva, and buccal mucosa at the front of the mouth, not the posterior oropharynx."},{"l":"c","x":"Picornaviridae","r":"Coxsackie A virus, a picornavirus, causes herpangina with fever, sore throat, and vesicles and ulcers on the posterior pharynx, tonsils, or tongue. The same virus group causes hand-foot-and-mouth disease."},{"l":"d","x":"Poxviridae","r":"Poxviruses are large brick-shaped DNA viruses that produce skin lesions progressing from macule to papule, vesicle, and pustule. Lesions are not localized to the oropharynx."}],"k":"C","w":[],"i":[],"o":"","f":"COXA"},"2028-23":{"id":"2028-23","y":2028,"n":"23","p":5,"t":"T03","s":"Which virus is managing dehydration a common and important step?","c":[{"l":"a","x":"Coxsackie","r":"Coxsackieviruses cause herpangina, hand-foot-and-mouth disease, hemorrhagic conjunctivitis, pleurodynia, and myocarditis. Care is supportive but dehydration is not the central problem."},{"l":"b","x":"Poliovirus","r":"Poliovirus causes paralytic poliomyelitis through motor neuron destruction. Dehydration is not the key issue."},{"l":"c","x":"Rhinovirus","r":"Rhinovirus causes the common cold, an upper respiratory infection."},{"l":"d","x":"Rotavirus","r":"Rotavirus infects small-intestinal villus cells, and its NSP4 enterotoxin causes watery diarrhea and vomiting that lead to dehydration in infants and young children. Oral or IV rehydration is the mainstay of treatment."}],"k":"D","w":[],"i":[],"o":""},"2028-24":{"id":"2028-24","y":2028,"n":"24","p":6,"t":"T03","s":"Which is TRUE regarding the replication of Picornaviridae and Reoviridae?","c":[{"l":"a","x":"Picornaviridae undergo transient membrane formation in ER","r":"This is a reovirus feature. Immature rotavirus particles bud into the endoplasmic reticulum and temporarily acquire a membrane. Picornaviruses replicate in the cytoplasm without this step."},{"l":"b","x":"Picornaviridae forms viroplasms","r":"Viroplasms are the cytoplasmic factories of Reoviridae, where mRNAs are copied into dsRNA genomes to form immature particles."},{"l":"c","x":"Reoviridae is directly translated into protein","r":"Reovirus dsRNA cannot be translated directly. The viral polymerase VP1 inside the core first transcribes capped mRNA. Direct translation is a property of positive-sense genomes such as picornaviruses."},{"l":"d","x":"Reoviridae undergo partial uncoating","r":"Reoviruses undergo only partial uncoating in lysosomes, where the outer shell (VP4 and VP7) is removed and the core stays intact to transcribe mRNA."}],"k":"D","w":[],"i":[],"o":""},"2028-25":{"id":"2028-25","y":2028,"n":"25","p":6,"t":"T03","s":"Which virus has 4 capsid proteins (VP1-VP4) with the canyon that is the junction of VP1-VP3?","c":[{"l":"a","x":"Orthomyxoviridae","r":"Orthomyxoviruses are enveloped, with hemagglutinin and neuraminidase glycoprotein spikes inserted in the lipid membrane. They have no canyon."},{"l":"b","x":"Caliciviridae","r":"The calicivirus capsid is made of a single major structural protein, VP1."},{"l":"c","x":"Picornaviridae","r":"The picornavirus capsid has four proteins, VP1 to VP4. The junction of VP1, VP2, and VP3 forms a canyon that hides the receptor-binding site and is too narrow for antibodies to enter."},{"l":"d","x":"Reoviridae","r":"Rotavirus has a triple-layered capsid. VP6 is the group-specific middle-layer antigen, and outer proteins VP4 (P type) and VP7 (G type) are the neutralizing antigens."}],"k":"C","w":[],"i":[],"o":"","f":"PICOVP"},"2028-26":{"id":"2028-26","y":2028,"n":"26","p":7,"t":"T03","s":"An outbreak of vomiting, watery diarrhea, and fever occurs on a cruise ship. Which test is best done to acquire a definitive diagnosis?","c":[{"l":"a","x":"Cell culture","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"b","x":"Electron microscopy","r":"The lecture notes limited use because of low sensitivity."},{"l":"c","x":"RT-PCR","r":"A cruise ship outbreak of vomiting and diarrhea in adults points to norovirus, the major cause of epidemic viral gastroenteritis in adults. RT-PCR is the gold standard for diagnosis."},{"l":"d","x":"Serology","r":"Serology by ELISA looking for a rise in IgG is mainly a research tool for norovirus."}],"k":"C","w":[],"i":[],"o":"","f":"NORO"},"2028-27":{"id":"2028-27","y":2028,"n":"27","p":7,"t":"T03","s":"What is the most common complication of the first rotavirus vaccine (withdrawn in 1999)?","c":[{"l":"a","x":"Autoimmune disease","r":"Not associated with the vaccine per the 2028 rationale."},{"l":"b","x":"Intussusception","r":"RotaShield, the 1998 rhesus-based vaccine, was withdrawn because of intussusception risk, a telescoping of the intestine. Current vaccines RotaTeq and Rotarix are live attenuated oral vaccines that are safe and effective."},{"l":"c","x":"Myocarditis","r":"Not associated with the vaccine. Among enteric viruses, myocarditis is a coxsackie B disease."},{"l":"d","x":"Reactivation of the virus","r":"Not associated with the vaccine. Rotavirus does not establish latency."}],"k":"B","w":[],"i":[],"o":""},"2028-28":{"id":"2028-28","y":2028,"n":"28","p":7,"t":"T06","s":"The carcinogenic potential of RNA tumor viruses arise from:","c":[{"l":"a","x":"Presence of host-derived oncogenes in their genome","r":"Highly oncogenic or direct transforming retroviruses carry their own oncogene, which originally came from a host cell. They induce tumors after short latent periods and transform cells rapidly."},{"l":"b","x":"Chronic alteration between cell death and regeneration","r":"This is the indirect route seen in hepatitis B and C, where persistent infection causes necrosis, inflammation, and regeneration leading to cirrhosis and hepatocellular carcinoma. It occurs with both DNA and RNA tumor viruses."},{"l":"c","x":"Integration of viral promoters that activate host proto-oncogenes","r":"This describes weakly oncogenic or slowly transforming retroviruses, which carry no oncogene and act indirectly through promoter insertion. Per the 2028 rationale both DNA and RNA tumor viruses may integrate, so it is not the distinguishing feature."},{"l":"d","x":"Persistence of translation for viral structural proteins","r":"Per the 2028 rationale this is not mentioned in relation to the carcinogenic potential of RNA tumor viruses."}],"k":"A","w":[],"i":[],"o":""},"2028-29":{"id":"2028-29","y":2028,"n":"29","p":7,"t":"T06","s":"Patient presents with hydrophobia, agitation, hallucinations, and hypersalivation. Which of the following conditions is most likely present?","c":[{"l":"a","x":"Paralytic rabies","r":"Paralytic rabies shows muscle weakness that often starts in the bitten extremity and spreads to quadriparesis and facial weakness. Excitability and hydrophobia are absent."},{"l":"b","x":"Encephalitic rabies","r":"Encephalitic or furious rabies makes up about 80 percent of cases. It features fever, confusion, hallucinations, combativeness, seizures, autonomic dysfunction such as hypersalivation, and early brainstem involvement that produces hydrophobia and aerophobia."},{"l":"c","x":"SSPE","r":"Subacute sclerosing panencephalitis is a rare late complication of measles (rubeola) infection. It presents with personality change and poor school performance, then progressive intellectual decline, myoclonus, seizures, and finally an unresponsive spastic state."},{"l":"d","x":"PML","r":"Progressive multifocal leukoencephalopathy is caused by reactivation of JC virus, a polyomavirus, in immunosuppressed patients. It is a demyelinating disease with visual deficits, mental impairment, weakness, ataxia, and seizures."}],"k":"B","w":[],"i":[],"o":""},"2028-30":{"id":"2028-30","y":2028,"n":"30","p":8,"t":"T06","s":"A patient who started antiretroviral therapy started developing resistance to RTIs. Gene sequence reveals point mutations in the viral genome. Which retroviral gene is most likely to harbor these mutations?","c":[{"l":"a","x":"env","r":"env encodes the envelope glycoproteins gp120 and gp41. It is the target of entry inhibitors and shows extensive antigenic variability."},{"l":"b","x":"gag","r":"gag encodes the core structural proteins: capsid, matrix, and nucleocapsid."},{"l":"c","x":"pro","r":"pro refers to protease, which cleaves Gag during maturation and is the target of protease inhibitors."},{"l":"d","x":"pol","r":"pol encodes reverse transcriptase, the target of reverse transcriptase inhibitors. Genotypic resistance testing sequences the reverse transcriptase and protease genes to find these mutations."}],"k":"D","w":[],"i":[],"o":"","f":"RETRO"},"2028-31":{"id":"2028-31","y":2028,"n":"31","p":8,"t":"T06","s":"A patient with active rabies shows severe neurological decline and has not mounted a sufficient immunologic response. Considering the viral and host response, what mechanism best explains the host response?","c":[{"l":"a","x":"Overactivation of T cells","r":"Rabies does the opposite. Its G glycoprotein reduces T-cell activation and promotes IL-10 secretion."},{"l":"b","x":"Poor chemokine/cytokine response, no neutralizing antibodies","r":"Rabies proteins suppress innate immunity: N hides viral RNA from RIG-I, P blocks interferon signaling, M dampens innate gene expression, and G reduces T-cell activation. The result is a poor cytokine and chemokine response, limited leukocyte entry into the CNS, and absent neutralizing antibodies."},{"l":"c","x":"Rapid destruction of T cells in lymph nodes","r":"Loss of T cells is the hallmark of HIV, which is cytolytic for CD4 cells. Rabies is a neurotropic virus and does not act this way."},{"l":"d","x":"Viral latency in dorsal root ganglia and brainstem","r":"Latency in sensory ganglia is a herpesvirus property, for example VZV. Rabies is an acute, rapidly progressive CNS infection."}],"k":"B","w":[],"i":[],"o":""},"2028-32":{"id":"2028-32","y":2028,"n":"32","p":9,"t":"T06","s":"A 30-year-old male presents with dementia, ataxia, and myoclonus. No inflammation was noted in his pathology. What is the possible etiologic agent?","c":[{"l":"a","x":"JC Virus","r":"JC virus is a polyomavirus that stays latent after childhood infection. Reactivation in immunocompromised patients such as those with AIDS causes progressive multifocal leukoencephalopathy (PML), a fatal demyelinating disease of the CNS. PML does not give the dementia with myoclonus picture."},{"l":"b","x":"Merkell's Virus","r":"Merkel cell polyomavirus DNA is found in most cases of Merkel cell carcinoma, a rare and aggressive skin cancer."},{"l":"c","x":"Prions","r":"Prions are proteinaceous infectious particles that lack nucleic acid. Misfolded PrPSc forces normal PrPC to change shape and accumulate in the brain, causing transmissible spongiform encephalopathies such as Creutzfeldt-Jakob disease, which presents with progressive dementia, ataxia, and myoclonus. The host shows no inflammatory and no immune response."},{"l":"d","x":"Rabies","r":"Rabies is an acute encephalitis with hydrophobia, agitation, and hypersalivation, and its pathology shows Negri bodies in neurons."}],"k":"C","w":[],"i":[],"o":"","f":"CJD"},"2028-33":{"id":"2028-33","y":2028,"n":"33","p":9,"t":"T06","s":"45 yr old male with chronic hepatitis B with cirrhosis and liver mass. What mechanism explains the increased risk of hepatocellular carcinoma?","c":[{"l":"a","x":"T cell evasion","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"b","x":"Integration of viral oncogenes to host genome","r":"Carrying an oncogene is the mechanism of highly oncogenic retroviruses. HBV acts mainly through chronic injury, although its X protein is a potential viral oncoprotein."},{"l":"c","x":"Necrosis, inflammation, and repeated liver regeneration","r":"Hepatitis B is an important risk factor for hepatocellular carcinoma. Persistent infection causes repeated necrosis, inflammation, and liver regeneration, which leads to cirrhosis, the background on which HCC arises many years later."},{"l":"d","x":"Replicates only in dividing cells","r":"Dependence on dividing cells is a parvovirus B19 property, since B19 needs host cells in S phase. It does not explain HBV carcinogenesis."}],"k":"C","w":[],"i":[],"o":"","f":"HBVHCC"},"2028-34":{"id":"2028-34","y":2028,"n":"34","p":9,"t":"T06","s":"HIV Patient undergoing therapy. What is MOA of reverse transcriptase inhibitor and integrase inhibitor?","c":[{"l":"a","x":"Reverse transcriptase inhibitor inhibits DNA integration and Integrase inhibitor inhibits RNA to DNA conversion","r":"This swaps the two mechanisms."},{"l":"b","x":"Reverse transcriptase inhibitor RNA to DNA conversion and Integrase inhibitor DNA integration","r":"Reverse transcriptase inhibitors block conversion of viral RNA to DNA, and integrase inhibitors prevent chromosomal integration of that DNA copy."},{"l":"c","x":"Both Inhibit viral replication","r":"True in a broad sense but it states no mechanism, so it does not answer what each drug class does."},{"l":"d","x":"Reverse transcriptase inhibitor inhibits protein synthesis and integrase inhibitor inhibits viral entry","r":"Neither is right. Viral entry is blocked by fusion inhibitors and by entry inhibitors that block CCR5 binding. Protease inhibitors, not RTIs, act on viral proteins by stopping maturation into infectious particles."}],"k":"B","w":[],"i":[],"o":"","f":"RETRO"},"2028-35":{"id":"2028-35","y":2028,"n":"35","p":9,"t":"T06","s":"A researcher developed a monoclonal antibody that blocks the rabies virus to host cells. What viral protein should the antibody target?","c":[{"l":"a","x":"G glycoprotein","r":"The G glycoprotein forms the trimeric surface spikes of rabies virus. It determines neuroinvasiveness and pathogenicity, and purified spikes induce neutralizing antibodies, so it is the target for blocking attachment."},{"l":"b","x":"L protein","r":"L protein carries the enzymatic activities for viral RNA synthesis."},{"l":"c","x":"M protein","r":"M (matrix) protein gives structural support, takes part in assembly, and dampens innate immune gene expression."},{"l":"d","x":"N. Protein","r":"N (nucleoprotein) encapsidates the RNA genome and conceals it from RIG-I. Antiserum against nucleocapsid is used diagnostically in immunofluorescence testing."}],"k":"A","w":[],"i":["In the source PDF this stem is not set in bold like the others. The text is otherwise complete."],"o":"","f":"RABREC"},"2028-36":{"id":"2028-36","y":2028,"n":"36","p":10,"t":"T06","s":"A patient with HIV has undergone reverse transcriptase inhibitor monotherapy. After a year, the viral load rebounds and resistance mutation is detected. What is the best treatment strategy for this patient?","c":[{"l":"a","x":"Attempt vaccine prophylaxis despite established infection","r":"Vaccines are preventive, not therapeutic, and no HIV vaccine exists."},{"l":"b","x":"Continue monotherapy to induce partial suppression","r":"Monotherapy selects resistance quickly because HIV replicates rapidly with an error-prone reverse transcriptase."},{"l":"c","x":"Initiate HAART using multi-drug class to prevent replication at different stages","r":"HAART combines drug classes that act at different steps of replication. It suppresses viral load to undetectable levels and turned HIV into a manageable chronic disease, although latent reservoirs mean it does not cure."},{"l":"d","x":"Switch to interferon therapy to directly kill the virus","r":"Pegylated interferon alpha is a first-line option for hepatitis B, not a treatment for HIV."}],"k":"C","w":[],"i":[],"o":""},"2028-37":{"id":"2028-37","y":2028,"n":"37","p":10,"t":"T07","s":"Which of the following fungi exhibit thermal dimorphism?","c":[{"l":"a","x":"Malasezzia furfur","r":"Malassezia furfur is a lipophilic yeast that causes pityriasis (tinea) versicolor, a chronic superficial mycosis. KOH shows short unbranched hyphae with round yeast, the spaghetti and meatball pattern, and lesions fluoresce under Wood's lamp. It does not switch between mold and yeast with temperature."},{"l":"b","x":"Candida albicans","r":"Candida albicans is polymorphic, growing as budding yeast, pseudohyphae, and true hyphae (germ tubes) depending on conditions. It is not a classic temperature-dependent dimorph."},{"l":"c","x":"Sporothrix schenkii","r":"Sporothrix schenckii is the thermally dimorphic fungus of sporotrichosis, a subcutaneous mycosis acquired by traumatic implantation from soil or plants. It grows as a mold with delicate hyphae and flower-like conidia at 25°C and converts to small cigar-shaped yeast at 37°C."},{"l":"d","x":"Trichophyton rubrum","r":"Trichophyton rubrum is a dermatophyte that grows only as a filamentous mold infecting skin, hair, and nails. It has no yeast phase."}],"k":"C","w":[],"i":[],"o":"","f":"SPORO"},"2028-38":{"id":"2028-38","y":2028,"n":"38","p":10,"t":"T07","s":"Which stain is commonly used for identifying fungi in histopathologic sections?","c":[{"l":"a","x":"Periodic Acid-Schiff","r":"PAS stains the polysaccharide-rich fungal cell wall red or magenta, making fungal elements easy to see in tissue. GMS, which stains fungi black, is the other special stain named in the lecture."},{"l":"b","x":"Ziehl-Neelsen","r":"Ziehl-Neelsen is the acid-fast stain used for mycobacteria."},{"l":"c","x":"Wright-Giemsa","r":"Wright-Giemsa is a blood cell stain."},{"l":"d","x":"Sudan Black","r":"Sudan Black stains lipids and phospholipids."}],"k":"A","w":[],"i":[],"o":""},"2028-39":{"id":"2028-39","y":2028,"n":"39","p":10,"t":"T07","s":"Which of the following is most commonly associated with tinea pedis?","c":[{"l":"a","x":"Epidermophyton flocossum","r":"Epidermophyton floccosum is the only pathogenic species in its genus. It infects skin and nails but not hair, and produces club-shaped smooth-walled macroconidia in small clusters with no microconidia. The 2028 rationale assigns it to tinea corporis."},{"l":"b","x":"Microsporum canis","r":"Microsporum canis is a zoophilic dermatophyte acquired from cats and dogs. It infects skin and hair, causing ectothrix tinea capitis whose hairs fluoresce green under Wood's lamp, and its colony is white and cottony with a deep yellow reverse."},{"l":"c","x":"Trichophyton rubrum","r":"Trichophyton rubrum infects skin, hair, and nails. Its colony has a white cottony surface with a deep red nondiffusible pigment on the reverse side. The 2028 key names it as the usual agent of tinea pedis, the most prevalent dermatophytosis."},{"l":"d","x":"Trichophyton schoenleinii","r":"Trichophyton schoenleinii causes favus, a chronic form of tinea capitis with yellowish crusts called scutula. It forms no macroconidia or microconidia and shows antler-like hyphae called favic chandeliers."}],"k":"C","w":[],"i":[],"o":"","f":"TPEDIS"},"2028-40":{"id":"2028-40","y":2028,"n":"40","p":10,"t":"T07","s":"A patient presents with multiple ulcerated nodules along lymphatics of the arm following a gardening injury. Culture at 25 deg C reveals delicate, branching hyphae with “flower-like” conidia. What is most likely the diagnosis?","c":[{"l":"a","x":"Blastomycosis","r":"Blastomycosis is a systemic mycosis acquired by inhalation. Blastomyces dermatitidis forms large thick-walled yeast with a single broad-based bud at 37°C."},{"l":"b","x":"Fixed cutaneous sporotrichosis","r":"Fixed cutaneous sporotrichosis is a single localized lesion that does not spread along lymphatic vessels."},{"l":"c","x":"Lymphocutaneous sporotrichosis","r":"Lymphocutaneous sporotrichosis is the most common form, about 75 percent of cases. A granulomatous nodule at the inoculation site ulcerates and spreads along draining lymphatics as a cord of nodules, and the mold form shows delicate hyphae with rosette or flower-like conidia."},{"l":"d","x":"Mycetoma","r":"Mycetoma is a chronic granulomatous infection, usually of the foot, defined by the triad of localized swelling, draining sinuses, and granules."}],"k":"C","w":[],"i":[],"o":"","f":"SPORO"},"2028-41":{"id":"2028-41","y":2028,"n":"41","p":11,"t":"T07","s":"What best differentiates eumycetoma from actinomycetoma?","c":[{"l":"a","x":"Gram positive filamentous organism in smear","r":"Gram-positive filamentous organisms indicate actinomycetoma, the bacterial form. The finding identifies the bacterial type rather than proving a fungal cause."},{"l":"b","x":"History of trauma with wood splinter","r":"Both types follow traumatic implantation, so the history does not separate them."},{"l":"c","x":"Presence of sulfur granules","r":"Granules are part of the mycetoma triad in both the fungal and the bacterial type, so their presence alone does not separate the two."},{"l":"d","x":"Black granules with fungal hyphae on histology","r":"Eumycetoma is caused by true fungi. Its granules contain densely intertwined septate hyphae, often distorted at the periphery, and black to red-black granules suggest Madurella or Exophiala."}],"k":"D","w":[],"i":[],"o":"","f":"MYCETOMA"},"2028-42":{"id":"2028-42","y":2028,"n":"42","p":11,"t":"T07","s":"The KOH of skin scraping showed septate, branching, hyphae. The organism forms a white cottony colony that later on turns red on the reverse side. What organism is this likely to be?","c":[{"l":"a","x":"E. flocossum","r":"Epidermophyton floccosum is the only pathogenic species in its genus. It infects skin and nails but not hair, and produces club-shaped smooth-walled macroconidia in small clusters with no microconidia. Colonies are flat and velvety with a tan to olive-green tinge."},{"l":"b","x":"M. canis","r":"Microsporum canis is a zoophilic dermatophyte acquired from cats and dogs. It infects skin and hair, causing ectothrix tinea capitis whose hairs fluoresce green under Wood's lamp, and its colony is white and cottony with a deep yellow reverse. Its macroconidia are thick-walled with 8 to 15 cells and curved or hooked tips."},{"l":"c","x":"T. rubrum","r":"Trichophyton rubrum infects skin, hair, and nails. Its colony has a white cottony surface with a deep red nondiffusible pigment on the reverse side."},{"l":"d","x":"T. mentagrophytes","r":"Trichophyton mentagrophytes colonies are cottony to granular, and both types show abundant grape-like clusters of spherical microconidia on terminal branches."}],"k":"C","w":[],"i":[],"o":"","f":"DERMID"},"2028-43":{"id":"2028-43","y":2028,"n":"43","p":11,"t":"T07","s":"A child with a scaly, patchy scalp lesion and alopecia is diagnosed with tinea capitis. What is the diagnostic tool used to confirm the causative agent most rapidly?","c":[{"l":"a","x":"KOH mount","r":"A 10 to 20 percent KOH preparation dissolves host tissue and shows branching septate hyphae and chains of arthroconidia within minutes. Microscopy is the first-line rapid tool for fungal infection."},{"l":"b","x":"Histopathology","r":"Tissue processing takes hours to days, so it is not the rapid option."},{"l":"c","x":"Sabaoraud’s agar culture","r":"Culture on Sabouraud dextrose agar at 25 to 30°C gives species identification from colony and conidial morphology, but growth takes weeks."},{"l":"d","x":"Wood Lamp (+)","r":"Wood's lamp is rapid but only ectothrix Microsporum infections fluoresce green. Endothrix agents such as Trichophyton tonsurans do not fluoresce, so a negative lamp misses them."}],"k":"A","w":[],"i":[],"o":"","f":"KOH"},"2028-44":{"id":"2028-44","y":2028,"n":"44","p":11,"t":"T07","s":"A gardener develops ulcerated lesions on the hand with proximal lymphangitic spread. Biopsy showed cigar-shaped yeast. What is the best empiric treatment?","c":[{"l":"a","x":"Amphotericin B","r":"Amphotericin B is reserved for severe or disseminated sporotrichosis."},{"l":"b","x":"Fluconazole","r":"The vignette is lymphocutaneous sporotrichosis. The lecture names itraconazole as the drug of choice for cutaneous and lymphocutaneous cases, and the 2028 key accepts fluconazole as the azole offered among the choices."},{"l":"c","x":"Griseofulvin","r":"Griseofulvin is an oral agent for dermatophytoses such as tinea capitis and tinea unguium. It has no role in subcutaneous mycoses."},{"l":"d","x":"Ketoconazole shampoo","r":"A topical shampoo formulation suits superficial conditions, not a subcutaneous infection spreading along lymphatics."}],"k":"B","w":[],"i":["Source note: MCB 2.07 lists itraconazole as the drug of choice and saturated potassium iodide as the older alternative. Fluconazole is keyed because it is the only systemic azole among the options."],"o":""},"2028-45":{"id":"2028-45","y":2028,"n":"45","p":11,"t":"T07","s":"Which of the following lesions mimic pyoderma gangrenosum which can mislead clinicians?","c":[{"l":"a","x":"Isolated cutaneous sporotrichosis","r":"Fixed (isolated) cutaneous sporotrichosis is a single localized ulcerated lesion that does not spread along lymphatics, so it can resemble the solitary ulcer of pyoderma gangrenosum."},{"l":"b","x":"Lymphocutaneous sporotrichosis","r":"This form gives multiple nodules arranged along draining lymphatic channels, a cord-like pattern unlike a solitary ulcer."},{"l":"c","x":"Mycetoma","r":"Mycetoma shows swelling, draining sinuses, and granules, usually on the foot."},{"l":"d","x":"Tinea barbae","r":"Tinea barbae is a dermatophyte infection of the beard and mustache area in adult males that often presents as an inflammatory lesion."}],"k":"A","w":[],"i":[],"o":""},"2028-46":{"id":"2028-46","y":2028,"n":"46","p":12,"t":"T07","s":"A patient presents with multiple draining sinuses and black granules on the foot. Biopsy confirms eumycetoma. Which of the following statements regarding treatment is true?","c":[{"l":"a","x":"Topical antifungal therapy is effective","r":"Mycetoma involves skin, subcutaneous tissue, fascia, and bone, so topical agents cannot reach it."},{"l":"b","x":"Long-term antifungal therapy and surgical excision are needed","r":"Treatment is difficult and prolonged, usually combining surgical excision or debridement with long-term antifungals such as itraconazole, ketoconazole, or amphotericin B chosen by causative species."},{"l":"c","x":"No antifungal therapy is needed","r":"Mycetoma does not resolve on its own. Untreated it progresses slowly to deformity and disability."},{"l":"d","x":"Oral terbinafine alone is sufficient","r":"Terbinafine is an oral agent for dermatophytosis. Monotherapy without surgery rarely cures eumycetoma."}],"k":"B","w":[],"i":[],"o":"","f":"MYCETOMA"},"2028-47":{"id":"2028-47","y":2028,"n":"47","p":12,"t":"T07","s":"A farmer presents with a well-demarcated, violaceous, cauliflower-like lesion with central scarring on his left shin. The lesion is not painful but is occasionally pruritic. The diagnosis confirms chromoblastomycosis. What is the most appropriate next step in management?","c":[{"l":"a","x":"Oral antihistamines for pruritus and a course of topical steroids to reduce inflammation.","r":"Antihistamines only relieve itch, and steroids suppress local immunity and can worsen the infection."},{"l":"b","x":"Observation only, as the lesion is chronic and not life-threatening.","r":"Untreated lesions keep expanding slowly and can become superinfected."},{"l":"c","x":"Initiation of HAART, assuming an underlying immunodeficiency.","r":"HAART is combination antiretroviral therapy for HIV infection. Chromoblastomycosis follows traumatic inoculation and does not imply HIV."},{"l":"d","x":"Long-term oral itraconazole combined with physical methods such as cryotherapy","r":"Surgical excision suits small localized lesions, while itraconazole or flucytosine is used for larger lesions. Physical methods such as local heat or cryotherapy are added to reduce fungal load."}],"k":"D","w":[],"i":[],"o":"","f":"CHROMO"},"2028-48":{"id":"2028-48","y":2028,"n":"48","p":12,"t":"T08","s":"On microscopic examination, cultured in SDA, which fungal pathogen is seen with tuberculate macroconidia with small microconidia?","c":[{"l":"a","x":"Candida albicans","r":"Candida albicans grows as budding yeast with pseudohyphae and is identified by germ tube formation. It forms no tuberculate macroconidia."},{"l":"b","x":"Coccidiodes immitis","r":"Coccidioides immitis grows as a mold with chains of arthroconidia separated by disjunctor cells at 25 to 30°C. In tissue at 37°C it forms large thick-walled spherules up to about 80 micrometers filled with endospores."},{"l":"c","x":"Cryptococcus neoformans","r":"Cryptococcus neoformans is an encapsulated yeast with a large polysaccharide capsule that shows as a clear halo on India ink. It causes chronic meningitis, mainly in immunocompromised hosts. It forms no conidia."},{"l":"d","x":"Histoplasma capsulatum","r":"Histoplasma capsulatum is a thermally dimorphic systemic fungus. The mold form shows large tuberculate macroconidia of 8 to 16 micrometers with small microconidia, and the 37°C form is a small oval yeast that grows inside macrophages and reticuloendothelial cells."}],"k":"D","w":[],"i":[],"o":"","f":"DIMORPH"},"2028-49":{"id":"2028-49","y":2028,"n":"49","p":12,"t":"T08","s":"A 2 year old child presents with white patches on the mouth showing budding spherical cells and hyphae on microscopy. What is the most likely etiologic agent?","c":[{"l":"a","x":"Aspergillus niger","r":"Aspergillus is a mold with hyaline septate hyphae branching at acute angles. It has no budding yeast form."},{"l":"b","x":"Candida albicans","r":"Oral thrush appears as patchy to confluent whitish pseudomembranous lesions on the tongue, lips, gums, or palate, made of epithelial cells, budding yeast, and pseudohyphae. Infant thrush can pass between mother and infant."},{"l":"c","x":"Corynebacterium diphtheriae","r":"Corynebacterium diphtheriae is a bacterium that forms a pharyngeal pseudomembrane. It would not show budding yeast cells on microscopy."},{"l":"d","x":"Rhizopus oryzae","r":"Rhizopus oryzae is an agent of mucormycosis with broad, ribbon-like, non-septate hyphae and no yeast form."}],"k":"B","w":[],"i":[],"o":"","f":"CANDIDA"},"2028-50":{"id":"2028-50","y":2028,"n":"50","p":12,"t":"T08","s":"s antifungal has an effect on Coccidioidal meningitis?","c":[{"l":"a","x":"Amphotericin B","r":"Amphotericin B is used for severe coccidioidomycosis. Per the 2028 rationale it must be given intrathecally for meningitis because systemic dosing does not reach adequate CSF levels."},{"l":"b","x":"Fluconazole","r":"Oral fluconazole is the treatment of choice for coccidioidal meningitis because of its good CNS penetration."},{"l":"c","x":"Flucytosine","r":"Flucytosine is a partner drug combined with amphotericin B for cryptococcal meningitis. It is not used alone for coccidioidal meningitis."},{"l":"d","x":"Trimethoprim-sulfamethoxazole","r":"Trimethoprim-sulfamethoxazole is an antibacterial folate-pathway combination, not an antifungal."}],"k":"B","w":["Extraction note: the first word or words of this stem are missing in the source PDF itself. The stem is shown exactly as printed."],"i":[],"o":""},"2028-51":{"id":"2028-51","y":2028,"n":"51","p":13,"t":"T08","s":"Which of the following is FALSE for Blastomyces dermatitidis at 37°C?","c":[{"l":"a","x":"Broad based","r":"Blastomyces dermatitidis at 37°C is a large, thick-walled, multinucleated spherical yeast of 8 to 15 micrometers that produces a single bud on a broad base. Broad-based budding is its signature."},{"l":"b","x":"Large single budding cell","r":"True of Blastomyces. Blastomyces dermatitidis at 37°C is a large, thick-walled, multinucleated spherical yeast of 8 to 15 micrometers that produces a single bud on a broad base."},{"l":"c","x":"Multiple budding cells resembling spokes of a helm or ship’s wheel","r":"Paracoccidioides brasiliensis at 36 to 37°C forms large yeast up to 30 micrometers with multiple buds attached by narrow connections, resembling the spokes of a ship's wheel. This describes Paracoccidioides, so it is the false statement for Blastomyces."},{"l":"d","x":"Thick wall, multinucleated spherical yeast cells (8-15 μm)","r":"True of Blastomyces. Blastomyces dermatitidis at 37°C is a large, thick-walled, multinucleated spherical yeast of 8 to 15 micrometers that produces a single bud on a broad base."}],"k":"C","w":[],"i":[],"o":"","f":"DIMORPH"},"2028-52":{"id":"2028-52","y":2028,"n":"52","p":13,"t":"T08","s":"A 58-year old male suffered from a facial infection, nasal necrosis with black discoloration. He is diagnosed with Zygomycosis. What is the causative agent?","c":[{"l":"a","x":"Coccidioides immitis","r":"Coccidioides immitis grows as a mold with chains of arthroconidia separated by disjunctor cells at 25 to 30°C. In tissue at 37°C it forms large thick-walled spherules up to about 80 micrometers filled with endospores."},{"l":"b","x":"Cryptococcosis neoformans","r":"Cryptococcus neoformans is an encapsulated yeast with a large polysaccharide capsule that shows as a clear halo on India ink. It causes chronic meningitis, mainly in immunocompromised hosts."},{"l":"c","x":"Pneumocystis jiroveci","r":"Pneumocystis jirovecii was once thought to be a protozoan and is now classified as a fungus. It is an extracellular pathogen with thin-walled trophozoites and thick-walled cysts holding four to eight nuclei, and it causes pneumonia with bilateral ground-glass opacities in immunocompromised patients, especially those with AIDS."},{"l":"d","x":"Rhyzopus oryzae","r":"Rhizopus oryzae is the leading agent of mucormycosis (zygomycosis). Angioinvasion causes thrombosis and necrosis with blackened tissue, the so-called black fungus, and rhinocerebral disease is tied to diabetes, ketoacidosis, and iron overload."}],"k":"D","w":[],"i":[],"o":""},"2028-53":{"id":"2028-53","y":2028,"n":"53","p":13,"t":"T08","s":"Which among the opportunistic fungal pathogens are mostly resistant to fluconazole that necessitates an alternative therapy?","c":[{"l":"a","x":"Candida albicans","r":"Candida albicans is the common agent of candidiasis, forming yeast, pseudohyphae, and true hyphae. It is not the azole-resistant species."},{"l":"b","x":"Candida glabarata","r":"Widespread fluconazole use selected azole-resistant species, namely C. glabrata, C. krusei, and C. lusitaniae. C. glabrata produces only yeast cells with no pseudohyphae. C. auris is the multidrug-resistant species."},{"l":"c","x":"Cryptococcosis neoformans","r":"Cryptococcus responds to azoles. Fluconazole is used for maintenance or suppressive therapy after amphotericin B plus flucytosine."},{"l":"d","x":"Pneumocystis jiroveci","r":"Pneumocystis jirovecii was once thought to be a protozoan and is now classified as a fungus. It is an extracellular pathogen with thin-walled trophozoites and thick-walled cysts holding four to eight nuclei, and it causes pneumonia with bilateral ground-glass opacities in immunocompromised patients, especially those with AIDS."}],"k":"B","w":[],"i":[],"o":""},"2028-54":{"id":"2028-54","y":2028,"n":"54","p":14,"t":"T08","s":"The following characteristics differentiates C. neoformans and C. Gatii from other cryptococcus species EXCEPT?","c":[{"l":"a","x":"Ability to grow at 37","r":"Growth at 37°C is a distinguishing trait of the pathogenic species and reflects their ability to infect humans."},{"l":"b","x":"Causes coccidiosis","r":"This is the exception. C. neoformans and C. gattii cause cryptococcosis. The printed term names a different disease."},{"l":"c","x":"Possesses large polysaccharide capsule","r":"The large polysaccharide capsule is their major virulence factor and protects against phagocytosis."},{"l":"d","x":"Production of laccases","r":"Laccase (phenol oxidase) catalyzes melanin formation from phenolic substrates, and melanin in the cell wall protects against oxidative stress."}],"k":"B","w":[],"i":[],"o":"","f":"CRYPTO"},"2028-55":{"id":"2028-55","y":2028,"n":"55","p":14,"t":"T08","s":"A 38-year-old male presented with a nonproductive cough and pneumonia. Microscopic examination revealed thin-walled trophozoites and thick-walled spherical cysts containing four to eight nuclei. What is the most probable organism?","c":[{"l":"a","x":"A. fumigatus","r":"Aspergillus fumigatus is a mold with hyaline septate hyphae about 4 micrometers wide that branch dichotomously at acute angles, with conidiophores ending in vesicles."},{"l":"b","x":"H. capsulatum","r":"Histoplasma capsulatum is a thermally dimorphic systemic fungus. The mold form shows large tuberculate macroconidia of 8 to 16 micrometers with small microconidia, and the 37°C form is a small oval yeast that grows inside macrophages and reticuloendothelial cells."},{"l":"c","x":"P. brasiliensis","r":"Paracoccidioides brasiliensis at 36 to 37°C forms large yeast up to 30 micrometers with multiple buds attached by narrow connections, resembling the spokes of a ship's wheel."},{"l":"d","x":"P. jiroveci","r":"Pneumocystis jirovecii was once thought to be a protozoan and is now classified as a fungus. It is an extracellular pathogen with thin-walled trophozoites and thick-walled cysts holding four to eight nuclei, and it causes pneumonia with bilateral ground-glass opacities in immunocompromised patients, especially those with AIDS. Cysts are shown with silver stain, toluidine blue, or calcofluor white."}],"k":"D","w":[],"i":[],"o":"","f":"PJP"},"2028-56":{"id":"2028-56","y":2028,"n":"56","p":14,"t":"T08","s":"What is the evade mechanism of Cryptococcus neoformans that allows it to resist the host immune response?","c":[{"l":"a","x":"Production of melanin to neutralize oxidative stress","r":"Laccase-derived melanin is a genuine virulence factor that resists oxidative stress, but it is not the keyed main evasion mechanism."},{"l":"b","x":"Inhibition of phagocytosis","r":"The polysaccharide capsule is antiphagocytic and interferes with immune clearance, letting the yeast survive and multiply in tissue, particularly the CNS."},{"l":"c","x":"Growth at 37C","r":"Growth at 37°C marks the pathogenic species but is a growth trait, not an immune evasion mechanism."},{"l":"d","x":"Production of urease to alter the host environment","r":"Urease is listed among Cryptococcus virulence factors and is used for identification in culture. It is not the keyed evasion mechanism."}],"k":"B","w":[],"i":[],"o":"","f":"CRYPTO"},"2028-57":{"id":"2028-57","y":2028,"n":"57","p":14,"t":"T08","s":"Biofilm, a key virulence factor, what mechanism does it use to evade the immune response?","c":[{"l":"a","x":"Binding to cell membrane receptors to inhibit phagocytosis","r":"Receptor binding describes attachment, as viruses do to enter cells. It is not how a biofilm protects fungi."},{"l":"b","x":"Degradation of host immune factors such as complement proteins","r":"Per the 2028 rationale, counteracting immune factors is a feature of other agents, such as adenovirus VA RNA blocking interferon. It is not the biofilm mechanism."},{"l":"c","x":"Formation of pseudohyphae making difficulty of phagocytosis by immune cells","r":"Pseudohyphae are hard to phagocytose and help build the biofilm, but the protection of a biofilm comes from its matrix."},{"l":"d","x":"Producing an extracellular matrix material that resists penetration by host immune response and antifungal drugs","r":"Fungal biofilm, formed by Candida on catheters, prosthetic valves, and mucosa, is an accumulation of yeast and pseudohyphae protected by extracellular matrix. The matrix resists penetration by host defenses and antifungal drugs, which makes the biofilm intractable."}],"k":"D","w":[],"i":[],"o":"","f":"BIOFILM"},"2028-58":{"id":"2028-58","y":2028,"n":"58","p":15,"t":"T08","s":"Which of the following characteristics is TRUE of Aspergillus species in tissue?","c":[{"l":"a","x":"Broad aseptate branching at 90 degrees","r":"Mucor and Rhizopus, the agents of mucormycosis, show broad, ribbon-like, non-septate hyphae branching at right angles, and they invade blood vessels."},{"l":"b","x":"Narrow septate branching at 45 degrees","r":"Aspergillus species in tissue are hyaline, septate, uniform hyphae about 4 micrometers wide that branch dichotomously at acute (45 degree) angles."},{"l":"c","x":"Nonseptate coenocytic hyphae","r":"Non-septate (coenocytic) hyphae again describe the Mucorales. Mucor and Rhizopus, the agents of mucormycosis, show broad, ribbon-like, non-septate hyphae branching at right angles, and they invade blood vessels."},{"l":"d","x":"Yeast-like budding","r":"Budding yeast describes Candida or Cryptococcus, not a mold such as Aspergillus."}],"k":"B","w":[],"i":[],"o":"","f":"ASPERG"},"2028-59":{"id":"2028-59","y":2028,"n":"59","p":15,"t":"T05","s":"What is the main public health measure against dengue in the Philippines?","c":[{"l":"a","x":"Immunization of humans","r":"Dengue vaccines exist (Dengvaxia, Qdenga) but the lecture notes no FDA-approved dengue vaccine in the Philippines, and Dengvaxia raises severe-dengue risk in people never infected before. Vaccination is not the main measure."},{"l":"b","x":"patient education","r":"Education on warning signs helps early admission but does not interrupt transmission."},{"l":"c","x":"vector control","r":"Control of Aedes mosquitoes is the main method: removing man-made breeding sites, covering and cleaning water containers weekly, insecticides, household protection, community mobilization, and vector surveillance."},{"l":"d","x":"vaccination of animal hosts","r":"Humans are the primary hosts in the urban dengue cycle, so there is no animal host to vaccinate."}],"k":"C","w":[],"i":[],"o":"","f":"AEDES"},"2028-60":{"id":"2028-60","y":2028,"n":"60","p":15,"t":"T05","s":"A 22 year old medical student had a 4 day fever, severe headache, vomiting, body weakness, and anorexia. WBC and platelet count are borderline low. If you suspect dengue infection, which is/are the appropriate test/s?","c":[{"l":"a","x":"Dengue NS1","r":"NS1 detects viral antigen and is best used early in illness, which fits day 4 of fever."},{"l":"b","x":"Dengue IgM","r":"IgM detects the patient's antibody and turns positive later in illness, after about 5 to 7 days, and it cross-reacts with other flaviviruses."},{"l":"c","x":"Dengue IgG","r":"IgG indicates previous or recent infection and its interpretation depends on timing, so it does not help on day 4."},{"l":"d","x":"Both A & C","r":"Pairs the correct early test with IgG, which is not useful at this stage."},{"l":"e","x":"All of the above","r":"Antibody tests are not yet reliable on day 4, so ordering all three is not the keyed answer."}],"k":"A","w":[],"i":[],"o":""},"2028-61":{"id":"2028-61","y":2028,"n":"61","p":16,"t":"T05","s":"Which of the following is primarily affected by the transmission cycle of yellow fever?","c":[{"l":"a","x":"Human & monkey","r":"Yellow fever has an urban cycle that primarily affects humans through Aedes aegypti and a jungle (sylvatic) cycle that primarily affects monkeys through Haemagogus and Aedes mosquitoes of the forest canopy."},{"l":"b","x":"Human & rodent","r":"Rodents are hosts of roboviruses such as hantavirus, not of yellow fever."},{"l":"c","x":"Pig & monkey","r":"Pigs are the amplifying host of Japanese encephalitis, not of yellow fever."},{"l":"d","x":"Pig & rodent","r":"Neither animal takes part in the yellow fever cycles."}],"k":"A","w":[],"i":[],"o":"","f":"YF"},"2028-62":{"id":"2028-62","y":2028,"n":"62","p":16,"t":"T05","s":"Which of the following epidemiologic characteristics of Arboviruses is TRUE?","c":[{"l":"a","x":"Humans are mainly dead end hosts","r":"Humans are dead-end hosts for Japanese encephalitis, West Nile, and St. Louis encephalitis because viremia is too low to infect another mosquito. The lecture lists dengue, urban yellow fever, Zika, and chikungunya as exceptions, so the statement does not hold for all arboviruses."},{"l":"b","x":"Maintained in nature by direct transmission from rodent to rodent","r":"This describes roboviruses such as hantavirus, which spread horizontally among rodents with no arthropod vector."},{"l":"c","x":"Transmission occurs by direct contact of bodily fluids and excretions","r":"Contact with body fluids or excreta is how rodent-borne viruses and filoviruses spread. Arboviruses need a blood-feeding arthropod."},{"l":"d","x":"The virus replicates in the tissue of arthropods without evidence of disease or damage","r":"Arboviruses multiply in the tissues of the arthropod vector without causing disease or damage, and the vector stays infected for life."}],"k":"D","w":["Source note: the MCB 2.05 summary states that humans are usually dead-end hosts for arboviruses, which makes choice A arguable. The printed 2028 key is D and is shown unchanged."],"i":[],"o":"","f":"DEADEND"},"2028-63":{"id":"2028-63","y":2028,"n":"63","p":16,"t":"T05","s":"What type of Arbovirus should be avoided during pregnancy due to its devastating effect on the fetus?","c":[{"l":"a","x":"Chikungunya","r":"Chikungunya is an Aedes-borne togavirus (alphavirus). Infected monocytes and macrophages carry it to the synovial tissue of joints, giving the severe and often prolonged or recurrent polyarthralgia that distinguishes it."},{"l":"b","x":"Dengue","r":"Dengue causes breakbone fever with arthralgia, myalgia, and rash, and can progress to hemorrhagic fever and shock."},{"l":"c","x":"Japanese encephalitis","r":"Japanese encephalitis is a flavivirus transmitted by Culex mosquitoes that breed in rice fields. Birds are reservoirs, pigs are the amplifying host, and humans are dead-end hosts who develop acute viral encephalitis."},{"l":"d","x":"Zika","r":"Zika is an Aedes-borne flavivirus causing rash, fever, arthralgia, and nonpurulent conjunctivitis. Its most serious complication is congenital Zika syndrome, where infection of fetal neural progenitor cells causes microcephaly and other malformations. In adults it is associated with Guillain-Barre syndrome."}],"k":"D","w":[],"i":[],"o":"","f":"ZIKA"},"2028-64":{"id":"2028-64","y":2028,"n":"64","p":16,"t":"T05","s":"Which of the following populations are most susceptible to Japanese encephalitis transmission?","c":[{"l":"a","x":"Commercial sex workers","r":"This is a risk group for sexually transmitted infections such as HSV-2 and hepatitis B, not for a mosquito-borne virus."},{"l":"b","x":"Farmers in rural agricultural areas, especially in rice production and flood irrigation","r":"Culex mosquitoes breed in rice fields, marshes, and standing water, and pigs amplify the virus nearby. People living and working in rice-farming areas have the most exposure."},{"l":"c","x":"Humid and semi humid savanna adjoining rainforest with large monkey population","r":"This is the setting of the intermediate (savannah) cycle of yellow fever, where monkeys and humans share the mosquito vector."},{"l":"d","x":"Residents in and traveling to Eastern Africa","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."}],"k":"B","w":[],"i":[],"o":"","f":"JE"},"2028-65":{"id":"2028-65","y":2028,"n":"65","p":16,"t":"T05","s":"Which arbovirus directly invades and replicates within joints and muscles causing prominent and prolonged arthralgia","c":[{"l":"a","x":"Chikungunya","r":"Chikungunya is an Aedes-borne togavirus (alphavirus). Infected monocytes and macrophages carry it to the synovial tissue of joints, giving the severe and often prolonged or recurrent polyarthralgia that distinguishes it."},{"l":"b","x":"Ebola","r":"Ebola is a filovirus, not an arbovirus. It has tropism for macrophages and dendritic cells and spreads by direct contact with blood or body fluids, causing hemorrhagic fever."},{"l":"c","x":"Japanese Encephalitis","r":"Japanese encephalitis is a flavivirus transmitted by Culex mosquitoes that breed in rice fields. Birds are reservoirs, pigs are the amplifying host, and humans are dead-end hosts who develop acute viral encephalitis."},{"l":"d","x":"Zika","r":"Zika is an Aedes-borne flavivirus causing rash, fever, arthralgia, and nonpurulent conjunctivitis. Its most serious complication is congenital Zika syndrome, where infection of fetal neural progenitor cells causes microcephaly and other malformations. In adults it is associated with Guillain-Barre syndrome."}],"k":"A","w":[],"i":[],"o":""},"2028-66":{"id":"2028-66","y":2028,"n":"66","p":17,"t":"T05","s":"Ebola virus outbreaks are diagnosed through","c":[{"l":"a","x":"ELISA","r":"ELISA detects antibodies or antigen and is one of the lecture's listed tests, but it is not the keyed outbreak method."},{"l":"b","x":"Immunofluorescence antibody","r":"Project-source note: The available project materials identify this choice but do not provide enough detail for a fuller study rationale."},{"l":"c","x":"Viral culture","r":"Patient specimens may hold virulent virus, so testing requires maximum biologic containment. That makes culture impractical in an outbreak."},{"l":"d","x":"RT-PCR","r":"RT-PCR detects viral RNA in blood during the acute phase and is the most commonly used method for rapid, definitive diagnosis."}],"k":"D","w":[],"i":[],"o":"","f":"FILO"},"2028-67":{"id":"2028-67","y":2028,"n":"67","p":17,"t":"T05","s":"What is the primary reservoir host of the virus causing Hantavirus Pulmonary Syndrome?","c":[{"l":"a","x":"Camel","r":"Dromedary camels are the intermediate host and source of human infection for MERS-CoV."},{"l":"b","x":"Deer mouse","r":"The deer mouse, Peromyscus maniculatus, is the primary rodent reservoir of Sin Nombre virus, the agent of hantavirus pulmonary syndrome. Humans are infected by aerosols of rodent urine, feces, or saliva."},{"l":"c","x":"Fruit bats","r":"Pteropus fruit bats are the reservoir of Nipah and Hendra viruses and the natural hosts of filoviruses."},{"l":"d","x":"Monkey","r":"Monkeys are the primary host in the jungle cycle of yellow fever."}],"k":"B","w":[],"i":[],"o":"","f":"HANTA"},"2028-68":{"id":"2028-68","y":2028,"n":"68","p":17,"t":"T09","s":"Which of the following statements best describes nosocomial infections?","c":[{"l":"a","x":"Bloodstream infections caused by contaminated IV fluids","r":"This is one example of a nosocomial infection, not the definition."},{"l":"b","x":"An infection present in the patient at the time of admission","r":"An infection present or incubating at admission is community-acquired by definition."},{"l":"c","x":"An infection not present or incubating at the time of admission","r":"Healthcare-associated (nosocomial) infections are infections acquired while receiving healthcare that were not present or incubating at admission. They appear 48 hours or more after admission and may also appear within 10 days after discharge."},{"l":"d","x":"An infection that occurs in an immunocompromised patient admitted in the hospital","r":"Immunosuppression is a risk factor, but nosocomial infections are not limited to immunocompromised patients."},{"l":"e","x":"Any infection acquired in the community","r":"This defines community-acquired infection, with onset under 48 hours from admission and usually drug-susceptible community strains."}],"k":"C","w":[],"i":[],"o":""},"2028-69":{"id":"2028-69","y":2028,"n":"69","p":17,"t":"T09","s":"Most common site of nosocomial infection","c":[{"l":"a","x":"Blood stream","r":"Central line-associated bloodstream infection is a device-associated HAI, but it is not the keyed most common site."},{"l":"b","x":"Central Nervous system","r":"The CNS is not among the major HAI categories in the lecture."},{"l":"c","x":"Respiratory tract","r":"Ventilator-associated and hospital-acquired pneumonia are major HAIs, most often from Pseudomonas aeruginosa."},{"l":"d","x":"Surgical site","r":"Surgical site infections are a device and procedure-associated HAI, caused by S. aureus, coagulase-negative staphylococci, E. coli, Enterococcus, and anaerobes."},{"l":"e","x":"Urinary tract","r":"The 2028 key names the urinary tract, with catheter-associated UTI as one of the most common HAIs. Risk rises with each catheter-day and E. coli is the most common cause."}],"k":"E","w":["Source note: MCB 2.09 states that pneumonia, mostly non-ventilator hospital-acquired pneumonia, is now the largest HAI category. The printed 2028 key is E (urinary tract) and is shown unchanged."],"i":[],"o":""},"2028-70":{"id":"2028-70","y":2028,"n":"70","p":17,"t":"T09","s":"Which organism is the leading cause of nosocomial pneumonia?","c":[{"l":"a","x":"E. coli","r":"E. coli is the most common cause of catheter-associated UTI and is also listed for surgical site infection."},{"l":"b","x":"Pseudomonas aeruginosa","r":"Pseudomonas aeruginosa is the most common cause of ventilator-associated pneumonia and events. It is problematic because of its innate antibiotic resistance and its presence in hospital water systems."},{"l":"c","x":"Klebsiella pneumoniae","r":"Klebsiella is listed among causes of CAUTI and VAP and is a transient-flora pathogen that may carry ESBL or carbapenemase, but it is not the leading cause."},{"l":"d","x":"Staphylococcus aureus","r":"S. aureus including MRSA is the second most common cause of VAP and a leading cause of surgical site infection."},{"l":"e","x":"Streptococcus pneumoniae","r":"A community pathogen. The lecture stresses that organisms of community-acquired and hospital-acquired pneumonia differ."}],"k":"B","w":[],"i":[],"o":""},"2028-71":{"id":"2028-71","y":2028,"n":"71","p":18,"t":"T09","s":"71. Standard precautions EXCEPT","c":[{"l":"A","x":"Hand hygiene","r":"Hand hygiene is the first element of standard precautions. Alcohol-based hand rub is the default, with soap and water when hands are visibly soiled or after C. difficile or norovirus."},{"l":"B","x":"Prophylaxis of antibiotics for healthcare workers","r":"Antibiotic prophylaxis is a specific preventive or therapeutic measure, not a universal infection control practice, so it is not part of standard precautions."},{"l":"C","x":"Proper handling of contaminated equipment","r":"Safe handling of patient-care equipment and textiles is a standard precaution element."},{"l":"D","x":"Safe injection practices","r":"Safe injection practice, one needle, one syringe, one time, is a standard precaution element."},{"l":"E","x":"Use of personal protective equipment if indicated","r":"Gloves, gown, mask, and eye protection used according to anticipated exposure are part of standard precautions."}],"k":"B","w":[],"i":[],"o":"","f":"STD"},"2028-72":{"id":"2028-72","y":2028,"n":"72","p":18,"t":"T09","s":"The Centers for Disease Control and Prevention CDC) defines healthcare-associated infections as","c":[{"l":"a","x":"At least 48 hours after admission","r":"Healthcare-associated (nosocomial) infections are infections acquired while receiving healthcare that were not present or incubating at admission. They appear 48 hours or more after admission and may also appear within 10 days after discharge."},{"l":"b","x":"Within 24 hours of admission","r":"Onset under 48 hours from admi
